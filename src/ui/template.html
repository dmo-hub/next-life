<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกิดใหม่ทั้งที ชาตินี้ขอชิงมาเกิด · Next Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pridi:wght@400;600&family=Sarabun:wght@400;600&family=Srisakdi:wght@400;700&display=swap">
<style>
/* สีมาจากต้นแบบการ์ด (ใบ 06) — ทาง A ทะเบียนราษฎร์ · ทาง B ลายรดน้ำ · ไม่สลับตามโหมดมืดเพราะสีเป็นตัวบอกแนวการ์ด */
:root {
  --page:#DCD6CB; --ink:#1F2430; --ink2:#3A3F4B; --muted:#4A4F5C;
  --paper:#F4EFE3; --paper2:#E9E1CF; --rule:#B9AE97; --rule2:#CFC4AD; --red:#A23B2C; --green:#2F6B66; --blue:#35558A;
  --lacquer:#17110D; --lacquer2:#221912; --gold:#D9B45A; --gold2:#F0D78C; --cream:#EFE3C2; --bronze:#5A4630; --bronze2:#8A6D3B; --sand:#BFAE86;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.6 Sarabun,"Noto Sans Thai",system-ui,sans-serif; }
.logo { background:var(--lacquer); text-align:center; padding:10px 16px 6px; border-bottom:1px solid var(--bronze); }
.logo b { font-family:Srisakdi,serif; font-weight:700; font-size:34px; line-height:1.2; color:var(--gold); }
.logo b span { display:inline-block; }
.logo small { display:block; font-size:12px; letter-spacing:0.12em; color:var(--sand); }
.logo .ver { display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid var(--bronze); border-radius:999px; font-size:11px; font-weight:600; color:var(--sand); white-space:nowrap; }
.logo .saved { display:inline-block; margin:4px 0 0 6px; font-size:11px; color:var(--sand); white-space:nowrap; }
.logo .saved:not(:empty)::before { content:'\25CF  '; color:#7FC4B8; }
.logo .saved.off::before { color:#E07A5F; }
#app { max-width:460px; margin:0 auto; padding:20px 16px 16px; }
/* ป้ายเกมไม่ใช่คำแนะนำการลงทุน (ใบ 11) อยู่ทุกหน้าจอ ไม่ใช่แค่การ์ดจัดสรรเงิน */
.foot { max-width:460px; margin:0 auto; padding:0 16px 40px; font-size:12px; color:var(--muted); text-align:center; }
.foot a { color:var(--muted); display:inline-block; min-height:44px; line-height:44px; }
.card { display:flex; flex-direction:column; min-height:560px; }
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; }
.top small { font-size:12px; letter-spacing:0.04em; text-align:right; }
/* รูปตัวละคร (B56): วงกลมมุมซ้ายหัวการ์ด · clip-path ตัดเสื้อที่ยื่นเลยวงกลม (ภาพแชร์ตัดด้วย arc แบบเดียวกัน) */
.av { flex:none; display:block; width:40px; height:40px; clip-path:circle(50%); }
/* หัวการ์ดแถวเดียวต้องสูงเท่าเดิม 55px (A13): margin ติดลบให้รูปล้นเข้า padding แทนดันหัวให้สูง · gap ข้างรูปแคบกว่า gap หัวการ์ด ให้ตัวอายุมีที่ไม่ตกบรรทัด */
.top .av { width:32px; height:32px; margin:-3px -6px -3px 0; }
.top .av + b { flex:1; min-width:0; }
.grow { display:flex; align-items:center; gap:10px; font-weight:600; }
.grow .av { width:56px; height:56px; }
/* แผ่นภาพยุค: รักดำ+ทองทุกธีม (สีอยู่ในตัวภาพ) — ธีมสว่างจึงเป็นแผ่นเข้มบนพื้นขาวเหมือนกรอบภาพ */
.era-art { display:block; width:100%; height:auto; aspect-ratio:5 / 2; }
.top .same { margin-left:8px; padding:1px 6px; border:1px solid currentColor; border-radius:3px; font:400 11px/1.4 Sarabun,"Noto Sans Thai",system-ui,sans-serif; white-space:nowrap; opacity:0.85; vertical-align:2px; }
.stats { display:flex; gap:10px; padding:12px 20px; font-size:12px; }
.stats > div { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.bar { position:relative; height:6px; }
.bar i { position:absolute; left:0; top:0; display:block; height:6px; }
.bar b { position:absolute; top:-3px; width:2px; height:12px; margin-left:-1px; }
.meta { padding:0 20px 8px; font-size:12px; }
.meta span { white-space:nowrap; }
.tree, .family { padding:0 20px 8px; font-size:12px; }
.tree summary, .family summary { cursor:pointer; }
.tree .picks, .family .picks { font-size:12px; }
.family li.gone { opacity:0.55; }
.stat-help { padding:0 20px; font-size:12px; color:var(--muted); }
.stat-help summary { cursor:pointer; min-height:36px; display:flex; align-items:center; text-decoration:underline; text-underline-offset:2px; }
.stat-help dl { margin:0 0 10px; display:grid; grid-template-columns:auto minmax(0, 1fr); gap:6px 12px; }
.stat-help dt { font-weight:600; color:var(--ink2); white-space:nowrap; }
.stat-help dd { margin:0; color:var(--ink2); }
.body { padding:18px 20px 8px; display:flex; flex-direction:column; gap:8px; }
.body h3 { margin:0; font-size:24px; line-height:1.35; }
.body h3.lead { font-size:19px; font-weight:400; }
.body p { margin:0; font-size:15px; }
.kicker { font-size:12px; font-weight:600; letter-spacing:0.06em; }
.body p.news { margin:0; padding-left:10px; border-left:2px solid currentColor; font-size:14px; opacity:0.8; }
.items, .picks { margin:0; padding-left:20px; font-size:14px; }
.body .sub { font-size:14px; }
.body .note { font-size:12px; }
.body .horo { font-family:Pridi,serif; font-size:14px; margin-top:-4px; }
.spark { display:block; width:100%; height:auto; }
.spark polyline { fill:none; stroke-width:2; stroke-linejoin:round; }
.spark .grid { stroke-width:1; stroke-dasharray:2 3; }
.spark .zero { stroke-width:1.2; }
.spark text { font-size:10px; font-family:Sarabun,sans-serif; }
.spark .ty { text-anchor:end; }
.spark .tb { font-size:9px; }
.spark.life polyline { stroke-width:1.8; }
.lifechart { display:flex; flex-direction:column; gap:6px; padding:12px; }
.lifechart .h { font-size:13px; font-weight:600; }
.legend { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; }
.legend li { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.legend .key { width:24px; height:8px; }
.legend .key line { stroke-width:2; }
.spark .mk { cursor:pointer; outline:none; }
.spark .mk circle { stroke-width:1.5; }
.spark .mk:focus-visible circle, .spark .mk:hover circle { stroke-width:3; }
.mk-cap { margin:0; font-size:12px; min-height:1.5em; overflow-wrap:anywhere; }
.a .spark .mk.ev circle { fill:var(--paper); stroke:var(--ink2); } .a .spark .mk.death circle { fill:var(--red); stroke:var(--ink); }
.a .mk-cap { color:var(--muted); }
.choices { padding:8px 20px 20px; display:flex; flex-direction:column; gap:10px; margin-top:auto; }
.choice { all:unset; box-sizing:border-box; min-height:52px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; font-size:15px; }
.choice .fx { font-size:12px; text-align:right; flex-shrink:0; max-width:50%; }
.choice .fx span { white-space:nowrap; }
/* text-indent สืบทอดจากย่อหน้าแขวนของจอกว้าง — ต้องคืนเป็น 0 ไม่งั้นบรรทัดรองมุดไปใต้เลขปุ่มลัด */
.choice .hint { display:block; text-indent:0; margin-top:3px; font-size:12.5px; line-height:1.45; opacity:0.75; }
/* เลขปุ่มลัดเฉพาะจอกว้าง — มือถือไม่มีแป้นเลข เลขจะกินที่ป้ายตัวเลือกเปล่า ๆ */
@media (min-width:768px) {
  /* ย่อหน้าแขวน: ป้ายยาวตัดบรรทัดแล้วบรรทัดสองตรงกับข้อความ ไม่มุดใต้เลข · 38px = กรอบเลข 28 + ช่องไฟ 10 */
  .choice > span[data-key] { padding-left:38px; text-indent:-38px; }
  .choice > span[data-key]::before { content:attr(data-key); display:inline-block; box-sizing:border-box; width:28px; text-indent:0; margin-right:10px; border:1px solid currentColor; border-radius:3px; font-size:12px; line-height:18px; text-align:center; opacity:0.7; }
}
.recap { display:flex; flex-direction:column; gap:8px; padding:12px; }
.recap .h { font-size:13px; font-weight:600; }
.recap .picks { overflow-wrap:anywhere; }
/* แผงพับบนมรณบัตร: summary คงเป็น list-item ให้ลูกศรพับ/เปิดยังขึ้น (flex ทำลูกศรหาย)
   · margin ติดลบกิน padding 12px ของกรอบแผง — พับแล้วกรอบสูง 44px เท่าพื้นที่แตะ ไม่ซ้อน padding สองชั้น */
.fold > summary { cursor:pointer; padding:12px 0; margin:-12px 0; font-size:13px; font-weight:600; line-height:20px; }
.fold-in { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.all-picks summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-size:13px; font-weight:600; }
.delta { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px 14px; font-size:12px; }
.delta > div { display:flex; flex-direction:column; gap:4px; }
.titles .pattern { font-family:Pridi,serif; font-weight:600; font-size:20px; }
.titles .more, .memo .more, .warn .more { all:unset; align-self:flex-start; min-height:44px; cursor:pointer; font-size:14px; font-weight:600; text-decoration:underline; }
.titles .more:focus-visible, .memo .more:focus-visible, .warn .more:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.book { font-size:13px; }
.book summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; }
.book .h { margin-top:8px; }
.book .picks { font-size:13px; overflow-wrap:anywhere; }
.memo { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.memo li { display:flex; align-items:center; justify-content:space-between; gap:8px; overflow-wrap:anywhere; }
.memo li .more { flex:none; }
/* บันทึกชีวิต (B39) — ช่องพิมพ์ 16px กัน iOS ซูมหน้าตอนแตะ · ปุ่มบันทึก/ข้ามกว้างเท่ากัน */
.note-sheet { display:flex; flex-direction:column; gap:8px; padding:12px; }
.note-sheet .h { font-size:13px; font-weight:600; }
.note-sheet .q { font-size:15px; overflow-wrap:anywhere; }
.note-sheet input { font:inherit; font-size:16px; width:100%; min-width:0; min-height:44px; padding:8px 12px; border-radius:0; }
.note-sheet .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.note-sheet .choice { justify-content:center; }
.life-note { margin:0; padding:8px 12px; display:flex; flex-direction:column; gap:2px; overflow-wrap:anywhere; }
.life-note small { font-size:12px; }
.life-note p { font-family:Pridi,serif; }
.a .note-sheet { border:1px solid var(--rule); background:#FBF7EE; }
.a .note-sheet .h { color:var(--red); } .a .note-sheet .q { color:var(--ink2); }
.a .note-sheet input { border:1px solid var(--ink2); background:#FFFDF7; color:var(--ink); }
.a .note-sheet input:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
.a .life-note { border-left:3px solid var(--red); background:#FBF7EE; } .a .life-note small { color:var(--muted); }
/* สมุดชีวิต (B48) — หน้าก่อน/ข้ามกว้างเท่ากันใต้ปุ่มพลิกหน้า · ตัวเลือกที่กดเป็นตัวหนังสือเอียงแยกจากเนื้อเรื่อง */
.lifebook .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.lifebook .row .choice { justify-content:center; }
.lifebook .body .pick { font-family:Pridi,serif; font-size:15px; padding-left:10px; border-left:2px solid currentColor; }
.lifebook .body .dates { margin-top:-6px; font-size:14px; }
.stamp { align-self:flex-start; font-family:Pridi,serif; font-weight:600; padding:4px 10px; transform:rotate(-3deg); font-size:16px; }

/* ทาง A — ทะเบียนราษฎร์: กระดาษ หมึก ตราประทับแดง */
.a { background:var(--paper); border:1px solid #C9BFA9; color:var(--ink); }
.a .top { background:var(--ink); color:var(--paper); }
.a .top b { font-family:Pridi,serif; font-size:16px; font-weight:600; }
.a .stats { border-bottom:1px dashed var(--rule); color:var(--muted); }
.a .meta { color:var(--muted); padding-top:8px; }
.a .bar { background:#E2D9C6; } .a .bar i { background:var(--green); } .a .bar b { background:var(--red); }
.a .kicker { color:var(--red); }
.a .body h3 { font-family:Pridi,serif; font-weight:600; }
.a .body h3.lead { font-family:Sarabun,sans-serif; }
.a .body p, .a .items, .a .picks { color:var(--ink2); }
.a .sub, .a .note, .a .body .horo { color:var(--muted); }
.a .spark .nom { stroke:var(--green); } .a .spark .dot { fill:var(--green); }
.a .spark .grid { stroke:var(--rule2); } .a .spark .zero { stroke:var(--ink2); }
.a .spark .neg { fill:var(--red); fill-opacity:0.08; }
.a .spark text { fill:var(--muted); }
.a .band0 { fill:var(--paper2); fill-opacity:0.55; } .a .band1 { fill:transparent; }
.a .ln0 { stroke:var(--red); } .a .ln1 { stroke:var(--bronze2); } .a .ln2 { stroke:var(--blue); } .a .ln3 { stroke:var(--green); } .a .ln4 { stroke:var(--ink); }
.a .lifechart { border:1px solid var(--rule); background:#FBF7EE; }
.b .band0 { fill:var(--bronze); fill-opacity:0.25; } .b .band1 { fill:transparent; }
.b .ln0 { stroke:#E07A5F; } .b .ln1 { stroke:var(--gold); } .b .ln2 { stroke:#8FB3E0; } .b .ln3 { stroke:#7FC4B8; } .b .ln4 { stroke:var(--cream); }
.b .lifechart { border:1px solid var(--bronze); background:var(--lacquer2); }
/* กราฟฐานะตระกูล (B95): ขาลงเส้นประ + สีแดง ขาขึ้นเส้นทึบ — ตาบอดสีก็ยังแยกได้ · ขึ้นได้ทั้งการ์ดทาง A ทาง B และปรโลก */
.stand-d .lifechart { margin-top:6px; }
/* แถบชีวิตสด (B53): อยู่บนการ์ดทุกใบ จึงต้องเตี้ย — บรรทัดเรื่องไม่จองที่จนกว่าจะแตะหมุด */
.strip-d .spark.strip { margin-top:4px; }
.spark.strip polyline { stroke-width:1.6; }
.strip-d .legend { display:inline-flex; margin-left:12px; vertical-align:middle; font-size:11px; }
.strip-d .mk-cap { min-height:0; }
.strip-d .mk-cap:empty { display:none; }
.spark .sg { stroke-width:2.2; stroke-linecap:round; } .spark .sg.sd { stroke-dasharray:5 3; } .spark .sg.se { stroke-width:1.6; }
.legend .key .sg { stroke-width:2; }
.a .sg.su { stroke:var(--green); } .a .sg.sd { stroke:var(--red); } .a .sg.se { stroke:var(--ink2); }
.a .spark .mk.broke rect { fill:var(--red); stroke:var(--ink); stroke-width:1.5; } .a .spark .mk.nx circle { fill:var(--paper); stroke:var(--ink); stroke-dasharray:2 1.5; }
.a .legend .mk.broke rect { fill:var(--red); stroke:var(--ink); stroke-width:1; }
.b .sg.su { stroke:var(--gold2); } .b .sg.sd { stroke:#E39A8A; } .b .sg.se { stroke:var(--sand); }
.b .spark text, .b .mk-cap, .b .lifechart .h { fill:var(--sand); color:var(--sand); } .b .spark .grid { stroke:var(--bronze2); }
.b .spark .mk.ev circle { fill:var(--lacquer); stroke:var(--gold2); } .b .spark .mk.nx circle { fill:var(--lacquer); stroke:var(--cream); stroke-dasharray:2 1.5; }
.b .spark .mk.broke rect, .b .legend .mk.broke rect { fill:#E39A8A; stroke:var(--cream); stroke-width:1.5; }
.a .choice { border:1px solid var(--ink); background:#FFFDF7; }
.a .choice:hover, .a .choice:focus-visible { background:var(--ink); color:var(--paper); outline:none; }
.a .choice .fx { color:var(--green); } .a .choice:hover .fx, .a .choice:focus-visible .fx { color:#CFE3E0; }
.a .stamp { border:2px solid var(--red); color:var(--red); }
.a .recap { border:1px solid var(--rule); background:#FBF7EE; }

/* ทาง B — ลายรดน้ำ: พื้นรักดำ ทองคำเปลว */
.b { background:var(--lacquer); color:var(--cream); border:1px solid var(--bronze); }
.b .top { border-bottom:1px solid var(--bronze); }
.b .top b { font-family:Srisakdi,serif; font-size:20px; color:var(--gold); font-weight:700; }
.b .top small, .b .stats, .b .meta, .b .sub, .b .note { color:var(--sand); }
.b .stat-help, .b .stat-help dd { color:var(--sand); } .b .stat-help dt { color:var(--cream); }
.b .bar { background:#3A2C1F; } .b .bar i { background:var(--gold); } .b .bar b { background:var(--cream); }
.b .kicker { color:var(--gold); letter-spacing:0.08em; }
.b .body h3 { font-family:Srisakdi,serif; font-weight:700; color:var(--gold2); font-size:28px; }
.b .body h3.lead { font-family:Sarabun,sans-serif; font-weight:400; font-size:19px; color:var(--cream); }
.b .body p { color:#E3D6B3; }
.b .choice { border:1px solid var(--bronze2); background:var(--lacquer2); color:var(--cream); }
.b .choice:hover, .b .choice:focus-visible { border-color:var(--gold); background:#2E2218; outline:none; }
.b .choice .fx { color:var(--gold); }
.b .picks, .b .tree summary, .b .family summary { color:#E3D6B3; }
.b .recap { border:1px solid var(--bronze); background:var(--lacquer2); }
.b .recap .h { color:var(--gold); }
.scene { height:96px; background:var(--lacquer2); border-bottom:1px solid var(--bronze); }
.scene svg { display:block; width:100%; height:100%; }
.scale { display:flex; gap:12px; }
.scale > div { flex:1; min-width:0; border:1px solid var(--bronze); padding:10px; display:flex; flex-direction:column; gap:4px; font-size:13px; overflow-wrap:anywhere; }
.scale > div.heavy { border-color:var(--gold); }
.scale b { color:var(--gold2); font-family:Srisakdi,serif; font-size:18px; }
.scale .sum { font-size:15px; font-weight:600; color:var(--cream); }
.deeds { display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--bronze); padding-top:8px; }
.deed { margin:0; display:flex; flex-direction:column; gap:2px; font-size:13px; overflow-wrap:anywhere; color:#E3D6B3; }
.deed b { color:var(--gold2); font-size:12px; }
.deed.bad b { color:#E39A8A; }
/* มรณบัตร — หนังสืองานศพ (B83b D3 ทาง B): ขาวดำ กรอบหนา รูปกลางใบ · กราฟกับสรุปข้างในคงสีทาง A */
.a.mem { background:#FFFFFF; border:12px solid #1F1F1F; outline:1px solid #8A8A8A; outline-offset:-6px; color:#1F1F1F; }
.mem .top { background:transparent; color:#1F1F1F; justify-content:center; padding-top:18px; }
.mem .top b { font-family:Srisakdi,serif; font-size:22px; font-weight:700; }
.por { align-self:center; width:84px; height:96px; border:1px solid #1F1F1F; padding:4px; shape-rendering:crispEdges; }
.mem .body > h3, .mem .body > .dates { text-align:center; }
.mem .body h3 { font-family:Srisakdi,serif; font-size:30px; font-weight:700; color:#1F1F1F; }
.mem .body .dates { margin-top:-6px; }
.mem .choice { border-color:#1F1F1F; }
