<title>เกิดใหม่ทั้งที ชาตินี้ขอชิงมาเกิด · Next Life</title>
<style>
/*__FONTS__*/
/* สีมาจากต้นแบบการ์ด (ใบ 06) — ทาง A ทะเบียนราษฎร์ · ทาง B ลายรดน้ำ · ไม่สลับตามโหมดมืดเพราะสีเป็นตัวบอกแนวการ์ด */
/* ui-redo ใบ 02 (เจ้าของเคาะ): ชุดสี A กระดาษ · แถบค่า --fl · สีเน้น --red · Noto Sans Thai หัว/เนื้อ 16px · มุม 10 (การ์ด 15 · ชิป/ปุ่มเลขกลม) · เงาบาง
   · การ์ดกว้างสุด 800 · ขอบรอบการ์ด 36 บนล่าง 32 ข้าง ค่าเดียวทุกจอ (ต้นแบบ tweak.html) */
:root {
  --page:#E4DDCF; --ink:#1F2430; --ink2:#3A3F4B; --muted:#4A4F5C;
  --paper:#F7F2E7; --paper2:#E9E1CF; --rule:#B9AE97; --rule2:#CFC4AD; --red:#B73824; --green:#2F6B66; --blue:#35558A;
  --lacquer:#17110D; --lacquer2:#221912; --gold:#D9B45A; --gold2:#F0D78C; --cream:#EFE3C2; --bronze:#5A4630; --bronze2:#8A6D3B; --sand:#BFAE86;
  --fl:#015EC1; --dg:#B3261E; --track:#E2D9C6;
  --ft:"Noto Sans Thai",system-ui,sans-serif;
  --r:10px; --rk:15px; --rc:999px; --sh:0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .08);
  --cw:800px; --pad-y:36px; --pad-x:32px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.6 var(--ft); }
/* viewport-fit=cover ให้ env(safe-area-inset-*) มีค่า แต่หน้าก็ลามใต้รอยบาก/แถบโฮม — ทุกขอบที่ติดจอต้องกันเอง */
.logo { background:var(--lacquer); text-align:center; padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); border-bottom:1px solid var(--bronze); }
.logo b { font-family:Srisakdi,serif; font-weight:700; font-size:34px; line-height:1.2; color:var(--gold); }
.logo b span { display:inline-block; }
.logo small { display:block; font-size:12px; letter-spacing:0.12em; color:var(--sand); }
.logo .ver { text-decoration:none; display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid var(--bronze); border-radius:999px; font-size:11px; font-weight:600; color:var(--sand); white-space:nowrap; }
.logo a.ver:hover, .logo a.ver:focus-visible { text-decoration:underline; outline:none; }
.logo .saved { display:inline-block; margin:4px 0 0 6px; font-size:11px; color:var(--sand); white-space:nowrap; }
.logo .saved:not(:empty)::before { content:'\25CF  '; color:#7FC4B8; }
.logo .saved.off::before { color:#E07A5F; }
#app { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:var(--pad-y) max(var(--pad-x), env(safe-area-inset-right)) var(--pad-y) max(var(--pad-x), env(safe-area-inset-left)); }
/* ป้ายเกมไม่ใช่คำแนะนำการลงทุน (ใบ 11) อยู่ทุกหน้าจอ ไม่ใช่แค่การ์ดจัดสรรเงิน */
.foot { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(var(--pad-x), env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad-x), env(safe-area-inset-left)); font-size:12px; color:var(--muted); text-align:center; }
.foot a { color:var(--muted); display:inline-block; min-height:44px; line-height:44px; }
/* ปุ่มอยู่ท้ายการ์ด (margin-top:auto) — การ์ดสูงตายตัว 560 บนจอเตี้ยดันปุ่มของการ์ดเนื้อสั้นลงใต้แถบเบราว์เซอร์
   · เพดานตามความสูงจอหักหัวเว็บ+ระยะบน (--chrome) · svh = จอตอนแถบเบราว์เซอร์โผล่ ไม่ยืดหดตามการเลื่อนแบบ dvh ปุ่มจึงไม่กระโดดระหว่างเลื่อน */
:root { --chrome:136px; }
.card { display:flex; flex-direction:column; border-radius:var(--rk); box-shadow:var(--sh); min-height:560px; min-height:min(560px, calc(100vh - var(--chrome))); min-height:min(560px, calc(100svh - var(--chrome) - env(safe-area-inset-bottom))); }
/* ข้อความสำหรับโปรแกรมอ่านจอเท่านั้น */
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
/* จุดแดง "ใหม่" (B116): ชั้นสมุด · แท็บในชั้นสมุด · แผงฉายา/เหตุการณ์ — ป้ายอ่านจอบอกความหมายแทนสี */
.new-dot { display:inline-block; width:8px; height:8px; margin-left:6px; border-radius:50%; background:var(--red); vertical-align:middle; flex:none; }
.new-tag { margin-left:6px; padding:0 5px; border:1px solid var(--red); border-radius:3px; color:var(--red); font-size:11px; font-weight:600; white-space:nowrap; }
/* .body/.choices ตั้ง display:flex ทับ hidden ของเบราว์เซอร์ — การ์ดที่พับไว้ (B117) ต้องหายจริง */
.card [hidden] { display:none !important; }
/* กล่องกระซิบ (B117): เส้นประ ตัวเอียง แยกจากเนื้อเรื่องของการ์ด · ปุ่มเป็นลิงก์เล็ก ไม่ปนกับตัวเลือกของเกม */
.whisper { margin-top:4px; padding:8px 12px; border:1px dashed var(--rule); border-radius:var(--r); background:#FBF7EE; display:flex; flex-direction:column; gap:4px; }
.whisper .h { font-size:12px; font-weight:600; color:var(--red); }
.whisper p { font-family:var(--ft); font-size:14px; color:var(--ink2); }
.whisper-row { display:flex; flex-wrap:wrap; gap:0 16px; }
.whisper .more, .choices .later { all:unset; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:2px; }
.choices .later { align-self:flex-start; }
.whisper .more:focus-visible, .choices .later:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.choices.folded { margin-top:0; }
.choices.folded .note { margin:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; }
.top small { font-size:12px; letter-spacing:0.04em; text-align:right; }
/* รูปตัวละคร (B56): วงกลมมุมซ้ายหัวการ์ด · clip-path ตัดเสื้อที่ยื่นเลยวงกลม (ภาพแชร์ตัดด้วย arc แบบเดียวกัน) */
.av { flex:none; display:block; width:40px; height:40px; clip-path:circle(50%); }
/* หัวการ์ดแถวเดียวต้องสูงเท่าเดิม 55px (A13): margin ติดลบให้รูปล้นเข้า padding แทนดันหัวให้สูง · gap ข้างรูปแคบกว่า gap หัวการ์ด ให้ตัวอายุมีที่ไม่ตกบรรทัด */
.top .av { width:32px; height:32px; margin:-3px -6px -3px 0; }
.top .av + b { flex:1; min-width:0; }
.grow { display:flex; align-items:center; gap:10px; font-weight:600; }
.grow .av { width:56px; height:56px; }
/* แผ่นภาพยุค: รักดำ+ทองทุกธีม (สีอยู่ในตัวภาพ) — ธีมสว่างจึงเป็นแผ่นเข้มบนพื้นขาวเหมือนกรอบภาพ */
.era-art { display:block; width:100%; height:auto; aspect-ratio:5 / 2; }
/* ภาพฉากบนการ์ดแรกเกิด/การ์ดตาย: เล็กพอให้ปุ่มไปต่ออยู่จอแรก */
.era-art.scene-sm { width:min(100%, 150px); margin:0 auto 6px; }
.same { margin-left:8px; padding:1px 6px; border:1px solid currentColor; border-radius:var(--rc); font:400 11px/1.4 var(--ft); white-space:nowrap; opacity:0.85; vertical-align:2px; }

/* แถบสถานะสองแถว (ui-redo ใบ 03): แถวบน อวตาร · ชื่อ+ที่ · อายุ · แถวล่าง ค่า 4 ตัว
   · ชื่อค่ายาวบนจอแคบให้ตัวเลขตกบรรทัดแทนตัดชื่อ — แถบชิดล่างทุกช่องจึงยังอยู่แนวเดียวกัน */
.sb { padding:12px 20px; border-bottom:1px solid var(--rule2); border-radius:var(--rk) var(--rk) 0 0; }

/* ใกล้ตาย: ขอบจอแดงทั้งจอ ผูกกับแถบสถานะด้วย :has จึงหายเองเมื่อการ์ดถัดไปไม่ใกล้ตาย · ไม่มีภาพเคลื่อนไหว */
body:has(.sb.dying)::after { content:''; position:fixed; inset:0; z-index:9; pointer-events:none; box-shadow:inset 0 0 0 3px var(--dg), inset 0 0 60px rgb(220 40 30 / .5); }

.delta .num { font-weight:700; font-variant-numeric:tabular-nums; }
.meta { padding:0 20px 8px; font-size:12px; }
.meta span { white-space:nowrap; }

.tree .picks { font-size:12px; }
/* ปุ่มโฟกัสชีวิต (B163): ชื่อโฟกัสกับทิศผลตัดบรรทัดได้ ป้าย "เปลี่ยน" ชิดขวาไม่ตกบรรทัด */
.focus { padding:0 20px 8px; font-size:12px; }
.focus button { all:unset; box-sizing:border-box; width:100%; min-height:44px; display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:6px 10px; border:1px solid color-mix(in srgb, currentColor 35%, transparent); border-radius:var(--r); cursor:pointer; overflow-wrap:anywhere; }
.focus button:focus-visible { outline:2px solid currentColor; outline-offset:2px; }

.focus-pick[hidden] { display:none; }
.focus-pick .on { border-style:solid; border-color:currentColor; font-weight:600; }
/* แถบเมนูล่าง (ui-redo ใบ 04): ติดขอบล่างจอ กว้างเท่าการ์ด · หน้าเว้นท้ายเท่าความสูงแถบ ท้ายการ์ดจึงไม่ถูกบัง */
:root { --nav-h:60px; }
body:has(.mnav) { padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); }
.mnav { position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); background:var(--paper); border-top:1px solid var(--rule2); box-shadow:0 -4px 16px rgb(0 0 0 / .06); }

.mnav button { position:relative; }

.sheet { position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index:8; max-width:calc(var(--cw) + 2 * var(--pad-x)); max-height:calc(100svh - var(--nav-h) - env(safe-area-inset-bottom) - 24px); margin:0 auto; overflow:auto; overscroll-behavior:contain; padding:0 20px 16px; background:var(--paper); border-radius:var(--rk) var(--rk) 0 0; box-shadow:0 -8px 32px rgb(0 0 0 / .18); }

.spark { display:block; width:100%; height:auto; }

.spark .grid { stroke-width:1; stroke-dasharray:2 3; }
.spark .zero { stroke-width:1.2; }
.spark text { font-size:10px; font-family:var(--ft); }
.spark .ty { text-anchor:end; }
.spark .tb { font-size:9px; }
.spark.life polyline { stroke-width:1.8; }
.lifechart { display:flex; flex-direction:column; gap:6px; padding:12px; }
.lifechart .h { font-size:13px; font-weight:600; }
.legend { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; }
.legend li { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.legend .key { width:24px; height:8px; }
.legend .key line { stroke-width:2; }
.spark .mk { cursor:pointer; outline:none; }
.spark .mk circle { stroke-width:1.5; }
.spark .mk:focus-visible circle, .spark .mk:hover circle { stroke-width:3; }
.mk-cap { margin:0; font-size:12px; min-height:1.5em; overflow-wrap:anywhere; }
.a .spark .mk.ev circle { fill:var(--paper); stroke:var(--ink2); } .a .spark .mk.death circle { fill:var(--red); stroke:var(--ink); }
.a .mk-cap { color:var(--muted); }
.spark.echo path { fill:none; stroke-width:1.5; } .spark.echo path.hit { stroke:transparent; stroke-width:12; }
.spark .mk.arc:focus-visible path:not(.hit), .spark .mk.arc:hover path:not(.hit) { stroke-width:3; }
.echo-list { margin:0; padding-left:20px; font-size:12px; display:flex; flex-direction:column; gap:2px; overflow-wrap:anywhere; }
.a .spark.echo path:not(.hit) { stroke:var(--ink2); } .a .spark .mk.arc circle { fill:var(--ink2); stroke:none; } .a .echo-list { color:var(--ink2); }
.b .spark.echo path:not(.hit) { stroke:var(--gold2); } .b .spark .mk.arc circle { fill:var(--gold2); stroke:none; } .b .echo-list { color:var(--sand); }
.choices { padding:8px 20px 20px; display:flex; flex-direction:column; gap:10px; margin-top:auto; }
.choice { all:unset; box-sizing:border-box; min-height:52px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-radius:var(--r); cursor:pointer; font-size:15px; }
/* เลขปุ่มลัดนำหน้าตัวเลือก (ui-redo ใบ 02) — ข้อความตัวเลือกกินที่ที่เหลือ ป้ายผลยังชิดขวา */
.choice > kbd { display:inline-grid; place-items:center; width:26px; height:26px; flex:none; font:600 13px/1 var(--ft); border:1px solid var(--rule2); border-radius:var(--rc); color:var(--muted); }
.choice > kbd + span { flex:1; min-width:0; }
.choice:hover > kbd, .choice:focus-visible > kbd { border-color:currentColor; color:inherit; }
.choice .fx { font-size:12px; text-align:right; flex-shrink:0; max-width:50%; }
.choice .fx span { white-space:nowrap; }
/* ปุ่มล็อกใช้ช่องป้ายผลวางเหตุผลเป็นประโยค — ก้อนเดียวไม่มี " · " ห้ามตัดแล้วยาวเกินครึ่งปุ่มจนล้นจอมือถือ (B174) */
.choice:disabled .fx span { white-space:normal; }
/* ปุ่มกู้มาจ่าย (B111) ห้อยใต้ตัวเลือกที่ขาดเงิน — ย่อและเยื้องให้เห็นว่าเป็นทางของปุ่มบน ไม่ใช่ตัวเลือกใหม่ */
.choice.loan { min-height:40px; margin:-4px 0 0 24px; padding:6px 12px; font-size:13.5px; }
/* ชื่อตัวเลือกบนปุ่มกู้ยาวได้ทั้งประโยค — บรรทัดเดียวตัดท้ายด้วย … ไม่งั้นปุ่มกู้สูงกว่าตัวเลือกเอง · min-width:0 ให้ก้อนข้อความหดในแถว flex ได้ */
.choice.loan > span:first-child { min-width:0; }
.choice.loan .of { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.choice .hint { display:block; margin-top:3px; font-size:12.5px; line-height:1.45; opacity:0.75; }
/* ป้ายทางที่มีผลตามมา: ไอคอนต่อท้ายข้อความตัวเลือก + บรรทัดอธิบายใต้ชุดปุ่ม */
.ef { display:flex; align-items:center; gap:5px; margin:2px 0 4px; font-size:13px; font-weight:600; color:var(--red); }
.ef svg { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.i .ef { color:#FFB4C8; }
.recap { display:flex; flex-direction:column; gap:8px; padding:12px; }
.recap .h { font-size:13px; font-weight:600; }
.recap .picks { overflow-wrap:anywhere; }
/* ช่วยจริง (B145): เบอร์เป็นลิงก์ tel: แตะแล้วโทรได้บนมือถือ · ลิงก์สูง 44px เท่าปุ่มอื่น */
.help .help-row { display:flex; flex-direction:column; gap:2px; }
.help .help-call, .help > a { display:inline-flex; align-items:center; min-height:44px; overflow-wrap:anywhere; }
.help .help-call { font-weight:600; }
/* คำเตือนเนื้อหา (ui-redo 25) — การ์ดแรกเกิดตระกูลใหม่ + หน้าเล่นต่อ · สีตามการ์ดที่วางอยู่ */
.warn-line { margin:8px 0 0; font-size:13px; line-height:1.5; opacity:.85; }
.warn-line a { color:inherit; font-weight:600; text-decoration:underline; }
.help small, .help .note { font-size:12.5px; overflow-wrap:anywhere; }
.help a { color:inherit; } .help small a { white-space:nowrap; }
.lineage .lh { font-size:12px; font-weight:600; margin:6px 0 2px; }
.lineage .lh:first-child { margin-top:0; }
.lineage .llore { font-size:12px; margin:4px 0 0 20px; overflow-wrap:anywhere; }
/* แผงพับบนมรณบัตร: summary คงเป็น list-item ให้ลูกศรพับ/เปิดยังขึ้น (flex ทำลูกศรหาย)
   · margin ติดลบกิน padding 12px ของกรอบแผง — พับแล้วกรอบสูง 44px เท่าพื้นที่แตะ ไม่ซ้อน padding สองชั้น */
.fold > summary { cursor:pointer; padding:12px 0; margin:-12px 0; font-size:13px; font-weight:600; line-height:20px; }
.fold-in { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.all-picks summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-size:13px; font-weight:600; }
.delta { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px 14px; font-size:12px; }
.delta > div { display:flex; flex-direction:column; gap:4px; }
.titles .pattern { font-family:var(--ft); font-weight:600; font-size:20px; }
.titles .more, .eras .more, .memo .more, .warn .more, .d-pane > .more { all:unset; align-self:flex-start; min-height:44px; cursor:pointer; font-size:14px; font-weight:600; text-decoration:underline; }
.titles .more:focus-visible, .eras .more:focus-visible, .memo .more:focus-visible, .warn .more:focus-visible, .d-pane > .more:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
/* ชั้นสมุด (B130): แท็บเป็นปุ่มกด (aria-pressed) ไม่ใช่ tablist — เปลี่ยนแท็บ = วาดหน้าใหม่ทั้งหน้า */
.bk-intro { margin:0; font-size:13px; color:var(--muted); }
.shelf-art { display:block; width:100%; border:1px solid var(--ink2); border-radius:8px; }
.lineage-view { display:grid; gap:6px; }
.lineage-text summary { cursor:pointer; font-size:13px; color:var(--muted); min-height:44px; display:flex; align-items:center; }
.bk-tabs { display:flex; flex-wrap:wrap; gap:6px; }
.bk-tabs button { all:unset; cursor:pointer; min-height:44px; padding:0 12px; border:1px solid var(--ink2); border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; }
.bk-tabs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
.bk-tabs button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.bk-sec, .pic-ev { display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px dashed var(--rule); }
.bk-sec > .h, .pic-ev > .h { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink); }
.bk-sec > .h small, .pic-ev > .h small { font-weight:600; color:var(--muted); margin-left:auto; }
.bk-bar { height:6px; border-radius:3px; background:var(--rule2); overflow:hidden; }
.bk-bar i { display:block; height:100%; background:var(--bronze2); }
.bk-tier { font-size:12px; font-weight:700; color:var(--bronze2); margin-top:4px; }
.bk-list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; font-size:13px; }
.bk-list li { padding:6px 10px; border-radius:6px; overflow-wrap:anywhere; }
.bk-list .got { background:var(--paper2); color:var(--ink); font-weight:600; }
.bk-list .lock { border:1px dashed var(--rule); color:var(--muted); }
.bk-list .lock b { color:var(--ink2); margin-right:4px; }
.pic-ev .yr { font-size:12px; color:var(--muted); }
.pic-slots { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
.pic-slot { margin:0; display:flex; flex-direction:column; gap:2px; min-width:0; }
.pic-slot figcaption { font-size:11px; line-height:1.35; color:var(--muted); overflow-wrap:anywhere; }
.pic-slot.main { grid-column:1 / -1; }
.pic-slot.lock { aspect-ratio:5 / 2; justify-content:center; align-items:center; text-align:center; padding:4px 8px; border:1px dashed var(--bronze2); border-radius:4px; font-size:11px; line-height:1.35; color:var(--muted); }
.pic-slot.lock b { font-size:14px; color:var(--ink2); }
.memo { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.memo li { display:flex; align-items:center; justify-content:space-between; gap:8px; overflow-wrap:anywhere; }
.memo li .more { flex:none; }
/* สมุดชีวิต (B48) — หน้าก่อน/ข้ามกว้างเท่ากันใต้ปุ่มพลิกหน้า · ตัวเลือกที่กดเป็นตัวหนังสือเอียงแยกจากเนื้อเรื่อง */
.lifebook .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.lifebook .row .choice { justify-content:center; }
.lifebook .body .dates { margin-top:-6px; font-size:14px; }
.stamp { align-self:flex-start; font-family:var(--ft); font-weight:600; padding:4px 10px; transform:rotate(-3deg); font-size:16px; }

/* ทาง A — ทะเบียนราษฎร์: กระดาษ หมึก ตราประทับแดง */
.a { background:var(--paper); border:1px solid #C9BFA9; color:var(--ink); }
.a .top { background:var(--ink); color:var(--paper); }
.a .top b { font-family:var(--ft); font-size:16px; font-weight:600; }
.a .meta { color:var(--muted); padding-top:8px; }
.a .bar { background:#E2D9C6; } .a .bar i { background:var(--green); } .a .bar b { background:var(--red); }
.a .kicker { color:var(--red); }
.a .body h3 { font-family:var(--ft); font-weight:600; }
.a .body h3.lead { font-family:var(--ft); }
.a .body p, .a .items, .a .picks { color:var(--ink2); }
.a .sub, .a .note, .a .body .horo { color:var(--muted); }
.a .spark .nom { stroke:var(--green); } .a .spark .dot { fill:var(--green); }
.a .spark .grid { stroke:var(--rule2); } .a .spark .zero { stroke:var(--ink2); }
.a .spark .neg { fill:var(--red); fill-opacity:0.08; }
.a .spark text { fill:var(--muted); }
.a .band0 { fill:var(--paper2); fill-opacity:0.55; } .a .band1 { fill:transparent; }
.a .ln0 { stroke:var(--red); } .a .ln1 { stroke:var(--bronze2); } .a .ln2 { stroke:var(--blue); } .a .ln3 { stroke:var(--green); } .a .ln4 { stroke:var(--ink); }
.a .lifechart { border:1px solid var(--rule); border-radius:var(--r); background:#FBF7EE; }
.b .band0 { fill:var(--bronze); fill-opacity:0.25; } .b .band1 { fill:transparent; }
.b .ln0 { stroke:#E07A5F; } .b .ln1 { stroke:var(--gold); } .b .ln2 { stroke:#8FB3E0; } .b .ln3 { stroke:#7FC4B8; } .b .ln4 { stroke:var(--cream); }
.b .lifechart { border:1px solid var(--bronze); background:var(--lacquer2); }
/* กราฟฐานะตระกูล (B95): ขาลงเส้นประ + สีแดง ขาขึ้นเส้นทึบ — ตาบอดสีก็ยังแยกได้ · ขึ้นได้ทั้งการ์ดทาง A ทาง B และปรโลก */
.spark .sg { stroke-width:2.2; stroke-linecap:round; } .spark .sg.sd { stroke-dasharray:5 3; } .spark .sg.se { stroke-width:1.6; }
.legend .key .sg { stroke-width:2; }
.a .sg.su { stroke:var(--green); } .a .sg.sd { stroke:var(--red); } .a .sg.se { stroke:var(--ink2); }
.a .spark .mk.broke rect { fill:var(--red); stroke:var(--ink); stroke-width:1.5; } .a .spark .mk.nx circle { fill:var(--paper); stroke:var(--ink); stroke-dasharray:2 1.5; }
.a .legend .mk.broke rect { fill:var(--red); stroke:var(--ink); stroke-width:1; }
.b .sg.su { stroke:var(--gold2); } .b .sg.sd { stroke:#E39A8A; } .b .sg.se { stroke:var(--sand); }
.b .spark text, .b .mk-cap, .b .lifechart .h { fill:var(--sand); color:var(--sand); } .b .spark .grid { stroke:var(--bronze2); }
.b .spark .mk.ev circle { fill:var(--lacquer); stroke:var(--gold2); } .b .spark .mk.nx circle { fill:var(--lacquer); stroke:var(--cream); stroke-dasharray:2 1.5; }
.b .spark .mk.broke rect, .b .legend .mk.broke rect { fill:#E39A8A; stroke:var(--cream); stroke-width:1.5; }
.a .choice { border:1px solid var(--ink); background:#FFFDF7; }
.a .choice:hover, .a .choice:focus-visible { background:var(--ink); color:var(--paper); outline:none; }
.a .choice .fx { color:var(--green); } .a .choice:hover .fx, .a .choice:focus-visible .fx { color:#CFE3E0; }
.a .stamp { border:2px solid var(--red); color:var(--red); }
.a .recap { border:1px solid var(--rule); border-radius:var(--r); background:#FBF7EE; }

/* ทาง B — ลายรดน้ำ: พื้นรักดำ ทองคำเปลว */
.b { background:var(--lacquer); color:var(--cream); border:1px solid var(--bronze); }
.b .top { border-bottom:1px solid var(--bronze); }
.b .top b { font-family:Srisakdi,serif; font-size:20px; color:var(--gold); font-weight:700; }
.b .top small, .b .meta, .b .sub, .b .note { color:var(--sand); }
.b .bar { background:#3A2C1F; } .b .bar i { background:var(--gold); } .b .bar b { background:var(--cream); }
.b .kicker { color:var(--gold); letter-spacing:0.08em; }
.b .body h3 { font-family:Srisakdi,serif; font-weight:700; color:var(--gold2); font-size:28px; }
.b .body h3.lead { font-family:var(--ft); font-weight:400; font-size:19px; color:var(--cream); }
.b .body p { color:#E3D6B3; }
.b .choice { border:1px solid var(--bronze2); background:var(--lacquer2); color:var(--cream); }
.b .choice:hover, .b .choice:focus-visible { border-color:var(--gold); background:#2E2218; outline:none; }
.b .choice .fx { color:var(--gold); }
.b .picks, .b .tree summary { color:#E3D6B3; }
.b .recap { border:1px solid var(--bronze); background:var(--lacquer2); }
.b .recap .h { color:var(--gold); }
.scene { height:96px; background:var(--lacquer2); border-bottom:1px solid var(--bronze); }
.scene svg { display:block; width:100%; height:100%; }
.scale { display:flex; gap:12px; }
.scale > div { flex:1; min-width:0; border:1px solid var(--bronze); padding:10px; display:flex; flex-direction:column; gap:4px; font-size:13px; overflow-wrap:anywhere; }
.scale > div.heavy { border-color:var(--gold); }
.scale b { color:var(--gold2); font-family:Srisakdi,serif; font-size:18px; }
.scale .sum { font-size:15px; font-weight:600; color:var(--cream); }
.deeds { display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--bronze); padding-top:8px; }
.deed { margin:0; display:flex; flex-direction:column; gap:2px; font-size:13px; overflow-wrap:anywhere; color:#E3D6B3; }
.deed b { color:var(--gold2); font-size:12px; }
.deed.bad b { color:#E39A8A; }
/* มรณบัตร — หนังสืองานศพ (B83b D3 ทาง B): ขาวดำ กรอบหนา รูปกลางใบ · กราฟกับสรุปข้างในคงสีทาง A */
.a.mem { background:#FFFFFF; border:12px solid #1F1F1F; outline:1px solid #8A8A8A; outline-offset:-6px; color:#1F1F1F; }
.mem .top { background:transparent; color:#1F1F1F; justify-content:center; padding-top:18px; }
.mem .top b { font-family:Srisakdi,serif; font-size:22px; font-weight:700; }
.por { align-self:center; width:96px; height:96px; border:1px solid #1F1F1F; padding:4px; }
.mem .body > h3, .mem .body > .dates { text-align:center; }
.mem .body h3 { font-family:Srisakdi,serif; font-size:30px; font-weight:700; color:#1F1F1F; }
.mem .body .dates { margin-top:-6px; }
.mem .choice { border-color:#1F1F1F; }
/* ใบมรณะย่อ (ui-redo ใบ 10): ปุ่มไปต่อเป็นปุ่มหลักสีเน้นปุ่มเดียวต่อจากสรุป · ปุ่มแชร์เป็นปุ่มรองเส้นประท้ายการ์ด
   ฉายาเด่นเป็นริบบิ้นปลายบาก (ค่าเคาะใบ 02) — ตัดด้วย clip-path ข้อความยาวจึงตัดบรรทัดในริบบิ้นได้ */
.mem .choices { margin-top:0; }
.mem .choices > .choice { background:var(--red); border-color:var(--red); color:#FFFFFF; justify-content:center; font-weight:600; }
.mem .choices > .choice:hover, .mem .choices > .choice:focus-visible { background:#8F2A1B; border-color:#8F2A1B; color:#FFFFFF; outline:2px solid #1F1F1F; outline-offset:2px; }
.d-rb { margin:2px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 8px; }
.d-rb li { padding:3px 16px; background:var(--red); color:#FFFFFF; font-size:14px; font-weight:600; line-height:1.5; overflow-wrap:anywhere; clip-path:polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%, 8px 50%); }
.d-rb .more-n { padding:3px 0; background:none; color:inherit; font-weight:400; clip-path:none; }
.d-rest { padding-top:12px; }
/* แท็บรายละเอียด (ui-redo ใบ 11): ปุ่มแคปซูลตัดบรรทัดได้ จอแคบไม่ล้นแนวนอน · หัวในแผงคืนเป็นหัวเล็ก ไม่รับตัวเขียนชื่อผู้ตาย */
.d-tab-bar { display:flex; flex-wrap:wrap; gap:6px; }
.d-tab-bar button { all:unset; box-sizing:border-box; cursor:pointer; min-height:36px; padding:0 12px; border:1px solid #1F1F1F; border-radius:999px; font-size:14px; display:inline-flex; align-items:center; }
.d-tab-bar button[aria-selected="true"] { background:#1F1F1F; color:#FFFFFF; font-weight:600; }
.d-tab-bar button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.d-pane { display:flex; flex-direction:column; gap:10px; padding-top:12px; }
.d-pane[hidden] { display:none; }
.mem .d-pane h3 { margin:8px 0 0; font-family:var(--ft); font-size:14px; font-weight:600; color:var(--muted); text-align:left; }
.d-pane .fam { display:flex; flex-direction:column; gap:8px; }
/* เมนูแชร์ (ใบ 12): พับเป็นปุ่มรองเส้นประปุ่มเดียว เปิดแล้วคำสั่งเรียงต่อในที่เดิม ไม่ลอยทับการ์ด จอแคบจึงไม่ล้น */
.d-share { margin-top:4px; padding-top:12px; border-top:1px dashed #8A8A8A; }
.d-share > summary { list-style:none; cursor:pointer; min-height:44px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:6px; padding:6px 12px; border:1px dashed #1F1F1F; font-size:14px; }
.d-share > summary::-webkit-details-marker { display:none; }
.d-share > summary::after { content:'\25BE'; }
.d-share[open] > summary::after { content:'\25B4'; }
.d-share > summary:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.d-share-in { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.d-share .choice { flex:1 1 auto; min-height:44px; padding:6px 12px; justify-content:center; font-size:14px; background:transparent; border-style:dashed; }
/* ป้ายตามหาคนหาย (B139): กระดาษประกาศติดเสา หัวแดงตัวหนา — ต่างจากหนังสืองานศพขาวดำ ให้รู้ว่ายังไม่มีใครถือว่าจากไป */
.a.mem.lost { background:#FFF8E1; border:3px dashed #B3261E; outline:none; }
.lost .top { padding-top:20px; }
.lost .top b { font-family:var(--ft); font-size:24px; font-weight:800; color:#B3261E; letter-spacing:0.02em; }
.lost .por { border:2px solid #1F1F1F; }
.lost .call { margin:0; padding:8px 10px; border:2px solid #B3261E; color:#B3261E; font-weight:700; text-align:center; }
.lost .choice, .lost .d-share > summary { border-color:#B3261E; }

/* ทาง C ต่างโลก (B68) — หน้าต่างสถานะแบบเกม: พื้นฟ้ากลางคืน กรอบฟ้าเรือง · ต่างจากสองแนวไทยให้รู้ว่าออกจากวงเวียนเดิมแล้ว */
.i { background:#161A3A; color:#E8ECFF; border:1px solid #3B4BA8; }
.i .top { border-bottom:1px solid #3B4BA8; }
.i .top b { font-family:var(--ft); font-size:18px; font-weight:600; color:#6FE3FF; }
.i .top small, .i .note, .i .tree summary { color:#A6AEDB; }
.i .kicker { color:#B48CFF; letter-spacing:0.06em; }
.i .body h3 { font-family:var(--ft); font-weight:600; color:#E8ECFF; }
.i .body p, .i .picks { color:#D3D8F5; }
.i .choice { border:1px solid #3B4BA8; border-radius:6px; background:#0E1024; color:#E8ECFF; }
.i .choice:hover, .i .choice:focus-visible { border-color:#6FE3FF; background:#1E2350; outline:none; }
.i .choice .fx { color:#6FE3FF; }
.i .idesc { display:block; text-indent:0; margin-top:2px; font-size:12px; color:#A6AEDB; }
.i .iok { color:#5EE6A0; font-weight:600; } .i .ibad { color:#FF8A8A; font-weight:600; }
.i .isys { font-size:13px; color:#F2C94C; border:1px dashed #F2C94C; border-radius:6px; padding:6px 10px; }
/* แถบสถานะต่างโลก (ui-redo ใบ 13): โครง .sb ของโลกนี้ พื้นแถบเข้มกว่าการ์ดแบบต้นแบบ · อักษรแรกของชื่อแทนรูปตัวละคร */
.i .sb { background:#12152E; }
.sb .ini { display:grid; place-items:center; background:#232A5E; color:#6FE3FF; font-weight:700; }
.ichips { display:flex; flex-wrap:wrap; gap:6px; }
.ichip { padding:1px 8px; border:1px solid #F2C94C; border-radius:999px; color:#F2C94C; }
/* คำสัญญากับเทพธิดาบนการ์ดจบต่างโลก (B68e) — กรอบทองแบบข้อความระบบ · รักษาได้เขียว ผิดแดง (มีคำกำกับ ไม่พึ่งสีอย่างเดียว) */
.ivow { display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1px solid #F2C94C; border-radius:6px; background:#0E1024; }
.ivow .h { font-size:12px; font-weight:600; letter-spacing:0.06em; color:#F2C94C; }
.ivow blockquote { margin:0; font-family:var(--ft); color:#E8ECFF; }
.ivow b { font-size:14px; } .ivow.kept b { color:#5EE6A0; } .ivow.broke b { color:#FF8A8A; }
/* การ์ดชวนไปต่างโลก (B68d) — กรอบสีต่างโลกโผล่กลางการ์ดชีวิต · ทั้งใบยังเป็นของโลกนี้เพราะยังไม่ได้รับ */
.ix { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid #3B4BA8; border-radius:8px; background:radial-gradient(120% 100% at 50% 0%, #2A3480 0%, #161A3A 65%); box-shadow:inset 0 0 22px rgba(111,227,255,0.22); text-align:left; }
.ix-k { font-size:12px; font-weight:600; letter-spacing:0.08em; color:#6FE3FF; }
.ix-t { font-size:19px; line-height:1.5; color:#E8ECFF; }
.ix-ask { margin:0 0 4px; font-size:14px; font-weight:600; }
.ispeed { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; font-size:14px; }
.ispeed button { min-width:56px; min-height:44px; padding:2px 8px; border:1px solid #2A3478; border-radius:6px; background:#0E1024; color:#A6AEDB; font:inherit; cursor:pointer; }
.ispeed button[aria-pressed="true"] { border-color:#6FE3FF; color:#6FE3FF; background:#1E2350; }
.ispeed button:focus-visible { outline:2px solid #6FE3FF; outline-offset:1px; }
.itimer { margin:8px 20px 0; height:4px; border-radius:999px; background:#05060F; overflow:hidden; }
.itimer i { display:block; height:100%; width:0; background:#6FE3FF; }
@keyframes itick { from { width:0; } to { width:100%; } }
@media (prefers-reduced-motion: reduce) { .itimer i { animation:none !important; } }
/* เอฟเฟกต์ B-fx (ตัวเล่นใน app.mjs) — พลิก: ลูกตรงของการ์ดซ่อนด้านหลัง หลังการ์ดเป็นแผ่นรักลายทองหันกลับด้าน · translateZ กันกระพริบเพราะอยู่ระนาบเดียวกับพื้นการ์ด */
.fx-flip { position:relative; transform-style:preserve-3d; }
.fx-flip > * { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.fx-flip > .fx-back { position:absolute; inset:0; display:grid; place-items:center; border-radius:inherit; background:var(--lacquer2); transform:rotateY(180deg) translateZ(1px); }
.fx-back svg { width:min(200px, 60%); height:auto; }
.fx-ov { position:fixed; inset:0; z-index:50; pointer-events:none; }
.fx-ov.fx-out { opacity:0; transition:opacity .25s; }
.fx-veil { position:absolute; inset:0; background:var(--lacquer); opacity:0; }
.fx-lamp { position:absolute; left:50%; top:38%; margin:-60px 0 0 -60px; overflow:visible; }
.fx-cap { position:absolute; left:16px; right:16px; top:calc(38% + 76px); text-align:center; font-family:Pridi,serif; font-size:18px; color:var(--cream); opacity:0; }
.fx-cap small { display:block; font-family:Sarabun,sans-serif; font-size:13px; color:var(--sand); }
.fx-title { position:absolute; inset:0; display:grid; place-items:center; }
.fx-title svg { overflow:visible; max-width:92vw; height:auto; }
.fx-title .fx-name { font-family:Pridi,serif; font-weight:600; }
.fx-ov canvas { position:absolute; inset:0; width:100%; height:100%; }
/* ทั้งหน้าเข้าธีมต่างโลกตามการ์ดที่ขึ้นจอ — ผูกกับการ์ดด้วย :has จึงไม่ต้องตามล้างธงทุกจุดที่วาดจอไทย */
/* ui-redo ใบ 13: ชุดกรมท่าเรืองของต้นแบบลงตัวแปรหน้า — แถบสถานะ เมนูล่าง/ราวซ้าย และแผงจากเมนูเปลี่ยนสีตามโดยไม่มีกฎแยก */
body:has(#app > .card.i) { --page:#0B0D20; --muted:#A6AEDB; --ink:#E8ECFF; --ink2:#D3D8F5; --paper:#161A3A; --paper2:#232A5E; --rule2:#3B4BA8; --fl:#6FE3FF; --dg:#FF8A8A; --track:#262C5A; }
body:has(#app > .card.i) .logo { background:#0E1024; border-bottom-color:#3B4BA8; }
body:has(#app > .card.i) .logo b { font-family:var(--ft); font-weight:600; font-size:clamp(22px, 6vw, 30px); color:#6FE3FF; }
body:has(#app > .card.i) .logo small, body:has(#app > .card.i) .logo .ver, body:has(#app > .card.i) .logo .saved { color:#A6AEDB; }
body:has(#app > .card.i) .logo .ver { border-color:#3B4BA8; }
body:has(#app > .card.i) .foot a { color:#D3D8F5; }
/* แถบโฟกัสต่างโลก (05a): โครง .focus ของโลกหลัก สีชุดต่างโลก · ทางที่ทำอยู่เด่นสีทอง ไม่จางแบบตัวเลือกล็อก */
.ifocusbar { padding:8px 20px 0; }
.ifocusbar button { border-color:#2A3478; background:#0E1024; color:#E8ECFF; }
.ifocusbar button:hover, .ifocusbar button:focus-visible { border-color:#6FE3FF; background:#1E2350; }
.ifocusbar .focus-fx, .ifocusbar .focus-go { color:#6FE3FF; opacity:1; }
.ifocusbar .focus-pick .on { border-color:#F2C94C; background:#1E2350; }
.ifocusbar .focus-pick .on .focus-fx { color:#F2C94C; }
/* จดหมายเหตุบนการ์ดจบ — ป้ายอายุทอง เส้นซ้ายบอกชนิดบรรทัดแบบต้นแบบ · ช่วงวัยพับได้ ชีวิตยาวราวร้อยบรรทัดจึงไม่ดันปุ่มลงไปไกล */
.ichron .istage { margin-top:6px; }
.ichron .istage > summary { cursor:pointer; font-size:13px; color:#6FE3FF; }
.ilog { list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:13px; color:#D3D8F5; }
.ilog li { border-left:2px solid #2A3478; padding-left:8px; overflow-wrap:anywhere; }
.ilog li.event { border-left-color:#B48CFF; }
.ilog li.lore { border-left-color:#F2C94C; color:#F2C94C; }
.ilog b { margin-right:6px; color:#F2C94C; font-weight:600; }
.ilog small { display:inline-block; margin-left:6px; padding:0 6px; border:1px solid currentColor; border-radius:999px; font-size:11px; }
.ilog small.up { color:#5EE6A0; } .ilog small.down { color:#FF8A8A; }
/* ตัวเลือกที่ล็อก: ประกาศหลังกฎ hover ของทั้งสองทาง ความเจาะจงเท่ากันจึงชนะ — ชี้แล้วไม่กลับสีเหมือนกดได้ */
.a .choice:disabled, .b .choice:disabled, .i .choice:disabled { opacity:0.45; cursor:not-allowed; background:transparent; color:inherit; border-style:dashed; }
/* พาแนลการ์ด (B131): จอตั้งไม่มีพาแนล — ตัวห่อหายไปจากเลย์เอาต์ ลูกเรียงในการ์ดแบบเดิม */
.p-left, .p-mid { display:contents; }
.p-side { display:none; }
/* จอแนวนอนเตี้ย (มือถือหมุนจอ · B131 แบบ C2 ที่เจ้าของเคาะ) — แท็บเล็ต 768 สูงพอ ไม่เข้าเงื่อนไข หน้าตาเดิม
   · ซ้าย = หัวการ์ด ค่าสถานะ แผง · กลาง = เรื่องต่อด้วยปุ่ม · ขวา = สมุด/ฉายา (ติดจอ)
   · หัวเว็บย่อเป็นแถบบาง ชื่อเกมบรรทัดเดียว — จอสูง ~390 หัวเว็บเต็มกินเกือบครึ่งจอ */
@media (orientation: landscape) and (max-height: 540px) {
  .logo { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:0 10px; padding:calc(4px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 4px max(16px, env(safe-area-inset-left)); }
  .logo b { font-size:18px; line-height:1.3; white-space:nowrap; }
  .logo small { display:none; }
  .logo .ver, .logo .saved { margin-top:0; }
  #app, .foot { max-width:1100px; }
  #app { padding-top:8px; }
  .card:not(.pn) { max-width:var(--cw); margin:0 auto; }
  .card.pn { display:grid; grid-template-columns:minmax(0, 0.9fr) minmax(0, 1.35fr) minmax(0, 0.75fr); align-items:start; min-height:0; }
  .card.pn2 { grid-template-columns:minmax(0, 0.9fr) minmax(0, 1.35fr); }
  .p-left, .p-mid { display:flex; flex-direction:column; min-width:0; }
  .p-left { grid-column:1; }
  .p-mid { grid-column:2; border-left:1px dashed color-mix(in srgb, currentColor 30%, transparent); }
  .p-mid > .choices { margin-top:0; padding-top:4px; }
  .p-side { grid-column:3; grid-row:1; position:sticky; top:8px; margin:12px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; border:1px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius:6px; font-size:13px; }
  .p-side .h { font-weight:600; }
  .p-side .h ~ .h { margin-top:8px; }
  .p-side .note { margin:0; font-size:12px; opacity:0.8; overflow-wrap:anywhere; }
  .p-side .kit { margin:0; display:grid; grid-template-columns:auto minmax(0, 1fr); gap:2px 8px; font-size:12px; }
  .p-side .kit dt { font-weight:600; white-space:nowrap; }
  .p-side .kit dd { margin:0; opacity:0.8; overflow-wrap:anywhere; }
  .p-side .more { all:unset; align-self:flex-start; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; }
  .p-side .more:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
  .top { padding:8px 16px; }
  .sb { padding:8px 12px; }
  .meta, .tree, .focus { padding-left:12px; padding-right:12px; }
  /* พาแนลซ้ายแคบ: หัวการ์ดตัดบรรทัดเป็นแถว (ไม่งั้นอายุเหลือคำละบรรทัด) · ค่าสถานะ 2 ช่องต่อแถว (4 ค่า = 2×2) ป้าย "ความสัมพันธ์" ไม่ขาดกลางคำ */
  .p-left .top { flex-wrap:wrap; gap:4px 10px; }
  .p-left .top small { flex-basis:100%; text-align:left; }
  .p-left .sb-m { flex-wrap:wrap; gap:6px 10px; }
  .p-left .sb-m li { flex:1 1 calc(50% - 10px); }
  /* พาแนลกลาง: เรื่องกับปุ่มอยู่คอลัมน์เดียว — บีบภาพ ระยะ และตัวอักษรให้ปุ่มขึ้นในจอแรกให้มากที่สุด */
  .p-mid .body { padding:10px 16px 6px; gap:6px; }
  .p-mid .body h3 { font-size:20px; }
  .p-mid .body h3.lead { font-size:17px; }
  .p-mid .body p { font-size:14px; }
  .p-mid .choice { min-height:44px; padding:6px 12px; font-size:14px; }
  .era-art { width:min(100%, 160px); }
  .scene { height:64px; }
  .choice .fx span { white-space:normal; }
}
/* เลย์เอาต์คอม (ui-redo ใบ 09 · เจ้าของเคาะราวซ้าย + ลิ้นชัก): จอกว้างแถบเมนูล่างกลายเป็นราวซ้ายค้าง · แผงเปิดเป็นลิ้นชักขวาเต็มความสูง ไม่มีแผงเปิดค้าง
   · มือถือแนวนอนเตี้ยใช้ราวแคบด้วย — แถบล่าง 60px กินหนึ่งในหกของจอสูง 360 · ราวกว้างเพิ่มตามรอยบากฝั่งซ้าย ป้ายปุ่มจึงไม่ถูกบีบ */
@media (min-width: 1024px), (orientation: landscape) and (max-height: 540px) {
  :root { --rail-w:calc(220px + env(safe-area-inset-left)); }
  body:has(.mnav) { padding-bottom:0; padding-left:var(--rail-w); }
  .mnav { top:0; right:auto; width:var(--rail-w); max-width:none; flex-direction:column; gap:4px; margin:0; padding:max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); border-top:0; border-right:1px solid var(--rule2); box-shadow:4px 0 16px rgb(0 0 0 / .06); }
  .mnav button { flex:none; flex-direction:row; justify-content:flex-start; min-height:46px; padding:0 12px; border-radius:var(--r); font-size:15px; }
  .mnav button:hover { background:var(--paper2); }
  .mnav button[aria-expanded="true"] { background:var(--paper2); box-shadow:inset 3px 0 0 var(--fl); }
  .mnav .new-dot { position:static; margin-left:6px; }
  .sheet { top:0; bottom:0; left:auto; width:min(420px, 100vw - var(--rail-w)); max-width:none; max-height:none; margin:0; padding-right:max(20px, env(safe-area-inset-right)); border-left:1px solid var(--rule2); border-radius:0; box-shadow:-10px 0 30px rgb(0 0 0 / .2); }
}
@media (orientation: landscape) and (max-height: 540px) {
  :root { --rail-w:calc(96px + env(safe-area-inset-left)); }
  .mnav { gap:2px; padding:max(8px, env(safe-area-inset-top)) 6px max(8px, env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); }
  .mnav button { justify-content:center; min-height:44px; padding:0 4px; font-size:13px; }
}
@media (prefers-reduced-motion: no-preference) and (min-width: 1024px), (prefers-reduced-motion: no-preference) and (orientation: landscape) and (max-height: 540px) {
  .sheet { animation:drw .2s ease-out; }
}
@keyframes drw { from { transform:translateX(100%); } }
