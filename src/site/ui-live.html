<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปรับหน้าเล่นสด (tweak) · เกิดใหม่ทั้งที ชาตินี้ขอชิงมาเกิด</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  /* หน้า tweak (ui-redo 02) — ไฟล์เดียว ไม่พึ่ง proto.js/ภาพ ⇒ เปิด file:// ได้ · จอต้นแบบวาดใหม่ทุกครั้งที่ค่าเปลี่ยน */
  body { margin: 0; background: #E6E0D3; color: #1F2430; font: 15px/1.55 Sarabun, "Noto Sans Thai", system-ui, sans-serif; }
  .lay { display: grid; grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  .ctl { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #F3EEE2; border-right: 1px solid #D8D0C0; padding: 14px 14px 40px; box-sizing: border-box; }
  .ctl h1 { margin: 0 0 4px; font-size: 19px; line-height: 1.3; }
  .ctl .hint { margin: 0 0 10px; font-size: 13px; color: #5A5F6B; }
  .ctl h2 { margin: 18px 0 6px; font-size: 15px; padding-top: 10px; border-top: 1px solid #D8D0C0; }
  .row { margin: 8px 0 10px; }
  .row > label, .row > .lb { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .row .lb em { font-style: normal; font-weight: 400; color: #A23B2C; font-size: 12px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button, .btns button { font: inherit; font-size: 13px; padding: 4px 9px; border: 1px solid #C9BFA9; background: #fff; color: #1F2430; cursor: pointer; border-radius: 4px; }
  .seg button.on { background: #1F2430; color: #fff; border-color: #1F2430; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns .pri { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btns .pre { font-weight: 600; }
  .btns .pre.on { background: #A23B2C; color: #fff; border-color: #A23B2C; }
  input[type=range] { width: 100%; }
  select { font: inherit; font-size: 13px; padding: 3px 6px; width: 100%; }
  .chk { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; }
  .chk label { display: inline-flex; gap: 4px; align-items: center; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .col { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .col input { width: 34px; height: 26px; padding: 0; border: 1px solid #C9BFA9; background: none; }
  .col button { font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid #D8D0C0; background: #fff; cursor: pointer; }
  textarea { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #C9BFA9; border-radius: 4px; resize: vertical; background: #fff; }
  #msg { font-size: 13px; color: #15803d; min-height: 1.4em; }
  .view { padding: 12px 16px 24px; min-width: 0; }
  .vbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .vbar .auto { display: inline-flex; gap: 4px; align-items: center; }
  .dev { position: relative; overflow: hidden; margin: 0 auto; box-shadow: 0 6px 30px rgb(0 0 0 / .18); background: #ccc; }
  .scr { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .vt { margin-bottom: 10px; }
  .vt button { font-size: 14px; padding: 5px 12px; }
  #cmp { max-width: 980px; }
  #cmp h2 { font-size: 18px; margin: 4px 0 8px; }
  #cmp > p { margin: 0 0 10px; font-size: 14px; color: #4A4F5B; }
  .sty { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; margin-bottom: 18px; }
  .sty > div { background: #F3EEE2; border: 1px solid #D8D0C0; padding: 12px 14px; }
  .sty > div.on { border: 2px solid #A23B2C; }
  .sty h3 { margin: 0 0 4px; font-size: 16px; }
  .sty p { margin: 0 0 8px; font-size: 14px; }
  .sw { display: flex; gap: 4px; margin: 0 0 8px; }
  .sw i { width: 26px; height: 16px; display: block; border: 1px solid rgb(0 0 0 / .15); }
  .tw { overflow-x: auto; }
  .cmpt { border-collapse: collapse; width: 100%; min-width: 640px; background: #F3EEE2; font-size: 14px; }
  .cmpt th, .cmpt td { border: 1px solid #D8D0C0; padding: 7px 9px; text-align: left; vertical-align: top; }
  .cmpt th { background: #EBE4D5; }
  .cmpt td.on { background: #FFF; box-shadow: inset 0 0 0 2px #A23B2C; }
  .cmpt td button { display: block; margin-top: 6px; font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #C9BFA9; background: #fff; cursor: pointer; border-radius: 3px; }
  .view.cmp .vbar, .view.cmp .dev { display: none; }
  .view:not(.cmp) #cmp { display: none; }
  @media (max-width: 999px) {
    .lay { grid-template-columns: minmax(0, 1fr); }
    .view { order: -1; position: sticky; top: 0; z-index: 5; background: #E6E0D3; padding: 8px 10px; border-bottom: 1px solid #C9BFA9; }
    .view.cmp { position: static; }
    .vt { margin-bottom: 6px; } .vt button { font-size: 13px; padding: 3px 9px; }
    .ctl { position: static; height: auto; border-right: 0; }
    .vbar { gap: 4px 8px; margin-bottom: 6px; } .vbar .seg button { padding: 2px 7px; font-size: 12px; }
  }

  /* ---------- จอต้นแบบ: สีทั้งหมดจากตัวแปร ⇒ preset/ตัวเลือกสีเปลี่ยนแค่ตัวแปร ---------- */
  [data-pal="a"] { --bg: #E4DDCF; --sf: #F7F2E7; --bar: #F7F2E7; --ink: #1F2430; --mu: #5A5F6B; --ln: #CFC4AD; --chp: #EDE5D3; --ch: #FBF8F1; --ac: #A23B2C; --on: #FFF8EC; --fl: #2F6B66; --tr: #E2D9C6; --dg: #B3261E; --gold: #8A6A2E; }
  [data-pal="b"] { --bg: #EEEBE4; --sf: #FFFFFF; --bar: #EEEBE4; --ink: #1C1F26; --mu: #626774; --ln: #E3DED3; --chp: #E3EFEC; --ch: #F6F4EF; --ac: #2F6B66; --on: #FFFFFF; --fl: #2F6B66; --tr: #E0DBD0; --dg: #C0392B; --gold: #2F6B66; }
  [data-pal="c"] { --bg: radial-gradient(120% 80% at 50% 0%, #3A1612 0%, #1C0B09 70%); --sf: #2A110E; --bar: #1C0B09; --ink: #F3E7CC; --mu: #C9B48A; --ln: #6B4A2A; --chp: #3A1C16; --ch: #321510; --ac: #D9B45A; --on: #241008; --fl: #D9B45A; --tr: #3D2018; --dg: #E0473A; --gold: #F0D78C; }
  [data-world="isekai"] { --bg: #0B0D20; --sf: #161A3A; --bar: #12152E; --ink: #E8ECFF; --mu: #A6AEDB; --ln: #3B4BA8; --chp: #232A5E; --ch: #1D2250; --ac: #6FE3FF; --on: #0B0D20; --fl: #6FE3FF; --tr: #262C5A; --gold: #BFF4FF; }
  [data-pal="c"][data-world="isekai"] { --bg: radial-gradient(120% 80% at 50% 0%, #1E2A6A 0%, #0B0D20 70%); --sf: #141A44; --bar: #0B0D20; }
  [data-world="after"] { --bg: #0E0A08; --sf: #17110D; --bar: #120D0A; --ink: #EFE3C2; --mu: #BFAE86; --ln: #5A4630; --chp: #2A2018; --ch: #221912; --ac: #D9B45A; --on: #17110D; --fl: #D9B45A; --tr: #2A2018; --gold: #F0D78C; }
  [data-pal="c"][data-world="after"] { --bg: radial-gradient(120% 80% at 50% 0%, #2A2420 0%, #070605 70%); --sf: #14110F; --bar: #070605; }
  .scr, .scr * { box-sizing: border-box; }
  .scr { font: var(--fs) / 1.6 var(--ft); color: var(--ink); }
  .scr p, .scr h3, .scr h4, .scr ul { margin: 0; }
  .scr ul { padding: 0; list-style: none; }
  .scr [data-act] { cursor: pointer; }
  .ic { width: 22px; height: 22px; flex: none; }
  .ph { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--pat, none), var(--bg); }
  .ph.edge::after { content: ""; position: absolute; inset: 0; z-index: 9; pointer-events: none; box-shadow: inset 0 0 0 3px var(--dg), inset 0 0 60px rgb(220 40 30 / .5); }
  /* แถบสถานะ */
  .sb { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px; background: var(--bar); border-bottom: 1px solid var(--ln); flex: none; }
  .sb.two { display: block; padding: 8px 12px 10px; }
  .sb.mini { min-height: 38px; padding: 5px 12px; }
  .sb.mini .age { font-size: 16px; }
  .sb.mini .mk { display: none; }
  .sb .r1 { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .av { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--chp); color: var(--ac); font-weight: 700; }
  .nm { flex: 1; font-weight: 600; line-height: 1.2; min-width: 0; }
  .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--mu); }
  .age { font-weight: 700; font-size: 20px; line-height: 1; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .age small { font-size: 12px; font-weight: 400; }
  .age .hb { color: var(--dg); width: 18px; height: 18px; }
  .age.dy { display: grid; justify-items: center; padding: 2px 6px; font-size: 16px; line-height: 1.15; background: var(--dg); color: #fff; border-radius: var(--rc); }
  .age.dy em { font: 700 11px/1.2 var(--ft); font-style: normal; white-space: nowrap; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--dg); color: #fff; font-size: 13px; font-weight: 600; flex: none; }
  .strip b, .age.dy b { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: #fff; color: var(--dg); font-size: 10px; }
  @media (prefers-reduced-motion: no-preference) { .age.dy, .age .hb { animation: pulse 1.6s ease-in-out infinite; } .cd.enter { animation: enter .3s cubic-bezier(.2, .7, .2, 1); } }
  @keyframes pulse { 50% { opacity: .6; } }
  @keyframes enter { from { opacity: 0; transform: perspective(900px) rotateY(-12deg) translateY(6px); } }
  .mt, .mq, .md, .mr { flex: 1; display: flex; gap: 6px; min-width: 0; }
  .mt li, .md li { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .mk { font-size: 11px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mu); }
  .br { display: block; height: 6px; background: var(--tr); border-radius: var(--rc); overflow: hidden; }
  .br i { display: block; height: 100%; background: var(--fl); border-radius: inherit; }
  .low .br i { background: var(--dg); }
  .mq li { flex: 1 1 auto; display: flex; align-items: baseline; gap: 3px; min-width: 0; padding: 2px 6px; background: var(--chp); border-radius: var(--rc); }
  .mq b { font-size: 14px; }
  .mq em { font-style: normal; font-size: 10px; color: var(--fl); }
  .mq em.dn, .low b { color: var(--dg); }
  .mh { display: flex; align-items: baseline; gap: 3px; min-width: 0; }
  .mh b { margin-left: auto; font-size: 12px; }
  .mh em { font-style: normal; font-size: 10px; color: var(--fl); white-space: nowrap; }
  .mh em.dn { color: var(--dg); }
  .dt { display: flex; gap: 3px; }
  .dt i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--fl); }
  .dt i.f { background: var(--fl); }
  .low .dt i { border-color: var(--dg); } .low .dt i.f { background: var(--dg); }
  .mr { justify-content: space-around; }
  .mr li { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
  .rg { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--fl) calc(var(--v) * 1%), var(--tr) 0); }
  .low .rg { background: conic-gradient(var(--dg) calc(var(--v) * 1%), var(--tr) 0); }
  .rg b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--bar); font-size: 11px; }
  .sb.mini .rg { width: 26px; height: 26px; } .sb.mini .rg b { width: 20px; height: 20px; font-size: 10px; }
  .mo, .pt { display: grid; place-items: center; width: 36px; height: 36px; flex: none; color: var(--mu); }
  .pt { color: var(--ac); }
  /* การ์ด */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: var(--pad); min-height: 0; overflow: hidden; }
  .cd { width: 100%; max-width: var(--cw); padding: 18px 16px; background: var(--sf); border: 1px solid var(--ln); border-radius: var(--rk); box-shadow: var(--sh); }
  [data-pal="c"] .cd { border-color: #A88334; outline: 1px solid var(--ln); outline-offset: -6px; }
  [data-pal="a"] .cd { outline: 1px solid var(--ln); outline-offset: -6px; }
  .kk { font-size: 13px; color: var(--mu); }
  .tt { margin-top: 4px !important; font: 600 calc(var(--fs) * 1.45) / 1.35 var(--hd); }
  [data-pal="c"] .tt, [data-world="after"] .tt { color: var(--gold); }
  .tx { margin-top: 8px !important; }
  .chs { display: grid; gap: 10px; margin-top: 16px; width: 100%; }
  .ch { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; text-align: left; background: var(--ch); border: 1px solid var(--ln); border-radius: var(--r); font-size: calc(var(--fs) * .94); line-height: 1.35; color: var(--ink); }
  .ch:hover { filter: brightness(.97); }
  .ch kbd { display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none; font: 600 13px/1 var(--ft); border: 1px solid var(--ln); border-radius: var(--rc); color: var(--mu); }
  .ch > span { flex: 1; }
  .chs.arrow .ch { background: var(--sf); border-width: 0 0 0 4px; border-color: var(--ac); }
  .chs.arrow .ch i { font-style: normal; font-size: 22px; color: var(--ac); }
  .chs.pill { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chs.pill .ch { min-height: 44px; border-radius: 999px; padding: 8px 16px; background: var(--ac); color: var(--on); border: 0; }
  .chs.pill .ch > span { flex: none; }
  /* เมนู */
  .nv { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bar); border-top: 1px solid var(--ln); flex: none; }
  .mi { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 12px; color: var(--mu); }
  .mi.on { color: var(--ac); box-shadow: inset 0 3px 0 var(--ac); }
  .nv.float { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 4; border: 0; border-radius: 22px; background: var(--sf); box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  .nv.float .mi.on { box-shadow: none; }
  .nv.float .mi.on .ic { background: var(--chp); border-radius: 999px; padding: 2px 10px; width: 44px; box-sizing: content-box; }
  .ph.hasfloat .stage { padding-bottom: 90px; }
  .nv.top { border-top: 0; border-bottom: 1px solid var(--ln); grid-auto-columns: auto; justify-content: start; gap: 2px; padding: 0 8px; overflow: hidden; }
  .nv.top .mi { flex-direction: row; min-height: 44px; padding: 0 9px; font-size: 14px; gap: 5px; white-space: nowrap; }
  .nv.top .mi .ic { width: 18px; height: 18px; }
  .nv.top .mi.on { box-shadow: inset 0 -3px 0 var(--ac); }
  .fab { position: absolute; right: 14px; bottom: 16px; z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .fab span { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .fab span i { font-style: normal; padding: 2px 8px; background: var(--sf); border-radius: var(--rc); box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
  .fab .ic { width: 44px; height: 44px; padding: 11px; border-radius: 50%; background: var(--sf); color: var(--ac); box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
  .fab .main .ic { width: 56px; height: 56px; padding: 15px; background: var(--ac); color: var(--on); }
  /* แผง */
  .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .4); z-index: 6; }
  .sh { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; max-height: 78%; overflow: auto; padding: 18px 16px 22px; background: var(--sf); border-radius: var(--rk) var(--rk) 0 0; border-top: 2px solid var(--ln); }
  .x { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 40px; height: 40px; color: var(--mu); }
  .sht { font: 600 19px/1.3 var(--hd); margin-bottom: 10px !important; padding-right: 40px; }
  [data-pal="c"] .sht, [data-world="after"] .sht { color: var(--gold); }
  .rows li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--ln); font-size: 14px; }
  .rows li > span:first-child { width: 96px; flex: none; color: var(--mu); font-size: 13px; }
  .rows li > b { font-weight: 600; flex: 1; }
  .rows .br { flex: 1; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ln); margin: 10px 0; font-size: 14px; overflow: hidden; }
  .tabs > span { padding: 6px 10px; color: var(--mu); white-space: nowrap; }
  .tabs .on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--ac); }
  .tabs.pill { border: 0; gap: 6px; flex-wrap: wrap; }
  .tabs.pill > span { border-radius: 999px; background: var(--ch); padding: 4px 12px; }
  .tabs.pill .on { background: var(--ac); color: var(--on); box-shadow: none; }
  .ppl li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--ln); font-size: 14px; }
  .ppl .br { width: 70px; flex: none; }
  .lst li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--ln); font-size: 15px; }
  .lst li em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--mu); }
  .tl li { position: relative; padding: 0 0 12px 22px; font-size: 14px; line-height: 1.35; }
  .tl li::before { content: ""; position: absolute; left: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }
  .tl li::after { content: ""; position: absolute; left: 9px; top: 17px; bottom: 0; border-left: 2px solid var(--ln); }
  .tl small { display: block; color: var(--mu); font-size: 12px; }
  .pop { position: absolute; top: 56px; right: 8px; z-index: 5; width: 210px; padding: 10px 12px; background: var(--sf); border: 1px solid var(--ln); border-radius: var(--r); box-shadow: 0 8px 24px rgb(0 0 0 / .2); font-size: 13px; }
  .pop b { display: block; font-size: 15px; }
  /* การ์ดตาย */
  .death { border: 8px solid #1F1F1F; outline: 1px solid #8A8A8A !important; outline-offset: -5px !important; overflow: auto; max-height: 100%; }
  [data-pal="b"] .death { border: 0; outline: 0 !important; }
  [data-pal="c"] .death { border-color: var(--ac); }
  .death .tt { font-family: Srisakdi, serif; font-weight: 700; font-size: calc(var(--fs) * 1.8); }
  .death h4 { font: 600 15px/1.3 var(--hd); margin: 12px 0 4px !important; padding-top: 10px; border-top: 1px solid var(--ln); }
  .death .tx { font-size: calc(var(--fs) * .9); }
  .tbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tb { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .tb.rb { padding: 3px 14px; background: var(--ac); color: var(--on); clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }
  .tb.sl i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 3px double var(--gold); color: var(--gold); font-style: normal; font-size: 14px; }
  .tb.qt { font: italic 600 16px/1.3 var(--hd); color: var(--gold); }
  .cps { display: flex; flex-wrap: wrap; gap: 6px; }
  .cp { font-size: 13px; padding: 3px 10px; background: var(--chp); border-radius: var(--rc); }
  /* หน้าเปิด */
  .home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 18px; text-align: center; width: 100%; max-width: 480px; margin: 0 auto; }
  .logo { font: 700 36px/1.2 Srisakdi, serif; color: var(--gold); }
  .home .sub { font-size: 14px; color: var(--mu); }
  .go { display: inline-flex; justify-content: center; align-items: center; min-height: 50px; padding: 10px 28px; background: var(--ac); color: var(--on); border-radius: var(--r); font-weight: 700; }
  .go.ghost { background: none; color: var(--ink); border: 1px solid var(--ln); font-weight: 400; }
  .wc { width: 100%; display: grid; gap: 10px; text-align: left; }
  .wc > div { padding: 14px; background: var(--sf); border: 1px solid var(--ln); border-radius: var(--rk); box-shadow: var(--sh); }
  .wc > div b { display: block; font: 600 18px/1.3 var(--hd); }
  .wc > div small { color: var(--mu); font-size: 13px; }

  /* คอม */

  };
  const output = () => {
    const ch = ALL.filter(changed);
    const L = [`ui-redo 02 ค่าที่เจ้าของปรับ (หน้า tweak) · เริ่มจาก ${base.toUpperCase()} · ปรับเพิ่ม ${ch.length} ค่า`];
    for (const [h, l] of CTRL) {
      L.push(`[${h}]`);
      for (const c of l) {
        L.push(`- ${c.t.replace(/ \(.*\)$/, '')}: ${label(c, cfg[c.k])}${changed(c) ? ` (ปรับ · เดิม ${label(c, PRESET[base][c.k])})` : ''}`);
      }
    }
    if (note.trim()) L.push(`หมายเหตุ: ${note.trim().replace(/\s*\n\s*/g, ' / ')}`);
    L.push(`JSON: ${JSON.stringify({ base, ...cfg })}`);
    return L.join('\n');
  };
  const paint = () => {
    paintCmp();
    const y = ctl.scrollTop;
    ctl.innerHTML = ctlHtml();
    ctl.querySelector('#note').value = note;
    ctl.querySelector('#out').value = output();
    ctl.scrollTop = y;
  };
  const after = (c) => {
    if (document.getElementById('autosc').checked && c) {
      if (c.vp && ui.vp !== c.vp) { ui.vp = c.vp; paintVp(); }
      if (c.sc && ui.scene !== c.sc) { ui.scene = c.sc; paintSc(); }
      if (c.sc === 'me' && ui.vp === 390) ui.panel = cfg.pet === 'more' ? 'more' : cfg.pet === 'bar' ? 'pet' : c.k === 'pet' ? 'family' : 'me';
      if (c.sc === 'me' && ui.vp === 1280) { ui.side = c.k === 'pet' ? 'family' : 'me'; ui.panel = cfg.dPanel === 'drawer' ? ui.side : cfg.pet === 'bar' && c.k === 'pet' ? 'pet' : null; }
      if (c.pn) { if (ui.vp === 390 || cfg.dPanel === 'drawer') ui.panel = c.pn; else ui.side = c.pn; }
      if (c.st != null) ui.st = c.st;
    }
    store(); draw();
    if (c && c.play && c.ty === 'seg' && document.getElementById('autosc').checked) fxRun(...c.play[0].split(':'));
  };
  const setCfg = (k, v) => {
    cfg[k] = v;
    if (k === 'dPre' && DSETS[v]) cfg.dTabs = DSETS[v].slice();
    if (k === 'pal') cfg.col = {};
    ui.dt = 0;
    const c = ALL.find((x) => x.k === k);
    paint(); after(c);
  };
  ctl.addEventListener('click', (e) => {
    const pl = e.target.closest('[data-play]');
    if (pl) {
      const c = ALL.find((x) => x.play && x.play.includes(pl.dataset.play));
      // เข้าฉากตายเล่นเอฟเฟกต์ตายเองอยู่แล้ว ⇒ ไม่เล่นซ้อน
      if (c.sc !== ui.scene) { setScene(c.sc); if (pl.dataset.play === 'death') return; }
      scr.querySelectorAll('.fxo').forEach((x) => x.remove());
      fxRun(...pl.dataset.play.split(':'));
      return;
    }
    const sb = e.target.closest('.seg button');
    if (sb) { const k = sb.parentNode.dataset.k, c = ALL.find((x) => x.k === k); setCfg(k, c.ty === 'range' ? +sb.dataset.v : sb.dataset.v); return; }
    const pre = e.target.closest('[data-pre]');
    if (pre) { base = pre.dataset.pre; cfg = clone(PRESET[base]); paint(); store(); draw(); return; }
    if (e.target.id === 'reset') { if (!confirm(`รีเซ็ตทุกค่ากลับเป็นสไตล์ ${base.toUpperCase()}?`)) return; cfg = clone(PRESET[base]); paint(); store(); draw(); return; }
    const uc = e.target.closest('[data-uc]');
    if (uc) { delete cfg.col[uc.dataset.uc]; paint(); after(ALL.find((x) => x.k === 'col')); return; }
    if (e.target.id === 'copy') copy();
  });
  ctl.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'note') { note = t.value; ctl.querySelector('#out').value = output(); store(); return; }
    if (t.type === 'range') { cfg[t.dataset.k] = +t.value; t.previousElementSibling.querySelector('span').textContent = t.value + ALL.find((x) => x.k === t.dataset.k).u; ctl.querySelector('#out').value = output(); after(ALL.find((x) => x.k === t.dataset.k)); return; }
    if (t.type === 'color') { cfg.col[t.dataset.c] = t.value.toUpperCase(); ctl.querySelector('#out').value = output(); after(ALL.find((x) => x.k === 'col')); }
  });
  ctl.addEventListener('change', (e) => {
    const t = e.target;
    if (t.tagName === 'SELECT') { setCfg(t.dataset.k, t.value); return; }
    if (t.type === 'checkbox' && t.closest('.chk')) { cfg.dTabs = POOL.filter((p) => t.closest('.chk').querySelector(`input[value="${p}"]`).checked); cfg.dPre = 'custom'; ui.dt = 0; paint(); after(ALL.find((x) => x.k === 'dTabs')); return; }
    if (t.type === 'range' || t.type === 'color') paint();
  });
  const copy = async () => {
    const o = ctl.querySelector('#out'), m = ctl.querySelector('#msg');
    o.value = output();
    try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
    m.textContent = 'คัดลอกแล้ว — วางตอบในแชทได้เลย';
  };

  // ---------- แท็บเทียบ 3 สไตล์ (ข้อเสนอเดิมของต้นแบบ 01 · ปุ่มลองค่าใส่เข้าจอสด) ----------
  const STY = [
    ['a', 'A · สมุดกระดาษ', 'ต่อยอดหน้าตาเดิม กระดาษ หมึก หัวเรื่อง Pridi มุมเหลี่ยม · เปลี่ยนน้อยสุด ผู้เล่นเก่าจำได้ · เมนู 5 ปุ่ม', ['#E4DDCF', '#F7F2E7', '#1F2430', '#A23B2C', '#2F6B66']],
    ['b', 'B · แอปสะอาด', 'พื้นขาว มุมมน เมนูลอยแคปซูล · ปุ่มเมนูน้อยสุด 4 ปุ่ม นิ้วโป้งกดง่าย · เงินรวมในแผงชีวิต', ['#EEEBE4', '#FFFFFF', '#1C1F26', '#2F6B66', '#E3EFEC']],
    ['c', 'C · ลงรักปิดทอง', 'พื้นมืดทุกโลก กรอบทอง หัวเรื่อง Srisakdi · ดูเป็นเกมมากสุด · ของที่ใช้นาน ๆ ครั้งอยู่ปุ่ม ⋯ บนแถบสถานะ', ['#1C0B09', '#2A110E', '#F3E7CC', '#D9B45A', '#6B4A2A']],
  ];
  // [หัวข้อ, key ใน cfg, ฉากที่ไปดู, [ค่า, ข้อความ] ของ A B C]
  const QS = [
    ['ชุดปุ่มเมนูล่าง (ชาติไทย)', 'menu', 'year', [['5', 'ตัวฉัน (รวมเงิน) · ครอบครัว · สมุด · เพิ่มเติม'], ['4', 'ชีวิต (รวมเงิน) · ครอบครัว · สมุด · เพิ่มเติม'], ['4more', 'ตัวฉัน · ครอบครัว · เงิน · สมุด + ปุ่ม ⋯ บนแถบสถานะ']]],
    ['เมนูต่างโลก', 'menu', 'isekai', [['5', 'ตัวฉัน (รวมอาชีพ) · สกิล · ความเร็ว · สมุด · เพิ่มเติม'], ['4', 'ชีวิต · สกิล · ความเร็ว · สมุด'], ['4more', 'ตัวฉัน · สกิล · อาชีพ · ความเร็ว · สมุด']]],
    ['เมนูปรโลก', 'menu', 'after', [['5', 'ชีวิตที่แล้ว · โฟกัส · ตระกูล · สมุด · เพิ่มเติม'], ['4', 'ชีวิตที่แล้ว · สมุด · เพิ่มเติม'], ['4more', 'ชีวิตที่แล้ว · ตระกูล · สมุด']]],
    ['แท็บการ์ดตาย', 'dPre', 'death', [['a', DSETS.a.join(' · ')], ['b', DSETS.b.join(' · ')], ['c', DSETS.c.join(' · ')]]],
    ['สัตว์เลี้ยง', 'pet', 'me', [['family', 'ท้ายแผงครอบครัว'], ['family', 'ท้ายแผงครอบครัว'], ['none', 'ยังไม่ทำแผง คงบรรทัดในการ์ดตาย']]],
    ['หน้าเปิดเกม', 'home', 'home', [['old', 'เปลี่ยนแค่สี/ตัวอักษร ในชิ้นโครง + เมนู'], ['world', 'รื้อด้วย ในชิ้นโครง + เมนู (ในจอสด = เลือกโลกเป็นการ์ด)'], ['old', 'คงเดิม รื้อเป็นชิ้นแยกท้ายคิว']]],
  ];
  const M02 = [['barnum', 'แบบ 1 · แถบเส้น + ตัวเลข + ลูกศร', 'คงแถบเส้นที่เลือกไว้ เติมตัวเลข 0–100 และลูกศรบอกว่าปีนี้ค่าขึ้นหรือลงเท่าไร ไว้บรรทัดเดียวกับชื่อค่า'], ['num', 'แบบ 2 · ตัวเลข + ลูกศร ไม่มีแถบ', 'เอาแถบเส้นออก เหลือชื่อค่า ตัวเลข และลูกศรปีนี้ในชิปเล็ก · แถบสถานะเตี้ยลง']];
  const cmpEl = document.getElementById('cmp'), viewEl = document.getElementById('view'), vtEl = document.getElementById('vt');
  const paintCmp = () => {
    cmpEl.innerHTML = `<h2>ใบ 02 ต่อ · แถบค่า "ตัวเลข + ลูกศร" — เจ้าของเคาะแบบ 1</h2><p>แบบ 1 เป็นค่าเริ่มของหน้าแล้ว · กดดูเทียบกับแบบ 2 ได้ · ลูกศร = ค่าที่เปลี่ยนในปีนี้ (ตัวเลขในต้นแบบเป็นค่าสมมติ)</p>
      <div class="sty">${M02.map(([v, t, d]) => `<div class="${cfg.meter === v ? 'on' : ''}"><h3>${t}</h3><p>${d}</p><div class="btns"><button type="button" class="pre" data-m02="${v}">ดูบนค่าที่ส่งมา</button></div></div>`).join('')}</div>
      <h2>ต้นแบบ 3 สไตล์</h2><p>สไตล์ = ค่าเริ่มของจอสด · กดเริ่มจากสไตล์ไหนก็ได้แล้วปรับต่อ · ข้อเสนอแต่ละข้อหยิบข้ามสไตล์ได้ เช่น หน้าตา A กับชุดเมนู B</p>
      <div class="sty">${STY.map(([k, t, d, sw]) => `<div class="${base === k ? 'on' : ''}"><h3>${t}</h3><div class="sw">${sw.map((c) => `<i style="background:${c}"></i>`).join('')}</div><p>${d}</p><div class="btns"><button type="button" class="pre" data-pre="${k}">เริ่มจาก ${k.toUpperCase()} แล้วดูจอสด</button></div></div>`).join('')}</div>
      <h2>คำถามค้าง 4 ข้อ · ข้อเสนอแต่ละสไตล์</h2><p>ช่องกรอบแดง = ค่าที่จอสดใช้อยู่ · กด "ลองค่านี้" แล้วจอสดเปลี่ยนให้ดูทันที · คำตอบรวมอยู่ที่ปุ่มคัดลอกค่าในแผงซ้าย</p>
      <div class="tw"><table class="cmpt"><thead><tr><th></th>${STY.map((s) => `<th>${s[1]}</th>`).join('')}</tr></thead><tbody>${QS.map(([t, k, sc, l]) => `<tr><th>${t}</th>${l.map(([v, d]) => `<td class="${String(cfg[k]) === v ? 'on' : ''}">${d}<button type="button" data-try="${k}|${v}|${sc}">ลองค่านี้</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  };
  const setTab = (t) => { ui.tab = t; viewEl.classList.toggle('cmp', t === 'cmp'); vtEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === t)); if (t === 'live') fitDev(); };
  vtEl.onclick = (e) => { const b = e.target.closest('button'); if (b) setTab(b.dataset.v); };
  cmpEl.addEventListener('click', (e) => {
    const pre = e.target.closest('[data-pre]');
    if (pre) { base = pre.dataset.pre; cfg = clone(PRESET[base]); paint(); store(); setTab('live'); draw(); return; }
    const m02 = e.target.closest('[data-m02]');
    if (m02) { base = OWNER02.base; cfg = clone(OWNER02); delete cfg.base; cfg.meter = m02.dataset.m02; paint(); setTab('live'); setScene('year'); return; }
    const tr = e.target.closest('[data-try]');
    if (!tr) return;
    const [k, v, sc] = tr.dataset.try.split('|');
    cfg[k] = v;
    if (k === 'dPre') cfg.dTabs = DSETS[v].slice();
    paint(); setTab('live'); setScene(sc);
  });

  // ---------- ขนาดจอ · ฉาก ----------
  const vpEl = document.getElementById('vp'), scEl = document.getElementById('sc');
  scEl.innerHTML = SCENES.map(([k, t]) => `<button type="button" data-v="${k}">${t}</button>`).join('');
  const paintVp = () => vpEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.v === ui.vp));
  const paintSc = () => scEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === ui.scene));
  const setScene = (s) => {
    ui.scene = s; ui.panel = null; ui.fab = false; ui.ci = 0; ui.dt = 0;
    if (s === 'me') { if (ui.vp === 390 || cfg.dPanel === 'drawer') ui.panel = 'me'; ui.side = 'me'; }
    paintSc(); store(); draw();
    if (s === 'death' && booted) fxRun('death');
  };
  let booted = false;
  // เล่นเอฟเฟกต์ทับจอต้นแบบ · พลิก = วาดการ์ดใหม่พร้อมคลาสพลิก
  function fxRun(kind, tier = 'rare') {
    if (kind === 'flip') { ui.enter = true; draw(); return; }
    const v = kind === 'death' ? cfg.fxDeath : cfg.fxTitle, ph = scr.firstElementChild;
    if (v === 'none' || !ph) return;
    const o = document.createElement('div');
    o.className = `fxo${kind === 'title' ? ' dim' : ''}`;
    ph.appendChild(o);
    playFx(o, kind + v, { tier });
  }
  vpEl.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; ui.vp = +b.dataset.v; paintVp(); setScene(ui.scene); };
  scEl.onclick = (e) => { const b = e.target.closest('button'); if (b) setScene(b.dataset.v); };

  paint(); paintVp(); setTab('live'); setScene(ui.scene); booted = true;
})();
</script>
</body>
</html>
