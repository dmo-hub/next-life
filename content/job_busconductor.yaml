# ร่างเรื่อง กระเป๋ารถเมล์ · 15 ใบ · ลงเกมแล้ว ใบ 319 · ผู้เล่นเป็นผู้โดยสาร เพื่อนบ้าน หรือเด็กนั่งรถกับผู้ใหญ่ เสมอ · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี · ไม่มี effects job
events:
  - id: busconductor_why_bag_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [5, 12]}
    title: "ทำไมเรียกว่ากระเป๋า"
    text: "นั่งรถเมล์ไปตลาดกับผู้ใหญ่ในบ้าน พี่ที่เก็บเงินถือกระบอกเหล็ก ฉีกตั๋วออกจากกระบอกทีละใบ แต่ทุกคนเรียกพี่เขาว่ากระเป๋า คุณมองหากระเป๋าบนตัวพี่เขาตั้งแต่ป้ายแรก ยังหาไม่เจอสักใบ"
    choices:
      - id: busc_kid_ask_name
        text: "ถามพี่เขาตรง ๆ ว่ากระเป๋าอยู่ไหน"
        outcomes:
          - {weight: 2, ok: true, text: "พี่หัวเราะ เล่าว่าคนเก็บเงินสมัยก่อนสะพายกระเป๋าหนังใบโต ชื่อเลยติดมาจนวันนี้ทั้งที่เงินย้ายไปอยู่ในกระบอกแล้ว", effects: {knowledge: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่ตอบว่ากระเป๋าอยู่ในใจ ทั้งรถหัวเราะ คุณคิดเรื่องนี้ไม่ออกจนถึงตลาด", effects: {happiness: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_kid_watch_nail
        text: "นั่งดูมือฉีกตั๋วเงียบ ๆ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: busc_kid_sandpaper
        text: "ชี้กระดาษทรายในกระเป๋าเสื้อพี่"
        effects: {knowledge: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: busc_kid_lend_bag
        text: "ยื่นกระเป๋านักเรียนให้ยืมใช้"
        outcomes:
          - {weight: 1, ok: true, text: "พี่รับไปสะพายเดินเก็บเงินหนึ่งรอบ ผู้โดยสารปรบมือ แล้วคืนมาพร้อมตั๋วหนึ่งใบเป็นค่าเช่า", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้ใหญ่ดึงมือคุณกลับ ขอโทษพี่เขา แล้วเทศน์ต่อไปจนถึงตลาด", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: busconductor_coin_relay_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 18]}
    title: "เหรียญทอนส่งต่อหกมือ"
    text: "เย็นวันเรียนพิเศษ รถเมล์แน่นจนกระเป๋าเดินไปไม่ถึงท้ายรถ ป้าแถวหลังยื่นแบงก์ข้ามหัวคนมา ตั๋วกับเหรียญทอนต้องส่งต่อกันมือต่อมือ และมือที่ใกล้กระเป๋าที่สุดตอนนี้คือมือคุณ"
    choices:
      - id: busc_teen_pass_relay
        text: "รับไปส่งต่อให้ถึงมือ"
        effects: {relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: busc_teen_count_change
        text: "นับเหรียญทอนให้ป้าก่อนส่ง"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: busc_teen_look_away
        text: "ทำเป็นมองออกนอกหน้าต่าง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: busc_teen_relay_beat
        text: "ตะโกนนำ ส่งต่อเป็นจังหวะ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งแถวส่งต่อตามจังหวะเดียวกัน เหรียญถึงมือป้าครบไม่หล่นสักเหรียญ กระเป๋าชูนิ้วให้จากหน้ารถ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}], next: busconductor_after_teen_01}
          - {weight: 1, text: "จังหวะเร็วไป เหรียญหล่นลงไปในรองเท้าใครสักคน ทั้งแถวต้องยืนขาเดียวช่วยกันหา", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}], next: busconductor_after_teen_01}
        merit: [{cat: neutral}]

  - id: busconductor_back_step_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 18]}
    title: "ยืนบันไดเพราะไม่อึดอัด"
    text: "รถเมล์เช้ามาแน่นทุกคัน คุณชอบยืนตรงบันไดหลังเพราะลมเข้าและไม่ต้องดมเสื้อใคร วันนี้กระเป๋ายืนข้างบนตะโกนให้ชิดในมาหลายรอบ แต่ข้างในก็ไม่เหลือที่ให้ชิดแล้ว"
    choices:
      - id: busc_teen_squeeze_in
        text: "เบียดขึ้นไปข้างในตามสั่ง"
        effects: {health: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: busc_teen_hold_step
        text: "จับราวแน่น ยืนบันไดต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "ถึงหน้าโรงเรียน คุณได้ลงก่อนใครทั้งคัน", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระเป๋าต้องลงมาเก็บเงินที่บันไดทุกป้าย และขอให้คุณขยับหลบทุกป้ายจนขาล้า", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_teen_next_bus
        text: "ลงไปรอคันหลังที่ว่างกว่า"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: busc_teen_school_song
        text: "ชวนคนบนบันไดร้องเพลงโรงเรียน"
        outcomes:
          - {weight: 1, ok: true, text: "คนบนบันไดสามคนเป็นรุ่นพี่โรงเรียนเดียวกัน ร้องจนกระเป๋าส่ายหัวยิ้ม ได้รุ่นพี่ติวเลขให้ฟรีหนึ่งเทอม", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร้องอยู่คนเดียวสองป้าย กระเป๋าก้มลงมาถามว่าไม่สบายหรือเปล่า", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: busconductor_fancy_tube_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ขอยืมกระบอกไปงานแฟนซี"
    text: "ห้องเช่าข้างกันมีพี่ที่เป็นกระเป๋ารถเมล์ กระบอกของพี่เขาติดสติกเกอร์ลายดาวจนผู้โดยสารประจำจำได้ก่อนจำหน้า คืนเสาร์นี้คุณมีงานเลี้ยงแต่งตัวแฟนซี เลยเดินไปเคาะห้องขอยืมกระบอกไปประกอบชุด"
    choices:
      - id: busc_young_ask_tube
        text: "ขอยืมตรง ๆ สักคืน"
        outcomes:
          - {weight: 2, ok: true, text: "พี่เขาบอกว่ากระบอกกลับบ้านไม่ได้ ต้องฝากห้องเก็บที่อู่ทุกคืน ตั๋วทุกม้วนก็เป็นความรับผิดชอบของคนเบิก แต่สอนเสียงขานเก็บเงินให้ไปใช้แทน", effects: {knowledge: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่เขาอธิบายกฎกระบอกยาวจนคุณไปงานสาย และยังไม่ได้กระบอกอยู่ดี", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_young_tin_tube
        text: "ทำเองจากกระป๋อง ติดดาวเลียนแบบ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งงานถามว่าได้มาจากอู่ไหน พี่ข้างห้องเห็นรูปแล้วบอกว่าดาวของคุณเบี้ยวกว่าของจริง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ขอบกระป๋องบาดนิ้วตอนเจาะรู คุณไปงานพร้อมพลาสเตอร์สามแผ่น", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_young_invite_neighbor
        text: "ชวนพี่เขาไปงานด้วยเลย"
        outcomes:
          - {weight: 1, ok: true, text: "พี่เขามาในชุดทำงาน ยืนขานเก็บค่าเข้างานจนทุกคนหัวเราะ คืนนั้นคุณได้เพื่อนใหม่ครึ่งห้อง", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่เขาเพิ่งเลิกกะดึก นั่งหลับคาเก้าอี้ในงานตั้งแต่หัวค่ำ", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_young_new_costume
        text: "เปลี่ยนไปแต่งเป็นอย่างอื่น"
        effects: {happiness: -1}
        merit: [{cat: neutral}]

  - id: busconductor_real_sleep_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "หลับเลยป้าย"
    text: "เลิกกะดึกตอนฟ้าเริ่มสว่าง คุณได้ที่นั่งริมหน้าต่างแล้วหลับตั้งแต่ป้ายแรก ตื่นอีกทีเพราะกระเป๋าแตะไหล่ถามว่าจ่ายค่ารถหรือยัง สีหน้าเหมือนถามประโยคนี้มาหลายรอบแล้ว ป้ายนอกหน้าต่างไม่ใช่ป้ายที่คุณคุ้นเลย"
    choices:
      - id: busc_young_pay_ask
        text: "จ่ายค่ารถ แล้วถามว่าเลยมาไกลไหม"
        outcomes:
          - {weight: 1, ok: true, text: "กระเป๋าบอกว่าเลยมาแค่สามป้าย แล้วชี้ป้ายฝั่งตรงข้ามที่รถขากลับจอดให้", effects: {knowledge: 1, relations: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}], next: busconductor_after_young_01}
          - {weight: 1, text: "เลยมาจนเกือบปลายสาย ต้องนั่งย้อนกลับอีกเที่ยว นอนต่อก็ไม่หลับแล้ว", effects: {health: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}], next: busconductor_after_young_01}
        merit: [{cat: neutral}]
      - id: busc_young_show_shift
        text: "ชี้เสื้อทำงานให้ดูว่าเพิ่งเลิกกะ"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: busc_young_ride_loop
        text: "นั่งต่อถึงปลายสาย หลับขากลับ"
        effects: {health: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: busc_young_ask_wake
        text: "ฝากกระเป๋าปลุกตอนถึงป้ายขากลับ"
        outcomes:
          - {weight: 1, ok: true, text: "เขารับปาก พอถึงป้ายก็ตะโกนลั่นรถว่าคนกะดึกถึงบ้านแล้ว แล้วเคาะหลังคาสองทีให้ออกรถ ทั้งคันหันมามองคุณ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาเปลี่ยนกะลงที่อู่กลางทาง คนใหม่ไม่รู้เรื่อง คุณหลับเลยบ้านเป็นรอบที่สอง", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: busconductor_stop_or_not_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "คันนี้จอดป้ายนี้ไหม"
    text: "เพิ่งย้ายมาเรียนต่อในเมือง ป้ายหน้าหอมีรถเมล์ผ่านหลายคัน บางคันจอด บางคันชะลอให้กระเป๋ากระโดดลงก่อนรถหยุดแล้วโบกให้คนรีบขึ้น คุณยกมือค้างครึ่งแขน ไม่แน่ใจว่าคันที่กำลังมาจะจอดหรือแค่ผ่าน"
    choices:
      - id: busc_young_wave_full
        text: "โบกเต็มแขน ไม่ต้องคิดแล้ว"
        outcomes:
          - {weight: 1, ok: true, text: "รถจอดตรงหน้าพอดี กระเป๋าเคาะหลังคาสองทีให้ออกรถ แล้วบอกว่าป้ายนี้ต้องโบกแรง ๆ แบบนี้แหละ", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}], next: busconductor_after_young_01}
          - {weight: 1, text: "รถเลยไปจอดป้ายถัดไป คุณวิ่งตามพร้อมคนอีกสามคน ขึ้นทันแต่หอบจนหยิบเงินไม่ถูก", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}], next: busconductor_after_young_01}
        merit: [{cat: neutral}]
      - id: busc_young_ask_aunty
        text: "ถามป้าที่ยืนรอด้วยกัน"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: busc_young_walk_big
        text: "เดินไปรอป้ายใหญ่ข้างหน้า"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: busc_young_paper_sign
        text: "เขียนป้ายกระดาษชูว่าจอดด้วย"
        outcomes:
          - {weight: 1, ok: true, text: "กระเป๋าคันแรกเห็นแล้วหัวเราะจนต้องสะกิดคนขับให้จอด หลังจากนั้นคันไหนผ่านก็ยกมือทักคุณ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลมพัดกระดาษปลิวไปติดกระจกรถคันอื่น คุณยืนมือเปล่าอยู่อีกยี่สิบนาที", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: busconductor_payday_note_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "เงินเดือนออกเป็นแบงก์ใหญ่"
    text: "วันเงินเดือนออก ในกระเป๋าสตางค์มีแบงก์ใหญ่ใบเดียว ขึ้นรถตอนชั่วโมงเร่งด่วน กระเป๋าถือกระบอกเดินฝ่าคนมาถึงตัว เหลือบเห็นสีแบงก์ในมือคุณแล้วถอนหายใจยาวกว่าเสียงเบรก"
    choices:
      - id: busc_young_hand_note
        text: "ยื่นไป ขอโทษไปพร้อมกัน"
        outcomes:
          - {weight: 1, ok: true, text: "กระเป๋าควานเหรียญจนถึงก้นกระบอก ทอนมาเป็นกำ กระเป๋ากางเกงคุณหนักจนเดินเอียงไปทั้งวัน", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เหรียญไม่พอ กระเป๋าต้องเดินแลกกับผู้โดยสารทั้งคัน คนครึ่งรถรู้แล้วว่าวันนี้เงินเดือนคุณออก", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: busc_young_swap_coins
        text: "ขอแลกเหรียญกับคนข้าง ๆ ก่อน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: busc_young_break_note
        text: "ลงไปแตกแบงก์ร้านข้างทาง"
        effects: {health: -1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: busc_young_pay_row
        text: "จ่ายให้ทั้งแถวด้วยแบงก์นี้เลย"
        outcomes:
          - {weight: 1, ok: true, text: "ห้าคนแถวนั้นยิ้มรับ กระเป๋าทอนง่ายขึ้นทันตา ตลอดเดือนนั้นมีคนลุกให้คุณนั่งทุกเช้า", effects: {happiness: 2, network: 1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พอพูดจบก็มีคนขึ้นมาเพิ่มอีกแปดคนพอดี คุณนับนิ้วในใจไปจนถึงป้ายลง", effects: {happiness: -1, relations: 1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: busconductor_dark_shift_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
