  - id: boxer_weight_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    when: {age: [11, 23], flags: {has: [boxer_fought]}}
    title: "พิกัดเดิมทั้งที่ตัวโตขึ้น"
    text: "คุณสูงขึ้นทุกปีแต่ค่ายอยากให้ชกพิกัดเดิม เพราะคนที่ชอบแทงมวยรู้จักชื่อคุณในรุ่นนี้ อีกสองวันต้องชั่งน้ำหนัก ตาชั่งบอกว่ายังเกินอยู่ ครูมวยยื่นเสื้อกันฝนให้แล้วชี้ไปทางลานวิ่งตอนเที่ยง"
    choices:
      - id: cut
        text: "อดน้ำ วิ่งกลางแดดจนผ่านตาชั่ง"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {health: 1.3}}, text: "ผ่านตาชั่งพอดี ชนะไฟต์นั้น ครูมวยบอกว่าปีหน้าจะส่งไปเวทีใหญ่ในเมือง", effects: {health: -2, happiness: 1, money: {unit: income_x, amount: 0.1}}, sets_flags: [boxer_ranked], schedules: [{event: boxer_bigstage_01, after_years: [1, 2]}, {event: boxer_gamble_01, after_years: [1, 2]}], merit: [{cat: neutral}]}
          - {weight: 1, text: "ผ่านตาชั่งแต่ไม่มีแรงเหลือ แพ้ตั้งแต่ยกสอง กลับมานอนซมสามวัน", effects: {health: -3, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: move_up
        text: "ขอขึ้นรุ่นตามตัว"
        outcomes:
          - {weight: 1, ok: true, text: "เจอคู่ตัวใหญ่แต่ชกได้เต็มแรง ชนะ ครูมวยยอมส่งชื่อเข้าเวทีในเมือง", effects: {health: 1, happiness: 1}, sets_flags: [boxer_ranked], schedules: [{event: boxer_bigstage_01, after_years: [2, 2]}], merit: [{cat: neutral}]}
          - {weight: 2, text: "ค่ายไม่พอใจ ไม่มีคนจัดคู่ให้อีกหลายเดือน", effects: {relations: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quit
        text: "แขวนนวม กลับไปเรียนต่อ"
        clears_flags: [boxer_camp]
        effects: {knowledge: 1, happiness: 1, network: -1}
        merit: [{cat: neutral}]
      - id: eat_first
        text: "กินข้าวเหนียวก่อน ค่อยคิด"
        effects: {happiness: 2, relations: -1}
        merit: [{cat: neutral}]

