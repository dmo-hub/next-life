# สายนักมวยเด็กค่าย (ใบ 252 จากร่าง 212)
# ฐาน next-life origin/main 53bca785 · prefix boxer_ (กันไว้ให้เลนนี้ · การ์ด 238 sport_waikhru_tv_01 เป็นมุมคนดูทีวี ไม่ซ้ำฉาก)
# เปิดทุกเพศ ทุกฐานะ · ใบเข้าค่ายเด็กเอียงฐานะจน ×2 (ที่มา: "ไม่มีทางเลือก" ของอดีตนักมวย) · เอียงธง sporty ของเดิม ×2
# เวทีใหญ่ใบเดียวทุกเพศ ไม่พูดเรื่องข้อห้ามผู้หญิง (เจ้าของเลือก 2026-11-06 · ข้อเท็จจริงปี 2565 อยู่ในไฟล์รีเสิร์ช)
# เจ้าของเลือก 2026-11-06: ลงทุกใบ (13 หลังรวมเวทีใหญ่) · ใบวัยรุ่น w3 · ใบเข้าค่ายเด็กคูณฐานะจน ×2
# ไต่ขั้นด้วยธง + นัด: เข้าค่าย → ไฟต์แรก 1 ปี → คุมพิกัด 2–3 ปี → เวทีใหญ่ 1–2 ปี + พนัน → ค่าตัว · ใบกองถือธงรอบข้าง
# ใบนัดล้วนไม่มี weight · เพดานอายุใบนัดกว้างกว่าใบต้นทาง เพราะนัดที่ when ไม่ผ่านตกเงียบ
# decisions 414: เส้นต้นอยู่เด็ก/วัยรุ่นตามจริง ปลายสายกระจาย ทำงาน 2 กลางคน 2 ชรา 1
# ไม่มีชื่อคน ค่าย เวที รายการ หรือแบรนด์จริง · ไม่เล่าเด็กตายบนเวที · ไม่สอนวิธีล้มมวย/โกงตาชั่ง
events:
  - id: boxer_kid_01
    type: A
    category: work_money
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    multipliers: {flags: {sporty: 2}, class: {ยากไร้: 2, ยากจนมาก: 2, ยากจน: 2}}
    when: {age: [8, 12]}
    title: "ค่ายมวยท้ายหมู่บ้าน"
    text: "ค่ายมวยท้ายหมู่บ้านรับเด็กไปกินนอนซ้อม ตื่นเช้ามืดวิ่งรอบทุ่ง เย็นเตะกระสอบ ครูมวยบอกว่าเด็กรุ่นคุณขึ้นชกงานวัดได้เงินกลับบ้านแล้ว คนในบ้านเงียบกันไปพักหนึ่งก่อนหันมาถามคุณ"
    choices:
      - id: move_in
        text: "ย้ายไปกินนอนที่ค่าย"
        sets_flags: [boxer_camp, sporty]
        effects: {health: 2, relations: -1, knowledge: -1}
        schedules: [{event: boxer_temple_01, after_years: [1, 1]}]
        merit: [{cat: neutral}]
      - id: after_school
        text: "ไปซ้อมแค่ตอนเย็นหลังเลิกเรียน"
        sets_flags: [boxer_camp, sporty]
        effects: {health: 1}
        schedules: [{event: boxer_temple_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]
      - id: stay_school
        text: "ไม่ไป อยากเรียนหนังสือ"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: water_boy
        text: "ไปเป็นเด็กถือถังน้ำข้างเวที"
        effects: {happiness: 1, network: 1}
        merit: [{cat: neutral}]

  - id: boxer_temple_01
    type: A
    category: work_money
    stage: เด็ก
    years: [2500, 2650]
    when: {age: [9, 19], flags: {has: [boxer_camp]}}
    title: "ไฟต์แรกในงานวัด"
    text: "เวทีชั่วคราวในงานวัดตั้งอยู่ข้างชิงช้าสวรรค์ ครูมวยเอากระดาษให้ผู้ใหญ่ที่บ้านเซ็นตั้งแต่เช้า คู่ชกตัวเท่ากันแต่ชกมาแล้วหลายไฟต์ ซองค่าตัวไม่กี่ร้อยบาท ค่ายหักไปส่วนหนึ่ง คนดูรอบเวทีตะโกนราคากันเสียงดังกว่าเพลงปี่"
    choices:
      - id: fight
        text: "ขึ้นชกตามที่ซ้อมมา"
        sets_flags: [boxer_fought]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {health: 1.3}}, text: "ชนะคะแนน ซองแรกในชีวิตเอากลับไปให้ที่บ้านเกือบหมด เก็บไว้เองแค่ค่าน้ำแข็งใส", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: 0.05}}, schedules: [{event: boxer_weight_01, after_years: [2, 3]}], merit: [{cat: neutral}]}
          - {weight: 1, text: "แพ้คะแนน ตาบวมไปสามวัน ครูมวยบอกว่าไฟต์หน้าค่อยเอาคืน", effects: {health: -1, happiness: -1}, schedules: [{event: boxer_weight_01, after_years: [3, 3]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_year
        text: "ขอซ้อมอีกปีก่อนขึ้นชก"
        effects: {health: 1, relations: -1}
        schedules: [{event: boxer_temple_01, after_years: [1, 1]}]
        merit: [{cat: neutral}]
      - id: quit
        text: "ไม่ชกแล้ว กลับบ้าน"
        clears_flags: [boxer_camp]
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: ferris
        text: "แอบไปขึ้นชิงช้าสวรรค์ก่อนชก"
        sets_flags: [boxer_fought]
        effects: {happiness: 2, health: -1}
        schedules: [{event: boxer_weight_01, after_years: [3, 3]}]
        merit: [{cat: neutral}]

