# สัตว์เลี้ยง (B44): ได้มา (รับจร = บุญเล็กน้อย ไม่มีค่าตัว · ซื้อพันธุ์ = เงินออก ไม่มีบุญ) · ป่วย · หาย · ทิ้ง (บาป) · ส่งท้าย
# ผลรายปี (ความสุข · ค่าเลี้ยง · พาเดิน) แกนคิดเองใน family.mjs · การ์ดนี้มีแค่จังหวะที่ต้องเลือก
events:
  - id: pet_stray_kid_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {family: [{role: pet, alive: true, count: [0, 0]}]}
    title: "หมาหลงมาหน้าบ้าน"
    text: "ลูกหมาผอมโซเดินตามคุณกลับจากตลาดจนถึงหน้าบ้าน นั่งกระดิกหางอยู่หน้าประตูไม่ยอมไปไหน ผู้ใหญ่ในบ้านยืนกอดอกมองอยู่ที่ชาน"
