    choices:
      - id: smear
        text: "ถกแขนเสื้อ ฉาบลานกับพ่อ"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: tarp
        text: "ขอปูผ้าใบตากแทน ไม่ต้องรอ"
        outcomes:
          - {weight: 1, ok: true, text: "ข้าวบนผ้าใบแห้งทันกำหนด พ่อหยิบเมล็ดขึ้นมากัดแล้วพยักหน้าครั้งเดียว", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผ้าใบอบร้อนจนข้าวด้านล่างชื้น ต้องย้ายไปตากลานของพ่ออีกรอบ วันลาหมดพอดี", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: extend_leave
        text: "ลางานเพิ่ม อยู่จนข้าวแห้ง"
        outcomes:
          - {weight: 1, ok: true, text: "ข้าวบนลานแห้งไวจริง พื้นอุ่นแต่ไม่ร้อน พ่อสอนวิธีกลับข้าวเป็นคลื่นด้วยคราดไม้", effects: {knowledge: 1, relations: 2, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หัวหน้ายอมเซ็นลาแต่หักเบี้ยขยันทั้งเดือน", effects: {relations: 1, money: {unit: income_x, amount: -0.15}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: race_smear
        text: "ท้าญาติแข่งฉาบใครเรียบกว่า"
        outcomes:
          - {weight: 1, ok: true, text: "ลานฝั่งคุณเรียบจนป้าข้างบ้านขอยืมตัวไปฉาบลานบ้านแกต่อ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รีบจนลื่นนั่งลงกลางลาน รอยก้นประทับอยู่บนลานไปทั้งฤดู", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: crop_home_plot_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [24, 30], region: [กลาง, ตะวันออก, ตะวันตก, เหนือ, ตะวันออกเฉียงเหนือ, ใต้], family: [{role: parent, sex: หญิง, alive: true}]}
    title: "แปลงผักวันหยุด"
    text: "คุณทำงานประจำในอำเภอ เสาร์อาทิตย์กลับไปช่วยแม่ดูแปลงผักหลังบ้าน ตำราเกษตรที่ยืมห้องสมุดมาบอกให้ยกร่องเว้นระยะ แม่หว่านเมล็ดแน่นตามที่ยายสอน ผักกาดสองแปลงขึ้นคนละหน้าตา แม่ถามว่าอ่านมาแล้วจะเอาแบบไหน"
    choices:
      - id: by_book
        text: "ยกร่องตามตำราทั้งแปลง"
        outcomes:
          - {weight: 1, ok: true, text: "ผักกาดแปลงยกร่องต้นอวบ เก็บได้ทีละครึ่งแปลง แม่เอาไปอวดป้าข้างบ้าน", effects: {knowledge: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร่องสวยแต่รดน้ำไม่ทั่ว ผักแถวนอกเหี่ยวทั้งแถว แม่ไม่ว่าอะไร แค่หว่านซ่อมให้", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: by_mom
        text: "ปลูกแบบแม่ ไม่เถียง"
        effects: {relations: 2}
        merit: [{cat: neutral}]
      - id: split
        text: "แบ่งครึ่งแปลง ลองทั้งสองแบบ"
        outcomes:
          - {weight: 1, ok: true, text: "สองแปลงได้ผลพอ ๆ กัน คุณกับแม่เถียงกันเรื่องรสชาติจนข้าวเย็นหมดหม้อ", effects: {relations: 1, knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หนอนลงทั้งสองแปลงในคืนเดียว แม่บอกว่าอย่างน้อยหนอนก็ไม่เลือกข้าง", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: scarecrow
        text: "ตั้งหุ่นไล่กาใส่ชุดทำงานตัวเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าข้างบ้านทักหุ่นว่ากลับมาแล้วเหรอ แม่หัวเราะจนต้องนั่งลง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อีกาเกาะหัวหุ่นทุกเช้า คนในซอยเริ่มเรียกหุ่นด้วยชื่อเล่นของคุณ", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: rest
        text: "บอกแม่ว่าวันหยุดขอพัก"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: crop_harvest_help_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
