events:
  - id: crop_buffalo_graze_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [8, 12], region: [กลาง, ตะวันออก, ตะวันตก, เหนือ, ตะวันออกเฉียงเหนือ, ใต้]}
    title: "จูงควายให้ตาบ้านถัดไป"
    text: "ตาบ้านถัดไปเข่าไม่ดี ฝากให้คุณจูงควายตัวเมียของแกไปเล็มหญ้าคันนาหลังเลิกเรียน ได้ค่าขนมวันละเหรียญ ตาบ่นว่าควายในซอยเหลือน้อยลงทุกปี ตัวนี้แกจะไม่ขาย จะเลี้ยงไว้ให้ลูกควายรุ่นต่อไปได้ไถนาต่อ"
    choices:
      - id: every_evening
        text: "รับงาน จูงทุกเย็นไม่ขาด"
        effects: {relations: 1, health: 1, happiness: -1, money: {unit: income_x, amount: 0.02}}
        merit: [{cat: neutral}]
      - id: listen_tales
        text: "จูงไปแล้วนั่งฟังตาเล่า"
        outcomes:
          - {weight: 1, ok: true, text: "ตาเล่าปีที่ควายพาว่ายข้ามคลองตอนน้ำหลาก ฟังเพลินจนกลับบ้านพร้อมพระจันทร์", effects: {knowledge: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ฟังเพลินจนควายเดินไปเล็มข้าวในนาลุงท้ายซอย ต้องไปขอโทษพร้อมตา", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bring_friend
        text: "ชวนเพื่อนมาช่วย แบ่งค่าขนม"
        effects: {network: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: ride_home
        text: "ขี่หลังควายกลับบ้านอย่างเท่"
        outcomes:
          - {weight: 1, ok: true, text: "ควายเดินช้า ๆ พาคุณผ่านหน้าบ้านทุกหลังในซอย เด็กบ้านอื่นมองตามตาละห้อย", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ควายหยุดกินหญ้ากะทันหัน คุณไถลลงแอ่งโคลนทั้งตัว เดินกลับบ้านเลอะถึงหู", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: crop_cane_market_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [14, 18]}
    title: "น้ำอ้อยตีสี่"
    text: "ป้าข้างบ้านปลูกอ้อยไว้คั้นน้ำขายตลาดนัดเช้าวันเสาร์ ขาดคนหมุนเครื่องหีบ ให้ค่าแรงรายวันกับน้ำอ้อยกินไม่อั้น ต้องตื่นตีสี่ไปปอกเปลือกอ้อยหน้าแผง แผงติดกันเป็นร้านวุ้นของน้าอีกคนที่ชอบแซวเด็กหนุ่มสาว"
    choices:
      - id: crank
        text: "ไปหมุนเครื่องหีบทุกเสาร์"
        effects: {money: {unit: income_x, amount: 0.05}, health: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: call_out
        text: "ยืนเรียกลูกค้าหน้าแผง"
        outcomes:
          - {weight: 1, ok: true, text: "เสียงคุณดังข้ามไปถึงแผงหมูปิ้ง คนเดินตลาดแวะซื้อจนป้าต้องคั้นเพิ่มอีกถัง", effects: {network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตะโกนแข่งกับแผงข้าง ๆ ทั้งเช้า วันจันทร์ไปโรงเรียนเสียงแหบจนตอบชื่อในห้องไม่ได้", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: cane_jelly
        text: "เสนอเอาน้ำอ้อยไปทำวุ้นขาย"
        outcomes:
          - {weight: 1, ok: true, text: "วุ้นน้ำอ้อยหมดถาดก่อนเก้าโมง ป้ากับน้าร้านวุ้นตกลงแบ่งกำไรให้คุณ", effects: {money: {unit: income_x, amount: 0.05}, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วุ้นไม่แข็งตัวทั้งถาด ป้ายิ้มแห้ง ๆ ยกให้คุณกินเป็นน้ำหวาน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: drink_all
        text: "ดื่มน้ำอ้อยแทนข้าวเช้าทุกแก้ว"
        outcomes:
          - {weight: 1, ok: true, text: "ตื่นตัวทั้งเช้า หมุนเครื่องเร็วจนป้าต้องวิ่งหาอ้อยมาเติม", effects: {happiness: 1, money: {unit: income_x, amount: 0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แก้วที่หกคุณหายไปห้องน้ำหลังตลาดสามรอบ ป้าหมุนเครื่องเองครึ่งเช้า", effects: {health: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: sleep_in
        text: "ขอนอนต่อ ไม่รับงาน"
        effects: {health: 1}
        merit: [{cat: neutral}]

  - id: crop_dung_floor_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [22, 30], region: [กลาง, ตะวันออก, ตะวันตก, เหนือ, ตะวันออกเฉียงเหนือ, ใต้], family: [{role: parent, sex: ชาย, alive: true}]}
