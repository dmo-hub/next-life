        merit: [{cat: neutral}]
      - id: somtam
        text: "หอบส้มตำครกใหญ่ไปแทนแรง"
        outcomes:
          - {weight: 1, ok: true, text: "ส้มตำถูกยกไปวางกลางคันนา คนเกี่ยวทั้งทุ่งพักก่อนเวลาครึ่งชั่วโมง ลุงนับว่าหายกัน", effects: {relations: 1, happiness: 2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงกินจนหมดครกแล้วขอบใจ ก่อนเปิดสมุดชี้ว่าส้มตำยังไม่นับเป็นแรง", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: crop_coop_shop_01
