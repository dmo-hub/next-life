        text: "เสนอตั้งชื่อร้านในที่ประชุม"
        outcomes:
          - {weight: 1, ok: true, text: "ชื่อที่คุณเสนอชนะขาด ป้ายไม้เขียนมือแขวนหน้าร้าน คนเรียกร้านตามชื่อนั้นจนเด็กในหมู่บ้านคิดว่าเป็นชื่อคุณ", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
