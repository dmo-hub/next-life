        merit: [{cat: neutral}]
      - id: credit_book
        text: "ขอเป็นคนจดบัญชีเงินเชื่อ"
        outcomes:
          - {weight: 1, ok: true, text: "สมุดเงินเชื่อลายมือคุณเรียบร้อยจนกรรมการเอาไปเป็นแบบ ปีหน้าชวนมาช่วยทำบัญชีทั้งร้าน", effects: {network: 2, knowledge: 1}, merit: [{cat: neutral}]}
