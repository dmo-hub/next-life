      - id: roster
        text: "เขียนตารางเวรแปะหัวเตียง"
        outcomes:
          - {weight: 1, ok: true, text: "ทุกคนได้คืนละรอบ ญาติที่ไม่ค่อยคุยกันได้นั่งกินข้าวหน้าตึกด้วยกันทุกเย็น", effects: {relations: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อาคนหนึ่งขีดชื่อตัวเองออก แล้วเขียนชื่อคุณแทนไว้สองคืน", effects: {relations: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: send_money
        text: "ส่งค่าข้าวแทนการเฝ้า"
        effects: {relations: -1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: two_under_bed
        text: "แอบนอนสองคนบนเสื่อใต้เตียง"
        outcomes:
          - {weight: 1, ok: true, text: "พยาบาลเวรดึกเดินผ่านแล้วทำเป็นมองไม่เห็น พ่อหลับสบายเพราะมีคนคุยด้วยสองคน", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เสียงกรนจากใต้เตียงดังจนเตียงข้าง ๆ ร้องเรียน ทั้งสองคนถูกเชิญออกตอนตีสอง", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

