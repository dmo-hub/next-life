        text: "ไปวัดสายตาที่ร้านแว่น"
        effects: {health: 1, happiness: 1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: stretch_on
        text: "ฝืนยืดแขนต่อไป"
        effects: {health: -1, happiness: -1}
        merit: [{cat: neutral}]
      - id: share_glasses
        text: "ยืมแว่นเพื่อนข้างโต๊ะใส่เป็นกะ"
        outcomes:
          - {weight: 1, ok: true, text: "ค่าสายตาตรงกันพอดี ตกลงแบ่งกันใส่ เช้าคุณ บ่ายเขา", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนสายตาสั้น ใส่แล้วพื้นห้องเอียง เดินชนประตูกระจกต่อหน้าหัวหน้า", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: patient_one_chair_01
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45], family: [{role: parent, sex: ชาย, alive: true}]}
    title: "เก้าอี้พับข้างเตียงตัวเดียว"
    text: "พ่อนอนพักฟื้นหลังผ่าตัดไส้เลื่อนห้าคืนในหอผู้ป่วยรวม ป้ายหน้าประตูเขียนว่าเฝ้าไข้กลางคืนได้หนึ่งคนต่อเตียง ญาติมากันเต็มม้านั่งหน้าตึก ทุกคนอยากอยู่ แต่ข้างเตียงมีเก้าอี้พับแค่ตัวเดียว"
    choices:
      - id: stay_all
        text: "ลางานเฝ้าเองทุกคืน"
        effects: {relations: 2, health: -1, money: {unit: income_x, amount: -0.03}}
