# ร่างเรื่อง สุขภาพและโรงพยาบาลจากมุมคนไข้ · 15 ใบ · ลงเกมแล้ว ใบ 243 จากร่าง 242 · แก้ตามข้อค้านรอบ 1
events:
  - id: patient_smelling_salts_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [19, 30]}
    title: "ยาดมหนึ่งฟุดบนรถเมล์"
    text: "เดือนเมษา รถเมล์เปิดหน้าต่างทุกบานแต่ลมที่พัดเข้ามาร้อนพอ ๆ กับไอจากท่อ ยืนโหนราวมาครึ่งชั่วโมง ตาเริ่มพร่า หูอื้อ ป้าที่นั่งข้างประตูดึงหลอดยาดมออกจากกระเป๋าผ้า ยื่นให้โดยไม่พูดอะไร ดมหนึ่งฟุดโลกกลับมาชัด ป้าลงป้ายหน้าพร้อมยาดมของแก"
    choices:
      - id: buy_own
        text: "ซื้อหลอดยาดมพกติดกระเป๋า"
        effects: {health: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: borrow_always
        text: "ขอดมจากคนข้าง ๆ ทุกเที่ยว"
        outcomes:
          - {weight: 1, ok: true, text: "คนแปลกหน้าสายเดิมยื่นให้ทุกเช้า ผ่านไปเดือนเดียวรู้จักกันครึ่งคัน", effects: {network: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้หลอดของลุงที่ผสมพิมเสนแรงจัด จามสามทีติด น้ำตาไหลถึงป้ายลง", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: check_why
        text: "ไปตรวจว่าทำไมหน้ามืดบ่อย"
        outcomes:
          - {weight: 1, ok: true, text: "หมอถามสามข้อ ได้ความว่ากินข้าวเช้าไม่ทันกับนอนตีสอง สั่งให้กินก่อนออกจากบ้าน", effects: {health: 2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รอคิวครึ่งวัน หมอวัดความดันแล้วบอกว่าปกติดี ให้ดื่มน้ำเยอะ ๆ", effects: {happiness: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: get_off
        text: "เดินลงก่อนถึงป้าย ไปต่อในร่ม"
        outcomes:
          - {weight: 1, ok: true, text: "เจอร้านน้ำมะพร้าวใต้ร่มไม้ กลายเป็นทางเดินประจำทุกเช้าหน้าร้อน", effects: {health: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เดินเพลินจนเลยเวลาเข้างาน โดนหักค่าแรงครึ่งชั่วโมง", effects: {health: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: patient_balm_jar_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 18]}
    title: "ตลับยาหม่องบนหิ้งยาย"
    text: "วันรุ่งขึ้นหลังกีฬาสี น่องทั้งสองข้างตึงจนลงบันไดต้องเดินตะแคง ตลับยาหม่องประจำบ้านวางอยู่บนหิ้งข้างพระ ยายจำได้ว่าเหลือแค่ไหน เพราะใช้นิ้วก้อยปาดทีละนิดมาทั้งปี และเปิดดูทุกเย็นก่อนสวดมนต์"
    choices:
      - id: smear_all
        text: "ทาทั้งขาแล้วไปโรงเรียน"
        outcomes:
          - {weight: 1, ok: true, text: "เดินคล่องขึ้นตั้งแต่คาบสอง เพื่อนทั้งห้องตามกลิ่นมาขอแตะปลายนิ้วไปทาบ้าง", effects: {health: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กลิ่นฉุนลอยทั่วห้อง ครูเปิดหน้าต่างทุกบานแล้วถามว่าใครเป็นลม", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: smooth_over
        text: "ทาแล้วเกลี่ยให้ดูเต็มเท่าเดิม"
        outcomes:
          - {weight: 1, ok: true, text: "ยายเปิดตลับแล้วพยักหน้า ไม่ทักอะไร", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รอยนิ้วชี้ใหญ่กลางตลับฟ้องทุกอย่าง ยายย้ายตลับไปซ่อนที่ใหม่", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_grandma
        text: "ขอให้ยายบีบนวดให้"
        outcomes:
          - {weight: 1, ok: true, text: "ยายนวดไปเล่าเรื่องสมัยสาวไป เล่าจบสองเรื่องขาก็หายตึง", effects: {relations: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยายกดจุดกลางน่องแรงจนร้องลั่นบ้าน หมาข้างบ้านเห่ารับ", effects: {health: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tough_it
        text: "ทนเดินขาแข็งไปเอง"
        effects: {health: -1}
        merit: [{cat: neutral}]

  - id: patient_sachet_meds_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [46, 59], family: [{role: parent, sex: ชาย, alive: true}]}
    title: "ซองยาแก้ปวดจากร้านชำ"
    text: "พ่อปวดเอวมาหลายปี เช้านี้เห็นแกแกะซองยาจากร้านชำปากซอย ในซองมีเม็ดสีขาว สีเหลือง สีชมพูรวมกัน กินแล้วหายปวดในครึ่งชั่วโมงจริง แกว่าซองละไม่กี่บาท ถูกกว่าค่ารถไปหาหมอ ใต้ที่นอนมีซองเปล่ามัดหนังยางเป็นปึก"
    choices:
      - id: say_it
        text: "ทักตรง ๆ ว่าไม่สบายใจ"
        outcomes:
          - {weight: 1, ok: true, text: "พ่อเงียบไปนาน แล้วยื่นมัดซองเปล่าให้คุณเอาไปทิ้งเอง", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พ่อตอบว่ากินมาสิบปียังเดินตลาดได้ทุกเช้า แล้วไม่คุยด้วยไปสามวัน", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: pharmacist
        text: "พาไปร้านยาที่มีเภสัชกร"
        outcomes:
          - {weight: 1, ok: true, text: "เภสัชกรอ่านซองแล้วนิ่ง ก่อนอธิบายช้า ๆ พ่อฟังจนจบแล้วยอมเปลี่ยนยา", effects: {relations: 2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พ่อเถียงเภสัชกรกลางร้านว่าซองเก่าแรงกว่า เดินออกมามือเปล่า", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swap_vitamins
        text: "แอบสลับซองเป็นวิตามิน"
        outcomes:
          - {weight: 1, ok: true, text: "วันที่ห้าพ่อหน้ามืดกลางตลาด หมอซักจนรู้ว่ายาชุดถูกหยุดกะทันหัน สั่งให้ค่อย ๆ ลดยาภายใต้การดูแล พ่อเลยยอมไปตามนัด", effects: {health: -1, relations: 1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจ้าของร้านชำบอกพ่อว่าไม่เคยเปลี่ยนสูตร พ่อนับซองในถุงแล้วหันมามองคุณ", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: let_be
        text: "ปล่อยตามใจ แกโตแล้ว"
        effects: {happiness: -1}
        merit: [{cat: neutral}]

  - id: patient_bp_doorstep_01
    type: A
    category: health
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [35, 45]}
    title: "ผ้าพันแขนมาถึงหน้าบ้าน"
    text: "ป้าข้างบ้านที่ช่วยงานอนามัยตำบลเคาะประตูตั้งแต่เจ็ดโมง ถือสมุดรายชื่อกับเครื่องวัดความดันพร้อมผ้าพันแขน บอกว่าคนอายุสามสิบห้าขึ้นไปในซอยเหลือแค่คุณที่ยังไม่ได้วัด เสาร์นี้ศาลาหมู่บ้านมีหมออนามัยมาตรวจให้ฟรีด้วย"
    choices:
      - id: arm_now
        text: "ยื่นแขนวัดตรงหน้าประตูเลย"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวเลขปกติ ป้าจดลงสมุดแล้วรีบไปเคาะบ้านถัดไป คุณออกจากบ้านทันรถเที่ยวเดิม", effects: {health: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตัวเลขสูงกว่าเกณฑ์ ป้าอ่านออกเสียงดังจนบ้านฝั่งตรงข้ามโผล่หน้าต่างมาดู ข่าวไปถึงท้ายซอยก่อนคุณถึงที่ทำงาน", effects: {health: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: next_week
        text: "ผัดไปเสาร์หน้า"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: whole_soi
        text: "ชวนทั้งซอยไปศาลาพร้อมกัน"
        outcomes:
          - {weight: 1, ok: true, text: "ศาลาแน่นตั้งแต่แปดโมง ป้าจดชื่อไม่ทัน ยกให้คุณเป็นคนเรียกคิว", effects: {network: 2, relations: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ชวนได้สองคน มาเพราะนึกว่ามีข้าวต้มแจก พอรู้ว่าไม่มีก็กลับก่อนถึงคิว", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: three_coffees
        text: "ดื่มกาแฟสามแก้วก่อนไปวัด"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวเลขออกมาพอดีเกณฑ์ ป้าชมว่าใจแข็งแรงเหมือนหนุ่มสาว", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เข็มเด้งสูงจนป้าวัดซ้ำสามรอบ แล้วนัดมาวัดใหม่ทุกเช้าอีกหนึ่งสัปดาห์", effects: {happiness: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: patient_long_arm_01
    type: A
    category: health
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [38, 45]}
    title: "แขนยาวไม่พอ"
    text: "ช่วงนี้อ่านฉลากขวดยาต้องยืดแขนจนสุด ใบเสร็จตัวเล็กต้องเอาไปส่องใต้หลอดไฟ เพื่อนร่วมงานเห็นคุณถือหนังสือพิมพ์ห่างตัวเป็นศอก แซวว่ากำลังจะโยนทิ้งหรืออ่านอยู่ อายุ {อายุ} ตัวหนังสือในโลกเหมือนหดลงพร้อมกัน"
    choices:
