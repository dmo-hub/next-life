        text: "ซื้อแว่นสำเร็จรูปแผงตลาดนัด"
        outcomes:
          - {weight: 1, ok: true, text: "ลองสามอันได้อันที่ชัดพอดี ราคาเท่าข้าวสองจาน", effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อันที่ซื้อเลนส์สองข้างไม่เท่ากัน ใส่ครึ่งชั่วโมงปวดขมับ", effects: {health: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
