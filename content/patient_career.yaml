        effects: {health: 1, happiness: -1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: painkillers
        text: "กินยาแก้ปวดทนไปก่อน"
        effects: {health: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: temple_stairs
        text: "ขึ้นบันไดวัดร้อยขั้นพิสูจน์เข่า"
        outcomes:
          - {weight: 1, ok: true, text: "ถึงขั้นบนสุดทั้งที่หอบ ยืนมองทุ่งนาจากบนเขาแล้วยิ้มคนเดียว", effects: {happiness: 2}, merit: [{cat: neutral}]}
