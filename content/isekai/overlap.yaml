# การ์ดต่างโลกขั้นค่าซ้อนทับ (โลกซ้อนทับ ใบ 15): ออกเฉพาะชาติที่ตระกูลค่าซ้อนทับขั้น ≥ 1 ตอนข้าม · รูปเดียวกับ deck-sample.yaml
cards:
  - id: cp_overlap_familiar
    power: major
    ch: [2, 3]
    overlap_stage: [1, 4]
    title: หน้าคุ้น
    text: นักบันทึกพงศาวดารของ{major}จ้องหน้าคุณนานผิดปกติ แล้วเปิดสมุดเก่าให้ดู ในนั้นวาดคนหน้าตาคล้ายคุณ เขียนกำกับว่า "ผู้มาจากอีกฟาก"
    choices:
      - t: บอกว่าแค่หน้าโหล
        fx: { luk: 1 }
        text: เขาพยักหน้าช้า ๆ แต่ยังแอบร่างหน้าคุณลงสมุดอีกหน้าหนึ่ง
      - t: ถามว่าคนในรูปไปไหนต่อ
        stat: cha
        tag: talk
        dc: 12
        win: { fx: { fame: 3, mag: 1 }, text: เขาเล่าว่าคนในรูปหายไปกลางพิธีบวงสรวง ทิ้งไว้แค่รองเท้าแตะคู่หนึ่งที่ไม่มีใครในโลกนี้ทำเป็น }
        lose: { fx: { gold: -10 }, text: เขาขอค่าดูสมุดย้อนหลัง บอกว่าหน้าคุ้นไม่ได้แปลว่าดูฟรี }
      - t: ขอซื้อหน้านั้นจากสมุด
        fx: { gold: -15, mag: 1 }
        text: เขาฉีกให้อย่างเสียดาย กลางดึกคุณเอาหน้านั้นมาดูอีกที เส้นหมึกดูจะขยับตามหน้าคุณเล็กน้อย
      - t: รีบเดินจากไปก่อนถูกถามต่อ
        fx: { fame: -1, hp: 2 }
        text: คุณเลี่ยงตลาดนั้นอยู่หลายวัน ได้พักเท้าเต็มที่ แต่ได้ยินว่ามีคนเริ่มถามหาคนหน้าเหมือนในสมุด
