# พิธีไทยในต่างโลก (โลกซ้อนทับ ใบ 29): ออกเฉพาะชาติที่ตระกูลค่าซ้อนทับขั้น ≥ 1 ตอนข้าม · ขั้น 0 ออก 0
# บุญลงหมวดตามคติเดิม (dana/sila/bhavana/help_others) ไม่เพิ่มหมวดเฉพาะต่างโลก — เลขหมวดบนหน้าเว็บต้องไม่เปลี่ยน (decisions 73)
cards:
  - id: cp_rite_alms
    power: major
    ch: [2, 3]
    overlap_stage: [1, 4]
    title: ข้าวปั้นตอนเช้า
    text: คุณตื่นก่อนไก่ ปั้นข้าวใส่ใบไม้ แล้วยืนรอริมถนนโดยไม่รู้ตัวว่ากำลังรออะไร ที่{major}ไม่มีใครเดินบิณฑบาต มีแค่เด็กขอทานคนหนึ่งยืนมองข้าวห่อนั้นตาไม่กะพริบ
    choices:
      - t: ยื่นข้าวให้เด็กทั้งห่อ
        merit: [{ cat: dana, level: 1 }]
        fx: { gold: -5, luk: 1 }
        text: เด็กรับไปด้วยสองมือ แล้วยกขึ้นเหนือหัวก่อนกิน ท่าทางเหมือนเคยเห็นใครทำมาก่อน
      - t: กินเองแล้วเดินต่อ
        fx: { hp: 2 }
        text: ข้าวอร่อยดี แต่ทั้งวันคุณรู้สึกเหมือนลืมอะไรไว้ข้างหลัง
  - id: cp_rite_chant
    power: falling
    ch: [1, 2, 3]
    overlap_stage: [1, 4]
    title: บทสวดก่อนนอน
    text: คืนหนึ่งคุณพึมพำบทสวดที่แม่สอนตั้งแต่เด็กโดยไม่ตั้งใจ ห้องพักข้าง ๆ เงียบลงทีละห้อง เจ้าของโรงเตี๊ยมแง้มประตูมาถามว่า นั่นภาษาของ{falling}หรือเปล่า
    choices:
      - t: สวดต่อให้จบทั้งบท
        merit: [{ cat: bhavana, level: 1 }]
        fx: { cha: 1 }
        text: เขายืนฟังจนจบแล้วเดินกลับโดยไม่พูดอะไร เช้าถัดมามีน้ำชาร้อนวางไว้หน้าห้อง
      - t: บอกว่าแค่ละเมอ
        fx: { luk: -1 }
        text: เขาพยักหน้าแต่จ้องคุณนานกว่าปกติ
  - id: cp_rite_soulcall
    power: rising
    ch: [2, 3]
    overlap_stage: [1, 4]
    title: เรียกขวัญเด็ก
    text: เด็กข้างบ้านไข้ขึ้นมาสามวัน หมอยาของ{rising}บอกว่าหมดทางแล้ว แม่เด็กเห็นคุณทำท่าแปลก ๆ ตอนมาเยี่ยมเลยถามว่า ที่บ้านเกิดเขามีวิธีอะไรไหม
    choices:
      - t: ทำพิธีเรียกขวัญตามที่จำได้
        stat: cha
        tag: talk
        dc: 12
        merit: [{ cat: help_others, level: 1 }]
        win: { fx: { fame: 3, luk: 1 }, text: คุณผูกด้ายที่ข้อมือเด็กแล้วเรียกชื่อเขาสามรอบ เช้าวันรุ่งไข้ลด แม่เด็กเล่าเรื่องนี้ไปทั่วย่าน }
        lose: { fx: { gold: -10 }, text: เด็กไม่ได้ดีขึ้นทันตา แม่เด็กยังขอบคุณ แต่คุณเสียค่าของไหว้ไปเกือบหมดกระเป๋า }
      - t: ไปตามหมอยามาอีกคน
        fx: { gold: -15 }
        text: หมอยาคนที่สองมาถึงตอนไข้เริ่มลดเอง ไม่มีใครรู้ว่าอะไรช่วยเด็กไว้
  - id: cp_rite_precepts
    power: major
    ch: [3]
    overlap_stage: [1, 4]
    title: งดเหล้าวันพระ
    text: เจ้าภาพงานเลี้ยงที่{major}รินเหล้าให้ทุกคนในวงตามธรรมเนียม ถึงคิวคุณพอดีกับที่นึกขึ้นได้ว่าวันนี้ตรงกับวันพระของบ้านเกิด
    choices:
      - t: ขอน้ำเปล่าแทน
        merit: [{ cat: sila, level: 1 }]
        fx: { cha: -1, fame: 1 }
        text: ทั้งวงมองคุณเป็นตาเดียว แต่เจ้าภาพส่งน้ำมาให้พร้อมรอยยิ้มแปลก ๆ แล้วจดอะไรบางอย่างลงสมุด
      - t: ดื่มตามมารยาท
        fx: { cha: 1, hp: -2 }
        text: งานเลี้ยงสนุกขึ้นทันที แต่เช้าวันรุ่งคุณหัวหนักจนนึกชื่อตัวเองไม่ออกครึ่งชั่วโมง
