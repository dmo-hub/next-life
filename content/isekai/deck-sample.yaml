# กองการ์ดทวีป (06c-2): ตัวอย่างชนิดละใบ — แคว้น · ข้อพิพาท · ขั้วอำนาจ · เนื้อเต็มมากับ 06c-3
# รูปเดียวกับการ์ดต่างโลกใน src/engine/isekai.mjs · ด่านอยู่ที่ src/node/lint/isekai.mjs
cards:
  - id: cr_helvard_window
    regions: [helvard]
    ch: [2, 3]
    title: ภาษีหน้าต่าง
    text: ขุนนางเจ้าที่ดินประกาศเก็บภาษีตามจำนวนหน้าต่าง ทั้งซอยเริ่มก่ออิฐปิดหน้าต่างกันคนละบาน บ้านคุณมีอยู่เจ็ดบาน
    choices:
      - t: ก่ออิฐปิดให้เหลือบานเดียว
        fx: { gold: 20, hp: -3 }
        text: ประหยัดภาษีได้จริง แต่ในบ้านมืดจนเดินชนเก้าอี้ทุกเช้า
      - t: ไปเถียงกับคนเก็บภาษี
        stat: cha
        tag: talk
        dc: 12
        win: { fx: { fame: 3 }, text: คุณชี้ว่าประตูหลังบ้านมีกระจก ตามกฎต้องนับเป็นประตู เขางงจนยอมลดให้ทั้งซอย }
        lose: { fx: { gold: -30 }, text: เขาจดเพิ่มอีกบานเพราะนับรูกุญแจด้วย }
  - id: cd_throne_war_levy
    dispute: throne_war
    ch: [2, 3]
    title: เกณฑ์คนไปรบ
    text: ข่าว{dispute}ลามมาถึง{land} ทหารสองฝ่ายมาตั้งโต๊ะเกณฑ์คนคนละฝั่งถนน ต่างฝ่ายต่างบอกว่าเจ้าชายของตัวเองเป็นตัวจริง
    choices:
      - t: สมัครฝั่งที่แจกขนมปังก่อน
        fx: { str: 2, hp: -8, gold: 15 }
        text: ขนมปังแข็งจนใช้ต่างโล่ได้ คุณกลับมาพร้อมแผลเป็นกับเรื่องเล่าที่ไม่มีใครเชื่อ
      - t: ช่วยชาวบ้านหนีไปซ่อนในโรงนา
        stat: luk
        tag: sneak
        dc: 11
        merit: [{ cat: help_others, level: 1 }]
        win: { fx: { fame: 4 }, text: ทหารเดินผ่านโรงนาไปสองรอบ ไม่มีใครคิดจะมองหลังกองฟาง }
        lose: { fx: { hp: -10 }, text: ไก่ในโรงนาร้องลั่น ทุกคนโดนลากไปขุดสนามเพลาะคนละสามวัน }
  - id: cp_major_envoy
    power: major
    ch: [2, 3]
    title: ทูตจากมหาอำนาจ
    text: ขบวนทูตจาก{major}ผ่านเมือง ขอคนนำทางหนึ่งคน ค่าจ้างดี แต่ทูตพูดไม่หยุดเรื่องว่า{major}ยิ่งใหญ่แค่ไหน
    choices:
      - t: รับงานนำทาง
        fx: { gold: 40, cha: 1 }
        text: ได้เงินครบ แถมจำประวัติศาสตร์ของ{major}ได้ขึ้นใจโดยไม่ได้ตั้งใจ
      - t: ขอค่าจ้างเป็นจดหมายรับรองแทน
        stat: cha
        tag: trade
        dc: 13
        win:
          fx: { fame: 5 }
          text: จดหมายตราประทับของ{major}เปิดประตูให้ได้หลายบาน คนเริ่มเรียกคุณว่าเพื่อนของทูต
        lose: { fx: { luk: -1 }, text: ทูตเขียนให้จริง แต่ลายมือเขาอ่านไม่ออกแม้แต่ตัวเขาเอง }
