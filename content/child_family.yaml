# กลุ่ม kid_ · ช่วงวัยเด็ก 0–12 · เด็กเลือกเอง ผู้ใหญ่อยู่ในเนื้อความ/ผลลัพธ์ · ตั้งธงที่ส่งผลตอนโต (likes_clips good_student sporty bullied) · broken_home ใช้ในไฟล์นี้ (kid_bullied_01)
events:
  - id: kid_clips_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [8, 12], family: [{role: parent, sex: หญิง, alive: true}]}
    title: "ผู้กำกับตัวจิ๋ว"
    text: "อายุ {อายุ} ขวบ แอบยืมโทรศัพท์แม่ไปถ่ายแมวเต้น ตัดต่อใส่เพลงเองจนตีหนึ่ง เช้ามาพ่อแม่เจอคลิปเต็มเครื่อง ถามว่าจะเอายังไงกับเรื่องนี้"
    choices:
      - text: "เก็บค่าขนมซื้อมือถือมือสองเอง"
        effects: {knowledge: 1, health: -1, money: {unit: income_x, amount: -0.2}}
        sets_flags: [likes_clips]
        merit: [{cat: neutral}]
      - text: "คืนโทรศัพท์แม่ ออกไปวิ่งเล่น"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - text: "แอบโพสต์คลิปแมวลงเน็ต"
        outcomes:
          - {weight: 1, ok: true, text: "คลิปแมวเต้นยอดวิวทะลุล้าน คนทั้งซอยจำหน้าได้", effects: {happiness: 3}, sets_flags: [likes_clips], next: kid_clips_fame_01, merit: [{cat: neutral}]}
          - {weight: 3, text: "มีคนดูเจ็ดคน หกคนคือญาติ", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ขอแม่ไปเรียนวาดรูปแทน"
        effects: {knowledge: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]

  - id: kid_tutor_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    when: {age: [7, 12], school: [primary, lower], family: [{role: parent, alive: true}]}
    title: "คอร์สกวดวิชาสุดสัปดาห์"
    text: "เพื่อนร่วมห้องทุกคนเรียนพิเศษ เสาร์อาทิตย์หายไปหมด ครูประจำชั้นบอกพ่อแม่ว่า '{ชื่อ}หัวไว แต่ขี้เกียจ'"
    choices:
      - text: "ขอเรียนพิเศษเหมือนเพื่อนทุกคน"
        requires: {money: {unit: income_x, amount: 0.8}, reason: "ที่บ้านไม่มีเงินพอค่าคอร์ส"}
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {knowledge: 2}}, text: "คะแนนพุ่งติดอันดับต้นของชั้น", effects: {knowledge: 3, happiness: -1}, sets_flags: [good_student], merit: [{cat: neutral}]}
          - {weight: 1, text: "เรียนหนักจนป่วยบ่อย เกลียดหนังสือไปเลย", effects: {health: -2, happiness: -2}, merit: [{cat: neutral}]}
        effects: {money: {unit: income_x, amount: -0.8}}
        merit: [{cat: neutral}]
      - text: "นั่งทำการบ้านกับพ่อแม่ทุกคืน"
        effects: {knowledge: 2, relations: 2, happiness: -1}
        sets_flags: [good_student]
        merit: [{cat: neutral}]
      - text: "เสาร์อาทิตย์ขอเล่นเต็มที่"
        effects: {happiness: 2, health: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - text: "ไปช่วยพ่อแม่ขายของแทน"
        effects: {knowledge: 1, relations: 1, money: {unit: income_x, amount: 0.2}}
        merit: [{cat: neutral}]

  - id: kid_sport_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 12], school: [primary, lower]}
    title: "แมวมองข้างสนาม"
    text: "โค้ชประจำอำเภอเห็นคุณวิ่งไล่หมาทั้งสนามโรงเรียน เลยมาชวนเข้าทีมกีฬา ซ้อมทุกเย็นหกโมงถึงสองทุ่ม"
    choices:
      - text: "เข้าทีม ซ้อมจริงจังทุกเย็น"
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 2}}, text: "ได้เหรียญทองระดับจังหวัด ร่างกายแข็งแรงขึ้นทุกปี", effects: {health: 2, happiness: 2}, sets_flags: [sporty], next: kid_sport_school_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "ล้มเข่าพลิกกลางสนาม ต้องเข้าเฝือกครึ่งปี", effects: {health: -3, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "เล่นแค่สนุก ๆ กับเพื่อนตอนเย็น"
        effects: {health: 1, happiness: 1}
        sets_flags: [sporty]
        merit: [{cat: neutral}]
      - text: "ปฏิเสธโค้ช กลัวเรียนไม่ทันเพื่อน"
        effects: {knowledge: 1, health: -1, happiness: -1}
        merit: [{cat: neutral}]
      - text: "อาสาช่วยโค้ชเก็บอุปกรณ์"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: help_others, level: 1}]

  - id: kid_bullied_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 12], school: [primary, lower], family: [{role: parent, sex: หญิง, alive: true}]}
    multipliers: {flags: {broken_home: 2}}
    title: "กล่องข้าวหายอีกแล้ว"
    text: "กล่องข้าวของคุณหายเป็นวันที่สาม แขนมีรอยช้ำจากเด็กห้องข้าง ๆ ที่ดักรอหลังโรงอาหาร แม่จับแขนถามว่า '{ชื่อ} ไปโดนอะไรมา' คุณยังไม่ได้ตอบอะไร"
    choices:
      - text: "ไปบอกครูประจำชั้นตรง ๆ"
        effects: {relations: 1, happiness: 1}
        sets_flags: [bullied]
        merit: [{cat: neutral}]
      - text: "ขอไปเรียนมวยไทยป้องกันตัว"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "เดือนต่อมาไม่มีใครกล้าแตะกล่องข้าวอีกเลย", effects: {health: 1, happiness: 2}, sets_flags: [bullied, sporty], merit: [{cat: neutral}]}
          - {weight: 1, text: "ต่อยคืนจนโดนเรียกผู้ปกครอง เพื่อนยิ่งเหม็นหน้า", effects: {relations: -2, health: -1}, sets_flags: [bullied], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ทนเงียบ บอกแม่ว่าล้มเอง"
        effects: {happiness: -2, relations: -1, health: -1}
        sets_flags: [bullied]
        merit: [{cat: neutral}]
      - text: "ขอแม่ย้ายโรงเรียนกลางเทอม"
        requires: {money: {unit: income_x, amount: 0.4}, reason: "ที่บ้านไม่มีเงินค่าย้ายโรงเรียน"}
        effects: {happiness: 1, relations: -1, money: {unit: income_x, amount: -0.4}}
        sets_flags: [bullied]
        merit: [{cat: neutral}]
      - text: "ชวนเพื่อนไปยืนเผชิญหน้าด้วยกัน"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {relations: 1.5}, karma: 1.4}, text: "ยืนกันเป็นแถว เด็กคนนั้นถอยแล้วไม่กล้าแตะกล่องข้าวอีกเลย", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทะเลาะกันกลางสนาม พรุ่งนี้โดนแกล้งหนักกว่าเดิม", effects: {happiness: -2, relations: -2, health: -1}, merit: [{cat: neutral}]}
        sets_flags: [bullied]
        merit: [{cat: neutral}]

  - id: kid_move_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 12], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "ขนของขึ้นรถกระบะ"
    text: "พ่อได้งานใหม่ต่างจังหวัด ค่าแรงดีกว่าเดิมเกือบเท่าตัว พ่อแม่ถามคุณว่าอยากไปไหม ถ้าไปต้องทิ้งเพื่อนแถวบ้าน และยายที่เลี้ยงมาตั้งแต่เกิด"
    choices:
      - text: "ย้ายตามพ่อไปเริ่มใหม่ที่นั่น"
        effects: {income_mult: 1.2, relations: -2, happiness: -1}
        merit: [{cat: neutral}]
      - text: "อยู่กับแม่ รอพ่อกลับเดือนละครั้ง"
        effects: {money: {unit: income_x, amount: 0.5}, relations: -1, happiness: -1}
        merit: [{cat: neutral}]
      - text: "ร้องไห้ขอไม่ย้าย อยู่กับยายต่อ"
        effects: {relations: 2, happiness: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - text: "อ้อนให้ยายย้ายไปด้วยกัน"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {relations: 1.5}}, text: "ยายปลูกผักหน้าบ้านใหม่ เพื่อนบ้านแวะมาขอทุกเช้า", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยายไม่ชินอากาศ ล้มป่วยหนักหน้าหนาวแรก", effects: {happiness: -2, money: {unit: income_x, amount: -0.6}}, merit: [{cat: neutral}]}
        merit: [{cat: care_parents, level: 1}]

  - id: kid_parents_fight_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 12], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "เสียงจานแตกกลางดึก"
    text: "พ่อแม่ทะเลาะเรื่องเงินทุกคืน คุณนอนกอดหมอนฟังอยู่หลังประตู เช้ามาทั้งคู่ยิ้มให้เหมือนไม่มีอะไรเกิดขึ้น"
    choices:
      - text: "บอกพ่อแม่ว่าแยกกันก็ได้"
        effects: {happiness: 1, relations: -1, income_mult: 0.85}
        merit: [{cat: neutral}]
      - text: "ขอป้าข้างบ้านมาช่วยคุยกับพ่อแม่"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {relations: 2}}, text: "พ่อแม่หัดคุยกันดี ๆ บ้านกลับมาหัวเราะได้", effects: {happiness: 2, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุยได้สองครั้งก็ทะเลาะกันต่อหน้าป้า", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ทำเป็นไม่ได้ยิน เก็บไว้คนเดียว"
        effects: {happiness: -2, health: -1, relations: -1}
        sets_flags: [broken_home]
        merit: [{cat: neutral}]
      - text: "ขอไปนอนบ้านตายายสักพัก"
        effects: {relations: 1, happiness: 1, health: 1}
        merit: [{cat: neutral}]

  - id: kid_grandma_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [5, 10], family: [{role: parent, alive: true}]}
    title: "หน้าร้อนที่บ้านยาย"
    text: "หน้าร้อนนี้พ่อแม่ทำงานไม่มีวันหยุด ยายที่{ภาค}โทรมาบอกว่าคิดถึงหลาน มีเป็ดเกิดใหม่สิบตัวรออยู่"
    choices:
      - text: "ขอไปอยู่บ้านยายทั้งเดือน"
        effects: {health: 1, relations: 2, knowledge: -1}
        merit: [{cat: neutral}]
      - text: "อยู่บ้านดูทีวีกับพี่เลี้ยง"
        effects: {happiness: -1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - text: "ตามพ่อแม่ไปที่ทำงานทุกวัน"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "จำงานพ่อแม่ได้หมด ลูกค้าชมว่าฉลาด", effects: {knowledge: 2, relations: 1}, sets_flags: [good_student], merit: [{cat: neutral}]}
          - {weight: 2, text: "เบื่อจนวิ่งหายในตลาดครึ่งวัน", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ขอไปค่ายฟุตบอลภาคฤดูร้อน"
        effects: {health: 1, happiness: 1, money: {unit: income_x, amount: -0.2}}
        sets_flags: [sporty]
        merit: [{cat: neutral}]

  # เรื่องต่อจาก kid_clips_01 (คลิปแมวดัง) — ออกทาง next เท่านั้น
  - id: kid_clips_fame_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    title: "แมวดังทั้งตำบล"
    text: "วันรุ่งขึ้นร้านขายอาหารสัตว์ในอำเภอมาเคาะประตู ขอจ้างแมวกับผู้กำกับวัย {อายุ} ขวบถ่ายโฆษณา ส่วนญาติก็โทรมาขอยืมแมวไปออกงานบวช"
    choices:
      - text: "รับงานโฆษณา ถ่ายทั้งเสาร์อาทิตย์"
        outcomes:
          - {weight: 2, ok: true, text: "ถ่ายเสร็จได้ค่าตัวกับอาหารแมวเต็มรถ คุณเก็บเงินใส่กระปุกเอง", effects: {money: {unit: income_x, amount: 0.4}, happiness: 2}, sets_flags: [likes_clips], merit: [{cat: neutral}]}
          - {weight: 1, text: "แมวตื่นกล้องวิ่งหนีเข้าป่าหลังบ้าน หาเจออีกทีสามวันต่อมา งานล่ม", effects: {happiness: -2, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ให้ญาติยืมแมวไปงานบวชฟรี ๆ"
        effects: {happiness: 1, relations: 2}
        merit: [{cat: help_others, level: 1}]
      - text: "ปฏิเสธ ขอกลับไปตั้งใจเรียน"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - text: "เปิดช่องคลิปของตัวเองจริงจัง"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.3}}, text: "ถ่ายคลิปลงทุกสัปดาห์ คนดูประจำเริ่มรอ เด็กในซอยมาขอเป็นตัวประกอบ", effects: {happiness: 2, knowledge: 1, health: -1}, sets_flags: [likes_clips], merit: [{cat: neutral}]}
          - {weight: 2, text: "คลิปที่สองไม่มีใครดู เสียใจจนไม่ยอมแตะกล้องไปหลายเดือน", effects: {happiness: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # เรื่องต่อจาก kid_sport_01 (เหรียญทองจังหวัด) — ออกทาง next เท่านั้น
  - id: kid_sport_school_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    when: {school: [primary, lower]}
    title: "จดหมายจากโรงเรียนกีฬา"
    text: "สองวันหลังได้เหรียญ โรงเรียนกีฬาประจำจังหวัดส่งจดหมายมาชวนเข้าเรียนประจำ กินนอนที่หอ ค่าเทอมครึ่งหนึ่ง แต่ได้กลับบ้านเดือนละครั้ง"
    choices:
      - text: "ไปอยู่หอโรงเรียนกีฬา"
        requires: {money: {unit: income_x, amount: 0.5}, reason: "เงินที่บ้านไม่พอค่าเทอม"}
        effects: {money: {unit: income_x, amount: -0.5}}
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.5}}, text: "ซ้อมหนักทุกเช้า ติดทีมเยาวชนเขต ครูโค้ชเขียนชื่อไว้บนกระดานดาวรุ่ง", effects: {health: 2, happiness: 1, relations: -1}, sets_flags: [sporty], merit: [{cat: neutral}]}
          - {weight: 1, text: "คิดถึงบ้านจนร้องไห้ทุกคืน ครบเทอมก็ขอย้ายกลับ เงินค่าเทอมไม่ได้คืน", effects: {happiness: -2, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "เรียนที่เดิม ซ้อมกับโค้ชอำเภอ"
        effects: {health: 1, relations: 1}
        sets_flags: [sporty]
        merit: [{cat: neutral}]
      - text: "เอาเหรียญแขวนผนัง พอแค่นี้"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - text: "สอนน้อง ๆ ในซอยวิ่งด้วย"
        effects: {relations: 2, happiness: 1}
        sets_flags: [sporty]
        merit: [{cat: help_others, level: 1}]
