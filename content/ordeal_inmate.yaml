      - id: inmate_hi_ask_uncle_01
        text: "ถามน้าว่ารับได้แค่ไหนก่อน"
        effects: {relations: 2, knowledge: 1}
        merit: [{cat: neutral}]
      - id: inmate_hi_trial_01
        text: "เสนอให้ลองงานเดือนหนึ่งทุกคน"
