# ร่างเรื่อง คุก ผู้ต้องขัง · 15 ใบ · ลงเกมแล้ว ใบ 247 จากร่าง 246 · ผู้เล่นเป็นคนนอกเสมอ · ไม่อ่านและไม่ตั้งธง
events:
  - id: inmate_toy_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [8, 12]}
    title: "ซุ้มของเล่นไม้ในงานเกษตร"
    text: "ป้าข้างบ้านพาคุณเดินงานเกษตร มีซุ้มขายงานไม้ฝีมือคนในเรือนจำ รถลากไม้ทาสีแดงคันเล็กวางอยู่หน้าสุด ป้าบอกว่าเงินค่าของส่วนหนึ่งเก็บไว้ให้คนทำเป็นทุนตอนได้กลับบ้าน ในกระเป๋าคุณมีเงินพอซื้อได้อย่างเดียว"
    choices:
      - id: inmate_toy_buy_01
        text: "ซื้อรถลากไม้คันนั้น"
        effects: {happiness: 2, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: inmate_toy_snack_01
        text: "เก็บเงินไว้ซื้อขนมตามเดิม"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: inmate_toy_ask_01
        text: "ถามป้าว่าเขาทำกันยังไง"
        effects: {knowledge: 2, relations: 1}
        merit: [{cat: neutral}]
      - id: inmate_toy_share_01
        text: "ชวนป้าช่วยกันออกคนละครึ่ง"
        effects: {relations: 2, money: {unit: income_x, amount: -0.005}}
        merit: [{cat: neutral}]
      - id: inmate_toy_rubber_01
        text: "ขอแลกกับหนังยางสามเส้น"
        outcomes:
          - {weight: 1, ok: true, text: "คนเฝ้าซุ้มหัวเราะ บอกว่าราคานี้ไม่ได้ แต่สอนคุณผูกหนังยางให้ล้อรถวิ่งเองได้ คุณเดินกลับอย่างมีวิชา", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าได้ยินแล้วเอามือปิดหน้า เล่าเรื่องหนังยางให้ทั้งซอยฟังไปอีกหลายวัน", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: inmate_neighbor_teen_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [14, 18]}
    title: "พี่คนเดิมกลับมาอยู่ซอย"
    text: "พี่ที่เคยสอนคุณเตะบอลตอนเด็กพ้นโทษกลับมาอยู่บ้านท้ายซอยแล้ว เย็นนี้เขานั่งซ่อมจักรยานอยู่หน้าบ้าน เพื่อนในกลุ่มสะกิดให้เดินไปอีกฝั่งถนน เขาเงยหน้าขึ้นมาพอดี ยังจำคุณได้"
    choices:
      - id: inmate_nb_greet_01
        text: "ทักเหมือนที่เคยทัก"
        outcomes:
          - {weight: 1, ok: true, text: "เขายิ้มกว้างแล้วถามว่ายังเตะเท้าซ้ายไม่เป็นอยู่ไหม คุยกันจนมืด เพื่อนที่ยืนรอปากซอยค่อยเดินมาทักด้วย", effects: {relations: 2, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เขาตอบสั้น ๆ แล้วก้มลงซ่อมต่อ คงยังไม่รู้จะคุยอะไร คุณเดินต่อไปโดยไม่แน่ใจว่าควรทักซ้ำพรุ่งนี้ไหม", effects: {relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: inmate_nb_cross_01
        text: "เดินไปอีกฝั่งกับเพื่อน"
        effects: {network: 1, happiness: -1, relations: -1}
        merit: [{cat: neutral}]
      - id: inmate_nb_nod_01
        text: "พยักหน้าให้แล้วเดินผ่าน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: inmate_nb_ask_fix_01
        text: "เข็นจักรยานตัวเองไปให้เขาดู"
        effects: {relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - id: inmate_nb_challenge_01
        text: "ท้าเตะบอลเท้าเปล่าหน้าบ้าน"
        outcomes:
          - {weight: 1, ok: true, text: "เด็กทั้งซอยออกมายืนดู เขาชนะคุณห้าลูกรวด และเพื่อนที่สะกิดคุณเมื่อกี้ขอลงเล่นเป็นคนแรก", effects: {happiness: 2, relations: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลูกแรกคุณเตะเข้ารั้วบ้านป้าเจ้าระเบียบ ทั้งคู่วิ่งหนีไปคนละทาง แล้วกลับมาขอโทษพร้อมกัน", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: inmate_field_trip_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 17], school: [lower, upper, voc]}
    title: "ทัศนศึกษาแปลงเกษตรเรือนจำ"
    text: "ครูพาห้องคุณไปดูแปลงผักของเรือนจำชั่วคราวที่เปิดให้คนนอกเดินชม คนนำชมบอกว่าคนทำงานแปลงนี้สมัครใจให้ถามได้ แต่ทั้งห้องเงียบ ครูมองมาที่คุณเพราะคุณยกมือเก่งที่สุด"
    choices:
      - id: inmate_ft_ask_soil_01
        text: "ถามเรื่องการปลูกผักแปลงนี้"
        effects: {knowledge: 2, network: 1}
        merit: [{cat: neutral}]
      - id: inmate_ft_ask_after_01
        text: "ถามว่าออกไปแล้วอยากทำอะไร"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงคนรดน้ำบอกว่าอยากกลับไปทำสวนที่บ้าน แล้วสอนวิธีดูดินด้วยมือ ทั้งห้องเริ่มถามตาม", effects: {knowledge: 2, relations: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เขาคิดอยู่นานแล้วบอกว่ายังไม่กล้าคิด คุณพูดอะไรไม่ออก และนึกถึงคำตอบนั้นตลอดทางกลับ", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: inmate_ft_quiet_01
        text: "ทำเป็นจดรายงานไม่เงยหน้า"
        effects: {happiness: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - id: inmate_ft_buy_01
        text: "รวมเงินซื้อผักกลับไปโรงเรียน"
        effects: {relations: 2, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: inmate_ft_contest_01
        text: "ถามว่าผักแปลงนี้เคยชนะประกวดไหม"
        outcomes:
          - {weight: 1, ok: true, text: "คนนำชมตอบหน้าตายว่าชนะหนอนมาตลอด บรรยากาศทั้งแปลงคลายลงทันที", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูหันมามองนิ่ง ๆ คืนนั้นคุณได้เขียนรายงานเรื่องกะหล่ำเพิ่มอีกสองหน้า", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: inmate_coffee_wall_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [20, 30]}
    title: "กาแฟริมกำแพงเรือนจำ"
    text: "ทางไปตลาดมีร้านกาแฟเล็ก ๆ ติดกำแพงเรือนจำ คนชงเป็นผู้ต้องขังใกล้พ้นโทษที่กำลังฝึกอาชีพ เช้านี้เขาตวงผงกาแฟด้วยมือสั่น เพราะเพิ่งมาชงเป็นวันแรก แก้วของคุณออกมาหวานจัดจนเหมือนน้ำเชื่อม"
    choices:
      - id: inmate_cw_tell_01
        text: "บอกดี ๆ ว่าหวานไปนิด"
        effects: {relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - id: inmate_cw_drink_01
        text: "ดื่มหมดแก้ว ไม่พูดอะไร"
        effects: {happiness: 1, health: -1}
        merit: [{cat: neutral}]
      - id: inmate_cw_regular_01
        text: "แวะอุดหนุนทุกเช้าอีกเดือน"
        outcomes:
          - {weight: 1, ok: true, text: "ปลายเดือนกาแฟเริ่มกลมกล่อม เขาจำได้ว่าคุณไม่ใส่นมเยอะ และชงให้โดยไม่ต้องสั่ง", effects: {happiness: 2, relations: 2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พอคุ้นหน้ากัน เขาก็ถึงกำหนดออกไปแล้ว คนใหม่มายืนตวงผงด้วยมือสั่นเหมือนเดิม คุณจึงสั่งหวานน้อยไว้ก่อน", effects: {happiness: 1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: inmate_cw_avoid_01
        text: "เปลี่ยนไปร้านปากซอยแทน"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: inmate_cw_rate_01
        text: "เขียนคะแนนบนแก้ว เจ็ดเต็มสิบ"
        outcomes:
          - {weight: 1, ok: true, text: "วันต่อมาแก้วของคุณมีลายมือตอบกลับว่าพรุ่งนี้เอาแปดให้ได้ แก้วกระดาษกลายเป็นจดหมายรายวัน", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูฝึกเดินมาอ่านแล้วขอให้คุณเติมคำติชมครบทุกช่องในแบบประเมิน คุณเลยไปถึงธุระสาย", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: inmate_halfway_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [24, 30]}
    title: "อาสาบ้านกึ่งวิถีในชุมชน"
    text: "ชุมชนกับวัดใกล้บ้านเปิดบ้านกึ่งวิถีรับคนใกล้พ้นโทษที่สมัครใจมาอยู่ กรรมการบอกว่ามาอยู่แล้วก็ดูแลเหมือนคนในบ้าน แต่ขาดคนสอนจดรายจ่ายวันเสาร์ ป้าข้างบ้านกระซิบว่ายังไม่สบายใจ แล้วถามว่าคุณจะไปไหม"
    choices:
      - id: inmate_hw_teach_01
        text: "ไปสอนจดบัญชีทุกเสาร์"
