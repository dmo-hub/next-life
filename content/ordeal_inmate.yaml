          - {weight: 1, ok: true, text: "ลุงคนหนึ่งจดรายจ่ายครบเดือนเป็นครั้งแรกในชีวิต แล้วเอาสมุดไปอวดกรรมการทุกคน ป้าข้างบ้านเริ่มฝากกล้วยไปด้วย", effects: {relations: 2, knowledge: 1, network: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "สอนไปสองเดือน นักเรียนมาบ้างไม่มาบ้าง ตัวเลขไม่เคยตรง แต่พวกเขายังเก็บที่นั่งให้คุณทุกครั้ง", effects: {relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: inmate_hw_listen_01
        text: "ฟังความกังวลของป้าก่อน"
        effects: {relations: 2}
        merit: [{cat: neutral}]
      - id: inmate_hw_decline_01
        text: "บอกตรง ๆ ว่ายังไม่พร้อม"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: inmate_hw_food_01
        text: "ทำกับข้าวไปฝากแล้วกลับ"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}}
