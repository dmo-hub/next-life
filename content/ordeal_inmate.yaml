    text: "น้าเจ้าของอู่ฝากคุณช่วยคัดช่างเข้าใหม่ ใบสมัครที่ฝีมือดีที่สุดเขียนบอกตรง ๆ ว่าเคยต้องโทษและพ้นโทษแล้ว เขาบอกว่าที่อื่นปฏิเสธมาสี่แห่ง น้าเดินผ่านโต๊ะแล้วพูดว่า แล้วแต่คุณจะเลือก"
    choices:
      - id: inmate_hi_interview_01
        text: "เรียกมาคุยเหมือนคนอื่น"
        outcomes:
          - {weight: 1, ok: true, text: "เขาลองงานสามวัน ฟังเสียงเครื่องแล้วบอกอาการถูกทุกคัน น้าบอกว่าเดือนหน้าเขียนชื่อเขาลงป้ายช่างได้เลย", effects: {network: 2, relations: 1, knowledge: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ฝีมือดีจริง แต่ลูกค้าเก่าบางคนรู้แล้วย้ายอู่ น้านั่งคิดเลขเงียบ ๆ และยังไม่ได้ตอบว่าจะให้อยู่ต่อไหม", effects: {happiness: -1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: help_others, level: 1}]}
