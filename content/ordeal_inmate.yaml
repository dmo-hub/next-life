          - {weight: 1, text: "ผู้สมัครทุกคนถอดเครื่องเก่งเท่ากัน แต่ประกอบกลับไม่ครบสักคน น็อตเหลือบนโต๊ะคุณหนึ่งกำมือ", effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

