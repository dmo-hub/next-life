          - {weight: 1, text: "ป้าถามคำถามเดิมกับทุกคนจนหมดเวลาเรียน กรรมการเลยขอให้คุณช่วยคุยกับป้าก่อน", effects: {happiness: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

