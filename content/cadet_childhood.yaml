      - text: "กลัวทะเล อยู่บ้านดูเด็กข้างบ้าน"
        result: "พ่อแม่เด็กข้างบ้านฝากลูกไว้แล้ววิ่งไปชายหาด ได้ยินเสียงโห่ร้องมาแต่ไกล เด็กหลับไปในตักก่อนเสียงจะเงียบ"
        effects: {relations: 1}
        sets_flags: [cadet_seen12]
        merit: [{cat: neutral}]
