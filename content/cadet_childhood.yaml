      - text: "ขออุ้มลูกเต่าปล่อยลงบ่อ"
        result: "ลูกเต่าดิ้นในมือแล้วว่ายหายไปในบ่อ พี่ทหารเรือบอกว่าอีกยี่สิบปีอาจกลับมาวางไข่ที่หาดนี้"
