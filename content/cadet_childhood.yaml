      - text: "ไปช่วย{ผู้ใหญ่}เก็บของที่พายุพัดพัง"
        result: "เก็บกระเบื้องกับกิ่งไม้จนลานบ้านโล่ง {ผู้ใหญ่}บอกว่า 'วันนี้แรงดีกว่าผู้ใหญ่บางคนอีกนะ{ถิ่น}'"
