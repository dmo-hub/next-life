    title: "เครื่องบินไม้ของน้า"
    text: "สงกรานต์ปีนี้ น้าที่เป็นช่างเครื่องบินอยู่กองบินต่างจังหวัดกลับมาบ้าน ใส่ชุดทหารอากาศเดินเข้าซอย ในมือถือโมเดลเครื่องบินไม้มาฝาก {ชื่อ} หนึ่งลำ น้าเล่าว่าที่กองบินคนขับมีไม่กี่คน แต่คนที่ทำให้เครื่องขึ้นได้มีเป็นร้อย"
    choices:
      # ผล: รถของเล่นที่พังมาสามเดือนกลับมาวิ่งได้ น้าบอกว่ามือแบบนี้ไปทางช่างอะไรก็ได้
      - text: "ขอให้น้าสอนซ่อมของเล่นที่พัง"
        result: "รถของเล่นที่พังมาสามเดือนกลับมาวิ่งได้ น้าบอกว่ามือแบบนี้ไปทางช่างอะไรก็ได้"
        effects: {knowledge: 1, relations: 1}
        sets_flags: [cadet_seen12]
        merit: [{cat: neutral}]
      # ผล: เครื่องบินไม้ถูกโยนกันทั้งบ่ายจนปีกบิ่น แต่ทั้งซอยหัวเราะกันจนค่ำ
      - text: "เอาไปเล่นกับเพื่อนในซอย"
        result: "เครื่องบินไม้ถูกโยนกันทั้งบ่ายจนปีกบิ่น แต่ทั้งซอยหัวเราะกันจนค่ำ"
        effects: {happiness: 1, relations: 1}
        sets_flags: [cadet_seen12]
        merit: [{cat: neutral}]
      - text: "ขอให้น้าพาไปดูโรงเก็บเครื่องบิน"
        sets_flags: [cadet_seen12]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, text: "ยามหน้าประตูยอมให้เดินดูแค่ลานจอด เสียงเครื่องยนต์ดังจนต้องปิดหู", effects: {happiness: 1}, sets_flags: [saw_airforce], merit: [{cat: neutral}]}
          - {weight: 1, text: "ยามหน้าประตูไม่ให้เข้า น้าเลยพาไปกินก๋วยเตี๋ยวหน้ากองบินแทน", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
      # ผล: น้าบอกว่ามีหลายทาง ต้องเรียนเลขกับภาษาให้ดีก่อน แล้วชวนคุยเรื่องอื่นต่อ
      - text: "ถามว่าคนขับเครื่องบินเรียนที่ไหน"
        result: "น้าบอกว่ามีหลายทาง ต้องเรียนเลขกับภาษาให้ดีก่อน แล้วชวนคุยเรื่องอื่นต่อ"
        effects: {knowledge: 1}
        sets_flags: [cadet_seen12, saw_airforce]
        merit: [{cat: neutral}]
      # ผล: เครื่องบินไม้ลำนั้นตั้งอยู่บนตู้ เป็นของฝากจากน้าอีกชิ้นหนึ่ง
      - text: "ไหว้ขอบคุณน้า แล้ววางไว้บนตู้"
        result: "เครื่องบินไม้ลำนั้นตั้งอยู่บนตู้ เป็นของฝากจากน้าอีกชิ้นหนึ่ง"
        sets_flags: [cadet_seen12]
        merit: [{cat: neutral}]
