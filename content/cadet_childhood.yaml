# nl-writer file b002
# กลุ่ม cadet_ · เส้นเตรียมทหาร เฟส 1 · วัยเด็ก (อายุ 10–12) · เฉพาะผู้ชาย · ฉากเห็นเครื่องแบบ 4 เหล่า แบบไม่ยัดเยียด
# ที่มา: .claude/research/demo/data-01.js (E0 T1 T1b T3 ตร1 ตร2 ตร4 N1 X3 A3) · data-02.js (SR0) · ร่างให้เจ้าของเลือกและแก้
# จังหวะ (เจ้าของ: อย่างน้อย 2 ฉากก่อนอายุ 13 · ไม่ติดกันสองปี): ช่อง 10 ขวบ กับช่อง 12 ขวบ ช่องละหนึ่งใบ (หลักไมล์)
#   ทุกใบในช่องเดียวกันมี when.flags.not ธงช่อง และทุกตัวเลือกตั้งธงช่อง → ใบแรกตามลำดับไฟล์ที่เข้าเงื่อนไขออก ใบที่เหลือข้าม
#   ช่อง 10 (ทบ./ตร.): ตร1 → ตร2 → A3 → E0 (ใบสุดท้ายรับทุกคนที่เหลือ) · ช่อง 12 (ทร./ทอ.): X3 → T3 → N1 → T1 → T1b
# ตั้งธง: saw_army saw_navy saw_airforce saw_police (บางตัวเลือกเท่านั้น) · cadet_seen10 cadet_seen12 (ธงช่อง) · knows_senior cadet_lean:<เหล่า> (SR0) · cadet_tips (ตร4)
# อ่านธง: cadet_dream (ตร4 ปุ่มสุดท้าย · ไฟล์เส้นตั้งเป้าเป็นคนตั้ง)
# ข้อความผลของตัวเลือกที่ไม่มีผลสุ่มเก็บเป็นคอมเมนต์ "ผล:" (สคีมาเกมยังไม่มีช่องผลของตัวเลือกเดี่ยว)
# ยังไม่ทำ: X5 (ทายาททหาร) · ตร3 (ทายาทตำรวจ) — รอแกนเพิ่ม army_family / police_family ในหมวด heir:
events:
  # ── ช่อง 10 ขวบ · ทบ./ตร. ──
  # >>> nl-writer b002 evt cadet_police_class_01
  - id: cadet_police_class_01
    type: A
    category: study
    stage: เด็ก
    years: [2542, 2650]
    at_age: 10
    when: {sex: [ชาย], school: [primary], region: [กรุงเทพฯ และปริมณฑล, กลาง, ตะวันตก], flags: {not: [cadet_seen10]}}
    title: "ครูที่ใส่เครื่องแบบ"
    text: "เทอมนี้มีครูคนใหม่มาสอนสัปดาห์ละคาบ เป็นตำรวจในเครื่องแบบ ยืนหน้าห้องสอนวิธีปฏิเสธเวลามีคนชวนลองของไม่ดี ท้ายคาบครูเปิดให้ถามอะไรก็ได้ ทั้งห้องเงียบไปพักใหญ่ {ชื่อ} ยังนึกไม่ออกว่าจะถามอะไร"
    choices:
      # ผล: สมุดเล่มนั้นอยู่ในกระเป๋านักเรียนอีกหลายปี
      - text: "จดวิธีปฏิเสธลงสมุดทุกข้อ"
        result: "สมุดเล่มนั้นอยู่ในกระเป๋านักเรียนอีกหลายปี"
        effects: {knowledge: 1, health: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: sila, level: 1}]
      # ผล: ตื่นมาอีกทีครูเดินออกจากห้องไปแล้ว เพื่อนข้างโต๊ะยังคุยเรื่องหมวกไม่หยุด
      - text: "ฟุบหลับท้ายห้อง รอหมดคาบ"
        result: "ตื่นมาอีกทีครูเดินออกจากห้องไปแล้ว เพื่อนข้างโต๊ะยังคุยเรื่องหมวกไม่หยุด"
        effects: {happiness: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      # ผล: หมวกใหญ่จนบังตา ทั้งห้องหัวเราะจนครูต้องเคาะโต๊ะ แต่ครูก็หัวเราะด้วย
      - text: "ขอลองสวมหมวกครูหนึ่งที"
        result: "หมวกใหญ่จนบังตา ทั้งห้องหัวเราะจนครูต้องเคาะโต๊ะ แต่ครูก็หัวเราะด้วย"
        effects: {happiness: 1}
        sets_flags: [cadet_seen10, saw_police]
        schedules: [{event: cadet_police_whistle_01, after_years: [3, 4]}]
        merit: [{cat: neutral}]
      # ผล: ครูหัวเราะ บอกว่าจะเป็นอะไรก็ต้องเรียนให้จบก่อน แล้วหัดวิ่งให้ไหว
      - text: "ยกมือถามว่าตำรวจต้องเรียนอะไร"
        result: "ครูหัวเราะ บอกว่าจะเป็นอะไรก็ต้องเรียนให้จบก่อน แล้วหัดวิ่งให้ไหว"
        effects: {knowledge: 1}
        sets_flags: [cadet_seen10, saw_police]
        schedules: [{event: cadet_police_whistle_01, after_years: [3, 4]}]
        merit: [{cat: neutral}]
  # <<< nl-writer b002 evt cadet_police_class_01

  # >>> nl-writer b002 evt cadet_police_chain_01
  - id: cadet_police_chain_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    at_age: 10
    when: {sex: [ชาย], region: [กรุงเทพฯ และปริมณฑล, กลาง, ตะวันตก], flags: {not: [cadet_seen10]}}
    title: "สร้อยที่คอหายไป"
    text: "ท่ารถตอนเย็นคนแน่น {ชื่อ} ยืนเฝ้ากระเป๋าให้{ผู้ใหญ่}ที่ไปต่อแถวซื้อตั๋ว ชายแปลกหน้าเดินสวนมา กระชากสร้อยพระที่คอแล้ววิ่งหายเข้าไปในฝูงคน คอยังแสบอยู่ แต่ไม่มีใครหันมามองเลยสักคน"
    choices:
      # ผล: คนขายน้ำอ้อยช่วยวิ่งไล่แต่ไม่ทัน กลับมาปลอบด้วยน้ำอ้อยหนึ่งถุง
      - text: "ร้องตะโกนให้คนช่วยจับ"
        result: "คนขายน้ำอ้อยช่วยวิ่งไล่แต่ไม่ทัน กลับมาปลอบด้วยน้ำอ้อยหนึ่งถุง"
        effects: {relations: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      # ผล: ผู้ใหญ่ในบ้านกลับมาเห็นรอยแดงที่คอ จูงมือไม่ยอมปล่อยไปจนถึงบ้าน
      - text: "ยืนนิ่ง กำคอตัวเองไว้"
        result: "{ผู้ใหญ่}กลับมาเห็นรอยแดงที่คอ จูงมือไม่ยอมปล่อยไปจนถึงบ้าน"
        effects: {relations: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      - text: "วิ่งไล่ตามคนร้ายเอง"
        hint: "อาจเจ็บตัว"
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 3, text: "ล้มเข่าแตกกลางลานจอดรถ เงยหน้าขึ้นมาคนร้ายก็หายไปแล้ว", effects: {health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนร้ายตกใจทำสร้อยหล่นกลางทาง เด็กข้างทางเก็บมาคืนให้ทั้งที่หอบ", effects: {happiness: 1}, merit: [{cat: neutral}]}
      - text: "วิ่งไปป้อมตำรวจหน้าท่ารถ"
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 9, text: "ตำรวจวิ่งตามไปทั้งที่ยังถือแก้วกาแฟ กลับมาพร้อมสร้อยเส้นเดิม แล้วห้อยคอคืนให้เอง", effects: {happiness: 1}, sets_flags: [saw_police], merit: [{cat: neutral}]}
          - {weight: 11, text: "ตำรวจจดชื่อลงสมุดแล้วบอกว่าคงหายาก ตลอดทางกลับบ้านยังเสียดายสร้อยเส้นนั้น", effects: {happiness: -1}, merit: [{cat: neutral}]}
  # <<< nl-writer b002 evt cadet_police_chain_01

  # >>> nl-writer b002 evt cadet_army_bugle_01
  - id: cadet_army_bugle_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    at_age: 10
    when: {sex: [ชาย], region: [ตะวันออก, ใต้], flags: {not: [cadet_seen10]}}
    title: "แตรหกโมงหน้าค่าย"
    text: "ปิดเทอมนี้ไปค้างบ้านยายที่อยู่ห่างค่ายทหารแค่ถนนกั้น ทุกเช้าหกโมงเสียงแตรดังข้ามรั้ว ตามด้วยแถวทหารวิ่งร้องเพลงผ่านหน้าบ้าน เสียงรองเท้ากระทบถนนพร้อมกันเหมือนคนคนเดียว เช้านี้ {ชื่อ} ตื่นทันพอดี"
    choices:
      # ผล: เสียงเพลงค่อย ๆ ไกลออกไปจนหลับต่อได้
      - text: "ดึงผ้าห่มคลุมหัว นอนต่อ"
        result: "เสียงเพลงค่อย ๆ ไกลออกไปจนหลับต่อได้"
        effects: {happiness: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      # ผล: เช้านี้ขายน้ำได้หมดกระติก ยายแบ่งเหรียญให้ไว้ซื้อขนม
      - text: "ช่วยยายตั้งแผงขายน้ำหน้าบ้าน"
        result: "เช้านี้ขายน้ำได้หมดกระติก ยายแบ่งเหรียญให้ไว้ซื้อขนม"
        effects: {relations: 1, money: {unit: income_x, amount: 0.2}}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      # ผล: ปีนต้นมะม่วงจนได้เต็มตะกร้า ยายเอาไปแบ่งข้างบ้าน
      - text: "ไปเก็บมะม่วงหลังบ้านยาย"
        result: "ปีนต้นมะม่วงจนได้เต็มตะกร้า ยายเอาไปแบ่งข้างบ้าน"
        effects: {health: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
      # ผล: วิ่งได้ครึ่งทางก็หอบ ทหารท้ายแถวหันมาชูนิ้วโป้งให้
      - text: "วิ่งตามแถวไปจนสุดถนน"
        result: "วิ่งได้ครึ่งทางก็หอบ ทหารท้ายแถวหันมาชูนิ้วโป้งให้"
        effects: {health: 1}
        sets_flags: [cadet_seen10, saw_army]
        merit: [{cat: neutral}]
  # <<< nl-writer b002 evt cadet_army_bugle_01

  # >>> nl-writer b002 evt cadet_army_flood_01
  - id: cadet_army_flood_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    at_age: 10
    when: {sex: [ชาย], flags: {not: [cadet_seen10]}}
    title: "เรือท้องแบนหน้าบ้าน"
    text: "น้ำท่วมถึงเอว ไฟดับมาสามคืน เรือท้องแบนของทหารแล่นเข้ามาในซอย ทหารหนุ่มคนหนึ่งลุยน้ำไปแบกยายบ้านตรงข้ามขึ้นเรือ ก่อนไปเขาหันมาถามว่า 'บ้านนี้อยู่กันกี่คนล่ะลูก'"
    choices:
      # ผล: ขนข้าวสารกับหม้อหุงข้าวขึ้นไปทันก่อนน้ำขึ้นอีกคืบ แม่ลูบหัวทีหนึ่ง
      - text: "ช่วย{ผู้ใหญ่}ขนของขึ้นชั้นบน"
        result: "ขนข้าวสารกับหม้อหุงข้าวขึ้นไปทันก่อนน้ำขึ้นอีกคืบ {ผู้ใหญ่}ลูบหัวทีหนึ่ง"
        effects: {relations: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: care_parents, level: 1}]
      # ผล: ยายหันมาโบกมือจากหัวเรือ บอกว่าน้ำลดแล้วจะทำขนมมาให้
      - text: "ช่วยส่งถุงของยายขึ้นเรือ"
        result: "ยายหันมาโบกมือจากหัวเรือ บอกว่าน้ำลดแล้วจะทำขนมมาให้"
        effects: {relations: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: help_others, level: 1}]
      # ผล: เรือเลี้ยวพ้นหัวซอยไป เสียงเครื่องเรือค่อย ๆ เงียบลง
      - text: "ยืนดูจนเรือลับตา"
        result: "เรือเลี้ยวพ้นหัวซอยไป เสียงเครื่องเรือค่อย ๆ เงียบลง"
        effects: {happiness: 1}
        sets_flags: [cadet_seen10, saw_army]
        merit: [{cat: neutral}]
      # ผล: เด็กข้างบ้านหนีน้ำมาอาศัยชั้นบน (เกมไม่มีข้อมูลพี่น้อง · เจ้าของเคาะ 2026-11-10)
      - text: "กลัวน้ำ หลบชั้นบนกับเด็กข้างบ้าน"
        result: "เด็กข้างบ้านหนีน้ำมาอาศัยชั้นบน นั่งกอดกันเล่าเรื่องผีจนเขาหลับ ได้ยินแค่เสียงเรือแล่นผ่านไป"
        effects: {health: 1}
        sets_flags: [cadet_seen10]
        merit: [{cat: neutral}]
  # <<< nl-writer b002 evt cadet_army_flood_01

  # ── อายุ 11–12 · ใบกอง · พี่บ้านข้าง ๆ (SR0) ──
  # >>> nl-writer b002 evt cadet_senior_home_01
  - id: cadet_senior_home_01
    type: A
    category: society
    stage: เด็ก
    years: [2506, 2650]
    weight: 0.5
    when: {age: [11, 12], sex: [ชาย], flags: {not: [knows_senior]}}
    title: "พี่บ้านข้าง ๆ กลับมาปิดเทอม"
    text: "ปิดเทอมนี้ลูกชายบ้านข้าง ๆ กลับมาจากกรุงเทพฯ ทั้งซอยรู้กันว่าเขาสอบติดเตรียมทหาร ผมตัดสั้นเกรียน พูดกับผู้ใหญ่ทีไรยืนตัวตรงทุกที ตกเย็นเขาออกวิ่งรอบหมู่บ้าน ผ่านหน้าบ้าน {ชื่อ} ทุกวัน"
    choices:
      # ผล: ปิดเทอมหมดไปกับสนามดินหลังวัด ไม่ได้คุยกับพี่เขาสักคำ
      - text: "ไปเตะบอลกับเพื่อนตามเดิม"
        result: "ปิดเทอมหมดไปกับสนามดินหลังวัด ไม่ได้คุยกับพี่เขาสักคำ"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      # ผล: นั่งเฝ้าร้านทุกเย็น เห็นพี่เขาวิ่งผ่านไปมาเหมือนนาฬิกา
      - text: "ช่วยที่บ้านขายของช่วงปิดเทอม"
        result: "นั่งเฝ้าร้านทุกเย็น เห็นพี่เขาวิ่งผ่านไปมาเหมือนนาฬิกา"
        effects: {relations: 1, money: {unit: income_x, amount: 0.2}}
        merit: [{cat: neutral}]
      # ผล: วิ่งไม่ถึงครึ่งรอบก็หอบ พี่เขาหันมายิ้มทีหนึ่งแล้ววิ่งต่อ
      - text: "วิ่งตามหลังพี่เขาไปสักรอบ"
        result: "วิ่งไม่ถึงครึ่งรอบก็หอบ พี่เขาหันมายิ้มทีหนึ่งแล้ววิ่งต่อ"
        effects: {health: 1}
        merit: [{cat: neutral}]
      # ผล: พี่เขาหยุดคุยด้วย ถามว่าเรียนชั้นไหน แล้วบอกว่ามีอะไรสงสัยก็มาถามได้
      - text: "ทักพี่เขาตอนวิ่งผ่านหน้าบ้าน"
        result: "พี่เขาหยุดคุยด้วย ถามว่าเรียนชั้นไหน แล้วบอกว่ามีอะไรสงสัยก็มาถามได้"
        effects: {network: 1}
        sets_flags: [knows_senior]
        merit: [{cat: neutral}]
      - text: "ถามพี่ว่าจะไปเป็นทหารอะไร"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, text: "พี่บอกว่าจะเลือกทหารบก เพราะอยากอยู่ใกล้คน เวลาบ้านเมืองมีภัยจะได้ไปช่วย", effects: {knowledge: 1}, sets_flags: [knows_senior, "cadet_lean:army"], merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่บอกว่าอยากเป็นทหารเรือ ตอนนี้ว่ายน้ำทุกเช้าจนผิวคล้ำไปทั้งตัว", effects: {knowledge: 1}, sets_flags: [knows_senior, "cadet_lean:navy"], merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่ชี้ขึ้นฟ้า บอกว่าอยากเป็นทหารอากาศ แต่ต้องรอดูว่าสายตาผ่านไหม", effects: {knowledge: 1}, sets_flags: [knows_senior, "cadet_lean:airforce"], merit: [{cat: neutral}]}
          - {weight: 1, text: "พี่บอกว่าจะไปเป็นตำรวจ เรียนรวมกับเพื่อนทหารก่อน แล้วค่อยแยกทาง", effects: {knowledge: 1}, sets_flags: [knows_senior, "cadet_lean:police"], merit: [{cat: neutral}]}
  # <<< nl-writer b002 evt cadet_senior_home_01

  # ── ช่อง 12 ขวบ · ทร./ทอ. ──
  # >>> nl-writer b002 evt cadet_navy_storm_01
  - id: cadet_navy_storm_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    at_age: 12
