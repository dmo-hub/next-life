  - id: cadet_police_whistle_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2545, 2650]
    when: {sex: [ชาย], school: [lower, upper, voc]}
    title: "นกหวีดหน้าประตูโรงเรียน"
    text: "เช้าวันเปิดเทอม ตำรวจจราจรที่ยืนเป่านกหวีดหน้าประตูโรงเรียนใหม่ คือครูตำรวจที่เคยมาสอนตอนประถม ผมหงอกขึ้นเยอะ แต่ท่าโบกมือยังเหมือนเดิม รถติดยาวจนเขาไม่มีเวลาหันมามองใคร"
    choices:
      # ผล: เขาหันมาเพ่งหน้าอยู่นาน แล้วยิ้มกว้าง บอกว่าโตจนจำแทบไม่ได้
      - text: "ยกมือไหว้ เรียกว่าครู"
        result: "เขาหันมาเพ่งหน้าอยู่นาน แล้วยิ้มกว้าง บอกว่าโตจนจำแทบไม่ได้"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      # ผล: ครูเป่านกหวีดหยุดรถให้ แล้วยกนิ้วโป้งมาทางนี้
      - text: "ช่วยจูงน้องตัวเล็กข้ามถนน"
        result: "ครูเป่านกหวีดหยุดรถให้ แล้วยกนิ้วโป้งมาทางนี้"
        effects: {relations: 1}
        merit: [{cat: help_others, level: 1}]
      # ผล: เสียงนกหวีดดังตามหลังไปจนถึงหน้าห้องเรียน
      - text: "เดินผ่านไปเงียบ ๆ"
        result: "เสียงนกหวีดดังตามหลังไปจนถึงหน้าห้องเรียน"
        merit: [{cat: neutral}]
