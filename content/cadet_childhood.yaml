      # ผล: เพื่อนกลับมาเล่าเรื่องเต่าให้ฟังทั้งอาทิตย์ แต่ที่บ้านมีเงินเหลือซื้อกับข้าวอีกหลายมื้อ
      - text: "ไม่ไป เก็บค่ารถไว้ให้ที่บ้าน"
        result: "เพื่อนกลับมาเล่าเรื่องเต่าให้ฟังทั้งอาทิตย์ แต่ที่บ้านมีเงินเหลือซื้อกับข้าวอีกหลายมื้อ"
