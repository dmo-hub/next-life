# กลางคน (46–59) · การ์ดเงิน/ครอบครัว — กองสุ่ม
events:
  - id: mid_debt_spiral_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "หนี้ล้นตัว"
    text: "อายุ {อายุ} ดอกเบี้ยเดินเร็วกว่าเงินเดือน เงินกู้สามเจ้าหมุนไม่ทัน เสียงโทรศัพท์ทวงหนี้ดังตั้งแต่เจ็ดโมงเช้า"
    when: {flags: {has: [in_debt]}}
    weight: 3
    multipliers: {flags: {guarantor: 1.5, own_business: 1.3}, occupation: {labor: 1.3, service: 1.2}}
    choices:
      - id: sell_house
        text: "ขายบ้านโปะหนี้ทั้งก้อน"
        effects: {happiness: -2, relations: 1, health: 1}
        clears_flags: [in_debt]
        merit: [{cat: neutral}]
      - id: loan_shark
        text: "กู้นอกระบบมาหมุนก่อน"
        # outcome ใส่ clears_flags ไม่ได้ (shape.mjs) — ล้างที่ตัวเลือกก่อน แล้วผลร้ายตั้งกลับ (applyChoice ของ outcome รันทีหลัง)
        clears_flags: [in_debt]
        outcomes:
          - {weight: 1, ok: true, text: "หมุนทันจริง ๆ งานใหญ่เข้าพอดี ปิดหนี้ได้หมดแบบไม่มีใครเชื่อ", effects: {happiness: 3, money: {unit: income_x, amount: 1}}, merit: [{cat: neutral}], multipliers: {karma: 1.4}}
          - {weight: 3, text: "ดอกร้อยละยี่สิบต่อเดือน คนแปลกหน้ามายืนหน้าบ้านทุกเย็น", effects: {health: -2, happiness: -2, chronic: {happiness: -1}}, sets_flags: [in_debt], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: debt_clinic
        text: "เข้าคลินิกแก้หนี้ ผ่อนยาว"
        effects: {knowledge: 1, happiness: 1, income_mult: 0.85}
        clears_flags: [in_debt]
        merit: [{cat: neutral}]
      - id: drink_forget
        text: "กินเหล้าให้ลืม ๆ ไป"
        effects: {happiness: 1, health: -1, relations: -1}
        sets_flags: [heavy_drinker]
        merit: [{cat: intoxicants, level: 1}]
      - id: kids_help
        text: "ยอมเล่าให้คนในบ้านฟังทั้งหมด"
        outcomes:
          - {weight: 2, ok: true, text: "ทั้งบ้านช่วยกันลงขันคนละนิด คืนนั้นนอนหลับได้เป็นครั้งแรกในรอบหลายเดือน", effects: {relations: 2, happiness: 1, health: 1}, merit: [{cat: neutral}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "เล่าจบบ้านแตก ทะเลาะกันหนักว่าปิดบังมาได้ยังไงตั้งนาน", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: sila, level: 1}]

  - id: mid_guarantor_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "หนี้ที่ไม่ได้ก่อ"
    text: "จดหมายจากศาลมาถึงบ้าน เพื่อนที่เคยไปค้ำรถให้หายเงียบไปสามปี ตอนนี้ยอดค้างตกเป็นของ {ชื่อ} คนเดียว"
    when: {flags: {has: [guarantor]}}
    weight: 3
    choices:
      - id: pay_all
        text: "กัดฟันจ่ายแทนจนจบ"
        effects: {money: {unit: income_x, amount: -1.5}, happiness: -1, health: 1}
        clears_flags: [guarantor]
        merit: [{cat: sila, level: 1}]
      - id: hunt_friend
        text: "ตามล่าตัวเพื่อนให้เจอ"
        clears_flags: [guarantor]
        outcomes:
          - {weight: 2, ok: true, text: "เจอเพื่อนขายก๋วยเตี๋ยวอยู่อีกจังหวัด ร้องไห้กอดกันแล้วผ่อนคืนทีละน้อย", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เจอแล้ว แต่เขามีหนี้มากกว่าเราอีก กลับบ้านมือเปล่าพร้อมค่าน้ำมัน", effects: {happiness: -2, health: -1}, sets_flags: [guarantor], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: fight_court
        text: "สู้คดีให้ลดยอด"
        requires: {stats: {knowledge: {min: 70}}, reason: "ยังไม่รู้กฎหมายพอจะสู้คดี"}
        effects: {knowledge: 2, health: -1, money: {unit: income_x, amount: -0.5}}
        clears_flags: [guarantor]
        merit: [{cat: neutral}]
      - id: borrow_pay
        text: "กู้มาจ่ายให้จบ ๆ ไป"
        effects: {happiness: 1}
        sets_flags: [in_debt]
        clears_flags: [guarantor]
        merit: [{cat: neutral}]
      - id: swear_off
        text: "สาบานว่าชาตินี้ไม่ค้ำใครอีก"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mid_kid_uni_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    title: "ลูกสอบติดมหาลัย"
    text: "{ชื่อลูก} สอบติดคณะในฝัน ค่าเทอมปีแรกเท่ากับเงินเก็บทั้งหมด {เงิน} บาท ลูกยืนรอคำตอบอยู่ที่ประตู"
    when: {flags: {has: [has_kids]}}
    weight: 2
    multipliers: {flags: {married: 1.3}}
    choices:
      - id: pay_full
        text: "จ่ายเต็ม ไม่ให้ลูกลำบาก"
        effects: {money: {unit: income_x, amount: -1.5}, relations: 2, happiness: 1}
        merit: [{cat: dana, level: 1}]
      - id: student_loan
        text: "ให้ลูกหางานพิเศษจ่ายเอง"
        effects: {relations: -1, knowledge: 1, health: 1}
        merit: [{cat: neutral}]
      - id: second_job
        text: "รับงานกะดึกเพิ่มอีกงาน"
        effects: {health: -2, income_mult: 1.2, relations: 1}
        merit: [{cat: neutral}]
      - id: borrow_uni
        text: "กู้ธนาคารมาจ่ายค่าเทอม"
        effects: {relations: 2, happiness: 1}
        sets_flags: [in_debt]
        merit: [{cat: neutral}]
      - id: kid_choose
        text: "ให้ลูกเลือกเองว่าจะไปทางไหน"
        outcomes:
          - {weight: 2, ok: true, text: "ลูกขอไปทำงานก่อนแล้วค่อยเรียนภาคค่ำ สามปีต่อมาลูกส่งเงินกลับบ้าน", effects: {relations: 2, happiness: 1, health: 1, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลูกเลือกเรียนต่อ แต่ค่าเทอมทั้งหมดก็ยังตกมาที่เราอยู่ดี", effects: {relations: 1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: mid_parent_care_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    title: "คนที่บ้านล้มป่วย"
    text: "ตีสองโทรศัพท์จากบ้านเกิดดัง คนที่บ้านล้มในห้องน้ำ หมอบอกว่าต่อไปต้องมีคนดูแลตลอด ญาติทุกคนเงียบใส่กันในกลุ่มไลน์"
    when: {family: [{role: parent, alive: true}]}
    weight: 2
    choices:
      - id: quit_care
        text: "ลาออกมาดูแลเอง"
        effects: {relations: 2, income_mult: 0.7, health: -1}
        merit: [{cat: care_parents, level: 3}]
      - id: nursing_home
        text: "จ้างศูนย์ดูแลผู้สูงอายุ"
        requires: {money: {unit: income_x, amount: 1}, reason: "เงินไม่พอจ้างศูนย์ดูแล"}
        effects: {money: {unit: income_x, amount: -1}, health: 1, happiness: -1}
        merit: [{cat: care_parents, level: 1}]
      - id: share_siblings
        text: "เรียกญาติประชุมแบ่งเวร"
        outcomes:
          - {weight: 2, ok: true, text: "แบ่งเวรได้ลงตัว ญาติที่ไม่คุยกันสิบปีกลับมานั่งกินข้าวด้วยกัน", effects: {relations: 3, happiness: 1}, merit: [{cat: care_parents, level: 2}], multipliers: {stats: {relations: 2}}}
          - {weight: 2, text: "ประชุมจบที่ทะเลาะเรื่องมรดก สุดท้ายงานทั้งหมดตกที่เราคนเดียว", effects: {relations: -2, health: -1}, merit: [{cat: care_parents, level: 1}]}
        merit: [{cat: care_parents, level: 1}]
      - id: move_in
        text: "รับมาอยู่บ้านแบบครอบครัวใหญ่"
        effects: {relations: 1, happiness: -1, health: 1}
        merit: [{cat: care_parents, level: 2}]
      - id: send_money
        text: "ส่งเงินอย่างเดียว ไม่มีเวลา"
        effects: {money: {unit: income_x, amount: -0.5}, relations: -2, health: 1}
        merit: [{cat: neutral}]

  - id: mid_crisis_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    title: "วิกฤตวัยกลางคน"
    text: "ส่องกระจกตอนเช้าแล้วถามตัวเองว่าชีวิตมาไกลแค่นี้เองเหรอ อายุ {อายุ} แล้วยังไม่เคยทำอะไรที่อยากทำเลยสักอย่าง"
    when: {age: [46, 55]}
    weight: 2
    multipliers: {flags: {married: 1.3, has_kids: 1.2}}
    choices:
      - id: big_bike
        text: "ถอยบิ๊กไบค์ออกทริปทั่วไทย"
        requires: {money: {unit: income_x, amount: 1}, reason: "เงินไม่พอถอยบิ๊กไบค์"}
        outcomes:
          - {weight: 3, ok: true, text: "ได้เพื่อนแก๊งใหม่ ขี่ไปถึงปลายด้ามขวาน หัวใจกลับมาเต้นแรงอีกครั้ง", effects: {happiness: 3, health: 1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 1, text: "ล้มในโค้งแรกของทริปแรก ขาเข้าเฝือกสามเดือน รถยังผ่อนไม่หมด", effects: {health: -3, happiness: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quit_dream
        text: "ลาออกไปทำตามฝันที่เก็บไว้"
        effects: {happiness: 2, income_mult: 0.8, knowledge: 1}
        sets_flags: [own_business]
        merit: [{cat: neutral}]
      - id: bar_nights
        text: "ตั้งวงกับเพื่อนเก่าทุกคืน"
        effects: {happiness: 1, health: -1, relations: -1}
        sets_flags: [heavy_drinker]
        merit: [{cat: intoxicants, level: 1}]
      - id: meditate
        text: "เข้าคอร์สปฏิบัติธรรมเจ็ดวัน"
        effects: {happiness: 2, health: 1, relations: -1}
        merit: [{cat: bhavana, level: 2}]
      - id: family_trip
        text: "พาครอบครัวเที่ยวที่ไม่เคยไป"
        effects: {relations: 2, money: {unit: income_x, amount: -0.5}}
        merit: [{cat: neutral}]

  - id: mid_risky_bet_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "โอกาสครั้งสุดท้าย"
    text: "รุ่นน้องชวนลงขันเปิดกิจการใหม่ บอกว่าถ้าไม่ลองตอนนี้ แก่ไปก็ไม่มีแรงลองแล้ว เงินเก็บ {เงิน} บาทนอนรออยู่ในบัญชี"
    weight: 2
    multipliers: {flags: {own_business: 1.5}, stats: {network: 1.2}, occupation: {service: 1.4, manager: 1.3}}
    choices:
      - id: all_in
        text: "ทุ่มหมดหน้าตัก"
        outcomes:
          - {weight: 1, ok: true, text: "กิจการติดตลาดภายในปีเดียว ยอดสั่งเข้าจนผลิตไม่ทัน ชีวิตเปลี่ยนทั้งบ้าน", effects: {happiness: 3, income_mult: 1.6}, sets_flags: [own_business], merit: [{cat: neutral}]}
          - {weight: 2, text: "รุ่นน้องหายไปพร้อมบัญชีบริษัท เหลือแต่ป้ายร้านกับหนี้ร่วม", effects: {happiness: -3, health: -1, money: {unit: income_x, amount: -2}}, sets_flags: [in_debt], next: mid_risky_chase_01, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: half_in
        text: "ลงแค่ครึ่ง เก็บอีกครึ่ง"
        outcomes:
          - {weight: 2, ok: true, text: "ได้ปันผลพอซื้อของขวัญให้ตัวเองทุกปี", effects: {happiness: 1, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ขาดทุนครึ่งที่ลง แต่อีกครึ่งยังอยู่ นอนหลับได้", effects: {happiness: -1, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: be_partner
        text: "ไม่ลงเงิน แต่ลงแรงช่วย"
        effects: {knowledge: 2, health: -1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: refuse
        text: "ปฏิเสธ แล้วไปออกกำลังกาย"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: own_shop
        text: "ไม่ร่วมกับใคร เปิดร้านเอง"
        effects: {income_mult: 1.15, health: -1, happiness: 1}
        sets_flags: [own_business]
        merit: [{cat: neutral}]

  - id: mid_online_boom_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "ร้านออนไลน์โตเกินตัว"
    text: "คลิปไลฟ์ขายของคลิปหนึ่งคนดูทะลุแสน ออเดอร์เข้าคืนเดียวเท่าขายทั้งปี กล่องพัสดุกองจนเดินในบ้านไม่ได้"
    when: {flags: {has: [online_seller]}}
    weight: 3
    multipliers: {flags: {own_business: 1.5, street_vendor: 1.5, has_kids: 1.3}}
    choices:
      - id: scale_up
        text: "เช่าโกดัง จ้างคนแพ็กเพิ่ม"
        outcomes:
          - {weight: 2, ok: true, text: "ยอดขายโตต่อเนื่อง กลายเป็นเถ้าแก่ที่มีลูกน้องสิบคน", effects: {income_mult: 1.5, happiness: 2, health: -1}, sets_flags: [own_business], next: mid_online_empire_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระแสหมดในสามเดือน โกดังว่างแต่สัญญาเช่ายังเหลือสองปี", effects: {happiness: -2, money: {unit: income_x, amount: -1.5}}, sets_flags: [in_debt], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: stay_small
        text: "ทำเท่าที่ไหว ไม่ขยาย"
        effects: {income_mult: 1.1, health: 1}
        merit: [{cat: neutral}]
      - id: family_team
        text: "ให้ทั้งบ้านมาช่วยกันแพ็ก"
        effects: {relations: 2, income_mult: 1.2, happiness: -1}
        merit: [{cat: neutral}]
      - id: sell_brand
        text: "ขายแบรนด์ให้นายทุนทั้งก้อน"
        effects: {money: {unit: income_x, amount: 3}, happiness: -1}
        clears_flags: [online_seller]
        merit: [{cat: neutral}]
      - id: hire_poor
        text: "จ้างคนว่างงานในชุมชนมาช่วย"
        effects: {relations: 2, income_mult: 1.1, happiness: 1, health: -1}
        merit: [{cat: help_others, level: 2}]

  - id: mid_scam_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "ปันผลเดือนละสิบเปอร์เซ็นต์"
    text: "เพื่อนสมัยเรียนทักมาหลังหายไปยี่สิบปี โชว์สลิปปันผลรายเดือน บอกว่ามีโควตาเหลือที่เดียว ปิดรับคืนนี้"
    weight: 2
    multipliers: {flags: {in_debt: 1.5, own_business: 1.2, scam_aware: 0.5, ponzi_victim: 0.6}}
    choices:
      - id: put_in
        text: "ลงเงินเก็บเกือบทั้งหมด"
        outcomes:
          - {weight: 3, text: "เดือนแรกได้ปันผลจริง เดือนที่สองแอปหายจากโทรศัพท์ทุกเครื่อง", effects: {happiness: -3, money: {unit: income_x, amount: -2}}, sets_flags: [ponzi_victim], merit: [{cat: neutral}]}
          - {weight: 1, text: "ถอนทันก่อนวงแตกสองวัน ได้กำไรมาแบบงง ๆ แต่เพื่อนอีกหลายคนไม่ทัน", effects: {happiness: 1, money: {unit: income_x, amount: 1}, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: test_small
        text: "ลองก้อนเล็ก ๆ ดูก่อน"
        outcomes:
          - {weight: 3, text: "ได้ปันผลสามเดือนติด เลยเติมก้อนใหญ่ แล้วทุกอย่างก็หายไปพร้อมกัน", effects: {happiness: -2, money: {unit: income_x, amount: -1}, health: -1}, sets_flags: [ponzi_victim], merit: [{cat: neutral}]}
          - {weight: 1, text: "ก้อนเล็กหายตั้งแต่เดือนแรก เจ็บแต่จำ ไม่เติมอีกเลย", effects: {knowledge: 2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: check_first
        text: "ค้นข้อมูลก่อนตัดสินใจ"
        outcomes:
          - {weight: 2, ok: true, text: "เจอข่าวว่าเป็นแชร์ลูกโซ่ที่มีคนเสียหายเป็นร้อย เลยรวบหลักฐานไปแจ้งความ", effects: {knowledge: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ข้อมูลดูน่าเชื่อจนเกือบโอนไปแล้ว มือสั่นนอนไม่หลับทั้งคืน", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: warn_others
        text: "ส่งเตือนในกลุ่มศิษย์เก่า"
        effects: {relations: 1, happiness: 1, knowledge: 1}
        merit: [{cat: help_others, level: 2}]
      - id: block_friend
        text: "บล็อกเพื่อนแล้วนอนต่อ"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mid_insurance_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    title: "ตัวแทนประกันที่หน้าบ้าน"
    text: "ตรวจสุขภาพประจำปีเจอค่าน้ำตาลเริ่มแดง วันรุ่งขึ้นหลานของเพื่อนบ้านถือแฟ้มประกันมานั่งรอที่หน้าประตู"
