        text: "ทำประกันสุขภาพเต็มวงเงิน"
        effects: {money: {unit: income_x, amount: -0.5}}
        sets_flags: [has_insurance]
        outcomes:
          - {weight: 1, ok: true, text: "ปีต่อมาล้มป่วยต้องนอนโรงพยาบาล เคลมค่ารักษาได้เต็มไม่เสียสักบาท", effects: {happiness: 2, health: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "จ่ายเบี้ยไปทุกปีโดยไม่เคยได้ใช้สักครั้ง", effects: {money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: buy_cheap
        text: "เอาแผนถูกสุดพอมีติดตัว"
        outcomes:
          - {weight: 3, ok: true, text: "เบี้ยถูก ใจสบาย มีชื่ออยู่ในระบบแล้ว", effects: {happiness: 1}, sets_flags: [has_insurance], merit: [{cat: neutral}]}
          - {weight: 1, text: "อ่านเงื่อนไขทีหลังถึงรู้ว่าโรคที่เป็นอยู่ไม่คุ้มครองเลย", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: self_insure
        text: "ไม่ทำ เปลี่ยนมาคุมอาหารเอง"
        effects: {health: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: insure_parents
        text: "ทำให้พ่อแม่ก่อนตัวเอง"
        effects: {relations: 2, money: {unit: income_x, amount: -0.5}, happiness: -1}
        merit: [{cat: care_parents, level: 2}]
      - id: become_agent
        text: "ขอสมัครเป็นตัวแทนเสียเอง"
        requires: {edu: มัธยม, reason: "ต้องจบมัธยมถึงจะสอบใบอนุญาตได้"}
        effects: {income_mult: 1.15, relations: -1, network: 1, health: -1}
        sets_flags: [has_insurance]
        merit: [{cat: neutral}]

