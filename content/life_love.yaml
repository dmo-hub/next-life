        outcomes:
          - {weight: 1, ok: true, text: "หลานทอดไข่ดาวไหม้ทุกเช้า จนอาทิตย์ที่สามขอบกรอบพอดีแบบที่คุณชอบ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ข้าวเช้าคือบะหมี่กึ่งสำเร็จรูปเจ็ดวันติด หมอทักเรื่องความดันตอนไปตรวจเดือนหน้า", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
