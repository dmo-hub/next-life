# การ์ดชีวิตผู้ใหญ่ชุด love (ใบ 241 จากร่าง 240)
events:
  - id: love_envelope_month_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    title: "การ์ดเชิญสามใบในเดือนเดียว"
    text: "ปลายเดือนนี้มีงานแต่งเพื่อนร่วมแผนกที่โรงแรม งานบวชหลานข้างบ้าน และงานศพครูประจำชั้นสมัยมัธยม การ์ดสามใบเสียบเรียงข้างตู้เย็น เงินในบัญชีพอค่าห้องกับค่าข้าวอีกสองสัปดาห์ ป้าข้างห้องกระซิบว่างานโรงแรมต้องใส่หนากว่างานบ้าน"
    choices:
      - id: by_closeness
        text: "ใส่ตามความสนิท ไม่ตามสถานที่"
        effects: {relations: 1, money: {unit: income_x, amount: -0.08}}
        merit: [{cat: neutral}]
      - id: send_via
        text: "ฝากซองไปกับเพื่อนทุกงาน"
        effects: {relations: -1, health: 1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: go_all_thin
        text: "ไปครบทุกงาน ซองบางเท่ากัน"
        outcomes:
          - {weight: 1, ok: true, text: "เจ้าภาพทั้งสามงานจำได้แค่ว่าคุณมาถึงงาน ไม่มีใครเปิดซองดูต่อหน้า", effects: {relations: 2, money: {unit: income_x, amount: -0.06}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "งานบวชกับงานศพตรงกันบ่ายวันเสาร์ ขับวนสองวัดจนไปถึงงานศพตอนพระสวดจบแล้ว", effects: {relations: -1, health: -1, money: {unit: income_x, amount: -0.06}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: eat_worth
        text: "เขียนชื่อตัวโตบนซอง กินให้คุ้ม"
        outcomes:
          - {weight: 1, ok: true, text: "บุฟเฟต์โรงแรมคุ้มค่าซองตั้งแต่จานที่สาม เจ้าบ่าวจำชื่อตัวโตได้ เดินมาขอบคุณถึงโต๊ะ", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ชื่อตัวโตบนซองบางถูกเปิดอ่านในกลุ่มแชตแผนก คนในแผนกเรียกคุณว่าบุฟเฟต์ไปทั้งเดือน", effects: {relations: -1, happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_gate_toll_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 42], sex: [ชาย]}
    title: "ประตูเงินประตูทองบานที่สาม"
    text: "คุณรับหน้าที่เพื่อนเจ้าบ่าวถือพานซองนำขบวนขันหมาก ผ่านประตูเงินประตูทองมาได้ แต่บานที่สามเป็นสร้อยทองที่น้องสาวเจ้าสาวกับเพื่อนอีกหกคนกั้นไว้ ขอซองเพิ่มพร้อมให้เจ้าบ่าววิดพื้นยี่สิบที กองเชียร์รอบข้างเริ่มนับถอยหลัง"
    choices:
      - id: pay_up
        text: "ควักซองสำรองจ่ายไปเลย"
        effects: {relations: 1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: haggle
        text: "ต่อรองซองครึ่ง มุกครึ่ง"
        outcomes:
          - {weight: 1, ok: true, text: "ต่อจนฝั่งเจ้าสาวหัวเราะยอมเปิดประตู ญาติสองฝ่ายจำหน้าคุณได้ทั้งงาน", effects: {network: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ต่อนานจนเลยฤกษ์ไปสิบนาที ผู้ใหญ่สองฝั่งเริ่มมองนาฬิกาพร้อมกัน", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: pushups
        text: "วิดพื้นแทนเจ้าบ่าวยี่สิบที"
        outcomes:
          - {weight: 1, ok: true, text: "ครบยี่สิบทีไม่หอบ เสื้อราชปะแตนไม่ขาด ได้เสียงปรบมือทั้งซอย", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทีที่สิบสองกระดุมเสื้อกระเด็น ทั้งขบวนต้องรอคุณกลัดเข็มกลัดแทน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: sing_gate
        text: "ร้องเพลงลูกทุ่งแลกเปิดประตู"
        outcomes:
          - {weight: 1, ok: true, text: "ร้องจบท่อนแรก น้าฝั่งเจ้าสาวร้องรับท่อนสอง ประตูเปิดเองโดยไม่ต้องเพิ่มซอง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร้องเพี้ยนจนเด็กแถวหน้าปิดหู แต่ยังต้องจ่ายซองเท่าเดิม", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_dowry_rent_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [31, 38], sex: [ชาย], family: [{role: spouse, count: [0, 0]}]}
    title: "พานสินสอดแบบเช่ารายวัน"
    text: "ฤกษ์ดีที่สุดของปีเหลืออีกเดือนเดียว เงินเก็บพอแค่ค่าโต๊ะ เพื่อนส่งเพจรับเช่าเงินสดกับทองวางพานมาให้ ค่าเช่าคิดรายวัน มีคนของร้านนั่งเฝ้าพานจนจบพิธีแล้วเก็บกลับ ผู้ใหญ่ฝั่งโน้นยังไม่รู้ว่าเงินในพานจะอยู่แค่ครึ่งวัน"
    choices:
      - id: rent
        text: "เช่ามาวางให้ทันฤกษ์"
        outcomes:
          - {weight: 1, ok: true, text: "พิธีผ่านไปสวย รูปพานสินสอดแน่นเต็มเฟรม ค่าเช่าผ่อนหมดในสามเดือน", effects: {happiness: 2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนเฝ้าพานนับแบงก์ต่อหน้าแขกก่อนเก็บใส่กระเป๋า ญาติทั้งงานเห็นพร้อมกัน", effects: {relations: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: delay
        text: "เลื่อนฤกษ์ไปปีหน้า"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: tell_truth
        text: "บอกความจริงกับผู้ใหญ่ฝั่งโน้น"
        outcomes:
          - {weight: 1, ok: true, text: "ผู้ใหญ่ฝั่งโน้นนิ่งไปพักหนึ่ง แล้วบอกว่าวางพานเท่าที่มี ที่เหลือค่อยว่ากัน", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าฝั่งโน้นถามซ้ำสามรอบว่าแน่ใจหรือว่าจะแต่ง", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: borrow_gold
        text: "ขอยืมทองทั้งซอยมาวางพาน"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าข้างบ้านถอดสร้อยให้ยืมสามเส้น พานแน่นกว่าแบบเช่า แถมทั้งซอยมาช่วยงาน", effects: {relations: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สร้อยเส้นหนึ่งหลุดหายระหว่างแห่ขบวน ทั้งซอยช่วยกันก้มหาจนมืด", effects: {relations: -1, money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_office_funeral_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    title: "เจ้าภาพสวดคืนที่สาม"
    text: "ตาของเพื่อนร่วมแผนกเสียที่อีสาน งานจัดห้าวัน แผนกรับเป็นเจ้าภาพสวดคืนที่สาม คุณถือซองรวมของทั้งแผนกขึ้นรถทัวร์ข้ามคืนไปคนเดียว ไปถึงจึงรู้ว่าคืนนั้นมีเจ้าภาพร่วมอีกสี่ราย และยังไม่มีใครเตรียมซองถวายพระ"
    choices:
      - id: pool_monks
        text: "ลงขันซองพระกับเจ้าภาพร่วม"
        outcomes:
          - {weight: 1, ok: true, text: "รวมกันได้ครบทุกซองก่อนพระขึ้นอาสน์ เจ้าภาพร่วมแลกเบอร์กันทั้งแถว", effects: {network: 2, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตกลงยอดต่อซองกันไม่ได้ เถียงกันเสียงเบาจนพระเริ่มสวด", effects: {relations: -1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: own_monks
        text: "ควักเงินตัวเองทำซองพระครบชุด"
        effects: {relations: 1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: hand_over
        text: "ส่งซองรวมให้เจ้าภาพ นั่งฟังสวด"
        effects: {health: 1, network: -1}
        merit: [{cat: neutral}]
      - id: kitchen_tent
        text: "เข้าครัวหลังเต็นท์ช่วยตำส้มตำ"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าในครัวยื่นครกให้ตั้งแต่สามทุ่ม ตำจนตีหนึ่ง ได้ชื่อว่าคนจากในเมืองที่มือหนักที่สุดในงาน", effects: {relations: 2, happiness: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หยิบปลาร้าผิดไห ป้าในครัวต้องเททิ้งทั้งครก แล้วส่งคุณไปล้างจานแทน", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_qingming_01
    type: A
    category: family
    stage: ทำงาน
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    title: "ฮวงซุ้ยกับงานส่งพรุ่งนี้"
    text: "กลุ่มแชตญาติส่งตารางเช็งเม้งมาตั้งแต่ต้นเดือน รถตู้ออกตีห้า หมูสามชั้นต้มทั้งชิ้นกับขนมถ้วยฟูสั่งไว้แล้ว กระดาษเงินกระดาษทองพับครบสามถุง ส่วนหัวหน้าเพิ่งเลื่อนส่งงานใหญ่มาเป็นเช้าวันเดียวกัน อาเจ็กหัวกลุ่มพิมพ์ถามว่าปีนี้มากี่คน"
    choices:
      - id: go_back
        text: "ขึ้นรถตู้ตีห้า ส่งงานจากมือถือ"
        outcomes:
          - {weight: 1, ok: true, text: "ถางหญ้ารอบฮวงซุ้ยเสร็จก่อนแดดแรง ส่งงานทันในร้านโจ๊กข้างสุสาน", effects: {relations: 2, happiness: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สัญญาณบนเนินขึ้นแค่ขีดเดียว งานส่งช้าไปครึ่งวัน", effects: {relations: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: pray_home
        text: "ไหว้ที่ห้อง ส่งรูปเข้ากลุ่ม"
        effects: {relations: -1, health: 1}
        merit: [{cat: neutral}]
      - id: send_money
        text: "โอนค่าของไหว้ไปแทนตัว"
        effects: {relations: 1, happiness: -1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: report_ancestors
        text: "ฝากอาจุดธูปบอกว่าติดงาน"
        outcomes:
          - {weight: 1, ok: true, text: "อาจุดธูปเพิ่มให้หนึ่งดอก รายงานบรรพบุรุษเสียงดังจนได้ยินทั้งเนิน แล้วส่งคลิปมาให้ดู", effects: {relations: 1, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อารายงานบรรพบุรุษครบทุกคำ แล้วเล่าซ้ำให้ญาติทั้งตระกูลฟังอีกรอบตอนกินข้าว", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_aunt_questions_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [25, 30], family: [{role: spouse, count: [0, 0]}]}
    title: "วงข้าวรวมญาติกับคำถามชุดเดิม"
    text: "ข้าวคำแรกยังไม่ทันพ้นคอ ป้าคนกลางถามว่าเงินเดือนเท่าไร แฟนมีหรือยัง จะแต่งเมื่อไร ลูกพี่ลูกน้องที่เพิ่งแต่งไปปีก่อนหันมายิ้มรอฟัง น้าอีกคนเติมว่าอายุเท่านี้สมัยก่อนอุ้มคนที่สองแล้ว"
    choices:
      - id: honest
        text: "ตอบตรงทุกข้อ ตัวเลขด้วย"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าพยักหน้าช้า ๆ แล้วตักแกงให้เพิ่ม บอกว่าค่อยเป็นค่อยไปก็ได้", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตัวเลขเงินเดือนถูกส่งต่อถึงโต๊ะที่สามก่อนของหวานมา", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: joke
        text: "ตอบเป็นมุกจนทั้งวงหัวเราะ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งวงหัวเราะจนป้าลืมคำถาม หันไปถามเลขหวยงวดหน้ากับน้าแทน", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าขำตามมารยาท แล้วจดคำถามชุดเดิมไว้ถามซ้ำสงกรานต์หน้า", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quiet
        text: "ยิ้ม ตักข้าวเพิ่ม ไม่ตอบ"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: ask_back
        text: "ถามกลับว่าลุงได้บำนาญเท่าไร"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงเล่ายาวตั้งแต่สมัยรับราชการจนทั้งวงลืมคำถามเดิม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วงข้าวเงียบกริบ ป้าวางทัพพีเสียงดังกว่าปกติ", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: love_last_train_01
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 39], sex: [หญิง], family: [{role: spouse, count: [0, 0]}]}
    title: "รถด่วนขบวนสุดท้าย"
    text: "งานทำบุญขึ้นบ้านใหม่ของญาติ น้าสาวดึงแขนไปนั่งข้าง ๆ กระซิบว่าเลขสามแล้วอย่าเลือกมาก รถด่วนขบวนสุดท้ายใกล้ออกแล้ว แล้วพยักเพยิดไปที่ผู้ชายเสื้อขาวโต๊ะปลาย บอกว่าเพิ่งกลับมาเปิดร้านวัสดุก่อสร้างในอำเภอ"
    choices:
      - id: meet
        text: "ไปทักผู้ชายโต๊ะปลาย"
        outcomes:
          - {weight: 1, ok: true, text: "คุยเรื่องปูนกับสีทาบ้านได้ชั่วโมงกว่า แลกเบอร์กันก่อนพระฉันเพล", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาเล่าเรื่องร้านวัสดุไม่หยุด จนพระฉันเสร็จก็ยังไม่ถามชื่อคุณ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: own_pace
        text: "ขอบคุณน้า แล้วเปลี่ยนเรื่อง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: career_first
        text: "บอกว่าขอเลื่อนขั้นให้ได้ก่อน"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: refund_ticket
        text: "ถามน้าว่าตั๋วขบวนนี้คืนได้ไหม"
        outcomes:
