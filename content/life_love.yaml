        outcomes:
          - {weight: 1, ok: true, text: "เจ้าของร้านในตลาดรับหลานเข้าทำงานวันจันทร์ คุณได้หน้าทั้งซอย", effects: {network: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หลานไปสายตั้งแต่วันแรก เจ้าของร้านโทรมาฟ้องคุณก่อนเที่ยง", effects: {network: -1, happiness: -1}, merit: [{cat: neutral}]}
