# คำต้องห้าม (ใบ 07 + 08 + 12) — ด่านนี้จับได้ไม่ครบโดยตั้งใจ เจ้าของยังต้องอ่านทุกใบ
# แต่ละข้อมี bad (ต้องจับได้) และ ok (ต้องไม่จับ) — npm run lint:test ตรวจทั้งสองฝั่ง กันแก้ regex แล้วด่านบอดเงียบ
banned:
  - id: monarchy
    why: ห้ามแตะสถาบัน (ม.112) — ใบ 08
    pattern: "สถาบันพระมหากษัตริย์|ในหลวง|พระเจ้าอยู่หัว|ราชวงศ์|เจ้าฟ้า|พระบรมราช|พระราชินี|ม\\.\\s?112"
    bad: ["ข่าวในหลวงเสด็จ", "คดี ม.112"]
    ok: ["หลวงพ่อที่วัดใกล้บ้าน"]
  - id: real_politics
    why: ใช้ประเด็นกว้าง ๆ แทนการเมืองจริง — ห้ามชื่อพรรค นักการเมือง รัฐประหาร
    pattern: "พรรค[ก-๙]+|นายกรัฐมนตรี|นายกฯ|รัฐประหาร|ทักษิณ|ประยุทธ์|ยิ่งลักษณ์|อภิสิทธิ์|เสื้อแดง|เสื้อเหลือง|กปปส|นปช"
    bad: ["ม็อบเสื้อแดงปิดถนน", "พรรคการเมืองแจกเงิน"]
    ok: ["วันเลือกตั้งผู้ใหญ่บ้าน"]
  - id: monk_mockery
    why: พระ/พระพุทธรูปเป็นตัวตลกไม่ได้ — ใบ 07 + 12
    pattern: "(พระ|หลวงพ่อ|หลวงตา|เณร|พระพุทธรูป)[^ ]{0,12}(ตลก|ขำ|โง่|เมา|ล้อเลียน|ปัญญาอ่อน|ตีกัน)"
    bad: ["หลวงตาเมาเหล้าล้มกลิ้ง", "เณรโง่ ๆ"]
    ok: ["ไปทำบุญกับหลวงพ่อ"]
  - id: region_blame
    why: ห้าม "เพราะเกิดภาค X" — ชะตาไม่ได้มาจากภาคที่เกิด (ใบ 03 + 08)
    pattern: "เพราะ(เกิด|เป็นคน|มาจาก)(ที่|ใน)?(ภาค|อีสาน|เหนือ|ใต้|กลาง|ตะวันออก|ตะวันตก|บ้านนอก|\\{ภาค\\})"
    bad: ["จนเพราะเกิดอีสาน", "เพราะเป็นคน{ภาค}"]
    ok: ["ย้ายจากอีสานเข้ากรุงเทพฯ"]
  - id: investment_advice
    why: ห้ามประโยคแนะนำการลงทุนจริง — ใบ 07
    pattern: "(ควร|ต้อง|แนะนำให้|รีบ)(ซื้อ|ลงทุน|ถือ|เก็บ)(หุ้น|ทอง|กองทุน|คริปโต|บิทคอยน์)|หุ้นตัวนี้|กำไรแน่นอน|รวยแน่"
    bad: ["ควรซื้อหุ้นตอนนี้", "ลงตัวนี้กำไรแน่นอน"]
    ok: ["เก็บเงินฝากธนาคาร"]
  - id: real_org_fraud
    why: ห้ามชื่อองค์กรจริงในทางทุจริต — ใบ 07 (จับเฉพาะชื่อที่รู้จัก ที่เหลือเจ้าของอ่าน)
    pattern: "(ธนาคาร(กรุงเทพ|กสิกร|ไทยพาณิชย์|กรุงไทย|กรุงศรี|ออมสิน)|ปตท|การบินไทย|ซีพี|เซเว่น)[^ ]{0,20}(โกง|ทุจริต|ฉ้อ|หลอก)"
    bad: ["ธนาคารกรุงไทยโกงลูกค้า"]
    ok: ["ไปฝากเงินที่ธนาคาร"]
  - id: numen_works
    why: ห้ามบอกว่าเลขนิมิต/พิธีกรรมได้ผล หรือบุญทำให้ถูกหวย — ใบ 11 + 12
    pattern: "(เลข|หวย)[^ ]{0,10}(แม่น|เข้าแน่|ถูกแน่|เด็ดจริง)|(บุญ|แก้บน|บนบาน|เครื่องราง|ทำบุญ|พิธี)[^ ]{0,15}(ทำให้|จึง|เลย)(ถูกหวย|ถูกรางวัล|รวย|หายป่วย)"
    bad: ["เลขต้นตะเคียนแม่นมาก", "ทำบุญเลยถูกหวย"]
    ok: ["ซื้อหวยตามความฝัน แล้วรอผล"]
  - id: ghost_accusation_glory
    why: ผีกะ/ปอบเป็นกลไกกล่าวหาที่เคยทำร้ายคนจริง — ห้ามเล่าว่าการไล่/กล่าวหาเป็นเรื่องดี (ใบ 08 + 12)
    pattern: "(ไล่|จับ|กำจัด)(ผี)?(ปอบ|ผีกะ)[^ ]{0,20}(สำเร็จ|ได้บุญ|เป็นวีรบุรุษ|หมู่บ้านสงบ)"
    bad: ["ไล่ปอบสำเร็จ หมู่บ้านสงบ"]
    ok: ["ข่าวลือเรื่องปอบทำให้ยายข้างบ้านถูกรังเกียจ"]
