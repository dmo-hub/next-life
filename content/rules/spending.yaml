# ระดับการใช้จ่าย (B29 · ใบ 52): ประหยัด / ปกติ / หรูหรา — เลือกที่การ์ดทุก ~5 ปี (เจ้าของเคาะ: เป็นการ์ด ไม่ใช่ปุ่ม · เกษียณยังเลือกได้)
# ตัวคูณ = เงินเก็บที่เข้ากระเป๋าแต่ละปี (คูณเฉพาะเงินเก็บที่เข้ากระเป๋า ราคาทั้งเกมเท่าเดิม — ไม่แตะ yearlySaving)
# ค่าเริ่ม = ปกติ = ×1 ⇒ ชีวิตที่ไม่เลือกต้องได้ผลเท่า main ทุกบิต
# luxury_happy = ความสุขเพิ่มตอนเลือกหรูหรา · luxury_decay = ผลสุขหรูหราจางลงต่อครั้งที่เลือกติดกัน (diminishing returns)
# ค่า AI ตั้ง — ต้องให้เจ้าของเคาะ (list ใน PR)
