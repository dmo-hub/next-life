# นิสัยจากวัยเด็ก (B41 · ใบ ft07) โลกหลัก — แยกออกจาก focus.yaml ใบ ft15a เพื่อให้ลบโฟกัสเดิมได้โดยไม่ลากนิสัยไปด้วย · ค่าเท่าเดิมทุกตัว
# กติกาอยู่ src/engine/life.mjs (naturePoint · natureLock · natureBoost · treeNature) · ผู้อ่านผ่าน content.nature
#
# นิสัยจากวัยเด็ก (B41): แต้มจากปีทุ่มเทที่ติด nature +1/ปี และตัวเลือกการ์ดที่ติด `nature:` +1/ครั้ง จนถึงอายุ nature_age แล้วล็อกตัวแต้มสูงสุด
# nature_age  = อายุที่ล็อกนิสัย (ปีของอายุนี้ยังนับ) · heir_nature = แต้มต่อปีของทุ่มเทที่ทายาทได้จากพ่อแม่เองก่อนผู้เล่นเปลี่ยน (เจ้าของเคาะครึ่ง)
# ไม่มีแต้มเลย = ไม่มีนิสัยเด่น
# ต่อนิสัย: stat = ค่าที่ผลบวกจากตัวเลือกการ์ดคูณ nature_mul (money นับเฉพาะการ์ดหมวดใน cards) · jobs = อาชีพตรงสาย การ์ดขึ้นเงินเดือน (income_mult) ส่วนที่ขึ้นคูณ nature_mul
nature_age: 12
heir_nature: 0.5
nature_mul: 1.1
# node_pts = แต้มนิสัยที่ได้ตอนปลดโหนดเด็ก (ใบ ft07 ข้อ 16 51) · โหนดที่ผูกนิสัยปลดถึงอายุ nature_age ป้อนแต้มเข้ากองเดียวกับทุ่มเทเด็ก · นิสัยเด่น = แต้มสูงสุด นิสัยอื่นที่มีโหนดปลดแล้วแค่เปิดตัวเลือก (requires.nature)
# ต่อนิสัย: nodes = โหนดต้นไม้ที่ผูก (content/rules/tree.yaml)
node_pts: 2
natures:
  social: {name: เข้ากับคนง่าย, stat: relations, jobs: [service, manager, senior_officer], nodes: [r1]}
  learn: {name: ใฝ่รู้, stat: knowledge, jobs: [professional, clerk, technician, officer], nodes: [k1]}
  duty: {name: ขยันรับผิดชอบ, stat: money, cards: [work_money], jobs: [farmer, craft, labor, factory], nodes: [mo1]}
  bold: {name: ใจกล้า, stat: health, nodes: [s1]}
  calm: {name: สงบใจ, stat: happiness, nodes: [o1, o2, o9]}
