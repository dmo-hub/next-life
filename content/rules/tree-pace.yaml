# ตัวเร่ง/ชะลอการปลดต้นไม้โฟกัส (ใบ 08) — กติกาอยู่ src/engine/tree.mjs treePace · ตัวเลขทุกตัวเป็นค่าเริ่ม ให้ harness `tree-pace` ปรับ (ข้อ 57)
# ความเร็วต่อปี = ผลคูณของตัวเร่งที่มี · 1 = ปีเต็ม 1 ปีเท่าเดิม · ไม่มีตัวเร่งเลย (ยกเว้นอายุ) = เท่าเดิม
# age_end / age_end_mul = ยิ่งแก่ยิ่งช้า ลดเชิงเส้นจาก 1 ที่อายุ 0 เหลือ age_end_mul ที่อายุ age_end (สูตร ×0.6 ของอสงไขยย่อสเกลอายุไทย ~75) · เกิน age_end คงที่
# teacher = ฝากตัวเป็นศิษย์ครูตอนจบประถม (ธง tree_teacher) · learn = นิสัยเด่นใฝ่รู้ (st.nature)
# class_step / class_mid = ฐานะตอนเกิด (ลำดับ 0–9 ยากไร้ → มั่งคั่ง) ปรับเป็น 1 + class_step × (ลำดับ − class_mid) · ฐานะสูงเรียนรู้เร็วกว่าเล็กน้อย
age_end: 75
age_end_mul: 0.6
teacher: 1.25
learn: 1.15
class_step: 0.02
class_mid: 4.5
