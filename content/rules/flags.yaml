# ธงที่แกนส่งถึงทายาททางสายเลือด (ทางเป็นลูก) — อ่านด้วย when.parent_flags / multipliers.parent_flags เท่านั้น ไม่เข้า flags ของทายาท
# tier = ชั้นไกลสุดที่ยังได้ (1 ลูก · 2 หลาน) · tell = คำที่หน้าจอใช้ (คนในบ้าน — เพศผู้ถือธงรู้ตอนเล่นเท่านั้น)
