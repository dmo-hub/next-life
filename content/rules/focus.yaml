# โฟกัสชีวิต (สิ่งที่ทุ่มเท) โลกหลัก — กติกาอยู่ src/engine/focus.mjs (ตัวกลางทุกโลก) · ที่นี่คือเนื้อของโลกหลัก
# ไม่ตั้งโฟกัส = "ใช้ชีวิตตามน้ำ" ไม่มีผลอะไรเลย (ไม่อยู่ในรายการนี้ แกนใส่ให้เอง)
#
# year_scale  = ผลต่อปีเป็นกี่เท่าของผลการ์ดระดับเดียวกัน (fx ใช้ระดับ ±1..±3 แบบการ์ด · เงินใช้หน่วยแบบการ์ด)
# spend_scale = ค่าใช้จ่ายรายปีของโฟกัส (fx เงินติดลบ) หรี่ลงอีกเท่านี้ — ด่าน finance ชนะ (เจ้าของเคาะ) · ระดับในตารางยังบอกคำ "เงินลด/ลดมาก" ตามเดิม
# card_mul    = การ์ดกองสุ่มที่หมวดตรงโฟกัส น้ำหนักคูณเท่านี้ (เจ้าของเคาะ ×2)
# chain_years = ปีเต็มที่ต้นสายต้องสะสมก่อนปลายสายโผล่ (เจ้าของเคาะ ≥ 3 เท่าประตู)
# tags        = ป้ายหมวดเพิ่มนอก category ที่การ์ดติดได้ด้วย `focus: [ป้าย]` · category ของการ์ด (study · work_money · family · health · belief · society) ใช้เป็นป้ายได้เลยไม่ต้องลงที่นี่
#
# ต่อโฟกัส: name = ชื่อบนปุ่ม · group = หมวดโฟกัส (work · people · body · gate) · stages = ช่วงวัยที่เลือกได้
# when = เงื่อนไขสถานะแบบ when ของการ์ด · need = สถานะที่ when เขียนไม่ได้ (ชื่อใน FOCUS_NEEDS ของแกน ต้องผ่านทุกตัว)
# after = ปลายสาย: ซ่อนจนโฟกัสต้นสายตัวนี้สะสมครบ chain_years แล้วโผล่ตั้งแต่ช่วงวัยถัดไป
# fx = ผลต่อปี (ขึ้น/ลงบอกบนปุ่มเป็นคำจากเครื่องหมาย ไม่บอกตัวเลข · เงินคิดเฉพาะปีที่มีรายได้ของตัวเอง) · cards = ป้ายหมวดการ์ดที่ถ่วง
# career = ตอนมีงาน: rank = ปีในขั้นที่นับเพิ่มต่อปี (เลื่อนขั้นเร็ว/ช้า) · raise = รายได้โตเพิ่มต่อปี (สัดส่วน)
# risk = เสี่ยงสุ่มรายปี: chance · fx · text (การ์ดผล) · flags · cause = ตายได้ (ครั้งแรกขึ้น warn เป็นการ์ดเตือน โดนซ้ำหลังเตือน = ตายด้วยสาเหตุนี้)
# kid = ตัวเด็กที่ทายาทในตระกูลเริ่มชาติด้วย เมื่อโฟกัสนี้คือโฟกัสหลักของรุ่นก่อน (ไม่ใส่ = ทายาทตามน้ำ)
year_scale: 0.25
spend_scale: 0.25
card_mul: 2
chain_years: 3
tags: {}
focuses:
  # ── เด็ก–วัยรุ่น ──
  play_friends:
    name: เล่นกับเพื่อน
    group: people
    stages: [เด็ก, วัยรุ่น]
    fx: {relations: 1, happiness: 1, knowledge: -1}
    cards: [society]
    kid: play_friends
  study_hard:
    name: ตั้งใจเรียน
    group: work
    stages: [เด็ก, วัยรุ่น, หนุ่มสาว]
    when: {school: [primary, lower, upper, voc, hvoc, uni, cadet, police_cadet]}
    fx: {knowledge: 2, happiness: -1}
    cards: [study]
    kid: study_hard
  house_chores:
