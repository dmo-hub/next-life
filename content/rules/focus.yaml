      - {chance: 0.06, fx: {health: -2, happiness: -1}, text: "ปีนต้นไม้แล้วกิ่งหัก ตกลงมาแขนหัก ต้องเข้าเฝือกอยู่หลายเดือน"}
    kid: run_wild

