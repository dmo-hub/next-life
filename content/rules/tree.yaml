# ต้นไม้โฟกัส (ใบ 03 tracer) — กติกาอยู่ src/engine/tree.mjs · ที่นี่คือเนื้อ · อยู่คู่โฟกัสเดิม (focus.yaml) ไม่แทนที่
# ทั้งต้น 5 แขนง (money rel know skill occ) + โหนดกลาง (mid) ตามร่าง tree-draft.html รอบ 4 (ข้อ 76 81 82) · ใบ 06
# ตัวเลขทุกตัวเป็นจุดเริ่มต้น ให้ harness `tree` ปรับ (ข้อ 74)
#
# year_scale = ผลเต็มต่อปีคูณเท่านี้ (ระดับ ±1..±3 แบบการ์ด เหมือน focus.yaml)
# light_unit = ผลเบาถาวรต่อปีหลังปลด แยกตามขนาดโหนด (s เล็ก · b ใหญ่ · k หักเห) เป็นหน่วย "ระดับการ์ด/ปี" (งบรวม ≤ 0.50 ข้อ 20)
# ต่อโหนด: branch · size · stages (ช่วงวัยที่ทุ่มได้) · pre (โหนดต้นทาง ในแขนงเดียวกัน = ปลดอันใดอันหนึ่งก็พอ ข้อ 72)
#   years = ปีเต็มที่ต้องทุ่ม · cards = จำนวนการ์ดหมวดตรงที่ต้องตอบระหว่างทุ่ม (ข้อไหนก็นับ ข้อ 45) · cat = หมวดการ์ดที่นับ
#   fx = ผลเต็มระหว่างทุ่ม · light = ผลเบาถาวรหลังปลด (ระดับ) · hidden = ซ่อนจนต้นทางปลดแล้ว (ช่อง "?" จองที่ไว้)
# ผลติดตัวหลังปลด (ใบ 04) — ทอย/ถ่วง/งบ · ตัวเลขทุกตัวเป็นจุดเริ่มต้นให้ harness `tree` วัด (ข้อ 11 ผลแรงทำตามดีไซน์ก่อน ด่านที่ตกยื่นเจ้าของเคาะ)
# roll_k   = ตัวคูณทางสำเร็จของการ์ดหมวดตรง = 1 + roll_k × Σ roll ของโหนดที่ปลด (ต่อแขนง ข้อ 58 · แบบ thaiSkillMul · ชนเพดาน okMax 0.95 ที่ปลายทาง) · 0.1 = ขั้นละ ~2–3 จุด (โหนดเดียวต่ำกว่าขั้น 5% ข้อ 58)
# card_mul = ถ่วงน้ำหนักการ์ดกองสุ่มหมวดของ "แขนงที่ปลดมากสุด" ถาวร (ข้อ 42) · แขนงเสมอกัน/แขนงอื่น = 1 · โฟกัสเดิม ×2
# budget   = เพดานผลเบาถาวรรวมทั้งต้น/ปี (ระดับการ์ด/ปี) ข้อ 93 · Σ |light| × light_unit ของทุกโหนดในทะเบียน ต้องไม่เกิน (ตรวจใน lint)
# ต่อโหนด: roll = ระดับทอยที่ปลดแล้วให้หมวดใน cat (จำนวนเต็ม ≥ 0) · jobs + job_roll = อาชีพที่ตรงแขนง ได้ job_roll เพิ่มชั้นเดียว (ไม่ซ้อน ข้อ 50 53)
roll_k: 0.1
card_mul: 1.25
budget: 0.5
# rust     = สนิม (ใบ 09 ข้อ 31 63 94): โหนดที่ปลดแล้วไม่ถูก "ใช้" (ตอบการ์ดหมวดตรงแขนง) ครบ years ปี → ผลเบารายปีเหลือ floor เท่า · ตัวเลือกที่ปลดไม่หาย · ใช้อีกครั้งผลกลับเต็ม · ล้างโหนดปีละ 1 ไม่มีตัวเลขในทะเบียน (กติกา)
rust:
  years: 5
  floor: 0.5
# start    = จุดเกิด (ข้อ 15 39 17 97): ทุกชีวิตเริ่ม 1 แขนง สุ่มถ่วงน้ำหนัก = base + ฐานะ + อาชีพ + แขนงพ่อแม่ (ทายาท · ยังไม่ส่งต่อ = 0) · ลำดับความสำคัญ ฐานะ > อาชีพ > แขนงพ่อแม่ ด้วยขนาดแต้ม
#   class = แต้มต่อแขนงตามชั้นฐานะ (low = ยากไร้..ค่อนข้างจน · mid = ชนชั้นกลางล่าง..กลางบน · high = มีอันจะกิน..มั่งคั่ง) · job = แต้มเพิ่มต่อแขนงตามอาชีพ · parent_branch = แต้มให้แขนงที่พ่อแม่ทุ่มมากสุด
#   พ่อแม่ไม่มีโหนดเลย = ไม่ได้แต้มแขนงพ่อแม่ ที่เหลือยังถ่วงตามฐานะ/อาชีพ (ข้อ 67 73) · ตัวเลขเป็นจุดเริ่มต้นให้ harness tree วัดส่วนแบ่ง (ข้อ 74)
# โหนดกลาง (branch mid) = ข้ามแขนง ไม่ใช่แขนงที่ 6: and = ต้องปลดแม่ครบทุกตัว · nolight = ปลดตัวเลือกอย่างเดียว ไม่มีผลเบา/ทอย (ข้อ 83)
# เงินไม่อยู่ใน fx/light (lint ห้ามตั้งแต่ใบ 03 ให้ด่าน finance คุมเงิน) · แขนงเงินส่งผลผ่านทอยบนการ์ด work_money + ตัวเลือกใหม่ + jobs/job_roll
