    years: 4
    cards: 2
    cat: [belief]
    fx: { happiness: 1, relations: 1 }
    light: { happiness: 1 }
  o6:
    name: ศึกษาสายลี้ลับ
    branch: occ
    size: s
    hidden: true
    stages: [วัยรุ่น, หนุ่มสาว, ทำงาน, กลางคน, ชรา]
