        line: "{ทายาท:พ่อที่เคยใส่เครื่องแบบ เดินผ่านห้องบ่อยกว่าปกติ|แม่เดินผ่านห้องบ่อยกว่าปกติ เหมือนสมัยตัวเองรอผลสอบเป็น{ทางแม่}|{ผู้ใหญ่}เดินผ่านห้องบ่อยกว่าปกติ หยุดมองรูปพ่อในเครื่องแบบทุกรอบ|{ผู้ใหญ่}เดินผ่านห้องบ่อยกว่าปกติ หยุดมองรูปแม่ในเครื่องแบบทุกรอบ}"
        # lateMother (บท S1 · เจ้าของเคาะ 2026-11-10 · cadet-b5-late-mother.md c)
      - when: { heir: police }
        line: "{ทายาท:พ่อที่เคยใส่เครื่องแบบ เดินผ่านห้องบ่อยกว่าปกติ|แม่เดินผ่านห้องบ่อยกว่าปกติ เหมือนสมัยตัวเองรอผลสอบเป็น{ทางแม่}|{ผู้ใหญ่}เดินผ่านห้องบ่อยกว่าปกติ หยุดมองรูปพ่อในเครื่องแบบทุกรอบ|{ผู้ใหญ่}เดินผ่านห้องบ่อยกว่าปกติ หยุดมองรูปแม่ในเครื่องแบบทุกรอบ}"
    prep:
      campWeb: ที่ติวส่งเฉลยมาตั้งแต่เมื่อคืน ยังไม่กล้าเปิด
      group: กลุ่มติวนัดกันแล้วว่าพรุ่งนี้จะไปดูผลพร้อมกัน
      self: ไม่มีใครให้เทียบคำตอบ นอกจากสมุดจดของตัวเอง
      senior: รุ่นพี่ฝากมาบอกว่า ปีนั้นพี่ก็นอนไม่หลับ
    retry: ปีก่อนวันนี้ก็เป็นแบบนี้ ต่างกันที่ปีนี้รู้แล้วว่าจะรู้สึกยังไง
    # การ์ดตามสถานะ: แอบสอบ W5 → บ้านลำบากที่บ้านไม่ได้ออกค่าติว W4 → อารมณ์จากคะแนนแบบวัดดีสุด (good/mid/bad · numbers.wait_mood_good)
    # rnd = ผลสุ่มสองทาง โอกาส numbers.outcome_split_p (V6) · showIf/hideIf ใช้เงื่อนไขชุดเดียวกับ condOk (lastTry = ปีสุดท้ายที่สมัครได้)
    cards:
      secret:
        id: X2w-W5
        title: ทำเหมือนวันธรรมดา
        text: ที่บ้านยังไม่รู้ว่าหลายวันที่หายไปคือไปสอบ วันนี้ต้องทำตัวเหมือนวันธรรมดา ทั้งที่พรุ่งนี้เลขของ {ชื่อ} อาจอยู่บนป้าย หรือไม่อยู่เลย
        options:
          - { label: ทำตัวปกติ ช่วยงานตามเดิม, fx: { relations: 1, happiness: -1 }, result: ยิ้มตอบทุกคำถาม ไม่มีใครสังเกตว่ามือสั่นตอนล้างจาน }
          - label: บอกความจริงก่อนผลออก
            hint: ไม่ต้องซ่อนอีก แต่ไม่รู้ว่าจะรับได้ไหม
            merit: { sila: 1 }
            clearFlags: [cadet_family_secret]
            setFlags: [cadet_family_told]
            rnd:
              - { result: ปลายโต๊ะข้าวเงียบไปนาน แล้วมีคนถามว่าพรุ่งนี้กี่โมง, fx: { relations: 1 } }
              - { result: ไม่มีใครตะคอก แต่ข้าวมื้อนั้นไม่มีใครกินหมด, fx: { relations: -1 } }
          - { label: ออกจากบ้าน อ้างว่าไปหาเพื่อน, fx: { happiness: -1 }, result: นั่งที่ป้ายรถเมล์ทั้งบ่าย นับรถที่ผ่านไปแทนเวลา }
          - { label: เตรียมคำพูดไว้ ถ้าติดจริง, hint: ถ้าติดจะพูดง่ายขึ้น ถ้าไม่ติดก็ไม่ต้องใช้, fx: { happiness: 1 }, _flow: { rehearsed: true }, result: ซ้อมพูดกับกระจกจนจำได้ ประโยคแรกคือ ขอโทษที่ไม่ได้บอก }
      poor:
        id: X2w-W4
        title: วันว่างที่ไม่ว่าง
        text: วันว่างของ {ชื่อ} ไม่ได้ว่างจริง ค่าสมัครกับค่ารถหลายสนามที่ผ่านมา ทุกคนในบ้านรู้ว่าเจียดมาจากตรงไหน งานที่บ้านไม่รอผลสอบ
        options:
          # S3 (g-b7 2026-11-10): ยุคเว็บผลขึ้นเว็บ ไม่ต้องนั่งรถไปดู → resultWeb = ค่าร้านเน็ต
          - { label: รับจ้างรายวันหนึ่งวัน, hint: ได้เงินคืนบ้าง แต่ร่างกายจะล้า, fx: { money: 1, health: -1 }, result: ขนของขึ้นรถจนบ่ายแก่ ได้ค่าแรงพอค่ารถไปดูผลพรุ่งนี้, resultWeb: ขนของขึ้นรถจนบ่ายแก่ ได้ค่าแรงพอค่าร้านเน็ตพรุ่งนี้ }
          - { label: ช่วยงานที่บ้านทั้งวัน, fx: { relations: 1, health: -0.4 }, merit: { care_parents: 1 }, result: ทำงานเคียงกันทั้งวัน ไม่มีใครพูดถึงพรุ่งนี้ แต่ทุกคนรู้ }
          - { label: สอนการบ้านเด็กข้างบ้าน, fx: { money: 0.4, knowledge: 1 }, result: สอนเศษส่วนอยู่สองชั่วโมง ได้ค่าขนมกับฝรั่งอีกถุง }
          - { label: ขอพักสักวันก่อนรู้ผล, hint: ได้พัก แต่มีคนต้องทำแทน, fx: { health: 1, relations: -0.4 }, result: นอนฟังเสียงคนในบ้านทำงานอยู่ข้างนอก หลับไม่ลงอย่างที่คิด }
      good:
        id: X2w-W1
        title: ใจเบา
        text: ตื่นมาสาย นึกย้อนข้อสอบทีละสนาม ส่วนใหญ่ยังจำได้ว่าตอบอะไร ใจเบากว่าที่คิด แต่ยังไม่กล้าบอกใครว่าทำได้ดี กลัวพูดแล้วไม่เป็นอย่างนั้น
        options:
          - { label: นอนต่อให้เต็มอิ่ม, fx: { health: 1 }, result: หลับยาวถึงบ่าย ตื่นมาตัวเบาเหมือนไม่ได้สอบมาหลายวัน }
          - { label: ออกไปวิ่งเบา ๆ ตอนเย็น, hint: เผื่อรอบสอง ถ้าได้ไปถึง, fx: { health: 1 }, result: วิ่งรอบสนามโรงเรียนจนฟ้ามืด ขาเริ่มจำจังหวะเดิมได้ }
          - { label: ช่วยงานบ้านที่ค้างไว้, fx: { relations: 1 }, merit: { care_parents: 1 }, result: ล้างจาน กวาดลาน ไม่มีใครชม แต่ข้าวเย็นมีไข่ทอดเพิ่มหนึ่งฟอง }
          - label: นั่งเทียบคำตอบกับคนอื่น
            hint: อาจโล่งใจ หรืออาจเสียดาย
            showIf: { yearFrom: web_year }
            outcomes:
              - { p: 0.6, fx: { happiness: 1 }, result: เปิดเฉลยที่ที่ติวโพสต์ ตรงกันเกือบทุกข้อ ยิ้มอยู่คนเดียวทั้งเย็น }
              - { p: 0.4, fx: { happiness: -1 }, result: เปิดเฉลยที่ที่ติวโพสต์ ข้อที่มั่นใจที่สุด ดันตอบไม่ตรง }
          - label: นั่งเทียบคำตอบกับคนอื่น
            hint: อาจโล่งใจ หรืออาจเสียดาย
            showIf: { yearBefore: web_year }
            outcomes:
              - { p: 0.6, fx: { happiness: 1 }, result: ตรงกันเกือบทุกข้อ ยิ้มอยู่คนเดียวทั้งเย็น }
              - { p: 0.4, fx: { happiness: -1 }, result: ข้อที่มั่นใจที่สุด ดันตอบไม่เหมือนใคร }
      mid:
        id: X2w-W2
        title: ข้อที่ลังเล
        text: ข้อที่ลังเลระหว่างสองคำตอบยังวนอยู่ในหัวทั้งเช้า ตกบ่ายมีคนเล่าต่อกันมาว่าคะแนนตัดปีนี้สูงกว่าปีก่อน ไม่มีใครรู้ว่าใครเป็นคนพูดก่อน
        textWeb: " ข่าวลือมาไวกว่าผลจริงเสมอ"
        options:
          - { label: ไม่ฟังข่าวลือ ไปทำอย่างอื่น, fx: { happiness: 1 }, result: ซ่อมโซ่จักรยานที่หลุดมาเป็นเดือน มือดำไปถึงข้อศอก }
          - label: ถามคนที่รู้ว่าคะแนนตัดเท่าไร
            hint: รู้มากขึ้น แต่อาจยิ่งกังวล
            fx: { network: 1 }
            rnd:
              - { result: ได้ตัวเลขปีก่อนมา ดูแล้วก็ยังพอมีหวัง }
              - { result: ได้ตัวเลขมาสามแบบ ไม่ตรงกันสักแบบ, fx: { happiness: -1 } }
          - label: เปิดหนังสือดูข้อที่ลังเล
            hint: จะได้คำตอบ ที่อาจไม่อยากรู้
            fx: { knowledge: 1 }
            rnd:
              - { result: คำตอบที่เลือกไปถูก นั่งยิ้มกับหน้ากระดาษ, fx: { happiness: 1 } }
              - { result: ผิดข้อนั้นจริง ๆ ปิดหนังสือแรงกว่าที่ตั้งใจ, fx: { happiness: -1 } }
          - { label: ไปไหว้พระที่วัดใกล้บ้าน, fx: { happiness: 1 }, merit: { bhavana: 1 }, result: ใจนิ่งขึ้น แต่รู้ดีว่าผลออกไปตั้งแต่วันสอบแล้ว }
      bad:
        id: X2w-W3
        title: อยากขอแก้
        text: เมื่อคืนนอนไม่ค่อยหลับ ภาพช่องคำตอบที่ระบายไปแล้วลอยกลับมาซ้ำ ๆ วันนี้ทำอะไรก็ไม่เข้าหัว พรุ่งนี้จะรู้แล้วว่าที่กลัวอยู่นั้นจริงไหม
        options:
          - { label: นอนชดเชยทั้งบ่าย, fx: { health: 1 }, result: หลับไปตอนไหนไม่รู้ ตื่นมาอีกทีพัดลมยังหมุนอยู่ }
          - { label: ดูทางเรียนต่อทางอื่นไว้, showIf: { lastTry: true }, fx: { happiness: 1 }, result: จดชื่อสามที่ไว้หลังสมุด ไม่ได้ขีดฆ่าที่ไหนทิ้ง }
          - { label: เริ่มอ่านเผื่อปีหน้า, hideIf: { lastTry: true }, hint: เตรียมไว้ก่อน แต่ใจจะหนักขึ้น, fx: { knowledge: 1, happiness: -1 }, result: เปิดหน้าแรกของเล่มเดิม ลายมือตัวเองตอนต้นปียังอยู่ที่ขอบกระดาษ }
          - { label: เล่าให้คนที่บ้านฟังตรง ๆ, showIf: { noParents: true }, fx: { relations: 1, happiness: 1 }, result: ผู้ใหญ่ที่ดูแลฟังจนจบ แล้วบอกว่าพรุ่งนี้จะไปส่ง }
          - { label: เล่าให้คนที่บ้านฟังตรง ๆ, hideIf: { noParents: true }, fx: { relations: 1, happiness: 1 }, result: พูดได้ไม่กี่ประโยค อีกฝ่ายบอกว่า ผลยังไม่ออก อย่าเพิ่งตัดสินตัวเอง }
          - { label: ออกไปเตะบอลกับเพื่อนแถวบ้าน, fx: { happiness: 1, relations: 1 }, result: เตะจนมืด ไม่มีใครพูดเรื่องสอบสักคำ }
  # ---------- X3a · เช้าวันประกาศ · วิธีดู (§7.2) · ผลของตัวเลือก = บรรทัดเปิดของ X3 (ไม่มีการ์ดผลคั่น) ----------
  morning:
    title: เช้าวันประกาศผล
    text:
      ก: เช้าวันประกาศ หน้ากองสอบมีกระดานไม้ตั้งเรียงกัน แผ่นละเหล่า กระดาษพิมพ์เลขประจำตัวสอบติดหมุดไว้หลายแผ่น คนเบียดกันจนต้องเขย่ง ผู้ปกครองยืนรอใต้ต้นไม้ ยังไม่มีใครเดินออกมาจากหน้าป้าย
      ข: เช้าวันประกาศ มีคนบอกต่อกันว่ารายชื่อขึ้นเว็บแล้วตั้งแต่ตีห้า ร้านเน็ตหน้าปากซอยเปิดเช้ากว่าทุกวัน ทุกเครื่องมีคนนั่ง เด็กหัวเกรียนยืนต่อคิวถึงหน้าร้าน ส่วนป้ายจริงจะติดหน้ากองสอบตอนสาย
      ค: สิบโมงตรง ไฟล์รายชื่อขึ้นหน้าเพจ กลุ่มแชตเด้งไม่หยุด ทุกคนแคปหน้าจอส่งต่อกันจนไม่รู้ว่าแผ่นไหนของเหล่าไหน ที่หน้ากองสอบยังมีคนไปยืนดูป้ายจริงอยู่ดี
    retry: ปีก่อนหาเลขตัวเองไม่เจอ ปีนี้ใจไม่อยากเข้าไปดูเลย
    secretBond: มากับเพื่อนสนิทคนเดียวที่รู้ ที่บ้านคิดว่าออกไปหาเพื่อน
    secretAlone: มาคนเดียว ที่บ้านคิดว่าออกไปหาเพื่อน
    heirLines:
      - when: { heir: army }
        # lateMother (บท S1 · เจ้าของเคาะ 2026-11-10 · cadet-b5-late-mother.md d)
        line: "{ทายาท:พ่อที่เคยใส่เครื่องแบบ ขอมาด้วย ยืนห่างออกไปสองก้าว|แม่ขอมาด้วย ยืนห่างออกไปสองก้าว|{ผู้ใหญ่}ขอมาด้วย พกรูปพ่อในเครื่องแบบใส่กระเป๋าเสื้อมา ยืนห่างออกไปสองก้าว|{ผู้ใหญ่}ขอมาด้วย พกรูปแม่ในเครื่องแบบใส่กระเป๋าเสื้อมา ยืนห่างออกไปสองก้าว}"
        # lateMother (บท S1 · เจ้าของเคาะ 2026-11-10 · cadet-b5-late-mother.md d)
      - when: { heir: police }
        line: "{ทายาท:พ่อที่เคยใส่เครื่องแบบ ขอมาด้วย ยืนห่างออกไปสองก้าว|แม่ขอมาด้วย ยืนห่างออกไปสองก้าว|{ผู้ใหญ่}ขอมาด้วย พกรูปพ่อในเครื่องแบบใส่กระเป๋าเสื้อมา ยืนห่างออกไปสองก้าว|{ผู้ใหญ่}ขอมาด้วย พกรูปแม่ในเครื่องแบบใส่กระเป๋าเสื้อมา ยืนห่างออกไปสองก้าว}"
    examNo: เลขประจำตัวสอบ {เลขสอบ}
    options:
      self: { label: { ก: มุดเข้าไปหาเลขเอง, ข: นั่งหน้าจอ ไล่หาเอง, ค: เปิดไฟล์ ไล่หาเอง }, hint: { ก: เห็นเอง แต่ต้องเบียดกลางแดด, ข: เห็นเอง แต่เสียค่าเครื่อง, ค: เห็นเอง แต่ต้องตื่นมารอ } }
      elder: { label: "ให้{คน}ดูให้", lockReason: มาคนเดียว ไม่มีใครดูแทน }
      wait: { label: { ก: รอให้คนซาก่อนค่อยเข้าไป, ข: รอให้เว็บโหลดได้ก่อน, ค: รอให้คนในกลุ่มบอก }, hint: ไม่ต้องเบียด แต่ต้องรอนานขึ้น }
      pray: { label: { ก: แวะไหว้พระก่อนไปดูป้าย, ข: แวะไหว้พระก่อนไปร้านเน็ต, ค: ไหว้พระก่อน แล้วค่อยเปิดดู } }
  # ---------- X3 · ผลทุกสนาม ใบเดียว (§7.3) ----------
  results:
    title: ผลทุกสนาม
    open:
      self: { ก: มุดผ่านไหล่คนข้างหน้าเข้าไปจนจมูกเกือบชนกระดาษ, ข: หน้าจอค่อย ๆ โหลดทีละครึ่งบรรทัด, ค: นิ้วโป้งเลื่อนช้ากว่าที่ใจอยากให้เลื่อน }
      elder: { ก: "{คน}เดินหายเข้าไปในฝูงคน {ชื่อ} ยืนรอที่เดิม มือเย็นทั้งที่แดดร้อน", ข: "{คน}นั่งรถไปดูป้ายจริงหน้ากองสอบแทน {ชื่อ} นั่งรอข้างโทรศัพท์บ้าน", ค: "{คน}ยื่นมือมาขอโทรศัพท์ แล้วหันหลังให้" }
      wait: { ก: ยืนรอใต้ต้นไม้จนแดดเลยหัว คนรอบป้ายเหลือไม่กี่คน, ข: กดโหลดใหม่จนพนักงานร้านหันมามอง, ค: วางโทรศัพท์คว่ำไว้ รอเสียงเด้งจากกลุ่ม }
      pray: { ก: ยกมือไหว้ใต้คาง ใจนิ่งขึ้น ทั้งที่รู้ว่าผลออกไปตั้งแต่วันสอบ }
    # แอบสอบยุค ข ให้เพื่อนดู = ถือมือถือออกไปรอนอกบ้าน (ไม่ใช่โทรศัพท์บ้าน)
    openHomeSecret: "{คน}นั่งรถไปดูป้ายจริงหน้ากองสอบแทน {ชื่อ} ถือโทรศัพท์มือถือออกไปนั่งรอที่ศาลาท้ายซอย ไม่ให้คนในบ้านได้ยิน"
    paperTail: " ทีละเหล่า"
    passRow: "{เหล่า} · ลำดับ {ลำดับ} · ผ่าน"
    failRow: "{เหล่า} · ไม่มีเลขของเรา"
    lean: เหล่าที่อยากได้ที่สุดไม่มีชื่อ แต่อีกแผ่นมี
    summary:
      allMany: ผ่านครบทุกสนามที่สมัคร
      allOne: สนามเดียวที่สมัคร มีเลขของเรา
      none: ไม่มีเลขของเราสักสนาม
      some: ผ่าน {ผ่าน} จาก {ทั้งหมด} สนาม
    react:
      self: { all: อ่านซ้ำทุกแผ่นอีกรอบ ยังอยู่ครบ, some: ยืนนิ่งอยู่นาน ไม่รู้ว่าควรดีใจกับแผ่นไหนก่อน, none: ไล่ซ้ำอีกรอบ แล้วอีกรอบ ตัวเลขก็ยังเหมือนเดิม }
      elder: { all: "{คน}เดินกลับมา ยกนิ้วโป้งให้ก่อนจะพูดอะไร", some: "{คน}ชูนิ้วขึ้นมาไม่ครบมือ แล้วยิ้มให้", none: "{คน}เดินกลับมาช้า ๆ แล้วถามว่าหิวไหม" }
      wait: { all: ได้ยืนดูเลขตัวเองนานแค่ไหนก็ได้ ไม่มีใครเบียด, some: ความเงียบรอบป้ายทำให้ได้ยินเสียงหัวใจตัวเอง, none: "ป้ายเหลือแต่ {ชื่อ} คนเดียว ไม่ต้องเก็บหน้าให้ใครเห็น" }
      pray: { all: หายใจออกยาว มือที่พนมไว้เมื่อเช้ายังอุ่นอยู่, some: ใจที่นิ่งไว้ตั้งแต่เช้า ช่วยให้ยืนอ่านจนจบ, none: ใจนิ่งพอจะอ่านจนจบ แม้จะไม่อยากอ่านแล้ว }
      waitค: { pass: "ข้อความแรกในกลุ่มเด้งขึ้นมาว่า เจอชื่อ{มึง}แล้ว", none: "กลุ่มแชตเงียบผิดปกติ ไม่มีใครพิมพ์ชื่อ {ชื่อ}" }
      waitข: { all: โหลดครบทุกเหล่า เลขของเรายังอยู่ทุกแผ่น, some: เลขของเราอยู่บนจอ แต่ไม่ครบทุกแผ่น, none: หน้าจอโหลดครบแล้ว ไม่มีเลขของเราสักบรรทัด ลุกจากเก้าอี้ให้คนต่อคิว }
      elderค: { all: "{คน}หันกลับมา ยกนิ้วโป้งให้ก่อนจะพูดอะไร", some: "{คน}ชูนิ้วขึ้นมาไม่ครบมือ แล้วยิ้มให้", none: "{คน}วางโทรศัพท์ลงช้า ๆ แล้วถามว่าหิวไหม" }
      home: { all: "{เสียง} {คน}บอกในสายว่าเจอเลขของเราครบทุกแผ่น", some: "{เสียง} {คน}อ่านเลขให้ฟังทีละแผ่น บางแผ่นก็เงียบไป", none: "{เสียง} {คน}เงียบไปนานก่อนจะบอกว่าไม่เจอ" }
    ringSecret: โทรศัพท์ในมือสั่นขึ้น
    ringHome: โทรศัพท์บ้านดังขึ้น
    # Q3 (เจ้าของ 2026-11-10): บรรทัดลูกนายพล = นาน ๆ ขึ้น (numbers.rare_line_p) เมื่อไม่มีบรรทัดคู่แข่งเดิม (board.rivalLines) ในใบ · ไม่ซ้อนกัน
    rivalCamp: { ค: ที่ติวส่งรูปป้ายเข้ากลุ่ม ชื่อลูกนายพลคนนั้นอยู่แถวบน, else: ชื่อลูกนายพลคนนั้นอยู่แถวบน ครูพิเศษยืนถ่ายรูปป้ายให้ }
    rivalAll: { ค: ในกลุ่มแชตมีคนส่งต่อกันว่า ลูกนายพลคนหนึ่งติดแถวบนทุกสนาม, else: ได้ยินคนข้าง ๆ พูดถึงลูกนายพลที่ติดแถวบนทุกสนาม }
    rare: คนข้าง ๆ ร้องเสียงหลง เพราะเห็นนามสกุลตัวเอง แต่ชื่อต้นไม่ใช่
    homeCamp: "{คน}เล่าในสายด้วยว่าชื่อลูกนายพลคนนั้นอยู่แถวบน"
  # ---------- X3b · คนรอบตัวฉลอง (§7.4) · ตัวเลือก = 5 ทางเตรียมรอบสอง (board.options) ----------
  celebrate:
    title: เย็นวันประกาศผล
    secretMain: ที่บ้านยังไม่รู้ว่ามีอะไรให้ฉลอง {ชื่อ} ซื้อข้าวมันไก่ห่อหนึ่ง นั่งกินที่ศาลาริมทาง อิ่มกว่าทุกมื้อที่ผ่านมา
    someFail: มีคนถามถึงเหล่าที่ไม่ผ่าน {ชื่อ} ตอบว่ายังมีอีกแผ่น
    rehearsed: ประโยคที่ซ้อมกับกระจกไว้ ยังไม่ได้ใช้ แต่วันนี้ใกล้ขึ้นแล้ว
    secretBond: เพื่อนที่สอบมาด้วยกันมานั่งข้าง ๆ เป็นคนเดียวที่รู้
    heirLines:
      # lateMother (บท S1 · เจ้าของเคาะ 2026-11-10 · cadet-b5-late-mother.md e1)
      - when: { heir: army, heirCase: lateMother }
        line: เพื่อนที่เคยรับราชการกับแม่โทรมา เล่าเรื่องแม่สมัยใส่เครื่องแบบยาวจนแบตหมด
      # lateMother (บท S1 · เจ้าของเคาะ 2026-11-10 · cadet-b5-late-mother.md e2)
      - when: { heir: police, heirCase: lateMother }
        line: ตำรวจที่เคยทำงานกับแม่แวะมาถึงบ้าน ถอดหมวกวางบนโต๊ะ ไหว้รูปแม่ แล้วบอกว่ารอบสองหนักกว่านี้
      - when: { heir: army }
        line: ลุงที่เคยรับราชการทหารโทรมา เล่าเรื่องรุ่นตัวเองยาวจนแบตหมด
      - when: { heir: police }
        line: ญาติที่เป็นตำรวจแวะมาถึงบ้าน ถอดหมวกวางบนโต๊ะ แล้วบอกว่ารอบสองหนักกว่านี้
    campBoard: ที่ติวขึ้นป้ายรายชื่อเด็กของตัวเองหน้าตึก ชื่อ {ชื่อ} อยู่{ที่}
    campSpot: { top: แถวต้น ๆ, mid: กลาง ๆ แผ่น, low: ค่อนไปทางท้าย }
