# ---- สัมภาษณ์ (เจ้าของเคาะ 2026-11-05) · ใช้ 4 ข้อสุ่มจากคลัง + ข้อตลก 1 ข้อ (ได้เต็มเสมอ) · ผ่าน ≥ numbers.iv_min
# a = [ข้อความตัวเลือก, คะแนน] · {เหล่า} = เหล่าแรกที่ผ่านพลศึกษา · qSecret = ใช้แทนเมื่อยังปิดที่บ้าน
interviewQs:
  - q: "แนะนำตัวเองสั้น ๆ"
    a: [["บอกชื่อ โรงเรียน บ้าน และเหตุผลที่มา", 5], ["บอกชื่อกับโรงเรียน แล้วรอคำถามต่อ", 4], ["เล่ายาวตั้งแต่เด็กจนถูกขอให้สรุป", 3], ["พูดเร็วจนติด ต้องเริ่มใหม่", 2], ["ท่องประโยคที่จำมา ไม่ใช่เรื่องตัวเอง", 0]]
  - q: "ทำไมถึงอยากเข้า {เหล่า}"
    a: [["เล่าเรื่องจริงที่ทำให้สนใจ", 5], ["อยากมีอาชีพมั่นคง ดูแลที่บ้านได้", 4], ["มีคนแนะนำ แล้วก็เริ่มชอบเอง", 3], ["ยังไม่แน่ใจ แต่อยากลองดู", 2], ["ใส่เครื่องแบบแล้วคนเกรงใจ", 0]]
  - q: "เพื่อนร่วมรุ่นทำผิดระเบียบ แล้วขอให้ช่วยปิดไว้ จะทำยังไง"
    a: [["เตือนให้ไปรายงานเอง ไม่ไปจะบอกรุ่นพี่", 5], ["บอกตรง ๆ ว่าช่วยปิดไม่ได้", 4], ["ไม่ยุ่ง ให้เป็นเรื่องของเขา", 3], ["ช่วยครั้งเดียว ครั้งหน้าไม่ช่วย", 2], ["ช่วยปิด เพื่อนต้องมาก่อน", 0]]
  - q: "ที่นี่ฝึกหนักและอยู่ไกลบ้าน ถ้าคิดถึงบ้านมากจะทำยังไง"
    qSecret: "ที่บ้านรู้หรือยังว่ามาสอบ ถ้าคิดถึงบ้านตอนฝึกจะทำยังไง"
    a: [["ติดต่อบ้านตามเวลาที่ให้ แล้วฝึกต่อ", 5], ["คุยกับเพื่อนที่รู้สึกเหมือนกัน", 4], ["อดทนเงียบ ๆ ไม่บอกใคร", 3], ["ขอลากลับบ้านบ่อย ๆ", 2], ["ถ้าไม่ไหวจริงก็ลาออก", 0]]
  - q: "ถ้าปีนี้ไม่ติด จะทำอะไรต่อ"
    a: [["กลับไปแก้จุดที่พลาด แล้วสอบใหม่", 5], ["สอบใหม่ปีหน้า", 4], ["เรียนต่อมหาวิทยาลัยตามแผนสำรอง", 3], ["ยังไม่ได้คิด", 2], ["รู้จักผู้ใหญ่ ฝากเข้าได้", 0]]
# ข้อตลกของจ่าขมลมโชย — คารวะ 7 ประจัญบาน (2545): เสียงแกร๊ก + "ช่วยกูด้วย… ช่วยหน่อยเถอะครับ" · ชื่อผู้กององอาจคงไว้ (เจ้าของเคาะ)
# a = [ข้อความตัวเลือก, ปฏิกิริยากรรมการ]
interviewFunny:
  - text: "จ่าขมลมโชยวางแก้วกาแฟลงช้า ๆ \"สมมุติ… เธอเป็นลูกหมู่ของผู้กองท่านหนึ่ง\" แล้วเหลือบไปทางผู้กององอาจ\n\"ผู้กองบอกว่าทางนี้รู้ดี แล้วก็เหยียบดัง แกร๊ก ทั้งหมู่วิ่งหายเข้าป่าหมด ผู้กองตะโกน ช่วยกูด้วย! …เงียบ… ช่วยหน่อยเถอะครับ… เธอจะทำยังไง\"\nผู้กององอาจกระแอมยาว"
    a:
      - ["ยืนเป็นเพื่อนผู้กองครับ ไม่เหงา", "ผู้กองบูรพาสำลักน้ำ ผู้กององอาจพยักหน้าช้า ๆ \"…ใช้ได้\""]
      - ["หาหินหนักเท่าผู้กองมาวางแทนครับ", "จ่า: \"ก้อนต้องใหญ่มากนะ\" ผู้กององอาจหันขวับไปมองจ่า"]
      - ["รอจนผู้กองพูดคำว่า \"ครับ\"", "จ่า: \"ทำไม\" ตอบว่า \"รอให้ผู้กองพูดสุภาพก่อนครับ พูดกูแล้วไม่ลื่นหู\" ผู้กองบูรพาหัวเราะออกเสียง"]
      - ["วิ่งไปตามหมู่กลับมาครับ ถ้าเขาจำทางได้", "จ่า: \"หมู่นี้ไม่มีใครจำทางได้\" แล้วมองผู้กององอาจอีกรอบ"]
