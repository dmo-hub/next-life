      title: "ใครตด"
      text: "'…หนึ่ง' ยังเงียบ ทันใดนั้นมีเสียงปรบมือช้า ๆ จ่าขมลมโชยเดินออกมาจากใต้ต้นไม้ 'สวัสดีน้องใหม่ เสียงดีกันเชียว ใครเป็นเจ้าของ รับมาดี ๆ' ทั้งแถวเงียบ 'ไม่มีใครรับ งั้นยึดพื้นทั้งกอง'"
