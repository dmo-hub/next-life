dayIntro:
  first: สองชั่วโมงแรกเป็นเลข วิทย์ อังกฤษ {ชื่อ} ทำไปเท่าที่อ่านมา ชุดสุดท้ายในซองเป็นแบบวัดความพร้อมห้าข้อ ทุกข้อเป็นเหตุการณ์ที่ต้องเลือกทันที
  later: วิชาการผ่านไปอีกชุด เหลือแบบวัดความพร้อมของสนามนี้
  dayLabel: "วันที่{n} · "
  contextLines:
    - when:
        flagsHas:
          - cadet_retry
      line: ห้องเดิม กลิ่นเดิม แต่มือไม่สั่นเท่าปีก่อน
    - when:
        flagsHas:
          - cadet_prep_group
        rival: A
      line: เพื่อนห้องสามนั่งห่างไปสามแถว ไม่หันมาเลยสักครั้ง
  screenTitle: สนามสอบเตรียมทหาร · ชุด {เหล่า} · ข้อ {i} / 5
  passRule:
    quizMin: 13
    knowledgeMin: 50
dayHeader:
  army: สนาม ทบ. · หอประชุมใหญ่ โต๊ะเรียงเป็นร้อยแถว
  navy: สนาม ทร. · ตึกเรียนวันอาทิตย์ แอร์เย็นจนมือชา
  airforce: สนาม ทอ. · หน้าต่างห้องสอบมองเห็นรันเวย์
  police: สนาม ตร. · โรงยิมใหญ่ คนคุมสอบใส่ชุดสีกากี
quiz:
  army:
    - q: เดินทางไกล 20 กม. เพื่อนในหมู่แบกเป้ไม่ไหว
      options:
        - label: แบ่งของเพื่อนมาแบกบางส่วน
          score: 5
        - label: ให้กำลังใจ เดินประกบเพื่อนไป
          score: 4
        - label: เดินช้าลงเป็นเพื่อน
          score: 3
        - label: บอกให้เพื่อนไปขอพักกับครูเอง
          score: 2
        - label: เดินนำไปก่อน เดี๋ยวเพื่อนตามมา
          score: 0
    - q: ฝึกในป่า แผนที่กับเข็มทิศชี้คนละทาง และใกล้มืดแล้ว
      options:
        - label: หยุด ดูจุดสังเกต ตกลงทางกับหมู่
          score: 5
        - label: หยุดรอ ให้หัวหน้าหมู่เลือกทางเอง
          score: 4
        - label: ตามเข็มทิศไปเลย
          score: 3
        - label: นั่งรอให้ครูฝึกมาตามหา
          score: 2
        - label: แยกกันไปหาทาง
          score: 0
    - q: น้ำท่วมหมู่บ้าน ได้คำสั่งให้ขนกระสอบทราย แต่ยายคนหนึ่งขอให้ช่วยขนของในบ้าน
      options:
        - label: แจ้งหัวหน้าหมู่ ขอคนไปช่วยยาย
          score: 5
        - label: ขนกระสอบต่อ แจ้งเรื่องยายตอนพัก
          score: 4
        - label: ไปช่วยยายก่อนเลย
          score: 3
        - label: ให้ยายไปรอที่ศูนย์อพยพก่อน
          score: 2
        - label: บอกยายว่าไม่ใช่หน้าที่
          score: 0
    - q: ขุดหลุมบุคคลกลางแดด มือเริ่มพอง
      options:
        - label: พันผ้าแล้วขุดต่อจนเสร็จ
          score: 5
        - label: ขอพักดื่มน้ำ แล้วกลับมาขุดต่อ
          score: 4
        - label: ฝืนขุดต่อ ไม่บอกใครว่ามือพอง
          score: 3
