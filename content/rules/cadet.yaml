    poorFar: ผู้ใหญ่บ้านประกาศชื่อ {ชื่อเต็ม} ทางเสียงตามสาย เพื่อนบ้านแวะมาจับมือทีละคน
    poor: มื้อเย็นมีหมูทอด ของที่ไม่ค่อยได้กิน
    richLine: กลุ่มไลน์ญาติเด้งไม่หยุด
    richPhone: ญาติโทรมาแสดงความยินดีไม่ขาดสาย
    mid: ที่บ้านสั่งส้มตำกับไก่ย่างมากินกันหน้าบ้าน
    eraค: รูปที่{โพสต์}โพสต์มีคนกดถูกใจหลายร้อย ส่วนใหญ่ไม่เคยเจอหน้ากัน
    eraคWho: { fatherOnly: พ่อ, none: ญาติ, else: แม่ }
