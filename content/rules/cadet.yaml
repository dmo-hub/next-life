# เส้นเตรียมทหาร · สนามสอบ (เฟส 2) และฉากปีสอบซ้ำ — engine: src/engine/cadet.mjs
# ที่มา: demo ที่เจ้าของเล่นและเคาะแล้ว (.claude/research/demo/data-04.js · cadet-phase1-demo.html) 2026-11-05
# ธงที่ engine ตั้งเอง (ไม่อยู่ในทะเบียนธงเพราะยังไม่มีการ์ดเนื้อหาอ่าน): cadet_body_seen · cadet_passed · cadet_retry · cadet_branch:<เหล่า> (ลงทะเบียนเป็น prefix)
# numbers = ค่าที่เจ้าของเคาะ · fx ในไฟล์นี้เป็นหน่วย demo (1 = fx_unit แต้ม)
numbers:
  written_min: 13
  know_min: 65
  iv_min: 13
  body_min:
    army: 80
    navy: 65
    airforce: 70
    police: 55
  ask_max: 5
  report_days: 2
  exam_injury: 0.15
  letdown: -20
  web_year: 2550
  photo_year: 2550
  phone_board_year: 2558
  fx_unit: 5
  # ปีเริ่มยุค (เจ้าของเคาะ 2026-11-06) · เงื่อนไขในไฟล์นี้อ้างชื่อค่าได้ด้วย yearFrom / yearBefore
  mobile_year: 2542          # มือถือโทรคุยได้ (หลักฐาน 2542) · การ์ดโทรหาบ้าน I4
  phone_result_year: 2567    # ดูไฟล์ผลสอบในจอ/เพจ · ฉากเช้าวันประกาศ X3a
  era_cards:                 # การ์ดเนื้อหาที่ years ผูกกับปีเริ่มยุค · build ตรวจให้ตรงค่าเสมอ (src/node/load.mjs checkCadetEraCards)
    mobile_year:
      before: [cadet_life_branch_map]
      from: [cadet_life_branch_map_phone]
  # ปีเรียนหลังสอบติด: เตรียมทหาร prep_years + โรงเรียนเหล่า academy_years = ติดยศ (เจ้าของเคาะ 2026-11-06 · ทอ. อนุมาน)
  prep_years: 2
  # ที่ตั้งโรงเรียนเตรียมทหารตามยุค (บท S1 · เจ้าของรับ 2026-11-06): ก่อน campus_nayok_year อยู่กรุงเทพฯ
  # (ก่อน campus_rama4_year ถนนราชดำเนิน · จากนั้นถนนพระรามที่ 4) · ตั้งแต่ 4 พ.ค. 2543 อยู่นครนายก
  campus_rama4_year: 2504
  campus_nayok_year: 2543
  # B1 (เจ้าของเคาะ 2026-11-09): ปีแรกที่รับผู้หญิงเป็นพนักงานสอบสวน — ทายาทตำรวจที่เกิดก่อนปีนี้และมีแต่แม่ = แบบพ่อที่เสียแล้ว (life.mjs heirCase)
  police_woman_year: 2538
  line_year: 2555           # ปีเริ่มกลุ่มไลน์ญาติ (บทฉากดีใจ · {มือถือ} ใช้ mobile_year)
  # คะแนนรวม · ลำดับที่ ตอนประกาศผลรอบสุดท้าย (เจ้าของเคาะ C1–C4 2026-11-06) · ลำดับเป็นตัวเลขเล่าเรื่อง ไม่ตัดสินผ่าน/ตก (เส้นแต่ละรอบยังตัดสินเหมือนเดิม)
  seats:                     # ที่นั่งรายเหล่า ปี 2568 ใช้ทุกยุค
    army: 270
    navy: 90
    airforce: 137
    police: 315
  reserve_share: 0.4         # ตัวสำรองนับถึงสัดส่วนนี้ของที่นั่ง · ตัวสำรอง = ไม่ติด (ไม่มีกลไกเลื่อนขึ้น)
  reserve_gap: 2             # สัมภาษณ์ขาดเส้นไม่เกินเท่านี้ = ตัวสำรอง · ขาดมากกว่านี้ = ลำดับเกินสำรองไปไกล
  total_div:                 # รวม 100 = ข้อเขียนเหล่านั้น 25 + ความรู้/know + ชีวิตวันสอบพละ/body + สัมภาษณ์ 25
    know: 4
    body: 4
  academy_years:
    police: 4
    army: 5
    navy: 5
    airforce: 5
  last_age: 18
  # ถือธงนี้ = กองสุ่มจั่วเฉพาะใบที่ when.flags.has มีธงนี้ (ชีวิตเด็กเตรียมทหาร · cadet_life.yaml)
  pool_focus_flag: cadet_dream
  dream_pool_rounds: 4      # จั่วกี่รอบต่อปีตอนถือธง (เจ้าของเคาะ 2026-11-06)
  dream_pool_chance: 0.8    # โอกาสต่อรอบตอนถือธง · ผลการ์ดยังหรี่ด้วยรอบปกติของวัย
  # B4 ฉากประกาศผล (เจ้าของเคาะค่า demo 2026-11-10 ผ่านผู้รวมงาน): V6 ผลสุ่มสองทางของตัวเลือกวันรอ · V7 บรรทัดหายาก 1 ใน 4
  outcome_split_p: 0.5
  rare_line_p: 0.25
  wait_mood_good: 20        # คะแนนแบบวัดดีสุด ≥ ค่านี้ = ใจเบา (W1) · ≥ written_min = ลังเล (W2) · ต่ำกว่า = อยากขอแก้ (W3) (Q2)
  camp_board_top: 21        # ป้ายที่ติว: คะแนน ≥ ค่านี้ = แถวต้น ๆ · ≥ camp_board_mid = กลาง ๆ แผ่น · ต่ำกว่า = ค่อนไปทางท้าย
  camp_board_mid: 17
  # B5 ทายาทจากการเกิด (เจ้าของเคาะ 2026-11-10): ครอบครัวใหม่มีโอกาสเกิดมามีพ่อหรือแม่รับราชการทหาร/ตำรวจ 5.00% (ธง army_family / police_family · from_age 0)
  heir_birth_p: 0.05
  heir_police_share: 0.5    # สัดส่วนตำรวจในโอกาสนั้น (ที่เหลือ = ทหาร) · เจ้าของเคาะ 2026-11-10 ครึ่งต่อครึ่ง 2.50% / 2.50%
  rank_rough_from: 10       # ลำดับตั้งแต่ค่านี้ พ่อพูดแบบปัด ("ลำดับหกสิบกว่า") · น้อยกว่า = ไม่พูด (ข้อ 4)
