# engine: cadet.mjs S.x2w → S.x3a → S.x3 → S.x3b (แทน waitDay → announce written → board → cheer phys เดิม) · S.cheer iv/final · S.failed · S.arrive
# ยุค ก = ก่อน numbers.web_year (ป้าย + หนังสือพิมพ์) · ข = ก่อน numbers.phone_result_year (ร้านเน็ต + โทรศัพท์บ้าน) · ค = จากนั้น (ไฟล์ในเพจ/กลุ่มแชต)
# ตัวแทนเฉพาะเส้นนี้ (cadet.mjs แทนค่าก่อน fill): {คน} = คนที่ดูผลให้ (แอบสอบ = เพื่อน · ไม่งั้นคนในบ้าน · ไม่มีพ่อแม่ = ผู้ใหญ่ที่มาด้วย)
#   {เลข} {เลขเพื่อน} = ตัวเลขเป็นคำอ่าน (numTh) · {มึง} {กู} = เพื่อนสนิทใช้มึง/กู เพื่อนทั่วไปใช้ นาย/เรา (Q-V3) · ตัวแทนอื่นในวงเล็บปีกกาที่ไม่ใช่ของ fill แทนใน cadet.mjs ทั้งหมด
