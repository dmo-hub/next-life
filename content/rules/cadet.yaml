    SB-04:
      title: "ก้นแตะหนึ่งในสาม"
      text: "มื้อเช้าแรกในโรงอาหาร กฎคือห้ามพูด นั่งหลังตรง ก้นแตะเก้าอี้แค่หนึ่งในสาม ตักข้าวเป็นมุมฉาก ทั้งโรงเงียบจนได้ยินเสียงช้อนกระทบจาน มีแต่ท้องของต้อมที่ร้องดังกว่าเสียงช้อน รุ่นพี่เดินผ่านบอกว่าเหลือห้านาที ข้าวในจานของ {ชื่อ}ยังเหลือเกินครึ่ง"
      options:
      - label: "ตักให้ไวที่สุดเท่าที่ทำได้"
        result: "ตักเป็นมุมฉากเร็วจนมือแทบมองไม่ทัน จานเกลี้ยงทันเวลา เด็กเหล่าทหารเรือฝั่งตรงข้ามเหลือบมองแล้วพยักหน้าให้หนึ่งที ตั้งแต่มื้อนั้นสองคนนั่งตรงข้ามกันทุกมื้อ"
        fx: { health: 1 }
        setFlags: [cadet_branch_friends]
      - label: "แบ่งไข่ดาวให้เพื่อนที่กินไม่ทัน"
        result: "เด็กที่ป้ายชื่อเขียนว่านายพลตักได้สามคำก็หมดเวลา {ชื่อ}เลื่อนไข่ดาวไปให้ใต้โต๊ะ นายพลกินทั้งที่ยังนั่งหนึ่งในสาม พยักหน้าขอบใจทีเดียว"
        fx: { relations: 1 }
        setFlags: [cadet_branch_friends]
      - label: "กลั้นหัวเราะตอนท้องต้อมร้อง"
        outcomes:
          - weight: a
            result: "ทั้งโต๊ะกลั้นจนไหล่สั่น รุ่นพี่หยุดมองอยู่นาน ไม่มีใครหลุด"
            fx: { happiness: 1 }
          - weight: b
            result: "{ชื่อ}หลุดเสียงพรืดออกมา ทั้งโต๊ะต้องลุกขึ้นยืนกินส่วนที่เหลือ ท้องต้อมร้องต่ออีกรอบ"
            fx: { happiness: 1, relations: -1 }
      - label: "วางช้อนตามระเบียบ ยอมหิวไว้ก่อน"
        result: "วางช้อนตรงมุมจานตามที่รุ่นพี่สอน ท้องร้องไปจนถึงคาบบ่าย มื้อเย็นกินหมดก่อนเวลาสองนาที"
        fx: { knowledge: 1 }
    SB-N3:
      title: "นรม.นายพล"
      text: "ลานรวมแถวตอนเย็น รุ่นพี่ไล่ขานชื่อนักเรียนใหม่ทีละคน 'นรม.นายพล!' เสียงดังก้องทั้งลาน นายทหารที่เดินผ่านพอดีชะงัก จัดหมวกให้ตรง หันมองหาว่านายพลท่านไหนมา ทั้งลานยืนตรงเองโดยไม่มีใครสั่ง ส่วนนายพลตัวจริงยืนตัวแข็ง พูดไม่ออก"
      options:
      - label: "เงยหน้ามองฟ้า กลั้นหัวเราะ"
        outcomes:
          - weight: a
            result: "{ชื่อ}เงยหน้ามองฟ้าจนเห็นนกบินผ่านสามตัว กลั้นไว้ได้ทันก่อนรุ่นพี่หันมา"
            fx: { happiness: 1 }
          - weight: b
            result: "หลุดเสียงพรืดออกมาคนเดียว ทั้งแถวโดนยึดพื้น นายทหารคนนั้นเดินจากไปโดยไม่หันกลับมาอีก"
            fx: { happiness: 1, relations: -1 }
      - label: "ขานรับแทนนายพล"
        result: "'มาครับ!' {ชื่อ}ขานแทน นายทหารหันมามอง 'เอ็งเหรอนายพล' 'ไม่ใช่ครับ ผมขานแทนครับ' นายทหารส่ายหน้าเดินไป นายพลกระซิบขอบใจทั้งที่ยังตัวแข็ง"
        fx: { relations: 1 }
      - label: "บอกให้นายพลใช้ชื่อเล่นแทน"
        outcomes:
          - weight: a
            result: "นายพลขอรุ่นพี่ใช้ชื่อเล่น รุ่นพี่ถามว่าชื่อเล่นอะไร 'ผู้การครับ' รุ่นพี่ยืนนิ่งไปนาน 'ใช้ชื่อจริงไปเหมือนเดิม'"
            fx: { happiness: 1, relations: 1 }
          - weight: b
            result: "นายพลไม่กล้าขอ ตั้งแต่วันนั้นทั้งรุ่นเรียกเขาว่า 'ท่าน' นายพลขานรับทุกครั้ง ไม่เคยเถียง"
            fx: { relations: 1 }
      - label: "ยืนตรงนิ่งตามทุกคน"
        result: "{ชื่อ}ยืนตรงกว่าเดิมทั้งที่ไม่รู้ว่าทำไม คนทั้งลานก็เหมือนกัน ระเบียบที่จำแม่นที่สุดของสัปดาห์แรก ได้ยินคำว่านายพล ให้ยืนตรงไว้ก่อน"
        fx: { network: 1 }
    # ช่องสุ่ม w1 (สัปดาห์แรก)
    SB-02:
      title: "ห้ามเดิน"
      text: "กฎข้อแรกของนักเรียนใหม่ ห้ามเดิน ต้องวิ่งทุกที่ ไปโรงอาหารก็วิ่ง ไปห้องเรียนก็วิ่ง ไปห้องน้ำก็ต้องวิ่ง เย็นนี้ทั้งกองวิ่งไปถึงห้องน้ำพร้อมกัน แล้วเพิ่งรู้ว่ามีอยู่สี่ห้อง รุ่นพี่ยืนดูอยู่ 'ใครเดิน ใครหยุด ยึดพื้น'"
      options:
      - label: "วิ่งอยู่กับที่ต่อคิวไป"
        result: "ทั้งแถววิ่งอยู่กับที่หน้าห้องน้ำ ดุ่ยถามรุ่นพี่ 'พี่ครับ ปวดแล้วต้องวิ่งด้วยไหมครับ' รุ่นพี่ตอบ 'ยิ่งปวดยิ่งต้องวิ่ง' ไม่มีใครเข้าใจ แต่ทุกคนวิ่ง"
        fx: { health: 1 }
      - label: "ลากเพื่อนที่เผลอเดินให้วิ่ง"
        result: "แบงก์เดินตามทางแบบคนเพิ่งมาถึง {ชื่อ}คว้าแขนลากให้วิ่งทันก่อนรุ่นพี่หันมา แบงก์วิ่งไปทั้งที่ตายังปิดอยู่ครึ่งหนึ่ง"
        fx: { relations: 1 }
      - label: "แกล้งวิ่งช้า ๆ ให้ดูเหมือนวิ่ง"
        outcomes:
          - weight: a
            result: "ยกเข่าสูงแต่ก้าวสั้น ดูไกล ๆ เหมือนวิ่ง ดูใกล้ ๆ เหมือนเดินเร็ว รุ่นพี่มองผ่านไปไม่ว่าอะไร"
            fx: { happiness: 1 }
          - weight: b
            result: "รุ่นพี่มองอยู่ครู่หนึ่ง 'นั่นวิ่งหรือเต้น' ทั้งแถวยึดพื้นหน้าห้องน้ำ ไม่มีใครขอบใจ {ชื่อ}"
            fx: { relations: -1, health: 1 }
      - label: "กลั้นไว้ ไปก่อนไฟดับ"
        result: "กลั้นไว้จนก่อนไฟดับ ห้องน้ำว่างจริง แต่จากโรงนอนไปห้องน้ำก็ยังต้องวิ่งอยู่ดี"
        fx: { happiness: -1, knowledge: 1 }
    # ช่องสุ่ม w2 · ทางตื่นก่อนแตร เจ้าของเคาะ 2026-11-11 ลดสุขภาพ −1 เหลือ 0
    SB-N1:
      title: "ผ้าห่มเต้าหู้"
      text: "ตรวจเตียงตอนเช้า ผ้าห่มต้องพับเหลี่ยมคมเหมือนก้อนเต้าหู้ รุ่นพี่ไล่ดูทีละเตียง หยุดที่เตียงแบงก์ ยกผ้าห่มขึ้นมาดู 'นี่ผ้าห่มหรือก้อนอิฐ' แบงก์ตาปรือ 'ไม่รู้ครับ ตื่นมามันเป็นแบบนี้แล้ว' อีกสามเตียงจะถึงเตียงของ {ชื่อ}"
      options:
      - label: "รีบขอให้แบงก์ช่วยพับ"
        result: "แบงก์พับให้ทั้งที่ตายังหลับ มือไม่หยุดเลย สี่มุมคมเท่ากันหมด รุ่นพี่ผ่านเตียง {ชื่อ} ไปโดยไม่พูดอะไร ส่วนแบงก์จำไม่ได้ว่าช่วยใคร"
        fx: { knowledge: 1 }
      - label: "เอาไม้บรรทัดรีดขอบ"
        outcomes:
          - weight: a
            result: "ขอบผ้าห่มคมเหมือนตัดด้วยมีด รุ่นพี่เอานิ้วลูบขอบแล้วพยักหน้า เดินผ่านไป"
            fx: { knowledge: 1 }
          - weight: b
            result: "ไม้บรรทัดหักคามือตอนรุ่นพี่มาถึงพอดี ครึ่งหนึ่งยังเสียบอยู่ในผ้าห่ม รุ่นพี่ดึงออกมาดูนาน 'อันนี้ระเบียบข้อไหน'"
            fx: { happiness: 1, network: -1 }
      - label: "พับลวก ๆ แล้วเอาตัวบัง"
        outcomes:
          - weight: a
            result: "{ชื่อ}ยืนตรงหน้าเตียง ยืดตัวให้ใหญ่กว่าปกติ รุ่นพี่มองข้ามไหล่ไปไม่เห็นอะไร แล้วเดินไปเตียงถัดไป"
            fx: { happiness: 1 }
          - weight: b
            result: "รุ่นพี่สั่ง 'ขยับ' ผ้าห่มข้างหลังเหมือนก้อนเมฆ เตียงซ้ายขวาโดนยึดพื้นไปด้วยข้อหาอยู่ใกล้"
            fx: { relations: -1, health: 1 }
      - label: "ตื่นก่อนแตรมาพับใหม่ทุกวัน"
        result: "ตื่นก่อนแตรสิบนาที พับใหม่สามรอบจนคม รุ่นพี่เริ่มจำได้ว่าเตียงนี้เรียบ พรุ่งนี้ก็ต้องตื่นก่อนแตรอีก"
        fx: { network: 1 }
    # บรรทัดเสริมขึ้นเมื่อเคยรายงานว่าเสียงมาจากข้างหลังแถวในฉากใครตด · ทางยืนจุดเอียง เจ้าของเคาะ 2026-11-11 ลดสุขภาพ −1 เหลือ 0
    SB-05:
      title: "พื้นเอียง"
      text: "จ่าขมลมโชยสั่งกองจัดแถวใหม่เป็นรอบที่สิบ เพราะแถวหน้ามีคนยืนเอียง สลับคนไปยืนตรงนั้นกี่คนก็เอียงทุกคน ทั้งกองเริ่มรู้ว่าพื้นตรงนั้นเอียงเอง จ่าขมเดินมาหยุดตรงจุดนั้น 'พื้นเอียงเป็นเรื่องของพื้น ตัวตรงเป็นเรื่องของนักเรียน ระเบียบ!'"
      contextLines:
        - when: { flagsHas: [cadet_called_it] }
          line: "จ่าขมพึมพำต่อ 'สัปดาห์ก่อนมีลม สัปดาห์นี้พื้นเอียง กองนี้มีปัญหาเรื่องธรรมชาติ'"
      options:
      - label: "ชี้ให้จ่าดูว่าพื้นเอียง"
        outcomes:
          - weight: a
            result: "จ่าขมก้มมองพื้นนานจนทั้งกองลุ้น 'ข้ารู้ตั้งแต่รอบแรก' แล้วสั่งพัก มุมปากกระตุกเหมือนจะยิ้ม แต่ไม่ยิ้ม"
            fx: { network: 1 }
          - weight: b
            result: "'นักเรียนรู้เรื่องพื้นดีกว่าครูฝึกหรือ' {ชื่อ}ได้วิ่งรอบสนามคนเดียวสามรอบ ระหว่างวิ่งเห็นจ่าขมเอาเท้าเขี่ยพื้นตรงนั้นเงียบ ๆ"
            fx: { health: 1, happiness: -1 }
      - label: "ยืนเอียงตามพื้นทั้งกอง"
        result: "ทั้งกองเอียงไปทางเดียวกันพร้อมกันเหมือนนัดไว้ แบงก์รายงาน 'ตรงแล้วครับจ่า ตรงกับพื้นครับ' จ่าขมหันหลังเดินไปไกลสักพัก ก่อนสั่งพัก"
        fx: { relations: 1 }
      - label: "เงียบ จัดแถวรอบที่สิบเอ็ด"
        result: "รอบที่สิบเอ็ด สิบสอง สิบสาม แดดเริ่มแรง ทั้งกองจัดแถวได้เร็วขึ้นทุกรอบ ส่วนคนที่ยืนตรงจุดนั้นก็ยังเอียงเหมือนเดิม"
        fx: { health: 1 }
      - label: "ขอไปยืนตรงจุดเอียงเอง"
        result: "{ชื่อ}ไปยืนตรงจุดนั้น เกร็งตัวให้ตรงกว่าพื้น จ่าขมเดินวนรอบสองรอบ 'ตรง… แต่ไม่สวย' แล้วสั่งพัก ขาสั่นไปจนถึงมื้อเที่ยง"
        fx: { network: 1 }
    # ลาออก: บ้านมีเงินเก็บพอจ่ายค่าคืนตามสัญญาใช้ผลแรก ไม่พอใช้ผลบ้านจน (ไปกู้มา) และติดธงหนี้ค่าลาออก
    SB-06:
      title: "จดหมายใต้ที่นอน"
      text: "จดหมายขอลาออกพับซ่อนอยู่ใต้ที่นอนมาสองสัปดาห์แล้ว เพื่อนในห้องออกไปสองคน คนหนึ่งเล่าก่อนไปว่าที่บ้านต้องหาเงินก้อนมาใช้คืนตามสัญญา ยิ่งอยู่นาน ยอดที่ต้องคืนก็ยิ่งมาก"
      options:
      - label: "ฉีกจดหมาย กัดฟันต่อ"
        result: "ฉีกเป็นชิ้นเล็กจนอ่านไม่ออก ทิ้งลงถังขยะห้องน้ำ เช้าวันรุ่งขึ้นวิ่งไปเข้าแถวเร็วกว่าทุกวัน"
        fx: { happiness: -1, health: 1 }
      - label: "คุยกับรุ่นพี่ที่เคยคิดแบบนี้"
        result: "รุ่นพี่ปีสองคนหนึ่งฟังจนจบ แล้วเปิดกระเป๋าเงินให้ดูจดหมายลาออกของตัวเองที่ยังพับเก็บไว้ 'ปีก่อนพี่ก็เขียน ยังไม่ได้ยื่นจนวันนี้'"
        fx: { relations: 1, happiness: 1 }
      - label: "ขอคุยกับนายทหารปกครอง"
        result: "นายทหารปกครองไม่ห้าม ไม่เกลี้ยกล่อม บอกแค่ว่าจะยื่นเมื่อไรก็ได้ แต่ให้รอจนได้จักรดาวก่อน แล้วค่อยตัดสินใจ"
        fx: { happiness: 1, network: -1 }
      - label: "ยื่นลาออก กลับไปเรียนข้างนอก"
        hint: "ต้องใช้เงินคืนตามสัญญา"
        result: "ที่บ้านถอนเงินเก็บทั้งก้อนมาจ่าย ไม่มีใครพูดถึงมันอีก แต่ทุกคนรู้ว่ามันหายไป"
        resign: true
        resultPoor: "เงินเก็บไม่พอ ผู้ใหญ่ในบ้านไปกู้ส่วนที่เหลือมา เย็นวันกลับถึงบ้าน ไม่มีใครถามว่าเป็นยังไงบ้าง"
        fx: { happiness: 1 }
        fxPoor: { relations: -1 }
        setFlagsPoor: [cadet_resign_debt]
    # เจ้าของย้ายมาไว้ระหว่างจดหมายใต้ที่นอนกับหลังไฟดับ · มาคนเดียวใช้ข้อความกับตัวเลือกฉบับไม่มีใครมา
    SB-11:
      title: "วันพบญาติ"
      text: "วันพบญาติ นักเรียนใหม่ยืนเรียงแถวกลางลาน ในมือคนละพวงมาลัยพวงเล็ก พอได้ยินคำสั่ง ทุกคนเดินไปหาครอบครัวตัวเอง ก้มลงกราบแล้วยื่นพวงมาลัยให้ {ผู้ใหญ่}รับไว้ทั้งที่ตาแดง หลังพิธี ลานทั้งลานเต็มไปด้วยเสื่อกับปิ่นโต"
      textBy:
        - when: { alone: true }
          text: "วันพบญาติ นักเรียนใหม่ยืนเรียงแถวกลางลาน ในมือคนละพวงมาลัยพวงเล็ก พอได้ยินคำสั่ง ทุกคนเดินไปหาครอบครัวตัวเอง {ชื่อ}ยืนถือพวงมาลัยอยู่กลางลาน บ้านอยู่ไกลเกินค่ารถ ไม่มีใครมา"
      options:
      - label: "เล่าเรื่องในโรงเรียนให้ฟังหมด"
        hide_if: { alone: true }
        result: "เล่าตั้งแต่วิ่งไปห้องน้ำจนถึงพับผ้าห่ม {ผู้ใหญ่}หัวเราะจนน้ำตาไหล พอเล่าว่ายังไม่เคยได้นอนเกินหกชั่วโมง {ผู้ใหญ่}เงียบไป"
        fx: { relations: 1 }
      - label: "เอาพวงมาลัยไปกราบครูฝึกแทน"
        show_if: { alone: true }
        result: "จ่าขมรับพวงมาลัยไว้ หน้านิ่ง ไม่พูดอะไรสักคำ แต่วางมันไว้บนโต๊ะทำงานจนเหี่ยว"
        fx: { relations: 1 }
      - label: "เล่าแต่เรื่องดี ๆ ให้ฟัง"
        hide_if: { alone: true }
        result: "เล่าแต่เรื่องเพื่อน เรื่องข้าว เรื่องจ่าขม ไม่เล่าเรื่องจดหมายใต้ที่นอน {ผู้ใหญ่}กลับบ้านไปพร้อมรอยยิ้ม"
        fx: { happiness: 1 }
      - label: "ไปนั่งกินกับครอบครัวเพื่อน"
        show_if: { alone: true }
        result: "แม่ของต้อมตักข้าวให้ {ชื่อ} ก่อนลูกตัวเอง ต้อมบ่นว่าแม่ลำเอียง แล้วตักไข่ให้อีกฟอง"
        fx: { happiness: 1 }
      - label: "ชวนเพื่อนที่ไม่มีใครมากินด้วย"
        hide_if: { alone: true }
        result: "นายพลนั่งกินอยู่คนเดียวที่ขอบลาน {ชื่อ}ไปลากมานั่งเสื่อเดียวกัน {ผู้ใหญ่}ตักกับข้าวให้นายพลก่อน นายพลกินจนหมดปิ่นโตชั้นหนึ่ง"
        fx: { relations: 1 }
        merit: { help_others: 1 }
      - label: "เก็บพวงมาลัยไว้ให้ที่บ้าน"
        show_if: { alone: true }
        result: "พวงมาลัยเหี่ยวก่อนได้กลับบ้าน แต่ยังพับเก็บไว้ในตู้ล็อกเกอร์ไม่ทิ้ง"
        fx: { relations: 1 }
        merit: { care_parents: 1 }
      - label: "ขอให้ที่บ้านไม่ต้องลำบากมาอีก"
        hide_if: { alone: true }
        result: "{ผู้ใหญ่}พยักหน้ารับ แต่ก่อนกลับถามว่าวันพบญาติครั้งหน้าคือวันไหน"
        fx: { happiness: -1, relations: 1 }
      - label: "เขียนจดหมายเล่าวันนี้ให้บ้าน"
        show_if: { alone: true }
        result: "เขียนเล่าทุกอย่างที่เห็นในลาน ยกเว้นว่าตัวเองยืนอยู่คนเดียว จดหมายยาวสองหน้า"
        fx: { happiness: -1, relations: 1 }
    # ฉากเสี่ยงตาย: ก้มหน้าทำต่อ กับ ขอรับโทษแทน มีโอกาสตาย (ตัวเลขอยู่ที่ numbers.school) · ร้องเรียนได้ผลมากขึ้นตั้งแต่ปีระเบียบเข้ม · ทางรับโทษแทน เจ้าของเคาะ 2026-11-11 ลดสุขภาพ −1 เหลือ 0
    SB-07:
      title: "หลังไฟดับ"
      text: "หลังไฟดับ รุ่นพี่กลุ่มหนึ่งเรียกทั้งห้องออกไปหลังโรงนอน เพราะมีคนเก็บเตียงไม่เรียบ ท่าที่สั่งไม่มีอยู่ในระเบียบ ผ่านไปเกือบชั่วโมง เพื่อนเตียงถัดไปหน้าซีด หายใจไม่ทัน แต่ยังไม่มีใครสั่งให้หยุด"
      options:
      - label: "ก้มหน้าทำต่อจนกว่าจะสั่งหยุด"
        risk: "07_endure"
        outcomes:
          - weight: a
            result: "ตีหนึ่งรุ่นพี่สั่งเลิก ทุกคนเดินกลับโรงนอนเงียบ ๆ ไม่มีใครพูดถึงคืนนี้อีก แต่เช้ามาไม่มีใครมองหน้ารุ่นพี่กลุ่มนั้น"
            fx: { happiness: -1, network: 1 }
            setFlags: [cadet_silent]
          - weight: b
            result: "เพื่อนเตียงถัดไปล้มลงกับพื้น รุ่นพี่แตกฮือ คนหนึ่งวิ่งไปตามเวรพยาบาล เพื่อนฟื้นในห้องพยาบาลตอนเช้า ไม่มีใครบอกว่าใครสั่งท่านั้น"
            fx: { happiness: -2 }
            setFlags: [cadet_silent]
      - label: "ขอรับโทษแทนเพื่อน"
        risk: "07_take"
        result: "{ชื่อ}ก้าวออกไปขอทำแทน รุ่นพี่หัวเราะ 'ได้ ทำของมันด้วย ของตัวเองด้วย' เพื่อนได้นั่งพัก {ชื่อ}ทำต่อจนแขนสั่น เช้ามาเพื่อนเอาไข่ของตัวเองมาวางบนถาดให้"
        fx: { relations: 2 }
        merit: { help_others: 1 }
      - label: "พยุงเพื่อนไปห้องพยาบาล"
        outcomes:
          - weight: a
            result: "{ชื่อ}พยุงเพื่อนลุกขึ้นทั้งที่ไม่มีใครอนุญาต รุ่นพี่ตะโกนตามหลัง แต่ไม่มีใครตามมา พยาบาลเวรดูอาการแล้วให้นอนห้องพยาบาลทั้งคืน"
            fx: { relations: 1 }
            merit: { help_others: 2 }
          - weight: b
            result: "รุ่นพี่ขวางทางไว้ 'ใครสั่งให้ไป' ทั้งห้องโดนต่ออีกครึ่งชั่วโมง แต่เพื่อนได้นั่งพิงกำแพงจนจบ"
            fx: { network: -1 }
            merit: { help_others: 2 }
      - label: "รายงานนายทหารปกครองตอนเช้า"
        outcomes:
          - weight: complaint
            result: "นายทหารปกครองเรียกรุ่นพี่กลุ่มนั้นไปสอบตั้งแต่บ่าย สัปดาห์ต่อมาไม่มีใครถูกเรียกออกไปหลังไฟดับอีก"
            fx: { relations: 1 }
            setFlags: [cadet_spoke]
            merit: { sila: 1 }
          - weight: complaint_fail
            result: "นายทหารปกครองจดชื่อไว้ แล้วไม่มีอะไรเกิดขึ้น คืนนั้นรุ่นพี่กลุ่มเดิมเดินผ่านเตียง {ชื่อ} ช้ากว่าเตียงอื่น"
            fx: { relations: -2, network: -1 }
            setFlags: [cadet_spoke]
    SB-27a:
      title: "ขุดจักรดาว"
      text: "คืนก่อนวันไหว้ครู รุ่นพี่ปีสองเรียกทั้งกองออกมาที่ลาน 'คืนนี้ขุดจักรดาว ใครยังอยากเป็นนักเรียนใหม่ต่อ ยกมือ' ไม่มีใครยกมือ ทั้งคืนวิ่ง ท่อง ยึดพื้น ตีห้าทุกคนยืนเรียงในชุดกำนัน รอเข็มกลัดตราจักรดาวที่หน้าอก"
      options:
      - label: "ทำทุกคำสั่งให้ดีที่สุด"
        result: "ทั้งคืนขัดรองเท้าจนเห็นหน้าตัวเอง ตีห้ารุ่นพี่กลัดจักรดาวให้ แล้วพูดเบา ๆ ว่า 'ยินดีด้วยน้อง' เป็นครั้งแรกที่รุ่นพี่พูดโดยไม่ตะโกน"
        fx: { health: 1, network: 1 }
      - label: "คอยดึงเพื่อนที่ตามไม่ทัน"
        result: "ดุ่ยหมดแรงตอนตีสาม {ชื่อ}นับจังหวะให้จนดุ่ยลุกขึ้นได้ ตอนกลัดจักรดาว ดุ่ยยืนตัวตรงที่สุดในแถว"
        fx: { relations: 1 }
        merit: { help_others: 1 }
      - label: "กลั้นน้ำตาตอนกลัดจักรดาว"
        result: "ตอนเข็มกลัดเจาะผ่านผ้าเสื้อ {ชื่อ}นึกถึงจดหมายใต้ที่นอน แล้วกลั้นไว้ไม่อยู่ รุ่นพี่ทำเป็นมองไปทางอื่น"
        fx: { happiness: 2 }
      - label: "แอบงีบตอนพักน้ำ"
        outcomes:
          - weight: a
            result: "หลับยืนไปห้านาทีตอนพักน้ำ ตื่นมาทันรอบต่อไปพอดี ไม่มีใครรู้"
            fx: { health: 1 }
          - weight: b
            result: "หลับยืนจนเซไปชนแบงก์ แบงก์ละเมอขานรับ 'ครับ! พร้อมครับ!' ทั้งกองได้วิ่งเพิ่มอีกรอบ"
            fx: { happiness: 1, relations: -1 }
    # เจ้าของเคาะ 2026-11-11: ก่อนได้ชุดปกติเป็น นรม. ได้ชุดปกติแล้วจึงเป็น นตท. · ฉากนี้แทนการ์ดชั่วคราว "ชุดปกติชุดแรก" เดิม
    SB-27b:
      title: "เครื่องแบบปกติ"
      setTitle: นตท.        # เจ้าของเคาะ 2026-11-11 ได้ชุดปกติแล้วจึงเป็น นตท. · ตัวเดินเปลี่ยนคำนำหน้าตอนฉากนี้ขึ้น
      text: "สัปดาห์ที่สิบ พิธีแต่งเครื่องแบบปกติ กางเกงเขียวแบบทหารบก เชิ้ตขาวแบบทหารเรือ หมวกเทาอมน้ำเงินแบบทหารอากาศ สามเหล่าอยู่ในชุดเดียว วันเดียวกันเบี้ยเลี้ยงเดือนแรกก็ออก ไม่มาก แต่เป็นเงินก้อนแรกที่ได้มาเอง"
      contextLines:
        - line: "ตอนเข้าแถวหลังพิธี รุ่นพี่ขานชื่อ 'นตท.{ชื่อเต็ม}!' เป็นครั้งแรก"
      options:
      - label: "ส่งกลับบ้านให้{ผู้ใหญ่}ทั้งหมด"
        result: "ส่งกลับบ้านทั้งก้อน บอกว่าไม่ต้องเก็บไว้ให้ {ผู้ใหญ่}ตอบกลับมาว่าเก็บไว้ให้ทั้งหมด"
        fx: { relations: 1 }
        merit: { care_parents: 1 }
      - label: "เก็บไว้ใต้ล็อกเกอร์"
        result: "พับใส่ซองซุกไว้ใต้ล็อกเกอร์ ทุกคืนก่อนไฟดับเอามือคลำดูว่ายังอยู่"
        fx: { money: small }
      - label: "ซื้อรองเท้าวิ่งคู่ใหม่"
        result: "ใส่คู่กับชุดปกติไม่ได้ ต้องรอชุดฝึกพรุ่งนี้ คืนนี้วางไว้ปลายเตียงก่อน"
        fx: { health: 1 }
      - label: "เลี้ยงเพื่อนทั้งห้องวันลาพัก"
        result: "วันลาพัก ทั้งห้องกินก๋วยเตี๋ยวร้านหน้าโรงเรียนกันคนละสองชาม ต้อมแต่งเพลงขอบคุณให้หนึ่งท่อน"
        fx: { network: 1 }
    # ไม่ขึ้นกับคนที่มาคนเดียว (ไม่มีผู้ใหญ่มารับ)
    SB-N2:
      title: "รถมือสองของจ่า"
      when: { alone: false }
      text: "วันศุกร์ปล่อยพัก {ผู้ใหญ่}มารับที่ลานจอดรถ ยังไม่ทันขึ้นรถ จ่าขมลมโชยเข็นมอเตอร์ไซค์มือสองมาจอดข้าง ๆ 'คันนี้ระเบียบดีมากครับ เจ้าของเก่าเป็นครูฝึก ลองขี่ดูก่อนได้' {ผู้ใหญ่}ขึ้นขี่ไปได้สามเมตร เกียร์หลุด"
      options:
      - label: "ช่วยจ่าขมเข็นรถกลับ"
        result: "{ชื่อ}กับ{ผู้ใหญ่}ช่วยเข็นกลับมาที่เดิม จ่าขมบอกว่าเกียร์มันเขินคนแปลกหน้า แล้วจำหน้า {ชื่อ} ได้ตั้งแต่วันนั้น"
        fx: { network: 1 }
        setFlags: [cadet_jaa_bike]
      - label: "กระซิบบอก{ผู้ใหญ่}ว่าอย่าซื้อ"
        result: "{ผู้ใหญ่}พยักหน้า จ่าขมได้ยินพอดี มองค้อนหนึ่งที แล้วบอกว่า 'เจ้าของเก่าก็คือข้านี่แหละ'"
        fx: { relations: 1 }
        setFlags: [cadet_jaa_bike]
      - label: "ต่อราคาแทน{ผู้ใหญ่}"
        outcomes:
          - weight: a
            result: "ต่อจนจ่าขมยอมลดให้ครึ่งหนึ่ง แต่{ผู้ใหญ่}ไม่ซื้ออยู่ดี จ่าขมเข็นรถกลับ บ่นว่าโดนนักเรียนตัวเองต่อ"
            fx: { happiness: 1, network: 1 }
            setFlags: [cadet_jaa_bike]
          - weight: b
            result: "ต่อสำเร็จ {ผู้ใหญ่}ซื้อจริง ขี่กลับบ้านไปได้ครึ่งทาง รถดับกลางถนน ต้องเรียกกระบะมาขน"
            fx: { money: -small, happiness: 1 }
            setFlags: [cadet_jaa_bike]
      - label: "แกล้งทำเป็นไม่รู้จักจ่า"
        result: "{ชื่อ}หันหน้าไปทางอื่น จ่าขมเรียกเสียงดังกลางลานจอดรถ 'นรม.{ชื่อเต็ม} ผู้ปกครองใช่ไหม'"
        fx: { happiness: 1 }
        setFlags: [cadet_jaa_bike]
    SB-N5:
      title: "ไข่พะโล้วันพุธ"
      text: "ไข่พะโล้มีแค่วันพุธ คนละฟอง ในโรงนอนไข่ฟองนั้นกลายเป็นเงินตรา แลกเวรล้างห้องน้ำได้สามวัน แลกขัดรองเท้าได้หนึ่งสัปดาห์ ต้อมตั้งราคา 'ไข่ฟองนี้แลกเวรห้องน้ำสามวัน ไม่ต่อ' แบงก์ถาม 'ไข่ครึ่งฟองแลกได้ไหม'"
      options:
      - label: "เก็บไข่ไว้แลกเวร"
        result: "แลกเวรห้องน้ำได้สามวันเต็ม ต้อมล้างแทนพร้อมร้องเพลงไปด้วย ห้องน้ำสะอาดกว่าทุกสัปดาห์"
        fx: { happiness: 1 }
        setFlags: [cadet_egg]
      - label: "กินเลย ไม่สนตลาด"
        result: "ไข่ทั้งฟองหายเข้าปากภายในคำเดียว ทั้งโต๊ะมองเหมือนเห็นคนเผาเงินทิ้ง"
        fx: { health: 1 }
        setFlags: [cadet_egg]
      - label: "ตั้งตัวเป็นธนาคารไข่"
        outcomes:
          - weight: a
            result: "รับฝากไข่ทั้งห้อง จดบัญชีในสมุดเล่มเล็ก สิ้นเดือน {ชื่อ}มีไข่ในมือสิบสองฟอง"
            fx: { happiness: 1, network: 1 }
            setFlags: [cadet_egg]
          - weight: b
            result: "ไข่ที่ฝากไว้ใต้หมอนเริ่มส่งกลิ่นวันที่สี่ ตรวจตู้เช้าวันศุกร์ รุ่นพี่เจอไข่บูดเต็มตู้ ธนาคารปิดกิจการ"
            fx: { happiness: -1, relations: -1 }
            setFlags: [cadet_egg]
      - label: "ผ่าครึ่งให้แบงก์"
        result: "ผ่าไข่ด้วยช้อนให้แบงก์ครึ่งซีก แบงก์ถือไว้นานจนลืมกิน แล้วละเมอขอบใจตอนตีสาม"
        fx: { relations: 1 }
        setFlags: [cadet_egg]
    # ฉากหนีเที่ยวกับพี่พลเอก (บทเจ้าของ) ต่อกันเป็นชุด N9-1 ถึง N9-5
    N9-1:
      title: "ตีสองในโรงนอน"
      text: "ตีสองคืนวันพุธ ไฟโรงนอนเปิดพรึ่บ รุ่นพี่ปีสองชื่อพลเอกเดินเข้ามาปลุกนักเรียนปีหนึ่งทั้งห้อง 'ซ้ายหัน ขวาหัน ทั้งหมดไม่ต้องหัน! พ่าม!' ครึ่งห้องหันซ้าย อีกครึ่งหันขวา 'งงเป็นไก่ตาแตกเลย เดี๋ยวสั่งขังทั้งกองร้อย'"
      next: [N9-2a]
    N9-2a:
      title: "ท่านพี่"
      text: "'เสียชีพ อย่าเสียสัตย์' พี่พลเอกหยุดตรงหน้าแบงก์ 'เคยถามตัวเองบ้างไหม เกิดมาเพื่ออะไร เกิดมาทำไม ไอ้เนรคุณแผ่นดิน!' เพี้ยะ!"
      next: [N9-2b]
    N9-2b:
      title: "ท่านพี่"
      text: "แบงก์หันหน้ากลับ พนมมือ 'ข้าทำอะไรผิดรึท่านพี่' พี่พลเอกหลับตา 'โดยหัวใจเดิมนั้นข้าไม่ได้อยากตบเจ้าเลย เอาละ วันนี้วันดี มีร้านเปิดใหม่ ใครจะหนีไปเที่ยวกับข้าบ้าง'"
      next: [N9-3]
    # ตามไปหรือชวนเพื่อนไป: สุ่มถูกจับที่ช่องรั้ว ถ้าถูกจับไปฉากไฟฉายที่ช่องรั้วแทนฉากแตรปลุก
    N9-3:
      title: "ใครจะไปบ้าง"
      text: "ทั้งห้องหันมามองหน้ากัน แบงก์ยังพนมมือค้างอยู่ พี่พลเอกยืนรอคำตอบที่ประตู มือหนึ่งถือไฟฉาย อีกมือถือถุงพลาสติกใส่รองเท้าแตะ"
      options:
      - label: "ตามพี่พลเอกไป"
        setFlags: [cadet_pe_night]
        next: [N9-4, N9-5]
        nextCaught: [N9-4, N9-5c]
      - label: "แกล้งหลับต่อ"
        result: "{ชื่อ}นอนหลับตาฟังเสียงพวกเขาย่องออกไป พอตื่นเช้ามาเจอถุงข้าวต้มวางอยู่ปลายเตียง พร้อมกระดาษแผ่นเล็ก 'จากพลเอก อย่าบอกใคร' ด้านหลังมีลายมืออีกคนเขียนว่า 'ข้าวต้มร้านนี้ใช้ได้ —ข.'"
        fx: { health: 1, relations: 1 }
      - label: "ไปรายงานเวรยาม"
        result: "{ชื่อ}ย่องไปป้อมเวรยามจะรายงาน คนที่นั่งเวรคืนนี้คือจ่าขมลมโชย จ่าขมฟังจบ พยักหน้าช้า ๆ ลุกขึ้นหยิบไฟฉาย 'ดี ข้าจะไปจับเอง' สิบนาทีต่อมา {ชื่อ}เห็นไฟฉายของจ่าขมส่องนำทางไปร้านข้าวต้ม ไม่ได้ไปจับใคร"
        fx: { happiness: 1 }
        setFlags: [cadet_saw_jaa]
      - label: "ชวนต้อม แบงก์ ดุ่ยไปด้วย"
        setFlags: [cadet_pe_night, cadet_n9_squad]
        next: [N9-4, N9-5]
        nextCaught: [N9-4, N9-5c]
    # ก่อนปีวงลูกทุ่ง (band_year) ร้านใช้วงลูกทุ่งเล่นสดแทนคาราโอเกะ · ทางขอกลับก่อนข้ามฉากท้ายทั้งสองแบบ (ไม่ถูกจับ)
    N9-4:
      title: "ร้านเปิดใหม่"
      text: "รั้วหลังโรงครัวมีช่องที่รุ่นพี่รู้กันมาหลายรุ่น พี่พลเอกมุดออกไปก่อน {ชื่อ}ตามไป {บรรทัดยกกอง} ร้านเปิดใหม่คือร้านข้าวต้มโต้รุ่งที่มีคาราโอเกะ ป้ายผ้าเขียนว่า 'เปิดวันแรก ร้องฟรี'"
      textBy:
        - when: { yearBefore: school.band_year }
          text: "รั้วหลังโรงครัวมีช่องที่รุ่นพี่รู้กันมาหลายรุ่น พี่พลเอกมุดออกไปก่อน {ชื่อ}ตามไป {บรรทัดยกกอง} ร้านเปิดใหม่คือร้านข้าวต้มโต้รุ่งที่มีวงลูกทุ่งเล่นสด ป้ายผ้าเขียนว่า 'เปิดวันแรก ขึ้นร้องฟรี'"
      options:
      - label: "สั่งข้าวต้มกุ้งชามใหญ่"
        result: "ข้าวต้มชามใหญ่กว่าหน้า กินไปครึ่งชามก็เห็นคนโต๊ะในสุดหันหลังให้ ซดข้าวต้มเสียงดังซู้ด ไหล่ที่คุ้นตามาก… จ่าขมลมโชย จ่าขมไม่หันมา แต่ยกมือขึ้นหนึ่งข้าง ทำนิ้วเป็นเลขศูนย์ ทั้งโต๊ะเข้าใจตรงกันว่า 'ไม่มีใครเห็นใคร'"
        fx: { health: 1, happiness: 1 }
      - label: "ขึ้นร้องคาราโอเกะ"
        hide_if: { yearBefore: school.band_year }
        result: "{ชื่อ}จับไมค์ร้องเพลงโรงเรียนผิดทำนอง เจ้าของร้านหัวเราะจนน้ำตาไหล แถมไข่เจียวให้หนึ่งจาน โต๊ะในสุดมีคนปรบมือช้า ๆ สามที เสียงปรบมือคุ้นหูมาก"
        resultBy:
          - when: { flagsHas: [cadet_n9_squad] }
            text: "{ชื่อ}จับไมค์ร้องเพลงลูกทุ่งที่ต้อมแต่งสูตรเคมีไว้ เจ้าของร้านหัวเราะจนน้ำตาไหล แถมไข่เจียวให้หนึ่งจาน โต๊ะในสุดมีคนปรบมือช้า ๆ สามที เสียงปรบมือคุ้นหูมาก"
        fx: { happiness: 2, network: 1 }
        setFlags: [cadet_karaoke]
      - label: "ขึ้นร้องกับวงลูกทุ่ง"
        show_if: { yearBefore: school.band_year }
        result: "{ชื่อ}จับไมค์ร้องเพลงโรงเรียนผิดทำนอง เจ้าของร้านหัวเราะจนน้ำตาไหล แถมไข่เจียวให้หนึ่งจาน โต๊ะในสุดมีคนปรบมือช้า ๆ สามที เสียงปรบมือคุ้นหูมาก"
        resultBy:
          - when: { flagsHas: [cadet_n9_squad] }
            text: "{ชื่อ}จับไมค์ร้องเพลงลูกทุ่งที่ต้อมแต่งสูตรเคมีไว้ เจ้าของร้านหัวเราะจนน้ำตาไหล แถมไข่เจียวให้หนึ่งจาน โต๊ะในสุดมีคนปรบมือช้า ๆ สามที เสียงปรบมือคุ้นหูมาก"
        fx: { happiness: 2, network: 1 }
        setFlags: [cadet_karaoke]
      - label: "ไปนั่งโต๊ะเดียวกับคนที่หันหลัง"
        result: "เดินไปนั่งตรงข้ามโดยไม่รู้ตัว เงยหน้าขึ้นมาเจอจ่าขมลมโชย ซดข้าวต้มค้างอยู่ จ่าขมเลื่อนจานไข่เค็มมาให้หนึ่งฟอง 'กินซะ แล้วไม่เคยเจอกัน' พี่พลเอกที่โต๊ะข้าง ๆ สำลักข้าวต้มจนน้ำหูน้ำตาไหล"
        fx: { network: 2 }
        setFlags: [cadet_saw_jaa]
      - label: "ขอกลับก่อน กลัวไม่ทันตีห้า"
        result: "{ชื่อ}รีบเดินกลับคนเดียว พอถึงช่องรั้วก็เจอคนตัวใหญ่กำลังมุดเข้ามาจากอีกฝั่ง ไหล่ติดรั้วพอดี สองคนมองหน้ากันในความมืด จ่าขมพูดเบา ๆ 'ดันหน่อย' {ชื่อ}ดันจนจ่าหลุดเข้าไป ทั้งคู่แยกกันเดินโดยไม่พูดอะไรอีก"
        fx: { relations: 1 }
        setFlags: [cadet_saw_jaa]
        skip: [N9-5, N9-5c]
    # ถูกจับที่ช่องรั้ว (แทนฉากแตรปลุก) · คนที่ไปนั่งโต๊ะจ่าขมมาแล้วใช้ประโยคแยก
    N9-5c:
      title: "ไฟฉายที่ช่องรั้ว"
      text: "ตีสี่ห้าสิบ ทั้งกลุ่มวิ่งกลับมาถึงช่องรั้ว ไฟฉายดวงหนึ่งส่องรออยู่ก่อนแล้ว จ่าขมยืนกอดอก 'ที่ร้านไม่มีใครเห็นใคร แต่ที่รั้วนี่ข้าเห็น' แตรปลุกดังขึ้นตอนที่ทุกคนยังยืนเรียงอยู่หน้ารั้ว"
      textBy:
        - when: { flagsHas: [cadet_saw_jaa] }
          text: "ตีสี่ห้าสิบ ทั้งกลุ่มวิ่งกลับมาถึงช่องรั้ว ไฟฉายดวงหนึ่งส่องรออยู่ก่อนแล้ว จ่าขมยืนกอดอก 'เมื่อกี้ไม่เคยเจอกัน แต่ตอนนี้เจอแล้ว' แตรปลุกดังขึ้นตอนที่ทุกคนยังยืนเรียงอยู่หน้ารั้ว"
      options:
      - label: "ยืนตรง รอฟังโทษ"
        result: "เช้านั้นหน้าเสาธง จ่าขมเรียก{ชื่อ}กับพี่พลเอกออกไปยืนหน้าแถวทั้งกองร้อย แล้วอ่านทีละชื่อช้า ๆ ว่าใครหนีไปกินข้าวต้มตอนตีสอง ทั้งกองร้อยเงียบ สัปดาห์นั้นเดินผ่านใครก็ได้ยินคำว่า 'พวกข้าวต้ม'"
        resultBy:
          - when: { flagsHas: [cadet_n9_squad] }
            text: "เช้านั้นหน้าเสาธง จ่าขมเรียก{ชื่อ} ต้อม แบงก์ ดุ่ย กับพี่พลเอกออกไปยืนหน้าแถวทั้งกองร้อย แล้วอ่านทีละชื่อช้า ๆ ว่าใครหนีไปกินข้าวต้มตอนตีสอง ทั้งกองร้อยเงียบ สัปดาห์นั้นเดินผ่านใครก็ได้ยินคำว่า 'พวกข้าวต้ม'"
        fx: { happiness: -2 }
        setFlags: [cadet_n9_caught]
    N9-5:
      title: "แตรปลุก"
      text: "ตีสี่ห้าสิบ ทั้งกลุ่มวิ่งกลับมาถึงช่องรั้ว ข้างในโรงนอนยังมืด เพิ่งมุดเข้ามาได้ครึ่งตัว แตรปลุกก็ดังพอดี {ชื่อ}พุ่งขึ้นเตียง ผ้าห่มยังไม่ทันพับ เช้านั้นจ่าขมเดินตรวจเตียงช้ากว่าทุกวัน หยุดตรงเตียงที่ผ้าห่มยับที่สุด แล้วเดินผ่านไปเฉย ๆ"
    # ช่องสุ่ม t0 · มาคนเดียว: ค่ารถกลับบ้านเกินเบี้ยเลี้ยง ไม่ได้กลับ ค่าทุกทางเท่าฉบับปกติ
    SB-12:
      title: "ลาพักครั้งแรก"
      text: "ลาพักครั้งแรก {ชื่อ}ใส่ชุดนักเรียนเตรียมทหารเดินเข้าซอยบ้าน ไม่สิ วิ่งเข้าซอย รู้ตัวอีกทีก็มาถึงหน้าร้านขายของชำแล้ว ป้าเจ้าของร้านจำไม่ได้อยู่ครู่หนึ่ง 'รีบไปไหนลูก บ้านไม่หนีไปไหนหรอก'"
      textBy:
        - when: { alone: true }
          text: "ลาพักครั้งแรก เพื่อนทั้งรุ่นหิ้วกระเป๋าออกประตูไปขึ้นรถผู้ปกครอง บ้านของ {ชื่อ}ไกลเกินกว่าจะไปกลับทันในสองวัน ค่ารถไปกลับก็เกินเงินที่ติดตัวมา คืนวันศุกร์โรงนอนเหลือคนไม่ถึงสิบเตียง"
      options:
      - label: "นอนให้เต็มอิ่มทั้งสองวัน"
        hide_if: { alone: true }
        result: "ตื่นเองตอนตีห้าสิบห้าเพราะเคยตัว แล้วนอนต่อจนเที่ยง นอนดีที่สุดตั้งแต่มาอยู่ที่นี่"
        fx: { health: 1 }
      - label: "นอนให้เต็มอิ่มทั้งสองวัน"
        show_if: { alone: true }
        result: "โรงนอนเงียบจนได้ยินเสียงพัดลมทุกตัว ตื่นเองตอนตีห้าสิบห้าเพราะเคยตัว แล้วนอนต่อจนเที่ยง นอนดีที่สุดตั้งแต่มาอยู่ที่นี่"
        fx: { health: 1 }
      - label: "ไปหาเพื่อนเก่าที่ร้านประจำ"
        hide_if: { alone: true }
        result: "เพื่อนเก่าถามว่าที่นั่นโดนตีไหม {ชื่อ}เล่าเรื่องห้ามเดินจนทั้งโต๊ะหัวเราะ ไม่ได้เล่าเรื่องอื่น"
        fx: { happiness: 1 }
      - label: "เดินเล่นกับเพื่อนที่ไม่ได้กลับ"
        show_if: { alone: true }
        result: "เดินกับเพื่อนอีกสองคนที่บ้านไกลเหมือนกัน ซื้อลูกชิ้นถุงเดียวแบ่งกันกิน ไม่มีใครพูดเรื่องบ้าน"
        fx: { happiness: 1 }
      - label: "ช่วยงานบ้านจนวันกลับ"
        hide_if: { alone: true }
        result: "ล้างจาน กวาดบ้าน พับผ้าเป็นเหลี่ยมคมจน{ผู้ใหญ่}ไม่กล้าคลี่ออกมาใส่"
        fx: { relations: 1 }
      - label: "เขียนจดหมายถึงบ้าน"
        show_if: { alone: true }
        result: "เขียนเล่าเรื่องห้ามเดินกับการพับผ้าห่ม ไม่เล่าว่าลาพักแล้วไม่ได้กลับ ปิดท้ายว่าสบายดีทุกอย่าง"
        fx: { relations: 1 }
      - label: "แวะไปหาครูที่โรงเรียนเดิม"
        hide_if: { alone: true }
        result: "ครูแนะแนวเรียกเด็ก ม.สี่ ทั้งห้องออกมาดูชุด {ชื่อ}ยืนตรงให้ดูทั้งที่ไม่มีใครสั่ง"
        fx: { network: 1 }
      - label: "ขัดรองเท้ารอเพื่อนกลับมา"
        show_if: { alone: true }
        result: "ขัดรองเท้าของตัวเองจนเงา แล้วขัดของเพื่อนข้างเตียงต่ออีกสามคู่ คืนวันอาทิตย์เพื่อนกลับมาพร้อมขนมจากบ้าน แบ่งให้คนละถุง"
        fx: { network: 1 }
    # ช่องสุ่ม t1 (ภาคเรียน 1) ห้าใบ: SB-N6 SB-08 SB-09 SB-10 SB-13
    SB-N6:
      title: "เพลงโรงเรียนฉบับลูกทุ่ง"
      text: "รุ่นพี่สั่งให้ปีหนึ่งร้องเพลงประจำโรงเรียนให้ได้ภายในคืนเดียว ต้อมแปลงเป็นทำนองลูกทุ่งให้ทั้งห้องจำ ง่ายจนจำได้ในสิบนาที เช้าวันจริงหน้าเสาธง ทั้งรุ่นเริ่มร้องพร้อมกัน แล้วก็รู้ตัวว่าทำนองไม่ใช่ของจริง"
      options:
      - label: "ร้องทำนองจริงดัง ๆ ให้คนตาม"
        result: "{ชื่อ}ร้องทำนองจริงดังกว่าทุกคน แถวรอบตัวเริ่มตามมาทีละคน ครึ่งหลังของเพลงกลับมาเป็นเพลงโรงเรียน ครึ่งแรกยังเป็นงานวัด"
        fx: { knowledge: 1 }
      - label: "ร้องตามต้อมไปเลย"
        outcomes:
          - weight: a
            result: "ทั้งรุ่นร้องลูกทุ่งพร้อมกันจนจบ รุ่นพี่ตะโกน 'นั่นเพลงโรงเรียนหรือเพลงงานวัด!' แล้วหันไปหัวเราะกับเพื่อนเอง"
            fx: { relations: 1, happiness: 1 }
          - weight: b
            result: "รุ่นพี่สั่งร้องใหม่ด้วยทำนองจริงสิบรอบ ทั้งรุ่นยึดพื้นไปร้องไป ต้อมกระซิบ 'ติดหูกว่าเดิมเยอะเลยพี่'"
            fx: { relations: 1, health: 1 }
      - label: "ขยับปาก ไม่ออกเสียง"
        result: "ขยับปากตามคนข้าง ๆ ไม่มีเสียงออกมาสักคำ รุ่นพี่เดินผ่านแล้วหยุดฟังตรงหน้าพอดี"
        fx: { happiness: -1 }
      - label: "ขอโทษรุ่นพี่แทนทั้งรุ่น"
        result: "{ชื่อ}ยกมือขอโทษแทนทั้งรุ่น รุ่นพี่ถามว่าใครแต่ง {ชื่อ}ตอบว่าแต่งกันทั้งห้อง ต้อมรอดไปอีกวัน"
        fx: { network: 1 }
    SB-08:
      title: "ผื่นที่ไม่หาย"
      text: "ฝึกทั้งวัน เหงื่อซึมทั้งวัน เวลาซักผ้ามีแค่ช่วงสั้น ๆ ก่อนไฟดับ ผ่านไปสามสัปดาห์ ผิวตรงขาหนีบกับซอกนิ้วเท้าขึ้นผื่นแดง คันจนนอนไม่หลับ หมอห้องพยาบาลให้ยาทามาหลอดหนึ่ง บอกว่าทาเท่าไรก็ไม่หาย ถ้าผ้ายังตากไม่แห้ง"
      options:
      - label: "ตื่นก่อนเพื่อนมาซักผ้า"
        result: "ซักเสร็จก่อนแตร ตากไว้ตรงราวที่แดดเช้าส่องถึงก่อน สองสัปดาห์ผื่นยุบ เหลือแต่รอยดำ"
        fx: { health: 1 }
      - label: "ขอยืมผ้าเพื่อนใส่ก่อน"
        result: "ต้อมโยนกางเกงในตัวสำรองมาให้ 'คืนเมื่อไรก็ได้ ไม่คืนก็ได้' ผื่นยังอยู่ แต่มีผ้าแห้งใส่"
        fx: { relations: 1 }
      - label: "ทนไปจนถึงวันลาพัก"
        result: "ทาตามหมอ ใส่ผ้าชื้นต่อ ผื่นลามจนเดินขาถ่าง ทั้งกองรู้โดยไม่ต้องบอก"
        fx: { health: -1 }
      - label: "โรยแป้งเด็กแทนยา"
        result: "โรยแป้งจนกางเกงขาวเป็นแถบ รุ่นพี่ถามว่าไปคลุกอะไรมา ผื่นดีขึ้นนิดหนึ่ง กลิ่นแป้งเด็กติดไปทั้งกอง"
        fx: { happiness: 1 }
    SB-09:
      title: "เข่าบวม"
      text: "ฝึกหนักติดกันสามสัปดาห์ หัวเข่าเริ่มบวมจนงอไม่สุด หมอห้องพยาบาลบอกให้พักสองสัปดาห์ แต่สัปดาห์หน้าเป็นสอบภาคปฏิบัติที่คะแนนนับลำดับ"
      options:
      - label: "พักตามหมอสั่ง"
        result: "นั่งดูเพื่อนฝึกอยู่ข้างสนามสองสัปดาห์ เข่ายุบแล้ว แต่รุ่นพี่บางคนเริ่มเรียกว่าพวกนั่งร่ม"
        fx: { health: 1, network: -1 }
      - label: "พันเข่าแล้วฝึกต่อ"
        outcomes:
          - weight: a
            result: "พันผ้ายืดจนแน่น ผ่านสอบภาคปฏิบัติไปได้ทั้งที่เดินกะเผลก ครูฝึกจดชื่อไว้ในช่องคนไม่ถอย"
            fx: { network: 1 }
          - weight: b
            result: "วันที่สามเข่าพับกลางสนาม หมอสั่งพักเพิ่มเป็นเดือน สอบภาคปฏิบัติก็ต้องไปสอบรอบหลังอยู่ดี"
            fx: { health: -2 }
      - label: "ขอสอบภาคปฏิบัติรอบหลัง"
        result: "ได้สอบรอบหลังพร้อมคนป่วยอีกสามคน สนามเงียบกว่า ไม่มีใครเชียร์ แต่เข่าไม่ปวด"
        fx: { health: 1, happiness: -1 }
      - label: "ให้เพื่อนช่วยซ้อมท่าเบา ๆ"
        result: "ดุ่ยแบกกระเป๋าให้ทุกเช้า ต้อมนับจังหวะให้ตอนซ้อมยืดเข่า เป็นเพลงลูกทุ่งอีกแล้ว"
        fx: { relations: 1 }
    SB-10:
      title: "นาฬิกาหาย"
      text: "นาฬิกาของเพื่อนร่วมห้องหายจากตู้ รุ่นพี่สั่งค้นทุกตู้ก่อนไฟดับ {ชื่อ}เห็นเมื่อบ่ายว่าใครเปิดตู้นั้น แต่คนนั้นคือเพื่อนสนิทที่บ้านจนกว่าใครในห้อง"
      options:
      - label: "บอกรุ่นพี่ตามที่เห็น"
        result: "นาฬิกาเจอในตู้ของเพื่อนคนนั้น เขาถูกเรียกไปกองร้อยทั้งบ่าย กลับมานอนหันหลังให้ทั้งห้องจนไฟดับ"
        fx: { network: 1, relations: -1 }
        merit: { sila: 1 }
      - label: "คุยกับเพื่อนให้เอาไปคืนเอง"
        outcomes:
          - weight: a
            result: "เพื่อนไม่ตอบอะไร คืนนั้นนาฬิกาไปวางอยู่บนเตียงเจ้าของเหมือนไม่เคยหาย ไม่มีใครถามว่ามาจากไหน"
            fx: { relations: 1 }
            merit: { sila: 1 }
          - weight: b
            result: "'เห็นผิดคนแล้ว' เพื่อนว่าแล้วเดินหนี นาฬิกาไม่กลับมา ตั้งแต่นั้นเพื่อนคนนี้ไม่นั่งโต๊ะเดียวกับ {ชื่อ} อีก"
            fx: { happiness: -1 }
            merit: { sila: 1 }
      - label: "ทำเป็นไม่เห็น"
        result: "ค้นจนเที่ยงคืนก็ไม่เจอ ทั้งห้องโดนงดพักหนึ่งสัปดาห์ {ชื่อ}นอนลืมตาจนเช้า"
        fx: { happiness: -1 }
      - label: "ออกเงินซื้อเรือนใหม่ให้เจ้าของ"
        result: "ฝากรุ่นพี่ซื้อเรือนใหม่ตอนออกไปข้างนอก บอกเจ้าของว่าเจอที่ร้าน เจ้าของไม่เชื่อแต่รับไว้ เพื่อนคนนั้นมองอยู่ไกล ๆ"
        fx: { money: -small, relations: 1 }
        merit: { dana: 1 }
    SB-13:
      title: "งดปล่อยพัก"
      text: "กระเป๋าเก็บพร้อมแล้ว รถผู้ปกครองเริ่มมาจอดหน้าโรงเรียน แล้วเสียงประกาศก็ดังขึ้น งดปล่อยพักทั้งรุ่น เพราะมีคนทำผิดระเบียบแล้วไม่มีใครรับ ทั้งรุ่นหิ้วกระเป๋ากลับขึ้นโรงนอน"
      options:
      - label: "ฝากบอกที่บ้านว่าไม่ได้กลับ"
        hide_if: { alone: true }
        result: "{ผู้ใหญ่}ที่มารอหน้าโรงเรียนได้แต่ฝากถุงขนมไว้กับป้อมยาม ขนมถึงมือตอนค่ำ ยังอุ่นอยู่"
        fx: { relations: 1 }
      - label: "ฝากบอกที่บ้านว่าไม่ได้กลับ"
        show_if: { alone: true }
        result: "เขียนจดหมายบอกบ้านว่าเดือนนี้ไม่ได้กลับ ทั้งที่เดือนไหนก็ไม่ได้กลับอยู่แล้ว"
        fx: { relations: 1 }
      - label: "ช่วยเพื่อนที่แม่ป่วยขอลาพิเศษ"
        result: "{ชื่อ}พาเพื่อนไปยืนหน้าห้องนายทหารปกครองด้วยกัน เพื่อนได้กลับคนเดียว รุ่นพี่บางคนว่า {ชื่อ}ยุ่งไม่เข้าเรื่อง"
        fx: { network: -1 }
        merit: { help_others: 1 }
      - label: "ตามหาคนทำผิด"
        outcomes:
          - weight: a
            result: "ตามจนเจอว่าเป็นคนในกองข้าง ๆ เขายอมไปรับเอง ทั้งรุ่นได้ออกบ่ายวันอาทิตย์ เหลือเวลาอยู่บ้านไม่กี่ชั่วโมง"
            fx: { relations: 1 }
          - weight: b
            result: "ตามไปตามมาจนทะเลาะกันทั้งห้อง สุดท้ายไม่มีใครรู้ว่าใคร และไม่มีใครคุยกับใครจนเช้า"
            fx: { relations: -1, happiness: -1 }
      - label: "ใช้วันว่างอ่านหนังสือ"
        result: "ทั้งโรงนอนเงียบผิดปกติ {ชื่อ}อ่านเคมีไปได้สามบท ต้อมนอนแต่งเพลงอยู่เตียงข้าง ๆ"
        fx: { knowledge: 1 }
    # ขุดแหวน (ราวเดือนที่ห้า) · ทางลอดเร็ว เจ้าของเคาะ 2026-11-11 ลดสุขภาพ ผลแรก −1 เหลือ 0 ผลสอง −2 เหลือ −1
    SB-28a:
      title: "ขุดแหวน"
      text: "รุ่นพี่ปีสองประกาศขุดแหวน สี่วันห้าคืน กลางวันเรียนตามปกติ กลางคืนไม่ได้นอน คืนสุดท้ายมีท่อปูนเรียงยาวกลางสนาม ทุกคนต้องลอดให้ครบทั้งแถวก่อนฟ้าสาง ข้างในมืดและแคบจนไหล่ถูผนังทั้งสองข้าง"
      options:
      - label: "ลอดให้เร็วที่สุด"
        outcomes:
          - weight: a
            result: "ออกปลายท่อเป็นคนแรก ๆ ศอกถลอกทั้งสองข้าง รุ่นพี่ดูนาฬิกาแล้วพยักหน้า"
            fx: { network: 1 }
          - weight: b
            result: "ไหล่ติดตรงรอยต่อท่อ ดึงตัวออกมาได้แต่หนังถลอกยาวจนต้องไปห้องพยาบาล รอยแผลเป็นอยู่ไปอีกหลายปี"
            fx: { health: -1 }
      - label: "ลอดตามหลังดุ่ย คอยดันให้"
        result: "ดุ่ยตัวใหญ่ติดกลางท่อ {ชื่อ}ดันจากข้างหลังจนดุ่ยหลุดออกไป ทั้งคู่ออกมาพร้อมโคลนเต็มตัว ดุ่ยบอกว่าข้างในไม่มีผี มีแต่แมลงสาบ"
        fx: { relations: 2 }
      - label: "บอกรุ่นพี่ว่ากลัวที่แคบ"
        result: "รุ่นพี่มองอยู่นาน แล้วให้ไปรอนับเพื่อนที่ปลายท่อ ไม่มีใครว่าอะไรต่อหน้า แต่แหวนวงนั้นสวมแล้วรู้สึกหนักกว่าของคนอื่น"
        fx: { happiness: -1, network: -1 }
      - label: "ร้องเพลงสูตรเคมีในท่อ"
        result: "เสียงก้องในท่อจนทั้งแถวร้องตาม ต้อมนำ แบงก์ร้องผิดคีย์ รุ่นพี่ที่ปลายท่อได้ยินเพลงลูกทุ่งดังออกมาจากในท่อ"
        fx: { happiness: 1, relations: 1 }
    SB-28b:
      title: "วันสวมแหวน"
      text: "วันสวมแหวน ทั้งรุ่นใส่ชุดพิเศษ เสื้อน้ำเงิน กางเกงขาว หมวกขาว รุ่นพี่ปีสองสวมแหวนรุ่นให้ทีละคน 'ตั้งแต่วันนี้ เป็นนักเรียนเตรียมทหารเต็มตัว' {ชื่อ}หมุนแหวนบนนิ้วดู มันพอดีกว่าที่คิด"
      options:
      - label: "ยกมือไหว้รุ่นพี่ที่สวมให้"
        result: "รุ่นพี่รับไหว้แล้วยกมือตัวเองให้ดูแหวนวงเดียวกัน ต่างกันแค่เลขรุ่น"
        fx: { network: 1 }
      - label: "เอาแหวนชนกับของเพื่อนทั้งกอง"
        result: "ต้อม แบงก์ ดุ่ย ยื่นกำปั้นมาชนพร้อมกัน เสียงแหวนกระทบกันดังกริ๊ก ทั้งกองหัวเราะทั้งที่ยังยืนตรงอยู่"
        fx: { relations: 1, happiness: 1 }
      - label: "นึกถึงเพื่อนที่ออกไปก่อน"
        result: "สองคนที่ลาออกตั้งแต่สัปดาห์ที่สองไม่ได้อยู่ในแถว {ชื่อ}นับนิ้วมือที่สวมแหวนในกอง ขาดไปสองนิ้ว"
        fx: { happiness: -1, relations: 1 }
      - label: "ส่งข่าวให้ที่บ้านรู้"
        result: "เล่าให้{ผู้ใหญ่}ฟังว่าวันนี้ได้แหวน {ผู้ใหญ่}ถามว่าแหวนอะไร {ชื่อ}อธิบายอยู่นาน สุดท้ายบอกแค่ว่าแหวนที่ทำให้เป็นนักเรียนเตรียมทหารจริง ๆ"
        fx: { relations: 1 }
    # ภาคเรียน 2 · ทางอ่านหลังไฟดับ เจ้าของเคาะ 2026-11-11 ลดสุขภาพ −1 เหลือ 0
    SB-14:
      title: "ใต้เส้นแดง"
      text: "ประกาศคะแนนกลางภาคติดหน้าห้อง ชื่อ {ชื่อ} อยู่ใต้เส้นแดง นายทหารปกครองบอกว่าถ้าปลายภาคยังต่ำแบบนี้ต้องเรียนซ้ำชั้น ซ้ำเกินสองปีก็ต้องออก"
      options:
      - label: "อ่านหลังไฟดับด้วยไฟฉาย"
        result: "อ่านใต้ผ้าห่มด้วยไฟฉายทุกคืน ปลายภาคชื่อขึ้นมาเหนือเส้นแดงสองบรรทัด ตาลึกไปสองชั้น"
        fx: { knowledge: 1 }
      - label: "ขอให้ต้อมช่วยติว"
        result: "ต้อมแปลงเคมีทั้งบทเป็นเพลงลูกทุ่งให้ ปลายภาค {ชื่อ}เผลอฮัมในห้องสอบจนกรรมการคุมสอบหันมามอง"
        fx: { knowledge: 1, relations: 1 }
      - label: "ถามอาจารย์ว่าพลาดตรงไหน"
        result: "อาจารย์วงข้อที่ผิดซ้ำกันสามครั้ง เป็นเรื่องเดียวกันหมด แก้จุดเดียว คะแนนขึ้นทั้งแผ่น"
        fx: { knowledge: 1, network: 1 }
      - label: "ทำใจ ปลายภาคค่อยว่ากัน"
        result: "ปลายภาคชื่อขยับขึ้นมาอยู่บนเส้นพอดี ไม่มีใครรู้ว่าทำได้ยังไง รวมทั้ง {ชื่อ}"
        fx: { happiness: 1 }
    # คนที่เคยชี้ว่าเป็นดุ่ยในฉากใครตด ดุ่ยไม่ยอมมานอนเตียงติด (เจ้าของเคาะ 2026-11-11 ได้ความสุข −1)
    SB-15:
      title: "คืนที่ผีร้องเพลง"
      text: "กลางดึก แบงก์ละเมอขานรับ 'ครับ! พร้อมครับ!' ต้อมครึ่งหลับได้ยินเลยร้องตอบเป็นเพลงสูตรเคมี 'โซเดียมคลอไรด์ จ๋า…' ดุ่ยสะดุ้งตื่นกลางความมืด 'มันร้องเพลงแล้ว! ผีมันร้องเพลงแล้ว!' แล้วลุกขึ้นมองหาที่หลบ"
      options:
      - label: "ร้องท่อนต่อไปกับต้อม"
        result: "{ชื่อ}ร้องท่อนต่อไปให้ ต้อมร้องรับ สองคนร้องจนจบตารางธาตุแถวแรก เช้ามาจำสูตรได้แม่นกว่าที่อ่านมาทั้งสัปดาห์"
        fx: { knowledge: 1 }
        setFlags: [cadet_odd_squad]
      - label: "สั่งแบงก์ว่า 'พัก!'"
        result: "'พัก!' แบงก์ล้มตัวลงนอนต่อทันทีโดยไม่ลืมตา ทั้งห้องหัวเราะจนดุ่ยหยุดสั่น"
        fx: { happiness: 1 }
        setFlags: [cadet_odd_squad]
      - label: "เลื่อนเตียงไปติดเตียงดุ่ย"
        hide_if: { flagsHas: [cadet_blamed_dui] }
        result: "{ชื่อ}เลื่อนเตียงไปติดเตียงดุ่ย ดุ่ยหลับได้ในห้านาที กรนดังกว่าเพลงของต้อม"
        fx: { relations: 1 }
        setFlags: [cadet_odd_squad]
      - label: "เลื่อนเตียงไปติดเตียงดุ่ย"
        show_if: { flagsHas: [cadet_blamed_dui] }
        result: "เลื่อนเตียงไปรอแล้ว แต่ดุ่ยไม่ยอมมา วิ่งไปนั่งเฝ้าป้อมเวรยามแทน เช้ามาเวรยามเล่าว่ามีคนตัวใหญ่นั่งตัวสั่นข้างป้อมทั้งคืน"
        fx: { happiness: -1 }
        setFlags: [cadet_odd_squad]
      - label: "เปิดไฟฉายส่องให้ดูว่าไม่มีผี"
        result: "ส่องไฟฉายทั่วห้อง ไม่มีผี มีแต่แบงก์ยืนตรงหลับตาขานรับ ต้อมยังร้องต่อ ดุ่ยเห็นแล้วยิ่งกลัวกว่าเดิม"
        fx: { happiness: 1 }
        setFlags: [cadet_odd_squad]
  lastScene:           # ฉากสุดท้ายก่อนตายระหว่างฝึก (ปี 2 ลงชุดถัดไป)
    SB-07: "นับครั้งในใจได้ถึงร้อยกว่า แล้วเสียงนับของรุ่นพี่ก็ไกลออกไปเรื่อย ๆ พื้นปูนเย็นกว่าที่คิด"
