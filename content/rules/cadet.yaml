    # ฉากใครตด แบ่งเป็นสองการ์ด การ์ดแรกไม่มีตัวเลือก กดต่อแล้วไปการ์ดสอง
    SB-N8a:
      title: "ใครตด"
      text: "เช้าแรกที่ลานรวมแถว จู่ ๆ ก็มีเสียงปู้ดดังกลางแถว ครูฝึกตะโกน 'ใครตด!' แล้วเดินไล่ดมทีละแถว หยุดจ้องหน้าทีละคน 'ยกมือรับซะ ไม่งั้นซ่อมทั้งกองยันค่ำ นับสิบ… เก้า… แปด…' ไม่มีใครขยับ เหงื่อไหลลงคอกันทั้งแถว ดุ่ยหน้าซีด '…สาม… สอง…'"
