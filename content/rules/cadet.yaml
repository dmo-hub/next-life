  # ยุค ก: หนังสือพิมพ์ลงรายชื่อ เป็นทางดูผลที่ 5 ทุกรอบประกาศ (Q5 · บท S1 g-32 2026-11-06)
  paper:
    head: กางหนังสือพิมพ์บนโต๊ะร้านกาแฟ ไล่หาชื่อ {ชื่อ}
    morning:
      label: ซื้อหนังสือพิมพ์ฉบับเช้ามาไล่หา
      result: หนังสือพิมพ์ฉบับเช้าลงรายชื่อเต็มหนึ่งหน้า ตัวหนังสือเล็กจนต้องเอานิ้วไล่ทีละบรรทัด
    afternoon:
      label: ซื้อหนังสือพิมพ์ฉบับบ่ายมาไล่หา
      result: หนังสือพิมพ์ฉบับบ่ายเพิ่งมาส่งที่แผง หมึกยังเปื้อนนิ้ว หน้ารายชื่ออยู่ข้างในสุด
    lines:
      none: ไล่จนสุดหน้า แล้วพลิกกลับมาไล่ใหม่อีกรอบ ชื่อนั้นไม่อยู่ในหนังสือพิมพ์
      some: เจอชื่อตัวเองในคอลัมน์ของบางเหล่า อีกคอลัมน์ไล่จนสุดก็ไม่เจอ   # ใช้เฉพาะรอบข้อเขียน (รอบอื่นว่างตาม Demo)
      all: ชื่อ {ชื่อ} อยู่ในทุกคอลัมน์ที่ไล่หา ต้องอ่านซ้ำว่าไม่ได้ตาฝาด
    cheer: ร้านกาแฟในตลาดตัดหน้าหนังสือพิมพ์ที่มีชื่อ {ชื่อ} ไปติดไว้ข้างตู้น้ำแข็ง   # ออกครั้งเดียวต่อปี ที่บ้านรู้เท่านั้น
    # Q-N1 (เจ้าของ 2026-11-06): แอบสอบ + ยุคหนังสือพิมพ์ + ผ่านข้อเขียน → ป้าข้างบ้านถือหนังสือพิมพ์มาเคาะประตู ที่บ้านรู้ทันที
    reveal: ป้าข้างบ้านถือหนังสือพิมพ์มาเคาะประตู ถามว่าชื่อในนี้ใช่ {ชื่อ} บ้านเราหรือเปล่า
    revealHome: "{บ้าน}รับหนังสือพิมพ์มาอ่านอยู่นาน แล้วหันมามอง {ชื่อ} โดยยังไม่พูดอะไร"
    revealHomeWord: { both: แม่, mother: แม่, fatherOnly: พ่อ, none: ผู้ใหญ่ที่ดูแล }
    rehearsedUsed: " ประโยคที่ซ้อมกับกระจกไว้ ได้ใช้เร็วกว่าที่คิด"
  # ---------- X2w · วันว่างก่อนประกาศ (§7.1) ----------
  wait:
    title: วันว่างก่อนประกาศผล
    open: สนามสุดท้ายจบไปเมื่อวาน ผลทุกสนามจะออกพร้อมกันพรุ่งนี้
    farBeforeWeb: นั่งรถกลับถึงบ้านเมื่อคืน พรุ่งนี้ต้องตื่นตีสี่ นั่งรถกลับไปดูป้ายอีกรอบ
    farWeb: นั่งรถกลับถึงบ้านเมื่อคืน ผลขึ้นเว็บ ไม่ต้องนั่งรถกลับไปดูถึงสนาม
    near: ได้นอนบนที่นอนของตัวเองเป็นคืนแรกในรอบหลายวัน
    famLine:
      mother: แม่ตักข้าวให้เพิ่มอีกทัพพี ไม่ถามเรื่องสอบสักคำ
      fatherOnly: พ่อเปิดวิทยุเสียงดังกว่าปกติ เหมือนไม่อยากให้บ้านเงียบ
      both: พ่อกับแม่คุยกันเบา ๆ ในครัว เงียบลงทุกครั้งที่ {ชื่อ} เดินผ่าน
      none: ผู้ใหญ่ที่ดูแลวางเงินค่ารถพรุ่งนี้ไว้บนโต๊ะ ไม่พูดอะไร
    # ทายาท (ที่บ้านรู้): แทน famLine · ใครเดินผ่านห้องตาม heirCase (พ่อ | แม่ | พ่อที่เสียแล้ว)
    heirLines:
      - when: { heir: army }
