      - label: "ไม่หันกลับไปมองรั้ว"
        result: "รู้ว่าถ้าหันไปจะเดินต่อไม่ไหว เลยมองแต่ท้ายทอยของคนข้างหน้า จนแถวเลี้ยวพ้นตึก"
