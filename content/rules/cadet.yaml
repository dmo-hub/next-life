      - label: "ทวนระเบียบที่ได้มาวันนี้"
        result: "ห้ามเดิน ต้องวิ่ง ขานรับให้ดัง พับผ้าห่มให้เหลี่ยม ทวนไม่ถึงข้อสี่ เตียงท้ายห้องก็ละเมอขานรับขึ้นมา 'ครับ! พร้อมครับ!' ทั้งโรงนอนสะดุ้งพร้อมกัน"
