      text: "ไฟดับตอนสี่ทุ่มตรง เตียงเหล็กเรียงสองแถวยาวสุดโรงนอน เด็กหัวเกรียนสี่สิบคนที่ไม่รู้จักกันนอนนิ่งเหมือนกลัวเตียงจะส่งเสียง เตียงข้าง ๆ เป็นเด็กตัวใหญ่ที่สุดในโรงนอน มีเสียงสะอื้นเบา ๆ ดังมาจากใต้ผ้าห่มของเขา"
