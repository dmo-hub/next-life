  # ---------- ฉากดีใจ (cadet-voice-joy-pass.md ข้อ 3 · Q-L2) ----------
  joy:
    written:
      # S3 (g-b7 2026-11-10): ก่อน mobile_year หรือบ้านลำบาก พ่อไม่มีโทรศัพท์โทรหาเพื่อนที่ทำงาน → bothNoPhone
      bothNoPhone: แม่ร้องลั่นบ้านจนหมาข้างบ้านเห่า "ลูกแม่เก่งที่สุดเลย!" พ่อทำเป็นนิ่ง บอกว่า "อย่าเพิ่งเหลิงนะ{ถิ่น} ยังเหลืออีกสองรอบ" แต่เย็นนั้นแอบปั่นจักรยานไปบอกเพื่อนบ้านสามหลัง
      both: แม่ร้องลั่นบ้านจนหมาข้างบ้านเห่า "ลูกแม่เก่งที่สุดเลย!" พ่อทำเป็นนิ่ง บอกว่า "อย่าเพิ่งเหลิงนะ{ถิ่น} ยังเหลืออีกสองรอบ" แต่เย็นนั้นแอบโทรบอกเพื่อนที่ทำงานไปสามสาย
      mother: แม่วิ่งมากอดทั้งที่มือยังเปียกน้ำล้างจาน "ติดแล้วเหรอลูก ติดจริง ๆ ใช่มั้ย" ถามซ้ำอยู่สามรอบ เย็นนั้นมีไข่พะโล้หม้อใหญ่
      fatherOnly: พ่อยืนอ่านใบผลอยู่นาน แล้วตบโต๊ะดังปัง "ลูกพ่อ!" คืนนั้นพ่อหิ้วไก่ย่างกลับมาทั้งตัว ถามว่า "วิ่งไหวมั้ย พรุ่งนี้พ่อตื่นไปจับเวลาให้{ถิ่น}"
      none: ป้าถือใบผลเดินไปให้ทั้งซอยดู "หลานฉันเอง ติดข้อเขียนเตรียมทหาร{ถิ่น}" กลับมาพร้อมขนมเต็มมือ
    iv:
      both: แม่โทรบอกญาติทีละคน "ผ่านพละแล้ว เหลือสัมภาษณ์อย่างเดียว" พ่อหายไปตลาดแป๊บเดียว กลับมาพร้อมเสื้อเชิ้ตขาวตัวใหม่ "ไปสัมภาษณ์ต้องดูดี{ถิ่น}"
