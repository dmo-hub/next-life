          text: "เซ็นชื่อเสร็จ รุ่นพี่ปีสองพาเข้าแถวหน้าตึก ช่างไถผมที่เกรียนอยู่แล้วให้เกรียนลงไปอีก แล้วเสียงขานก็ดังขึ้น 'นรม.{ชื่อเต็ม}!' เป็นครั้งแรกที่มีคนเรียกแบบนี้ ที่รั้วข้างนอกมีแต่พ่อแม่ของคนอื่น รุ่นพี่บอกว่าเหลือเวลาอีกหนึ่งนาที"
      options:
