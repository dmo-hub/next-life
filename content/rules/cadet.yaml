        tail: "ทั้งกองที่ค้างท่ายึดพื้นหันมามองหน้ากัน เย็นนั้นเพื่อนแบ่งไข่พะโล้ให้ {ชื่อ} คนละครึ่งซีก"
        fx: { relations: 1, network: 1 }
        setFlags: [cadet_took_blame]
      - label: "ยืนนิ่ง ไม่ยอมรับ"
        result: "ไม่มีใครก้าวออกไป จ่าขมเดินมาหยุดหน้า {ชื่อ} 'เอ็งไม่ใช่' แต่ก็สั่งยึดพื้นทั้งกองรวมทั้ง {ชื่อ} ด้วย ครูฝึกเดินเข้าไปถาม 'จ่ารู้ได้ยังไงว่ามันไม่ได้ตด' จ่าขมไม่ตอบ หันหลัง… ปู้ด แล้วเดินจากไป แบงก์หลุดขำ เลยโดนเพิ่มอีกสิบครั้งอยู่คนเดียว"
        fx: { health: 1, happiness: 1 }
      - label: "ชี้ว่าเป็นดุ่ย"
        result: "จ่าขมเดินไปยืนข้างดุ่ย 'ไม่ใช่มัน ตัวใหญ่แต่ใจเล็ก มันไม่กล้าหรอก' แล้วสั่งยึดพื้นทั้งกอง เว้นดุ่ยไว้คนเดียว ครูฝึกถาม 'จ่ารู้ได้ยังไงว่ามันไม่ได้ตด' จ่าขมไม่ตอบ หันหลัง… ปู้ด แล้วเดินจากไป ดุ่ยหันมามอง {ชื่อ} นานกว่าใคร"
        tail: "คืนนั้นดุ่ยกลัวผีจนตัวสั่น แต่ไม่ยอมมาขอนอนเตียงติด{ชื่อ}"
        fx: { relations: -2, happiness: -1 }
        setFlags: [cadet_blamed_dui]
      - label: "รายงานว่าเสียงมาจากข้างหลังแถว"
        result: "'รายงานครับ เสียงมาจากข้างหลังแถวครับ' ข้างหลังแถวมีแค่ต้นไม้กับจ่าขม จ่าขมนิ่งไปสามวินาที 'พัก! วันนี้ลมแรง' แล้วหันหลัง… ปู้ด ก่อนเดินกลับไปใต้ต้นไม้ ทั้งกองกลั้นหัวเราะจนตัวสั่น ตั้งแต่วันนั้นเพื่อนเรียก {ชื่อ} ว่าคนกล้า"
        fx: { relations: 2 }
        setFlags: [cadet_called_it]
