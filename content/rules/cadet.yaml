dayIntro:
  first: สองชั่วโมงแรกเป็นเลข วิทย์ อังกฤษ {ชื่อ} ทำไปเท่าที่อ่านมา ชุดสุดท้ายในซองเป็นแบบวัดความพร้อมห้าข้อ ทุกข้อเป็นเหตุการณ์ที่ต้องเลือกทันที
  later: วิชาการผ่านไปอีกชุด เหลือแบบวัดความพร้อมของสนามนี้
  dayLabel: "วันที่{n} · "
  contextLines:
    - when:
        flagsHas:
          - cadet_retry
      line: ห้องเดิม กลิ่นเดิม แต่มือไม่สั่นเท่าปีก่อน
    - when:
        flagsHas:
          - cadet_prep_group
        rival: A
      line: เพื่อนห้องสามนั่งห่างไปสามแถว ไม่หันมาเลยสักครั้ง
  screenTitle: สนามสอบเตรียมทหาร · ชุด {เหล่า} · ข้อ {i} / 5
  passRule:
    quizMin: 13
    knowledgeMin: 50
dayHeader:
  army: สนาม ทบ. · หอประชุมใหญ่ โต๊ะเรียงเป็นร้อยแถว
  navy: สนาม ทร. · ตึกเรียนวันอาทิตย์ แอร์เย็นจนมือชา
  airforce: สนาม ทอ. · หน้าต่างห้องสอบมองเห็นรันเวย์
  police: สนาม ตร. · โรงยิมใหญ่ คนคุมสอบใส่ชุดสีกากี
