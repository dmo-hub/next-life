# ทะเบียนไอเทมติดตัวโลกหลัก — ของทุกชิ้นที่ effects.loot อ้างได้ต้องอยู่ที่นี่ (ด่าน loot-shape)
# ได้ของแล้วลงช่องสวมใส่ชนิดตรงถ้าว่าง ไม่งั้นเข้าเป้ · เป้เต็มขายอัตโนมัติได้เงิน sell · ชิ้นละครั้งต่อชีวิต
# text = ประโยคที่ผู้เล่นเห็นตอนได้ของ (แกนต่อท้ายด้วยชื่อของ + ช่องที่ลง)
slots:
  charm: เครื่องราง
  weapon: อาวุธ
  outfit: เครื่องแต่งกาย
cap: 6
items:
  # ห้องบอส (นักล่าล้มบอสได้) — ลำดับในลิสต์ loot ของการ์ด = ลำดับที่ได้
  dg_takrut:
    name: ตะกรุดผลึกม่วง
    slot: charm
    sell: {unit: income_x, amount: 1}
    text: "ช่างในกิลด์ม้วนแผ่นผลึกม่วงจากห้องบอสเป็นตะกรุดให้ ห้อยคอแล้วอุ่นวาบเหมือนมีอะไรเต้นอยู่ข้างใน"
  dg_knife:
    name: มีดเดินป่าคมผลึก
    slot: weapon
    sell: {unit: income_x, amount: 1}
    text: "คมผลึกที่แกะจากเขาบอสถูกเข้าด้ามไม้ ฟันกิ่งไม้ขาดในทีเดียวโดยไม่ต้องลับ"
  dg_vest:
    name: เสื้อกั๊กเกล็ดบอส
    slot: outfit
    sell: {unit: income_x, amount: 1}
    text: "เกล็ดที่ร่วงอยู่ในห้องบอสถูกเย็บซ้อนกันเป็นเสื้อกั๊ก ใส่แล้วหนักแต่มีดธรรมดาแทงไม่เข้า"
  dg_fang:
    name: เขี้ยวบอสเลี่ยมทอง
    slot: charm
    sell: {unit: income_x, amount: 1}
    text: "เขี้ยวที่หักคาพื้นห้องบอสถูกร้านทองหน้ากิลด์เลี่ยมขอบให้ คนในวงการเห็นก็รู้ว่าผ่านอะไรมา"
  # เป้ที่ทางออก (เอาของในเป้ไปเอง)
  dg_crossbow:
    name: หน้าไม้ของนักล่าที่ไม่ได้กลับ
    slot: weapon
    sell: {unit: income_x, amount: 0.5}
    text: "หน้าไม้ในเป้ยังขึ้นสายค้างไว้ ด้ามสลักชื่อคนที่ไม่ได้ออกจากเกต"
  dg_armband:
    name: ปลอกแขนกิลด์ขาดครึ่ง
    slot: outfit
    sell: {unit: income_x, amount: 0.5}
    text: "ปลอกแขนกิลด์ขาดไปครึ่งวง ยังอ่านเลขทะเบียนของเจ้าของเดิมออก"
