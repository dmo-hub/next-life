# คำใบ้ที่ศาลตอนเฉียดตาย (B153) — แกนเลือกระดับจากบัญชีสุทธิ (court.mjs NEAR_HINT_LEVELS) ไม่บอกยอด
# dark2 บาปหนัก · dark1 · even ใกล้เคียง · bright1 · bright2 บุญหนัก — ระดับละ ≥2 ข้อความ · ≤240 ตัว · ห้ามเลขคู่คำบุญ/บาป
dark2:
  - "เจ้าหน้าที่พลิกสมุดหน้าของคุณช้า ๆ หน้านั้นหนากว่าหน้าอื่นมาก เขาไม่พูดอะไร แค่ปิดสมุดแรงกว่าที่ควร"
  - "ตาชั่งที่มีชื่อคุณเอียงลงจนแตะพื้น มีคนในห้องหันมามองแล้วรีบหลบตา"
dark1:
  - "ในสมุดมีรอยขีดฆ่าหลายแห่ง เจ้าหน้าที่บอกว่ายังแก้ได้ ถ้าเริ่มตั้งแต่วันนี้"
  - "ตาชั่งเอียงไปข้างหนึ่งพอให้เห็น ไม่ถึงกับน่ากลัว แต่ก็ไม่อยากให้เอียงกว่านี้"
even:
  - "ตาชั่งแกว่งอยู่กลาง ๆ เหมือนยังตัดสินใจไม่ได้ เจ้าหน้าที่ยักไหล่ บอกว่าที่เหลือขึ้นอยู่กับปีข้างหน้า"
  - "สมุดหน้าของคุณมีทั้งรอยดำและรอยทองพอ ๆ กัน อ่านแล้วนึกไม่ออกว่าเป็นคนแบบไหน"
bright1:
  - "มุมสมุดหน้าของคุณมีรอยทองเล็ก ๆ เจ้าหน้าที่ยิ้มนิดหนึ่งตอนเปิดผ่าน"
  - "ตาชั่งเอียงขึ้นนิดเดียว เบาพอให้หายใจโล่ง แต่ยังไม่ใช่เหตุผลให้วางมือ"
bright2:
  - "พอเปิดหน้าของคุณ ห้องทั้งห้องสว่างขึ้นนิดหนึ่ง เจ้าหน้าที่บอกว่าไม่ค่อยเห็นหน้าแบบนี้บ่อย"
  - "ตาชั่งข้างที่มีชื่อคุณลอยสูงจนเกือบแตะเพดาน คนที่นั่งรอข้าง ๆ เอื้อมมือมาแตะไหล่เบา ๆ"
