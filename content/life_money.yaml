# การ์ดชีวิตผู้ใหญ่ชุด money (ใบ 241 จากร่าง 240)
# รอบแก้ตามข้อค้าน: ใส่ when.year ตามปี since ของแถวที่อ้าง (years คง [2500, 2650])
# ไม่ใช้ ticket: true เพราะ lint belief (ค) จำกัด ticket ไว้เฉพาะ lottery_numen ใน belief.yaml · ใบสลากจึงไม่มีผลถูกรางวัลเลย
# ธงหนี้ (in_debt/loan_shark) ไม่ใช้ตาม brief · ใบที่เคยสมมติว่ามีหนี้อยู่ก่อน เขียนใหม่ให้หนี้เกิดในใบเอง หรือย้ายผู้เล่นไปเป็นบุคคลที่สาม
events:
  - id: money_piggy_day_01
    type: A
    category: work_money
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [7, 12], year: [2562, 2650]}
    title: "กระปุกวันออมแห่งชาติ"
    text: "วันออมแห่งชาติ ผู้ใหญ่ในบ้านพาไปต่อคิวที่ธนาคารตั้งแต่เช้า ฝากครบห้าร้อยได้กระปุกที่ระลึกใบใหม่ ช่องหยอดแคบพอดีเหรียญสิบ เช้าวันรุ่งขึ้นเพื่อนทั้งห้องเริ่มอวดว่ากระปุกตัวเองหนักแค่ไหนแล้ว"
    choices:
      - id: drop_daily
        text: "หยอดเหรียญสิบทุกวันไม่เว้น"
        effects: {knowledge: 1, happiness: -1, money: {unit: fixed_baht, amount: 1500, ref_year: 2562}}
        merit: [{cat: neutral}]
      - id: half_snack
        text: "ค่าขนมครึ่งกิน ครึ่งหยอด"
        effects: {happiness: 1, money: {unit: fixed_baht, amount: 700, ref_year: 2562}}
        merit: [{cat: neutral}]
      - id: open_toy
        text: "ครบเดือนแคะออกซื้อของเล่น"
        effects: {happiness: 2}
        merit: [{cat: neutral}]
      - id: shake_nightly
        text: "เขย่าฟังเสียงทุกคืนก่อนนอน"
        outcomes:
          - {weight: 1, ok: true, text: "ฟังทุกคืนจนแยกออกว่าเหรียญห้ากับเหรียญสิบเสียงไม่เหมือนกัน ครูดนตรีชมว่าหูดีทั้งที่ไม่รู้ว่าฝึกมาจากไหน", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขย่าแรงจนจุกยางข้างใต้หลุด เหรียญกลิ้งเข้าใต้ตู้เย็นสามเหรียญ คืนนั้นนอนคว่ำเอาไม้บรรทัดเขี่ยจนหลับคาพื้น", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_class_share_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2545, 2650]
    weight: 0.0625
    when: {age: [14, 17]}
    title: "วงแชร์ค่าขนมหลังห้อง"
    text: "หัวหน้าห้องตั้งวงแชร์ค่าขนม สิบคน คนละยี่สิบบาททุกวันจันทร์ ใครอยากได้ก้อนก่อนต้องเขียนดอกลงกระดาษพับใส่กล่องดินสอ สัปดาห์นี้คนหนึ่งจะเอาเงินไปซื้อรองเท้าสตั๊ด อีกคนจะเอาไปเติมเกม"
    choices:
      - id: wait_last
        text: "รอรับก้อนท้ายสุด เก็บดอกเต็ม"
        effects: {knowledge: 1, happiness: -1, money: {unit: fixed_baht, amount: 60, ref_year: 2565}}
        merit: [{cat: neutral}]
      - id: bid_first
        text: "เขียนดอกสูง ขอก้อนแรก"
        effects: {happiness: 1, money: {unit: fixed_baht, amount: -40, ref_year: 2565}}
        merit: [{cat: neutral}]
      - id: stay_out
        text: "ไม่เข้าวง เก็บใส่กระเป๋าเอง"
        effects: {relations: -1}
        merit: [{cat: neutral}]
      - id: hold_box
        text: "ขอเป็นคนถือกล่องดินสอ"
        outcomes:
          - {weight: 1, ok: true, text: "จดบัญชีหลังสมุดคณิตจนครบวงไม่ขาดสักบาท ทั้งห้องเรียกคุณว่าเหรัญญิก ครูประจำชั้นยังมาขอดูวิธีจด", effects: {network: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กล่องดินสอหายในคาบพละ เจอใต้โต๊ะครูวันรุ่งขึ้น เงินครบทุกบาท แต่สามวันนั้นไม่มีใครยอมคุยกับคุณ", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_app_fee_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2560, 2650]
    weight: 0.0625
    when: {age: [21, 30], year: [2564, 2650]}
    title: "ยอดเข้าไม่เท่ายอดกู้"
    text: "อีกห้าวันเงินเดือนออก เงินในบัญชีเหลือสามร้อย โฆษณาในมือถือบอกกู้ได้ในห้านาทีไม่ต้องใช้เอกสาร กดขอสองพัน หน้าจอยืนยันบอกว่าจะได้รับพันสอง ที่เหลือเป็นค่าดำเนินการ ครบเจ็ดวันคืนเต็มสองพัน"
    choices:
      - id: take_it
        text: "กดยืนยัน รับพันสอง"
        outcomes:
          - {weight: 1, ok: true, text: "คืนตรงวันเงินเดือนออก จากนั้นแอปส่งข้อความชวนเพิ่มวงเงินสองเท่าทุกเช้าเจ็ดโมง", effects: {money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เงินเดือนเข้าช้าไปหนึ่งวัน ค่าปรับขึ้นบนหน้าจอเท่าค่ากับข้าวทั้งอาทิตย์", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_advance
        text: "ขอเบิกเงินเดือนล่วงหน้า"
        effects: {happiness: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: ask_cousin
        text: "ทักญาติขอยืมห้าร้อย"
        effects: {relations: -1}
        merit: [{cat: neutral}]
      - id: noodle_week
        text: "กินบะหมี่ซองห้าวันติด"
        outcomes:
          - {weight: 1, ok: true, text: "คิดสูตรได้ห้าแบบ ใส่ไข่ ใส่ผักบุ้ง ใส่น้ำพริกเผา โพสต์ลงกลุ่มคนทำงานแล้วมีคนแชร์ไปหลายร้อย", effects: {happiness: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วันที่สี่ท้องไส้เริ่มประท้วง ต้องแวะร้านขายยา เสียเงินมากกว่าค่าบะหมี่ทั้งห้าวัน", effects: {health: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_card_bill_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [23, 30], year: [2564, 2650]}
    title: "ใบแจ้งยอดหลังปีใหม่"
    text: "ปีใหม่รูดบัตรซื้อของขวัญจับฉลาก ตั๋วรถกลับบ้าน กับเสื้อสามตัวที่ลดราคาตอนตีหนึ่ง ใบแจ้งยอดบัตรมาถึงกลางเดือน ช่องจ่ายขั้นต่ำตัวเลขเล็กจนดูน่ารัก ส่วนช่องยอดเต็มตัวเลขยาวจนเกือบล้นกรอบ"
    choices:
      - id: pay_full
        text: "จ่ายเต็ม กินไข่เจียวทั้งเดือน"
        effects: {knowledge: 1, happiness: -1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: pay_min
        text: "จ่ายขั้นต่ำไปก่อน"
        outcomes:
          - {weight: 1, ok: true, text: "เดือนนี้หายใจคล่อง เดือนถัดมาได้ค่าคอมก้อนใหญ่ ปิดยอดได้ก่อนดอกพอกเกินค่าข้าวหนึ่งมื้อ", effects: {happiness: 1, money: {unit: income_x, amount: -0.32}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เดือนแรกโล่ง แต่สามเดือนผ่านไปยอดลดช้ากว่าที่คิด ดอกที่คิดรายวันกินไปทุกรอบ", effects: {happiness: 1, money: {unit: income_x, amount: -0.38}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: split_ten
        text: "โทรขอแบ่งจ่ายสิบงวด"
        effects: {happiness: -1, money: {unit: income_x, amount: -0.35}}
        merit: [{cat: neutral}]
      - id: return_shirts
        text: "หอบเสื้อสามตัวไปขอคืนร้าน"
        outcomes:
          - {weight: 1, ok: true, text: "ป้ายยังไม่แกะ ร้านยอมคืนเงินเข้าบัตร ยอดในใบแจ้งหนี้รอบหน้าหายไปหนึ่งบรรทัด", effects: {happiness: 1, money: {unit: income_x, amount: -0.25}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พนักงานชี้ป้ายเล็กใต้เคาน์เตอร์ สินค้าลดราคาไม่รับคืน คุณใส่เสื้อตัวหนึ่งกลับบ้านเลยเพราะเหงื่อออก", effects: {happiness: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_washer_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [25, 30], year: [2569, 2650]}
    title: "เครื่องซักผ้าหยุดกลางเดือน"
    text: "เครื่องซักผ้าหยุดหมุนทั้งที่น้ำยังเต็มถัง ในนั้นมีชุดทำงานสี่ชุด ร้านเครื่องใช้ไฟฟ้าบอกรูดบัตรผ่อนศูนย์เปอร์เซ็นต์สิบงวดได้ทันที แต่วงเงินบัตรจะถูกกันไว้เต็มราคา กลุ่มซื้อขายของคนในหอมีมือสองลงขายเมื่อเช้า"
    choices:
      - id: zero_pct
        text: "รูดบัตรผ่อนสิบงวด"
        outcomes:
          - {weight: 1, ok: true, text: "เครื่องใหม่มาส่งถึงห้องวันรุ่งขึ้น สิบเดือนนั้นไม่มีเรื่องต้องรูดบัตรอีกเลย", effects: {happiness: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เดือนถัดมาฟันกรามปวดจนต้องถอน ยื่นบัตรที่คลินิกแล้ววงเงินไม่พอ ต้องวิ่งไปกดเงินสดแบบเสียค่าธรรมเนียม", effects: {happiness: -1, money: {unit: income_x, amount: -0.18}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: used_one
        text: "ไปดูเครื่องมือสองในกลุ่มหอ"
        outcomes:
          - {weight: 1, ok: true, text: "เจ้าของเก่าย้ายไปทำงานต่างประเทศ เครื่องยังใหม่ แถมตะกร้าผ้ากับไม้แขวนอีกหนึ่งมัด", effects: {happiness: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ใช้ได้สองอาทิตย์ เสียงปั่นดังเหมือนเครื่องบินขึ้น ห้องข้าง ๆ มาเคาะประตูตอนสามทุ่ม", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hand_wash
        text: "ซักมือไปก่อนจนสิ้นเดือน"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: fix_self
        text: "เปิดฝาหลังซ่อมเองตามคลิป"
        outcomes:
          - {weight: 1, ok: true, text: "เจอถุงเท้าข้างหนึ่งพันใบพัดอยู่ ดึงออกแล้วเครื่องหมุนต่อทันที ลงทุนไปแค่ไขควงหนึ่งด้าม", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ประกอบคืนแล้วเหลือน็อตสามตัวที่ไม่รู้มาจากตรงไหน สุดท้ายต้องจ้างช่างมาประกอบให้ใหม่", effects: {happiness: -1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_tv_zero_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2545, 2650]
    weight: 0.0625
    when: {age: [31, 45], year: [2562, 2650]}
    title: "ทีวีจอใหญ่ผ่อนศูนย์"
    text: "ห้างลดราคากลางปี ทีวีจอใหญ่เท่าประตูห้องน้ำ ป้ายบอกผ่อนศูนย์เปอร์เซ็นต์สิบงวด เซลส์ยื่นใบสมัครพร้อมปากกา ในสมุดรายจ่ายยังมีค่างวดรถ ค่างวดมือถือ กับค่าผ่อนแอร์ที่เพิ่งเริ่มเมื่อเดือนก่อน"
    choices:
      - id: sign_now
        text: "เซ็นเลย ฟุตบอลโลกใกล้แล้ว"
        outcomes:
          - {weight: 1, ok: true, text: "ทันดูนัดเปิดสนามพอดี ค่างวดทุกก้อนตัดเงินเดือนลงตัวไม่ขาดไม่เกิน", effects: {happiness: 2, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ค่างวดสี่ก้อนตัดชนกันวันเดียว เงินเดือนไม่พอถึงสิ้นเดือน ต้องดูบอลจอใหญ่คู่กับบะหมี่ถ้วย", effects: {happiness: -1, money: {unit: income_x, amount: -0.18}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: count_first
        text: "กลับไปนับค่างวดก่อนตัดสิน"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: smaller_cash
        text: "เอาจอเล็กลงหนึ่งขนาด จ่ายสด"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.08}}
        merit: [{cat: neutral}]
      - id: measure_wall
        text: "ขอยืมตลับเมตรกลับไปวัดผนัง"
        outcomes:
          - {weight: 1, ok: true, text: "ผนังยาวพอดีเป๊ะ กลับมาเซ็นวันรุ่งขึ้น เซลส์ขำจนแถมขาแขวนให้ฟรี", effects: {happiness: 2, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลืมวัดรวมขอบ ทีวีมาถึงยาวกว่าผนังสองคืบ ตู้เสื้อผ้าต้องย้ายไปยืนหน้าห้องน้ำแทน", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: money_app_contacts_01
    type: A
    category: society
    stage: ทำงาน
    years: [2560, 2650]
    weight: 0.0625
    when: {age: [31, 45], year: [2564, 2650]}
    title: "สายตามหนี้ที่ไม่ใช่ของคุณ"
    text: "เบอร์แปลกโทรเข้ามือถือคุณตั้งแต่แปดโมง ถามหาเพื่อนร่วมแผนกด้วยเสียงไม่สุภาพ ว่าค้างค่างวดแอปเงินกู้ เบอร์คุณติดไปกับรายชื่อในเครื่องเขาตอนกดอนุญาตแอป พักเที่ยงสายที่สองก็มา ส่วนเขานั่งก้มหน้าอยู่โต๊ะข้าง ๆ"
    choices:
      - id: talk_friend
        text: "ชวนเพื่อนไปคุยกันตามลำพัง"
        outcomes:
          - {weight: 1, ok: true, text: "เขาเล่าว่ากู้มาจ่ายค่าโรงพยาบาลคนที่บ้าน คุณช่วยไล่ยอดจริงจนรู้ว่าเหลือเท่าไร คืนนั้นเขาส่งข้อความขอบคุณมายาวเหยียด", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาขอโทษซ้ำจนคุยต่อไม่ได้ สัปดาห์นั้นเขาเลี่ยงไปกินข้าวคนเดียวทุกวัน", effects: {relations: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: block_it
        text: "บล็อกเบอร์ ไม่ยุ่งเรื่องคนอื่น"
        outcomes:
          - {weight: 1, ok: true, text: "บล็อกไปสองเบอร์ สายก็เงียบ คุณกลับไปทำงานต่อได้ทั้งบ่าย", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บล็อกเบอร์หนึ่ง อีกเบอร์โผล่มาแทนทุกวัน จนคุณไม่กล้ารับสายแปลกแม้แต่ของบุรุษไปรษณีย์", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: file_complaint
