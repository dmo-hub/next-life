# การ์ดวัฒนธรรมไทยชุด legend (ใบ 216 จากร่าง 213)
events:
  - id: legend_ribbon_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [5, 8]}
    title: "บอลหยุดใต้ผ้าสามสี"
    text: "ต้นตะเคียนใหญ่ปากซอยผูกผ้าสามสีไว้รอบโคน ผู้ใหญ่เล่าว่ามีนางไม้อยู่ อย่าไปเล่นแถวนั้น บอลของคุณกลิ้งไปหยุดตรงโคน เพื่อนทุกคนถอยหลังพร้อมกันหนึ่งก้าว"
    choices:
      - id: wai_first
        text: "ยกมือไหว้ก่อนค่อยเก็บ"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: grab_run
        text: "วิ่งไปคว้าแล้ววิ่งกลับ"
        outcomes:
          - {weight: 2, ok: true, text: "เก็บได้ เพื่อนยกให้เป็นคนกล้าไปจนถึงมื้อเย็น", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สะดุดรากไม้ เข่าถลอก ผู้ใหญ่ว่านางไม้เตือน ส่วนรากก็อยู่ตรงนั้นมาร้อยปีแล้ว", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: call_adult
        text: "เรียกผู้ใหญ่มาเก็บให้"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: tie_ball
        text: "เก็บเศษผ้ามาผูกบอลบ้าง"
        outcomes:
          - {weight: 1, ok: true, text: "บอลมีผ้าสามสี เพื่อนไม่กล้าเตะแรงอีกเลย คุณชนะทุกเกมไปหนึ่งสัปดาห์", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ป้าร้านชำเห็นเข้า ได้ยืนฟังเรื่องมารยาทกับต้นไม้ครึ่งชั่วโมง", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_shrine_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [6, 10], region: [กรุงเทพฯ และปริมณฑล, กลาง, ตะวันออก, ตะวันตก, ตะวันออกเฉียงเหนือ, ใต้]}
    title: "น้ำแดงบนศาล"
    text: "ศาลพระภูมิที่ตั้งไว้ตอนปลูกบ้านมีน้ำแดงวางอยู่ตั้งแต่เช้า บ่ายนี้แดดร้อนจัด ผู้ใหญ่ในบ้านหลับกันหมด เหลือแค่คุณกับขวดที่เหงื่อเกาะอยู่"
    choices:
      - id: one_sip
        text: "จิบแค่อึกเดียว"
        outcomes:
          - {weight: 1, ok: true, text: "หวานจัด ไม่มีใครรู้ ยกเว้นระดับน้ำในขวด", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "น้ำอุ่นและมีมดลอยสองตัว ปวดท้องถึงเย็น ผู้ใหญ่คนหนึ่งว่าพระภูมิ อีกคนว่ามด", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_ask
        text: "รอผู้ใหญ่เก็บของไหว้แล้วขอกิน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: wai_sorry
        text: "ยกมือขอโทษที่คิดไม่ดี"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: top_up
        text: "ดื่มครึ่งแล้วเติมน้ำเปล่า"
        outcomes:
          - {weight: 1, ok: true, text: "สีจางลงนิดเดียว ผู้ใหญ่ว่าน้ำแดงยี่ห้อนี้จืดลงทุกปี", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "สีจางเหมือนน้ำล้างแก้ว ถูกจับได้ตั้งแต่เดินผ่าน", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_glimmer_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [8, 12]}
    title: "แสงวับในคลอง"
    text: "ปิดเทอมไปบ้านญาติริมคลอง ตกค่ำมีแสงวับ ๆ ในน้ำแถวกอกล้วย เด็กแถวนั้นบอกว่าผีพรายกับนางพรายตานี ใครมองนานตาจะเหล่ ผู้ใหญ่พูดสั้น ๆ แค่ว่าอย่าลงท่าน้ำตอนมืด"
    choices:
      - id: poke_water
        text: "เอาไม้เขี่ยน้ำดูใกล้ ๆ"
        outcomes:
          - {weight: 1, ok: true, text: "แสงแตกเป็นริ้วแล้วกลับมาเหมือนเดิม เงยหน้าดู มีพระจันทร์ดวงเดียวกันอยู่บนฟ้า", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ท่าน้ำลื่น ตกลงไปแค่เอว จามไปสามวัน เด็กแถวนั้นยังยืนยันว่าพรายดึงขา", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: fetch_adult
        text: "ไปตามผู้ใหญ่มาดูด้วย"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: count_lights
        text: "นั่งนับแสงบนบันไดบ้าน"
        outcomes:
          - {weight: 1, ok: true, text: "นับได้สิบเจ็ด เด็กแถวนั้นบอกเมื่อวานมียี่สิบ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยุงกินจนนับไม่ไหว ขาลายกลับเข้าบ้าน", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: dare_kid
        text: "ท้าเด็กแถวนั้นจับผีใส่ขวด"
        outcomes:
          - {weight: 1, ok: true, text: "เขากลับมาพร้อมขวดเปล่า ชี้ไฟคาดหัวของคนจับกบอีกฝั่ง แล้วสองคนก็หัวเราะกันยาว", effects: {relations: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้ลูกอ๊อดกลับบ้านครึ่งขวด เด็กคนนั้นยืนยันว่ากลางคืนมันเป็นผี ป้าเทขวดทิ้งหน้าบ้าน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_chain_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [13, 15], school: [lower, upper, voc]}
    title: "เสียงโซ่ตึกเก่า"
    text: "รุ่นพี่เล่าว่าโรงเรียนนี้เคยเป็นเรือนจำ ห้องน้ำตึกเก่ามีเสียงเหมือนโซ่ลากพื้นตอนเย็น คาบสุดท้ายวันนี้คุณปวดเบาอยู่ตึกนั้น ห้องน้ำอีกตึกไกลพอจะเข้าเรียนไม่ทัน"
    choices:
      - id: hold_it
        text: "กลั้นไว้จนเลิกเรียน"
        effects: {health: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: go_group
        text: "ชวนเพื่อนไปเป็นขบวน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: ask_janitor
        text: "ไปถามนักการภารโรง"
        outcomes:
          - {weight: 2, ok: true, text: "เขาชูโซ่คล้องประตูให้ดู ลากเก็บทุกเย็นตอนปิดตึก ทำมายี่สิบปีแล้ว", effects: {knowledge: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาบอกไม่เคยได้ยิน แล้วถามว่าทำไมไม่อยู่ในห้องเรียน", effects: {relations: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขายกนิ้วให้เงียบ เสียงโซ่ลากดังมาจากตึกเก่า ทั้งที่โซ่คล้องประตูอยู่ในมือเขา เขาบอกว่า เย็นนี้มาเร็ว", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: play_chain
        text: "อัดเสียงโซ่ไปเปิดในห้องน้ำ"
        outcomes:
          - {weight: 1, ok: true, text: "คนในห้องน้ำวิ่งออกมาทั้งแถว สัปดาห์ต่อมาเรื่องเล่ามีตอนใหม่ ที่มาของเสียงอยู่ในกระเป๋าคุณ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ครูฝ่ายปกครองอยู่ในห้องน้ำนั้น ได้ล้างห้องน้ำตึกเก่าทั้งสัปดาห์", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_webboard_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [15, 18], school: [lower, upper, voc]}
    title: "กระทู้ห้องชั้นสี่"
    text: "เว็บบอร์ดโรงเรียนมีคนเล่าว่าได้ยินเสียงผู้หญิงร้องไห้หลังห้องชั้น 4 คนตอบต่อกันสามสิบความเห็น ความเห็นล่าสุดเขียนว่า หลอนกันไป 5555 มีทุกที่ พรุ่งนี้สอบ คุณยังกดรีเฟรชอยู่"
    choices:
      - id: log_off
        text: "ปิดคอม อ่านหนังสือสอบ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: ask_source
        text: "ถามว่าใครได้ยินกับหูตัวเอง"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: stay_late
        text: "พรุ่งนี้สอบเสร็จอยู่เย็นไปฟังเอง"
        outcomes:
          - {weight: 1, ok: true, text: "เจอเพื่อนห้องข้าง ๆ นั่งร้องไห้เพราะอกหัก เลยนั่งเป็นเพื่อนจนมืด", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้ยินแต่พัดลมเพดานเอียง ๆ นั่งรอจนยามมาไล่กลับ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: write_sequel
        text: "แต่งตอนต่อใส่รายละเอียดเอง"
        outcomes:
          - {weight: 1, ok: true, text: "กระทู้ขึ้นอันดับหนึ่ง มีคนมายืนยันว่าเห็นตามที่คุณแต่งทุกอย่าง", effects: {network: 2, knowledge: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "โพสต์จนตีสอง เช้านี้ตื่นมาทำข้อสอบได้ครึ่งเดียว", effects: {knowledge: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_paralysis_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [16, 18], school: [upper, voc]}
    title: "มีอะไรนั่งทับอก"
    text: "อ่านหนังสือโต้รุ่งมาสามคืน พอเคลิ้มก็รู้สึกตัวแต่ขยับไม่ได้ เหมือนมีอะไรกดทับอกอยู่ เช้านี้เล่าให้เพื่อนฟัง ทั้งห้องลงมติว่าผีอำ พรุ่งนี้ยังสอบอีกสองวิชา"
    choices:
      - id: sleep_full
        text: "ปิดหนังสือ นอนให้ครบ"
        effects: {health: 2, knowledge: -1}
        merit: [{cat: neutral}]
      - id: more_coffee
        text: "ชงกาแฟ ไม่นอนมันเลย"
        outcomes:
          - {weight: 1, ok: true, text: "ไม่โดนอีกเพราะไม่ได้นอน คะแนนสอบดี ตาดำลงไปถึงคาง", effects: {knowledge: 2, health: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "หลับในห้องสอบตั้งแต่ข้อห้า ตื่นมาตัวแข็งอีกรอบ", effects: {knowledge: -1, health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_nurse
        text: "ไปถามครูห้องพยาบาล"
        outcomes:
          - {weight: 1, ok: true, text: "ครูว่าอดนอนกับเครียดสะสม ไม่ใช่ผีที่ไหน นอนเร็วขึ้นสองคืนก็หาย", effects: {knowledge: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูให้นอนห้องพยาบาลจนพลาดคาบติว เพื่อนจดให้แต่อ่านลายมือไม่ออก", effects: {knowledge: -2, health: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: brag_ghost
        text: "บอกเพื่อนว่าผีมาติวให้ทุกคืน"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งห้องขำ มีคนมาขอฝากผีช่วยดูวิชาเลขด้วย", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้ฉายา ผีติว ติดตัวไปจนเรียนจบ ครูก็เรียกด้วย", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_howl_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "เสียงร้องเชิงเขา"
    text: "กลางดึกที่แคมป์ในป่า มีเสียงร้อง กองกอย ดังมาจากเชิงเขา ตอนเย็นคนนำทางเล่าเรื่องผีโป่งขาเดียวไว้ แล้วเข้านอนไปก่อนใคร เพื่อนในเต็นท์สะกิดถามว่าเอาไงดี"
    choices:
      - id: torch_look
        text: "ถือไฟฉายออกไปส่องดู"
        outcomes:
          - {weight: 1, ok: true, text: "เห็นค่างแก่ตัวหนึ่งปีนต้นไม้ไม่ขึ้น มันหันมามองแบบเหนื่อยใจ", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สะดุดเชือกเต็นท์ ข้อเท้าเคล็ด เดินกะเผลกไปจนจบทริป", effects: {health: -2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไฟจับหน้าค่างแก่ตัวหนึ่ง หน้าตาไม่เหมือนค่างที่เคยเห็น มันอ้าปากร้อง กองกอย ใส่คุณตรง ๆ แล้วไม่ยอมหันไปไหน", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hide_bag
        text: "ซุกถุงนอนไม่พูดอะไร"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: fire_talk
        text: "ก่อไฟคุยกันจนสว่าง"
        effects: {relations: 1, health: -1}
        merit: [{cat: neutral}]
      - id: howl_back
        text: "ร้องกองกอยตอบกลับไป"
        outcomes:
          - {weight: 1, ok: true, text: "เสียงเงียบไปทั้งเขา เช้านี้เพื่อนยกให้เป็นหัวหน้าแคมป์ คุณตอบรับได้แค่เสียงแหบ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เต็นท์ข้าง ๆ ตื่นทั้งแถว เช้านี้ไม่มีใครแบ่งกาแฟให้คุณ", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: legend_ward_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 25]}
    title: "คืนท้าโรงพยาบาลร้าง"
    text: "เพื่อนชวนคืนวันศุกร์ไปท้าพิสูจน์โรงพยาบาลร้างนอกเมือง คนแถวนั้นลือว่ารถเข็นกับเตียงเลื่อนเอง ตอนแวะกินข้าว ป้าร้านส้มตำบอกว่าที่ปิดเพราะหาหมอมาอยู่ไม่ได้"
    choices:
      - id: go_dare
        text: "ไปด้วย ถือไฟฉายนำหน้า"
        outcomes:
          - {weight: 1, ok: true, text: "ไปถึงเจอแต่นั่งร้านกับถุงปูน ที่นี่กำลังปรับปรุงเป็นสถานพยาบาลใหม่ ยามชวนกินกาแฟ", effects: {relations: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พื้นชั้นสองมีเศษกระจก รองเท้าทะลุ ได้เข้าโรงพยาบาลที่ยังเปิดอยู่จริง ๆ", effects: {health: -2, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_car
        text: "รอในรถ ดูแลกุญแจให้"
        effects: {relations: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: som_tam
        text: "ชวนทุกคนกินส้มตำต่ออีกจาน"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนยอมตาม นั่งกันจนร้านปิด เรื่องท้าพิสูจน์กลายเป็นเรื่องแฟนเก่า", effects: {relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนไปกันเอง คุณนั่งเฝ้าครกอยู่คนเดียว แล้วโดนล้อไปทั้งปี", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: on_gurney
