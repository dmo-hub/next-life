          - {weight: 2, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}}, text: "ทีมกวาดทีละซอยจนรุ่งสาง ป้าร้านข้าวแกงจำหน้าคุณได้ ตักข้าวมาให้ทั้งทีมไม่คิดเงิน", effects: {network: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยึดคืนได้แค่ครึ่งย่าน อีกครึ่งถูกล้อมรั้วเป็นเขตหวงห้าม คุณควักเงินตัวเองซื้อน้ำซื้อยาให้ทีมจนหมดกระเป๋า", effects: {money: {unit: income_x, amount: -0.3}, happiness: -1}, merit: [{cat: neutral}]}
      - id: reclaim_support
