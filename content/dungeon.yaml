# ดันเจียนไทย (โลกซ้อนทับขั้น 3): เกตเปิดกลางเมือง 1 รอบ = ใบเข้า → ใบกลาง (ถอยได้) → ห้องบอส · ใบ 2–3 มาทาง next จึงไม่กินโควตาซ้อน
# ใบเข้า id ขึ้นต้น overlap_ ไม่ใส่ weight — ออกทางตารางนัดของขั้นเท่านั้น · 4 ใบ = เพดานโควตาขั้น 3 ให้นักล่าเข้าซ้ำได้ทุกช่องที่นัด
# ใบเดียวรับทั้งสองคน: ทางถูกดูดไม่ล็อก (การ์ดต้องมีทางเปิด 1 ทาง) ⇒ คนที่ไม่ใช่นักล่าและยังไม่เคยรอดจากเกตเหลือทางเดียวคือถูกดูดเข้าไป
# นักล่าเลือกนำทีมหรือส่งต่อ · คนที่เคยรอดแล้วหลบได้ · ทางถูกดูดไม่มีทางตาย ใครกดก็รอด
# ทางที่ตายได้อยู่แค่ห้องบอสหลังตัวเลือกที่ล็อกนักล่า (lint dungeon-die) · ผลลดสุขภาพอยู่แค่ตัวเลือกที่มีทางตาย
# (แกนลงสาเหตุบาดแผลตามทางตายของตัวเลือกนั้น) — ใบเข้า/ใบกลาง/สายถูกดึงห้ามลดสุขภาพ ไม่งั้นชีวิตหมดในดันเจียนแล้วลงสาเหตุเป็นโรค
# ทุกใบในรอบมี run: dungeon — สุขภาพหมดอยู่ก่อนเปิดใบ (โรคถึงคิว) แกนให้เดินจนจบรอบแล้วตายด้วยโรคที่ใบสุดท้าย
# ไม่ใช่ทริปต่างโลก: ไม่แตะ st.trip และไม่ขึ้นค่าซ้อนทับ
# hunter_rank คูณน้ำหนักยกกำลังขั้นในสายนักล่า ขั้นฝึกหัดจึงเท่าเลขฐาน · ขั้นสูงเจอซุ่มและทางตายบ่อยขึ้น แลกกับทางชนะใหญ่
events:
  - id: overlap_dungeon_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    when: {overlap_stage: [3, 4], age: [18, 60]}
    title: "เกตเปิดที่สถานีรถไฟฟ้า"
    text: "เช้าวันธรรมดา ประตูแสงสีม่วงฉีกกลางชานชาลา ลมดูดจากในเกตแรงจนป้ายโฆษณาปลิวเข้าไปทั้งแผ่น เสียงประกาศสถานีขาดเป็นช่วง ๆ ว่าทีมนักล่ากำลังมา"
    choices: &gate_choices
      - id: hunt
        text: "นำทีมนักล่าเข้าเกต"
        requires: {flags: {has: [hunter]}, reason: "เฉพาะนักล่าที่ถือบัตรกิลด์"}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}}, text: "ทีมเข้าประตูพร้อมกันครบทุกคน ทางเดินหินชื้นทอดลึกลงไปข้างหน้า", effects: {knowledge: 1}, next: dungeon_hunt_mid_01, merit: [{cat: neutral}]}
          - {weight: 1, multipliers: {hunter_rank: 1.3}, text: "มีตัวซุ่มรออยู่ตั้งแต่ปากประตู ทีมฝ่าเข้าไปได้แต่เสียของไปครึ่งเป้", effects: {happiness: -1}, next: dungeon_hunt_mid_01, merit: [{cat: neutral}]}
      - id: pulled
        text: "ถูกแรงเกตดูดเข้าไป"
        sets_flags: [dungeon_pulled]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "คุณตกลงไปในห้องหินที่เงียบสนิท มีแสงเรืองจากผนังพอให้มองเห็นทาง", effects: {happiness: -1}, next: dungeon_pull_mid_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณตกลงข้างรังตัวอะไรสักอย่างที่ยังหลับอยู่ ต้องกลั้นหายใจคลานออกมา", effects: {happiness: -2}, next: dungeon_pull_mid_01, merit: [{cat: neutral}]}
      - id: pass
        text: "ให้ทีมอื่นรับงานนี้แทน"
        requires: {flags: {has: [hunter]}, reason: "เฉพาะนักล่าที่ถือบัตรกิลด์"}
        effects: {money: {unit: income_x, amount: -0.2}, happiness: 1}
        schedules: [{event: dungeon_breach_01, after_years: [1, 2]}]
        merit: [{cat: neutral}]
      - id: evacuate
        text: "พาคนแถวนั้นหลบออกจากรัศมีเกต"
        requires: {flags: {has: [dungeon_pulled]}, reason: "ต้องเคยรอดจากเกตถึงรู้ทางหลบ"}
        effects: {relations: 1}
        merit: [{cat: help_others, level: 1}]

  - id: overlap_dungeon_02
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    when: {overlap_stage: [3, 4], age: [18, 60]}
    title: "เกตเปิดกลางตลาดสด"
    text: "แผงผักหน้าตลาดยุบหายลงไปในวงแสงสีเขียว แม่ค้าวิ่งหนีกันจ้าละหวั่น เทศกิจขึงเชือกกั้นได้แค่ครึ่งเดียว แรงดูดก็ลากโต๊ะไม้เข้าไปอีกตัว"
    choices: *gate_choices

  - id: overlap_dungeon_03
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    when: {overlap_stage: [3, 4], age: [18, 60]}
    title: "เกตเปิดกลางทุ่งนา"
    text: "หลังฝนแรกของปี กลางทุ่งท้ายหมู่บ้านมีวงหินลอยขึ้นมาจากโคลน ผู้ใหญ่บ้านประกาศเสียงตามสายให้ทุกคนอยู่ห่าง แต่วัวสองตัวเดินเข้าไปแล้วไม่ออกมาอีก"
    choices: *gate_choices

  - id: overlap_dungeon_04
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    when: {overlap_stage: [3, 4], age: [18, 60]}
    title: "เกตเปิดในลานจอดรถห้าง"
    text: "ไฟลานจอดรถชั้นใต้ดินดับพร้อมกันทั้งชั้น เหลือแต่แสงสีแดงจากประตูที่เปิดอยู่ตรงช่องจอดสุดท้าย สัญญาณกันขโมยรถดังระงมไปทั้งอาคาร"
    choices: *gate_choices

  # สายนักล่า ใบกลาง: ถอยได้ 2 ทาง (จบรอบที่ 2 ใบ) · ไปต่อ 2 ทาง (ช่วย/ทิ้งเพื่อน) — ทุกทางยังไม่ตาย
  - id: dungeon_hunt_mid_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    title: "ชั้นกลางของดันเจียน"
    text: "ทีมฝ่ามาถึงโถงกว้างที่มีกระดูกกองเต็มพื้น เพื่อนร่วมทีมคนหนึ่งขาติดกับดักจนเดินไม่ไหว เสียงหายใจหนัก ๆ ของอะไรสักอย่างดังมาจากประตูหินบานใหญ่ข้างหน้า"
    choices:
      - id: push_on
        text: "พาทีมบุกต่อไปห้องบอส"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}}, text: "คุณอ่านทางกับดักออก ทีมผ่านโถงไปถึงหน้าประตูหินได้ครบ", effects: {knowledge: 1, money: {unit: income_x, amount: 0.2}}, next: dungeon_hunt_boss_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "กับดักอีกตัวดีดเป้คุณขาด ของที่เก็บมาหล่นหายในเหว", effects: {happiness: -1}, next: dungeon_hunt_boss_01, merit: [{cat: neutral}]}
      - id: carry_out
        text: "แบกเพื่อนที่เจ็บออกไปก่อน"
        effects: {network: 1, money: {unit: income_x, amount: 0.3}}
        merit: [{cat: help_others, level: 1}]
      - id: leave_behind
        text: "ทิ้งเพื่อนไว้ ไปต่อห้องบอส"
        merit: [{cat: greed_harm, level: 1}]
        outcomes:
          - {weight: 2, ok: true, text: "ทีมที่เหลือเดินเร็วขึ้น ไม่มีใครพูดถึงคนที่อยู่ข้างหลัง", next: dungeon_hunt_boss_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "เสียงเพื่อนตะโกนเรียกชื่อคุณดังตามหลังไปจนถึงประตูหิน", effects: {happiness: -1, network: -1}, next: dungeon_hunt_boss_01, merit: [{cat: neutral}]}
      - id: retreat
        text: "ถอยออก ขายของที่เก็บได้"
        effects: {money: {unit: income_x, amount: 0.5}}
        merit: [{cat: neutral}]

  # ห้องบอส: 3 ทางสู้ (ล็อกนักล่า · ตายจริงด้วยกลุ่มสาเหตุเดิม) · 1 ทางถอย · ชีวิตคูณหลัก ความรู้คูณเสริม
  - id: dungeon_hunt_boss_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    title: "ห้องบอส"
    text: "ประตูหินเปิดออกช้า ๆ ตัวที่นอนอยู่กลางห้องใหญ่กว่ารถบรรทุก เกล็ดบนหลังเรืองแสงตามจังหวะหายใจ ผลึกสีม่วงที่กิลด์รับซื้อกองอยู่รอบตัวมัน"
    choices:
      - id: all_in
        text: "บุกเต็มกำลังพร้อมทีม"
        requires: {flags: {has: [hunter]}, reason: "เฉพาะนักล่าที่ถือบัตรกิลด์"}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 6, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}, hunter_rank: 1.2}, text: "ทีมล้มบอสได้ กิลด์ตีราคาผลึกที่ขนออกมาได้ก้อนใหญ่ ชื่อคุณขึ้นกระดานกิลด์", effects: {money: {unit: income_x, amount: 2}, network: 2, loot: [dg_takrut, dg_knife, dg_vest, dg_fang]}, merit: [{cat: neutral}]}
          - {weight: 3, text: "ล้มบอสได้แต่คุณโดนหางฟาดจนซี่โครงร้าว ส่วนแบ่งผลึกแทบไม่พอค่าหมอ", effects: {health: -2, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 0.4, multipliers: {hunter_rank: 1.3}, text: "บอสสะบัดหางกวาดทั้งแนว ทีมลากร่างคุณออกจากเกตได้ แต่คุณไม่ได้ลืมตาขึ้นมาอีก", effects: {die: assault}, merit: [{cat: neutral}]}
      - id: weak_spot
        text: "อ่านจังหวะแล้วตีจุดอ่อน"
        requires: {flags: {has: [hunter]}, reason: "เฉพาะนักล่าที่ถือบัตรกิลด์"}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 6, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}, hunter_rank: 1.2}, text: "คุณเห็นเกล็ดที่แตกอยู่ใต้คอ ตีครั้งเดียวบอสก็ทรุด ทีมแบ่งผลึกกันอย่างงาม", effects: {money: {unit: income_x, amount: 1.5}, network: 1, knowledge: 1, loot: [dg_takrut, dg_knife, dg_vest, dg_fang]}, merit: [{cat: neutral}]}
          - {weight: 3, text: "จังหวะพลาดไปนิดเดียว เพดานถล่มลงมาทับขาคุณ ทีมต้องหามออก", effects: {health: -2}, merit: [{cat: neutral}]}
          - {weight: 0.4, multipliers: {hunter_rank: 1.3}, text: "เสาหินที่บอสชนพังลงมาทั้งต้น ทีมขุดหาคุณจนเกตปิด", effects: {die: accident}, merit: [{cat: neutral}]}
      - id: decoy
        text: "ล่อบอสไว้ให้ทีมหนีออกไป"
        requires: {flags: {has: [hunter]}, reason: "เฉพาะนักล่าที่ถือบัตรกิลด์"}
        merit: [{cat: help_others, level: 2}]
        outcomes:
          - {weight: 5, ok: true, multipliers: {stats: {health: 2.0, knowledge: 1.2}, hunter_rank: 1.2}, text: "คุณวิ่งวนจนบอสหลงทาง ทีมออกครบทุกคน กิลด์ให้เบี้ยกล้าหาญพิเศษ", effects: {money: {unit: income_x, amount: 0.8}, network: 2, loot: [dg_takrut, dg_knife, dg_vest, dg_fang]}, merit: [{cat: neutral}]}
          - {weight: 3, text: "ทีมออกไปได้ คุณหนีตามมาทีหลังพร้อมรอยกรงเล็บยาวตลอดหลัง", effects: {health: -2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 0.4, multipliers: {hunter_rank: 1.3}, text: "ทีมออกไปได้ครบทุกคน แต่คนที่ล่อบอสไว้ไม่ได้ตามออกมา", effects: {die: assault}, merit: [{cat: neutral}]}
      - id: back_off
        text: "ถอยออกก่อนบอสตื่น"
        effects: {money: {unit: income_x, amount: 0.6}, happiness: -1}
        merit: [{cat: neutral}]

  # สายถูกดึง (ครั้งแรก): รอดเสมอ — ไม่มีผลลดสุขภาพ ไม่มี die · ใบกลางจบได้เลย 2 ทาง ไปทางออก 2 ทาง
  - id: dungeon_pull_mid_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    title: "หลงอยู่ในดันเจียน"
    text: "ทางเดินแยกออกเป็นสามทาง มือถือไม่มีสัญญาณ ไกล ๆ มีแสงไฟฉายวูบวาบกับเสียงคนตะโกนเรียกผู้รอดชีวิต ข้างตัวคุณมีคนแปลกหน้านั่งกุมข้อเท้าที่บวมเป่ง"
    choices:
      - id: follow_light
        text: "ตามเสียงทีมกู้ภัยออกไป"
        effects: {happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: hide
        text: "หลบในซอกหินรอจนปลอดภัย"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "เสียงฝีเท้าหนัก ๆ เดินผ่านซอกหินไป แล้วทางข้างหน้าก็เงียบลง", next: dungeon_pull_out_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณนั่งรอจนขาชา ตัวสั่นจนกัดฟันไม่อยู่", effects: {happiness: -1}, next: dungeon_pull_out_01, merit: [{cat: neutral}]}
      - id: help_stranger
        text: "พยุงคนแปลกหน้าไปด้วยกัน"
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 2, ok: true, text: "เขาบอกชื่อ เล่าว่ามีลูกรออยู่ข้างนอก สองคนค่อย ๆ เดินหาทางไปด้วยกัน", effects: {relations: 1}, next: dungeon_pull_out_01, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาหนักกว่าที่คิด ทั้งสองคนเดินได้ทีละไม่กี่ก้าว", effects: {happiness: -1}, next: dungeon_pull_out_01, merit: [{cat: neutral}]}
      - id: grab_crystal
        text: "แกะผลึกเรืองแสงติดมือออกไป"
        effects: {money: {unit: income_x, amount: 0.5}, happiness: -1}
        merit: [{cat: neutral}]

  - id: dungeon_pull_out_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    run: dungeon
    title: "ทางออกจากดันเจียน"
    text: "แสงจากปากเกตอยู่ปลายโถงสุดท้าย ระหว่างทางมีตัวอะไรสักอย่างนอนขดหลับอยู่ ข้างกำแพงมีกระเป๋าเป้ของนักล่าที่ไม่ได้กลับออกไปวางทิ้งไว้"
    choices:
      - id: sneak
        text: "ย่องผ่านไปช้า ๆ"
        effects: {happiness: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: run
        text: "วิ่งสุดแรงไปทางแสง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: bag_to_guild
        text: "หิ้วเป้ไปคืนกิลด์นักล่า"
        effects: {network: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: bag_keep
        text: "เก็บของในเป้ไว้เอง"
        effects: {money: {unit: income_x, amount: 0.8}, loot: [dg_crossbow, dg_armband]}
        merit: [{cat: greed_harm, level: 1}]

  # ใบตามของทาง pass: มาทาง schedules จึงกินโควตาปี 1 แบบผลย้อน · id ไม่ขึ้น overlap_ ตารางนัดของขั้นจึงไม่หยิบ ไม่กินโควตาซ้อน
  # ส่งเกตหลายครั้งในชีวิตเดียวก็เจอใบนี้ครั้งเดียว (นัดข้าม id ที่ออกแล้ว) · ไม่อยู่ในรอบดันเจียนจึงไม่มี run: dungeon
  # ไม่มีทางตาย ⇒ ห้ามลดสุขภาพตามกติกาหัวไฟล์ ราคาของทางยึดคืนจึงเป็นเงินกับความสุข · 3 ทาง ยึดคืน/ย้ายหนี/ซ้ำเติม ทางยึดคืนแยกแนวหน้า/แนวหลังให้ครบ 4 ตัวเลือกตาม lint
  - id: dungeon_breach_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    when: {overlap_stage: [3, 4]}
    title: "เกตที่ไม่มีใครปิดแตก"
