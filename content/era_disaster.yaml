        effects: {health: -1, happiness: -2, relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 3}]
      - id: donate_wait
        text: "โอนเงินช่วยแล้วรอข่าว"
        effects: {happiness: -1, money: {unit: income_x, amount: -0.5}}
        merit: [{cat: dana, level: 1}]
      - id: buy_beach_land
        text: "ชวนที่บ้านซื้อที่ริมหาดราคาตก"
        requires: {money: {unit: income_x, amount: 2}, reason: "เงินเก็บไม่พอซื้อที่ดิน"}
