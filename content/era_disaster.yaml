# การ์ดบ้านเมือง · ภัยพิบัติ/โรคระบาด — 5 เหตุการณ์ × (เด็ก ผู้ใหญ่รับมือ เด็กเลือกว่าตัวเองทำอะไร + ผู้ใหญ่)
events:
  # ---------- พายุไต้ฝุ่นเกย์ ----------
  - id: era_dis_typhoon_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    era: typhoon_gay
    when: {age: [6, 12], school: [primary, lower], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "ไต้ฝุ่นกลางดึก"
    text: "พายุเข้าฝั่งตอนตีสอง ลมหอบหลังคาสังกะสีปลิวไปทั้งแผ่น เช้ามาเรือของพ่อที่จอดหน้าบ้านหายไปกับคลื่น พ่อแม่นั่งเงียบอยู่นาน คุณยืนมองหลังคาที่หายไปแล้วรู้ว่าต้องทำอะไรสักอย่าง"
    choices:
      - id: move_to_town
        text: "ขอพ่อแม่ไปอยู่กับญาติในเมือง"
        effects: {health: 1, happiness: -1, relations: -1, income_mult: 1.2}
        merit: [{cat: neutral}]
      - id: rebuild_boat
        text: "ช่วยพ่อขนไม้ต่อเรือลำใหม่"
        outcomes:
          - {weight: 3, ok: true, text: "พ่อกู้เงินต่อเรือจนเสร็จ หลังพายุปลาชุกผิดปกติ ใช้หนี้หมดในปีเดียว", effects: {happiness: 2, money: {unit: income_x, amount: 1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรือรั่วกลางทะเล พ่อกลับมาได้แต่เจ็บหนัก คุณต้องหยุดเรียนมาช่วยแม่หาเงินใช้หนี้", effects: {happiness: -2, knowledge: -1, money: {unit: income_x, amount: -1.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: shelter_neighbors
        text: "แบ่งที่นอนให้เด็กบ้านหลังคาพัง"
        effects: {health: -1, relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: boarding_school
        text: "ขอไปเรียนประจำในเมือง"
        effects: {knowledge: 2, relations: -2}
        merit: [{cat: neutral}]

  - id: era_dis_typhoon_small_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    era: typhoon_gay
    when: {age: [0, 5], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "ลมพัดหลังคาหาย"
    text: "พายุเข้าฝั่งตอนตีสอง ลมหอบหลังคาสังกะสีปลิวไปทั้งแผ่น แม่อุ้มคุณไว้แน่นทั้งคืน เช้ามาเรือของพ่อที่จอดหน้าบ้านหายไปกับคลื่น พ่อนั่งเงียบอยู่นาน"
    choices:
      - id: cry_for_doll
        text: "ร้องหาตุ๊กตาที่ลอยไปกับน้ำ"
        effects: {happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: follow_to_town
        text: "ตามแม่ไปอยู่บ้านญาติในเมือง"
        effects: {health: 1, happiness: -1, relations: -1, income_mult: 1.2}
        merit: [{cat: neutral}]
      - id: watch_boat
        text: "นั่งดูพ่อต่อเรือลำใหม่"
        outcomes:
          - {weight: 3, ok: true, text: "พ่อกู้เงินต่อเรือจนเสร็จ หลังพายุปลาชุกผิดปกติ ใช้หนี้หมดในปีเดียว", effects: {happiness: 2, money: {unit: income_x, amount: 1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรือรั่วกลางทะเล พ่อกลับมาได้แต่เจ็บหนัก แม่ต้องรับจ้างเพิ่มอีกงาน", effects: {happiness: -2, money: {unit: income_x, amount: -1.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: share_blanket
        text: "แบ่งผ้าห่มให้เด็กบ้านหลังคาพัง"
        effects: {health: -1, relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]

  - id: era_dis_typhoon_adult_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    era: typhoon_gay
    when: {age: [13, 110]}
    title: "ไต้ฝุ่นถล่มชายฝั่ง"
    text: "ไต้ฝุ่นลูกใหญ่ซัดชายฝั่ง ข่าวบอกว่าบางหมู่บ้านหายไปทั้งแถบ ทีวีเปิดรับบริจาคทั้งคืน ส่วนคนในพื้นที่ขาดทั้งช่างทั้งแรงงานรื้อซาก"
    choices:
      - id: go_help
        text: "ลงพื้นที่ไปช่วยรื้อซาก"
        effects: {health: -1, relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 2}]
      - id: donate_tv
        text: "โอนเงินช่วยผ่านทีวี"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: dana, level: 1}]
      - id: contractor
        text: "รับจ้างซ่อมบ้านหลังพายุ"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.5}, occupation: {craft: 2, technician: 1.5, labor: 1.3}}, text: "งานล้นมือจนต้องจ้างลูกน้อง กลายเป็นผู้รับเหมาเจ้าประจำของทั้งอำเภอ", effects: {money: {unit: income_x, amount: 1}, income_mult: 1.3}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รับงานเกินตัว ตกนั่งร้านขาเดาะ ลูกค้าทวงมัดจำคืน", effects: {health: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: price_gouge
        text: "กักน้ำดื่มไว้ขายราคาสามเท่า"
        effects: {happiness: 1, relations: -2, money: {unit: income_x, amount: 1.5}}
        merit: [{cat: greed_harm, level: 1}]
      - id: stay_home
        text: "ปิดทีวี ไปวิ่งให้หายเครียด"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  # ---------- SARS ----------
  - id: era_dis_sars_kid_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    era: sars
    when: {age: [6, 12], school: [primary, lower], family: [{role: parent, alive: true}]}
    title: "ไอสามวันช่วงโรคระบาด"
    text: "ข่าวโรคปอดอักเสบปริศนาจากต่างประเทศเต็มจอ ทั้งห้องเรียนใส่หน้ากาก คุณไอติดกันสามวัน ตัวรุม ๆ พ่อแม่ใจคอไม่ดี"
    choices:
      - id: private_hospital
        text: "บอกแม่ว่าเจ็บหน้าอกเวลาไอ"
        requires: {family: [{role: parent, sex: หญิง, alive: true}]}
        effects: {money: {unit: income_x, amount: -0.5}}
        outcomes:
          - {weight: 3, text: "แม่รีบไปโรงพยาบาลเอกชน หมอบอกแค่หวัดธรรมดา ได้ไอติมปลอบใจขากลับ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตรวจเจอปอดบวมตั้งแต่เนิ่น ๆ หมอว่าถ้ามาช้ากว่านี้อาจแย่ พ่อแม่กอดคุณแน่นทั้งคืน", effects: {relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: home_quarantine
        text: "ขอหยุดเรียน ไม่อยากให้เพื่อนติด"
        effects: {health: 1, knowledge: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: herbal_boil
        text: "ยอมกินยาต้มขม ๆ สูตรยาย"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 2}}, text: "หายเองในสองวัน ยายคุยเรื่องนี้ไปอีกสิบปี", effects: {relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไอยืดเป็นเดือน ไปหาหมอช้าจนปอดอักเสบ", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: school_as_usual
        text: "ซ่อนอาการ ไปโรงเรียนตามปกติ"
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 1.5}}, text: "เรียนทันเพื่อน ไม่มีอะไรเกิดขึ้น", effects: {knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไข้ขึ้นกลางห้อง ถูกจับแยก เพื่อนตั้งฉายาไปทั้งปี", effects: {health: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: era_dis_sars_small_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    era: sars
    when: {age: [0, 5], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
