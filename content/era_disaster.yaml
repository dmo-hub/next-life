    text: "ข่าวโรคปอดอักเสบปริศนาจากต่างประเทศเต็มจอ แม่ซื้อหน้ากากมาตุนไว้กล่องใหญ่ คืนนี้คุณไอไม่หยุด ตัวรุม ๆ พ่อแม่ผลัดกันนั่งเฝ้าไม่ยอมนอน"
    choices:
      - id: refuse_doctor
        text: "ร้องไห้ไม่ยอมไปหาหมอ"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {health: 2}}, text: "หลับไปจนเช้า ไข้ลดเอง แม่ถอนหายใจยาว", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เช้ามาไข้ขึ้นสูง แม่อุ้มไปโรงพยาบาลเอกชน หมอว่าเป็นหวัด แต่ค่าหมอแพงกว่าที่คิด", effects: {money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: herbal_boil
        text: "ยอมกินยาต้มขม ๆ สูตรยาย"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 2}}, text: "หายเองในสองวัน ยายคุยเรื่องนี้ไปอีกสิบปี", effects: {relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไอยืดเป็นเดือน ไปหาหมอช้าจนปอดอักเสบ", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hug_mom
        text: "กอดแม่ไว้ทั้งคืน"
        effects: {relations: 2}
        merit: [{cat: neutral}]
      - id: play_doctor
        text: "ใส่หน้ากากเล่นเป็นหมอ"
        effects: {health: 1, happiness: 1}
        merit: [{cat: neutral}]

  - id: era_dis_sars_adult_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    era: sars
    when: {age: [13, 110]}
    title: "เที่ยวบินว่างเปล่า"
    text: "ทั่วโลกผวาโรคทางเดินหายใจตัวใหม่ นักท่องเที่ยวหายวับ สนามบินเงียบเหมือนวันหยุด ตั๋วเครื่องบินกับโรงแรมลดราคากระหน่ำ"
    choices:
      - id: cheap_trip
        text: "คว้าตั๋วถูกไปเที่ยวนอก"
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 1.3}}, text: "ทริปคุ้มที่สุดในชีวิต ถ่ายรูปสถานที่ดังได้โดยไม่มีคนติดเฟรม", effects: {happiness: 3, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไข้ขึ้นที่สนามบินขากลับ ถูกกักตัวสิบสี่วัน ทั้งที่สุดท้ายเป็นแค่หวัด", effects: {health: -1, happiness: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hoard_masks
        text: "ตุนหน้ากากไว้ขาย"
        outcomes:
          - {weight: 1, text: "ขายหมดเกลี้ยงในสามวัน กำไรเท่าเงินเดือนครึ่งปี", effects: {happiness: 1, money: {unit: income_x, amount: 1.5}}, merit: [{cat: greed_harm, level: 1}]}
          - {weight: 2, text: "ข่าวซาเร็วกว่าคิด หน้ากากค้างเต็มห้องไปอีกหลายปี", effects: {happiness: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: greed_harm, level: 1}]}
        merit: [{cat: greed_harm, level: 1}]
      - id: study_in_slump
        text: "ใช้ช่วงซบเซาไปเรียนเพิ่ม"
        requires: {money: {unit: income_x, amount: 1}, reason: "เงินเก็บไม่พอค่าเรียน"}
        effects: {knowledge: 2, money: {unit: income_x, amount: -1}, income_mult: 1.15}
        merit: [{cat: neutral}]
      - id: careful_routine
        text: "ล้างมือ ใส่หน้ากาก ใช้ชีวิตปกติ"
        effects: {health: 1}
        merit: [{cat: neutral}]
      - id: airport_screening
        text: "อาสาช่วยคัดกรองที่สนามบิน"
        effects: {health: -1, relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 2}]

  # ---------- สึนามิ ----------
  - id: era_dis_tsunami_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    era: tsunami
    when: {age: [0, 12], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "ทะเลถอยหนี"
    text: "เช้าวันหยุดที่ชายหาด น้ำทะเลลดลงไปไกลผิดปกติ ปลาดิ้นอยู่บนทรายเต็มไปหมด เด็ก ๆ ทั้งหาดวิ่งกรูลงไปเก็บ คุณกำลังจะวิ่งตามเพื่อน"
    choices:
      - id: run_uphill
        text: "วิ่งกลับไปหาพ่อแม่ก่อน"
        outcomes:
          - {weight: 2, text: "พ่อแม่คว้ามือวิ่งขึ้นเนินทันที หนีทันทั้งบ้าน แต่รถกับข้าวของบนหาดถูกคลื่นกวาดไปหมด", effects: {health: 1, happiness: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ขึ้นเนินทันเส้นยาแดง ลูกเห็นคลื่นกวาดหาดกับตา ฝันร้ายไปหลายปี", effects: {happiness: -2, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: let_kid_play
        text: "วิ่งตามเพื่อนลงไปเก็บปลา"
        outcomes:
          - {weight: 2, text: "คลื่นก้อนแรกมาถึง พ่อคว้าตัวขึ้นหลังคารถได้ทันเส้นยาแดง", effects: {health: -1, happiness: -2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คลื่นซัดไปไกลเกือบกิโล รอดเพราะเกาะต้นมะพร้าวไว้ทั้งคืน กลายเป็นข่าวไปทั้งประเทศ", effects: {health: -3, relations: 2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: shout_warning
        text: "ตะโกนเรียกเพื่อน ๆ กลับขึ้นมา"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {relations: 2}}, text: "เพื่อน ๆ วิ่งตามขึ้นเนินทันกันหลายคน ทุกปีพ่อแม่เพื่อนมาขอบคุณ", effects: {relations: 3}, merit: [{cat: help_others, level: 2}]}
          - {weight: 1, text: "ไม่มีใครฟัง ต้องวิ่งเอาตัวรอดจนหอบ", effects: {health: -1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: move_inland
        text: "ฝันร้าย ขอพ่อแม่ย้ายไปไกลทะเล"
        effects: {health: 1, happiness: -1, income_mult: 0.8}
        merit: [{cat: neutral}]

  - id: era_dis_tsunami_adult_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    era: tsunami
    when: {age: [13, 110]}
    title: "คลื่นยักษ์อันดามัน"
