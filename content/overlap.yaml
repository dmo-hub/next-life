# โลกซ้อนทับขั้นเบา (ขั้น 1): ข่าวลือ ลางแปลก ที่มีแต่ตัวเราเห็น — โลกยังปกติในสายตาคนอื่น
# ออกเฉพาะตระกูลที่ค่าซ้อนทับถึงขั้น 1–2 · ขั้น 3 เปิดเผยทั้งสังคมแล้วข่าวลือไม่ใช่ข่าวลืออีก · ไม่ติดบุญบาป ไม่ใส่ธง
# id ขึ้นต้น overlap_ ไม่ใส่ weight — แกนนัดตามโควตาของขั้น (overlapPlan) ใส่ weight = ออกซ้ำทางกองสุ่มเกินโควตา
events:
  - id: overlap_rumor_01
    away_block: [abroad]
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {overlap_stage: [1, 2]}
    title: "ข่าวลือที่มีแต่คุณได้ยิน"
    text: "คนในซอยเล่ากันว่าเห็นประตูแสงสีฟ้าเปิดกลางทุ่งตอนตีสาม พอคุณถามต่อ ทุกคนกลับทำหน้างงว่าไม่มีใครพูดเรื่องนี้ แต่ในฝันเมื่อคืน คุณเห็นทุ่งนั้นชัดเหมือนเคยยืนอยู่ตรงนั้น"
    choices:
      - id: ask_around
        text: "ถามคนรอบตัวให้แน่ใจ"
        effects: {relations: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: go_see
        text: "ไปดูทุ่งนั้นเองตอนตีสาม"
        effects: {health: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: keep_quiet
        text: "เก็บไว้คนเดียว ไม่เล่าใคร"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: laugh_off
        text: "หัวเราะทิ้ง คิดว่าฝันไป"
        effects: {happiness: 1}
        merit: [{cat: neutral}]

  # ขั้น 3 เกตเปิดทั้งสังคม: ประกาศรับสมัครนักล่า ทางเดียวที่เข้าสาย hunter (สายนี้ไม่มี occs คนทำงานบริการจึงไม่ถูกจับเข้าเอง)
  # กั้น ladder ไว้ที่คนนอกสายบำนาญ — ข้าราชการ/ทหาร/ตำรวจได้การ์ดดันเจียนตามอาชีพแทน ไม่ลาออกมาสมัคร
  - id: overlap_hunter_recruit_01
    away_block: [abroad]
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    when: {overlap_stage: [3, 4], age: [18, 45], ladder: [none, private, trade]}
    title: "ประกาศรับสมัครนักล่า"
    text: "ป้ายประกาศติดทั่วเมืองตั้งแต่เกตเปิดกลางถนนเมื่อต้นปี กิลด์นักล่ารับสมัครคนร่างกายแข็งแรง ฝึกให้สามเดือน เงินเดือนประจำบวกเบี้ยเสี่ยงภัย ใต้ป้ายมีชื่อนักล่าที่ไม่ได้กลับออกมาเขียนต่อกันยาวเหยียด"
    choices:
      - id: apply
        text: "สมัครเข้ากิลด์นักล่า"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.5}}, text: "ผ่านการทดสอบร่างกาย ได้บัตรนักล่าฝึกหัดพร้อมเครื่องแบบชุดแรก", effects: {ladder: hunter, happiness: 1}, sets_flags: [hunter], merit: [{cat: neutral}]}
          - {weight: 1, text: "วิ่งไม่ครบรอบสนาม ครูฝึกให้กลับไปซ้อมแล้วค่อยมาใหม่ปีหน้า", effects: {happiness: -1}, merit: [{cat: neutral}]}
      - id: volunteer
        text: "เป็นอาสากู้ภัยหน้าเกตแทน"
        merit: [{cat: help_others, level: 1}]
        effects: {health: -1, relations: 1}
      - id: move_away
        text: "ย้ายบ้านให้ไกลจากเกต"
        merit: [{cat: neutral}]
        effects: {money: {unit: income_x, amount: -0.3}, happiness: 1}
      - id: stay_put
        text: "ทำงานเดิมต่อ ปล่อยให้คนอื่นล่า"
        merit: [{cat: neutral}]
        effects: {}
