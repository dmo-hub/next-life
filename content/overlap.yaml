# โลกซ้อนทับขั้นเบา (ขั้น 1): ข่าวลือ ลางแปลก ที่มีแต่ตัวเราเห็น — โลกยังปกติในสายตาคนอื่น
# ออกเฉพาะตระกูลที่ค่าซ้อนทับถึงขั้น 1–2 · ขั้น 3 เปิดเผยทั้งสังคมแล้วข่าวลือไม่ใช่ข่าวลืออีก · ไม่ติดบุญบาป ไม่ใส่ธง
# id ขึ้นต้น overlap_ ไม่ใส่ weight — แกนนัดตามโควตาของขั้น (overlapPlan) ใส่ weight = ออกซ้ำทางกองสุ่มเกินโควตา
events:
  - id: overlap_rumor_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {overlap_stage: [1, 2]}
    title: "ข่าวลือที่มีแต่คุณได้ยิน"
    text: "คนในซอยเล่ากันว่าเห็นประตูแสงสีฟ้าเปิดกลางทุ่งตอนตีสาม พอคุณถามต่อ ทุกคนกลับทำหน้างงว่าไม่มีใครพูดเรื่องนี้ แต่ในฝันเมื่อคืน คุณเห็นทุ่งนั้นชัดเหมือนเคยยืนอยู่ตรงนั้น"
    choices:
      - id: ask_around
        text: "ถามคนรอบตัวให้แน่ใจ"
        effects: {relations: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: go_see
        text: "ไปดูทุ่งนั้นเองตอนตีสาม"
        effects: {health: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: keep_quiet
        text: "เก็บไว้คนเดียว ไม่เล่าใคร"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: laugh_off
        text: "หัวเราะทิ้ง คิดว่าฝันไป"
        effects: {happiness: 1}
        merit: [{cat: neutral}]

  # ขั้น 2 (ผีคนจริงชาติก่อน ยังเป็นความลับ): ผีคือแถวชาติไทยล่าสุดในผังตระกูล = ชาติก่อนของตัวเราเอง
  # เล่าเรื่อง/เตือนเท่านั้น ป้าย neutral ล้วน (lint merit-ancestor) · ทวง/ขอส่วนบุญเป็นของผีญาติตาย ไม่ใช่ใบนี้
  - id: overlap_ancestor_01
    type: B
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {overlap_stage: [2, 2], ancestor: true}
    title: "คนในผังตระกูล"
    text: "คืนหนึ่งมี{บรรพบุรุษ}ยืนนิ่งอยู่ปลายเตียง บอกว่าชื่อ{ชื่อบรรพบุรุษ} เคยอยู่{จังหวัดบรรพบุรุษ} จากไปตอนอายุ {อายุตายบรรพบุรุษ} ไม่ได้มาขออะไร มาเตือนแค่ว่าม่านระหว่างโลกขาดแล้ว อย่าข้ามไปมาบ่อยนัก แปลกที่เสียงนั้นคุ้นหูเหมือนเสียงตัวเอง"
    choices:
      - id: ask_name
        text: "ถามชื่อซ้ำให้แน่ใจ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: heed
        text: "รับคำเตือนไว้ในใจ"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: look_away
        text: "หลับตา ทำเป็นไม่เห็น"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: tell_home
        text: "เล่าให้คนในบ้านฟัง"
        effects: {relations: -1}
        merit: [{cat: neutral}]
