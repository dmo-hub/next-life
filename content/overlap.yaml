# โลกซ้อนทับขั้นเบา (ขั้น 1): ข่าวลือ ลางแปลก ที่มีแต่ตัวเราเห็น — โลกยังปกติในสายตาคนอื่น
# ข่าวลือออกเฉพาะตระกูลที่ค่าซ้อนทับถึงขั้น 1–2 · ขั้น 3 เปิดเผยทั้งสังคมแล้วข่าวลือไม่ใช่ข่าวลืออีก · ไม่ติดบุญบาป ไม่ใส่ธง
# ผีทั่วไปออกขั้น 1 ขึ้นไป (ม่านบางแล้วเห็นต่อ) · ไม่มีชื่อ ไม่มีเรื่องค้างให้ทวง ต่างจากผีญาติ · ทำบุญอุทิศเป็นทานจริง ทางอื่นไม่ผูกบุญบาป
events:
  - id: overlap_rumor_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 6
    when: {overlap_stage: [1, 2]}
    title: "ข่าวลือที่มีแต่คุณได้ยิน"
    text: "คนในซอยเล่ากันว่าเห็นประตูแสงสีฟ้าเปิดกลางทุ่งตอนตีสาม พอคุณถามต่อ ทุกคนกลับทำหน้างงว่าไม่มีใครพูดเรื่องนี้ แต่ในฝันเมื่อคืน คุณเห็นทุ่งนั้นชัดเหมือนเคยยืนอยู่ตรงนั้น"
    choices:
      - id: ask_around
        text: "ถามคนรอบตัวให้แน่ใจ"
        effects: {relations: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: go_see
        text: "ไปดูทุ่งนั้นเองตอนตีสาม"
        effects: {health: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: keep_quiet
        text: "เก็บไว้คนเดียว ไม่เล่าใคร"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: laugh_off
        text: "หัวเราะทิ้ง คิดว่าฝันไป"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
  - id: overlap_ghost_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 6
    when: {overlap_stage: [1, 4]}
    title: "เงาใต้ต้นไม้ริมทาง"
    text: "ดึกคืนหนึ่งระหว่างเดินกลับบ้าน คุณเห็นคนยืนนิ่งใต้ต้นไม้ริมทาง หน้าซีด ไม่เอ่ยชื่อ ไม่ขออะไร แค่มองมาเงียบ ๆ คนที่เดินสวนมากลับเดินทะลุผ่านไปเหมือนตรงนั้นไม่มีใคร"
    choices:
      - id: make_merit
        text: "ทำบุญอุทิศให้"
        effects: {happiness: 1}
        merit: [{cat: dana, level: 1}]
      - id: flee
        text: "รีบหนีกลับบ้าน"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: stand_still
        text: "ยืนนิ่งจนมันหายไป"
        effects: {health: -1}
        merit: [{cat: neutral}]
      - id: tell_others
        text: "เล่าให้คนอื่นฟัง"
        effects: {relations: -1}
        merit: [{cat: neutral}]
