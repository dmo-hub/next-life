        text: "กู้ค่าหัวไปเป็นแรงงานผิดกฎหมาย"
        outcomes:
          - {weight: 1, ok: true, text: "รอดการตรวจมาได้ เก็บเงินก้อนโตกลับบ้าน", effects: {money: {unit: income_x, amount: 3}, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถูกจับส่งกลับกลางดึก หนี้ค่าหัวค้างเต็มบ่า", effects: {money: {unit: income_x, amount: -2}, happiness: -2}, sets_flags: [in_debt], merit: [{cat: neutral}]}
