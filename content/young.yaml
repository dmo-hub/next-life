  # เรื่องต่อของ young_first_boss_01 (ผู้บริหารเรียกคุย) — ออกทาง next เท่านั้น
  - id: young_boss_room_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {occupation: [clerk, technician, professional, manager]}
    title: "แฟ้มลับในห้องผู้บริหาร"
    text: "ผู้บริหารปิดประตูแล้ววางแฟ้มลงตรงหน้า ข้างในคือใบเบิกปลอมที่หัวหน้าเซ็นมาสองปีเต็ม เขาถามเรียบ ๆ ว่าเรื่องนี้{ผม}อยากให้จบแบบไหน"
    choices:
      - id: take_seat
        text: "ขอขึ้นเป็นหัวหน้าแทน"
        requires: {edu: อุดมศึกษา, reason: "ตำแหน่งนี้ต้องจบปริญญาตรี"}
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "ได้นั่งโต๊ะหัวหน้าทั้งที่อายุน้อยสุดในแผนก", effects: {job: manager, happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลูกทีมเก่าไม่ยอมรับ งานล่มติดกันสามเดือน ถูกย้ายกลับที่เดิม", effects: {happiness: -2, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: raise_only
        text: "ขอแค่ขึ้นเงินเดือนพอ"
        effects: {income_mult: 1.2, happiness: 1}
        merit: [{cat: neutral}]
      - id: second_chance
        text: "ขอให้หัวหน้าได้แก้ตัวสักครั้ง"
        outcomes:
          - {weight: 2, ok: true, text: "หัวหน้าคืนเงินครบ แล้วกลายเป็นคนที่ดันหลัง{ผม}มาตลอด", effects: {relations: 2, network: 2}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "หัวหน้ารอดตัวแล้วหันมาเล่นงานคนที่ช่วยไว้", effects: {happiness: -2, relations: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: blackmail
        text: "เอาแฟ้มไปขู่หัวหน้าแลกเงิน"
        outcomes:
          - {weight: 1, text: "หัวหน้ายอมจ่ายเงียบ ๆ ทุกเดือน", effects: {money: {unit: income_x, amount: 2}, happiness: -1}, merit: [{cat: greed_harm, level: 2}]}
          - {weight: 2, text: "หัวหน้าอัดเสียงไว้ทั้งหมด ถูกไล่ออกพร้อมประวัติด่างทั้งวงการ", effects: {income_mult: 0.6, happiness: -2, network: -2}, sets_flags: [caught_fraud], merit: [{cat: greed_harm, level: 2}]}
        merit: [{cat: greed_harm, level: 2}]

