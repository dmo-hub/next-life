    choices:
      - id: sell_recipe
        text: "ขายสูตรกับชื่อร้าน รับเงินก้อน"
        outcomes:
          - {weight: 2, ok: true, text: "เงินก้อนโตเข้าบัญชี เห็นป้ายร้านตัวเองทั่วเมือง", effects: {money: {unit: income_x, amount: 3}, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อ่านสัญญาไม่ละเอียด ห้ามขายกาแฟเองอีกห้าปี", effects: {money: {unit: income_x, amount: 1}, happiness: -2, income_mult: 0.8}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: second_branch
        text: "เปิดสาขาสองเองเลย"
        outcomes:
          - {weight: 1, ok: true, text: "สองสาขาคิวยาวพอกัน กลายเป็นเจ้าของร้านดังตัวจริง", effects: {happiness: 2, income_mult: 1.3}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ค่าเช่าสองที่กินกำไรหมด ต้องปิดสาขาใหม่ในครึ่งปี", effects: {happiness: -2, money: {unit: income_x, amount: -2}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: move_shop
        text: "ย้ายร้านไปทำเลค่าเช่าถูก"
        outcomes:
          - {weight: 2, ok: true, text: "ลูกค้าประจำขับรถตามไปซื้อถึงที่ใหม่", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ย้ายแล้วลูกค้าหาย ร้านเงียบเหมือนเริ่มใหม่", effects: {happiness: -1, income_mult: 0.8}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tenant_talk
        text: "ชวนลูกค้าประจำช่วยต่อรองค่าเช่า"
        outcomes:
          - {weight: 2, ok: true, text: "ลูกค้าประจำลงชื่อกันเต็มหน้า เจ้าของตึกยอมขึ้นแค่นิดเดียว", multipliers: {stats: {relations: 1.5}}, effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจ้าของตึกไม่สน ขึ้นเต็มเท่าตัวตามเดิม", effects: {happiness: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
