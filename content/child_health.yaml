# กองสุ่มวัยเด็ก หมวดโรคภัย/อุบัติเหตุ — ตัวเลือกเป็นสิ่งที่เด็กทำเอง ผู้ใหญ่รับมือในเนื้อความ/ผลลัพธ์ · ค่ารักษายังหักจากเงินบ้าน
events:
  - id: child_dengue_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    repeat: {gap: 3, max: 2}
    when: {age: [6, 12], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "ไข้สูงสามวันไม่ลด"
    text: "อายุ {อายุ} ขวบ ตัวร้อนจี๋ ปวดหัว มีจุดแดงขึ้นแขน ยุงลายในโอ่งหลังบ้านบินว่อน แม่เอามือแตะหน้าผากคุณแล้วหน้าเสีย รพ.รัฐคิวยาวถึงเช้า เอกชนก็แพงจนพ่อเงียบ"
    choices:
      - id: gov_hospital
        text: "บอกแม่ตรง ๆ ว่าปวดหัวจะแย่"
        effects: {health: 1, happiness: -1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: private_hospital
        text: "ร้องไห้จ้าจนพ่อรีบขับรถออกไป"
        requires: {money: {unit: income_x, amount: 0.8}, reason: "ที่บ้านไม่มีเงินพอ รพ.เอกชน"}
        effects: {health: 2, money: {unit: income_x, amount: -0.8}}
        merit: [{cat: neutral}]
      - id: herbal_home
        text: "ยอมกินบอระเพ็ดขม ๆ ของยาย"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "ไข้ลดเอง ยายภูมิใจในสูตรยาหม้อไปอีกสิบปี", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วันที่สี่ไข้ลดแต่ช็อก ผู้ใหญ่หามส่งห้องฉุกเฉินกลางดึก รอดหวุดหวิด", effects: {health: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: shop_pill
        text: "บอกว่าหายแล้ว จะออกไปวิ่งเล่น"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าข้างบ้านเห็นหน้าซีด ตะโกนเรียกแม่มาอุ้มไปหาหมอทันก่อนอาการทรุด", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไข้ขึ้นกลางห้อง เลือดกำเดาไหลไม่หยุด ต้องนอนโรงพยาบาลเป็นอาทิตย์", effects: {health: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: kill_larvae
        text: "ชี้โอ่งลูกน้ำให้ผู้ใหญ่ทั้งซอยดู"
        outcomes:
          - {weight: 2, ok: true, text: "ผู้ใหญ่ทั้งซอยคว่ำโอ่งตามที่คุณชี้ ปีนั้นไม่มีใครในซอยป่วยอีกเลย", effects: {health: 1, relations: 2, happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: help_others, level: 1}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "ผู้ใหญ่หาว่าเด็กยุ่งไม่เข้าเรื่อง โอ่งไม่มีใครคว่ำ แถมโดนนินทาไปทั้งซอย", effects: {health: 1, relations: -1, happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]

  - id: child_drown_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 10], family: [{role: parent, sex: หญิง, alive: true}]}
    title: "พลัดตกคลองหลังบ้าน"
    text: "อายุ {อายุ} ขวบ วิ่งไล่จับปลาแล้วลื่นตกคลอง ลุงข้างบ้านกระโดดลงไปคว้าขึ้นมาทัน ตัวเปียกโชก ไอสำลักน้ำ แม่วิ่งมากอดคุณตัวสั่น เรียก '{ชื่อ} {ชื่อ}' ไม่หยุด"
    choices:
      - id: swim_lessons
        text: "ขอแม่ไปเรียนว่ายน้ำให้เป็น"
        effects: {health: 1, happiness: 1, money: {unit: income_x, amount: -0.2}}
        sets_flags: [sporty]
        merit: [{cat: neutral}]
      - id: ban_water
        text: "กลัวน้ำ ไม่ยอมเข้าใกล้คลองอีก"
        effects: {happiness: -2, relations: -1}
        clears_flags: [sporty]
        merit: [{cat: neutral}]
      - id: lung_check
        text: "บอกแม่ว่าเจ็บหน้าอกตอนหายใจ"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "หมอเอกซเรย์แล้วปอดสะอาด ชมว่าลุงช่วยได้ไวมาก", effects: {money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หมอเจอปอดอักเสบจากน้ำคลองแต่เนิ่น ๆ ฉีดยาไม่กี่วันก็หาย", effects: {health: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: thank_uncle
        text: "เก็บขนมไปให้ลุงทุกวัน"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: dana, level: 1}]
      - id: let_play
        text: "แอบกลับไปเล่นน้ำคลองอีก"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {health: 1.3}}, text: "ตกบ่อยจนว่ายเป็นเอง กลายเป็นเจ้าแห่งคลองประจำซอย", effects: {health: 1, happiness: 1}, sets_flags: [sporty], merit: [{cat: neutral}]}
          - {weight: 2, text: "อาทิตย์ต่อมาจมซ้ำที่เดิม รอบนี้ไม่มีใครอยู่ใกล้ ลอยไปติดตอม่อถึงรอด", effects: {health: -3, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: child_tree_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [5, 12], family: [{role: parent, alive: true}]}
    title: "ตกต้นมะม่วง"
    text: "อายุ {อายุ} ขวบ ปีนขึ้นไปเก็บมะม่วงกิ่งบนสุด กิ่งหัก ร่วงลงมาแขนบวมเป่ง เพื่อน ๆ วิ่งไปตามพ่อแม่"
    choices:
      - id: folk_bonesetter
        text: "ยอมให้หมอพื้นบ้านดัดแขน"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "น้ำมันสมุนไพรกับเฝือกไม้ไผ่ หายดีในเดือนเดียว", effects: {health: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระดูกติดเบี้ยวนิด ๆ ยกแขนสุดไม่ได้ แต่ดันโยนลูกเปตองแม่นผิดคน", effects: {health: -2, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hospital_cast
        text: "กัดฟันไม่ร้องตอนหมอใส่เฝือก"
        effects: {health: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: tutor_instead
        text: "ใส่เฝือกแล้วนั่งอ่านหนังสือแทน"
        effects: {health: 1, knowledge: 2, happiness: -2, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: scold
        text: "ซ่อนแขนบวม บอกแม่ว่าไม่เป็นไร"
        requires: {family: [{role: parent, sex: หญิง, alive: true}]}
        effects: {health: -1, relations: -2}
        merit: [{cat: neutral}]
      - id: gymnastics
        text: "ปีนเก่งขนาดนี้ ขอเรียนยิมนาสติก"
        requires: {stats: {health: {min: 60}}, reason: "ร่างกายยังไม่แข็งแรงพอ"}
        outcomes:
          - {weight: 1, ok: true, text: "โค้ชยิมในเมืองตาลุก ได้ติดทีมเด็ก ถ้วยรางวัลเต็มตู้", next: child_gym_team_01, effects: {health: 1, happiness: 2}, sets_flags: [sporty], merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 1, text: "ซ้อมวันแรกล้มทับแขนข้างเดิม หักซ้ำจุดเดิม", effects: {health: -2, happiness: -1, money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: child_measles_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 8], school: [primary]}
    title: "หัดระบาดทั้งโรงเรียน"
    text: "อายุ {อายุ} ขวบ เพื่อนร่วมห้องขึ้นผื่นแดงไปครึ่งห้อง ครูนัดเด็กทุกคนไปฉีดวัคซีนที่อนามัย ข้างบ้านลือว่าฉีดแล้วไข้ขึ้น ส่วนคุณกลัวเข็มที่สุดในโลก"
    choices:
      - id: vaccinate
        text: "กัดฟันยื่นแขนให้หมอฉีด"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: keep_home
        text: "แกล้งปวดท้อง ไม่ยอมไปโรงเรียน"
        effects: {knowledge: -1, happiness: -1}
        merit: [{cat: neutral}]
      - id: measles_party
        text: "แอบไปเล่นกับเพื่อนที่เป็นหัด"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {health: 1.3}}, text: "ผื่นขึ้นสามวันแล้วหาย ข้างบ้านยกให้เป็นเด็กดวงแข็ง", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "หัดลงปอด นอนโรงพยาบาลจนเกือบไม่รอด ปอดไม่เหมือนเดิมอีกเลย", effects: {health: -3, chronic: {health: -1}, money: {unit: income_x, amount: -0.5}}, sets_flags: [weak_lungs], schedules: [{event: child_lungs_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: rally_parents
        text: "ชวนเพื่อนทั้งห้องไปฉีดด้วยกัน"
        outcomes:
          - {weight: 2, ok: true, text: "จูงมือกันไปฉีดทั้งแก๊ง ห้องนี้ไม่มีใครติดหัดอีกเลย", effects: {health: 1, relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "พ่อแม่เพื่อนบางบ้านไม่ให้ไป แล้วสั่งลูกไม่ให้เล่นกับคุณไปพักใหญ่", effects: {health: 1, relations: -2, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]

  - id: child_teeth_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    when: {age: [6, 12]}
    title: "ฟันผุจนแก้มบวม"
    text: "อายุ {อายุ} ขวบ ติดน้ำหวานกับลูกอมจนฟันดำเป็นแถบ คืนนี้ปวดฟันร้องไห้ทั้งคืน แก้มบวมข้างเดียวเหมือนอมไข่ไว้"
    choices:
      - id: pull_and_ban
        text: "ยอมถอนฟัน แล้วเลิกน้ำหวานเอง"
        effects: {health: 1, happiness: -2}
        merit: [{cat: neutral}]
      - id: private_dentist
        text: "งอแงขอไปหมอฟันคลินิกเอกชน"
        requires: {money: {unit: income_x, amount: 0.6}, reason: "ที่บ้านไม่มีเงินพอค่าคลินิก"}
        effects: {health: 1, happiness: 1, relations: 1, money: {unit: income_x, amount: -0.6}}
        merit: [{cat: neutral}]
      - id: wait_adult_teeth
        text: "ไม่ยอมอ้าปากให้ใครดูฟัน"
        outcomes:
          - {weight: 1, ok: true, text: "ฟันน้ำนมหลุดเอง ฟันแท้ขึ้นมาขาวสวยราวปาฏิหาริย์", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ฟันซี่ใหม่ผุตามติด ๆ ปวดจนกินข้าวไม่ลงไปหลายเดือน", effects: {health: -2, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: sell_candy
        text: "เอาลูกอมไปขายเพื่อน ๆ"
        outcomes:
          - {weight: 2, ok: true, text: "ขายดีจนเสียดายกำไร ไม่กล้ากินเองอีกเลย แต่ข่าวเริ่มไปถึงหูผู้ใหญ่", next: child_candy_shop_01, effects: {knowledge: 1, money: {unit: income_x, amount: 0.05}}, merit: [{cat: neutral}], multipliers: {stats: {knowledge: 2}}}
          - {weight: 1, text: "ขายไม่ออก เลยกินเองหมดถุง ฟันผุเพิ่มอีกสองซี่", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: brush_nightly
        text: "ยอมให้แม่แปรงฟันให้ทุกคืน"
        requires: {family: [{role: parent, sex: หญิง, alive: true}]}
        effects: {health: 1, relations: 1}
        merit: [{cat: neutral}]

  - id: child_asthma_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [6, 11], family: [{role: parent, sex: หญิง, alive: true}]}
    title: "หอบทุกหน้าหนาว"
    text: "อายุ {อายุ} ขวบ ไอหอบหวีดทุกครั้งที่ฝุ่นควันลง หมอบอกแม่ว่าคุณเป็นหอบหืดกับภูมิแพ้ ต้องอยู่กับมันไปอีกนาน"
    choices:
      - id: inhaler
        text: "พกยาพ่นติดตัวทุกวัน ไม่ลืม"
        effects: {health: 1, happiness: -1, money: {unit: income_x, amount: -0.2}}
        merit: [{cat: neutral}]
      - id: move_house
        text: "ขอไปอยู่กับยายที่อากาศดี"
        effects: {health: 2, relations: -2, happiness: -1}
        merit: [{cat: neutral}]
      - id: swim_lungs
        text: "ขอไปว่ายน้ำฝึกปอด"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.5}}, text: "ปอดแข็งแรงขึ้นจนลืมไปเลยว่าเคยหอบ ได้เหรียญว่ายน้ำมาด้วย", effects: {health: 2}, sets_flags: [sporty], merit: [{cat: neutral}]}
          - {weight: 1, text: "กลิ่นคลอรีนในสระกระตุ้นหอบหนักกว่าเดิม ต้องเลิกกลางคัน", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: grandma_remedy
        text: "ยอมกินยาหม้อสูตรยาย"
        outcomes:
          - {weight: 1, ok: true, text: "อาการเบาลงจริง ไม่มีใครรู้ว่าเพราะยาหรือเพราะหน้าหนาวหมด", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไม่ดีขึ้นเลย หอบติดตัวเป็นโรคประจำตัวไปอีกนาน", effects: {health: -1, chronic: {health: -1}}, sets_flags: [weak_lungs], schedules: [{event: child_lungs_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_outgrow
        text: "แอบทิ้งยาพ่น บอกว่าไม่เป็นไร"
        outcomes:
          - {weight: 1, ok: true, text: "พอโตขึ้นอีกหน่อยก็หายเกลี้ยง เหมือนหมอพูดเกินจริง", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หอบหนักกลางดึก ต้องพ่นยาในห้องฉุกเฉิน", effects: {health: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ใบต่อเนื่องของผลเรื้อรังปอด (หอบติดตัว / หัดลงปอด) — นัดมาปีถัดไป ตัวเลือกส่วนใหญ่กลับทิศ chronic ได้
  - id: child_lungs_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    when: {flags: {has: [weak_lungs]}}
    title: "ปอดยังไม่หายดี"
    text: "อายุ {อายุ} ขวบ ไอหอบตอนกลางคืนไม่หยุดตั้งแต่ป่วยหนักเมื่อปีก่อน หมอเตือนว่าถ้าไม่ดูแลจริงจังตอนนี้ จะติดตัวไปจนโต"
    choices:
      - id: specialist
        text: "ยอมไปหาหมอปอดทุกเดือน ไม่งอแง"
        effects: {health: 1, chronic: {health: 1}, money: {unit: income_x, amount: -0.5}}
        clears_flags: [weak_lungs]
        merit: [{cat: neutral}]
      - id: daily_inhaler
        text: "พ่นยาเองทุกวัน ไม่ขาดสักวัน"
        effects: {happiness: -1, chronic: {health: 1}, money: {unit: income_x, amount: -0.2}}
        clears_flags: [weak_lungs]
        merit: [{cat: neutral}]
      - id: swim_team
        text: "สมัครชมรมว่ายน้ำฝึกปอดเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ปีเดียวปอดแข็งแรงกว่าเด็กรุ่นเดียวกัน โค้ชดึงเข้าทีมว่ายน้ำ", effects: {health: 1, chronic: {health: 1}}, sets_flags: [sporty], merit: [{cat: neutral}], multipliers: {stats: {health: 1.5}, flags: {sporty: 2}}}
          - {weight: 1, text: "หอบกลางสระจนโค้ชต้องกระโดดลงไปช่วย ต้องเลิกว่ายไปเลย", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: herbal_again
        text: "อ้อนยายต้มยาหม้อสูตรเดิม"
