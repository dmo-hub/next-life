# กองสุ่มวัยเด็ก หมวดโรคภัย/อุบัติเหตุ — ครอบครัวเลือกวิธีรักษา ผลตกที่ตัวละคร
events:
  - id: child_dengue_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    repeat: {gap: 3, max: 2}
    when: {age: [3, 12]}
    title: "ไข้สูงสามวันไม่ลด"
    text: "อายุ {อายุ} ขวบ ตัวร้อนจี๋ ปวดหัว มีจุดแดงขึ้นแขน ยุงลายในโอ่งหลังบ้านบินว่อน ที่บ้านต้องตัดสินใจคืนนี้"
    choices:
      - id: gov_hospital
        text: "แบกไป รพ.รัฐ รอคิวทั้งคืน"
        effects: {health: 1, happiness: -1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: private_hospital
        text: "รีบไป รพ.เอกชน ไม่สนราคา"
        requires: {money: {unit: income_x, amount: 0.8}}
        effects: {health: 2, money: {unit: income_x, amount: -0.8}}
        merit: [{cat: neutral}]
      - id: herbal_home
        text: "ต้มบอระเพ็ดให้กิน นอนพักที่บ้าน"
        outcomes:
          - {weight: 2, text: "ไข้ลดเอง ยายภูมิใจในสูตรยาหม้อไปอีกสิบปี", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วันที่สี่ไข้ลดแต่ช็อก หามส่งห้องฉุกเฉินกลางดึก รอดหวุดหวิด", effects: {health: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: shop_pill
        text: "ซื้อยาแก้ปวดร้านชำให้กิน"
        outcomes:
          - {weight: 1, text: "คนขายยาถามอาการแล้วเปลี่ยนยาให้ทันก่อนเลือดออก", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ยาผิดตัว เลือดกำเดาไหลไม่หยุด ต้องนอนโรงพยาบาลเป็นอาทิตย์", effects: {health: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: kill_larvae
        text: "ไป รพ. แล้วชวนทั้งซอยคว่ำโอ่ง"
        outcomes:
          - {weight: 2, text: "เดินเคาะประตูทั้งซอยจนขาลาก แต่ปีนั้นไม่มีใครในซอยป่วยอีกเลย", effects: {health: 1, relations: 2, happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: help_others, level: 1}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "เพื่อนบ้านหาว่ายุ่งไม่เข้าเรื่อง โอ่งไม่มีใครคว่ำ แถมโดนนินทาไปทั้งซอย", effects: {health: 1, relations: -1, happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]

  - id: child_drown_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [3, 10]}
    title: "พลัดตกคลองหลังบ้าน"
    text: "อายุ {อายุ} ขวบ วิ่งไล่จับปลาแล้วลื่นตกคลอง ลุงข้างบ้านกระโดดลงไปคว้าขึ้นมาทัน ตัวเปียกโชก ไอสำลักน้ำ ทั้งบ้านขวัญหาย"
    choices:
      - id: swim_lessons
        text: "ส่งเรียนว่ายน้ำจริงจัง"
        effects: {health: 1, happiness: 1, money: {unit: income_x, amount: -0.2}}
        sets_flags: [sporty]
        merit: [{cat: neutral}]
      - id: ban_water
        text: "ห้ามแตะน้ำ ห้ามเล่นโลดโผนเด็ดขาด"
        effects: {happiness: -2, relations: -1}
        clears_flags: [sporty]
        merit: [{cat: neutral}]
      - id: lung_check
        text: "พาไปเอกซเรย์ปอดให้ชัวร์"
        outcomes:
          - {weight: 2, text: "ปอดสะอาด หมอชมว่าลุงช่วยได้ไวมาก", effects: {money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจอปอดอักเสบจากน้ำคลองแต่เนิ่น ๆ ฉีดยาไม่กี่วันก็หาย", effects: {health: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: thank_uncle
        text: "ยกกับข้าวไปขอบคุณลุงทุกเดือน"
        effects: {relations: 2, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: dana, level: 1}]
      - id: let_play
        text: "เด็กก็งี้ ปล่อยเล่นน้ำต่อ"
        outcomes:
          - {weight: 1, text: "ตกบ่อยจนว่ายเป็นเอง กลายเป็นเจ้าแห่งคลองประจำซอย", effects: {health: 1, happiness: 1}, sets_flags: [sporty], merit: [{cat: neutral}]}
          - {weight: 2, text: "อาทิตย์ต่อมาจมซ้ำที่เดิม รอบนี้ไม่มีใครอยู่ใกล้ ลอยไปติดตอม่อถึงรอด", effects: {health: -3, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: child_tree_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [5, 12]}
    title: "ตกต้นมะม่วง"
    text: "อายุ {อายุ} ขวบ ปีนขึ้นไปเก็บมะม่วงกิ่งบนสุด กิ่งหัก ร่วงลงมาแขนบวมเป่ง เพื่อน ๆ วิ่งไปตามพ่อแม่"
    choices:
      - id: folk_bonesetter
        text: "พาไปหมอต่อกระดูกพื้นบ้าน"
        outcomes:
          - {weight: 2, text: "น้ำมันสมุนไพรกับเฝือกไม้ไผ่ หายดีในเดือนเดียว", effects: {health: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระดูกติดเบี้ยวนิด ๆ ยกแขนสุดไม่ได้ แต่ดันโยนลูกเปตองแม่นผิดคน", effects: {health: -2, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hospital_cast
        text: "ไปโรงพยาบาลใส่เฝือก"
        effects: {health: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: tutor_instead
        text: "ใส่เฝือกแล้วส่งเรียนพิเศษแทน"
        effects: {health: 1, knowledge: 2, happiness: -2, money: {unit: income_x, amount: -0.5}}
        merit: [{cat: neutral}]
      - id: scold
        text: "ดุจนร้องไห้ แล้วทาขมิ้นเอา"
        effects: {health: -1, relations: -2}
        merit: [{cat: neutral}]
      - id: gymnastics
        text: "ปีนเก่งขนาดนี้ ส่งไปยิมนาสติก"
        requires: {stats: {health: {min: 60}}, reason: "ร่างกายยังไม่แข็งแรงพอ"}
        outcomes:
          - {weight: 1, text: "ครูพละตาลุก ได้ติดทีมโรงเรียน ถ้วยรางวัลเต็มตู้", effects: {health: 1, happiness: 2}, sets_flags: [sporty], merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 1, text: "ซ้อมวันแรกล้มทับแขนข้างเดิม หักซ้ำจุดเดิม", effects: {health: -2, happiness: -1, money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: child_measles_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [4, 8]}
    title: "หัดระบาดทั้งโรงเรียน"
    text: "อายุ {อายุ} ขวบ เพื่อนร่วมห้องขึ้นผื่นแดงไปครึ่งห้อง ครูประกาศให้ผู้ปกครองพาเด็กไปฉีดวัคซีน แต่ข้างบ้านลือว่าฉีดแล้วไข้ขึ้น"
    choices:
      - id: vaccinate
        text: "พาไปฉีดวัคซีนที่อนามัยเลย"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: keep_home
        text: "ให้หยุดเรียนขังไว้ในบ้าน"
        effects: {knowledge: -1, happiness: -1}
        merit: [{cat: neutral}]
      - id: measles_party
        text: "ให้ติดจากเพื่อนซะ จะได้จบ ๆ"
        outcomes:
          - {weight: 1, text: "ผื่นขึ้นสามวันแล้วหาย ข้างบ้านยกให้เป็นเด็กดวงแข็ง", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "หัดลงปอด นอนโรงพยาบาลจนเกือบไม่รอด ปอดไม่เหมือนเดิมอีกเลย", effects: {health: -3, chronic: {health: -1}, money: {unit: income_x, amount: -0.5}}, sets_flags: [weak_lungs], schedules: [{event: child_lungs_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: rally_parents
        text: "ชวนผู้ปกครองทั้งห้องไปฉีดด้วยกัน"
        outcomes:
          - {weight: 2, text: "โทรตามทีละบ้านจนเหนื่อย แต่ห้องนี้ไม่มีใครติดหัดอีกเลย", effects: {health: 1, relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "โดนผู้ปกครองสายต้านวัคซีนด่ากลางกลุ่มแชต ลูกโดนเพื่อนเมินไปพักใหญ่", effects: {health: 1, relations: -2, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]

  - id: child_teeth_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    when: {age: [3, 12]}
    title: "ฟันผุจนแก้มบวม"
    text: "อายุ {อายุ} ขวบ ติดน้ำหวานกับลูกอมจนฟันดำเป็นแถบ คืนนี้ปวดฟันร้องไห้ทั้งคืน แก้มบวมข้างเดียวเหมือนอมไข่ไว้"
    choices:
      - id: pull_and_ban
        text: "ถอนฟันแล้วงดน้ำหวานเด็ดขาด"
        effects: {health: 1, happiness: -2}
        merit: [{cat: neutral}]
      - id: private_dentist
        text: "ทำฟันคลินิกแพง ๆ พร้อมจัดฟัน"
        requires: {money: {unit: income_x, amount: 0.6}}
        effects: {health: 1, happiness: 1, relations: 1, money: {unit: income_x, amount: -0.6}}
        merit: [{cat: neutral}]
      - id: wait_adult_teeth
        text: "ช่างมัน เดี๋ยวฟันแท้ก็ขึ้น"
        outcomes:
          - {weight: 1, text: "ฟันน้ำนมหลุดเอง ฟันแท้ขึ้นมาขาวสวยราวปาฏิหาริย์", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ฟันแท้ผุตามติด ๆ ปวดจนเรียนไม่รู้เรื่องไปทั้งเทอม", effects: {health: -2, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: sell_candy
        text: "ให้เอาลูกอมไปขายที่โรงเรียน"
        outcomes:
          - {weight: 2, text: "ขายดีจนเสียดายกำไร ไม่กล้ากินเองอีกเลย", effects: {knowledge: 1, money: {unit: income_x, amount: 0.05}}, merit: [{cat: neutral}], multipliers: {stats: {knowledge: 2}}}
          - {weight: 1, text: "ขายไม่ออก เลยกินเองหมดถุง ฟันผุเพิ่มอีกสองซี่", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: brush_nightly
        text: "กินได้ แต่พ่อแม่แปรงให้ทุกคืน"
        effects: {health: 1, relations: 1}
        merit: [{cat: neutral}]

  - id: child_asthma_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 2
    when: {age: [2, 11]}
    title: "หอบทุกหน้าหนาว"
    text: "อายุ {อายุ} ขวบ ไอหอบหวีดทุกครั้งที่ฝุ่นควันลง หมอบอกว่าเป็นหอบหืดกับภูมิแพ้ ต้องเลือกว่าจะสู้กับมันแบบไหน"
    choices:
      - id: inhaler
        text: "พกยาพ่นตามหมอสั่งทุกวัน"
        effects: {health: 1, money: {unit: income_x, amount: -0.2}}
        merit: [{cat: neutral}]
      - id: move_house
        text: "ขายบ้านย้ายไปอยู่ที่อากาศดี"
        requires: {money: {unit: income_x, amount: 1}}
        effects: {health: 2, relations: -2, money: {unit: income_x, amount: -1}}
        merit: [{cat: neutral}]
      - id: swim_lungs
        text: "ให้ว่ายน้ำฝึกปอด"
        outcomes:
          - {weight: 2, text: "ปอดแข็งแรงขึ้นจนลืมไปเลยว่าเคยหอบ ได้เหรียญว่ายน้ำมาด้วย", effects: {health: 2}, sets_flags: [sporty], merit: [{cat: neutral}]}
          - {weight: 1, text: "กลิ่นคลอรีนในสระกระตุ้นหอบหนักกว่าเดิม ต้องเลิกกลางคัน", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: grandma_remedy
        text: "ต้มยาหม้อตามสูตรยาย"
        outcomes:
          - {weight: 1, text: "อาการเบาลงจริง ไม่มีใครรู้ว่าเพราะยาหรือเพราะหน้าหนาวหมด", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไม่ดีขึ้นเลย หอบติดตัวเป็นโรคประจำตัวไปอีกนาน", effects: {health: -1, chronic: {health: -1}}, sets_flags: [weak_lungs], schedules: [{event: child_lungs_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_outgrow
        text: "รอโตก่อน เดี๋ยวก็หายเอง"
        outcomes:
          - {weight: 1, text: "พอโตขึ้นอีกหน่อยก็หายเกลี้ยง เหมือนหมอพูดเกินจริง", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หอบหนักกลางดึก ต้องพ่นยาในห้องฉุกเฉิน", effects: {health: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ใบต่อเนื่องของผลเรื้อรังปอด (หอบติดตัว / หัดลงปอด) — นัดมาปีถัดไป ตัวเลือกส่วนใหญ่กลับทิศ chronic ได้
  - id: child_lungs_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    when: {flags: {has: [weak_lungs]}}
    title: "ปอดยังไม่หายดี"
    text: "อายุ {อายุ} ขวบ ไอหอบตอนกลางคืนไม่หยุดตั้งแต่ป่วยหนักเมื่อปีก่อน หมอเตือนว่าถ้าไม่ดูแลจริงจังตอนนี้ จะติดตัวไปจนโต"
    choices:
      - id: specialist
        text: "พาไปหาหมอเฉพาะทางปอดเด็ก"
        effects: {health: 1, chronic: {health: 1}, money: {unit: income_x, amount: -0.5}}
        clears_flags: [weak_lungs]
        merit: [{cat: neutral}]
      - id: daily_inhaler
        text: "พ่นยาทุกวัน ห้ามขาดแม้วันเดียว"
        effects: {happiness: -1, chronic: {health: 1}, money: {unit: income_x, amount: -0.2}}
        clears_flags: [weak_lungs]
        merit: [{cat: neutral}]
      - id: swim_team
        text: "ส่งเข้าชมรมว่ายน้ำฝึกปอด"
        outcomes:
          - {weight: 1, text: "ปีเดียวปอดแข็งแรงกว่าเด็กทั้งห้อง ครูดึงเข้าทีมโรงเรียน", effects: {health: 1, chronic: {health: 1}}, sets_flags: [sporty], merit: [{cat: neutral}], multipliers: {flags: {sporty: 2}}}
          - {weight: 1, text: "หอบกลางสระจนครูต้องกระโดดลงไปช่วย ต้องเลิกว่ายไปเลย", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: herbal_again
        text: "กลับไปพึ่งยาหม้อสูตรเดิม"
        outcomes:
          - {weight: 1, text: "หน้าหนาวปีนี้ฝุ่นน้อย อาการเลยซาไปเองแบบไม่มีใครอธิบายได้", effects: {happiness: 1, chronic: {health: 1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "หอบหนักจนต้องเข้าห้องฉุกเฉินสองรอบในเดือนเดียว", effects: {health: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: live_with_it
        text: "ปล่อยให้ใช้ชีวิตปกติ ไม่ห้ามอะไร"
        effects: {health: -1, happiness: 2}
        merit: [{cat: neutral}]
