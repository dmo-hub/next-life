      - id: gig_we_back_01
        text: "ไปนั่งวินซอยหลังแทน"
        effects: {money: {unit: income_x, amount: -0.5}, happiness: 1}
        merit: [{cat: neutral}]
      - id: gig_we_skip_01
        text: "ไม่เข้าวิน หางานส่งของแทน"
        effects: {knowledge: 1, network: -1}
        merit: [{cat: neutral}]
      - id: gig_we_curry_01
        text: "เสนอจ่ายเป็นแกงถุงทุกเที่ยง"
        outcomes:
          - {weight: 1, ok: true, text: "หัวหน้าวินชิมแล้วนิ่งไปนาน ก่อนตกลงลดค่าเข้าลงครึ่งหนึ่ง แลกแกงทุกเที่ยงหนึ่งปี", effects: {money: {unit: income_x, amount: -0.4}, relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หัวหน้าวินบอกว่าเงินกินได้ ส่วนแกงนี่กินไม่ลง คนทั้งวินจำคุณได้ในชื่อคนแกงเค็ม", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

