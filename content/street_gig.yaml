          - {weight: 1, text: "คนสั่งหน้าใหม่ได้ยินว่าต้องมัดจำ ก็หันไปใช้คนส่งเจ้าอื่นสองบ้าน", effects: {relations: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
