    text: "งานชะงักมาสามอาทิตย์ เงินงวดจากเจ้าของโครงการยังไม่ออก ชุดช่างของคุณมีแปดคน ค่าแรงรับกันเป็นรายวันมาตลอด เย็นวันศุกร์พวกเขายืนรอหน้าเพิงอย่างเงียบ ๆ เงินที่คุณเก็บไว้ซ่อมหลังคาพอจ่ายได้รอบหนึ่งพอดี"
    choices:
      - id: gig_fp_pay_01
        text: "ควักจ่ายให้ครบทุกคน"
        outcomes:
          - {weight: 1, ok: true, text: "เงินงวดออกในเดือนถัดมา ทั้งชุดอยู่ด้วยกันจนจบงาน แถมมาซ่อมหลังคาให้ฟรีหนึ่งเสาร์", effects: {relations: 2, network: 1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: help_others, level: 2}]}
          - {weight: 1, text: "เงินงวดเลื่อนต่ออีกสองเดือน ฝนแรกตกในบ้านคุณทั้งคืน", effects: {relations: 1, happiness: -2, money: {unit: income_x, amount: -0.06}}, merit: [{cat: help_others, level: 2}]}
        merit: [{cat: help_others, level: 2}]
      - id: gig_fp_half_01
        text: "จ่ายครึ่งหนึ่ง ที่เหลือบอกตามตรง"
        effects: {relations: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: gig_fp_owner_01
        text: "ไปนั่งรอเจ้าของโครงการถึงที่"
        outcomes:
          - {weight: 1, ok: true, text: "นั่งตั้งแต่เช้าจนคนในสำนักงานชงกาแฟให้ เจ้าของยอมเซ็นงวดย่อยให้ก้อนหนึ่ง", effects: {money: {unit: income_x, amount: 0.02}, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจ้าของไม่อยู่สามวันติด คุณเริ่มรู้จักยามทุกคนในตึก", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_fp_tell_01
        text: "บอกทุกคนว่ายังไม่มีเงิน"
        effects: {relations: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: gig_fp_porridge_01
        text: "ตั้งหม้อข้าวต้มเลี้ยงก่อนบอกข่าว"
        outcomes:
          - {weight: 1, ok: true, text: "อิ่มแล้วทุกคนฟังจบโดยไม่มีใครลุก ช่างปูนถามว่าข้าวต้มหม้อนี้จะหักจากค่าแรงไหม", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทุกคนคิดว่าเลี้ยงฉลองเงินงวดออก พอรู้ความจริงข้าวต้มก็จืดลงทันที", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_gone_excuse_01
    type: A
    category: health
    stage: ชรา
    years: [2500, 2650]
    weight: 0.25
    when: {age: [60, 70]}
    title: "น้ำมันจะหมด ส่งรถไม่ทัน"
    text: "หมอนัดเจาะเลือดตอนเช้า ลุงคนขับเจ้าเก่าหน้าปากซอยที่คุณนั่งมาหลายสิบปี ยังใช้ข้ออ้างเดิม น้ำมันจะหมด ส่งรถไม่ทัน ชุดนี้คุณฟังมาตั้งแต่ยังหนุ่มยังสาว เช้านี้ปากซอยมีคันเขาคันเดียว เข่าเริ่มล้า เวลานัดเหลืออีกครึ่งชั่วโมง"
    choices:
      - id: gig_ge_extra_01
        text: "บวกค่ารถให้ลุงอีกหน่อย"
        outcomes:
          - {weight: 1, ok: true, text: "น้ำมันมีพอไปถึงโรงพยาบาลพอดีอย่างน่าอัศจรรย์ คุณถึงก่อนหมอ", effects: {health: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงรับเงินแล้วไปส่งครึ่งทาง บอกว่าคราวนี้น้ำมันจะหมดจริง คุณถึงตอนพยาบาลเก็บเข็ม", effects: {health: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_ge_debt_01
        text: "ทวงว่านั่งคันลุงมาหลายสิบปี"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงเงียบไปพักหนึ่ง แล้วบอกว่าขึ้นมา น้ำมันเมื่อกี้คงเพิ่งนึกได้ว่ายังมี", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงทวงกลับว่าสมัยก่อนคุณยังติดค่ารถอยู่สองเที่ยว นัดหมอต้องเลื่อนไปอีกอาทิตย์", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_ge_bus_01
        text: "เดินไปต่อรถประจำทาง"
        effects: {health: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: gig_ge_neighbor_01
        text: "วานคนข้างบ้านไปส่ง"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: gig_ge_ledger_01
        text: "กางสมุดจดข้ออ้างให้ลุงดู"
        outcomes:
          - {weight: 1, ok: true, text: "ข้ออ้างหลายสิบปีเรียงตามวันที่ ลุงอ่านแล้วหัวเราะจนต้องสตาร์ตรถ คุณถึงก่อนหมอ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงขอยืมสมุดไปหาข้ออ้างที่ยังไม่เคยใช้ คุณยืนรอจนเลยเวลานัด", effects: {happiness: 1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_curry_cart_01
    type: A
    category: society
    stage: ชรา
    years: [2500, 2650]
    weight: 0.25
    when: {age: [64, 80], occupation: [service, labor]}
    title: "ขายจนจำปีไม่ได้"
    text: "รถเข็นข้าวแกงของคุณจอดริมทางนานจนจำไม่ได้ว่ากี่ปี จำได้แค่ว่าตรงนี้เคยมีโรงหนังสองโรง ลูกค้ารุ่นแรกพาหลานมากินแล้ว เช้านี้เจ้าหน้าที่มาแจ้งว่าริมทางจะห้ามขาย ที่ในตลาดก็ต้องจ่ายค่าเช่า ซึ่งคุณไม่มีเก็บไว้"
    choices:
      - id: gig_cc_rent_01
        text: "กัดฟันเช่าแผงในตลาด"
        outcomes:
          - {weight: 1, ok: true, text: "คนกินเก่าตามเข้ามาถึงในตลาด เดินวนสามรอบกว่าจะเจอ แต่ก็เจอ", effects: {relations: 2, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แผงในตลาดอยู่ลึกจนแม้แต่คุณยังหลงตอนเช้า ขายไม่พอค่าเช่า", effects: {happiness: -2, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_cc_close_01
        text: "ปิดรถเข็น พักเสียที"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: gig_cc_teach_01
        text: "สอนสูตรแกงให้เด็กล้างจาน"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - id: gig_cc_petition_01
        text: "ล่ารายชื่อคนกินขออยู่ต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "รายชื่อยาวสี่หน้า เจ้าหน้าที่ขยับจุดตั้งรถเข็นไปหลังเสาไฟให้ แล้วเงียบไป", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้ชื่อมาสี่หน้า ครึ่งหนึ่งเขียนว่าขอแกงส้มเพิ่ม", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_cc_farewell_01
        text: "ติดป้ายอำลาแล้วขายวันละหม้อใหญ่"
        outcomes:
          - {weight: 1, ok: true, text: "คนเก่าแห่มาจนเจ้าหน้าที่ต้องต่อคิวซื้อเอง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้ายสวยเกินจนคนคิดว่าเป็นร้านเปิดใหม่", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
