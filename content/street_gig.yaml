        text: "ตะโกนชื่อกับข้าวให้ทั่วซอย"
        outcomes:
          - {weight: 1, ok: true, text: "คนข้างบ้านโผล่หน้ามาขอซื้อต่อ บอกว่าฟังแล้วหิวขึ้นมาทันที", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทั้งซอยรู้ว่าบ้านนั้นสั่งอะไร แต่ไม่มีใครรู้ว่าเจ้าของไปไหน", effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_win_entry_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [26, 30], occupation: [labor, service, craft]}
    title: "ค่าเข้าวินผ่อนได้ไหม"
    text: "วินหน้าตลาดเหลือเสื้ออยู่ตัวเดียว หัวหน้าวินบอกว่าใครจะมานั่งคิวต้องจ่ายค่าเข้าก่อน ย่านรถเยอะก็แพงตามย่าน ก้อนนี้เท่ากับเงินเก็บของคุณทั้งปี วินซอยหลังราคาครึ่งเดียว แต่ทั้งวันมีคนเดินผ่านไม่ถึงสิบ"
