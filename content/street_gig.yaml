# ร่างเรื่อง งานหาเช้ากินค่ำ · ลงเกมแล้ว ใบ 245 จากร่าง 244 · ผ่าน workflow ใบ 244
# ร่างเรื่อง งานหาเช้ากินค่ำ · 15 ใบ · ยังไม่ลงเกม · แก้ตามข้อค้านรอบ 1 · การ์ดที่อ้างงานประจำกั้นด้วย when.occupation · ไม่ใส่จำนวนเงินเป็นบาท · ไม่ตั้งธงใหม่
events:
  - id: gig_no_holiday_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [5, 12]}
    title: "ป้าขายขนมไม่เคยหยุด"
    text: "วันหยุดยาวถนนหน้าบ้านเงียบกริบ มีแค่ป้าขายขนมปากซอยที่ยังตั้งถาดเหมือนทุกวัน ป้าบอกว่าขายแบบนี้จนส่งลูกเรียนจบปริญญาไปคนหนึ่งแล้ว วันนี้ขนมยังเหลือเต็มถาด ป้าเหลือบมองคุณที่ยืนว่างอยู่ตรงนั้น"
    choices:
      - id: gig_nh_wrap_01
        text: "ช่วยป้าห่อขนมจนเย็น"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าสอนพับใบตองไม่ให้มุมรั่ว ขากลับได้ขนมห่อโตกว่าที่เคยซื้อ", effects: {relations: 1, knowledge: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "คุณห่อจนมุมบานทุกชิ้น ป้ายิ้มแล้วแอบห่อใหม่ตอนคุณหันหลัง", effects: {happiness: 1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: gig_nh_ask_01
        text: "ถามป้าว่าทำไมไม่หยุดบ้าง"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: gig_nh_play_01
        text: "วิ่งไปเล่นกับเพื่อนต่อ"
        effects: {happiness: 2}
        merit: [{cat: neutral}]
      - id: gig_nh_rival_01
        text: "ตั้งโต๊ะขายน้ำเปล่าแข่งกับป้า"
        outcomes:
          - {weight: 1, ok: true, text: "ขายได้แก้วเดียวให้ป้า ป้าจ่ายเป็นขนมหนึ่งห่อ คุณประกาศตัวเป็นเถ้าแก่ทันที", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แดดเปรี้ยงจนคุณดื่มน้ำหมดโต๊ะเอง กิจการปิดก่อนเที่ยง", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_stall_pack_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [16, 18]}
    title: "เก็บแผงตอนตลาดวาย"
    text: "ปิดเทอมคุณไปช่วยป้าข้างบ้านเก็บแผงตอนตลาดวายกับรุ่นพี่ในซอย พับผ้าใบ ยกลังขึ้นรถ เสร็จราวสี่ทุ่ม ป้าให้เป็นค่าขนมทุกคืน คืนนี้ลังเสื้อใบหนึ่งหล่นลงแอ่งน้ำ ไม่มีใครเห็นนอกจากคุณ"
    choices:
      - id: gig_sp_tell_01
        text: "บอกป้าตรง ๆ ว่าลังเปียก"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าบ่นสามประโยค แล้วบอกว่าช่วยกันมาตั้งนานเพิ่งมีคนบอก คืนต่อมาเรียกคุณก่อนใคร", effects: {relations: 2}, merit: [{cat: sila, level: 1}]}
          - {weight: 1, text: "ป้าหน้าบึ้งทั้งคืน คุณเกรงใจเลยขอเอาเสื้อทั้งลังกลับไปซักที่บ้าน", effects: {health: -1, knowledge: 1}, merit: [{cat: sila, level: 1}]}
        merit: [{cat: sila, level: 1}]
      - id: gig_sp_dry_01
        text: "เอาเสื้อไปผึ่ง ไม่บอกใคร"
        outcomes:
          - {weight: 1, ok: true, text: "เช้ามืดเสื้อแห้งพอดี ไม่มีใครรู้ แต่คุณแทบไม่ได้นอน", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าดมเสื้อเหม็นอับตั้งแต่ตัวแรก คนช่วยเก็บแผงทุกคนหันมามองกันเอง", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_sp_elder_01
        text: "ถามรุ่นพี่ว่าเคยเจอแบบนี้ไหม"
        effects: {network: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: gig_sp_dance_01
        text: "ถือลังเต้นหน้าพัดลมไล่น้ำ"
        outcomes:
          - {weight: 1, ok: true, text: "รุ่นพี่หัวเราะจนต้องวางของ แล้วมาช่วยกันสะบัดเสื้อทีละตัว", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลังหลุดมือ ลอยไปกระแทกพัดลมของป้าจนใบพัดเบี้ยว", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_four_houses_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 15]}
    title: "สี่บ้านในรอบเดียว"
    text: "ปิดเทอมคุณมาช่วยร้านก๋วยเตี๋ยวส่งของ เย็นนี้มีคนสั่งพร้อมกันสี่บ้าน เถ้าแก่แขวนถุงจนแฮนด์จักรยานเอียง ค่าขนมคิดเป็นเที่ยว ไม่ได้คิดเป็นบ้าน บ้านแรกอยู่ปากซอย บ้านสุดท้ายอยู่ข้ามคลอง แล้วถุงแรกก็เริ่มมีน้ำซุปซึม"
    choices:
      - id: gig_fh_far_01
        text: "ไปบ้านไกลก่อน แล้วย้อนกลับ"
        outcomes:
          - {weight: 1, ok: true, text: "บ้านข้ามคลองได้ของร้อน ๆ บอกเถ้าแก่ว่าเด็กคนนี้ใช้ได้", effects: {relations: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ย้อนกลับมาถึงปากซอย บ้านแรกยืนกอดอกรออยู่หน้าประตู", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_fh_near_01
        text: "ไล่จากบ้านใกล้ไปบ้านไกล"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: gig_fh_split_01
        text: "ขอเถ้าแก่แบ่งเป็นสองเที่ยว"
        outcomes:
          - {weight: 1, ok: true, text: "เถ้าแก่ทำหน้าเหมือนเสียเงิน แต่พอไม่มีใครบ่นเรื่องน้ำซุป ก็ให้ทำแบบนี้ทุกวัน", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เถ้าแก่บอกว่าสมัยก่อนหกบ้านยังไปได้ แล้วเล่าเรื่องนั้นจนเลยเวลาปิดร้าน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_fh_tip_01
        text: "เรียงตามบ้านที่ให้ทิปเก่ง"
        outcomes:
          - {weight: 1, ok: true, text: "บ้านทิปเก่งได้ก่อน วันนี้ทิปดีเป็นพิเศษ คุณเริ่มจดลงสมุดอย่างจริงจัง", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บ้านทิปเก่งสั่งไปแค่น้ำเปล่าถุงเดียว ส่วนสามบ้านที่เหลือรอจนเส้นอืด", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_fh_song_01
        text: "ร้องเพลงที่อยู่แล้วถีบเต็มแรง"
        outcomes:
          - {weight: 1, ok: true, text: "จบเพลงพอดีหน้าบ้านสุดท้าย ครบทุกถุง บ้านข้ามคลองขอให้ร้องอีกรอบ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร้องเพลินจนสลับท่อน บ้านแรกได้เย็นตาโฟของบ้านข้ามคลอง ส่วนบ้านข้ามคลองได้เพลงไปฟรี ๆ", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_queue_turn_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [19, 23], occupation: [labor, service, craft]}
    title: "ยายคนนี้ขึ้นแต่คันคุณ"
    text: "เดือนแรกที่มานั่งคิวรถรับจ้างปากซอย กติกามีข้อเดียว รายได้ต้องหมุนเวียนถึงทุกคน ใครหัวแถวคนนั้นไป แต่ยายบ้านปลายซอยเดินผ่านหัวแถวมายืนข้างคันคุณ บอกว่าขับนิ่มดี หัวแถววันนี้คือพี่ที่สอนงานคุณมาเอง"
    choices:
      - id: gig_qt_pass_01
        text: "เชิญยายขึ้นคันหัวแถว"
        outcomes:
          - {weight: 1, ok: true, text: "พี่หัวแถวพยักหน้าเงียบ ๆ ยายบ่นตลอดทาง แต่เย็นนั้นคนทั้งคิวเรียกคุณไปกินข้าวด้วย", effects: {relations: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยายเดินกลับบ้านเองเลย ตั้งแต่นั้นเห็นคุณทีไรก็ทำเป็นมองฟ้า", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_qt_share_01
        text: "รับยาย แล้วแบ่งค่ารอบให้พี่"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: gig_qt_take_01
        text: "รับยายไปเงียบ ๆ"
        outcomes:
          - {weight: 1, ok: true, text: "วันนั้นไม่มีใครว่าอะไร ยายแนะนำเพื่อนบ้านให้มาขึ้นคันคุณอีกสองคน", effects: {money: {unit: income_x, amount: 0.03}, relations: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตอนเย็นเก้าอี้ของคุณถูกย้ายไปท้ายแถว และไม่มีใครรู้ว่าใครย้าย", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gig_qt_vote_01
        text: "เรียกทั้งคิวยกมือโหวตกลางถนน"
        outcomes:
          - {weight: 1, ok: true, text: "ยายยกมือด้วย คะแนนเลยชนะขาด ทั้งคิวตกลงว่าคนประจำเลือกคันได้ถ้าแบ่งค่ารอบ", effects: {network: 1, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ระหว่างนับคะแนน ยายขึ้นรถสองแถวไปเรียบร้อยแล้ว", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: gig_no_show_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [21, 26], occupation: [labor, service, craft]}
    title: "กล่องข้าวไม่มีเจ้าของ"
    text: "คุณรับจ้างส่งของเก็บเงินปลายทาง วันละสองสามรอบต้องเจอแบบนี้ ซื้อข้าวไปส่งถึงหน้าบ้านแล้วเคาะเท่าไหร่ก็ไม่มีคนเปิด ค่ารอบได้นิดเดียว แต่ค่าข้าวในกล่องคุณออกไปก่อนแล้ว กล่องนี้ยังอุ่นอยู่เลย"
    choices:
      - id: gig_ns_wait_01
        text: "นั่งรอหน้าบ้านต่ออีกครึ่งชั่วโมง"
        outcomes:
          - {weight: 1, ok: true, text: "เจ้าของบ้านกลับมาพอดี ขอโทษยกใหญ่แล้วจ่ายให้เกินราคา", effects: {money: {unit: income_x, amount: 0.01}, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รอจนยุงกัดครบสองขา ไม่มีใครมา รอบถัดไปก็หลุดมือด้วย", effects: {health: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
