        text: "ขอผ่อนเป็นงวดรายเดือน"
        outcomes:
          - {weight: 1, ok: true, text: "หัวหน้าวินยอมแบ่งเป็นสิบงวด งวดสุดท้ายยังแถมเลี้ยงข้าวคุณหนึ่งมื้อ", effects: {money: {unit: income_x, amount: -0.3}, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผ่อนได้ แต่ที่บวกเพิ่มมาทำให้เหมือนซื้อเสื้อสองตัว", effects: {money: {unit: income_x, amount: -0.7}}, merit: [{cat: neutral}]}
