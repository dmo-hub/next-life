# ร่างเรื่อง คนรับจ้างตัดอ้อย ขึ้นรถส่งโรงงาน · 15 ใบ · ลงเกมแล้ว ใบ 316 · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นเด็กนั่งร่มไม้กับป้า คนช่วยญาติมัดอ้อย คนส่งข้าว คนจดยอด คนดูแลเพิง ญาติเจ้าของไร่ เพื่อนบ้าน ไม่ใช่อาชีพ · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี
events:
  - id: canecutter_shade_kid_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [6, 12]}
    title: "น้ำอ้อยเปื้อนเสื้อตัวขาว"
    text: "หน้าหีบผู้ใหญ่ในบ้านไปช่วยญาติตัดอ้อย ป้าที่ยังไม่ลงไร่พาคุณนั่งใต้ต้นมะขามริมไร่ด้วยกัน แล้วยื่นอ้อยเคี้ยวปอกแล้วให้ท่อนหนึ่ง ยาวราวหนึ่งปล้อง น้ำหวานไหลลงคางเป็นทาง เสื้อตัวขาวที่ใส่มาเริ่มเปลี่ยนสีทีละจุด"
    choices:
      - id: canecutter_kid_chew_slow
        text: "เคี้ยวช้า ๆ ก้มหน้าให้หยดลงดิน"
        effects: {happiness: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: canecutter_kid_wipe_shirt
        text: "เช็ดปากกับชายเสื้อทุกคำ"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: canecutter_kid_pour_cups
        text: "รินน้ำใส่แก้วรอผู้ใหญ่มาพัก"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_kid_count_piles
        text: "นั่งนับกองอ้อยที่เรียงริมทาง"
        outcomes:
          - {weight: 1, ok: true, text: "นับได้สามสิบเจ็ดกอง ลุงหัวหน้าชุดนับเองได้สามสิบเจ็ดเหมือนกัน แล้วเรียกคุณว่าคนคุมบัญชีไปทั้งหน้าหีบ", effects: {knowledge: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "นับไปนับมาเผลอหลับพิงต้นมะขาม ตื่นมาอีกทีกองอ้อยขึ้นรถไปหมดแล้ว ส่วนเสื้อก็ยังเหนียวเหมือนเดิม", effects: {health: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: canecutter_kid_ant_trail
        text: "ใช้ชานอ้อยล่อมดให้เดินแถว"
        outcomes:
          - {weight: 1, ok: true, text: "มดเดินเป็นแถวยาวไปถึงรองเท้าลุง คนในชุดที่มานั่งพักเที่ยงยืนดูกันหัวเราะ แล้วช่วยกันวางชานต่อให้แถวยาวกว่าเดิม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มดเปลี่ยนใจเดินขึ้นมาหาน้ำหวานบนเสื้อคุณแทน คุณกระโดดจนกระติกน้ำล้ม ป้าหัวเราะแล้วนั่งปัดมดออกให้ทีละตัว", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_tie_break_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [15, 18]}
    title: "ปิดเทอมไปช่วยมัดอ้อย"
    text: "ปิดเทอมนี้ลุงที่เป็นหัวหน้าชุดตัดชวนคุณไปช่วยมัดอ้อยท้ายแถว ผู้ใหญ่ตัดวางเป็นกอง คุณรวบให้ได้ขนาดแล้วรัดเชือก ลุงบอกว่ามัดหลวมยกขึ้นรถแล้วร่วง มัดแน่นก็ช้า ผ่านไปครึ่งเช้ามือเริ่มชา"
    choices:
      - id: canecutter_teen_tight_slow
        text: "มัดแน่นทุกมัด ช้าก็ช่าง"
        effects: {knowledge: 1, relations: 1, health: -1}
        merit: [{cat: neutral}]
      - id: canecutter_teen_ask_knot
        text: "ขอให้ลุงสอนเงื่อนรัดอีกรอบ"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: canecutter_teen_help_aunt
        text: "ไปช่วยป้าแถวข้างที่มัดไม่ทัน"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_teen_shade_rest
        text: "ขอพักใต้ร่มไม้ก่อนสักพัก"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: canecutter_teen_bow_knot
        text: "มัดโบว์ให้ทุกมัดสวยกว่าของลุง"
        outcomes:
          - {weight: 1, ok: true, text: "โบว์เชือกสวยจนลุงยืนดูนาน แล้วบอกว่าโรงงานไม่ให้คะแนนความสวย แต่ป้าแถวข้างแบ่งไข่ต้มให้คุณหนึ่งฟองเป็นค่าชม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มัดที่สามโบว์หลุด อ้อยทั้งกองกลิ้งลงร่อง คุณใช้เวลาเก็บนานกว่ามัดใหม่สามมัด", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_long_sleeve_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [15, 18]}
    title: "เสื้อแขนยาวกลางแดดจัด"
    text: "วันแรกที่ไปช่วยญาติในไร่ คุณใส่เสื้อยืดแขนสั้นเพราะแดดร้อนจัด ป้ายื่นเสื้อแขนยาวเก่าให้ตัวหนึ่ง คุณบอกไม่เป็นไร พอเดินแทรกดงใบอ้อยไปได้สองร่อง แขนเริ่มคันเป็นเส้น ขอบใบมีหนามเล็ก ๆ ที่มองไม่เห็นจนโดนเอง"
    choices:
      - id: canecutter_sleeve_wear_now
        text: "ยอมใส่เสื้อแขนยาวของป้า"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: canecutter_sleeve_wash_arms
        text: "ไปล้างแขนแล้วกลับมาทำต่อ"
        effects: {health: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: canecutter_sleeve_tough_it
        text: "ทนไหว ใส่แขนสั้นต่อทั้งวัน"
        effects: {health: -2, happiness: 1}
        merit: [{cat: neutral}]
      - id: canecutter_sleeve_carry_water
        text: "ขอเปลี่ยนไปหิ้วน้ำให้ทั้งชุด"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_sleeve_socks
        text: "เอาถุงเท้ามาสวมแขนแทน"
        outcomes:
          - {weight: 1, ok: true, text: "ถุงเท้าสองข้างกันใบอ้อยได้จริง ป้าเดินมาดูใกล้ ๆ แล้วขอไอเดียไปบอกทั้งชุด", effects: {health: 1, happiness: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถุงเท้าหลวมเลื่อนลงข้อมือทุกห้านาที ทั้งชุดเรียกคุณว่าคนดึงถุงเท้าไปจนหมดปิดเทอม", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_rice_runner_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ข้าวเที่ยงเหลือครึ่งตะกร้า"
    text: "ญาติฝากคุณปั่นจักรยานไปส่งข้าวห่อใบตองให้ชุดตัดอ้อยตอนเที่ยง พักกินได้ชั่วโมงเดียว แต่หลายคนกินไม่กี่คำก็ลุกกลับไปตัดต่อ ข้าวที่ห่อมาเหลือครึ่งตะกร้า ป้าบอกว่าขนกลับก็เสียของ คุณยืนถือตะกร้ากลางแดด"
    choices:
      - id: canecutter_rice_wait_all
        text: "นั่งรอจนทุกคนกินเสร็จ"
        effects: {relations: 1, health: -1}
        merit: [{cat: neutral}]
      - id: canecutter_rice_wrap_small
        text: "พรุ่งนี้ห่อเป็นคำเล็กให้กินเร็ว"
        effects: {knowledge: 1, relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_rice_share_next
        text: "แบ่งให้ชุดตัดไร่ข้าง ๆ"
        effects: {network: 2, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_rice_ask_head
        text: "ถามหัวหน้าชุดว่าทำไมรีบนัก"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: canecutter_rice_eat_rest
        text: "กินที่เหลือเองให้หมดตะกร้า"
        outcomes:
          - {weight: 1, ok: true, text: "อิ่มจนปั่นจักรยานกลับช้ากว่าขามา ป้าชมว่ากินเก่งเหมือนคนรุ่นก่อน ไม่มีข้าวเหลือทิ้งสักห่อ", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กินเสร็จง่วงหลับใต้ต้นไม้ ตื่นมาอีกทีชุดตัดเลิกงานแล้ว ทุกคนเดินผ่านคุณไปพร้อมเสียงหัวเราะ", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_bundle_tally_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [20, 30]}
    title: "สมุดจดยอดมัดประจำชุด"
    text: "หัวหน้าชุดตัดอ้อยเป็นญาติคุณ สายตาเริ่มฝ้าเลยฝากให้คุณจดยอดมัดของแต่ละคนตอนเย็น ชุดนี้แบ่งค่าตัดกันเองตามจำนวนมัด บางคนได้ร้อยกว่ามัด บางคนสี่สิบห้าสิบ วันนี้น้าสองคนนับกองเดียวกันได้คนละเลข แล้วหันมามองคุณพร้อมกัน"
    choices:
      - id: canecutter_tally_recount
        text: "นับใหม่ต่อหน้าทั้งสองคน"
        effects: {knowledge: 2, health: -1}
        merit: [{cat: neutral}]
      - id: canecutter_tally_split_half
        text: "แบ่งกองนี้ให้คนละครึ่ง"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: canecutter_tally_ask_head
        text: "ส่งเรื่องให้หัวหน้าชุดตัดสิน"
        effects: {relations: 1, network: 1}
        merit: [{cat: neutral}]
      - id: canecutter_tally_color_rope
        text: "เสนอใช้เชือกคนละสีแยกมัด"
        effects: {knowledge: 1, network: 2}
        merit: [{cat: neutral}]
      - id: canecutter_tally_chant
        text: "ให้ทั้งสองนับออกเสียงพร้อมกัน"
        outcomes:
          - {weight: 1, ok: true, text: "นับไปได้ยี่สิบมัดทั้งสองก็หัวเราะกันเอง ตกลงเลขกลางได้ก่อนข้าวเย็น หัวหน้าชุดให้คุณถือสมุดต่อไปทั้งหน้าหีบ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สองคนนับแข่งกันเสียงดังจนชุดไร่ข้าง ๆ มายืนดู สุดท้ายต่างคนต่างได้เลขใหม่ที่ไม่ตรงกับเลขเดิมของใครเลย", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_weigh_queue_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "คิวลานชั่งยาวกว่าวันตัด"
    text: "ชุดตัดของญาติตัดอ้อยเต็มคันในสองวัน คุณติดรถไปช่วยดูของที่หน้าโรงงาน พอถึงก็เจอรถอ้อยจอดเรียงล้นลานออกมาริมถนนไปถึงหมู่บ้านข้าง ๆ คนขับคันหน้าบอกว่ารอมาสี่วันแล้ว เสบียงที่คุณเตรียมมาพอแค่ครึ่งวัน"
    choices:
      - id: canecutter_queue_find_food
        text: "เดินหาร้านข้าวในหมู่บ้าน"
        effects: {network: 1, health: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: canecutter_queue_share_food
        text: "แบ่งเสบียงให้คนขับคันข้าง ๆ"
        effects: {relations: 1, network: 1, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_queue_tree_nap
        text: "ปูเสื่อนอนรอใต้ต้นไม้ริมทาง"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: canecutter_queue_bus_home
        text: "นั่งรถโดยสารกลับบ้านไปก่อน"
        effects: {happiness: 1, relations: -1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: canecutter_queue_chess
        text: "ชวนคนทั้งแถวเล่นหมากรุก"
        outcomes:
          - {weight: 1, ok: true, text: "คนขับห้าคันมาล้อมวงหมากรุกข้างทาง กว่าคิวจะขยับ คุณรู้จักคนทั้งแถว และได้ข้าวเหนียวฟรีมาสองห่อ", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คิวขยับตอนคุณกำลังจะรุกจน คนขับวิ่งกลับไปขึ้นรถกันหมด เหลือคุณนั่งถือหมากอยู่ข้างกระดานคนเดียว", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_glove_care_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [21, 30]}
    title: "ถุงมือขาดข้างเดียว"
    text: "คุณไปช่วยชุดตัดของญาติขนมัดอ้อยออกมากองริมทาง หัวหน้าชุดยื่นถุงมือผ้าให้คู่หนึ่ง บอกว่าในชุดนี้ตัดก็ค่อย ๆ ตัด ขนก็ค่อย ๆ ขน ใส่ถุงมือไว้ก่อน ผ่านไปครึ่งเช้า ข้างขวาขาดตรงนิ้วโป้ง ข้างซ้ายยังใหม่เหมือนเพิ่งแกะห่อ"
    choices:
      - id: canecutter_glove_wrap_thumb
        text: "ฉีกเศษผ้าพันนิ้วโป้งไว้ก่อน"
        effects: {health: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: canecutter_glove_slow_down
        text: "ขนช้าลงตามที่หัวหน้าชุดบอก"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: canecutter_glove_bare_hand
        text: "ถอดทิ้ง ขนมือเปล่าให้คล่อง"
        effects: {health: -2, happiness: 1}
        merit: [{cat: neutral}]
      - id: canecutter_glove_mend_crew
        text: "ช่วยพันถุงมือให้คนที่ขาดคู่"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: canecutter_glove_left_swap
        text: "หาคนถนัดซ้ายมาแลกข้างกัน"
        outcomes:
          - {weight: 1, ok: true, text: "เจอน้าคนหนึ่งถนัดซ้าย ถุงมือขาดข้างซ้ายพอดี สองคนแลกกันได้คู่ที่ครบ ทั้งชุดบอกว่าเป็นคู่ที่ฟ้าส่งมา", effects: {health: 1, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทั้งชุดถนัดขวาหมด ทุกคนขาดข้างขวาเหมือนกัน ถุงมือข้างซ้ายสภาพใหม่ห้าข้างกองรวมกันอยู่ข้างกระติก", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: canecutter_rate_talk_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "คุยค่าตัดแทนทั้งชุด"
    text: "หน้าหีบปีนี้ญาติที่รวมกันเป็นชุดตัดอ้อยให้คุณคุยกับเจ้าของไร่แทน เพราะพูดเก่งสุดในบ้าน ค่าตัดคิดเป็นตัน เจ้าของไร่เสนอราคาเท่าปีก่อน ญาติที่ยืนข้างหลังกระแอมพร้อมกันสามคน ทั้งที่คุณยังไม่ได้เปิดปาก"
    choices:
      - id: canecutter_rate_take_same
        text: "รับราคาเดิม ไม่ต่อสักบาท"
        effects: {happiness: 1, relations: -1, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: neutral}]
      - id: canecutter_rate_ask_more
