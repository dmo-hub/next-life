# กลุ่มหนี้ · ช่วงหนุ่มสาว/ทำงาน/กลางคน (19–59) + การ์ดทวงหนี้นอกระบบช่วงชรา · กยศ. บ้าน รถ ค้ำประกัน หนี้นอกระบบ — ใช้ธง loan_shark · guarantor · home_owner · has_car
events:
  - id: debt_student_loan_01
    type: A
    category: study
    stage: หนุ่มสาว
    years: [2539, 2650]
    systems: [student_loan]
    lore_ref: lore-finance-series.html#6
    when: {age: [19, 22]}
    weight: 2
    multipliers: {flags: {good_student: 1.3}}
    title: "ใบสมัคร กยศ."
    text: "ค่าเทอมงวดหน้ามาพร้อมค่าหอ เงินที่บ้านส่งมาไม่พอ รุ่นพี่ยื่นใบสมัครกยศ.ให้ บอกว่ากู้ได้ทั้งค่าเทอมและค่ากิน ดอกถูกกว่าที่ไหน ๆ"
    choices:
      - id: borrow_full
        text: "กู้เต็มจำนวน ตั้งใจเรียน"
        effects: {debt: {kind: student_loan, amount: {unit: income_x, amount: 3}}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ไม่ต้องห่วงเรื่องเงิน เกรดขึ้นทุกเทอม อาจารย์เริ่มชวนไปช่วยงานวิจัย", effects: {knowledge: 2, network: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรียนจบแล้วหางานไม่ได้ จดหมายเตือนงวดแรกมาถึงก่อนสลิปเงินเดือน", effects: {happiness: -2}, merit: [{cat: neutral}]}
      - id: borrow_spend
        text: "กู้มา แบ่งไปซื้อมือถือใหม่"
        effects: {debt: {kind: student_loan, amount: {unit: income_x, amount: 3}}, happiness: 1}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "มือถือใหม่กลายเป็นร้านขายของออนไลน์ กำไรพอจ่ายค่ากินทั้งเทอม", effects: {money: {unit: income_x, amount: 1}, happiness: 1}, sets_flags: [online_seller], merit: [{cat: neutral}]}
          - {weight: 2, text: "เงินหมดก่อนสอบกลางภาค ต้องยืมเพื่อนกินข้าวจนจบเทอม", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
      - id: work_parttime
        text: "ทำงานพิเศษส่งตัวเอง"
        effects: {health: -1}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "เจ้าของร้านที่ทำพาร์ตไทม์ถูกใจ ยื่นข้อเสนองานประจำรอไว้ตั้งแต่ยังไม่จบ", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทำงานดึกจนหลับในห้องสอบ ติด F วิชาหลักต้องลงซ้ำ", effects: {knowledge: -1, happiness: -2}, merit: [{cat: neutral}]}
      - id: ask_parents
        text: "โทรขอเงินที่บ้านเพิ่ม"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "แม่บอกปีนี้ขายของได้ราคา โอนมาเกินที่ขอแถมกำชับให้กินดี ๆ", effects: {happiness: 2, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ได้เงินครบ มารู้ทีหลังว่าพ่อเอาโฉนดที่นาไปจำนำมาให้", effects: {relations: 2, happiness: -2}, merit: [{cat: neutral}]}

  - id: debt_car_buy_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {age: [23, 30], flags: {not: [has_car]}}
    weight: 1
    multipliers: {class: {ร่ำรวย: 1.5}}
    title: "ป้ายแดงทั้งกลุ่ม"
    text: "เพื่อนรุ่นเดียวกันออกรถใหม่กันทั้งกลุ่ม เซลส์โทรมาทุกวัน บอกว่าดาวน์ต่ำ ผ่อนเดือนละนิดเดียว ของแถมเต็มคัน ขับไปงานเลี้ยงรุ่นทันแน่นอน"
    choices:
      - id: new_car
        text: "ออกป้ายแดง ผ่อนเต็มที่"
        effects: {debt: {kind: car, amount: {unit: income_x, amount: 6}}, money: {unit: income_x, amount: -6}, happiness: 2}
        sets_flags: [has_car]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "รถพาไปรับงานไกลได้ทุกเสาร์อาทิตย์ รายได้เสริมเข้ามาพอจ่ายค่างวด", effects: {network: 1, money: {unit: income_x, amount: 1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ขับได้สามเดือนโดนชนท้าย อีกฝ่ายหนีไป ซ่อมเองหมดเงินเก็บ", effects: {happiness: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
      - id: used_car
        text: "ซื้อมือสองด้วยเงินสด"
        requires: {money: {unit: income_x, amount: 2}}
        effects: {money: {unit: income_x, amount: -2}}
        sets_flags: [has_car]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "เครื่องฟิตเกินราคา ขับมาหลายปีไม่เคยเข้าอู่ เพื่อนขอยืมไปเที่ยวจนชิน", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไมล์ถูกกรอ เครื่องดับกลางทางด่วน ค่าซ่อมเกือบเท่าราคารถ", effects: {happiness: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
      - id: keep_bike
        text: "ขี่มอเตอร์ไซค์คันเดิมต่อ"
        effects: {money: {unit: income_x, amount: 1}, happiness: -1}
        merit: [{cat: neutral}]
      - id: car_for_parents
        text: "ออกรถให้พ่อแม่ใช้ที่บ้าน"
        effects: {debt: {kind: car, amount: {unit: income_x, amount: 4}}, money: {unit: income_x, amount: -4}, relations: 2}
        sets_flags: [has_car]
        merit: [{cat: care_parents, level: 1}]

  - id: debt_guarantor_ask_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {flags: {not: [guarantor]}}
    weight: 1
    multipliers: {stats: {relations: 1.3}}
    title: "ขาดแค่ลายเซ็นเดียว"
    text: "เพื่อนสนิทสมัยเรียนนัดกินข้าว เล่าเรื่องเก่าจนน้ำตาซึม ก่อนจะยื่นสัญญากู้ซื้อรถมาตรงหน้า บอกว่าทุกอย่างพร้อมแล้ว ขาดแค่ลายเซ็นคนค้ำ"
    choices:
      - id: sign
        text: "เซ็นค้ำให้ เพื่อนกันนี่"
        sets_flags: [guarantor]
        effects: {relations: 1}
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 2, ok: true, text: "เพื่อนผ่อนตรงทุกงวด ปีใหม่ขับรถคันนั้นมาส่งกระเช้าถึงบ้าน", effects: {relations: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "หกเดือนต่อมา เบอร์แปลกโทรเข้ามา ไม่ใช่เพื่อน แต่เป็นไฟแนนซ์", effects: {happiness: -1}, next: debt_guarantor_default_01, merit: [{cat: neutral}]}
      - id: refuse_soft
        text: "ปฏิเสธแบบนุ่ม ๆ"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, text: "เพื่อนยิ้มแห้ง จ่ายค่าข้าวเองแล้วเลิกทักมาไปพักใหญ่", effects: {relations: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปีต่อมาคนที่ไปค้ำแทนโดนตามหนี้ทั้งก้อน เพื่อนมาขอโทษที่เคยงอน", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
      - id: lend_cash
        text: "ให้ยืมเงินสดแทนการค้ำ"
        effects: {money: {unit: income_x, amount: -1}}
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนคืนครบในปีเดียว แถมพาไปรู้จักลูกค้ารายใหญ่", effects: {money: {unit: income_x, amount: 1}, network: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เงินก้อนนั้นหายไปพร้อมเพื่อน โซเชียลของเขาปิดเงียบทุกช่องทาง", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
      - id: joint_shop
        text: "ชวนเพื่อนเปิดร้านด้วยกันแทน"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ร้านเล็กของสองคนขายดีจนต้องจ้างคนเพิ่ม เพื่อนซื้อรถได้เองโดยไม่ต้องมีใครค้ำ", effects: {happiness: 2, money: {unit: income_x, amount: 1.5}}, sets_flags: [own_business], merit: [{cat: neutral}]}
          - {weight: 2, text: "ทะเลาะเรื่องเงินทอนทุกคืน ร้านปิดในปีเดียว เพื่อนก็หายไปด้วย", effects: {relations: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}

  - id: debt_guarantor_default_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    title: "ลายเซ็นของคุณ"
    text: "ไฟแนนซ์บอกว่าเพื่อนค้างค่างวดมาห้าเดือน โทรเบอร์เดิมไม่มีคนรับ บ้านเช่าก็ย้ายออกไปแล้ว ยอดค้างทั้งหมดตอนนี้ชี้มาที่ลายเซ็นของคุณคนเดียว"
    choices:
      - id: pay_off
        text: "จ่ายปิดแทนให้จบ"
        effects: {money: {unit: income_x, amount: -2}, happiness: -1}
        clears_flags: [guarantor]
        merit: [{cat: sila, level: 1}]
      - id: track_down
        text: "ตามหาเพื่อนให้เจอ"
        clears_flags: [guarantor]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "เจอเพื่อนเปิดแผงอยู่ต่างจังหวัด เขาก้มกราบขอโทษแล้วรับผ่อนต่อเอง", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไปถึงบ้านเพื่อน เจอแต่แม่เขานอนป่วยติดเตียง กลับมามือเปล่าพร้อมค่าน้ำมัน", effects: {happiness: -2}, sets_flags: [guarantor], merit: [{cat: neutral}]}
      - id: let_seize
        text: "ให้ไฟแนนซ์ยึดรถไปขาย"
        clears_flags: [guarantor]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "รถยังใหม่ ขายทอดตลาดได้ราคาดี จ่ายส่วนต่างนิดเดียวก็จบ", effects: {money: {unit: income_x, amount: -0.3}, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ขายได้แค่ครึ่งเดียว ส่วนต่างพร้อมดอกตามมาเก็บที่คุณ", effects: {money: {unit: income_x, amount: -1.5}, happiness: -1}, merit: [{cat: neutral}]}
      - id: ignore_calls
        text: "เงียบ ไม่รับสายไฟแนนซ์"
        effects: {happiness: -1, relations: -1}
        sets_flags: [in_debt]
        merit: [{cat: neutral}]

  - id: debt_house_buy_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    when: {flags: {not: [home_owner]}}
    weight: 2
    multipliers: {flags: {married: 1.5, has_kids: 1.3}}
    title: "หลังมุมหลังสุดท้าย"
    text: "เดินผ่านโครงการบ้านใหม่ทุกเช้า วันนี้เซลส์วิ่งมายื่นโบรชัวร์ บอกว่าเหลือหลังมุมหลังสุดท้าย จองวันนี้ฟรีค่าโอน ธนาคารอนุมัติง่ายกว่าที่คิด"
    choices:
      - id: new_house
        text: "กู้ซื้อบ้านหลังมุม"
        effects: {debt: {kind: mortgage, amount: {unit: income_x, amount: 25}}, invest: {asset: land, share: 0.6}}
        sets_flags: [home_owner]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 3, ok: true, text: "ย้ายเข้าทันปีใหม่ ทุกคนในบ้านมีห้องของตัวเองสักที", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อยู่ได้ปีเดียว น้ำท่วมทั้งหมู่บ้านถึงเอว เฟอร์นิเจอร์ใหม่ลอยออกหน้าต่าง", effects: {happiness: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
      - id: used_house
        text: "ซื้อบ้านมือสองขายด่วน"
        effects: {debt: {kind: mortgage, amount: {unit: income_x, amount: 15}}, invest: {asset: land, share: 0.5}}
        sets_flags: [home_owner]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ราคาถูกกว่าตลาดเกือบครึ่ง ปีต่อมามีข่าวรถไฟฟ้าจะมาลงหน้าซอย", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วันรับกุญแจ ไขประตูเข้าไปเจอครอบครัวแปลกหน้ากำลังนั่งกินข้าวอยู่ในบ้าน", next: debt_house_squatter_01, merit: [{cat: neutral}]}
      - id: keep_renting
        text: "เช่าต่อ เก็บเงินไว้ก่อน"
        effects: {money: {unit: income_x, amount: 1}, happiness: -1}
        merit: [{cat: neutral}]
      - id: rural_land
        text: "ซื้อที่ดินเปล่าต่างจังหวัด"
        requires: {money: {unit: income_x, amount: 3}}
        effects: {invest: {asset: land, share: 0.4}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "สามปีต่อมาถนนสี่เลนตัดผ่านหน้าที่ดิน นายหน้าโทรมาขอซื้อทุกอาทิตย์", effects: {happiness: 2, money: {unit: income_x, amount: 2}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไปดูของจริงถึงรู้ว่าเป็นที่ดินตาบอด ไม่มีทางเข้า ขายต่อใครก็ไม่เอา", effects: {happiness: -2}, merit: [{cat: neutral}]}

  - id: debt_house_squatter_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    title: "ผู้เช่าที่ไม่ยอมไป"
    text: "ผู้เช่าเก่าโชว์สัญญาว่าเจ้าของเดิมรับค่าเช่าล่วงหน้าไปสามปี แล้วหายตัว เขาไม่ยอมย้ายออก ส่วนคุณต้องเริ่มผ่อนบ้านที่ยังเข้าไปนอนไม่ได้"
    choices:
      - id: sue
        text: "จ้างทนายฟ้องขับไล่"
        effects: {money: {unit: income_x, amount: -1}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ศาลสั่งให้ออกภายในเดือน ได้ย้ายเข้าบ้านพร้อมสัญญาฉบับปลอมเป็นที่ระลึก", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คดียืดไปสองปี ค่าทนายบานจนแทบเท่าเงินดาวน์", effects: {money: {unit: income_x, amount: -1}, health: -1, happiness: -2}, merit: [{cat: neutral}]}
      - id: pay_moving
        text: "ออกค่าย้ายให้เขาไปเอง"
        effects: {money: {unit: income_x, amount: -0.5}, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: let_stay
        text: "ให้อยู่ต่อ เก็บค่าเช่าแทน"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ค่าเช่าพอผ่อนบ้านได้ทั้งงวด เหมือนมีคนผ่อนบ้านให้ฟรี ๆ", effects: {money: {unit: income_x, amount: 1}, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาหนีไปกลางดึก ทิ้งไว้แต่ผนังพังกับค่าไฟค้างสามเดือน", effects: {money: {unit: income_x, amount: -1}, happiness: -1}, merit: [{cat: neutral}]}
      - id: cut_utilities
        text: "ตัดน้ำตัดไฟ บีบให้ออก"
        effects: {happiness: 1, relations: -2}
        merit: [{cat: greed_harm, level: 1}]

  - id: debt_cash_short_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    when: {flags: {not: [loan_shark]}}
    weight: 1
    repeat: {gap: 4, max: 3}
    multipliers: {flags: {in_debt: 2, has_kids: 1.3}, occupation: {labor: 1.5, farmer: 1.3, service: 1.2}}
    title: "เงินด่วนบนเสาไฟ"
    text: "เงินงวดนี้ยังไม่เข้า แต่ค่ารักษาของคนในบ้าน ค่าเช่า กับค่างวดมาพร้อมกันในอาทิตย์เดียว ใบปลิวเงินด่วนไม่ต้องค้ำติดอยู่บนเสาไฟหน้าบ้านพอดี"
    choices:
      - id: call_shark
        text: "โทรเบอร์เงินด่วนบนเสาไฟ"
        effects: {debt: {kind: informal, amount: {unit: income_x, amount: 1}}, money: {unit: income_x, amount: -1}, happiness: 1}
        sets_flags: [loan_shark]
        merit: [{cat: neutral}]
      - id: pawn_gold
        text: "เอาทองไปจำนำ"
        effects: {money: {unit: income_x, amount: -0.5}, happiness: -1}
        merit: [{cat: neutral}]
      - id: ask_relative
        text: "ขอยืมญาติ"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ญาติให้ยืมแบบไม่คิดดอก แถมห่อกับข้าวใส่ถุงให้กลับบ้าน", effects: {relations: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยืมได้ แต่เรื่องไปถึงหูทั้งตระกูลภายในวันเดียว", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
      - id: overtime
        text: "รับงานเสริมทุกคืนจนครบ"
        effects: {health: -2}
        merit: [{cat: neutral}]
