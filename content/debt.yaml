      - id: press_case
        text: "เดินหน้าคดีต่อ ไม่ยอม"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "กล้องหน้าบ้านข้าง ๆ จับหน้าคนพ่นสีได้ชัด คนพ่นโดนจับ เพื่อนบ้านกลับมาทัก เหลือแต่เงินต้นที่ยังต้องคืน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คดีเงียบหาย คนทวงกลับมายืนหน้าบ้านทุกเย็นเหมือนไม่มีอะไรเกิดขึ้น", effects: {happiness: -2, health: -1}, merit: [{cat: neutral}]}
      - id: pay_principal
        text: "ยอมจ่ายต้นคืนให้จบ"
        effects: {settle: informal, happiness: -1, health: 1}
        clears_flags: [loan_shark]
        merit: [{cat: neutral}]
      - id: move_out
        text: "ย้ายไปเช่าที่อื่นเงียบ ๆ"
        effects: {money: {unit: income_x, amount: -0.5}, relations: -1}
        merit: [{cat: neutral}]
      - id: ask_elder
        text: "ขอผู้ใหญ่ในชุมชนไกล่เกลี่ย"
        clears_flags: [loan_shark]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {network: 1.5}}, text: "ผู้ใหญ่ที่เจ้าหนี้เกรงใจออกหน้า ตกลงให้ผ่อนต้นคืนแบบไม่มีดอก", effects: {settle: informal, network: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้ใหญ่รับปากอย่างดี แล้วขอค่าเหนื่อยไปอีกก้อน", effects: {money: {unit: income_x, amount: -0.5}, happiness: -1}, sets_flags: [loan_shark], merit: [{cat: neutral}]}

