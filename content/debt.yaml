  - id: debt_shark_threat_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    title: "สีแดงบนประตู"
    text: "สามวันหลังแจ้งความ ประตูบ้านถูกพ่นสีแดงเต็มบาน ชื่อคุณตัวโตพร้อมคำว่าคนโกง เพื่อนบ้านเริ่มเดินอ้อม แม่ค้าปากซอยไม่กล้าขายของให้"
