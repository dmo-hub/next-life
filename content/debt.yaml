        clears_flags: [home_owner]
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ร้านติดตลาดตั้งแต่เดือนแรก ลูกค้าประจำเรียกชื่อคุณได้ทั้งซอย", effects: {money: {unit: income_x, amount: 2}, happiness: 2}, sets_flags: [own_business], merit: [{cat: neutral}]}
          - {weight: 2, text: "ร้านเจ๊งในปีเดียว ไม่มีทั้งบ้านทั้งร้าน เหลือแต่หนี้ค่าเช่าที่", effects: {money: {unit: income_x, amount: -2}, happiness: -2}, sets_flags: [own_business, in_debt], merit: [{cat: neutral}]}
