        text: "แต่งสลิปเงินเดือนกู้เพิ่ม"
        merit: [{cat: greed_harm, level: 1}]
        outcomes:
          - {weight: 2, text: "ผ่านฉลุย ได้เงินก้อนโตกว่าที่ควรได้ แต่งวดใหม่ก็โตตาม", effects: {debt: {kind: mortgage, amount: {unit: income_x, amount: 5}}, happiness: 1}, merit: [{cat: neutral}]}
