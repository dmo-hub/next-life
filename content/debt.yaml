      - id: pay_off_house
        text: "ปิดหนี้บ้านทีเดียว"
        requires: {money: {unit: income_x, amount: 20}}
        effects: {settle: mortgage, happiness: 2}
        merit: [{cat: neutral}]
      - id: stay_put
        text: "ผ่อนแบบเดิมต่อไป"
        merit: [{cat: neutral}]

