        effects: {debt: {kind: mortgage, amount: {unit: income_x, amount: 3}}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "เอาเงินก้อนไปต่อเติมชั้นล่างเป็นห้องเช่า ค่าเช่าจ่ายงวดบ้านแทนได้เกือบหมด", effects: {money: {unit: income_x, amount: 1}, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เงินก้อนหมดไปกับรถคันใหม่ในเดือนเดียว เหลือแต่งวดบ้านที่ยาวกว่าเดิม", effects: {money: {unit: income_x, amount: -3}, happiness: 1}, sets_flags: [has_car], merit: [{cat: neutral}]}
