      - id: refinance
        text: "ย้ายไปธนาคารใหม่ ดอกต่ำกว่า"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "งวดลดลงทุกเดือน เงินที่เหลือพอพาคนในบ้านไปเที่ยวทะเลปีละครั้ง", effects: {money: {unit: income_x, amount: 1}, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ดอกต่ำแค่สามปีแรก ปีที่สี่พุ่งแรงกว่าธนาคารเดิม ค่าปรับย้ายก็เสียไปแล้ว", effects: {money: {unit: income_x, amount: -0.5}, happiness: -1}, merit: [{cat: neutral}]}
