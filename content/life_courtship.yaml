        result: "{ชื่อคนจีบ}พูดว่าใช่ ไม่มีอะไร แล้วหลังจากนั้นก็ไม่มีอะไรจริง ๆ"
        effects: {happiness: -1, network: 1}
        family: [{drop: courter}]
        merit: [{cat: neutral}]
      - id: court_work_treat_all
        text: "เลี้ยงน้ำทั้งวงให้เลิกถาม"
        effects: {money: {unit: income_x, amount: -0.05}, network: 1}
