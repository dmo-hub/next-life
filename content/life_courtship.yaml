          - {weight: 1, text: "{ชื่อคนจีบ}ว่าอายุขนาดนี้ไม่อยากรอแบบไม่มีกำหนด ของที่ซื้อมาด้วยกันถูกแบ่งคนละถุง", effects: {happiness: -2}, family: [{drop: courter}], merit: [{cat: neutral}]}
