# การ์ดเจอ → จีบ → คบ → ขอแต่ง (ใบ 173) · การ์ดเจอเพิ่มคนจีบแล้วนัดการ์ดจีบของตัวเองไว้ปีที่ 1 และ 2 — ขั้นจีบยาว 1–2 ปี ไม่รู้ล่วงหน้าว่าปีไหน นัดครั้งเดียวหรือหวังกองสุ่มจะหลุดช่วง
# การ์ดจีบไม่มี weight (ออกจากนัดเท่านั้น) · สำเร็จ = ปล่อยให้แกนเลื่อนเป็นแฟนตามนัด จึงห้ามเขียนว่าเป็นแฟนแล้ว · จบกัน = drop courter
# ข้อความการ์ดจีบไม่ย้อนเล่าว่าเจอกันที่ไหน: จีบซ้อนสองคน ชื่อบนใบอาจเป็นคนจากการ์ดเจออีกใบ
events:
  - id: court_meet_uni_01
    away_block: [abroad, monk]
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 3
    when: {love_free: true, age: [19, 23], school: [uni, hvoc], flags: {not: [married]}, family: [{role: spouse, count: [0, 0]}, {role: partner, count: [0, 0]}, {role: courter, count: [0, 1]}]}
    title: "โต๊ะหินหน้าคณะตัวสุดท้าย"
    text: "ช่วงสอบ โต๊ะหินหน้าคณะเหลือตัวเดียว มีคนต่างสาขานั่งอยู่ครึ่งหนึ่งพร้อมชีทกองโต เขาเลื่อนกองชีทให้โดยไม่เงยหน้า แล้วถามว่าพอจะมีปากกาที่ยังเขียนติดสักด้ามไหม"
    choices:
      - id: court_uni_share
        text: "ให้ยืมปากกา แล้วชวนติวด้วยกัน"
        result: "ติวกันจนไฟหน้าคณะดับ บนปกชีทของคุณมีลายมือเขาเขียนว่า “{ชื่อคนจีบ}” ตามด้วยเบอร์โทร ส่วนปากกาไม่ได้คืน"
        effects: {happiness: 1, knowledge: 1}
        family: [{add: courter}]
        schedules: [{event: court_date_uni_01, after_years: [1, 1]}, {event: court_date_uni_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]
      - id: court_uni_pen_only
        text: "ให้ปากกา แล้วอ่านของตัวเองต่อ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: court_uni_move
        text: "ย้ายไปอ่านในห้องสมุด"
        effects: {knowledge: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: court_uni_borrow_notes
        text: "ขอยืมชีทเขาไปถ่ายเอกสาร"
        effects: {knowledge: 1, network: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]

