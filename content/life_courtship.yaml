        text: "จ่ายค่าข้าวคืน แล้วรีบทำงาน"
        effects: {money: {unit: income_x, amount: -0.02}, network: 1}
        merit: [{cat: neutral}]
      - id: court_work_go_home
        text: "ขอเอางานกลับไปทำที่บ้าน"
        effects: {health: 1, network: -1}
        merit: [{cat: neutral}]
      - id: court_work_invite_all
        text: "โทรชวนคนอื่นมาช่วยอีกแรง"
        effects: {relations: 1, health: 1}
        merit: [{cat: neutral}]

