        outcomes:
          - {weight: 1, ok: true, text: "รูปที่คุณถ่ายออกมาสวยทุกใบ {ชื่อคนจีบ}ขอให้ส่งให้ แล้วคุยต่อจนดึกดื่น", effects: {happiness: 2, relations: 1}, schedules: [{event: court_go_home_01, after_years: [1, 1]}, {event: court_go_home_01, after_years: [2, 2]}], merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณมัวแต่ถ่ายให้คนอื่น {ชื่อคนจีบ}กลับไปก่อน หลังจากวันนั้นข้อความสั้นลงจนเงียบ", effects: {happiness: -2}, family: [{drop: courter}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
