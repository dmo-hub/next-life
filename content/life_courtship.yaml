  - id: court_date_uni_01
    away_block: [abroad, monk]
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {family: [{role: courter, stage: courting}]}
    title: "ดอกไม้หนึ่งช่อวันซ้อมรับปริญญา"
    text: "ใกล้วันซ้อมรับปริญญาของรุ่นพี่ {ชื่อคนจีบ}ถามว่าจะไปถ่ายรูปด้วยกันไหม แล้วเสริมว่าถ้าไปในฐานะคนรู้จักเฉย ๆ ก็ไม่ต้องไปก็ได้"
    choices:
      - id: court_uni_bouquet
        text: "ถือช่อดอกไม้ไปให้เขา"
        outcomes:
          - {weight: 3, ok: true, text: "{ชื่อคนจีบ}รับดอกไม้ไปถือถ่ายรูปทั้งวัน ใครถามว่าใครให้ก็ชี้มาที่คุณ", effects: {happiness: 3, relations: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "{ชื่อคนจีบ}รับดอกไม้ไว้ แล้วบอกตรง ๆ ว่าคิดกับคุณได้แค่เพื่อน ช่อดอกไม้ถูกส่งต่อให้รุ่นพี่", effects: {happiness: -3, money: {unit: income_x, amount: -0.05}}, family: [{drop: courter}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: court_uni_go_plain
        text: "ไปตัวเปล่า อาสาเป็นตากล้อง"
        outcomes:
          - {weight: 1, ok: true, text: "รูปที่คุณถ่ายออกมาสวยทุกใบ {ชื่อคนจีบ}ขอให้ส่งให้ แล้วคุยต่อจนดึกดื่น", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณมัวแต่ถ่ายให้คนอื่น {ชื่อคนจีบ}กลับไปก่อน หลังจากวันนั้นข้อความสั้นลงจนเงียบ", effects: {happiness: -2}, family: [{drop: courter}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: court_uni_step_back
        text: "บอกว่าขอเป็นเพื่อนกันดีกว่า"
        result: "{ชื่อคนจีบ}พยักหน้าช้า ๆ บอกว่าเข้าใจ แล้วเดินไปหาเพื่อนกลุ่มของเขา"
        effects: {happiness: -1, knowledge: 1}
        family: [{drop: courter}]
        merit: [{cat: neutral}]
      - id: court_uni_exam_excuse
        text: "อ้างว่าติดอ่านหนังสือ"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]

