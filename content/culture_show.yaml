    choices:
      - id: laugh_loud
        text: "หัวเราะดัง ๆ ตามคนในร้าน"
        effects: {happiness: 1, relations: 1, network: -1}
        merit: [{cat: neutral}]
      - id: hum_quiet
        text: "ฮัมตามเบา ๆ ไม่มองใคร"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: change_topic
        text: "ชวนผู้ใหญ่บ้านคุยเรื่องอื่น"
        effects: {network: 1}
        merit: [{cat: neutral}]
      - id: own_joke
        text: "แต่งมุกแซวคนในหมู่บ้านต่อ"
        outcomes:
