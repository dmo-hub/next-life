  - id: after_ancestor_watch_01
    type: B
    stage: ระหว่างชาติ
    scene: ancestor
    years: [2400, 2700]
    lore_ref: lore-afterlife.md#3
    weight: 2
    title: "ผีเรือนเฝ้าเปล"
    text: "คนเฒ่าคนแก่ว่าผีบ้านผีเรือนอยู่ที่หัวเสาเรือน คอยดูแลเฉพาะคนในบ้าน คืนนี้คุณนั่งอยู่บนขื่อ มองเด็กน้อยคนหนึ่งนอนดิ้นในเปล เด็กคนนี้แหละที่คุณกำลังจะไปเป็น"
    choices:
      - text: "เฝ้าทั้งคืนตอนเด็กตัวร้อน"
        effects: {health: 1}
        merit: [{cat: help_others, level: 1}]
      - text: "ฮัมเพลงที่คนในบ้านร้องกันมา"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - text: "เคาะเสาเบา ๆ ให้คนในบ้านตื่น"
        outcomes:
          - {weight: 2, text: "คนในบ้านตื่นมาห่มผ้าให้พอดี แล้วบ่นว่าบ้านเก่าเสียงดังจริง", effects: {health: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ยายตื่นแทน งัวเงียแต่ก็ห่มผ้าให้ แล้วนั่งไกวเปลจนเด็กหลับ", effects: {relations: 1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: neutral}]
      - text: "นั่งฟังเสียงหายใจเด็กจนเช้า"
        effects: {happiness: 1}
        merit: [{cat: bhavana, level: 1}]

  - id: after_ancestor_school_01
    type: B
    stage: ระหว่างชาติ
    scene: ancestor
    years: [2400, 2700]
    lore_ref: lore-afterlife.md#3
    title: "ที่นั่งบนหิ้ง"
    text: "ตามคติผีบ้านผีเรือน วิญญาณบรรพบุรุษสถิตบนหิ้งคอยคุ้มครองคนในบ้าน คุณได้ที่นั่งบนหิ้งเล็ก ๆ ข้างหน้าต่าง เห็นเด็กในบ้านทำการบ้านไปเล่นไป ดินสอหายวันละแท่ง"
    choices:
      - text: "กระซิบให้ตั้งใจเรียน"
        effects: {knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - text: "ให้ฝันเห็นตัวเองทำงานดี ๆ"
        outcomes:
          - {weight: 2, text: "เด็กตื่นมาเล่าฝันไม่หยุด แล้วหยิบหนังสือขึ้นมาเอง", effects: {knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เด็กจำฝันไม่ได้เลย จำได้แค่ว่ามีคนแก่ยิ้มให้", effects: {happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "เฝ้าไม่ให้วิ่งข้ามถนนคนเดียว"
        effects: {health: 1}
        merit: [{cat: help_others, level: 1}]
      - text: "พาเพื่อนบ้านมาชวนเด็กเล่นด้วย"
        effects: {network: 1}
        merit: [{cat: neutral}]
      - text: "ไม่ชี้ทาง ให้เขาเลือกเอง"
        effects: {happiness: 1}
        merit: [{cat: bhavana, level: 1}]

  - id: after_ancestor_far_01
    type: B
    stage: ระหว่างชาติ
    scene: ancestor
    realm: [hell, peta]
    years: [2400, 2700]
    lore_ref: lore-afterlife.md#3
    title: "เฝ้าได้แค่นอกรั้ว"
    text: "ตามคติผีเรือน บรรพบุรุษเฝ้าลูกหลานในบ้าน แต่ในพระสูตรเล่าว่าผู้ที่กรรมยังค้างได้แค่ยืนนอกฝาเรือน วันที่ประตูเปิดให้กลับมา คุณยืนอยู่ปลายรั้ว เห็นลูกวิ่งเล่นอยู่ไกล ๆ เรียกเท่าไรก็ไม่ได้ยิน"
    choices:
      - text: "ยืนเฝ้าเงียบ ๆ ไม่ไปไหน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - text: "ยกมือรับข้าวที่บ้านกรวดน้ำมา"
        effects: {happiness: 1}
        merit: [{cat: dana, level: 1}]
      - text: "ฝากลมพัดกลิ่นดอกไม้เข้าไป"
        outcomes:
          - {weight: 1, text: "เด็กหยุดวิ่ง หันมามองทางรั้วนานผิดปกติ แล้วโบกมือ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ลมพัดไปไม่ถึง กลิ่นดอกไม้ไปตกที่บ้านข้าง ๆ แทน", effects: {network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "หันหลังกลับ ไม่อยากให้ใครห่วง"
        effects: {health: 1}
        merit: [{cat: bhavana, level: 1}]

  - id: after_ancestor_debt_01
    type: B
    stage: ระหว่างชาติ
    scene: ancestor
    years: [2400, 2700]
    lore_ref: lore-afterlife.md#3
    when: {flags: {has: [in_debt]}}
    title: "ห่วงหนี้ที่ทิ้งไว้"
    text: "ผีบ้านผีเรือนว่ากันว่าห่วงคนในบ้านที่สุด แต่สิ่งที่คุณห่วงกว่าคือหนี้ก้อนที่ยังไม่ได้ปิด จดหมายทวงหนี้ยังมาส่งที่บ้านทุกเดือน ส่วนลูกน้อยของคุณเริ่มนับเหรียญเป็นแล้ว"
    choices:
      - text: "สอนเด็กให้กลัวการกู้"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - text: "เฝ้าให้ลูกหลานไม่โดนคนทวงข่ม"
        outcomes:
          - {weight: 2, text: "คนทวงมาถึงหน้าบ้านแล้วใจอ่อนเอง ยอมคุยผ่อนกันดี ๆ", effects: {happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "คนทวงไม่รู้สึกอะไรเลย แต่ญาติหันมาช่วยกันผ่อนจนจบ", effects: {relations: 1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: neutral}]
      - text: "ให้เด็กโตมามีเพื่อนดีคอยช่วย"
        effects: {network: 1}
        merit: [{cat: neutral}]
      - text: "ยอมรับว่าหนี้นั้นเป็นของตัวเอง"
        effects: {relations: 1}
        merit: [{cat: bhavana, level: 1}]

  - id: after_ancestor_quiet_01
