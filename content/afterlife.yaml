    text: "ผีเรือนอย่างคุณได้กลับมาเฝ้าบ้านหลังเดิม ผู้ใหญ่ในบ้านยังไม่ค่อยคุยกันเหมือนตอนคุณอยู่ กินข้าวคนละเวลา ทักกันแค่ในกลุ่มแชต มีลูกคนเล็กของคุณนั่งมองทุกคนเงียบ ๆ"
