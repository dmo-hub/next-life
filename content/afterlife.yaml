      - text: "เข้าฝันญาติผู้ใหญ่ให้โทรหากัน"
        effects: {relations: 1}
        merit: [{cat: help_others, level: 1}]
      - text: "เฝ้าลูกคนเล็กคนเดียวพอ"
        effects: {health: 1}
        merit: [{cat: neutral}]
      - text: "สอนเด็กให้ช่างสังเกต"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - text: "ปล่อยวาง ให้คนเป็นว่ากันเอง"
        effects: {happiness: 1}
        merit: [{cat: bhavana, level: 1}]
