        merit: [{cat: neutral}]
      - id: swindle_trip_report
        text: "รวมชื่อทุกคนไปแจ้งความ"
        effects: {knowledge: 1, network: 1, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: swindle_trip_real_beach
        text: "ชวนคนที่รอขึ้นรถไฟไปทะเลเอง"
        effects: {happiness: 2, relations: 1, network: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: swindle_trip_go_home
        text: "กลับบ้านไปกินยาบำรุงให้คุ้ม"
        effects: {happiness: -1, health: 1}
        merit: [{cat: neutral}]
      - id: swindle_trip_picnic_here
        text: "ปูเสื่อตรงจุดนัด เที่ยวตรงนี้เลย"
        outcomes:
          - {weight: 1, ok: true, text: "ครอบครัวอื่นปูเสื่อต่อกันยาว ข้าวเหนียวไก่ย่างเดินไปทั่ว กลายเป็นทริปที่ไม่ต้องไปไหนและไม่มีใครลืม", effects: {happiness: 2, network: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจ้าของที่มาไล่ตอนบ่าย มีคนถามว่าทะเลอยู่ตรงไหน ไม่มีใครตอบได้จนถึงบ้าน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

