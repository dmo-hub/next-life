# ร่างเรื่อง ขายตรงและคนหลอกเงิน · 15 ใบ · ลงเกมแล้ว ใบ 249 จากร่าง 248 · แก้ตามข้อค้านรอบ 1 · ทุกใบไม่ผูกปี · ไม่เปลี่ยนสายชีวิตหลัก · ใช้ธง scam_aware ตัวเดียว ไม่ตั้งธงใหม่ · ธงไม่เกินใบละ 1 จุด
events:
  - id: swindle_seminar_clap_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [19, 30]}
    multipliers: {flags: {scam_aware: 0.5}}
    title: "ห้องปรบมือ"
    text: "ญาติชวนไปดูสาธิตน้ำยาถูพื้นที่ห้องประชุมชั้นบนร้าน ในห้องมีทั้งคนเพิ่งเรียนจบและคนเกษียณนั่งเต็ม ตัวแทนขายเล่าว่าเคยไม่มีอะไรเลย พอถึงคำว่าอิสรภาพ เสียงปรบมือดังทั้งห้อง ชุดเริ่มต้นวางรออยู่บนตักคุณแล้ว ประตูอยู่หลังแถวสุดท้าย"
    choices:
      - id: swindle_seminar_sign_now
        text: "รับชุดเริ่มต้นตอนมือยังร้อน"
        outcomes:
          - {weight: 1, ok: true, text: "เดือนแรกขายให้ญาติได้ครบชุด ยอดสวยจนเริ่มนับวันลาออก แล้วก็หมดญาติให้ขาย", effects: {happiness: 1, network: 1, money: {unit: income_x, amount: 0.2}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ของมาเต็มห้อง คนที่จะซื้อคือคนกลุ่มเดียวกับที่ถูกชวนมาฟัง กล่องซ้อนกันจนบังหน้าต่าง", effects: {happiness: -1, money: {unit: income_x, amount: -0.5}}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_seminar_ask_income
        text: "ขอดูรายได้จริงของคนในห้อง"
        effects: {knowledge: 2, relations: -1}
        merit: [{cat: neutral}]
      - id: swindle_seminar_toilet_exit
        text: "ขอไปห้องน้ำ แล้วเดินกลับบ้าน"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: swindle_seminar_take_relative
        text: "ดึงแขนญาติออกมาด้วยกัน"
        outcomes:
          - {weight: 1, ok: true, text: "ญาติโวยไปตลอดทาง แต่ซื้อข้าวมันไก่เลี้ยงคุณก่อนกลับ บอกว่าเกือบไปแล้วเหมือนกัน", effects: {relations: 2, knowledge: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ญาติสะบัดแขน บอกว่าคุณไม่มีวันรวย แล้วเดินกลับเข้าห้องไปคนเดียว", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_seminar_clap_louder
        text: "ปรบมือดังกว่าคนหน้าห้อง"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวแทนขายเชิญออกไปเล่าความสำเร็จหน้าห้อง คุณเล่าเรื่องผัดกะเพราจนจบ คนปรบมือเท่าเดิม แถมได้น้ำยาตัวอย่างกลับบ้านสองขวด", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มีคนเข้ามาขอสมัครใต้สายคุณ ทั้งที่คุณยังไม่รู้เลยว่าเขาขายอะไร ต้องเดินหนีจนถึงปากซอย", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: swindle_agent_quota_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    multipliers: {flags: {scam_aware: 0.5}}
    title: "โควตาเหลือที่สุดท้าย"
    text: "ญาติห่าง ๆ รู้จักสายส่งคนไปทำงานเมืองนอก คนทั้งซอยจึงรวมเงินส่งลูกหลานไปชุดเดียวกัน ค่าหัวก้อนใหญ่ ต้องจ่ายก่อนที่นั่งเต็ม ตัวคุณไม่ได้จะไปไหน แต่ทุกบ้านเห็นว่าคุณซื่อที่สุดในซอย เลยหอบซองเงินมาฝากให้ถือกองกลาง"
    choices:
      - id: swindle_quota_keep_pot
        text: "ถือเงินให้ แล้วส่งตามนัด"
        outcomes:
          - {weight: 1, ok: true, text: "คนไปถึงจริง งานหนักกว่าที่เล่าสองเท่า แต่เงินส่งกลับมาเกือบครบ ทั้งซอยเอาผลไม้มาฝากคุณอยู่หลายเดือน", effects: {relations: 1, network: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ถึงวันนัด ทั้งซอยหอบกระเป๋ามายืนรอหน้าสำนักงาน ห้องนั้นว่าง เหลือแต่ป้ายแขวนเอียงอยู่ แล้วทุกคนก็หันมาถามคุณ", effects: {happiness: -2, relations: -2}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_quota_check_office
        text: "ไปตรวจชื่อที่สำนักจัดหางาน"
        outcomes:
          - {weight: 2, ok: true, text: "เจ้าหน้าที่เปิดทะเบียนแล้วไม่เจอชื่อบริษัทนี้ คุณกลับมาบอกคนทั้งซอย บางบ้านขอเงินคืน บางบ้านเอาไปส่งเอง", effects: {knowledge: 2, relations: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ไปถึงตรงเวลาพักของเจ้าหน้าที่พอดี กลับมาถึงซอย ญาติมารับซองไปส่งเองแล้ว", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_quota_add_share
        text: "ลงขันเพิ่มให้เด็กข้างบ้านได้ไป"
        outcomes:
          - {weight: 1, ok: true, text: "เด็กคนนั้นไปถึงจริง เขียนจดหมายกลับมาทุกเดือน ปีต่อมาส่งเงินคืนครบ พร้อมขนมต่างเมืองหนึ่งกล่อง", effects: {happiness: 2, relations: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เงินก้อนนั้นหายไปพร้อมสาย เด็กข้างบ้านยังยกมือไหว้คุณทุกเช้า ซึ่งยิ่งทำให้คุณไม่รู้จะมองหน้ายังไง", effects: {happiness: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_quota_return_pot
        text: "คืนซองทุกบ้าน ขอไม่ยุ่ง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: swindle_quota_bag_seat
        text: "ขอจองอีกที่ไว้วางกระเป๋า"
        outcomes:
          - {weight: 1, ok: true, text: "ญาติหัวเราะจนหมดอารมณ์ขาย ทั้งวงเลิกรีบจ่าย แล้วนั่งถามกันว่าทำไมที่สุดท้ายมีทุกอาทิตย์", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ญาติจดจริงจังแล้วบอกว่าค่าที่นั่งกระเป๋าแพงกว่าคนนิดหน่อย คุณไม่แน่ใจเลยว่าเขาล้อเล่นอยู่หรือเปล่า", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: swindle_team_leader_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    multipliers: {flags: {scam_aware: 0.5}}
    title: "คำตอบเดียวของแม่ทีม"
    text: "เพื่อนสนิทเป็นตัวแทนขายครีมบำรุงผิว ยอดเดือนนี้ตกจนลากคุณไปนั่งเป็นเพื่อนตอนปรึกษาแม่ทีม แม่ทีมจับมือเพื่อนแล้วบอกว่าเข้าใจทุกอย่าง ถามอะไรก็ได้คำตอบเดิม ขายไม่ออกให้ตุนเพิ่ม เหนื่อยให้อบรมเพิ่ม เงินหมดให้เลื่อนขั้น แล้วเพื่อนก็หันมามองคุณ"
    choices:
      - id: swindle_team_lend_stock
        text: "ให้เพื่อนยืมเงินตุนอีกรอบ"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนถึงขั้นใหม่จริง ได้เข็มกลัดเงาวับกับคำชมต่อหน้าทีม ของยังเต็มห้องนอนเขา เงินคุณค่อย ๆ ได้คืนเป็นกระปุกครีม", effects: {relations: 1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "กล่องใหม่ทับกล่องเก่า วันหมดอายุบนกล่องล่างสุดมาถึงก่อนลูกค้าคนแรก เงินที่ให้ยืมก็ไม่มีใครพูดถึงอีกเลย", effects: {happiness: -1, money: {unit: income_x, amount: -0.6}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_team_ask_sold
        text: "ถามแม่ทีมว่าขายได้จริงกี่กล่อง"
        outcomes:
          - {weight: 1, ok: true, text: "แม่ทีมยิ้มแล้วเปลี่ยนเรื่อง ขากลับเพื่อนเปิดสมุดให้ดู ยอดทั้งปีมาจากของที่ตัวเองซื้อเกือบหมด คุณกับเพื่อนนั่งเงียบกันอยู่นาน", effects: {knowledge: 2, relations: 1}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
          - {weight: 1, text: "แม่ทีมบอกว่าคำถามแบบนี้คือพลังลบ เพื่อนขอให้คุณรออยู่นอกห้องในครั้งหน้า", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_team_help_quit
        text: "ช่วยเพื่อนนับกล่องแล้วขายล้าง"
        effects: {relations: 2, knowledge: 1, network: -1}
        merit: [{cat: help_others, level: 1}]
      - id: swindle_team_refer_kin
        text: "แนะนำญาติให้เพื่อนไปชวนต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "ญาติสมัครเพราะเกรงใจ ยอดเพื่อนขึ้น เจอกันงานบุญปีถัดมาญาติเดินเลี่ยงคุณไปอีกฝั่งของศาลา", effects: {relations: -1, network: 1}, merit: [{cat: greed_harm, level: 1}]}
          - {weight: 1, text: "ญาติฟังจบแล้วเปิดตู้ให้ดู ในนั้นมีกล่องแบบเดียวกันจากบริษัทอื่นอีกครึ่งตู้", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: swindle_team_sell_back
        text: "เสนอให้แม่ทีมรับซื้อกล่องคืน"
        outcomes:
          - {weight: 1, ok: true, text: "แม่ทีมอึ้งไปเกือบนาที ก่อนบอกว่าเป็นวิธีคิดของผู้นำระดับเพชร แล้วรีบนัดครั้งหน้า เพื่อนหัวเราะครั้งแรกในรอบเดือน", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แม่ทีมรับฟังด้วยรอยยิ้ม แล้วเขียนคอร์สการเจรจาให้คุณไปเรียนด้วยอีกคน เพื่อนจองที่ให้เรียบร้อย", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

