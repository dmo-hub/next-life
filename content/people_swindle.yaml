        text: "ยกขบวนไปหาบริษัทถึงที่"
        outcomes:
          - {weight: 1, ok: true, text: "พนักงานยอมคืนเงินครึ่งหนึ่งเพื่อให้ทุกคนเลิกยืนหน้าร้าน ระหว่างรอ คนในแถวกลายเป็นเพื่อนกันหมด", effects: {money: {unit: income_x, amount: 0.2}, network: 1, relations: 1}, merit: [{cat: neutral}]}
