# สายสอบบรรจุครู/ก.พ. (ใบ 255 จากร่าง 212) · ที่มาแต่ละใบอยู่ในรีเสิร์ชใบ 212
# ฐาน next-life origin/main cff8aa52 · prefix kru_ (ครู · สายใหม่) + kp_ (ขยายทางสอบ ก.พ. เดิม) · ค้น id ทั้งสองได้ 0
# ของเดิมที่ต่อ: ladder gov (data/careers.json 5 ขั้น · การ์ด career_first 4 ใบ when ladder gov) · ทาง "สอบ ก.พ." ในการ์ดงานแรก (career.mjs jobCard) · การ์ดรับสมัครกลางทาง recruit_gov (rank.mjs)
# ครูสอบบรรจุผ่าน = effects.ladder gov (ใช้ขั้นยศข้าราชการพลเรือนเดิม ชื่อขั้นไม่ใช่ของครู · ทางขั้นยศครูเป็นข้อเสนอ engine แยก)
# ใบรับเข้าอ่านธง exam_pass:uni + school uni ของแกน (แบบเดียวกับสายหมอ พยาบาล)
# ปีจริง: ใบทุนครูบ้านเกิดกั้น 2563 ขึ้นไป (ทุนเริ่มปีการศึกษา 2563) · ใบกู้สหกรณ์ 2 ใบกั้น 2544 ขึ้นไป (หนี้ชนิด coop ของเกมเปิด 2544 · ก่อนนั้น borrow throw) · ที่เหลือออกทุกปี
# เปิดทุกเพศใบเดียว · ใบทุนบ้านเกิดเปิดเฉพาะฐานะ ยากไร้ ยากจนมาก (ทุนให้ครัวเรือนรายได้ต่ำสุด)
# ใบกองต้องมี weight · นัดใบรับเข้า +4 ปีจากใบวัยรุ่น
# decisions 414: เด็ก 1 · วัยรุ่น 2 · หนุ่มสาว 6 (นัด 3 + กอง 3) · ทำงาน 2 · กลางคน 1 (นัดหนี้สหกรณ์) · ชรา 1
# ไม่มีชื่อคน โรงเรียน สหกรณ์ หรือสถาบันกวดวิชาจริง · ไม่สอนวิธีโกงสอบ
events:
  - id: kru_kid_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    multipliers: {flags: {good_student: 2}}
    when: {age: [8, 12]}
    title: "ครูตัวน้อย"
    text: "ครูประจำชั้นลาไปประชุมทั้งบ่าย ฝากให้คุณคุมห้องแล้วอ่านนิทานให้เพื่อนฟัง พอคุณยืนหน้ากระดาน ทั้งห้องเงียบกว่าตอนครูอยู่เสียอีก"
    choices:
      - id: dream
        text: "บอกครูว่าโตไปอยากเป็นครู"
        sets_flags: [kru_dream]
        effects: {happiness: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: read
        text: "อ่านนิทานทำเสียงทุกตัวละคร"
        effects: {happiness: 2, relations: 1}
        merit: [{cat: neutral}]
      - id: strict
        text: "จดชื่อคนคุยลงกระดาน"
        effects: {relations: -1, network: 1}
        merit: [{cat: neutral}]
      - id: play
        text: "ชวนทั้งห้องเล่นเกมแทน"
        sets_flags: [kru_dream]
        effects: {happiness: 2, relations: 1}
        merit: [{cat: neutral}]

  - id: kru_teen_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 1
    multipliers: {flags: {kru_dream: 3, good_student: 1.5}}
    when: {age: [15, 17], school: [upper], flags: {not: [kru_aim]}}
    title: "ครูแนะแนวถามทางต่อ"
    text: "ครูแนะแนวแจกใบเลือกคณะ คนในบ้านอยากให้เรียนครู บอกว่าบรรจุแล้วมีบำนาญ มีสวัสดิการรักษาพยาบาลทั้งบ้าน รุ่นพี่ที่จบครูบางคนยังสอบบรรจุไม่ติด ต้องเป็นครูอัตราจ้างรอปีต่อปี"
    choices:
      - id: education
        text: "เลือกคณะครู"
        sets_flags: [kru_aim]
        effects: {knowledge: 1, relations: 1}
        schedules: [{event: kru_admit_01, after_years: [4, 4]}]
        merit: [{cat: neutral}]
      - id: other
        text: "เลือกคณะอื่นที่ชอบ"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: ask_senior
        text: "ถามรุ่นพี่อัตราจ้างให้ละเอียด"
        effects: {network: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: fortune
        text: "ให้หมอดูหน้าวัดเลือกให้"
        outcomes:
          - {weight: 1, ok: true, text: "หมอดูชี้ว่าดวงเป็นครู คุณเลยกรอกคณะครูไว้อันดับแรก", sets_flags: [kru_aim], effects: {happiness: 1}, schedules: [{event: kru_admit_01, after_years: [4, 4]}], merit: [{cat: neutral}]}
          - {weight: 1, text: "หมอดูบอกว่าดวงค้าขาย คุณขำจนลืมถามต่อ", effects: {happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kru_local_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2563, 2650]
    weight: 1
    multipliers: {flags: {kru_dream: 3, good_student: 2}}
    when: {age: [16, 17], school: [upper], class: [ยากไร้, ยากจนมาก], flags: {not: [kru_aim]}}
    title: "ทุนครูบ้านเกิด"
    text: "ครูประจำชั้นยื่นใบประกาศทุนให้เรียนครูจนจบปริญญา มีค่าเทอม ค่าหอ ค่ากินรายวัน จบแล้วได้บรรจุเป็นครูในโรงเรียนเล็กแถวบ้าน ครูบอกว่าทั้งอำเภอได้ไม่กี่ที่ ต้องสอบแข่งและมีคนมาสัมภาษณ์ถึงบ้าน"
    choices:
      - id: apply
        text: "สมัครทุนครูบ้านเกิด"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.5}}, text: "ได้ทุน มีชื่อติดบอร์ดหน้าโรงเรียน", sets_flags: [kru_aim, kru_local], effects: {happiness: 2, relations: 1}, schedules: [{event: kru_admit_01, after_years: [3, 3]}, {event: kru_admit_local_01, after_years: [3, 3]}], merit: [{cat: neutral}]}
          - {weight: 2, text: "ไม่ได้ทุน แต่ยังเลือกคณะครูได้ตามปกติ", sets_flags: [kru_aim], effects: {happiness: -1}, schedules: [{event: kru_admit_01, after_years: [3, 3]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: work_now
        text: "ไม่สมัคร จะออกไปทำงานช่วยที่บ้าน"
        effects: {relations: 1, money: {unit: income_x, amount: 0.2}}
        merit: [{cat: neutral}]
      - id: give_friend
        text: "บอกให้เพื่อนที่จนกว่าไปสมัคร"
        effects: {relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: clean_house
        text: "รีบกลับไปเก็บบ้านรอคนสัมภาษณ์"
        sets_flags: [kru_aim]
        effects: {relations: 1}
        schedules: [{event: kru_admit_01, after_years: [3, 3]}]
        merit: [{cat: neutral}]

  - id: kru_admit_01
    type: A
    category: study
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 22], school: [uni], flags: {has: [kru_aim, exam_pass:uni], not: [kru_student, kru_civil]}}
    title: "นักศึกษาครู"
    text: "ชุดนักศึกษาครูต้องรีดจีบให้ตรงทุกเช้า วิชาแรกให้ยืนสอนเพื่อนในห้องห้านาที อาจารย์จับเวลาแล้วชี้ว่าคุณหันหลังให้ห้องตอนเขียนกระดานนานเกินไป"
    choices:
      - id: practice
        text: "ซ้อมสอนหน้ากระจกทุกคืน"
        sets_flags: [kru_student]
        effects: {knowledge: 2, happiness: -1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]
      - id: club
        text: "เข้าชมรมค่ายอาสาสอนหนังสือ"
        sets_flags: [kru_student]
        effects: {network: 2, relations: 1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: help_others, level: 1}]
      - id: switch
        text: "ย้ายไปคณะอื่น"
        clears_flags: [kru_aim, kru_local]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: nap
        text: "นั่งแถวหลังสุด รอเวลาเลิก"
        sets_flags: [kru_student]
        effects: {health: 1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]

  - id: kru_admit_local_01
    type: A
    category: study
    stage: หนุ่มสาว
    years: [2563, 2650]
    when: {age: [19, 22], flags: {has: [kru_aim, kru_local], not: [kru_student, kru_civil, exam_pass:uni]}}
    title: "นักศึกษาครูทุนบ้านเกิด"
    text: "ทุนครูบ้านเกิดพาเข้าคณะครูโดยไม่ต้องแย่งที่นั่งสอบกับใคร ค่าหอกับค่าเทอมออกตรงจากทุน ใบแจ้งทุนแนบสัญญาว่าจบแล้วต้องกลับไปบรรจุโรงเรียนเล็กแถวบ้าน เพื่อนในหอถามว่าพร้อมไปอยู่หมู่บ้านเดิมอีกสิบปีหรือยัง"
    choices:
      - id: practice
        text: "ซ้อมสอนหน้ากระจกทุกคืน"
        sets_flags: [kru_student]
        effects: {school: uni, knowledge: 2, happiness: -1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]
      - id: club
        text: "เข้าชมรมค่ายอาสาสอนหนังสือ"
        sets_flags: [kru_student]
        effects: {school: uni, network: 2, relations: 1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: help_others, level: 1}]
      - id: switch
        text: "คืนทุน ย้ายไปคณะอื่น"
        clears_flags: [kru_aim, kru_local]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: nap
        text: "นั่งแถวหลังสุด รอเวลาเลิก"
        sets_flags: [kru_student]
        effects: {school: uni, health: 1}
        schedules: [{event: kru_practicum_01, after_years: [2, 2]}]
        merit: [{cat: neutral}]

  - id: kru_practicum_01
    type: A
    category: study
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {age: [21, 26], flags: {has: [kru_student], not: [kru_civil]}}
    title: "ฝึกสอนเทอมแรก"
    text: "ลงฝึกสอนจริงในโรงเรียนประจำอำเภอ ห้องที่ได้มีนักเรียนสี่สิบคน แถวหลังเล่นโทรศัพท์ทั้งคาบ ครูพี่เลี้ยงยื่นแฟ้มแผนการสอนหนาเท่าสมุดโทรศัพท์ให้ บอกว่าเขียนให้ครบก่อนวันศุกร์"
    choices:
      - id: plan
        text: "นั่งเขียนแผนจนตีสอง"
        effects: {knowledge: 2, health: -1}
        schedules: [{event: kru_exam_01, after_years: [1, 1]}]
        merit: [{cat: neutral}]
      - id: back_row
        text: "ไปนั่งคุยกับแถวหลัง"
        effects: {relations: 2}
        schedules: [{event: kru_exam_01, after_years: [1, 1]}]
        merit: [{cat: neutral}]
      - id: game
        text: "สอนผ่านเกมทั้งคาบ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งห้องตื่น ครูพี่เลี้ยงขอยืมเกมไปใช้ต่อ", effects: {happiness: 2, network: 1}, schedules: [{event: kru_exam_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
          - {weight: 1, text: "เสียงดังจนห้องข้าง ๆ มาเคาะประตู", effects: {happiness: -1}, schedules: [{event: kru_exam_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quit_teach
        text: "พอแล้ว ไม่อยากเป็นครู"
        clears_flags: [kru_student, kru_aim]
        effects: {happiness: 1}
        merit: [{cat: neutral}]

  - id: kru_exam_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    when: {age: [22, 34], flags: {has: [kru_student], not: [kru_civil]}}
    title: "สอบบรรจุครู"
    text: "ประกาศสอบบรรจุครูผู้ช่วยออกมาแล้ว ทั้งจังหวัดเปิดไม่กี่สิบอัตรา คนสมัครเป็นพัน ร้านถ่ายเอกสารหน้ามหาวิทยาลัยขายชีตสรุปจนหมดแผง เพื่อนบางคนสอบมาแล้วสามปี"
    choices:
      - id: sit
        text: "อ่านเอง แล้วเข้าสอบ"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.6}}, text: "ติดอันดับในบัญชี ได้เรียกบรรจุเป็นครูผู้ช่วย", sets_flags: [kru_civil], effects: {ladder: gov, happiness: 3}, merit: [{cat: neutral}]}
          - {weight: 2, text: "คะแนนไม่ถึง ต้องรอรอบหน้า", sets_flags: [kru_temp], effects: {job: clerk, happiness: -1}, schedules: [{event: kru_exam_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tutor
        text: "ลงคอร์สติวสอบครู"
        requires: {money: {unit: income_x, amount: 0.2}, reason: "เงินไม่พอค่าติว"}
        cost: {unit: income_x, amount: 0.2}
        outcomes:
          - {weight: 1.5, ok: true, multipliers: {stats: {knowledge: 1.6}}, text: "ติดบัญชี ได้บรรจุเป็นครูผู้ช่วย", sets_flags: [kru_civil], effects: {ladder: gov, happiness: 3}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ติวครบทุกคอร์สแต่ยังไม่ติด", sets_flags: [kru_temp], effects: {job: clerk, happiness: -2}, schedules: [{event: kru_exam_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: home_post
        text: "รายงานตัวโรงเรียนตามทุน"
        requires: {flags: {has: [kru_local]}, reason: "ไม่ได้รับทุนครูบ้านเกิด"}
        sets_flags: [kru_civil]
        effects: {ladder: gov, relations: 2}
        merit: [{cat: neutral}]
      - id: give_up
        text: "ไม่สอบ ไปทำงานบริษัท"
        clears_flags: [kru_student]
        effects: {money: {unit: income_x, amount: 0.3}}
        merit: [{cat: neutral}]

  - id: kru_temp_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 2
    when: {age: [23, 30], flags: {has: [kru_temp], not: [kru_civil]}}
    title: "ครูอัตราจ้าง"
    text: "สอนเต็มตารางเหมือนครูประจำ แถมได้งานธุรการกับงานพัสดุของโรงเรียนมาอีกกอง เงินเดือนออกช้าเพราะรองบจากเขต ผู้อำนวยการบอกว่าปีหน้าอาจไม่มีงบจ้างต่อ"
    choices:
      - id: stay
        text: "สอนต่อ อ่านสอบไปด้วย"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: tutor_side
        text: "รับสอนพิเศษตอนเย็น"
        effects: {money: {unit: income_x, amount: 0.4}, health: -1}
        merit: [{cat: neutral}]
      - id: leave
        text: "ลาออกไปทำงานบริษัท"
        clears_flags: [kru_temp, kru_student]
        effects: {money: {unit: income_x, amount: 0.5}, happiness: 1}
        merit: [{cat: neutral}]
      - id: plant
        text: "ปลูกผักหลังอาคารเรียนกับเด็ก"
        effects: {happiness: 2, relations: 1}
        merit: [{cat: neutral}]

  - id: kp_exam_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [22, 30], occupation: [clerk, professional, manager, technician], ladder: [none, private, trade]}
    title: "สอบภาค ก."
    text: "เพื่อนร่วมรุ่นครึ่งกลุ่มแชตลงสมัครสอบความรู้ทั่วไปของ ก.พ. ปีนั้นที่นั่งสอบเป็นแสน คนที่ผ่านมีไม่กี่เปอร์เซ็นต์ ผ่านแล้วก็ยังต้องไปสอบของหน่วยงานที่เปิดรับอีกรอบ"
    choices:
      - id: sit
        text: "สมัครสอบ อ่านตอนกลางคืน"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.8}}, text: "ผ่านภาค ก. ได้ใบรับรองไว้ยื่นสมัครหน่วยงาน", sets_flags: [kp_pass_a], effects: {happiness: 2}, schedules: [{event: kp_agency_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
          - {weight: 3, text: "ขาดไปไม่กี่คะแนน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tutor
        text: "ลงคอร์สติวภาค ก."
        requires: {money: {unit: income_x, amount: 0.15}, reason: "เงินไม่พอค่าติว"}
        cost: {unit: income_x, amount: 0.15}
        outcomes:
          - {weight: 1.5, ok: true, multipliers: {stats: {knowledge: 1.8}}, text: "ผ่านภาค ก. คะแนนเฉียดเกณฑ์", sets_flags: [kp_pass_a], effects: {happiness: 2}, schedules: [{event: kp_agency_01, after_years: [1, 1]}], merit: [{cat: neutral}]}
          - {weight: 3, text: "ติวจนจำสูตรได้แต่ไม่ผ่าน", effects: {happiness: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: skip
        text: "ไม่สอบ งานเอกชนก็ดีอยู่แล้ว"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: sit_for_friend
        text: "ไปเป็นเพื่อนเพื่อนสอบเฉย ๆ"
