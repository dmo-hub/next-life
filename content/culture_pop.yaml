# การ์ดวัฒนธรรมไทยชุด pop (ใบ 216 จากร่าง 213)
events:
  - id: pop_rubberband_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [8, 12], school: [primary, lower]}
    title: "หนังยางเต็มกระเป๋า"
    text: "พักเที่ยงหลังโรงอาหาร เพื่อนกระเป๋าตุงคนหนึ่งเทหนังยางลงพื้น ท้าให้คุณลงหมดกระเป๋าในตาเดียว วงนี้เล่นเป่ากบ ใครเป่าทับได้ก็กินเส้นของอีกฝ่าย"
    choices:
      - id: all_in
        text: "ลงหมดกระเป๋าตาเดียว"
        outcomes:
          - {weight: 1, ok: true, text: "เป่าทีเดียวทับพอดี บ่ายนี้กระเป๋ากางเกงตุงจนนั่งไม่ลง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เหลือกระเป๋าเปล่า เพื่อนคืนให้เส้นหนึ่งไว้ตั้งตัว", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: one_band
        text: "ไม่รับคำท้า ลงทีละเส้นเหมือนเดิม"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: half_bet
        text: "ต่อรองขอลงแค่ครึ่งกระเป๋า"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: spit_trick
        text: "แอบถ่วงหนังยางด้วยน้ำลาย"
        outcomes:
          - {weight: 1, ok: true, text: "ชนะ แต่ไม่มีใครยอมเล่นกับเส้นนี้อีก", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "โดนจับได้ทั้งวง หลังจากนี้เส้นของคุณมีชื่อเรียกแล้ว", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_chain_jacks_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [7, 12], school: [primary, lower]}
    title: "โซ่หมากเก็บยาวที่สุดในห้อง"
    text: "พักเที่ยงคุณลากโซ่ออกมาต่อจนยาวถึงหน้าห้อง ห่วงสีพวกนี้ทุกคนมีไว้เล่นหมากเก็บ แต่ไม่มีใครต่อได้ยาวเท่าคุณ ครูเห็นเข้าก็ยึดไว้ บอกว่าจะคืนให้ถ้านับให้ฟังรวดเดียวไม่หลง"
    choices:
      - id: count_it
        text: "นับทีละห่วงต่อหน้าครู"
        outcomes:
          - {weight: 2, ok: true, text: "นับรวดเดียวจบ ครูคืนให้แล้วถามว่าการบ้านเลขเสร็จหรือยัง", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "นับหลงตอนร้อยกว่า ครูเอาโซ่ไปให้เด็กห้องอื่นนับต่อ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: friend_count
        text: "ขอเพื่อนช่วยนับคนละครึ่ง"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: start_over
        text: "ปล่อยไป เริ่มต่อโซ่ใหม่"
        effects: {happiness: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: one_million
        text: "ตอบหน้าตายว่าล้านห่วง"
        outcomes:
          - {weight: 1, ok: true, text: "ครูขำแล้วคืนให้ พร้อมการบ้านให้นับจนครบล้าน", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูไม่ขำ คุณได้ยืนนับหน้าห้องจนหมดคาบ แล้วโซ่ก็ยังอยู่กับครู", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_hide_cloth_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [6, 9], school: [primary]}
    title: "ผ้าอยู่ข้างหลังคุณ"
    text: "พักกลางวันที่ลานโรงเรียน ทั้งวงนั่งล้อมร้องเพลงมอญซ่อนผ้า ทุกคนเริ่มกลั้นขำกันหมด มีคุณคนเดียวที่ยังร้องอย่างตั้งใจ"
    choices:
      - id: feel_behind
        text: "เอามือคลำข้างหลังตัวเอง"
        outcomes:
          - {weight: 1, ok: true, text: "เจอผ้าทัน วิ่งไล่รอบวงจนเหนื่อยแต่สะใจ", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คลำช้าไปจังหวะเดียว ผ้าฟาดหลังเบา ๆ เสียงหัวเราะดังกว่าผ้าเยอะ", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: keep_singing
        text: "ร้องต่อ ไม่รู้ไม่ชี้"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: watch_faces
        text: "ดูหน้าเพื่อนว่าใครขำหนักสุด"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: cloth_hat
        text: "คว้าผ้าคลุมหัวตัวเองแล้วร้องต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งวงขำจนลืมว่าใครต้องวิ่ง เกมจบตรงนั้น", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร้องจบเพลงแล้วยังมองไม่เห็นทาง เดินชนคนนั่งไปสามคน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_water_bead_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [6, 10], school: [primary]}
    title: "เม็ดพองน้ำหน้ารั้วโรงเรียน"
    text: "เลิกเรียน เด็กทั้งแถวรุมแผงใกล้รั้วโรงเรียน ร้องขอเงินผู้ปกครองซื้อเม็ดเล็ก ๆ ที่แช่น้ำแล้วพองโต หน้าตาเหมือนลูกอม เพื่อนข้างคุณได้มาซองหนึ่งแล้ว กำลังหยิบเม็ดแรกขึ้นมาใกล้ปาก"
    choices:
      - id: grow_glass
        text: "ซื้อไปแช่แก้วดูมันโต"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: taste_it
        text: "ลองใส่ปากตามเพื่อน"
        outcomes:
          - {weight: 1, ok: true, text: "คายทันก่อนมันลงคอ แล้วบ้วนปากที่ก๊อกหน้าโรงเรียนจนเพื่อนกลับไปก่อน", effects: {knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "กลืนลงไป ปวดท้องจนครูรีบพาส่งโรงพยาบาล", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tell_teacher
        text: "บอกครูว่าเพื่อนจะกินมัน"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: plant_it
        text: "หว่านลงกระถาง รอมันออกผล"
        outcomes:
          - {weight: 1, ok: true, text: "เม็ดพองจนดินล้นกระถาง คนในบ้านยืนมองนานแต่ไม่มีใครถาม", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รอทั้งเทอมไม่มีอะไรงอก ต้นเดิมในกระถางเฉาไปหนึ่งต้น", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_trading_card_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [9, 12], school: [primary, lower]}
    title: "ใบหายากกับครูฝ่ายปกครอง"
    text: "กลางคาบเพื่อนหลังห้องสะกิดขอแลกใบหายากที่คุณเพิ่งได้มา ใบแต้มพลังสูงแบบนี้ทั้งห้องมองกันตาค้าง คุณยังไม่ทันตอบ ครูฝ่ายปกครองก็เดินเข้าห้องมาค้นกระเป๋าทีละแถว"
    choices:
      - id: hide_sock
        text: "ซ่อนไว้ในถุงเท้า"
        outcomes:
          - {weight: 2, ok: true, text: "ครูค้นไม่เจอ การ์ดงอนิดหน่อยและมีกลิ่นติดไปตลอดชีพ", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ใบหล่นตอนลุกยืน ครูคีบด้วยสองนิ้วแล้วริบใบนั้นไป", effects: {happiness: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hand_over
        text: "ยื่นให้ครูเองก่อนโดนค้น"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: pass_friend
        text: "ส่งต่อใต้โต๊ะให้เพื่อนคนนั้น"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนรอดและคืนให้ครบ เรื่องนี้เล่ากันอีกหลายปี", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนรอด แต่พรุ่งนี้บอกว่าก็แลกกันแล้วนี่", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: duel_teacher
        text: "ท้าครูดวลการ์ดก่อนโดนค้น"
        outcomes:
          - {weight: 1, ok: true, text: "ครูรู้กติกาดีกว่าที่คิด คุณแพ้ราบ แต่ครูปล่อยผ่าน", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ครูไม่ตอบ แล้วเขียนชื่อคุณลงสมุดแทน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_mini_racer_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [9, 12]}
    title: "มอเตอร์ตัวใหม่ของเพื่อน"
    text: "เย็นนี้เพื่อนเอามอเตอร์ตัวใหม่มาอวดข้างราง บอกว่าแรงกว่าของทุกคันในซอย รถจิ๋วใส่ถ่านของคุณเพิ่งแพ้มันมาสามรอบ ค่าขนมทั้งเดือนของคุณแลกมอเตอร์แบบนี้ได้พอดี"
    choices:
      - id: buy_motor
        text: "ทุ่มค่าขนมซื้อมอเตอร์"
        outcomes:
          - {weight: 2, ok: true, text: "รถพุ่งนำทั้งราง เดือนนี้กินข้าวเปล่าแต่ไม่บ่น", effects: {happiness: 2, network: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เข้าโค้งแรกรถบินออกรางแตกสองท่อน ค่าขนมทั้งเดือนไปด้วยกัน", effects: {happiness: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tune_self
        text: "แต่งเองจากของที่มี"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: borrow_car
        text: "ขอยืมรถเพื่อนลองสักรอบ"
        outcomes:
          - {weight: 2, ok: true, text: "แรงจริง เพื่อนยิ้มอยู่แต่ตาไม่ละจากรถเลย", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถเพื่อนหลุดโค้งล้อแตก ค่าขนมเดือนนี้ไปเป็นค่าชดใช้อยู่ดี", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: chase_car
        text: "ปล่อยนอกรางแล้ววิ่งไล่รอบตึก"
        outcomes:
          - {weight: 1, ok: true, text: "ถ่านหมดก่อนคุณ รถจอดรออยู่หน้าตึกอย่างสุภาพ", effects: {health: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถเลี้ยวลงท่อไปเอง คุณยืนฟังเสียงมอเตอร์เบาลงเรื่อย ๆ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_arcade_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.5
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "เหรียญสุดท้ายหน้าตู้"
    text: "ยังไม่ทันวางกระเป๋า เด็กต่างโรงเรียนก็หยอดเข้ามาท้าคุณบนจอเกมต่อสู้ ร้านเกมตู้หลังเลิกเรียนแน่นเหมือนทุกวัน ในกระเป๋าคุณเหลือค่ารถกลับบ้านพอดี เป็นเหรียญเดียว"
    choices:
      - id: take_fight
        text: "หยอดรับคำท้า"
        outcomes:
          - {weight: 1, ok: true, text: "ชนะจนมีคนยืนดูเต็มหลัง จบแล้วเดินกลับบ้านอย่างสง่า", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แพ้ในสิบวินาที เดินกลับบ้านหนึ่งชั่วโมง", effects: {happiness: -2, health: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bus_home
        text: "เก็บไว้ ขึ้นรถกลับก่อนฝนตก"
        effects: {health: 1}
        merit: [{cat: neutral}]
      - id: watch_pro
        text: "ยืนดูคนเก่งเล่นจนค่ำ"
        effects: {knowledge: 1, network: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: secret_move
        text: "หยอดแล้วกดมั่ว บอกว่าเป็นท่าลับ"
        outcomes:
          - {weight: 1, ok: true, text: "ท่าออกเอง เด็กแถวนั้นจดตามกันใหญ่ คุณเดินกลับบ้านแบบคนมีสูตร", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ตัวละครของคุณกระโดดอยู่กับที่จนหมดยก ส่วนคุณเดินกลับบ้าน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_tape_player_01
    type: A
    category: family
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.5
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "เครื่องแรกของตัวเอง"
    text: "คืนนี้เงินในกระป๋องครบพอดี ค่าขนมที่เก็บมาทั้งปีซื้อเครื่องเล่นเทปพกพาได้หนึ่งเครื่อง คนในห้องอยากมีกันทั้งนั้น เดินไปไหนมีเพลงตามไปด้วย ที่บ้านเห็นกระป๋องเข้า บอกว่าเอาไปลงเรียนพิเศษดีกว่า"
    choices:
      - id: buy_it
        text: "ซื้อเลย เงินของเราเอง"
        effects: {happiness: 3, relations: -1}
        merit: [{cat: neutral}]
      - id: buy_used
        text: "ซื้อมือสอง เหลือแบ่งให้ที่บ้าน"
        outcomes:
          - {weight: 2, ok: true, text: "เสียงยานนิดหน่อย แต่เป็นของคุณ ที่บ้านก็เลิกพูดเรื่องนี้", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เล่นได้สองม้วนแล้วเครื่องกินเทป ร้านมือสองปิดไปแล้ว", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tutor
        text: "ไปเรียนพิเศษตามที่บอก"
        effects: {knowledge: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: sell_tape
        text: "ยืมเครื่องเพื่อนอัดเสียงร้องขาย"
        outcomes:
          - {weight: 1, ok: true, text: "เงินก้อนเดิมยังอยู่ ขายได้สามม้วนเพราะฟังแล้วขำ ม้วนถัดไปมีคนจ้างไม่ให้ร้อง", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เงินก้อนเดิมยังอยู่ แต่เพื่อนเอาม้วนไปอัดเพลงทับ เสียงคุณไม่เหลือหลักฐาน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: pop_sticker_booth_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.5
    when: {age: [14, 18]}
    title: "ที่ว่างในตู้สติกเกอร์"
    text: "ถึงคิวกลุ่มคุณหน้าตู้ถ่ายรูปสติกเกอร์พอดี คนที่คุณแอบชอบก็เดินผ่านมา ถ่ายแล้วตัดแบ่งแลกกับเพื่อนได้ และในตู้ยังเบียดได้อีกหนึ่งคน เพื่อนทั้งกลุ่มมองคุณ แล้วค่อย ๆ ขยับให้ที่ว่าง"
    choices:
      - id: invite
        text: "ชวนเข้ามาถ่ายด้วย"
        outcomes:
