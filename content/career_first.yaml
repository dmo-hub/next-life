# ทางแรกของสายยศ (B170 · 65-4 "ไม่ล็อก แต่ตามตัว"): การ์ด first_of ออกปีที่เข้าสายครั้งเดียว ไม่อยู่ในกองสุ่ม
# ทางที่เลือกไม่ปิดตัวเลือกใบหลัง แต่ทิ้งธงชื่อเสียง (badge_*) ที่การ์ดสายเดียวกันอ่าน + ผลย้อน 6–14 ปี + ใบแก้ตัวที่ล้างธงได้
# ผลย้อนกับใบแก้ตัวกั้น ladder ⇒ ออกจากสายแล้วเรื่องเงียบไป
events:
  - id: first_police_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    first_of: police
    title: "ซองต้อนรับ"
    text: "สัปดาห์แรกที่โรงพัก จ่าที่อยู่มานานที่สุดวางซองบาง ๆ ไว้บนโต๊ะ บอกว่าเป็นส่วนแบ่งจากร้านในเขต คนมาใหม่ได้ทุกคน รับไว้คนในโรงพักจะได้ไว้ใจ"
    choices:
      - id: take
        text: "รับไว้ตามธรรมเนียม"
        hint: "ราคา: บาปหนัก"
        sets_flags: [took_bribe, badge_bent]
        schedules: [{event: echo_police_ledger_01, after_years: [6, 14]}]
        merit: [{cat: greed_harm, level: 2}]
        outcomes:
          - {weight: 3, ok: true, text: "จ่าตบไหล่ เย็นนั้นทั้งเวรพาไปกินข้าว งานด่วนเรื่องไหนก็มีคนช่วย", effects: {network: 2, money: {unit: income_x, amount: 0.3, grey: true}}, merit: [{cat: neutral}], sets_flags: [dirty_money]}
          - {weight: 1, text: "ซองเดือนต่อมาหนากว่าเดิม จ่าบอกว่ามีงานให้ช่วยดูแลบ่อนในเขตด้วย", effects: {happiness: -2, money: {unit: income_x, amount: 0.5, grey: true}}, merit: [{cat: neutral}], sets_flags: [dirty_money]}
      - id: return_it
        text: "คืนซองต่อหน้าทุกคน"
        sets_flags: [badge_clean]
        schedules: [{event: echo_police_clean_01, after_years: [6, 14]}]
        merit: [{cat: sila, level: 1}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "สารวัตรเห็นอยู่ อีกเดือนถัดมาเรียกไปช่วยงานสอบสวนคดีใหญ่", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ทั้งโรงพักเงียบ เวรดึกตกเป็นของคุณทั้งเดือน ไม่มีใครชวนกินข้าวอีก", effects: {relations: -2, happiness: -2}, merit: [{cat: neutral}]}
      - id: give_away
        text: "รับมา แล้วเอาไปทำบุญ"
        hint: "ราคา: บาปเบา"
        sets_flags: [took_bribe]
        merit: [{cat: greed_harm, level: 1}, {cat: dana, level: 1}]
        effects: {network: 1, happiness: -1}
      - id: desk_job
        text: "ขอย้ายไปงานธุรการ"
        merit: [{cat: neutral}]
        effects: {income_mult: 0.95, happiness: 1, network: -1}

  # ← first_police_01 "รับไว้ตามธรรมเนียม"
  - id: echo_police_ledger_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    when: {ladder: [police]}
    title: "สมุดส่วยเล่มเก่า"
    text: "ผู้ตรวจจากส่วนกลางยึดสมุดบัญชีส่วยของโรงพักแรกได้ ลายมือจ่าคนนั้นจดทุกซองตั้งแต่ปีที่คุณเข้ามา ชื่อคุณอยู่บรรทัดแรกของหน้าแรก"
    choices:
      - id: confess
        text: "ยอมรับ คืนเงินทั้งหมด"
        clears_flags: [badge_bent]
        merit: [{cat: sila, level: 1}]
        outcomes:
          - {weight: 2, ok: true, text: "ถูกภาคทัณฑ์และคืนเงินจนหมดตัว แต่ยังได้ใส่เครื่องแบบต่อ", effects: {money: {unit: income_x, amount: -1}, happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คำสารภาพกลายเป็นหลักฐานมัดตัวเอง ถูกให้ออกจากราชการ", effects: {job: labor, happiness: -3}, sets_flags: [caught_fraud], merit: [{cat: neutral}]}
      - id: name_up
        text: "ชี้ไปที่คนสั่งเก็บ"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "คำให้การตรงกับสมุด คนข้างบนถูกย้าย คุณได้แค่ภาคทัณฑ์", effects: {network: -2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนข้างบนเส้นใหญ่กว่า เรื่องวนกลับมาตกที่คุณคนเดียว", effects: {job: labor, relations: -1}, sets_flags: [caught_fraud], merit: [{cat: neutral}]}
      - id: pay_off
        text: "วิ่งเต้นให้เรื่องเงียบ"
        hint: "ราคา: บาปหนัก"
        merit: [{cat: greed_harm, level: 2}]
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {network: 1.3}}, text: "แฟ้มหายไปจากโต๊ะผู้ตรวจ แต่ต้องจ่ายแพงกว่าเงินที่เคยได้ทั้งหมด", effects: {money: {unit: income_x, amount: -1.5}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนรับเงินปิดเรื่องโดนจับเสียเอง ชื่อคุณขึ้นข่าวพร้อมกัน", effects: {job: labor, happiness: -3, relations: -2}, sets_flags: [caught_fraud], merit: [{cat: neutral}]}
      - id: deny
        text: "ยืนยันว่าไม่รู้เรื่อง"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ลายมือในสมุดไม่ใช่ของคุณ ผู้ตรวจปล่อยไปแต่จดชื่อไว้", effects: {happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ร้านในเขตมาเป็นพยาน ถูกสั่งพักราชการระหว่างสอบ", effects: {income_mult: 0.85, happiness: -2}, merit: [{cat: neutral}]}

  # ← first_police_01 "คืนซองต่อหน้าทุกคน"
  - id: echo_police_clean_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    when: {ladder: [police]}
    title: "คนที่เคยคืนซอง"
    text: "เจ้าของร้านข้าวแกงหน้าโรงพักแรกยังจำได้ว่าคุณคืนซองตั้งแต่สัปดาห์แรก วันนี้เขาถือแฟ้มเรื่องตำรวจรีดไถในตลาดมาหาคุณคนเดียว"
    choices:
      - id: dig_in
        text: "รับเรื่อง สืบเอง"
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "สืบจนได้หลักฐาน คนรีดไถถูกย้าย ตลาดทั้งตลาดยกมือไหว้เวลาเดินผ่าน", effects: {relations: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยังไม่ทันได้หลักฐาน คำสั่งย้ายไปโรงพักชายแดนก็มาถึง", effects: {network: -2, happiness: -2}, merit: [{cat: neutral}]}
      - id: pass_on
        text: "ส่งต่อให้ผู้ตรวจ"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ผู้ตรวจรับเรื่องจริง ชื่อคุณไม่ต้องโผล่", effects: {relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แฟ้มเงียบหายไปสามเดือน เจ้าของร้านไม่ทักคุณอีก", effects: {relations: -1}, merit: [{cat: neutral}]}
      - id: let_go
        text: "บอกให้เขาทำใจ"
        merit: [{cat: neutral}]
        effects: {happiness: -2}
      - id: sell_file
        text: "เอาแฟ้มไปต่อรองกับคนรีด"
        hint: "ราคา: บาปหนัก"
        clears_flags: [badge_clean]
        sets_flags: [took_bribe]
        merit: [{cat: greed_harm, level: 2}]
        outcomes:
          - {weight: 2, ok: true, text: "ได้ซองหนากว่าที่เคยคืนไปหลายเท่า เจ้าของร้านย้ายร้านไปเดือนต่อมา", effects: {money: {unit: income_x, amount: 1, grey: true}, happiness: -1}, merit: [{cat: neutral}], sets_flags: [dirty_money]}
          - {weight: 1, text: "เจ้าของร้านอัดเสียงไว้ทั้งหมด ถูกสั่งพักราชการ", effects: {income_mult: 0.85, relations: -2}, merit: [{cat: neutral}]}

  # ใบแก้ตัวของคนรับซองแรก — ล้าง badge_bent ได้ (took_bribe คงเป็นประวัติ)
  - id: police_bent_turn_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 8
    when: {ladder: [police], flags: {has: [badge_bent]}}
    title: "ซองต้อนรับอีกใบ"
    text: "ตำรวจหนุ่มที่เพิ่งย้ายมายืนลังเลหน้าซองบาง ๆ แบบเดียวกับที่คุณเคยรับ ทั้งโต๊ะหันมามองคุณ รอว่าคนรุ่นพี่จะว่ายังไง"
    choices:
      - id: tell_take
        text: "บอกให้รับไว้"
        hint: "ราคา: บาปหนัก"
        merit: [{cat: greed_harm, level: 2}]
        effects: {network: 1}
      - id: tell_return
        text: "บอกให้คืน แล้วคืนส่วนตัวเองด้วย"
        clears_flags: [badge_bent]
        merit: [{cat: sila, level: 1}]
        outcomes:
          - {weight: 1, ok: true, text: "อีกสองคนในโต๊ะคืนตาม ซองต้นเดือนบางลงจนจ่าเลิกส่ง", effects: {income_mult: 0.9, happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คืนอยู่สองคน เวรดึกกับงานหนักตกเป็นของคุณกับเขาทั้งปี", effects: {income_mult: 0.9, happiness: -1, network: -1}, merit: [{cat: neutral}]}
      - id: stay_silent
        text: "ไม่พูดอะไร"
        merit: [{cat: neutral}]
        effects: {happiness: -1}
      - id: tell_story
        text: "พาไปเล่าเรื่องตัวเองตอนเลิกงาน"
        merit: [{cat: help_others, level: 1}]
        effects: {relations: 1, happiness: 1}

  # ใบยั่วของคนคืนซองแรก — รับแล้วชื่อสะอาดหาย
  - id: police_clean_tempt_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 8
    when: {ladder: [police], flags: {has: [badge_clean]}}
    title: "ข้อเสนอจากเจ้าของบ่อน"
    text: "เจ้าของบ่อนในเขตนัดเจอที่ร้านกาแฟ บอกว่ารู้ว่าคุณไม่รับซอง เลยไม่ให้ซอง แต่จะโอนค่าเทอมเรียนต่อปริญญาโทให้ แค่ตอนตรวจให้โทรบอกก่อนครึ่งชั่วโมง"
    choices:
      - id: accept
        text: "รับข้อเสนอ"
        hint: "ราคา: บาปหนัก"
        clears_flags: [badge_clean]
        sets_flags: [dirty_money, took_bribe, badge_bent]
        merit: [{cat: greed_harm, level: 2}]
        effects: {knowledge: 1, money: {unit: income_x, amount: 0.5, grey: true}}
      - id: refuse
        text: "ปฏิเสธ จ่ายกาแฟเอง"
        merit: [{cat: sila, level: 1}]
        effects: {happiness: 1}
      - id: raid
        text: "ปฏิเสธ แล้วนำทีมเข้าตรวจ"
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 1, ok: true, text: "ตรวจเจอของกลางเต็มห้อง ผู้กำกับเอ่ยชื่อคุณในที่ประชุมทั้งจังหวัด", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บ่อนว่างเปล่าตอนไปถึง มีคนโทรบอกก่อน ข้างบนเรียกไปถามว่าทำไมใจร้อน", effects: {network: -2, happiness: -1}, merit: [{cat: neutral}]}
      - id: record
        text: "อัดเสียงไว้ เก็บเป็นหลักฐาน"
        merit: [{cat: neutral}]
        effects: {knowledge: 1, happiness: -1}

  # ราชการ — ใบเบิกล่วงเวลาที่ไม่ได้ทำ
  - id: first_gov_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    first_of: gov
    title: "ใบเบิกล่วงเวลา"
    text: "สิ้นเดือนแรกที่บรรจุ หัวหน้าฝ่ายส่งใบเบิกค่าล่วงเวลามาให้เซ็น ชื่อคุณอยู่ครบทุกเสาร์อาทิตย์ทั้งที่ไม่เคยมา ทุกคนในฝ่ายเซ็นกันหมดแล้ว"
    choices:
      - id: sign
        text: "เซ็นตามทุกคน"
        hint: "ราคา: บาปหนัก"
        sets_flags: [took_bribe, desk_bent]
        schedules: [{event: echo_gov_audit_01, after_years: [4, 10]}]
        merit: [{cat: cheat_exploit, level: 2}]
        outcomes:
          - {weight: 3, ok: true, text: "เงินเดือนเดือนแรกหนากว่าที่คิด หัวหน้าบอกว่าเด็กใหม่คนนี้เข้าใจระบบ", effects: {network: 2, money: {unit: income_x, amount: 0.3, grey: true}}, merit: [{cat: neutral}], sets_flags: [dirty_money]}
          - {weight: 1, text: "เดือนต่อมาหัวหน้าให้คุณเป็นคนทำใบเบิกแทนทั้งฝ่าย ลายมือคุณอยู่ทุกแผ่น", effects: {happiness: -2, money: {unit: income_x, amount: 0.3, grey: true}}, merit: [{cat: neutral}], sets_flags: [dirty_money]}
      - id: strike_out
        text: "ขีดชื่อตัวเองออก"
        sets_flags: [desk_clean]
        schedules: [{event: echo_gov_trusted_01, after_years: [4, 10]}]
        merit: [{cat: sila, level: 1}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "ผู้อำนวยการเห็นใบเบิกที่มีรอยขีด เรียกไปถามแล้วจำชื่อคุณได้", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ทั้งฝ่ายต้องทำใบใหม่ งานเอกสารที่ไม่มีใครอยากทำตกมาที่โต๊ะคุณทั้งปี", effects: {relations: -2, happiness: -2}, merit: [{cat: neutral}]}
      - id: work_it
        text: "เซ็น แล้วมาทำงานจริงทุกเสาร์"
        hint: "ราคา: บาปเบา"
        merit: [{cat: cheat_exploit, level: 1}]
        effects: {knowledge: 1, health: -1, happiness: -1}
      - id: ask_rule
        text: "ถามว่าระเบียบเขียนไว้ยังไง"
        merit: [{cat: neutral}]
        effects: {knowledge: 1, network: -1}

  # ← first_gov_01 "เซ็นตามทุกคน"
  - id: echo_gov_audit_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    when: {ladder: [gov]}
    title: "ตรวจย้อนหลังสิบปี"
    text: "ผู้ตรวจเงินแผ่นดินขอใบเบิกล่วงเวลาย้อนหลังสิบปีของกรม ใบแรกที่หยิบขึ้นมามีลายเซ็นคุณ วันเสาร์ที่คุณไปงานแต่งเพื่อนต่างจังหวัด"
    choices:
      - id: repay
        text: "ยอมรับ คืนเงินทั้งหมด"
        clears_flags: [desk_bent]
        merit: [{cat: sila, level: 1}]
        outcomes:
          - {weight: 2, ok: true, text: "คืนเงินพร้อมดอกเบี้ย ถูกตัดเงินเดือนแต่ยังรับราชการต่อ", effects: {money: {unit: income_x, amount: -1}, happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถูกตั้งกรรมการสอบวินัยร้ายแรง ให้ออกจากราชการ", effects: {job: labor, happiness: -3}, sets_flags: [caught_fraud], merit: [{cat: neutral}]}
      - id: blame_boss
        text: "บอกว่าหัวหน้าสั่ง"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ลายมือในใบเบิกเป็นของหัวหน้าเก่า คุณโดนแค่ภาคทัณฑ์", effects: {network: -2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หัวหน้าเก่าเกษียณไปแล้ว ความผิดตกที่คนที่ยังอยู่", effects: {income_mult: 0.85, happiness: -2}, merit: [{cat: neutral}]}
      - id: fix_papers
        text: "ทำบันทึกการทำงานย้อนหลัง"
        hint: "ราคา: บาปหนัก"
        merit: [{cat: cheat_exploit, level: 2}]
        outcomes:
          - {weight: 2, ok: true, text: "บันทึกย้อนหลังผ่านตาผู้ตรวจ เรื่องจบที่หนังสือเตือน", effects: {happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รูปงานแต่งวันนั้นอยู่ในโซเชียลของเพื่อน เอกสารปลอมกลายเป็นความผิดอีกกระทง", effects: {job: labor, happiness: -3, relations: -1}, sets_flags: [caught_fraud], merit: [{cat: neutral}]}
      - id: keep_quiet
        text: "นิ่งไว้ รอให้เรื่องเงียบ"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ผู้ตรวจได้คนผิดครบแล้วก่อนถึงชื่อคุณ", effects: {happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ชื่อคุณอยู่ในรายงานฉบับสุดท้าย ถูกเรียกเงินคืนพร้อมเบี้ยปรับ", effects: {money: {unit: income_x, amount: -1.5}}, merit: [{cat: neutral}]}

  # ← first_gov_01 "ขีดชื่อตัวเองออก"
  - id: echo_gov_trusted_01
    type: A
