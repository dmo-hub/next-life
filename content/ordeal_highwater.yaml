          - {weight: 1, text: "หม้อแกงยังไม่ได้ล้าง น้ำออกมาเป็นรสแกงส้ม ผู้ใหญ่เรียกให้ไปขัดหม้อทั้งบ่าย", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: highwater_water_week_01
