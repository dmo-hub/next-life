    text: "น้ำหลากมาทุกปี ของใต้ถุนบ้านต้องขึ้นชั้นบนก่อนค่ำ ทั้งไก่ เครื่องมือ แคร่ และกระสอบข้าวโพด ระเบียงมีที่จำกัด หลังคุณก็ไม่เหมือนเมื่อสิบปีก่อน เด็กหนุ่มข้างบ้านยืนรอฟังว่าจะให้ยกอะไรก่อน"
    choices:
      - id: hw_chickens_first
        text: "ไก่ก่อน ของอื่นรอได้"
        outcomes:
          - {weight: 1, ok: true, text: "ไก่ครบทุกตัวบนระเบียง เสียงดังทั้งคืน แต่เช้ามาคุณได้ไข่ฟองแรกจากบนราวตากผ้า", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไก่สองตัวบินลงไปทุกครั้งที่ยกขึ้น เด็กหนุ่มไล่จนหมดแรง แล้วคุณต้องนั่งปลอบเขาอีกต่างหาก", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hw_tools_first
        text: "เครื่องมือหากินขึ้นก่อน"
        effects: {knowledge: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: hw_order_by_weight
        text: "นั่งสั่งการ ไม่ยกเอง"
        effects: {health: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: hw_ask_upstream
        text: "ถามคนต้นน้ำว่ายังขึ้นอีกไหม"
        effects: {network: 2, knowledge: 1}
        merit: [{cat: neutral}]
      - id: hw_raft_cot
        text: "ยกแคร่ขึ้นไปนั่งเป็นประธาน"
        outcomes:
          - {weight: 1, ok: true, text: "ทุกคนต้องทำงานรอบแคร่ คุณได้นั่งคุมจนงานจบ ไก่ก็มาเกาะพักข้าง ๆ เป็นเพื่อนอีกสองตัว", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แคร่ตัวนั้นกินที่ระเบียงจนหมด ของที่เหลือไม่มีที่วาง คุณต้องลงจากตำแหน่งพร้อมแคร่ทั้งตัว", effects: {relations: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
