# ร่างเรื่อง น้ำท่วม อยู่กับภัยระดับครัวเรือน · 15 ใบ · ลงเกมแล้ว ใบ 247 จากร่าง 246 · แก้ตามข้อค้านรอบ 1 · บ้านและเพื่อนบ้านเท่านั้น · ไม่อ้างเหตุใหญ่ปีจริง · ไม่อ่านและไม่ตั้งธง
events:
  - id: highwater_centipede_01
    type: A
    category: health
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [6, 12]}
    title: "ตะขาบตัวที่สอง"
    text: "ฝนตกติดกันหลายวันจนตะขาบเดินเข้าบ้าน ลุงที่มาช่วยซ่อมรั้วเตือนว่าอย่าไปเหยียบ ตัวที่ถูกเหยียบจะส่งกลิ่นเรียกเพื่อนมา คุณไม่เชื่อ เลยเอารองเท้าแตะกระทืบไปหนึ่งตัวหน้าครัว รอยยังอยู่บนพื้นตรงนั้น"
    choices:
      - id: hw_wash_spot
        text: "ตักน้ำมาล้างรอยให้สะอาด"
        effects: {knowledge: 1, health: 1}
        merit: [{cat: neutral}]
      - id: hw_watch_spot
        text: "นั่งเฝ้าว่าจะมีตัวใหม่ไหม"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวที่สองเดินออกมาจากใต้ตุ่มจริง คุณวิ่งไปบอกผู้ใหญ่ แล้วเล่าเรื่องนี้ให้เพื่อนฟังไปอีกสามวัน", effects: {knowledge: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เฝ้าจนเผลอหลับพิงเสา ตื่นมาเจอแต่มดเดินแถวผ่านหน้า ลุงหัวเราะที่คุณยังนั่งอยู่ที่เดิม", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hw_tell_grownup
        text: "บอกผู้ใหญ่ให้มาดูก่อน"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: hw_go_barefoot
        text: "ยังไม่เชื่อ เดินเท้าเปล่าต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "วิ่งเล่นได้ทั้งบ่ายไม่เจออะไร คุณไปบอกเพื่อนว่าเรื่องของลุงเป็นนิทาน", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ก้าวที่สามเห็นตะขาบอีกตัวข้างนิ้วเท้า คุณกระโดดขึ้นโต๊ะกินข้าวโดยไม่รู้ตัว และไม่ลงมาอีกจนค่ำ", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hw_centipede_sign
        text: "เขียนป้ายห้ามตะขาบเข้าบ้าน"
        outcomes:
          - {weight: 1, ok: true, text: "ผู้ใหญ่ขำจนลืมดุเรื่องเปลืองกระดาษ ป้ายอยู่ตรงนั้นทั้งหน้าฝน คุณถือว่าได้ผลเพราะวันนั้นไม่เจอตัวใหม่", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เช้ามาตะขาบเดินผ่านใต้ป้ายพอดี เพื่อนบอกว่ามันคงอ่านหนังสือไม่ออก คุณเลยต้องวาดรูปเพิ่ม", effects: {happiness: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: highwater_basin_count_01
