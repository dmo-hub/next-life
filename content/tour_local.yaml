# ร่างเรื่อง เที่ยวและเทศกาลท้องถิ่น · 15 ใบ · ลงเกมแล้ว ใบ 243 จากร่าง 242 · แก้ตามข้อค้านรอบ 1 · เลี่ยงสงกรานต์ เข้าพรรษา ลอยกระทง ปีใหม่ (มีใน festivals.yaml แล้ว)
# เลี่ยงซ้ำของเดิม: กฐิน (love_kathin_committee_01) · สารท/ชิงเปรต/ข้าวประดับดิน (afterlife) · ผีตาโขน (legend_mask_01) · ผ้าป่า (belief) · เทียนพรรษา (festivals) · งานเลี้ยงจับฉลากที่ทำงาน (festivals)
events:
  - id: tour_nine_temples_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.5
    when: {age: [31, 45]}
    title: "รถบัสเก้าวัดต้นปี"
    text: "ต้นปีกลุ่มป้าในซอยเหมารถบัสไหว้พระเก้าวัดในวันเดียว ป้าหัวหน้าทัวร์ย้ำว่าเก้าพ้องกับก้าว ไหว้ครบแล้วงานจะก้าวหน้า ที่นั่งเหลือสองตัวท้ายรถ ค่าทัวร์รวมข้าวกล่องสองมื้อ รถออกตีห้า กลับถึงซอยสามทุ่ม"
    choices:
      - id: join_full
        text: "จองที่นั่ง ไปให้ครบเก้าวัด"
        outcomes:
          - {weight: 1, ok: true, text: "ครบเก้าวัดตามแผน ป้าทั้งรถจำชื่อคุณได้ ขากลับแบ่งข้าวเหนียวหมูทอดให้จนอิ่ม", effects: {relations: 2, network: 1, health: -1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วัดที่เจ็ดคนแน่นจนรถวนหาที่จอดเกือบชั่วโมง ถึงวัดที่เก้าโบสถ์ปิดแล้ว ได้ไหว้แค่หน้าประตู", effects: {health: -1, happiness: -1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: stay_home
        text: "ใช้วันหยุดนอนพักที่บ้าน"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: send_money
        text: "ฝากเงินทำบุญไปกับป้า"
        effects: {relations: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: ten_temples
        text: "ขอไปสิบวัด เผื่อก้าวกระโดด"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าหัวหน้าทัวร์ชอบใจ สั่งรถแวะวัดที่สิบริมทาง ทั้งรถปรบมือให้ไอเดียนี้", effects: {happiness: 2, network: 1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วัดที่สิบอยู่คนละทางกับเส้นกลับ ทั้งรถถึงซอยเกือบเที่ยงคืน ป้าหัวหน้าทัวร์ไม่ทักคุณไปทั้งเดือน", effects: {relations: -2, health: -1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_red_cross_fair_01
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.5
    when: {age: [31, 45], family: [{role: child, alive: true}]}
    title: "งานกาชาดคืนวันเสาร์"
    text: "งานกาชาดประจำปีที่สวนกลางเมือง เข้าประตูมาก็เจอซุ้มสลากกาชาดเรียงยาว ไฟประดับเต็มต้นไม้ ลูกเดินนำไปหยุดหน้าซุ้มปาลูกดอกทีละซุ้ม ในกระเป๋ามีเงินที่ตั้งใจไว้สำหรับคืนนี้แค่ก้อนเดียว"
    choices:
      - id: many_tickets
        text: "ซื้อสลากกาชาดทีเดียวสิบใบ"
        outcomes:
          - {weight: 1, ok: true, text: "ได้พัดลมตั้งพื้นหนึ่งตัว หิ้วกลับบ้านกันสองคนเหมือนได้ถ้วยรางวัล", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สิบใบได้ผงซักฟอกถุงเล็กหนึ่งถุง ที่เหลือเป็นบัตรขอบคุณ", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: donate_walk
        text: "หย่อนเงินบริจาคแล้วเดินชมไฟ"
        effects: {happiness: 1, relations: 1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: every_booth
        text: "ปล่อยลูกเล่นทุกซุ้มที่อยากเล่น"
        outcomes:
          - {weight: 1, ok: true, text: "ได้ตุ๊กตาตัวใหญ่จากซุ้มยิงปืนจุก ลูกหอบกลับบ้านทั้งที่ตุ๊กตาตัวโตกว่ากระเป๋า", effects: {relations: 2, happiness: 1, money: {unit: income_x, amount: -0.08}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครบทุกซุ้มได้แค่พวงกุญแจสามอัน เงินหมดก่อนถึงซุ้มอาหาร ต้องกลับไปกินข้าวต้มที่บ้าน", effects: {relations: 1, happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: dart_duel
        text: "ท้าลูกแข่งปาลูกดอกเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ปาแตกสามใบติด คนเฝ้าซุ้มยกตุ๊กตาให้ ลูกเล่าเรื่องนี้ซ้ำทั้งสัปดาห์", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณพลาดทั้งสิบดอก ลูกปาต่อแตกทุกใบ คุณได้หน้าที่หอบตุ๊กตาเดินทั้งงาน", effects: {happiness: 1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_rocket_pool_01
    type: A
    category: society
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.5
    when: {age: [46, 59]}
    title: "ลงขันบั้งไฟเดือนหก"
    text: "เดือนหกฟ้ายังไม่ให้ฝน ผู้ใหญ่บ้านเรียกประชุมใต้ต้นมะขาม ปีนี้หมู่บ้านจะทำบั้งไฟขึ้นถวายพญาแถนตามความเชื่อเรื่องขอฝน ต้องการคนอัดดินปืนกับคนต่อเงินค่าไม้ไผ่ ตามธรรมเนียม บั้งไฟของใครแตกคาฐานต้องถูกหามโยนลงโคลน"
    choices:
      - id: chip_in
        text: "ลงขันค่าไม้ไผ่กับดินปืน"
        effects: {network: 1, relations: 1, money: {unit: income_x, amount: -0.04}}
        merit: [{cat: neutral}]
      - id: pack_powder
        text: "อาสาช่วยช่างอัดหางบั้งไฟ"
        outcomes:
          - {weight: 1, ok: true, text: "ช่างสอนวิธีอัดให้แน่นทีละชั้น บั้งไฟของหมู่บ้านขึ้นตรงจนคนตะโกนกันทั้งทุ่ง", effects: {network: 2, happiness: 2, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผงดินปืนปลิวเข้าตาตอนอัด ต้องนั่งล้างตาที่เต็นท์ปฐมพยาบาลข้างลานครึ่งวัน พลาดดูวันจุด", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: work_as_usual
        text: "ไม่ยุ่ง ไปทำงานตามปกติ"
        effects: {relations: -1, money: {unit: income_x, amount: 0.02}}
        merit: [{cat: neutral}]
      - id: mud_dare
        text: "ท้าหมู่บ้านข้าง ใครแพ้ลงโคลน"
        outcomes:
          - {weight: 1, ok: true, text: "บั้งไฟของหมู่บ้านคุณขึ้นสูงจนลับตา ทีมหมู่บ้านข้างเคียงถูกหามโยนลงโคลนกลางเสียงเชียร์ แล้วชวนกันมากินข้าวด้วยกัน", effects: {happiness: 2, network: 2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บั้งไฟของหมู่บ้านคุณพ่นควันแล้วแตกคาฐาน คุณในฐานะคนท้าถูกหามโยนลงโคลนเป็นคนแรก", effects: {happiness: 1, health: -1, relations: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_rocket_parade_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.5
    when: {age: [13, 18]}
    title: "แถวหน้าขบวนแห่บั้งไฟ"
    text: "วันแห่บั้งไฟ ครูฝึกเซิ้งของหมู่บ้านขาดคนแถวหน้าสองคน เพื่อนในกลุ่มชี้มาที่คุณ ชุดเพิ่งเย็บเสร็จเมื่อคืน แถวหน้าต้องเต้นตากแดดสามกิโลจนถึงลานจุด ข้างทางมีกองเชียร์ถือน้ำเย็นกับกระติบข้าวเหนียวรออยู่"
    choices:
      - id: front_row
        text: "รับแถวหน้า เต้นจนถึงลาน"
        outcomes:
          - {weight: 1, ok: true, text: "แดดเปรี้ยงแต่จังหวะกลองพาไปจนสุดทาง ผู้ใหญ่ทั้งหมู่บ้านจำหน้าคุณได้", effects: {happiness: 2, network: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กิโลที่สองหน้ามืด ต้องนั่งพักใต้ต้นไม้ ดูขบวนเดินผ่านไปทั้งที่ยังใส่ชุดเต็มยศ", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: water_runner
        text: "เดินถือน้ำแจกคนในขบวน"
        effects: {relations: 2, health: -1}
        merit: [{cat: neutral}]
      - id: watch_shade
        text: "ยืนดูใต้ร่มกับกองเชียร์"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: pot_lid
        text: "คว้าฝาหม้อมาตีให้จังหวะ"
        outcomes:
          - {weight: 1, ok: true, text: "เสียงฝาหม้อเข้ากับกลองยาวพอดี มือกลองหันมาพยักหน้า ปีหน้าเขาชวนเข้าวงจริง", effects: {happiness: 2, network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตีเร็วกว่ากลองครึ่งจังหวะ แถวหน้าเต้นเพี้ยนตามทั้งแถว ครูฝึกยึดฝาหม้อไปคืนเจ้าของ", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_boat_pull_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.5
    when: {age: [31, 45]}
    title: "ลากเรือพระวันออกพรรษา"
    text: "ออกพรรษาปีนี้ญาติทางใต้ชวนลงไปงานชักพระ คุณนั่งรถไฟกลางคืนไปถึงตอนเช้า เรือพนมพระประดับผ้าสีกับกระดาษฉลุตั้งอยู่บนล้อ เชือกลากยาวเต็มถนน ข้างทางมีคนขายต้มห่อใบพ้อ ป้าบอกว่ามาถึงแล้วต้องได้ลากสักครั้ง"
    choices:
      - id: pull_rope
        text: "จับเชือกลากไปจนถึงวัด"
        outcomes:
          - {weight: 1, ok: true, text: "ลากไปพร้อมเสียงโห่จังหวะเดียวกันทั้งถนน ญาติชี้บอกคนแถวนั้นว่าคนนี้มาจากไกล", effects: {happiness: 2, relations: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มือพองตั้งแต่ครึ่งทาง ฝืนลากต่อจนผิวแตก ขากลับต้องให้ญาติถือกระเป๋าให้", effects: {health: -2, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: buy_tom
        text: "ซื้อต้มใบพ้อไปถวายพระ"
        effects: {happiness: 1, relations: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: roadside_stall
        text: "ช่วยญาติขายของริมทาง"
        effects: {network: 1, health: -1, money: {unit: income_x, amount: 0.03}}
        merit: [{cat: neutral}]
      - id: throw_tom
        text: "เข้าวงปาต้มกับเด็ก ๆ"
        outcomes:
          - {weight: 1, ok: true, text: "ปาต้มขึ้นเรือพระได้ตามที่ผู้ใหญ่สอน เด็กทั้งวงยกให้คุณเป็นหัวหน้าทีม", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ต้มห่อหนึ่งพลาดไปโดนหัวคนตีกลอง ต้องเดินไปยกมือขอโทษทั้งที่ยังกลั้นหัวเราะไม่อยู่", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_yellow_flags_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.5
    when: {age: [19, 30]}
    title: "เก้าวันธงเหลือง"
    text: "เพื่อนชวนลงไปเที่ยวเมืองทางใต้ช่วงเทศกาลถือศีลกินผัก ทั้งเมืองแขวนธงเหลือง ร้านข้าวแกงเปลี่ยนเป็นอาหารเจ คนแต่งชุดขาวเดินไปโรงเจตั้งแต่เช้ามืด ป้ายหน้าที่พักเขียนว่าเก้าวันนี้ขอให้งดเนื้อสัตว์"
    choices:
      - id: full_nine
        text: "ถือศีลกินผักให้ครบเก้าวัน"
        outcomes:
          - {weight: 1, ok: true, text: "วันที่ห้าตัวเบาจนตื่นเช้าได้เอง กลับบ้านไปยังกินผักต่ออีกสัปดาห์", effects: {health: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "วันที่สามกินแต่ของทอดเจจนคอแห้ง หน้าขึ้นตุ่มทั้งแถบ", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: dinner_only
        text: "กินเจเฉพาะมื้อเย็น"
        effects: {health: 1}
        merit: [{cat: neutral}]
      - id: food_crawl
        text: "ตะลุยร้านอาหารเจทุกซุ้ม"
        outcomes:
          - {weight: 1, ok: true, text: "ได้รู้ว่าโปรตีนเกษตรทำเป็นหมูแดงได้ จดสูตรกลับไปลองทำเอง", effects: {knowledge: 1, happiness: 2, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กินจนจุกแน่นหน้าอก ต้องนอนพักที่ห้องทั้งบ่ายแทนไปทะเล", effects: {health: -1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: secret_pork
        text: "ใส่ชุดขาวแต่แอบหาหมูปิ้ง"
        outcomes:
          - {weight: 1, ok: true, text: "แผงหมูปิ้งปิดทั้งเมืองเก้าวันนี้ เดินหาจนเย็นได้แต่ปาท่องโก๋ เลยถือศีลไปโดยไม่ตั้งใจ", effects: {health: 1, happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจอแผงเดียวในซอยลึก ยืนกินหลังเสาไฟ เพื่อนเดินผ่านมาพอดีพร้อมกล้องถ่ายรูป", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tour_red_envelopes_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.5
    when: {age: [46, 59]}
    title: "ซองแดงตรุษจีนริมน้ำ"
    text: "ตรุษจีนปีนี้ไหว้บรรพบุรุษเสร็จตั้งแต่เจ็ดโมงเช้า หลาน ๆ สิบสองคนเรียงแถวกล่าวคำอวยพรรอซองแดง กลางตลาดริมน้ำเสียงกลองขบวนแห่มังกรดังมาถึงบ้าน ญาติที่มีแผงขายของหน้าบ้านปิดมาสองวัน มีคนเคาะถามหาของ ญาติเลยฝากให้คุณช่วยเฝ้า"
    choices:
      - id: equal_thick
        text: "ใส่ซองหนาเท่ากันทุกคน"
        effects: {relations: 2, money: {unit: income_x, amount: -0.08}}
        merit: [{cat: neutral}]
      - id: by_age
        text: "ใส่ตามวัย คนเล็กได้น้อยกว่า"
        outcomes:
          - {weight: 1, ok: true, text: "หลานคนโตช่วยอธิบายให้น้อง ๆ ฟังว่าทำไม ทั้งบ้านพยักหน้าตาม", effects: {relations: 1, money: {unit: income_x, amount: -0.04}}, merit: [{cat: neutral}]}
