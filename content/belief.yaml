# กลุ่ม belief · สายมู 6 กิจกรรม (ใบ 12): ดูดวง · ฤกษ์ยาม · หวยสายมู · บนบาน/แก้บน · เครื่องราง/สักยันต์ · ทำบุญเสริมดวง
# ผลอยู่ได้แค่ความสุข · ความสัมพันธ์ · เงินจ่ายออก · ธง · ป้ายบุญ — ยกเว้นหวยสายมูที่แกนจับรางวัลเอง (ticket: true)
# เล่าแบบเคารพความเชื่อ ไม่ตัดสินว่างมงาย ไม่บอกว่าพิธี/เลขได้ผล · สถานที่ใช้ชื่อทั่วไป ไม่ใช่วัด/ศาลจริง
events:
  # ดูดวง — ผลคำทำนาย 3 โทนสุ่มเท่ากัน ไม่อ่านบัญชี ไม่สอดคล้องกับเหตุการณ์จริง · โทนเตือนเสนอพิธีได้ครั้งเดียว
  - id: bel_fortune_market
    type: B
    category: belief
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 2
    title: "หมอดูตลาดนัด"
    text: "ตลาดนัดเย็นวันศุกร์มีโต๊ะหมอดูลายมือตั้งอยู่ท้ายซอย เพื่อนสองคนต่อคิวรออยู่แล้วและหันมากวักมือเรียก"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: fortune, tradition: พราหมณ์}
    choices:
      - id: read_palm
        text: "นั่งให้หมอดูลายมือ"
        cost: {unit: fixed_baht, amount: 100, ref_year: 2560}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, text: "หมอดูว่าเส้นวาสนาชัด ปีหน้ามีคนอุปถัมภ์ เดินออกมายิ้มไม่หุบ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หมอดูพูดกว้าง ๆ ว่าชีวิตขึ้นลงเป็นธรรมดา ให้ขยันไว้ ฟังแล้วก็เฉย ๆ", merit: [{cat: neutral}]}
          - {weight: 1, text: "หมอดูขมวดคิ้ว บอกว่าช่วงนี้ดวงตก ให้ระวังเรื่องเงินกับคนใกล้ตัว", effects: {happiness: -1}, next: bel_fortune_market_rite, merit: [{cat: neutral}]}
      - id: watch_friends
        text: "นั่งฟังเพื่อนดูดวงอยู่ข้าง ๆ"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: buy_snack
        text: "ไปซื้อขนมรอเพื่อนแทน"
        merit: [{cat: neutral}]
      - id: go_home
        text: "แยกกลับบ้านก่อน"
        merit: [{cat: neutral}]
  - id: bel_fortune_market_rite
    type: B
    category: belief
    stage: หนุ่มสาว
    years: [2500, 2650]
    title: "สะเดาะเคราะห์"
    text: "หมอดูเสนอว่าถ้าไม่สบายใจ ทำพิธีสะเดาะเคราะห์ง่าย ๆ ที่โต๊ะนี้ได้ หรือไปทำบุญเองที่วัดก็ได้เหมือนกัน แล้วแต่สะดวก"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: fortune, tradition: พราหมณ์}
    choices:
      - id: rite
        text: "ทำพิธีที่โต๊ะให้สบายใจ"
        cost: {unit: fixed_baht, amount: 300, ref_year: 2560}
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: temple
        text: "พรุ่งนี้ไปใส่บาตรเองดีกว่า"
        cost: {unit: fixed_baht, amount: 50, ref_year: 2560}
        effects: {happiness: 1}
        merit: [{cat: dana, level: 1}]
      - id: thanks
        text: "ขอบคุณ แล้วฟังไว้เป็นข้อคิด"
        merit: [{cat: neutral}]
      - id: laugh
        text: "หัวเราะกับเพื่อนแล้วลืมไป"
        merit: [{cat: neutral}]

  - id: bel_fortune_cards
    type: B
    category: belief
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    title: "ไพ่ทำนายในห้าง"
    text: "ระหว่างเดินห้างวันหยุด เห็นซุ้มเปิดไพ่ทำนายตั้งอยู่หน้าลิฟต์ คนที่นั่งคิวก่อนหน้าเดินออกมาด้วยสีหน้าโล่งใจ"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: fortune, tradition: ผสม}
    choices:
      - id: read_cards
        text: "นั่งให้เปิดไพ่สักชุด"
        cost: {unit: fixed_baht, amount: 200, ref_year: 2560}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, text: "ไพ่ใบแรกที่เปิดเป็นดวงอาทิตย์ หมอดูบอกว่าเหนื่อยมานานจะได้พักใจ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไพ่ออกมาปนกันทั้งดีทั้งร้าย หมอดูสรุปว่าทุกอย่างอยู่ที่ตัวเรา", merit: [{cat: neutral}]}
          - {weight: 1, text: "หมอดูเปิดไพ่หอคอย บอกว่าอาจมีเรื่องเปลี่ยนกะทันหัน ให้เผื่อใจไว้", effects: {happiness: -1}, next: bel_fortune_cards_rite, merit: [{cat: neutral}]}
      - id: ask_price
        text: "ถามราคาแล้วเดินผ่านไป"
        merit: [{cat: neutral}]
      - id: call_friend
        text: "โทรชวนเพื่อนมาดูด้วยกันวันหลัง"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: wait_car
        text: "ไปนั่งรอในรถ"
        merit: [{cat: neutral}]
  - id: bel_fortune_cards_rite
    type: B
    category: belief
    stage: กลางคน
    years: [2500, 2650]
    title: "ของติดตัว"
    text: "หมอดูหยิบหินสีเล็ก ๆ ออกมาวางบนโต๊ะ บอกว่าพกไว้แล้วใจจะนิ่งขึ้น จะรับหรือไม่รับก็ได้ ไม่ว่ากัน"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: fortune, tradition: ผสม}
    choices:
      - id: take_stone
        text: "รับหินมาพกไว้"
        cost: {unit: fixed_baht, amount: 250, ref_year: 2560}
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: pray_home
        text: "กลับไปสวดมนต์ที่บ้านแทน"
        effects: {happiness: 1}
        merit: [{cat: bhavana, level: 1}]
      - id: decline
        text: "ขอบคุณแต่ไม่รับ"
        merit: [{cat: neutral}]
      - id: tell_spouse
        text: "เก็บไว้เล่าให้คนที่บ้านฟัง"
        effects: {relations: 1}
        merit: [{cat: neutral}]

  # ฤกษ์ยาม — ถือฤกษ์ให้ผู้ใหญ่สบายใจ ไม่มีผลต่อความสำเร็จของงานนั้น
  - id: bel_auspicious_house
    type: B
    category: belief
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    title: "ฤกษ์ขึ้นบ้านใหม่"
    text: "ที่อยู่ใหม่พร้อมย้ายเข้าแล้ว ผู้ใหญ่ที่บ้านโทรมาถามว่าดูฤกษ์ขึ้นบ้านหรือยัง บางครอบครัวถือมาก บางครอบครัวไม่ถือ บ้านนี้ถือ"
    lore_ref: lore-finance-belief.md#B
    when: {family: [{role: parent, alive: true}]}
    belief: {kind: auspicious_time, tradition: พราหมณ์}
    choices:
      - id: follow
        text: "รอย้ายตามฤกษ์ที่ผู้ใหญ่หาให้"
        cost: {unit: fixed_baht, amount: 500, ref_year: 2560}
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: monks
        text: "นิมนต์พระมาเจริญพระพุทธมนต์"
        cost: {unit: fixed_baht, amount: 2000, ref_year: 2560}
        effects: {happiness: 1, relations: 1}
        merit: [{cat: dana, level: 1}]
      - id: own_day
        text: "ย้ายวันที่สะดวก ไม่รอฤกษ์"
        effects: {relations: -1}
        merit: [{cat: neutral}]
      - id: half
        text: "ย้ายก่อน แล้วค่อยทำพิธีตามฤกษ์"
        cost: {unit: fixed_baht, amount: 300, ref_year: 2560}
        effects: {happiness: 1}
        merit: [{cat: neutral}]

  - id: bel_auspicious_shop
    type: B
    category: belief
    stage: ทำงาน
    years: [2500, 2650]
    weight: 3
    title: "ฤกษ์เปิดร้าน"
    text: "ร้านใกล้พร้อมเปิดแล้ว ผู้ใหญ่ในบ้านอยากให้รอฤกษ์ที่ดูไว้ อีกเกือบเดือน ค่าเช่าร้านเดินทุกวันแม้ยังไม่เปิด"
    lore_ref: lore-finance-belief.md#B
    when: {flags: {has: [own_business]}, family: [{role: parent, alive: true}]}
    belief: {kind: auspicious_time, tradition: ผสม}
    choices:
      - id: wait
        text: "รอเปิดตามฤกษ์"
        cost: {unit: income_x, amount: 0.05}
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: open_now
        text: "เปิดเลย ขายได้ก่อนดีกว่า"
        effects: {relations: -1}
        merit: [{cat: neutral}]
      - id: soft_open
        text: "เปิดเงียบ ๆ ก่อน ฉลองวันฤกษ์"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: give_alms
        text: "ทำบุญเช้าวันเปิดร้านแทน"
        cost: {unit: fixed_baht, amount: 300, ref_year: 2560}
        effects: {happiness: 1}
        merit: [{cat: dana, level: 1}]

  # เครื่องราง/สักยันต์ — ความอุ่นใจเท่านั้น ไม่ลดความเสี่ยงใด ๆ · ข้อห้ามของสำนักเป็นเนื้อเรื่อง ไม่มีกลไกลงโทษ
  - id: bel_amulet_center
    type: B
    category: belief
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    title: "ศูนย์พระเครื่อง"
    text: "เพื่อนร่วมงานชวนไปเดินศูนย์พระเครื่องช่วงพักเที่ยง แผงเรียงยาวสุดตา คนส่องพระกันเงียบ ๆ เหมือนอยู่ในห้องสมุด"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: amulet, tradition: พุทธ}
    choices:
      - id: rent
        text: "เช่าพระองค์เล็กมาห้อยคอ"
        cost: {unit: fixed_baht, amount: 1500, ref_year: 2560}
        sets_flags: [has_amulet:phra]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: look
        text: "เดินดูเป็นความรู้"
        merit: [{cat: neutral}]
      - id: donate
        text: "หยอดตู้บริจาคหน้าศูนย์"
        cost: {unit: fixed_baht, amount: 20, ref_year: 2560}
        merit: [{cat: dana, level: 1}]
      - id: lunch
        text: "ขอตัวไปกินข้าวก่อน"
        merit: [{cat: neutral}]

  - id: bel_amulet_yantra
    type: B
    category: belief
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 2
    title: "สักยันต์"
    text: "รุ่นพี่ชวนไปสำนักสักยันต์แถวชานเมือง อาจารย์บอกข้อห้ามไว้ยาวเหยียด รุ่นพี่บอกว่าที่สักไว้ทำให้ใจกล้าขึ้น"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: amulet, tradition: ผสม}
    choices:
      - id: tattoo
        text: "สักยันต์แถวเดียวที่หลัง"
        cost: {unit: fixed_baht, amount: 1000, ref_year: 2560}
        sets_flags: [has_amulet:yantra]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: cloth
        text: "ขอผ้ายันต์ไปติดบ้านแทน"
        cost: {unit: fixed_baht, amount: 200, ref_year: 2560}
        sets_flags: [has_amulet:cloth]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: company
        text: "ไปเป็นเพื่อนรุ่นพี่เฉย ๆ"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: decline
        text: "ไม่ไป ยังไม่พร้อม"
        merit: [{cat: neutral}]

  # ทำบุญเสริมดวง — คู่เจตนา ต้นทุนเท่ากัน ป้ายเหมือนกัน · ทำหวังผลบุญน้อยกว่า 1 ระดับ และมีการ์ดตามมาถ้าเงินไม่ดีขึ้น
  - id: bel_merit_wish_robe
    type: B
    category: belief
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    title: "ทอดผ้าป่า"
    text: "วัดใกล้บ้านจัดงานทอดผ้าป่า เพื่อนบ้านเดินถือซองมาชวนแต่เช้า บอกว่าใครอยากอธิษฐานอะไรก็เขียนใส่ซองไว้ได้"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: merit_wish, tradition: พุทธ, outside_canon: [intent_merit]}
    choices:
      - {id: sincere, pair_id: mw_robe, intent: sincere, text: "ร่วมทำบุญด้วยใจ", cost: {unit: income_x, amount: 0.02}, effects: {happiness: 1}, merit: [{cat: dana, level: 2}]}
      - {id: wish, pair_id: mw_robe, intent: wish_for_gain, text: "ทำบุญแล้วขอให้มีโชคลาภ", cost: {unit: income_x, amount: 0.02}, effects: {happiness: 1}, merit: [{cat: dana, level: 1}], sets_flags: [hope_set:mw_robe], schedules: [{event: bel_hope_robe, after_years: [3, 5]}]}
      - {id: help, text: "ไปช่วยยกของในงานแทน", effects: {relations: 1}, merit: [{cat: help_others, level: 1}]}
      - {id: skip, text: "ไม่ไปงานนี้", merit: [{cat: neutral}]}
  - id: bel_hope_robe
    type: A
    category: belief
    stage: ทำงาน
    years: [2500, 2650]
    text: "หลายปีผ่านไป เงินเก็บยังวนอยู่ที่เดิม บางคืนนั่งคิดเรื่องรายจ่ายเดือนหน้าจนนอนไม่หลับ"
    lore_ref: lore-finance-belief.md#B
    when: {flags: {has: [hope_set:mw_robe]}}
    belief: {kind: merit_wish, tradition: พุทธ}
    choices: []

  - id: bel_merit_wish_birthday
    type: B
    category: belief
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    title: "ทำบุญวันเกิด"
    text: "เช้าวันเกิดปีนี้ตื่นเร็วกว่าปกติ ตั้งใจจะแวะวัดถวายสังฆทานก่อนเข้างาน ระหว่างเลือกของในร้านก็คิดว่าจะอธิษฐานอะไรดี"
    lore_ref: lore-finance-belief.md#B
    belief: {kind: merit_wish, tradition: พุทธ, outside_canon: [intent_merit]}
    choices:
      - {id: sincere, pair_id: mw_birthday, intent: sincere, text: "ถวายด้วยใจ ไม่ขออะไร", cost: {unit: income_x, amount: 0.03}, effects: {happiness: 1}, merit: [{cat: dana, level: 2}]}
      - {id: wish, pair_id: mw_birthday, intent: wish_for_gain, text: "ถวายแล้วขอให้ปีนี้รวย", cost: {unit: income_x, amount: 0.03}, effects: {happiness: 1}, merit: [{cat: dana, level: 1}], sets_flags: [hope_set:mw_birthday], schedules: [{event: bel_hope_birthday, after_years: [3, 5]}]}
      - {id: chant, text: "นั่งสวดมนต์ที่ศาลาสักพัก", effects: {happiness: 1}, merit: [{cat: bhavana, level: 1}]}
      - {id: work, text: "งานเยอะ ไว้ปีหน้า", merit: [{cat: neutral}]}
  - id: bel_hope_birthday
    type: A
    category: belief
    stage: กลางคน
    years: [2500, 2650]
    text: "ปีแล้วปีเล่าผ่านไป ตัวเลขในสมุดบัญชียังไม่ขยับอย่างที่หวัง จดรายจ่ายทีไรก็ถอนหายใจทุกที"
    lore_ref: lore-finance-belief.md#B
    when: {flags: {has: [hope_set:mw_birthday]}}
    belief: {kind: merit_wish, tradition: พุทธ}
    choices: []

  # บนบาน/แก้บน — ผลของเรื่องที่บนเป็นอิสระจากการบน · แก้ตามกำลังมีทุกใบ ≤0.05 เท่าเงินเก็บต่อปี · เลื่อนได้ครั้งเดียว
  - id: bel_vow_exam
    type: B
    category: belief
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 2
    title: "ศาลเจ้าก่อนสอบ"
    text: "พรุ่งนี้สอบเข้ามหาวิทยาลัย ผู้ใหญ่ในบ้านพาไปไหว้ศาลเจ้าประจำเมือง คนข้างหน้าจุดประทัดแก้บนดังสนั่นจนสะดุ้ง"
    lore_ref: lore-finance-belief.md#B
    belief:
      kind: vow
      tradition: ผสม
      outside_canon: [vow_broken]
      vow:
        deadline_years: [2, 4]
        due_event: bel_vow_exam_due
        redeem_full_cost: {unit: fixed_baht, amount: 1500, ref_year: 2560}
        redeem_light_cost: {unit: income_x, amount: 0.05}
        defer_once: true
    choices:
      - {id: vow, text: "บนบานขอให้สอบติด", sets_flags: [vow_open:exam], schedules: [{event: bel_vow_exam_due, after_years: [2, 4]}], effects: {happiness: 1}, merit: [{cat: neutral}]}
      - {id: pray, text: "ไหว้ขอพรเฉย ๆ", merit: [{cat: neutral}]}
      - {id: donate, text: "ไหว้แล้วหยอดตู้บริจาค", cost: {unit: fixed_baht, amount: 20, ref_year: 2560}, merit: [{cat: dana, level: 1}]}
      - {id: wait, text: "รออยู่ข้างนอก ไม่เข้าไปไหว้", merit: [{cat: neutral}]}
  - id: bel_vow_exam_due
    type: B
    category: belief
    stage: หนุ่มสาว
    years: [2500, 2650]
    title: "ถึงเวลาแก้บน"
