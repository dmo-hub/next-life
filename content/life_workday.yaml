# การ์ดชีวิตผู้ใหญ่ชุด workday (ใบ 241 จากร่าง 240)
events:
  - id: workday_gift_swap_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [22, 30], occupation: [clerk, technician, manager]}
    title: "ฉลากเบอร์สิบเจ็ด"
    text: "งานเลี้ยงปีใหม่บริษัทตั้งงบของขวัญสามร้อยบาท คุณจับฉลากได้กล่องห่อกระดาษทอง แกะออกมาเป็นกระติกน้ำเก็บความเย็น ใบที่สามของปีนี้ อีกฝั่งโต๊ะ น้องฝ่ายบัญชีกำลังมองหม้อทอดไร้น้ำมันในมือตัวเองด้วยสีหน้าเดียวกัน"
    choices:
      - id: swap
        text: "ยื่นกระติกขอแลกหม้อทอด"
        outcomes:
          - {weight: 1, ok: true, text: "น้องรับไปทันที บอกว่าห้องเช่ามีปลั๊กไม่พอเสียบหม้อ คุณได้ทอดปีกไก่กินทั้งเดือน", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "น้องยิ้มแล้วกอดหม้อแน่นขึ้น กระติกใบที่สามไปเข้าตู้ข้างอีกสองใบ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: keep
        text: "เก็บไว้ ใส่น้ำแข็งไปทำงาน"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: regift
        text: "ห่อใหม่ไว้จับฉลากปีหน้า"
        effects: {money: {unit: income_x, amount: 0.01}}
        merit: [{cat: neutral}]
      - id: auction
        text: "เปิดประมูลกระติกกลางเวที"
        outcomes:
          - {weight: 1, ok: true, text: "พิธีกรเล่นด้วย ราคาไต่จากสิบบาทไปสามร้อย ผู้จัดการฝ่ายขายยกมือสุดท้ายเพราะอยากได้ไมค์", effects: {happiness: 2, network: 1, money: {unit: income_x, amount: 0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไม่มีใครยกมือ พิธีกรตัดเข้าเพลงต่อ คุณยืนถือกระติกกลางเวทีอีกครึ่งท่อน", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_leave_left_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2540, 2650]
    weight: 0.0625
    when: {age: [31, 45], occupation: [clerk, technician, manager]}
    title: "วันลาเหลือเจ็ดวัน"
    text: "ต้นเดือนพฤศจิกา ฝ่ายบุคคลส่งอีเมลเตือนว่าวันลาพักร้อนที่ไม่ได้ใช้ทบไปปีหน้าได้แค่สามวัน คุณเหลือเจ็ด งานปิดงบสิ้นปีเริ่มกองบนโต๊ะ คนในแผนกจองลาไปแล้วสองคน ปฏิทินช่วงหยุดยาวปีใหม่ก็เต็มไปด้วยชื่อคนอื่นแล้ว"
    choices:
      - id: trip
        text: "ลาสี่วัน ขับรถขึ้นเหนือ"
        outcomes:
          - {weight: 1, ok: true, text: "ตื่นมาเจอหมอกบนดอย ปิดเครื่องได้ครบสี่วัน กลับมางานยังอยู่ที่เดิมไม่หนีไปไหน", effects: {happiness: 2, health: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถติดขึ้นดอยหกชั่วโมง ถึงที่พักก็มีสายจากออฟฟิศถามรหัสตู้เอกสาร", effects: {happiness: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hometown
        text: "ลากลับบ้านเกิดไปช่วยงานบ้าน"
        effects: {relations: 1, happiness: 1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: skip
        text: "ทิ้งไว้ อยู่ปิดงบให้จบ"
        effects: {network: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: mon_fri
        text: "ลาจันทร์กับศุกร์สลับกันทั้งเดือน"
        outcomes:
          - {weight: 1, ok: true, text: "ได้หยุดสามวันติดกันสี่รอบ ทั้งแผนกเริ่มเรียกคุณว่าคนวันศุกร์", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หัวหน้าเห็นตารางแล้วย้ายประชุมประจำสัปดาห์มาไว้วันจันทร์ที่คุณลาพอดี", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_errand_leave_01
    type: A
    category: family
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [46, 59], occupation: [clerk, technician, factory, manager], family: [{role: parent, sex: หญิง, alive: true}]}
    title: "บัตรหายวันพุธ"
    text: "บัตรประชาชนของแม่หายไปพร้อมกระเป๋าสตางค์ที่ตลาด ทำใหม่ต้องไปสำนักงานเขตด้วยตัวเองในเวลาราชการ ถ่ายรูปและพิมพ์ลายนิ้วมือ คุณเหลือวันลากิจอีกสามวัน แต่วันพุธนี้มีตรวจงานประจำไตรมาส ญาติที่ว่างที่สุดในบ้านขับรถไม่เป็น"
    choices:
      - id: take_leave
        text: "ใช้วันลากิจ พาแม่ไปเอง"
        effects: {relations: 2, network: -1}
        merit: [{cat: neutral}]
      - id: half_day
        text: "ขอหัวหน้าเข้างานสายครึ่งวัน"
        outcomes:
          - {weight: 1, ok: true, text: "คิวที่เขตสั้นกว่าที่คิด ถึงออฟฟิศสิบโมงครึ่ง พร้อมเรื่องเล่าว่าแม่ขอถ่ายรูปบัตรใหม่สามรอบ", effects: {relations: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลายนิ้วมือแม่จางจนเจ้าหน้าที่ต้องลองถึงรอบที่เก้า ครึ่งวันกลายเป็นทั้งวัน", effects: {relations: 1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: relative
        text: "ฝากญาติพาแม่นั่งรถโดยสารไป"
        effects: {relations: -1, network: 1}
        merit: [{cat: neutral}]
      - id: bring_office
        text: "พาแม่มารอที่ออฟฟิศ เที่ยงค่อยไป"
        outcomes:
          - {weight: 1, ok: true, text: "แม่นั่งโต๊ะรับแขก แจกขนมทั้งชั้น ทีมตรวจงานถามว่าบ้านคุณขายขนมหรือเปล่า", effects: {relations: 1, happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แม่นั่งรอห้าชั่วโมงแล้วบ่นยาวทั้งทางไปเขต ว่าห้องแอร์ออฟฟิศหนาวกว่าหน้าหนาวที่บ้าน", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_sick_cert_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [22, 30], occupation: [clerk, technician, factory, service, manager]}
    title: "ไข้วันที่สาม"
    text: "ไข้ขึ้นตั้งแต่วันจันทร์ ลาป่วยไปสองวันด้วยข้อความสั้น ๆ ในกลุ่มแชตงาน เช้าวันพุธยังลุกจากเตียงไม่ไหว ฝ่ายบุคคลทักมาสุภาพว่าถ้าลาวันที่สามขอใบรับรองแพทย์ด้วยนะคะ คลินิกหน้าซอยเปิดห้าโมงเย็น"
    choices:
      - id: clinic
        text: "ลากตัวไปคลินิกเย็นนี้"
        effects: {health: 1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: hospital
        text: "ไปโรงพยาบาลรัฐ ใช้สิทธิที่มี"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: push_through
        text: "ฝืนเข้างาน ไม่ต้องใช้ใบ"
        outcomes:
          - {weight: 1, ok: true, text: "นั่งทำงานในหน้ากากทั้งวัน งานเสร็จ ไข้ก็ลดตอนเย็น", effects: {network: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ไข้กลับมาตอนบ่าย คนข้างโต๊ะเริ่มไอตาม สัปดาห์หน้าแผนกลาป่วยกันสามคน", effects: {health: -2, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: thermometer
        text: "ส่งรูปปรอทวัดไข้แทนใบหมอ"
        outcomes:
          - {weight: 1, ok: true, text: "ฝ่ายบุคคลส่งสติกเกอร์หัวเราะกลับมา บอกว่ารอบนี้ผ่านให้ แต่ถ้าลาวันพฤหัสต้องมีใบ", effects: {happiness: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปรอทในรูปขึ้นสามสิบหกจุดห้า คุณถ่ายผิดอัน ข้อความถัดไปเงียบไปสามชั่วโมง", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_ot_dayoff_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 40], occupation: [clerk, technician, factory]}
    title: "ค่าโอทีกลายเป็นวันหยุด"
    text: "เดือนนี้อยู่ดึกไปสิบสองคืน รวมวันเสาร์อีกสอง สลิปเงินเดือนออกมาไม่มีบรรทัดค่าล่วงเวลา ฝ่ายบุคคลอธิบายว่าปีนี้ให้เก็บเป็นวันหยุดชดเชยแทน ใช้ได้ภายในสามเดือน เพื่อนข้างโต๊ะยังกดเครื่องคิดเลขว่าหายไปเท่าไร"
    choices:
      - id: accept
        text: "รับวันหยุดไป ไม่อยากมีเรื่อง"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: ask_rule
        text: "ถามฝ่ายบุคคลว่ากฎหมายว่าไง"
        outcomes:
          - {weight: 1, ok: true, text: "ฝ่ายบุคคลเปิดดูแล้วเงียบไปหนึ่งวัน สลิปเดือนหน้ามีบรรทัดค่าล่วงเวลากลับมา พร้อมยอดย้อนหลัง", effects: {knowledge: 1, money: {unit: income_x, amount: 0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้คำตอบว่าจะนำเรียนผู้บริหาร เรื่องหายไปพร้อมอีเมลฉบับนั้น", effects: {knowledge: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: group_letter
        text: "ชวนทั้งแผนกเขียนเรื่องรวมกัน"
        outcomes:
          - {weight: 1, ok: true, text: "ยื่นพร้อมกันสิบเอ็ดชื่อ บริษัทยอมจ่ายเป็นเงินย้อนหลังทุกคน", effects: {relations: 1, network: 1, money: {unit: income_x, amount: 0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนถอนชื่อทีละคนจนเหลือคุณกับอีกหนึ่ง จดหมายเลยนอนอยู่ในลิ้นชัก", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: all_at_once
        text: "ใช้วันหยุดชดเชยรวดเดียวทั้งหมด"
        outcomes:
          - {weight: 1, ok: true, text: "หยุดได้ห้าวันติด รวมเสาร์อาทิตย์เป็นเก้าวัน หัวหน้าเซ็นให้เพราะเป็นกติกาที่บริษัทออกเอง", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หัวหน้าเซ็นให้สองวัน ที่เหลือบอกว่าช่วงนี้งานยุ่ง ไว้ค่อยว่ากัน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_freelance_wait_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [32, 45], occupation: [clerk, technician, manager]}
    title: "ช่างภาพไม่รับสาย"
    text: "บริษัทจ้างช่างภาพอิสระมาถ่ายรูปสินค้าทำแคตตาล็อกปีใหม่ รับงานเป็นชิ้น จ่ายเมื่อส่งงาน คุณเป็นคนประสาน พรุ่งนี้เช้าต้องส่งโรงพิมพ์ รูปมาไม่ถึงครึ่ง โทรไปสามสาย ไม่มีใครรับ หัวหน้าเดินผ่านโต๊ะคุณเป็นรอบที่สี่"
    choices:
      - id: chase
        text: "ขับรถไปตามถึงบ้าน"
        outcomes:
          - {weight: 1, ok: true, text: "ช่างภาพเปิดประตูมาพร้อมรูปครบชุด บอกว่าโทรศัพท์ตกน้ำตั้งแต่เมื่อวาน", effects: {network: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บ้านปิดเงียบ คนข้างบ้านบอกว่าออกไปรับงานแต่งต่างจังหวัด กลับมะรืน", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: delay_print
        text: "แจ้งหัวหน้า ขอเลื่อนโรงพิมพ์"
        effects: {knowledge: 1, network: -1}
        merit: [{cat: neutral}]
      - id: old_photos
        text: "ใช้รูปแคตตาล็อกปีที่แล้วไปก่อน"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: shoot_self
        text: "ยืมกล้อง ถ่ายเองบนโต๊ะประชุม"
        outcomes:
          - {weight: 1, ok: true, text: "ผ้าม่านห้องประชุมกลายเป็นฉากหลัง รูปออกมาดีจนฝ่ายขายขอให้ถ่ายต่อทุกปี", effects: {knowledge: 1, network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทุกรูปมีเงาคุณติดมุมขวาล่าง โรงพิมพ์โทรมาถามว่าตั้งใจหรือเปล่า", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_late_chat_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2555, 2650]
    weight: 0.0625
    when: {age: [23, 30], occupation: [clerk, technician, manager]}
    title: "ข้อความตอนสี่ทุ่ม"
    text: "เดือนนี้ชั่วโมงทำงานยืดออกเกือบทุกคืน กลับถึงห้องได้ไม่ถึงชั่วโมง สี่ทุ่มสิบห้า กลุ่มแชตงานเด้งขึ้นจอ หัวหน้าส่งไฟล์ชื่อขึ้นต้นว่าด่วน ท้ายข้อความพิมพ์ว่าไม่รีบนะ คุณเพิ่งซดบะหมี่ไปคำแรก"
    choices:
      - id: reply_now
        text: "ตอบทันที เปิดคอมทำต่อ"
        effects: {network: 1, health: -1, happiness: -1}
        merit: [{cat: neutral}]
      - id: morning
        text: "ปิดเสียง ค่อยตอบตอนเช้า"
        outcomes:
          - {weight: 1, ok: true, text: "เช้ามาหัวหน้าทักว่าไฟล์เมื่อคืนส่งผิด ไม่ต้องทำแล้ว", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เช้ามาเจอข้อความตามอีกสี่รอบ ตัวสุดท้ายเป็นสติกเกอร์ยิ้ม", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: status
        text: "ตั้งสถานะเลิกงานหกโมงเย็นถาวร"
        effects: {happiness: 1, health: 1, network: -1}
        merit: [{cat: neutral}]
      - id: noodle_photo
        text: "ส่งรูปบะหมี่กลับไปแทนคำตอบ"
        outcomes:
          - {weight: 1, ok: true, text: "หัวหน้าส่งรูปบะหมี่ของตัวเองกลับมา เรื่องงานไม่มีใครพูดถึงอีกจนเช้า", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ส่งผิดกลุ่ม เข้าไปกลุ่มที่มีผู้บริหารอยู่สามคน ทุกคนอ่านแล้ว ไม่มีใครตอบ", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: workday_self_review_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [46, 58], occupation: [clerk, technician, manager]}
    title: "แบบประเมินตัวเองสิบสองข้อ"
