        - ตะวันออกเฉียงเหนือ
      flags:
        has:
          - cadet_dream
        not:
          - cadet_life_seen:kids_day_camp
    title: วันเด็กในค่าย
    text: วันเด็กปีนี้ค่ายทหารใกล้บ้านเปิดให้เข้าชม รถถังจอดเรียงให้ปีน เด็กเล็กต่อแถวยาว {ชื่อ} มากับน้องข้างบ้าน แต่สายตาไปหยุดที่โต๊ะรับสมัครข้อมูลโรงเรียนเตรียมทหาร
    choices:
      - id: c1
        text: ไปยืนถามที่โต๊ะรับสมัคร
        outcomes:
          - weight: 3
            text: ได้แผ่นพับมาแผ่นหนึ่ง พี่ที่โต๊ะเขียนเบอร์ติดต่อไว้ให้
            effects:
              knowledge: 1
            merit:
              - cat: neutral
          - weight: 1
            text: คนต่อแถวยาว ได้แผ่นพับแผ่นสุดท้ายพอดี
            effects:
              knowledge: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:kids_day_camp
        merit:
          - cat: neutral
      - id: c2
        text: พาน้องไปปีนรถถังก่อน
        outcomes:
          - weight: 3
            text: น้องหัวเราะจนเสียงแหบ ขากลับเพิ่งได้แวะโต๊ะรับสมัคร
            effects:
              relations: 1
            merit:
              - cat: neutral
          - weight: 1
            text: กว่าน้องจะยอมลงจากรถถัง โต๊ะรับสมัครก็เก็บของแล้ว
            effects:
              relations: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:kids_day_camp
        merit:
          - cat: neutral
      - id: c3
        text: ถ่ายรูปคู่กับทหารที่ยืนเวร
        outcomes:
          - weight: 3
            text: รูปนั้นถูกพิมพ์ใส่กรอบตั้งไว้ข้างหนังสือ
            effects:
              happiness: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ทหารยืนนิ่งไม่ยิ้มสักนิด รูปออกมาเหมือนถ่ายกับรูปปั้น
            effects:
              happiness: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:kids_day_camp
        merit:
          - cat: neutral
      - id: c4
        text: แอบดูทหารใหม่ฝึกแถวหลังเต็นท์
        outcomes:
          - weight: 3
            text: จำท่าซ้ายหันขวาหันกลับมาซ้อมเองที่บ้าน
            effects:
              health: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ทหารยามเดินมาไล่ให้ไปดูรถถังตรงหน้าแทน
            effects:
              health: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:kids_day_camp
        merit:
          - cat: neutral
