  - id: cadet_life_rd_drill
    type: A
    category: study
    stage: วัยรุ่น
    years:
      - 2501
      - 2650
    weight: 1.2
    when:
      sex:
        - ชาย
      age:
        - 15
        - 18
      school:
        - upper
        - voc
      flags:
        has:
          - cadet_dream
    title: ชั่วโมงรักษาดินแดน
    text: บ่ายวันพฤหัสครูฝึก รด. สั่งแถวกลางสนามแดดเปรี้ยง ยืนตรงสิบนาทีแรกมีคนเป็นลมไปสองคน ครูฝึกเดินมาหยุดตรงหน้า {ชื่อ}
    choices:
      - id: c1
        text: ยืนตรงต่อ ไม่กะพริบตา
        outcomes:
          - weight: 3
            text: ครูฝึกจดชื่อไว้ในสมุด บอกว่าคนนี้ไปได้
            effects:
              health: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ยืนจนตาพร่า แต่ไม่ล้ม ครูฝึกเดินผ่านไปเฉย ๆ
            effects:
              health: 1
            merit:
              - cat: neutral
        merit:
          - cat: neutral
      - id: c2
        text: ขานรับเสียงดังกว่าทุกคน
        outcomes:
          - weight: 3
            text: ทั้งแถวหันมามอง ครูฝึกยิ้มมุมปาก
            effects:
              network: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ครูฝึกสั่งให้ขานใหม่อีกสามรอบ ทั้งแถวหัวเราะ
            effects:
              network: 1
            merit:
              - cat: neutral
        merit:
          - cat: neutral
      - id: c3
        text: ถามครูฝึกเรื่องสอบเตรียมทหาร
        outcomes:
          - weight: 3
            text: ครูฝึกเล่าว่าสนามพลศึกษาจริงร้อนกว่านี้อีก ให้ซ้อมกลางแดดไว้
            effects:
              knowledge: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ครูฝึกบอกว่าถามผิดเวลา ไว้หลังเลิกแถวค่อยมาคุย
            effects:
              knowledge: 1
            merit:
              - cat: neutral
        merit:
          - cat: neutral
      - id: c4
        text: พยุงเพื่อนที่เป็นลมไปหลบร่ม
        outcomes:
          - weight: 3
            text: ครูฝึกเห็น ไม่ได้ดุสักคำ
            effects:
              relations: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ครูฝึกเรียกกลับเข้าแถว เพื่อนที่เป็นลมพยักหน้าขอบใจตามหลัง
            effects:
              relations: 1
            merit:
              - cat: neutral
        merit:
          - cat: neutral
  - id: cadet_life_kids_day_camp
    type: A
    category: society
    stage: วัยรุ่น
    years:
      - 2501
      - 2650
    weight: 1
    when:
      sex:
        - ชาย
      age:
        - 13
        - 17
      region:
        - กลาง
        - กรุงเทพฯ และปริมณฑล
