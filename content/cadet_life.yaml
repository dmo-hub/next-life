# ชีวิตเด็กเตรียมทหาร (อายุ 13–18) — การ์ดกองสุ่มหลังตัดสินใจสอบ (ถือ cadet_dream)
# ระหว่างถือ cadet_dream กองสุ่มวัยรุ่นจั่วเฉพาะใบที่ when.flags.has มี cadet_dream (numbers.pool_focus_flag ใน rules/cadet.yaml)
# ยกจากเดโม data-06.js (MIL1–MIL12 · เจ้าของ 2026-11-06) · ผล 2 ทาง + การ์ดแยกตามบริบท ตาม .claude/research/cadet-life-outcomes.md (เจ้าของเคาะ 2026-11-06)
# ผล A น้ำหนัก 3 = ประโยคเดโม · ผล B น้ำหนัก 1 = ประโยคใหม่ ค่าเท่า A ทุกข้อ
# การ์ดแยก (ชื่อเดิม + บรรทัดตามบริบทต่อท้าย) เงื่อนไขไม่ซ้อนกับใบหลัก: ชนชั้นจน/ไม่จน · ภาค · ธง cadet_prep_camp · ปียุค
# ธง cadet_life_seen:<เรื่อง> กันเห็นเรื่องเดียวกันสองใบ เมื่อบริบทเปลี่ยนกลางวัยรุ่น (ได้ธงค่ายติว · ข้ามปี · เลื่อนชนชั้น/ย้ายภาค)
# branch_map แยกที่ numbers.mobile_year (2542) — ทะเบียน numbers.era_cards ใน rules/cadet.yaml · build ตรวจปีให้ตรงเสมอ
events:
  - id: cadet_life_first_crewcut
    type: A
    category: society
    stage: วัยรุ่น
    years:
      - 2501
      - 2650
    weight: 1
    when:
      sex:
        - ชาย
      age:
        - 13
        - 17
      class:
        - ชนชั้นกลางล่าง
        - ชนชั้นกลาง
        - ชนชั้นกลางบน
        - มีอันจะกิน
        - ร่ำรวย
        - มั่งคั่ง
      flags:
        has:
          - cadet_dream
        not:
          - cadet_life_seen:first_crewcut
    title: หัวเกรียนครั้งแรก
    text: ร้านตัดผมหน้าตลาดมีรูปทรงผมนักเรียนเตรียมทหารติดข้างกระจก ช่างถามว่าเอาแบบเดิมหรือแบบในรูป
    choices:
      - id: c1
        text: เอาแบบในรูป เกรียนสามด้าน
        outcomes:
          - weight: 3
            text: ลูบหัวตัวเองทั้งทางกลับบ้าน เย็นนั้นที่บ้านหัวเราะแต่ก็ชม
            effects:
              happiness: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ช่างมือหนักไปหน่อย ด้านซ้ายสั้นกว่าด้านขวา ใส่หมวกไปโรงเรียนอยู่สามวัน
            effects:
              happiness: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:first_crewcut
        merit:
          - cat: neutral
      - id: c2
        text: ขอสั้นกว่าเดิมนิดเดียวก่อน
        outcomes:
          - weight: 3
            text: ครูฝ่ายปกครองผ่านมาเห็นแล้วพยักหน้า
            effects:
              relations: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ไม่มีใครสังเกตว่าตัดผมมา ยกเว้นแม่ค้าข้าวเหนียวหน้าโรงเรียน
            effects:
              relations: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:first_crewcut
        merit:
          - cat: neutral
      - id: c3
        text: ถามช่างว่าใครที่สอบติดเคยมาตัด
        outcomes:
          - weight: 3
            text: ช่างเล่าถึงลูกค้าสามคนที่ติดเมื่อปีก่อน หนึ่งในนั้นยังแวะมาตัดทุกครั้งที่ลาพัก
            effects:
              network: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ช่างนึกไม่ออกสักคน แต่เล่าเรื่องลูกชายตัวเองที่สอบไม่ติดจนตัดเสร็จ
            effects:
              network: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:first_crewcut
        merit:
          - cat: neutral
      - id: c4
        text: ไว้ผมยาวต่ออีกปี
        outcomes:
          - weight: 3
            text: ยังไม่ถึงเวลา เก็บรูปทรงผมนั้นไว้ในใจก่อน
            effects:
              happiness: 1
            merit:
              - cat: neutral
          - weight: 1
            text: เดินออกจากร้านแล้วหันกลับไปมองรูปนั้นอีกที
            effects:
              happiness: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:first_crewcut
        merit:
          - cat: neutral
