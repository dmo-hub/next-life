            effects:
              health: 1
            merit:
              - cat: neutral
          - weight: 1
            text: ทำท่าแรกผิดจนเขาหัวเราะ แต่สอนซ้ำให้จนได้
            effects:
              health: 1
            merit:
              - cat: neutral
        sets_flags:
          - cadet_life_seen:conscript_home
        merit:
          - cat: neutral
      - id: c3
        text: ถามว่าทำไมไม่สอบเป็นนายร้อย
        outcomes:
          - weight: 3
            text: เขาหัวเราะ บอกว่าตอนนั้นไม่มีใครบอกว่ามีทางนี้
            effects:
              network: 1
            merit:
              - cat: neutral
          - weight: 1
            text: เขาเงียบไปนาน แล้วบอกว่าสอบแล้วแต่ไม่ติด ให้ตั้งใจกว่าเขา
