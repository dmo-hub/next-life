# ร่างเรื่อง เพื่อนบ้านและเรื่องในซอย · 15 ใบ · ลงเกมแล้ว ใบ 249 จากร่าง 248 · แก้ตามข้อค้านรอบ 1 · ทุกปี · ไม่เปลี่ยนสายชีวิตหลัก · ไม่ตั้งธง
events:
  - id: nextdoor_shoe_dog_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [6, 12], school: [primary, lower]}
    title: "รองเท้านักเรียนข้างเดียว"
    text: "รองเท้านักเรียนที่ถอดตากไว้หน้าบ้านหายไปข้างหนึ่ง คุณเดินตามรอยไปจนเจอหมาบ้านป้าข้าง ๆ นอนแทะมันอย่างมีความสุขอยู่ใต้ถุน พรุ่งนี้เช้าครูตรวจรองเท้าหน้าเสาธง"
    choices:
      - id: nextdoor_shoe_tell_aunt
        text: "เดินไปบอกป้าข้างบ้านตรง ๆ"
        outcomes:
          - {weight: 2, ok: true, text: "ป้าเห็นสภาพรองเท้าแล้วหัวเราะไม่ออก พาคุณไปซื้อคู่ใหม่ที่ตลาด บอกว่าหมาของป้าทำ ป้าก็ต้องรับผิดชอบ", effects: {happiness: 1, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าไม่อยู่ เจอแต่หมาตัวเดิมกระดิกหางต้อนรับ คุณนั่งรอจนมืดแล้วต้องกลับบ้านมือเปล่า", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_shoe_snatch
        text: "แย่งคืนจากปากหมาเลย"
        outcomes:
          - {weight: 1, ok: true, text: "ดึงกันอยู่พักใหญ่ รองเท้ากลับมาพร้อมรอยฟันครบทุกซี่ แต่ยังพอใส่ไปเข้าแถวได้", effects: {happiness: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หมานึกว่าชวนเล่น คาบวิ่งรอบซอยสามรอบ คุณวิ่งตามจนหกล้มเข่าถลอก", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_shoe_sandal
        text: "ใส่รองเท้าแตะไปโรงเรียน"
        effects: {happiness: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: nextdoor_shoe_trade
        text: "เอาอีกข้างไปขอแลกคืน"
        outcomes:
          - {weight: 1, ok: true, text: "หมาคายข้างเก่าแล้วงับข้างใหม่แทน คุณถือข้างเก่ากลับบ้าน ผู้ใหญ่ถามว่าตกลงเราได้อะไร คุณยังตอบไม่ได้จนทุกวันนี้", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตอนนี้หมามีครบคู่ นอนหนุนอย่างสบายใจ ส่วนคุณเดินเท้าเปล่ากลับมาอธิบาย", effects: {happiness: -2, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_guava_branch_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [5, 12]}
    title: "ฝรั่งฝั่งเรา"
    text: "กิ่งฝรั่งของตาบ้านติดกันยื่นข้ามรั้วมาเหนือหัวคุณ ผลโตเท่ากำปั้นห้อยอยู่พอดีมือ เพื่อนบอกว่าอยู่ฝั่งบ้านเธอก็ของเธอสิ แต่ตาเดินรดน้ำต้นนี้ทุกเย็นและรู้จำนวนผลดีกว่ารู้วันเกิดตัวเอง"
    choices:
      - id: nextdoor_guava_ask
        text: "ตะโกนขอตาก่อนเด็ด"
        outcomes:
          - {weight: 2, ok: true, text: "ตาเดินมาเด็ดให้เองสองผล บอกว่าจะตัดหรือแตะกิ่งข้ามรั้ว บอกเจ้าของต้นก่อนเป็นดีที่สุด แล้วชี้ผลที่หวานกว่าให้", effects: {happiness: 1, relations: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตาบอกว่าผลนั้นยังไม่แก่ ให้มาใหม่อาทิตย์หน้า คุณนับวันรอจนเพื่อนเบื่อ", effects: {relations: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_guava_pick
        text: "เด็ดเงียบ ๆ ผลเดียว"
        outcomes:
          - {weight: 1, ok: true, text: "ฝรั่งหวานจนคุณกินหมดก่อนรู้สึกผิด ตอนเย็นตานับผลแล้วขมวดคิ้วอยู่นาน", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตาโผล่จากหลังโอ่งพอดี คุณต้องไปช่วยกวาดใบไม้หน้าบ้านตาอยู่ทั้งเย็น", effects: {relations: -1, health: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_guava_wait_drop
        text: "รอให้มันหล่นเอง"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_guava_stare
        text: "ยืนจ้องให้ฝรั่งเกรงใจ"
        outcomes:
          - {weight: 1, ok: true, text: "ตาเห็นคุณยืนจ้องอยู่สามวันติด ทนไม่ไหวเด็ดมาให้เอง บอกว่าไม่เคยเจอใครขอด้วยสายตานานขนาดนี้", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แดดเที่ยงแรงกว่าความตั้งใจ คุณเวียนหัวจนต้องไปนอนพัก ฝรั่งยังอยู่ที่เดิม", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_bottle_night_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "ขวดแก้วตีหนึ่งก่อนสอบ"
    text: "พรุ่งนี้สอบวิชาที่คุณกลัวที่สุด แต่ทุกคืนราวตีหนึ่ง บ้านหลังถัดไปจะโยนขวดแก้วลงถังทีละใบ ดังเพล้งเป็นจังหวะเหมือนมีคนตั้งใจนับ คุณอ่านหน้าเดิมมาสามรอบแล้ว ผู้ใหญ่ในบ้านหลับกันหมด"
    choices:
      - id: nextdoor_bottle_note
        text: "เขียนโน้ตสุภาพเสียบประตูเขา"
        outcomes:
          - {weight: 2, ok: true, text: "คืนถัดมาเงียบสนิท เช้าวันต่อมามีขวดน้ำหวานวางหน้าบ้านพร้อมกระดาษเขียนว่า ขอโทษนะ ไม่รู้ว่าเสียงไปถึง", effects: {knowledge: 1, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "โน้ตปลิวหายไปกับลม เสียงยังมาตรงเวลา คุณเข้าห้องสอบด้วยตาปรือ", effects: {knowledge: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_bottle_ask_adult
        text: "ให้ผู้ใหญ่ในบ้านช่วยคุยตอนเช้า"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: nextdoor_bottle_kitchen
        text: "หนีไปอ่านในครัวหลังบ้าน"
        effects: {knowledge: 2, health: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_bottle_rhythm
        text: "ท่องสูตรตามจังหวะขวด"
        outcomes:
          - {weight: 1, ok: true, text: "สูตรที่จำไม่ได้มาทั้งเทอมเข้าหัวตรงจังหวะเพล้ง ในห้องสอบคุณเคาะโต๊ะเบา ๆ แล้วเขียนออกมาได้ครบ", effects: {knowledge: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คืนนั้นเขาโยนแค่สองใบแล้วเลิก คุณจำสูตรได้ถึงแค่ครึ่งเดียว อีกครึ่งนั่งรอเสียงอยู่ในห้องสอบ", effects: {knowledge: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_grill_smoke_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "ควันหมูปิ้งหน้าบ้านน้า"
    text: "คุณช่วยน้าปิ้งหมูหน้าบ้านก่อนไปเรียน รายได้ของบ้านน้ามาจากเตานี้ แต่ควันลอยติดกำแพงเข้าหน้าต่างบ้านป้าข้าง ๆ ทุกเช้า วันนี้ป้าเดินมาไอให้ดูสามครั้ง บอกว่าผ้าที่ตากไว้เหม็นหมูไปทั้งราว"
    choices:
      - id: nextdoor_grill_move_stove
        text: "ขอน้าขยับเตาออกห่างกำแพง"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: nextdoor_grill_send_pork
        text: "เอาหมูปิ้งไปขอโทษป้า"
        outcomes:
          - {weight: 2, ok: true, text: "ป้ารับไปชิมแล้วบอกว่าเค็มไปนิด สุดท้ายสองบ้านตกลงกันว่าป้าจะตากผ้าหลังแปดโมงเช้า", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้ารับหมูไว้แต่ยังไออยู่ บอกว่าถ้าเช้าพรุ่งนี้ยังเหมือนเดิมจะไปถามเทศบาลดู", effects: {relations: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_grill_argue
        text: "เถียงแทนน้าว่าทำมาหากิน"
        effects: {happiness: 1, relations: -2}
        merit: [{cat: neutral}]
      - id: nextdoor_grill_fan_back
        text: "พัดควันย้อนกลับทางเดิม"
        outcomes:
          - {weight: 1, ok: true, text: "ควันม้วนกลับมาเต็มหน้าร้าน ลูกค้าได้กลิ่นจากปากซอย เช้านั้นหมูหมดก่อนเวลา น้าให้คุณเลื่อนตำแหน่งเป็นหัวหน้าพัด", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลมเปลี่ยนทิศพอดี คุณรับควันเต็มหน้าจนน้ำตาไหลไปโรงเรียนทั้งกลิ่นหมู", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_shop_noise_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ข้างห้องตอกเหล็กทั้งวัน"
    text: "คุณเช่าคูหาเล็กไว้รับเย็บผ้าเป็นงานเสริม วางมัดจำไว้สามเดือน เดือนที่สองห้องข้าง ๆ กลายเป็นร้านตอกเหล็ก ลูกค้าคุยกับคุณต้องตะโกน เจ้าของห้องแถวพยักหน้ารับฟังมาเดือนกว่าแล้ว เสียงยังเหมือนเดิม"
    choices:
      - id: nextdoor_shop_end_lease
        text: "ขอเลิกสัญญา เอามัดจำคืน"
        outcomes:
          - {weight: 2, ok: true, text: "คุณไล่เรียงว่าแจ้งไปกี่ครั้งแล้วเสียงยังไม่หาย เจ้าของห้องแถวยอมคืนมัดจำ คุณย้ายจักรไปหัวมุมตลาด", effects: {knowledge: 1, happiness: 1, money: {unit: income_x, amount: 0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เจ้าของห้องแถวขอเวลาคืนเงินเป็นงวด กว่าจะครบก็ผ่านไปครึ่งปี ส่วนที่ใหม่ยังไม่มีเงินวางมัดจำ", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_shop_ask_quiet_hours
        text: "คุยกับช่าง ขอเวลาเงียบตอนบ่าย"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_shop_municipality
        text: "ไปร้องเรียนที่เขตหรือเทศบาล"
        outcomes:
          - {weight: 1, ok: true, text: "เจ้าหน้าที่มาฟังเสียงถึงหน้าร้าน แล้วขอให้ร้านข้าง ๆ ติดแผ่นกันเสียงและเลิกตอกหลังหกโมงเย็น", effects: {knowledge: 2, relations: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรื่องเข้าคิวตรวจอีกหลายอาทิตย์ ระหว่างนั้นช่างรู้ว่าใครร้อง เลยทักคุณสั้นลงทุกวัน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_shop_beat_promo
        text: "เย็บผ้าตามจังหวะค้อนเรียกคน"
        outcomes:
          - {weight: 1, ok: true, text: "คนเดินตลาดหยุดดูร้านที่เย็บเข้าจังหวะค้อน ช่างข้างห้องตอกช้าลงให้เวลาคุณเข้าตะเข็บ สองร้านเลยได้ลูกค้าเพิ่มด้วยกัน", effects: {happiness: 2, network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ค้อนเร่งขึ้นเมื่อไรเข็มก็เร่งตาม กางเกงลูกค้าออกมาขาสั้นกว่ากันหนึ่งคืบ คุณต้องตัดใหม่ทั้งตัว", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_flat_bill_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ค่าไฟหารเท่ากันทุกห้อง"
    text: "ห้องแถวนี้มีมิเตอร์แยกทุกห้อง แต่เดือนนี้เจ้าของห้องแถวมาเก็บยอดเหมา บอกว่ารวมทั้งแถวแล้วหารเท่ากันทุกห้อง คุณอยู่คนเดียว เปิดพัดลมตัวเดียว ห้องข้าง ๆ มีตู้เย็นสองใบกับเตาอบ แต่ยอดเท่ากันเป๊ะ"
    choices:
      - id: nextdoor_flat_compare_bill
        text: "ขอดูบิลการไฟฟ้าเทียบหน่วย"
        outcomes:
          - {weight: 2, ok: true, text: "เขากางบิลรวมแล้วจดเลขมิเตอร์ห้องคุณเทียบต่อหน้า หน่วยของคุณน้อยกว่ายอดที่เก็บเกินครึ่ง เขาคืนส่วนต่างและกลับไปจดตามมิเตอร์", effects: {knowledge: 2, money: {unit: income_x, amount: 0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาบอกว่าบิลฝากญาติไว้ พรุ่งนี้ค่อยดู พรุ่งนี้ของเขาเลื่อนไปจนถึงต้นเดือนหน้า", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_flat_read_meter
        text: "ขอจดเลขมิเตอร์เองทุกสิ้นเดือน"
        effects: {knowledge: 1, relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_flat_pay
        text: "จ่ายไป ไม่อยากมีเรื่อง"
        cost: {unit: income_x, amount: 0.05}
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_flat_buy_fridge
        text: "ซื้อตู้เย็นมาใช้ให้คุ้มส่วนแบ่ง"
        outcomes:
          - {weight: 1, ok: true, text: "ตู้เย็นมือสองของคุณเย็นดีเกินคาด ข้างห้องเอาน้ำแข็งมาฝากแช่ ทุกเย็นมีคนมานั่งกินน้ำเย็นหน้าห้องคุณ", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เดือนต่อมาเจ้าของกลับไปคิดตามมิเตอร์พอดี ตู้เย็นที่ซื้อมาเพื่อเอาคืนกลายเป็นหน่วยไฟของคุณคนเดียว", effects: {happiness: -1, knowledge: 1, money: {unit: income_x, amount: -0.15}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_car_block_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45], flags: {has: [has_car]}}
    title: "เบรกมือหน้าประตูบ้าน"
    text: "เช้าวันที่มีนัดสำคัญ คุณเปิดประตูมาเจอรถเก๋งจอดขวางทางออกเต็มคัน รถของคุณติดอยู่ในรั้ว ลองเข็นคันนั้นดูก็รู้ว่าใส่เบรกมือไว้แน่น ไม่มีคนขับ ไม่มีป้ายบอก คนในซอยบอกว่าจอดมาเกือบชั่วโมงแล้ว"
    choices:
      - id: nextdoor_car_ask_around
        text: "เดินถามหาเจ้าของทีละร้าน"
        outcomes:
