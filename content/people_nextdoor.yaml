      - id: nextdoor_witness_daily_log
        text: "เปิดสมุดบันทึกประจำซอย"
        outcomes:
          - {weight: 1, ok: true, text: "สมุดของคุณละเอียดจนเจ้าหน้าที่ถามว่าเคยทำงานสืบสวนมาก่อนไหม สองบ้านยอมตกลงกันเพราะไม่อยากเห็นชื่อตัวเองในหน้าถัดไป", effects: {happiness: 2, network: 2, knowledge: 1}, merit: [{cat: neutral}]}
