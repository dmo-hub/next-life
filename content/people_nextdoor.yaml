    years: [2500, 2650]
    weight: 0.25
    when: {age: [60, 120], flags: {has: [home_owner]}}
    title: "กิ่งมะขามที่ถูกทวง"
    text: "ต้นมะขามที่คุณรดน้ำมาหลายสิบปีแผ่กิ่งข้ามรั้วไปบังแปลงพริกบ้านติดกัน เพื่อนบ้านมาบอกถึงหน้าประตูอย่างสุภาพว่าขอให้ตัดภายในเดือนนี้ ถ้าไม่ตัดเขาจะตัดเอง คุณไม่อยากให้กิ่งที่เลี้ยงมาหายไปด้วยมือคนอื่น"
    choices:
      - id: nextdoor_tamarind_trim_self
        text: "ตัดเองให้เสร็จในเดือนนี้"
        cost: {unit: income_x, amount: 0.03}
        effects: {relations: 2, health: -1}
        merit: [{cat: neutral}]
      - id: nextdoor_tamarind_after_pods
        text: "ขอเลื่อนไปหลังเก็บฝัก"
        outcomes:
          - {weight: 2, ok: true, text: "เขายอม แลกกับมะขามหนึ่งถุงใหญ่ หลังเก็บฝักคุณตัดกิ่งเรียบร้อย แปลงพริกฟื้นทันหน้าหนาว", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณลืมนับวัน พอเขาตามมาอีกที พริกแคระไปครึ่งแปลง คุณต้องซื้อพริกให้เขาทั้งหน้า", effects: {relations: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_tamarind_threaten
        text: "ขู่แจ้งความถ้าเขาแตะกิ่ง"
        outcomes:
          - {weight: 1, ok: true, text: "เขาถอยไปไม่พูดอะไร กิ่งยังอยู่ แต่คนที่เคยเอาผักข้ามรั้วมาให้ก็หยุดไปด้วย", effects: {happiness: 1, relations: -2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้รู้บอกคุณว่าเขาบอกกล่าวก่อนแล้ว ถ้าคุณไม่ตัดในเวลาสมควร เขาก็มีสิทธิ์ตัดเอง คุณเลยขายหน้าไปทั้งซอย", effects: {happiness: -2, knowledge: 2, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_tamarind_air_rent
        text: "เสนอจ่ายค่าเช่าอากาศด้วยมะขาม"
        outcomes:
          - {weight: 1, ok: true, text: "เขาหัวเราะจนลืมโกรธ ยอมให้กิ่งสูงเหลือไว้ตามสัญญาถุงมะขามปีละครั้ง ส่วนกิ่งต่ำคุณตัดให้จนแปลงพริกได้แดด", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาตอบว่าพริกไม่กินมะขาม แล้วยื่นเลื่อยมาให้ คุณต้องปีนขึ้นไปตัดเองทั้งที่เข่าไม่ค่อยดี", effects: {health: -2, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

