          - {weight: 1, ok: true, text: "คนในซอยลงขันซื้อแนวทางเดินจริงจัง ป้ายไม้เล็ก ๆ เขียนว่าทางนี้ของทุกคน คุณได้เงินน้อยกว่าที่คิดแต่กินข้าวฟรีไปอีกหลายบ้าน", effects: {happiness: 2, network: 2, money: {unit: income_x, amount: 0.2}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ป้าท้ายซอยจองไปสามนิ้ว ที่เหลือไม่มีใครเอา คุณต้องคืนเงินสามนิ้วนั้นพร้อมฟังเหตุผลอีกสองชั่วโมง", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: nextdoor_trash_witness_01
    type: A
    category: society
    stage: กลางคน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [46, 59]}
    title: "พยานหน้าต่างชั้นบน"
    text: "สองบ้านติดกันมีเรื่องมาสองปีเพราะขยะถูกปาเข้าบ้าน คุณนั่งริมหน้าต่างชั้นบนทุกเช้าเลยเห็นว่าใครเป็นคนปา คนที่โดนมาขอให้ไปเป็นพยานต่อหน้าเจ้าหน้าที่ ส่วนคนปาคือคนที่เคยพาคุณไปหาหมอเมื่อปีก่อน"
    choices:
      - id: nextdoor_witness_tell_what_seen
        text: "ไปเล่าตามที่เห็นจริง"
        outcomes:
          - {weight: 2, ok: true, text: "เจ้าหน้าที่จดตามคำของคุณ เรื่องจบที่การเรียกมาตักเตือน ขยะหยุดลอย ส่วนคนที่เคยพาไปหาหมอเลิกทักคุณไปพักใหญ่", effects: {knowledge: 1, relations: -1, happiness: 1}, merit: [{cat: sila, level: 1}]}
          - {weight: 1, text: "คำให้การตรงกับหลักฐานแค่บางส่วน เรื่องยืดเยื้อต่ออีกหลายเดือน คุณต้องไปนั่งรอที่ทำการจนเจ้าหน้าที่จำหน้าได้", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nextdoor_witness_talk_first
        text: "ไปคุยกับคนปาก่อนสักรอบ"
        outcomes:
          - {weight: 1, ok: true, text: "เขาเงียบไปนาน แล้วเล่าว่าเริ่มจากเรื่องหมาเห่าเมื่อสองปีก่อน คืนนั้นคุณพาทั้งสองบ้านมานั่งคุยกัน ขยะหยุดในเดือนนั้น", effects: {relations: 2, network: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เขาหาว่าคุณยุ่งไม่เข้าเรื่อง แล้วเลิกทักคุณไปเลย ส่วนขยะก็ยังถูกปามาเหมือนเดิม", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
