# กองสุ่มช่วงชรา หมวดครอบครัว/ชีวิตบั้นปลาย — ใช้ธงกลาง married · has_kids · in_debt
events:
  - id: old_grandkids_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 3
    when: {flags: {has: [has_kids]}}
    multipliers: {flags: {married: 1.3}}
    title: "หลานมาฝากเลี้ยง"
    text: "ลูกหอบหลานสองคนมาฝากไว้ บอกว่า 'แค่ช่วงนี้' แต่กระเป๋าใบใหญ่เกินกว่าจะเป็นแค่ช่วงนี้"
    choices:
      - id: raise_fully
        text: "รับเลี้ยงเต็มตัว"
        effects: {relations: 2, happiness: 1, health: -1, money: {unit: income_x, amount: -0.5}, chronic: {happiness: 1}}
        merit: [{cat: help_others, level: 2}]
        sets_flags: [raised_grandkids]
      - id: spoil
        text: "ตามใจหลานทุกอย่าง"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {relations: 1.3}}, text: "หลานรักคุณสุดหัวใจ ใครแตะไม่ได้", effects: {relations: 2, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หลานติดจอ ติดขนม ลูกกลับมาเห็นแล้วทะเลาะกันใหญ่", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: teach_old_way
        text: "สอนหลานแบบคนรุ่นเก่า"
        outcomes:
          - {weight: 1, ok: true, text: "หลานโตมาเป็นคนเดียวในรุ่นที่ทำกับข้าวเป็น ไปไหนใครก็รัก", effects: {relations: 2, knowledge: 1, health: 1}, merit: [{cat: neutral}], multipliers: {stats: {relations: 2}}}
          - {weight: 2, text: "หลานเรียกว่า 'คุณครูโหด' แต่ก็ยอมฟัง", effects: {happiness: 1, health: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: refuse_babysit
        text: "ปฏิเสธ ขอใช้ชีวิตบ้าง"
        effects: {happiness: 1, relations: -2, health: 1}
        merit: [{cat: neutral}]

  - id: old_inheritance_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 2
    when: {age: [65, 110], flags: {has: [has_kids]}}
    title: "แบ่งมรดก"
    text: "อายุ {อายุ} แล้ว ลูก ๆ เริ่มถามเรื่องบ้านกับที่ดินบ่อยผิดปกติ วงข้าวเย็นเงียบกริบทุกครั้งที่มีคนพูดว่า 'พินัยกรรม'"
    choices:
      - id: split_equal
        text: "แบ่งเท่ากันทุกคน"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: favor_carer
        text: "ยกให้คนที่ดูแลมากกว่า"
        outcomes:
          - {weight: 2, text: "คนที่ดูแลซึ้งจนร้องไห้ อีกคนเลิกคุยไปเลย", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, ok: true, multipliers: {stats: {relations: 1.5}}, text: "ทุกคนยอมรับ เพราะรู้อยู่แล้วว่าใครเหนื่อยที่สุด", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: give_temple
        text: "ยกให้มูลนิธิทั้งหมด"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {relations: 1.3}}, text: "ลูกช็อกแต่ต้องหันมาดูแลกันเองจริงจัง สุดท้ายสนิทกันขึ้น", effects: {relations: 1, happiness: 2}, merit: [{cat: dana, level: 3}]}
          - {weight: 1, text: "ลูกโกรธจนไม่มาเยี่ยมทั้งปี บ้านเงียบจนได้ยินเสียงนาฬิกา", effects: {relations: -3, happiness: -1, health: -1}, merit: [{cat: dana, level: 3}]}
        merit: [{cat: dana, level: 2}]
      - id: spend_it_all
        text: "ใช้เองให้หมดก่อนตาย"
        effects: {happiness: 2, health: 1, relations: -2, money: {unit: income_x, amount: -2}, income_mult: 0.8}
        merit: [{cat: neutral}]
      - id: keep_secret
        text: "เงียบไว้ ไม่บอกใคร"
        effects: {relations: -1, happiness: -1, health: -1}
        merit: [{cat: neutral}]

  - id: old_child_money_01
    type: A
    category: work_money
    stage: ชรา
    years: [2500, 2650]
    weight: 2
    when: {flags: {has: [has_kids]}}
    multipliers: {flags: {in_debt: 2}}
    title: "ลูกโทรมาขอเงิน"
    text: "ลูกโทรมาเสียงสั่น 'ขอยืมก้อนสุดท้าย ครั้งนี้จริง ๆ' เงินเก็บที่มีอยู่ {เงิน} บาท คือเงินที่ตั้งใจไว้ใช้ตอนป่วย"
    choices:
      - id: give_all
        text: "ให้ไปทั้งก้อน"
        outcomes:
          - {weight: 1, ok: true, text: "ลูกตั้งตัวได้ ปีถัดมาส่งเงินกลับมาเลี้ยงทุกเดือน", effects: {relations: 3, happiness: 2, income_mult: 1.3, money: {unit: income_x, amount: -2}}, merit: [{cat: help_others, level: 2}], multipliers: {karma: 1.3}}
          - {weight: 2, text: "เงินหายไปกับหนี้ก้อนเก่า ลูกยังโทรมาอีก", effects: {happiness: -2, health: -1, income_mult: 0.8, money: {unit: income_x, amount: -2}}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 2}]
      - id: give_half
        text: "ให้ครึ่งเดียวพอ"
        effects: {relations: 1, money: {unit: income_x, amount: -1}}
        merit: [{cat: help_others, level: 1}]
      - id: ask_why
        text: "นั่งคุยให้รู้เรื่องก่อน"
        outcomes:
          - {weight: 2, ok: true, text: "ลูกยอมเล่าตามจริง สองคนช่วยกันวางแผนใช้หนี้ทีละก้อน", effects: {relations: 2, knowledge: 1, health: 1}, merit: [{cat: neutral}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "ลูกงอน วางสายแล้วหายเงียบ", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: refuse
        text: "ไม่ให้ ปล่อยให้เรียนรู้เอง"
        effects: {relations: -2, happiness: -1, health: 1}
        merit: [{cat: neutral}]

  - id: old_phone_scam_01
    type: A
    category: work_money
    stage: ชรา
    years: [2550, 2650]
    weight: 3
    multipliers: {flags: {in_debt: 1.5, scam_aware: 0.3}}
    repeat: {gap: 4, max: 3}
    title: "สายจากเจ้าหน้าที่"
    text: "เสียงปลายสายบอกว่าเป็นเจ้าหน้าที่ บัญชีของคุณพัวพันคดีฟอกเงิน ต้องโอนเงินมาตรวจสอบภายในวันนี้ ไม่งั้นโดนจับ"
    choices:
      - id: transfer
        text: "รีบโอนตามที่บอก"
        outcomes:
          - {weight: 3, text: "เงินหายทั้งก้อน เบอร์นั้นปิดเครื่องทันที", effects: {happiness: -3, health: -1, money: {unit: income_x, amount: -3}, chronic: {happiness: -1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ธนาคารโทรมาระงับทัน เพราะยอดโอนแปลก รอดหวุดหวิด", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}], sets_flags: [scam_aware], multipliers: {karma: 1.4}}
        merit: [{cat: neutral}]
      - id: hang_up
        text: "วางสายแล้วบล็อกเบอร์"
        effects: {happiness: 1, health: 1}
        merit: [{cat: neutral}]
        sets_flags: [scam_aware]
      - id: call_grandkid
        text: "โทรถามหลานก่อน"
        outcomes:
          - {weight: 2, ok: true, text: "หลานบอกทันทีว่ามิจฉาชีพ แล้วสอนวิธีสังเกตให้อีกชุด", effects: {relations: 1, knowledge: 1}, merit: [{cat: neutral}], sets_flags: [scam_aware], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "หลานไม่รับสาย ระหว่างรอเกือบกดโอนไปแล้ว มือสั่นทั้งวัน", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: troll_back
        text: "แกล้งคุยยื้อจนมิจท้อ"
        outcomes:
          - {weight: 2, ok: true, text: "คุยยาวชั่วโมงครึ่ง มิจฉาชีพบ่นเหนื่อยแล้ววางเอง คลิปที่หลานอัดไว้ดังทั้งเน็ต", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หลงเผลอบอกเลขบัตรไปครึ่งหนึ่ง ต้องวิ่งเปลี่ยนเอกสารทั้งสัปดาห์", effects: {happiness: -1, health: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: warn_village
        text: "ออกเสียงตามสายเตือนทั้งชุมชน"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]

  - id: old_friend_trip_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 2
    multipliers: {flags: {married: 0.8}, occupation: {professional: 1.3, manager: 1.3}}
    title: "เพื่อนเก่าชวนเที่ยว"
    text: "เพื่อนสมัยเรียนที่ไม่เจอกันสามสิบปีทักมา '{ชื่อ} แก่แล้วไปเที่ยวกันสักทริปมั้ย ก่อนเดินไม่ไหว'"
    choices:
      - id: go_abroad
        text: "ไปต่างประเทศกันเลย"
        requires: {money: {unit: income_x, amount: 1.5}, reason: "เงินเก็บไม่พอค่าตั๋วต่างประเทศ"}
        outcomes:
          - {weight: 2, ok: true, text: "ทริปในฝัน ถ่ายรูปกลับมาอวดได้ทั้งปี", effects: {happiness: 3, relations: 1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 1, text: "ล้มที่สนามบินขาแพลง เที่ยวบนรถเข็นทั้งทริป", effects: {health: -2, happiness: 1, money: {unit: income_x, amount: -1.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: go_temple_trip
        text: "ไปไหว้พระต่างจังหวัด"
        effects: {happiness: 1, health: 1}
        merit: [{cat: bhavana, level: 1}]
      - id: reunion_gang
        text: "ไปเพราะอยากเจอแก๊งเก่าครบทีม"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "มากันครบทุกคน นั่งเล่าเรื่องสมัยเรียนจนเช้า หัวเราะเหมือนวัยรุ่นอีกรอบ", effects: {happiness: 3, health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "แต่ละคนพาหลานมาด้วยห้าคน ทั้งทริปได้คุยกันแค่สิบนาที", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: decline
        text: "ไม่ไปหรอก อยู่บ้านสบายกว่า"
        outcomes:
          - {weight: 1, text: "เพื่อนส่งรูปมาอวดทั้งกลุ่ม นั่งเหงาอยู่บ้านคนเดียว", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้พักจริง ๆ นอนกลางวันยาวไม่มีใครกวน", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: old_learn_new_01
    type: A
    category: study
    stage: ชรา
    years: [2540, 2650]
    weight: 2
    multipliers: {occupation: {service: 1.4, craft: 1.2}}
    title: "เรียนสิ่งใหม่ตอนแก่"
    text: "อายุ {อายุ} แล้ว ศูนย์ผู้สูงอายุเปิดคอร์สฟรีหลายอย่าง หลานบอกว่า 'แก่แล้วจะเรียนไปทำไม' ยิ่งพูดยิ่งอยากเรียน"
    choices:
      - id: learn_online_sell
        text: "เรียนขายของออนไลน์"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.3}}, text: "ไลฟ์ขายพริกแกงฝีมือตัวเอง คนดูแน่นทุกคืน กลายเป็นคนดังของตำบล", effects: {happiness: 2, knowledge: 1, income_mult: 1.3}, merit: [{cat: neutral}], next: old_learn_live_shop_01}
          - {weight: 2, text: "ลืมปิดไลฟ์ทั้งคืน คนแห่มาฟังเสียงกรนตัวเองจนยอดวิวพุ่ง", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: learn_dance
        text: "เข้าชมรมเต้นแอโรบิก"
        effects: {health: 2, happiness: 1, chronic: {health: 1}}
        merit: [{cat: neutral}]
      - id: learn_language
        text: "เรียนภาษาที่สาม"
        requires: {stats: {knowledge: {min: 70}}, reason: "พื้นความรู้ยังไม่พอเรียนภาษาใหม่"}
        effects: {knowledge: 2, happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: teach_instead
        text: "สมัครเป็นครูอาสาแทน"
        effects: {relations: 2, knowledge: 1}
        merit: [{cat: help_others, level: 2}]
      - id: skip_class
        text: "ไม่เรียน ดูละครดีกว่า"
        effects: {happiness: 1, knowledge: -1, health: -2}
        merit: [{cat: neutral}]

  - id: old_care_home_01
    type: A
    category: health
    stage: ชรา
    years: [2520, 2650]
    weight: 2
    when: {age: [70, 110]}
    multipliers: {flags: {has_kids: 0.7, married: 0.8}}
    title: "บ้านพักคนชรา"
    text: "เดินขึ้นบันไดเองไม่ค่อยไหวแล้ว คนรอบตัวเริ่มคุยกันเรื่อง 'ที่ที่มีคนดูแล' ตอนคิดว่าเราหลับอยู่"
    choices:
      - id: go_premium
        text: "เข้าบ้านพักเอกชนอย่างดี"
        requires: {money: {unit: income_x, amount: 2.5}, reason: "เงินไม่พอค่าบ้านพักเอกชน"}
        effects: {health: 2, happiness: 1, money: {unit: income_x, amount: -2.5}}
        merit: [{cat: neutral}]
      - id: go_public
        text: "เข้าสถานสงเคราะห์ของรัฐ"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {network: 1.3}}, text: "เจอเพื่อนรุ่นเดียวกันเพียบ ตั้งวงหมากรุกทุกบ่าย", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ห้องรวมเสียงดังทั้งคืน นอนไม่หลับจนทรุด", effects: {health: -2, happiness: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: stay_home
        text: "ยืนกรานอยู่บ้านตัวเอง"
        outcomes:
          - {weight: 2, ok: true, text: "ญาติกับเพื่อนบ้านผลัดกันแวะมาดู บ้านกลับมาคึกคัก", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}], multipliers: {stats: {relations: 2}}}
          - {weight: 1, text: "ลื่นล้มในห้องน้ำตอนอยู่คนเดียว นอนรอจนเช้ากว่าจะมีคนเห็น", effects: {health: -3, happiness: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: share_house
        text: "ชวนเพื่อนแก่มาอยู่ด้วยกัน"
        effects: {happiness: 2, relations: 2, health: 1, chronic: {health: 1}}
        merit: [{cat: help_others, level: 1}]

  - id: old_reunion_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 2
    multipliers: {flags: {married: 1.5, has_kids: 1.5, raised_grandkids: 1.5}}
    title: "งานรวมญาติ"
    text: "สงกรานต์ปีนี้ญาติมากันครบทั้งตระกูลที่บ้านใน{ภาค} ในฐานะคนแก่สุดในงาน ทุกสายตามองมาที่เรา"
    choices:
      - id: bless_all
        text: "นั่งรับรดน้ำดำหัว ให้พรลูกหลาน"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: bhavana, level: 1}]
      - id: reveal_secret
        text: "เล่าความลับตระกูลกลางวง"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {relations: 1.3}}, text: "ญาติสองบ้านที่ไม่คุยกันมาสิบปีกอดกันร้องไห้", effects: {relations: 3, happiness: 2, chronic: {happiness: 1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "งานแตก ญาติแยกวงกินข้าวกันคนละมุม", effects: {relations: -2, happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: drink_with_nephews
        text: "ตั้งวงซดกับหลานชาย"
        effects: {happiness: 2, relations: 1, health: -2}
        merit: [{cat: intoxicants, level: 1}]
      - id: cook_feast
        text: "ลงครัวทำกับข้าวเลี้ยงทุกคน"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: dana, level: 1}]
      - id: nap_early
        text: "แอบไปนอนตั้งแต่หัวค่ำ"
        effects: {health: 2, relations: -1}
        merit: [{cat: neutral}]

  - id: old_spouse_memory_01
    type: A
    category: health
    stage: ชรา
    years: [2500, 2650]
    weight: 2
    when: {age: [68, 110], flags: {has: [married]}}
    title: "คู่ชีวิตเริ่มหลงลืม"
    text: "คู่ชีวิตเรียกชื่อเราผิดเป็นชื่อคนที่ไม่เคยได้ยินมาก่อน แล้วถามว่า 'กินข้าวหรือยัง' เป็นรอบที่สี่ของวัน ทั้งที่เมื่อเช้ายังเรียก '{ชื่อ}' ถูกอยู่เลย"
    choices:
      - id: see_doctor
        text: "พาไปหาหมอระบบประสาท"
        effects: {health: 1, relations: 1, money: {unit: income_x, amount: -1}}
        merit: [{cat: help_others, level: 1}]
      - id: care_alone
        text: "ดูแลเองทุกอย่าง"
        effects: {relations: 2, health: -2, happiness: -1, chronic: {health: -1}}
        merit: [{cat: help_others, level: 2}]
      - id: ask_name
        text: "ถามว่าชื่อนั้นคือใคร"
        outcomes:
          - {weight: 1, ok: true, text: "เป็นชื่อเพื่อนสมัยเด็กที่ตายไปนาน เรื่องเล่าคืนนั้นทำให้รักกันมากขึ้น", effects: {relations: 2, happiness: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "อีกฝ่ายอึกอักไม่ยอมตอบ ท่าทางแบบนี้น่าจะเป็นแฟนเก่า นอนไม่หลับไปทั้งเดือน", effects: {happiness: -2, health: -1}, merit: [{cat: neutral}], next: old_spouse_flame_01}
        merit: [{cat: neutral}]
      - id: brain_games
        text: "ชวนเล่นเกมฝึกสมองทุกวัน"
        effects: {knowledge: 1, happiness: 1, health: 1, chronic: {health: 1}}
        merit: [{cat: neutral}]

  - id: old_learn_live_shop_01
    type: A
    category: work_money
    stage: ชรา
    years: [2540, 2650]
    title: "ไลฟ์ดังเกินตัว"
    text: "ออเดอร์พริกแกงล้นจนตำไม่ทัน มีคนทักมาขอซื้อสูตรลับ อีกเจ้าชวนไปออกรายการ ส่วนลูกหลานเริ่มมาป้วนเปี้ยนแถวครกบ่อยผิดปกติ"
    choices:
      - id: hire_neighbors
        text: "จ้างป้าข้างบ้านมาช่วยตำ"
        outcomes:
          - {weight: 2, ok: true, text: "ทั้งซอยมีงานทำ เสียงครกดังทั้งวัน กลายเป็นวิสาหกิจเล็ก ๆ ของหมู่บ้าน", effects: {relations: 2, happiness: 2, money: {unit: income_x, amount: 1}}, merit: [{cat: help_others, level: 2}]}
          - {weight: 1, text: "ป้าข้างบ้านแอบจดสูตรไปเปิดไลฟ์แข่ง ราคาถูกกว่าครึ่ง", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: help_others, level: 1}]
      - id: sell_recipe
        text: "ขายสูตรลับก้อนเดียวจบ"
        effects: {money: {unit: income_x, amount: 2}, happiness: 1, income_mult: 0.8}
        merit: [{cat: neutral}]
      - id: give_to_grandkid
        text: "ยกร้านให้หลานไลฟ์ต่อ"
        outcomes:
          - {weight: 1, ok: true, text: "หลานทำแพ็กเกจใหม่ ยอดขายพุ่งจนส่งเงินมาให้ทุกเดือน", effects: {relations: 3, happiness: 2, income_mult: 1.2}, merit: [{cat: dana, level: 1}]}
          - {weight: 1, text: "หลานไลฟ์ได้สามวันแล้วเลิก ลูกค้าบ่นว่ารสไม่เหมือนเดิม", effects: {relations: -1, happiness: -1, income_mult: 0.8}, merit: [{cat: dana, level: 1}]}
        merit: [{cat: dana, level: 1}]
      - id: go_on_show
        text: "ไปออกรายการให้ดังทั้งประเทศ"
        outcomes:
          - {weight: 1, ok: true, text: "พูดตรงจนคนดูขำทั้งประเทศ ออเดอร์เข้าวันเดียวเท่าทั้งปี", effects: {happiness: 3, network: 2, money: {unit: income_x, amount: 1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ตื่นกล้องพูดผิดพูดถูก คลิปโดนตัดไปล้อทั้งเน็ต อายจนไม่กล้าออกจากบ้าน", effects: {happiness: -2, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quit_live
        text: "พอแล้ว ขอกลับไปนอนกลางวัน"
        effects: {health: 2, happiness: 1, income_mult: 0.8}
        merit: [{cat: neutral}]

  - id: old_spouse_flame_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    title: "ชื่อที่ไม่เคยได้ยิน"
    text: "ชื่อนั้นยังวนอยู่ในหัว เจอรูปเก่าซ่อนในหีบเสื้อผ้า หลังรูปเขียนชื่อเดียวกัน กับเบอร์บ้านที่ยังโทรติด"
    choices:
      - id: call_number
        text: "แอบโทรไปเบอร์หลังรูป"
        outcomes:
          - {weight: 1, ok: true, text: "ปลายสายคือน้องสาวของคนในรูป เล่าว่าคู่เราเคยช่วยชีวิตพี่เขาไว้ ไม่ใช่แฟนเก่าอย่างที่คิด", effects: {happiness: 2, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปลายสายเป็นคนในรูปเอง ยังจำคู่เราได้ทุกอย่าง เสียงสั่นจนต้องวางสาย", effects: {happiness: -2, health: -1, chronic: {happiness: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_spouse_gently
        text: "ถามคู่ชีวิตตอนเขาจำได้"
        outcomes:
          - {weight: 1, ok: true, text: "คู่หัวเราะ บอกว่าเป็นรักแรกตอนแปดขวบ แล้วจับมือเราแน่น 'แต่คนที่อยู่ด้วยจนแก่คือเธอ'", effects: {relations: 2, happiness: 2, chronic: {happiness: 1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คู่มองหน้างง ๆ แล้วถามว่า 'เธอเป็นใคร' ใจหายวาบ", effects: {happiness: -2, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: burn_photo
        text: "เผารูปทิ้ง ทำเป็นไม่เคยเห็น"
        effects: {happiness: -1, health: -1, relations: -1}
        merit: [{cat: neutral}]
      - id: let_it_go
        text: "ปล่อยวาง อดีตก็คืออดีต"
        effects: {happiness: 1, health: 1}
        merit: [{cat: bhavana, level: 1}]
