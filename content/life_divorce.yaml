      family: [{role: child, alive: true, age: [0, 17], count: [0, 0]}]
    title: "ลายเซ็นสุดท้าย"
    text: "หลายปีมานี้คุณสองคนต่างคนต่างอยู่ เจ้าหน้าที่ที่ว่าการอำเภอถามย้ำว่าตกลงกันได้เรื่องทรัพย์สินแล้วใช่ไหม“{ชื่อคู่}”ยื่นปากกามาให้คุณเซ็นก่อน"
    choices:
      - id: sign_quietly
        text: "เซ็น แบ่งกันตามที่ตกลง"
        family: [{divorce: spouse}]
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: bargain
        text: "ขอทบทวนส่วนแบ่งอีกรอบก่อนเซ็น"
        family: [{divorce: spouse}]
        effects: {happiness: -2, money: {unit: income_x, amount: -0.4}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ใช้เวลาอีกสองสามเดือนกับทนายคนละฝั่ง สุดท้ายคุยกันรู้เรื่อง เซ็นโดยไม่ต้องเจอกันที่ศาล", effects: {relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรื่องส่วนแบ่งบานปลาย ญาติสองฝั่งโทรมาขอเข้าข้างกันเอง ใบหย่าผ่านไปพร้อมคำพูดที่ถอนคืนไม่ได้", effects: {relations: -2, happiness: -2}, sets_flags: [ex_bitter], merit: [{cat: neutral}]}
      - id: walk_out
        text: "ไม่เอาอะไรเลย ขอแค่จบ"
        family: [{divorce: spouse}]
        effects: {happiness: -1, money: {unit: income_x, amount: -0.8}}
        merit: [{cat: neutral}]
      - id: witness
        text: "ให้ญาติผู้ใหญ่เป็นพยานแล้วเซ็น"
        family: [{divorce: spouse}]
        effects: {happiness: -1}
        merit: [{cat: neutral}]
