# แยกทาง → หย่า (ใบ 92 · B114 ข้อ 145 153 154 162 164): ทะเลาะ → แยกทาง → คืนดี | หย่า (แบ่งสินสมรสครึ่ง · ลูกเล็กเลือกอยู่กับใคร)
# ทางเข้าแยกทาง: ความผูกพันต่ำนาน (bond ≤ 48 ตั้งแต่อยู่ด้วยกัน ≥ 3 ปี · พื้นของเกมคือ 38) · หนี้ท่วม (ธง in_debt) · นอกใจถูกจับได้ = ใบ 94 เติมเอง · ห่างกันเอง ผูกยุค = ใบ 93 (fam_separate_far_*)
# สายต่อเป็นนัดผลย้อน (schedules) ไม่ขึ้นกองสุ่ม · ใบหย่ามี weight กันคู่ที่แยกทางค้างเมื่อนัดหาย
# แกน: แยกทางจดสถานะบนตัวคู่ (ธง married ไม่หาย) · หย่าหักเงินครึ่งของส่วนที่งอกหลังเริ่มอยู่ด้วยกัน · ลูกเล็กจด custody (other = ผูกพันจางเร็วกว่า · ยังเป็นทายาท)
events:
  - id: fam_quarrel_work_01
    away_block: [abroad, monk]
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    weight: 3
    when: {spouse: {status: together, together: [3, 99]}}
    title: "เสียงในครัวตอนดึก"
    text: "เรื่องเล็ก ๆ เรื่องค่าน้ำค่าไฟกลายเป็นเรื่องที่ไม่เล็กอีกต่อไป “{ชื่อคู่}”วางจานลงแรงกว่าปกติ แล้วถามว่าคุณเคยฟังที่เขาพูดบ้างไหม"
    choices:
      - id: swallow
        text: "เงียบไว้ ไม่ต่อความ"
        family: [{bond: spouse, d: -3}]
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: shout
        text: "เถียงกลับให้สุดเสียง"
        family: [{bond: spouse, d: -8}]
        effects: {happiness: -2, relations: -1}
        merit: [{cat: neutral}]
      - id: listen
        text: "วางของในมือแล้วนั่งฟังให้จบ"
        family: [{bond: spouse, d: 4}]
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: sleep_apart
        text: "แยกไปนอนอีกห้องคืนนี้"
        family: [{bond: spouse, d: -5}]
        effects: {happiness: -1}
        merit: [{cat: neutral}]

