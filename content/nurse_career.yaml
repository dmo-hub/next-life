          - {weight: 1, text: "เรื่องย้ายเงียบ ต้องอยู่ที่เดิมอีกปี", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: nap_room
        text: "หาห้องงีบลับหลังตึก"
        effects: {health: 1, happiness: 1}
        merit: [{cat: neutral}]

  - id: nurse_casual_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2559, 2650]
    weight: 2
    when: {age: [23, 30], flags: {has: [nurse_rn]}}
    title: "ลูกจ้างชั่วคราวหกปี"
    text: "ทำงานเต็มเวลาเหมือนพยาบาลข้าราชการทุกอย่าง แต่ตำแหน่งยังเป็นลูกจ้างชั่วคราว เงินเดือนไม่ขยับ สวัสดิการน้อยกว่า ปีนี้ประกาศรายชื่อบรรจุออกมาอีกรอบ ชื่อคุณไม่อยู่ในนั้น"
