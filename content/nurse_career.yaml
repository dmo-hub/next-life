        cost: {unit: income_x, amount: 0.8}
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.5}}, text: "สอบผ่าน ได้งานพยาบาลเมืองนอก ส่งเงินกลับบ้านทุกเดือน", effects: {money: {unit: income_x, amount: 2}, relations: -2, happiness: 1}, merit: [{cat: neutral}]}
