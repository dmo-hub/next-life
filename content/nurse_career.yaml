        text: "รอรอบหน้าต่อ"
        effects: {happiness: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: petition
        text: "ร่วมกลุ่มยื่นหนังสือทวงตำแหน่ง"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "รอบถัดมาชื่อคุณได้บรรจุ", effects: {happiness: 3, money: {unit: income_x, amount: 0.3}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เรื่องเงียบไปอีกปี", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
