      - id: leave
        text: "ลาออกไปเอกชน"
        effects: {money: {unit: income_x, amount: 1}, relations: -1}
        merit: [{cat: neutral}]
      - id: side_job
        text: "รับเฝ้าไข้ตามบ้านวันหยุด"
        effects: {money: {unit: income_x, amount: 0.5}, health: -1}
        merit: [{cat: neutral}]

  - id: nurse_frontline_01
    type: A
    category: health
