  - id: nurse_abroad_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], flags: {has: [nurse_rn]}}
    title: "สอบใบอนุญาตเมืองนอก"
    text: "เพื่อนรุ่นเดียวกันส่งรูปจากโรงพยาบาลเมืองนอก ค่าแรงต่อชั่วโมงเท่าเงินเดือนที่นี่หลายวัน แต่ต้องสอบภาษาอังกฤษ สอบใบอนุญาตของประเทศนั้นใหม่ และช่วงแรกอาจต้องทำงานต่ำกว่าวุฒิ"
