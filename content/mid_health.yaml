# กลางคน · โรคภัย — โรคจากนิสัยที่สะสมมา (smoker · heavy_drinker · sporty) + ทางรักษาที่ใช้เงิน/ประกัน
events:
  - id: midh_diabetes_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    multipliers: {flags: {sporty: 0.5, heavy_drinker: 1.5}, occupation: {clerk: 1.3, manager: 1.3, professional: 1.2}}
    title: "น้ำตาลเกินร้อย"
    text: "ตรวจสุขภาพประจำปีตอนอายุ {อายุ} พยาบาลเจาะเลือดซ้ำสองรอบเพราะไม่เชื่อตัวเลข หมอยื่นผลให้แล้วถามว่า ชานมวันละกี่แก้ว"
    choices:
      - id: quit_sugar
        text: "งดหวานเด็ดขาด เดินเช้าทุกวัน"
        effects: {health: 1, happiness: -1, chronic: {health: 1}}
        merit: [{cat: neutral}]
      - id: pills_and_tea
        text: "กินยาตามหมอ แต่ชานมยังอยู่"
        outcomes:
          - {weight: 2, ok: true, text: "ยาเอาอยู่ ค่าน้ำตาลนิ่งแบบงง ๆ", effects: {happiness: 1}, merit: [{cat: neutral}], multipliers: {stats: {health: 1.5}}}
          - {weight: 1, text: "ลืมกินยาบ่อย ปลายเท้าเริ่มชาจนเดินเหยียบหนามไม่รู้ตัว", effects: {health: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: line_herb
        text: "ลองสมุนไพรที่ญาติส่งในไลน์"
        outcomes:
          - {weight: 1, ok: true, text: "ค่าน้ำตาลลดจริง หมอยังงงจนขอชื่อสมุนไพร", effects: {health: 1, happiness: 1}, merit: [{cat: neutral}], multipliers: {karma: 1.4}, next: midh_herb_fame_01}
          - {weight: 3, text: "ไตเริ่มรวน สุดท้ายต้องกลับไปหาหมอพร้อมค่ารักษาก้อนโต", effects: {health: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: weight_camp
        text: "เข้าคอร์สคุมน้ำหนักราคาแพง"
        requires: {money: {unit: income_x, amount: 1}, reason: "เงินเก็บไม่พอค่าคอร์ส"}
        effects: {health: 2, happiness: 1, money: {unit: income_x, amount: -1}, chronic: {health: 1}}
        merit: [{cat: neutral}]

  - id: midh_pressure_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    multipliers: {flags: {smoker: 1.5, heavy_drinker: 1.5, sporty: 0.6}, occupation: {manager: 1.5, clerk: 1.2, professional: 1.2, farmer: 0.5}}
    title: "ตัวเลขที่ร้านขายยา"
    text: "ปวดท้ายทอยมาสามวัน แวะวัดความดันที่ร้านขายยา เภสัชกรมองจอแล้วขอวัดใหม่ทันที รอบสองตัวเลขยิ่งสูงกว่าเดิม"
    choices:
      - id: see_doctor
        text: "ไปหาหมอ กินยาทุกเช้า"
        effects: {health: 1, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
      - id: cut_salt
        text: "ลดเค็ม เลิกน้ำปลาพริกทุกมื้อ"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "ลิ้นชินรสจืดภายในเดือนเดียว ความดันลงจริง", effects: {health: 1, chronic: {health: 1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทนได้สามวัน แอบกินส้มตำปลาร้าตอนเที่ยงคืน", effects: {health: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ignore_it
        text: "ช่างมัน เดี๋ยวก็หาย"
        outcomes:
          - {weight: 3, text: "หายจริง... ส่วนความดันแค่เงียบไว้ก่อน", effects: {chronic: {health: -1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ล้มหน้าห้องน้ำตอนตีห้า ตื่นมาอีกทีอยู่ห้องฉุกเฉิน", effects: {health: -3, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quit_stress_job
        text: "ทิ้งงานเครียด หันไปปลูกผักขาย"
        effects: {health: 1, happiness: 2, job: farmer, chronic: {health: 1}}
        merit: [{cat: neutral}]

  - id: midh_cancer_early_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 1
    multipliers: {flags: {smoker: 2, heavy_drinker: 1.5, sporty: 0.8}, occupation: {farmer: 1.3, factory: 1.2}}
    title: "ก้อนเล็กที่คลำเจอ"
    text: "หมอเรียกเข้าห้องพร้อมญาติ ก้อนเล็กที่คลำเจอตอนอาบน้ำเป็นเนื้อร้าย ข่าวดีเดียวคือยังระยะแรก เงินเก็บตอนนี้ {เงิน} บาท"
    choices:
      - id: surgery_now
        text: "ผ่าตัดทันที ทุ่มเงินเก็บ"
        outcomes:
          - {weight: 4, ok: true, text: "ตัดออกหมด หมอยิ้มกว้างที่สุดในชีวิตที่เคยเห็น", effects: {health: 2, money: {unit: income_x, amount: -2}}, merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 1, text: "เจอเพิ่มอีกจุด ต้องให้คีโมต่ออีกหกรอบ", effects: {health: -1, money: {unit: income_x, amount: -2}, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: public_queue
        text: "ใช้สิทธิ์ รพ.รัฐ รอคิวผ่าตัด"
        outcomes:
          - {weight: 2, ok: true, text: "คิวทันพอดี หมอรัฐฝีมือไม่แพ้ใคร", effects: {health: 1}, merit: [{cat: neutral}], multipliers: {karma: 1.5}}
          - {weight: 1, text: "รอสี่เดือน ก้อนโตจนต้องผ่าใหญ่กว่าเดิม", effects: {health: -2, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: miracle_cure
        text: "บินไปรักษาทางเลือกต่างประเทศ"
        outcomes:
          - {weight: 1, text: "หมอที่นั่นอ่านผลแล้วส่งตัวกลับไปผ่าตัดตามแผนเดิม ได้เที่ยวเป็นของแถม", effects: {happiness: 1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
          - {weight: 3, text: "กลับมาพร้อมใบเสร็จยาวเหยียดและมะเร็งระยะสอง", effects: {health: -3, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: secret_trip
        text: "ไม่บอกใคร แล้วออกเที่ยวรอบโลก"
        outcomes:
          - {weight: 1, ok: true, text: "กลับมาตรวจซ้ำ ผลแรกสลับชื่อกับคนไข้อีกคน เที่ยวฟรีเลยรอบนี้", effects: {health: 1, happiness: 3, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ทริปนี้ดีที่สุดในชีวิต แต่ก้อนก็โตไปพร้อมกัน", effects: {health: -2, happiness: 2, relations: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: surgery_reset
        text: "ผ่าตัด แล้วเลิกทุกนิสัยเสีย"
        outcomes:
          - {weight: 4, ok: true, multipliers: {stats: {health: 1.5}}, text: "ตัดออกหมด ออกจาก รพ. แล้วทิ้งบุหรี่กับขวดเหล้าลงถังหน้าบ้าน", effects: {health: 2, happiness: -1, money: {unit: income_x, amount: -2}, chronic: {health: 1}}, merit: [{cat: sila, level: 1}]}
          - {weight: 1, text: "เจอเพิ่มอีกจุด ต้องคีโมหกรอบ แต่ร่างกายที่เลิกทุกอย่างแล้วฟื้นเร็วกว่าที่หมอคิด", effects: {health: -1, happiness: -1, money: {unit: income_x, amount: -2}, chronic: {health: 1}}, merit: [{cat: sila, level: 1}]}
        clears_flags: [smoker, heavy_drinker]
        merit: [{cat: sila, level: 1}]

  - id: midh_heart_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    multipliers: {flags: {smoker: 3, heavy_drinker: 1.5, sporty: 0.5}, occupation: {manager: 1.4, labor: 1.2}}
    title: "ช้างนั่งบนหน้าอก"
    text: "เดินขึ้นสะพานลอยได้ครึ่งทาง หน้าอกแน่นเหมือนมีช้างนั่งทับ เหงื่อแตกทั้งที่ลมเย็น แม่ค้าข้างทางรีบเลื่อนเก้าอี้มาให้นั่ง"
    choices:
      - id: call_ambulance
        text: "เรียกรถพยาบาลทันที"
        outcomes:
          - {weight: 3, ok: true, multipliers: {stats: {health: 1.3}}, text: "ทำบอลลูนทันเวลา หมอบอกช้าอีกครึ่งชั่วโมงก็จบ", effects: {health: 1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}], next: midh_heart_after_01}
          - {weight: 1, text: "แค่กรดไหลย้อน แต่ค่ารถพยาบาลกับความอายอยู่ไปอีกนาน", effects: {happiness: -1, money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bus_home
        text: "นั่งพักแล้วนั่งรถเมล์กลับบ้าน"
        outcomes:
          - {weight: 2, text: "อาการหายไปเอง แต่หัวใจจำครั้งนี้ไว้", effects: {chronic: {health: -1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตีสามคืนนั้นหัวใจวาย คนข้างบ้านหามขึ้นรถไปส่ง รพ.", effects: {health: -3, relations: 1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: massage_shop
        text: "แวะร้านนวดกดจุดปากซอย"
        outcomes:
          - {weight: 1, ok: true, text: "หมอนวดเคยเป็นพยาบาล ดูอาการแล้วโบกแท็กซี่ส่ง รพ. ให้เอง", effects: {health: 1, relations: 1}, merit: [{cat: neutral}], multipliers: {karma: 1.5}}
          - {weight: 2, text: "นวดได้ห้านาที หน้ามืดล้มลงบนเตียงนวด", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bike_life
        text: "เลิกของทอด ปั่นจักรยานทุกเช้า"
        effects: {health: 2, happiness: -1, chronic: {health: 1}}
        clears_flags: [smoker]
        sets_flags: [sporty]
        merit: [{cat: neutral}]

  - id: midh_kidney_stone_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    repeat: {gap: 5, max: 2}
    multipliers: {flags: {sporty: 0.7, heavy_drinker: 1.3}, occupation: {labor: 1.4, farmer: 1.3, factory: 1.3}}
    title: "นิ่วเม็ดเท่าเมล็ดถั่ว"
    text: "ปวดเอวร้าวลงขาหนีบจนต้องนอนบิดตัวบนพื้นห้องน้ำ ฉี่ออกมาเป็นสีชมพู ฟิล์มเอกซเรย์เห็นเม็ดขาว ๆ ขนาดเมล็ดถั่วนอนอยู่ในท่อไต"
    choices:
      - id: shockwave
        text: "สลายนิ่วด้วยคลื่นที่ รพ.เอกชน"
        requires: {money: {unit: income_x, amount: 1}, reason: "เงินเก็บไม่พอค่า รพ.เอกชน"}
        effects: {health: 2, money: {unit: income_x, amount: -1}}
        merit: [{cat: neutral}]
      - id: drink_water
        text: "ดื่มน้ำวันละสี่ลิตร รอให้หลุด"
        outcomes:
          - {weight: 2, ok: true, text: "เม็ดหลุดออกมาดังกริ๊ง เก็บใส่ขวดโชว์แขกทุกคนที่มาบ้าน", effects: {health: 1, happiness: 2}, merit: [{cat: neutral}], multipliers: {stats: {health: 2}}}
          - {weight: 2, text: "ไม่ยอมหลุด ไตบวมจนต้องใส่สายระบาย", effects: {health: -2, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: neighbor_brew
        text: "ต้มน้ำใบไม้ตามสูตรป้าข้างบ้าน"
        outcomes:
          - {weight: 1, text: "ไม่หายแต่ได้เพื่อนคุยทุกเย็น ป้าเลยกลายเป็นคนสนิท", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ขมจนอาเจียน แล้วก็ยังปวดเอวเท่าเดิม", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: work_through
        text: "ทนปวด ไปปิดงานใหญ่ให้จบ"
        outcomes:
          - {weight: 1, ok: true, text: "ปิดงานได้ทันกำหนด คนจ้างเห็นความอึดเลยขึ้นค่าตัวให้", effects: {health: -1, income_mult: 1.2}, merit: [{cat: neutral}], multipliers: {stats: {health: 1.5}}}
          - {weight: 2, text: "เป็นลมกลางที่ทำงาน งานไม่จบ นิ่วก็ยังอยู่", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: share_room
        text: "รอคิวส่องกล้องฟรีที่ รพ.รัฐ"
        outcomes:
          - {weight: 2, ok: true, text: "นอนห้องรวมรอคิวสองอาทิตย์ ส่องกล้องเอานิ่วออกฟรี ได้เพื่อนร่วมห้องสามคน", effects: {health: 1, relations: 2}, merit: [{cat: neutral}], multipliers: {stats: {health: 1.3}, karma: 1.5}}
          - {weight: 1, text: "ห้องรวมแออัด ติดหวัดคนเตียงข้าง ๆ คิวส่องกล้องเลื่อนอีกเดือน", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: midh_liver_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    when: {flags: {has: [heavy_drinker]}}
    multipliers: {flags: {sporty: 0.8}, occupation: {labor: 1.2, craft: 1.2}}
    title: "ค่าตับพุ่งสามเท่า"
    text: "ผลเลือดค่าตับพุ่งสามเท่า หมออัลตราซาวนด์ท้องเสร็จแล้วถามคำเดียว ดื่มวันละกี่ขวด คนทั้งวงเหล้าก็โทรมาชวนคืนนี้พอดี"
    choices:
      - id: quit_drink
        text: "เลิกเหล้าเด็ดขาดตั้งแต่วันนี้"
        effects: {health: 1, happiness: -1, relations: 1, chronic: {health: 1}}
        clears_flags: [heavy_drinker]
        merit: [{cat: sila, level: 1}]
      - id: weekends_only
        text: "ลดเหลือแค่วันหยุด"
        outcomes:
          - {weight: 1, ok: true, text: "ทำได้จริง ค่าตับลดลงครึ่งหนึ่งในสามเดือน", effects: {health: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "วันหยุดของวงเหล้ามีทุกวัน", effects: {health: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: drink_on
        text: "ชีวิตสั้นแต่สนุก ไปวงคืนนี้"
        effects: {health: -2, happiness: 2, relations: 1, chronic: {health: -1}}
        merit: [{cat: intoxicants, level: 1}]
      - id: ordain_break
        text: "เข้าวัดถือศีลสามเดือน ตัดวงเหล้า"
        effects: {health: 2, happiness: -1, relations: -1, money: {unit: income_x, amount: -0.5}}
        clears_flags: [heavy_drinker]
        merit: [{cat: sila, level: 2}]

  - id: midh_insurance_claim_01
    type: A
    category: health
    stage: กลางคน
    years: [2500, 2650]
    weight: 2
    when: {flags: {has: [has_insurance]}}
    multipliers: {flags: {smoker: 1.5, heavy_drinker: 1.5}}
    title: "กรมธรรม์ในลิ้นชัก"
    text: "ส่องกล้องเจอติ่งเนื้อในลำไส้ หมอขอตัดไปตรวจ ตัวแทนประกันที่หายไปสิบปีโทรมาถามข่าวภายในชั่วโมงเดียว"
    choices:
      - id: full_claim
        text: "เคลมเต็มสิทธิ์ ห้องเดี่ยววิวสวน"
        outcomes:
          - {weight: 3, ok: true, text: "ประกันจ่ายครบทุกบาท ตัดติ่งเนื้อออก ผลเป็นแค่เนื้อดี", effects: {health: 2, happiness: 1}, merit: [{cat: neutral}], multipliers: {stats: {relations: 1.3}}}
          - {weight: 1, text: "บริษัทอ้างว่าเป็นมาก่อนทำสัญญา ต้องสำรองจ่ายเองแล้วสู้เรื่องอีกปี", effects: {health: 1, happiness: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: gold_card_save
        text: "ใช้สิทธิ์ รพ.รัฐ เก็บวงเงินไว้"
        outcomes:
          - {weight: 2, ok: true, text: "รักษาครบไม่เสียสักบาท วงเงินประกันยังเหลือเต็ม", effects: {health: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คิวยาวสี่เดือน ติ่งเนื้อไม่รอใคร", effects: {health: -1, chronic: {health: -1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: daily_payout
        text: "นอนยาว รับเงินชดเชยรายวัน"
        outcomes:
          - {weight: 2, ok: true, multipliers: {stats: {health: 1.3}}, text: "นอนดูซีรีส์จบสามเรื่อง ได้เงินชดเชยมากกว่าเงินเดือน", effects: {happiness: 1, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "นอนนานจนขาลีบ ต้องทำกายภาพอีกสองเดือน", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: skip_scope
        text: "ไม่ตัด กลัวเจ็บ ขอดูอาการ"
        outcomes:
          - {weight: 2, ok: true, text: "ติ่งเนื้อไม่โตเลยตลอดห้าปี ดวงดีเกินคาด", effects: {happiness: 1}, merit: [{cat: neutral}], multipliers: {karma: 1.5}}
          - {weight: 1, text: "ปีถัดมากลายเป็นมะเร็งระยะสอง", effects: {health: -3, chronic: {health: -1}}, merit: [{cat: neutral}]}
