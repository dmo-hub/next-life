# ร่างเรื่อง คนถีบสามล้อรับจ้าง · 15 ใบ · ลงเกมแล้ว ใบ 316 · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นเด็กนั่งเบาะหลัง คนช่วยญาติเช็ดเบาะ ผู้โดยสาร เพื่อนคนถีบ ลูกค้าประจำ เสมอ · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี · ไม่เปลี่ยนสายชีวิต
events:
  - id: samlor_backseat_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [5, 10]}
    title: "เบาะหลังสามล้อไปตลาด"
    text: "ป้าข้างบ้านพาคุณติดสามล้อไปตลาดเช้า คุณนั่งเบียดตะกร้าอยู่บนเบาะหวายข้างป้า ประทุนผ้าใบกางบังแดดอยู่เหนือหัว ที่แฮนด์ของลุงคนถีบมีกระดิ่งห้อยอยู่หนึ่งลูก คุณอยากรู้ไปหมดว่าประทุนพับเก็บได้ไหม และกระดิ่งนั่นต้องบีบตอนไหน"
    choices:
      - id: samlor_kid_ask_canvas
        text: "ถามลุงว่าประทุนพับยังไง"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: samlor_kid_hold_basket
        text: "กอดตะกร้าของป้าไว้ไม่ให้ล้ม"
        effects: {relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_kid_count_houses
        text: "นับบ้านที่ผ่านทีละหลัง"
        effects: {knowledge: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: samlor_kid_nap
        text: "เอนหลังหลับไปกับลมเย็น"
        effects: {health: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - id: samlor_kid_ring_bell
        text: "ขอบีบกระดิ่งแทนลุง"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงยื่นกระดิ่งให้ คุณบีบทุกครั้งที่ผ่านหน้าบ้านคน คนในซอยโบกมือตอบกันทั้งแถว ป้าบอกว่าวันนี้ไปตลาดเหมือนแห่ขบวน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณบีบรัวจนหมาข้างทางวิ่งเห่าตามมาสามบ้าน ลุงยิ้มแห้งแล้วขอกระดิ่งคืนอย่างสุภาพ", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: samlor_wipe_seat_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 16]}
    title: "ช่วยลุงเช็ดเบาะปิดเทอม"
    text: "ปิดเทอมนี้คุณรับหน้าที่เช็ดสามล้อให้ลุงซึ่งเป็นญาติ ก่อนแกออกไปรับขาประจำ เบาะหวายมีฝุ่นติดซอก ประทุนผ้าใบชุ่มน้ำค้าง ลุงบอกว่าเสร็จแล้วจะให้ค่าขนม แต่แกออกจากบ้านตั้งแต่ฟ้ายังไม่สาง"
    choices:
      - id: samlor_wipe_wake_early
        text: "ตื่นก่อนฟ้าสางมาเช็ดให้ทัน"
        effects: {health: -1, relations: 2, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_wipe_night_before
        text: "เช็ดไว้ตั้งแต่หัวค่ำแทน"
        effects: {knowledge: 1, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: neutral}]
      - id: samlor_wipe_ask_more
        text: "ขอค่าขนมเพิ่มเพราะตื่นเช้า"
        effects: {money: {unit: income_x, amount: 0.01}, relations: -1}
        merit: [{cat: neutral}]
      - id: samlor_wipe_learn_canvas
        text: "ขอให้ลุงสอนพับประทุน"
        effects: {knowledge: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: samlor_wipe_polish_shine
        text: "ขัดเบาะจนขึ้นเงาวับ"
        outcomes:
          - {weight: 1, ok: true, text: "เบาะเงาจนลูกค้าประจำทักว่าเปลี่ยนรถใหม่หรือ ลุงยืดอกบอกว่าหลานทำ แล้วแถมค่าขนมให้อีกเท่าตัว", effects: {happiness: 2, money: {unit: income_x, amount: 0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เบาะลื่นเกินไป ลูกค้าคนแรกเลื่อนไถลจนต้องจับขอบประทุนไว้ทั้งทาง ลุงกลับมาพร้อมผ้าแห้งผืนใหม่ให้คุณเช็ดออก", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: samlor_rain_queue_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [15, 18]}
    title: "ฝนตก คนรอสามล้อเต็มศาลา"
    text: "ฝนตกหนักตอนตลาดวาย แม่ค้ากับเด็กนักเรียนยืนรอสามล้อกันเต็มศาลาริมทาง ลุงที่เป็นญาติฝากให้คุณช่วยดูคิวระหว่างลุงไปส่งเที่ยวแรก ทุกคนบอกว่าตัวเองมาก่อน และกระสอบผักของแม่ค้าก็ไม่มีใครยอมยกหลบ"
    choices:
      - id: samlor_rain_elders_first
        text: "ให้ผู้สูงอายุกับเด็กเล็กขึ้นก่อน"
        effects: {relations: 2, network: 1}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_rain_write_list
        text: "จดชื่อตามลำดับที่เห็นมาถึง"
        effects: {knowledge: 2, relations: -1}
        merit: [{cat: neutral}]
      - id: samlor_rain_carry_sacks
        text: "ช่วยยกกระสอบผักขึ้นรถให้"
        effects: {health: -1, relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_rain_hide
        text: "หลบเข้าร้านกาแฟรอฝนหยุด"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: samlor_rain_by_destination
        text: "ให้คนไปทางเดียวกันขึ้นคันเดียว"
        outcomes:
          - {weight: 1, ok: true, text: "คนไปทางเดียวกันได้นั่งรถคันเดียวกัน ศาลาโล่งเร็วกว่าทุกวัน ลุงกลับมาเห็นแล้วถามว่าใครสอน", effects: {happiness: 2, network: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทุกคนบอกว่าบ้านตัวเองอยู่ทางเดียวกันหมด รถคันแรกมีคนสามคนกับกระสอบสองใบ ลุงต้องลงจูงไปทั้งทาง", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: samlor_try_pedal_01
    type: A
    category: health
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ขอลองถีบดูสักรอบ"
    text: "คุณนั่งสามล้อกลับบ้านแล้วนึกสนุก ขอลุงคนถีบสลับที่ลองถีบดูบ้างตรงลานโล่งหน้าวัด ลุงหัวเราะแล้วลงไปนั่งเบาะแทน บอกว่าเชิญเลย ถีบเป็นแล้วจะได้รู้ คุณจับแฮนด์ปุ๊บ รถก็เริ่มเลี้ยวไปทางซ้ายเอง"
    choices:
      - id: samlor_pedal_lean_right
        text: "เอียงตัวสู้ไปทางขวา"
        outcomes:
          - {weight: 1, ok: true, text: "รถค่อย ๆ ตรงทาง คุณถีบได้ครบรอบลาน ลุงปรบมือบนเบาะแล้วบอกว่ารอบหน้าคิดค่าโดยสารคุณแทน", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถวนเป็นวงกลมกลางลานช้า ๆ สามรอบเต็ม เด็กวัดมายืนดูแล้วปรบมือทุกรอบที่คุณผ่าน", effects: {happiness: 1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: samlor_pedal_ask_trick
        text: "ถามลุงว่ามีเคล็ดอะไร"
        effects: {knowledge: 2, relations: 1}
        merit: [{cat: neutral}]
      - id: samlor_pedal_walk_it
        text: "ลงจูงรถเดินรอบลานแทน"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: samlor_pedal_give_back
        text: "ยอมแพ้ คืนที่นั่งให้ลุง"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: samlor_pedal_tip
        text: "ถีบไม่ไหว จ่ายค่าเหนื่อยลุงเพิ่ม"
        effects: {relations: 2, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]

  - id: samlor_two_bags_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "สองคนกับถุงอีกหกใบ"
    text: "คุณกับเพื่อนตัวโตเพิ่งกินเลี้ยงเสร็จ ถือถุงของฝากมาอีกคนละสามใบ ลุงคนถีบมองทั้งคู่ตั้งแต่หัวจรดเท้า แล้วบอกว่ารับได้สองคน แต่ก็แล้วแต่น้ำหนักนะ พอเพื่อนก้าวขึ้นไปก่อน เบาะหวายแอ่นลงจนได้ยินเสียงดังเอี๊ยด"
    choices:
      - id: samlor_bags_two_rides
        text: "แยกเรียกสองคัน"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: samlor_bags_walk_home
        text: "ฝากของไว้กับลุง แล้วเดินตาม"
        effects: {health: 1, happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: samlor_bags_balance
        text: "ช่วยลุงจัดถุงให้รถไม่เอียง"
        effects: {knowledge: 1, relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_bags_pay_more
        text: "ขอขึ้นทั้งคู่ จ่ายเพิ่มให้"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: samlor_bags_breathe_in
        text: "แขม่วพุงพร้อมกันแล้วขึ้น"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งคู่แขม่วจนลุงถีบออกตัวได้ ถึงบ้านแล้วค่อยหายใจออกพร้อมกัน ลุงหัวเราะจนต้องจอดพักหน้าประตู", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}], next: samlor_after_ya_01}
          - {weight: 1, text: "แขม่วได้ถึงหัวมุมแรก เพื่อนหัวเราะออกมาก่อน เบาะแอ่นลงอีกนิด ลุงขอให้ลงเดินช่วงทางลาดทั้งคู่", effects: {happiness: 1, health: -1}, merit: [{cat: neutral}], next: samlor_after_ya_01}
        merit: [{cat: neutral}]

  - id: samlor_haggle_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [20, 30]}
    title: "ต่อราคาริมทาง"
    text: "คุณจะไปบ้านเพื่อนที่อยู่ระหว่างตลาดกับโรงพยาบาล ลุงคนถีบบอกว่าราคาตายตัว ไปตลาดราคาหนึ่ง ไปโรงพยาบาลอีกราคา ตรงกลางไม่มีในตาราง คุณยืนต่อราคากันริมทางจนลุงอีกคันที่จอดข้าง ๆ เริ่มเข้ามาช่วยคิด"
    choices:
      - id: samlor_haggle_market_walk
        text: "จ่ายราคาตลาด แล้วเดินต่อเอง"
        effects: {health: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: samlor_haggle_full_price
        text: "จ่ายราคาโรงพยาบาลไปเลย"
        effects: {relations: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: samlor_haggle_halfway
        text: "เสนอราคากลางระหว่างสองที่"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงทั้งสองคันพยักหน้าพร้อมกัน ตั้งชื่อปลายทางใหม่ว่าบ้านเพื่อนคุณ แล้วจดเพิ่มลงตารางราคาในใจ", effects: {happiness: 2, network: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงสองคันเถียงกันเองว่าบ้านเพื่อนคุณใกล้ตลาดหรือใกล้โรงพยาบาลมากกว่า คุณยืนรอจนเพื่อนเดินมารับเอง", effects: {happiness: 1, health: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: samlor_haggle_ask_friend
        text: "ถามว่าปกติเพื่อนจ่ายเท่าไร"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: samlor_haggle_other_rider
        text: "หันไปถามราคาลุงคันข้าง ๆ"
        effects: {network: 1, relations: -1, knowledge: 1}
        merit: [{cat: neutral}]

  - id: samlor_full_load_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [21, 30]}
    title: "ย้ายห้องด้วยสามล้อคันเดียว"
    text: "คุณย้ายห้องเช่าไปอยู่อีกฝั่งตลาด ของมีที่นอนหนึ่งผืน หม้อสองใบ กับกล่องหนังสือที่หนักกว่าที่คิด ลุงคนถีบดูกองของแล้วบอกว่าถ้าเต็มคันคิดอีกราคา ไม่ใช่ราคาคนนั่ง ส่วนคุณจะนั่งตรงไหนก็ยังไม่มีใครรู้"
    choices:
      - id: samlor_load_two_trips
        text: "แบ่งขนสองเที่ยว"
        effects: {knowledge: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: samlor_load_walk_beside
        text: "จ่ายราคาเต็มคัน แล้วเดินข้างรถ"
        effects: {health: -1, relations: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: samlor_load_give_books
        text: "ยกหนังสือให้ห้องสมุดวัดไปบางส่วน"
        effects: {happiness: 1, knowledge: -1, network: 1}
        merit: [{cat: neutral}]
      - id: samlor_load_tie_rope
        text: "ช่วยลุงมัดเชือกให้แน่นหนา"
        effects: {knowledge: 1, relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_load_parade
        text: "ขอให้ลุงถีบรอบตลาดอวดของสักรอบ"
        outcomes:
          - {weight: 1, ok: true, text: "คุณเดินนำข้างรถไปรอบตลาด คนขายของเห็นกองของแล้วตามมาช่วยยกขึ้นห้องใหม่ถึงสามคน ยังไม่ทันแกะกล่องคุณก็รู้จักคนครึ่งซอยแล้ว", effects: {happiness: 2, network: 2, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}], next: samlor_after_ya_01}
          - {weight: 1, text: "รอบตลาดยาวกว่าที่คิด ช้อนหล่นจากกล่องไปหนึ่งคัน แม่ค้าเก็บมาคืนถึงหน้าห้อง ลุงขอค่ารอบตลาดเพิ่มอีกนิดอย่างเกรงใจ", effects: {happiness: 1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}], next: samlor_after_ya_01}
        merit: [{cat: neutral}]

  - id: samlor_wait_market_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "ลุงรออยู่หน้าตลาด"
    text: "คุณไปตลาดซื้อของเข้าบ้าน จ้างสามล้อคันประจำไว้ ลุงบอกว่าไม่ต้องรีบ เดี๋ยวรอ ตอนนี้คุณเดินมาเกือบชั่วโมงแล้ว ของในมือยังขาดอีกสามอย่าง และลุงจอดตากแดดอยู่หน้าตลาดตรงที่ไม่มีร่มไม้สักต้น"
    choices:
      - id: samlor_wait_rush
        text: "ตัดของที่เหลือทิ้ง รีบกลับไป"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: samlor_wait_cold_drink
        text: "ซื้อน้ำเย็นไปให้ลุงก่อน"
        effects: {relations: 2, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: help_others, level: 1}]
      - id: samlor_wait_list_next
        text: "จดรายการให้สั้นลงคราวหน้า"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: samlor_wait_pay_extra
        text: "ให้ค่ารอเพิ่มตอนลงรถ"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}, happiness: 1}
        merit: [{cat: neutral}]
      - id: samlor_wait_one_more_shop
