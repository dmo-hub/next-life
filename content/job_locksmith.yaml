          - {weight: 1, text: "ลุงถือเทียบจนเพลินแล้วแขวนคืนผิดพวง คุณนั่งไล่หาว่าอันไหนมาจากตะขอไหนจนน้ากลับมาถึง", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: locksmith_spare_lost_01
