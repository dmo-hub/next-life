        merit: [{cat: neutral}]

  - id: locksmith_two_am_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [21, 30]}
    title: "ประตูงับปิดตอนตีสอง"
    text: "กลับถึงห้องแถวที่เช่าอยู่ตอนตีสอง ประตูงับปิดตามหลังทั้งที่กุญแจวางอยู่บนโต๊ะด้านใน ช่างทำกุญแจปากซอยพักอยู่หลังแผงตัวเอง ไฟยังเปิดอยู่ แต่จะไปเคาะตอนนี้ก็เกรงใจ และค่าเรียกตอนตีสองคงไม่ใช่ราคากลางวัน"
