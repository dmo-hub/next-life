      - id: locksmith_twoam_knock
        text: "ไปเคาะเรียกช่างปากซอย"
        effects: {happiness: 1, network: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: locksmith_twoam_friend
        text: "ไปขอนอนห้องเพื่อนรอเช้า"
        effects: {relations: 1, health: -1}
        merit: [{cat: neutral}]
