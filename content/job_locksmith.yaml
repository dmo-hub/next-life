        effects: {health: -2, knowledge: 1}
        merit: [{cat: neutral}]
      - id: locksmith_twoam_walk_round
        text: "เดินอ้อมไปส่องหน้าต่างก่อน"
        outcomes:
          - {weight: 1, ok: true, text: "ส่องผ่านช่องหน้าต่างเห็นกุญแจนอนอยู่บนโต๊ะจริง ๆ คุณยืนมองมันอยู่พักใหญ่ แล้วไปเคาะช่างปากซอยด้วยสีหน้าสำนึกผิด ช่างหัวเราะแล้วคิดราคาให้เบากว่าที่กลัว", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}], next: locksmith_after_ya_01}
          - {weight: 1, text: "ส่องจนคอเคล็ดก็ไม่เห็นอะไรนอกจากความมืด คุณเดินวนรอบตึกตอนตีสามครึ่ง ก่อนกลับไปเคาะช่างอยู่ดี", effects: {happiness: -1, health: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}], next: locksmith_after_ya_01}
        merit: [{cat: neutral}]
      - id: locksmith_twoam_bring_snack
        text: "แบ่งขนมในกระเป๋าไปฝากช่าง"
        effects: {relations: 1, network: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]

  - id: locksmith_bent_key_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "กุญแจงอไปนิดเดียว"
    text: "ประตูห้องไขฝืดมาหลายวัน คุณหิ้วกุญแจไปแผงปากซอยจะขอซื้อตัวล็อกใหม่ทั้งชุด ช่างหยิบกุญแจของคุณขึ้นส่องกับแดด บอกว่าตัวล็อกไม่เป็นอะไร กุญแจดอกนี้งอไปนิดเดียว ทำดอกใหม่ก็จบ ถูกกว่าเปลี่ยนทั้งชุดหลายเท่า"
    choices:
      - id: locksmith_bent_new_copy
        text: "ทำดอกใหม่ตามที่ช่างบอก"
        effects: {happiness: 1, knowledge: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: locksmith_bent_full_set
        text: "ขอเปลี่ยนทั้งชุดให้สบายใจ"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: locksmith_bent_ask_how
        text: "ถามว่ามันงอไปได้ยังไง"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: locksmith_bent_tell_friend
        text: "ไปบอกเพื่อนที่ประตูฝืดเหมือนกัน"
        effects: {network: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: locksmith_bent_straighten
        text: "ขอดัดดอกเดิมให้ตรงเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ดัดบนโต๊ะช่างจนดูตรงดี ไขลื่นอยู่สองอาทิตย์เต็ม แล้วคุณก็กลับมาทำดอกใหม่ที่แผงเดิมอยู่ดี", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ออกแรงดัดไปหน่อยจนหักคามือ ช่างหยิบครึ่งที่เหลือมาทำดอกใหม่ให้โดยไม่พูดอะไร แต่ยิ้มอยู่นานมาก", effects: {happiness: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

