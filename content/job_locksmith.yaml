# ร่างเรื่อง ช่างทำกุญแจ/ซ่อมกุญแจหน้าร้านหรือแผงริมทาง · 15 ใบ · ลงเกมแล้ว ใบ 316 · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นเด็กยืนดู คนช่วยญาติเรียงดอกเปล่า ลูกค้า เพื่อนบ้าน หรือเพื่อนของช่าง เสมอ · ไม่ยัดอาชีพให้ผู้เล่น · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี · ไม่มี effects job · ไม่มีเรื่องงัดแงะ กุญแจยานพาหนะ หรือวิธีไขเป็นขั้นตอน
events:
  - id: locksmith_grinder_watch_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [6, 12]}
    title: "เครื่องเจียรร้องวิ้ง"
    text: "แผงทำกุญแจใต้ต้นไม้ข้างโรงเรียนมีคนต่อคิว คุณยืนดูน้าช่างคีบกุญแจสองดอกเข้าเครื่อง ดอกเดิมไล่ไปตามร่อง ดอกเปล่าค่อย ๆ โดนกัดเป็นฟัน เสียงแหลมวิ้งจนขนลุก แล้วน้าถูตะไบลบคม น้าชี้เส้นชอล์กบนพื้นว่ายืนหลังเส้นนี้เท่านั้น"
    choices:
      - id: locksmith_kid_count_teeth
        text: "ยืนหลังเส้น นับฟันกุญแจ"
        effects: {knowledge: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: locksmith_kid_ask_why_teeth
        text: "ถามว่าทำไมกุญแจต้องมีฟัน"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: locksmith_kid_hold_bags
        text: "ช่วยถือถุงให้คนที่รอคิว"
        effects: {relations: 1, network: 1}
        merit: [{cat: help_others, level: 1}]
      - id: locksmith_kid_buy_water
        text: "วิ่งไปซื้อน้ำเย็นให้น้าช่าง"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: locksmith_kid_echo_whine
        text: "ทำเสียงวิ้งตามทุกครั้ง"
        outcomes:
          - {weight: 1, ok: true, text: "คนรอคิวหัวเราะกันทั้งแถว น้าช่างเลยให้คุณเป็นคนตะโกนเรียกคิวถัดไป คุณเรียกเสียงดังจนแม่ค้าร้านข้าง ๆ หันมาดู", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณวิ้งดังกว่าเครื่อง ป้าที่รออยู่สะดุ้งจนกุญแจหลุดมือกลิ้งเข้าใต้โต๊ะ น้าช่างส่งคุณไปนั่งเงียบ ๆ หลังแผง", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: locksmith_blank_board_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 18]}
    title: "ปิดเทอมเรียงดอกเปล่า"
