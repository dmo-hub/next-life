    choices:
      - id: locksmith_board_by_head
        text: "เรียงตามรูปหัว ทีละตะขอ"
        effects: {knowledge: 2, health: -1}
        merit: [{cat: neutral}]
      - id: locksmith_board_ask_best
        text: "ถามน้าว่าหัวแบบไหนขายดีสุด"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: locksmith_board_mind_stall
        text: "เฝ้าแผงให้น้าไปกินข้าว"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: locksmith_board_half_day
        text: "ขอทำครึ่งวันแล้วไปเที่ยว"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: locksmith_board_by_color
        text: "เรียงไล่สีให้กระดานดูสวย"
