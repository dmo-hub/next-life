          - {weight: 1, ok: true, text: "คนเดินผ่านหยุดดูกระดานกันเป็นแถว บางคนซื้อกุญแจคล้องติดมือไปด้วย น้าบอกว่าวันนี้ขายดีกว่าทุกวันในเดือน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระดานสวยมาก แต่น้าหาหัวที่ต้องใช้ไม่เจอสักอัน ทั้งบ่ายคุณกับน้าช่วยกันรื้อเรียงใหม่ตามรูปหัวเหมือนเดิม", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: locksmith_brass_or_cheap_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
