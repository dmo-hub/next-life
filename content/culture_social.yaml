# การ์ดวัฒนธรรมไทยชุด social (ใบ 216 จากร่าง 213)
events:
  # บอกเจ้าของตอนเลือก: กลุ่มท้าหรือแท็กต่อ (powder icebucket toplist idcard homefit) ควรเลือกไม่เกินสองหรือสามใบ powder toplist idcard มาจากหน้าเดียวกัน · กลุ่มส่งต่อตามจำนวนคน (chainmail blessing) อีกกลุ่ม · toplist กับ idcard เปลี่ยนการเปิดเรื่องไม่ขึ้นด้วยแท็กแล้ว
  # ใบฉากเฉพาะกั้น when แล้ว: freeze oldchat = occupation ออฟฟิศ · selfiestick chainmail = school · ยังไม่ได้วัดอัตราเจอใหม่
  # ที่มา https://www.thaipost.net/main/detail/95535 · ต้นทางเล่าย้อนวัยเด็ก ไม่ระบุปี
  # เติมแถวรีเสิร์ช: หน้าเดียวกันเล่าว่า ลงมือเขียนได้ไม่ถึง 10 ใบ รู้สึกขี้คร้าน เลยหยุดเขียน และโยนทิ้งขยะไป (เปิดหน้าซ้ำ 2026-11-06 เจอตามนี้) · ใช้เป็นตัวเลือก tear_it
  - id: social_chainmail_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [10, 12], school: [primary, lower]}
    title: "ไปรษณียบัตรคำขู่"
    text: "ไปรษณียบัตรใบหนึ่งส่งมาถึงคุณ บอกให้คัดลอกส่งต่อยี่สิบคน ข้อความส่งท้ายอ่านแล้วไม่อยากเข้าห้องน้ำคนเดียว ทุกใบต้องเขียนเองด้วยมือ และต้องเสียเงินส่งเองด้วย"
    choices:
      - id: copy_all
        text: "นั่งเขียนจนมือหงิก"
        effects: {knowledge: 1, happiness: -1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: tear_it
        text: "เขียนไม่ถึงสิบใบแล้วโยนทิ้ง"
        effects: {health: -1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: ask_teacher
        text: "เอาไปถามครูประจำชั้น"
        outcomes:
          - {weight: 1, ok: true, text: "ครูบอกว่าไม่มีอะไรเกิดขึ้นหรอก แล้วเล่าว่าตอนเด็กก็เคยเขียน", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูเตือนหน้าห้อง เพื่อนรู้ว่าใครเอาเรื่องไปฟ้อง", effects: {knowledge: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: edit_curse
        text: "แก้คำขู่เป็นให้แจกขนม"
        outcomes:
          - {weight: 1, ok: true, text: "มีเพื่อนเอาขนมมาให้จริง บอกว่ากันไว้ก่อน", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ลายมือคุณจำง่าย ครูเรียกไปคัดลายมือหลังเลิกเรียน", effects: {happiness: -1, knowledge: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://www.marketingoops.com/?p=29805 · ย้ายจากห้องเรียนวัยรุ่นมางานเลี้ยงรุ่นวัยทำงาน กันซ้ำ teen_viral_clip_01 · ตัดตัวเลือกชวนครูออก
  - id: social_danceclip_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "เพลงตัดเข้าบีท"
    text: "งานเลี้ยงรุ่นปีนี้มีคนอยากถ่ายคลิปแบบที่เคยฮิต เพื่อนคนหนึ่งเต้นอยู่คนเดียวข้างโต๊ะ ที่เหลือนั่งคีบกับข้าวตามปกติ พอเพลงตัดเข้าบีทหนัก ทุกคนต้องลุกเต้นสุดเหวี่ยง คนถือกล้องหันมาทางคุณ"
    choices:
      - id: dance_all
        text: "ลุกเต้นสุดเหวี่ยง"
        outcomes:
          - {weight: 2, ok: true, text: "คลิปวนในกลุ่มรุ่น เพื่อนที่ไม่ได้คุยกันนานทักมาหลายคน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพลงจบแล้ว ในคลิปเห็นคุณค้างท่าอยู่กลางร้าน หลังยังไม่ยอมกลับที่", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: keep_eating
        text: "คีบกับข้าวต่อ เอาจริง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: hold_camera
        text: "ขอถือกล้องแทนเขา"
        effects: {relations: 1, network: -1}
        merit: [{cat: neutral}]
      - id: invite_next_table
        text: "ชวนโต๊ะข้าง ๆ มาเต้นด้วย"
        outcomes:
          - {weight: 1, ok: true, text: "โต๊ะข้าง ๆ ลุกมาเต้นจริง เจ้าของร้านเปิดเพลงซ้ำให้อีกรอบ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "โต๊ะข้าง ๆ ไปฟ้องร้าน รุ่นคุณโดนเชิญออกก่อนของหวาน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://www.marketingoops.com/?p=53187
  - id: social_powder_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 30]}
    title: "ใครไม่กล้าถือว่าป่อด"
    text: "มิชชั่นส่งต่อรอบนี้คือประแป้งหน้าขาวแล้วโพสต์รูป เพื่อนแท็กชื่อคุณพร้อมคำว่า ใครไม่กล้าถือว่าป่อด คนที่คุณแอบชอบก็อยู่ในรายชื่อเพื่อนด้วย"
    choices:
      - id: do_it
        text: "ประแป้งโพสต์ตามกติกา"
        outcomes:
          - {weight: 1, ok: true, text: "คนที่แอบชอบกดหัวใจ คุณเปิดรูปตัวเองดูซ้ำจนดึก", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนที่แอบชอบกดหัวเราะ ไม่กดหัวใจ", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ignore_tag
        text: "ทำเป็นไม่เห็นแท็ก"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: tag_crush
        text: "ส่งต่อให้คนที่แอบชอบ"
        outcomes:
          - {weight: 1, ok: true, text: "เขาโพสต์หน้าขาวกลับมา แล้วพิมพ์ถามว่าพอใจยัง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาตอบว่าป่อดก็ได้ แล้วไม่ตอบอะไรอีกเลย", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: whole_can
        text: "เทหมดกระป๋องให้ขาวกว่าทุกคน"
        outcomes:
          - {weight: 1, ok: true, text: "หน้าขาวจนต้องวงรอบตาในรูป คนส่งต่อกันไม่หยุด", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แป้งเข้าจมูก จามจนเช้า กระป๋องนั้นที่บ้านเพิ่งซื้อมาใหม่", effects: {health: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://www.marketingoops.com/digital-life/17-creative-diy-selfie-stick/
  - id: social_selfiestick_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "ไม้เซลฟี่แพงขึ้นเรื่อย ๆ"
    text: "ไปทางไหนก็เห็นคนถือไม้เซลฟี่ พ่อค้าตลาดนัดเก็งกำไรจนราคาแพงขึ้นเรื่อย ๆ เพื่อนในห้องเริ่มมัดมือถือกับด้ามไม้กวาดแล้ว"
    choices:
      - id: pay_up
        text: "กัดฟันซื้อของจริง"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: diy_stick
        text: "ต่อเองจากด้ามไม้กวาด"
        outcomes:
          - {weight: 1, ok: true, text: "ถ่ายได้จริง เพื่อนต่อคิวขอยืม", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มัดไม่แน่น มือถือตกพื้นตอนกดถ่าย เพื่อนขำจนถ่ายไม่ทัน", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: long_arm
        text: "ใช้แขนเพื่อนตัวสูงแทน"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: resell
        text: "กว้านซื้อมาขายต่อในโรงเรียน"
        outcomes:
          - {weight: 1, ok: true, text: "ขายหมดเกลี้ยง ได้กำไรพอซื้อไม้ของตัวเอง เพื่อนเรียกเถ้าแก่", effects: {network: 1, money: {unit: income_x, amount: 0.1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เดือนถัดมาไม่มีใครถือไม้แล้ว ที่บ้านมีไม้เหลือห้าอัน", effects: {happiness: -1, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://marketeeronline.co/archives/48577
  - id: social_sticker_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 30], flags: {not: [married]}}
    title: "ทะเลาะกันด้วยสติกเกอร์"
    text: "แฟนพิมพ์มาสามย่อหน้าเรื่องเมื่อคืน คุณไม่อยากพิมพ์ยาว เลยกดสติกเกอร์ตัวการ์ตูนยกมือไหว้ ครู่เดียวอีกฝั่งส่งสติกเกอร์ยิ้มกลับมาตัวเดียว ไม่มีข้อความ"
    choices:
      - id: call_now
        text: "โทรไปคุยเลย"
        outcomes:
          - {weight: 2, ok: true, text: "คุยกันจนแบตหมด เรื่องเมื่อคืนจบ", effects: {relations: 2, happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปลายสายไม่รับ แล้วส่งสติกเกอร์ยิ้มมาอีกตัว", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: type_long
        text: "พิมพ์ตอบยาวเท่ากัน"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: read_quiet
        text: "กดอ่านแล้วเงียบ"
        effects: {relations: -1, happiness: 1}
        merit: [{cat: neutral}]
      - id: sorry_pack
        text: "ซื้อสติกเกอร์ชุดง้อโดยเฉพาะ"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวการ์ตูนคุกเข่าทุกแบบ อีกฝั่งหลุดขำ ยอมคุย", effects: {relations: 1, happiness: 1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แฟนตอบว่า งั้นไปคบกับตัวการ์ตูนเลย", effects: {relations: -2, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://thaipublica.org/2014/09/ice-bucket-challenge-lessons/ · ใช้เฉพาะพฤติกรรมท้ากันต่อ ไม่พาดพิงผู้ป่วยต้นเรื่อง
  - id: social_icebucket_01
    type: A
    category: health
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "น้ำแข็งถังสุดท้าย"
    text: "เพื่อนแท็กให้ราดน้ำแข็งแล้วท้าต่ออีกสามคน ทั้งที่กระแสจบไปแล้วเป็นเดือน คนอื่นเก็บถังกันหมด เหลือคุณที่ยังมีเวลาอีกวันตามกติกา"
    choices:
      - id: dump_all
        text: "ราดเต็มถังหน้าปากซอย"
        outcomes:
          - {weight: 2, ok: true, text: "ถ่ายเทคเดียวจบ เพื่อนกดหัวเราะกันยาว", effects: {happiness: 1, network: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เป็นไข้ไปหลายวัน คลิปมีคนดูสิบเอ็ดคน", effects: {health: -2, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: quiet_rice
        text: "ตั้งข้าวสารถุงเดียวหน้ากล้องแทน"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: pass_on
        text: "ไม่ราด แต่ท้าต่อคนอื่นไปเลย"
        effects: {network: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: warm_water
        text: "ใช้น้ำอุ่นแล้วร้องเหมือนหนาว"
        outcomes:
          - {weight: 1, ok: true, text: "แสดงเก่งจนเพื่อนเชื่อ มีคนถามว่าเล่นละครไหม", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระติกน้ำร้อนหลุดเข้าเฟรม เพื่อนซูมภาพส่งต่อกันไม่หยุด", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://www.marketingoops.com/?p=53187
  - id: social_toplist_01
    type: A
    category: study
    stage: กลางคน
    years: [2500, 2650]
    weight: 1
    when: {age: [46, 59]}
    title: "สิบหนังในดวงใจ"
    text: "ช่วงนี้มีแต่คนโพสต์สิบหนังในดวงใจ ลิสต์ของเพื่อนมีแต่หนังยาวสี่ชั่วโมง ลิสต์จริงของคุณมีแต่หนังผีกับหนังที่ดูเพราะแอร์เย็น เช้านี้มีคนท้ามาถึงชื่อคุณ"
    choices:
      - id: honest_list
        text: "โพสต์ลิสต์จริง หนังผีล้วน"
        outcomes:
          - {weight: 1, ok: true, text: "มีคนแอบทักมาว่าชอบเหมือนกัน แต่ไม่กล้าโพสต์", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนคอมเมนต์ว่าน่ารักดีนะ แล้วไม่มีใครท้าคุณอีก", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: copy_list
        text: "ก๊อปลิสต์คนอื่นให้ดูฉลาด"
        outcomes:
          - {weight: 1, ok: true, text: "ไม่มีใครจับได้ มีคนทักมาชวนคุยเรื่องหนังที่คุณไม่เคยดู", effects: {network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนถามถึงฉากจบ คุณตอบว่าชอบภาพ", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: watch_all
        text: "ดูให้ครบสิบเรื่องก่อนค่อยโพสต์"
        effects: {knowledge: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: tag_uncle
        text: "ท้าต่อไปที่ลุงในกลุ่มญาติ"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงโพสต์ลิสต์หนังเก่ายาวเหยียด พร้อมเล่าว่าดูโรงไหนกับใคร", effects: {knowledge: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงโทรมาถามว่าแท็กคืออะไร คุณอธิบายจนข้าวเย็น", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  # ที่มา https://www.marketingoops.com/?p=136575
  - id: social_freeze_01
    type: A
    category: work_money
    stage: หนุ่มสาว
