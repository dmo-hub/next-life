          - {weight: 1, text: "จามตอนกล้องมาถึงพอดี ทุกคนกลับไปเริ่มที่โต๊ะแรก", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: back_row
        text: "ขอไปยืนเป็นฉากหลัง"
        effects: {happiness: 1, network: -1}
        merit: [{cat: neutral}]
      - id: type_secret
