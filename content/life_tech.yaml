        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: fried_rice
        text: "โพสต์รูปข้าวผัดตัวเองกลบกระแส"
        outcomes:
          - {weight: 1, ok: true, text: "คนเลิกเถียงเรื่องงานแล้วแห่มาติว่าไข่ดาวไหม้ ยอดคอมเมนต์แซงโพสต์แรก", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มีคนแคปรูปข้าวผัดไปต่อท้ายว่าหนีประเด็น เรื่องยาวขึ้นอีกวัน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tech_group_dig_01
