  - id: tech_free_review_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2558, 2650]
    weight: 0.25
    when: {age: [46, 59], flags: {has: [own_business]}}
    title: "ขอลองก่อน แล้วจะรีวิวให้"
    text: "ร้านของคุณเพิ่งติดป้ายหน้าร้านได้สามเดือน ชายถือไม้กันสั่นเดินเข้ามา บอกว่ามีคนติดตามเป็นแสน ขอของในร้านไปลองฟรีหนึ่งชุดแล้วจะรีวิวให้ ถ้าไม่สะดวกเขาก็จะเขียนตามจริง"
    choices:
      - id: treat_free
        text: "ให้ฟรี เผื่อคนแห่มาจริง"
        outcomes:
          - {weight: 1, ok: true, text: "คลิปขึ้นจริง ยอดวิวไม่ถึงพัน แต่ป้าข้างร้านเห็นแล้วพาเพื่อนมาอุดหนุนสามคน", effects: {happiness: 1, money: {unit: income_x, amount: 0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สองอาทิตย์ไม่มีคลิป ไม้กันสั่นอันเดิมไปโผล่ที่ร้านฝั่งตรงข้าม", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: half_price
        text: "ลดครึ่งราคา แลกกับรีวิว"
        effects: {network: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: no_free
        text: "บอกว่าร้านนี้ไม่มีของฟรี"
        outcomes:
          - {weight: 1, ok: true, text: "เขาจ่ายครบแล้วเงียบหายไป ไม่มีรีวิวไหนตามมา", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คืนนั้นร้านได้หนึ่งดาว พร้อมรูปหน้าร้านที่ถ่ายจากมุมมืดที่สุด", effects: {happiness: -2, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: follower_discount
        text: "ลดให้ตามยอดคนติดตาม"
        outcomes:
          - {weight: 1, ok: true, text: "เปิดมาเจอคนติดตามสี่สิบสามคน คุณลดให้สี่สิบสามสตางค์ เขาหัวเราะแล้วจ่ายเต็มราคา", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยอดเป็นแสนจริง เขาถ่ายคลิปคุณนั่งกดเครื่องคิดเลข คนดูชอบแต่ร้านโดนแซวเรื่องงกไปทั้งเดือน", effects: {network: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

