events:
  - id: tech_sms_parcel_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2562, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "พัสดุตกค้าง กรุณาชำระ"
    text: "สั่งพัดลมตัวใหม่ไว้สามวันยังไม่มาส่ง ตอนเที่ยงข้อความเด้งเข้ามือถือ แจ้งว่าพัสดุของคุณตกค้างเพราะที่อยู่ไม่ครบ ให้กดลิงก์ยืนยันพร้อมจ่ายค่าส่งเพิ่มสิบเก้าบาท ชื่อผู้ส่งดูเหมือนบริษัทขนส่งจริงทุกตัวอักษร"
    choices:
      - id: tap_pay
        text: "กดลิงก์ จ่ายสิบเก้าบาทให้จบ"
        outcomes:
          - {weight: 1, text: "หน้าเว็บขอเลขบัตรครบทุกหลัก กรอกเสร็จไม่ถึงชั่วโมง ยอดในบัญชีหายไปก้อนหนึ่ง", effects: {happiness: -2, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กรอกถึงหน้าขอรหัสแล้วสะดุดใจ ปิดจอทัน แต่ต้องโทรอายัดบัตรทั้งบ่าย", effects: {happiness: -1, knowledge: 1}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: check_order
        text: "เปิดเลขพัสดุในร้านที่สั่งเอง"
        effects: {knowledge: 1}
        sets_flags: [scam_aware]
        merit: [{cat: neutral}]
      - id: wait_rider
        text: "ไม่กดอะไร รอคนส่งโทรมาเอง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: reply_elephant
        text: "ตอบกลับว่าพัสดุคือช้างหนึ่งเชือก"
        outcomes:
          - {weight: 1, ok: true, text: "อีกฝั่งเงียบหาย คุณแคปจอส่งเข้ากลุ่มเพื่อน ฮากันทั้งออฟฟิศ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เบอร์นั้นรู้แล้วว่าเบอร์คุณยังใช้อยู่ อาทิตย์นั้นข้อความแจ้งรางวัลเด้งมาวันละสามรอบ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tech_cheap_coat_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2558, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "เสื้อกันหนาวตัวละร้อย"
    text: "เลื่อนฟีดก่อนนอนเจอร้านขายเสื้อกันหนาวลดเก้าสิบเปอร์เซ็นต์ รีวิวห้าดาวเรียงยาว ทุกรีวิวเขียนว่าของดีมากค่ะเหมือนกันหมด แม่ค้าทักมาเองว่าเหลือสามตัวสุดท้าย โอนก่อนได้ราคานี้ เก็บเงินปลายทางไม่ได้"
    choices:
      - id: transfer
        text: "โอนเลย ของดีไม่รอใคร"
        outcomes:
          - {weight: 1, text: "สามอาทิตย์ต่อมาได้กล่องเปล่ากับผ้าเช็ดหน้าหนึ่งผืน หน้าร้านปิดไปแล้ว", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, ok: true, text: "ของมาจริง ตัวเล็กกว่าในรูปครึ่งหนึ่ง ใส่ได้แต่ยกแขนไม่ขึ้น", effects: {money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: cod_only
        text: "ขอเก็บเงินปลายทางเท่านั้น"
        outcomes:
          - {weight: 1, ok: true, text: "แม่ค้าไม่ตอบอีกเลย แล้วบล็อกคุณภายในห้านาที คุณรู้คำตอบโดยไม่ต้องจ่ายสักบาท", effects: {happiness: -1}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
          - {weight: 1, text: "แม่ค้ายอม ของมาส่งถึงบ้านจริง แต่เป็นคนละรุ่นกับในรูป บางจนลมพัดทะลุ", effects: {money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: search_name
        text: "เอาชื่อบัญชีไปค้นในเน็ตก่อน"
        outcomes:
          - {weight: 1, ok: true, text: "ค้นจนเลยเที่ยงคืน เจอชื่อบัญชีเดียวกันอยู่ในกลุ่มคนโดนโกงสิบกว่าโพสต์", effects: {knowledge: 1, health: -1}, sets_flags: [scam_aware], merit: [{cat: neutral}]}
          - {weight: 1, text: "ค้นทั้งคืนไม่เจออะไรเลย ตื่นมาเสื้อสามตัวสุดท้ายถูกขายหมดแล้ว", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: haggle_hat
        text: "ต่อเหลือห้าสิบ ขอแถมหมวกด้วย"
        outcomes:
          - {weight: 1, ok: true, text: "แม่ค้ายอมทันทีแถมถุงเท้าอีกคู่ ยิ่งง่ายยิ่งแปลก คุณเลยไม่โอน เก็บแชตไว้อ่านขำ", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แม่ค้ายอมจริง คุณใจอ่อนโอนห้าสิบ ได้รูปหมวกส่งกลับมาหนึ่งรูป ไม่มีหมวก", effects: {happiness: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: tech_post_viral_01
    type: A
    category: society
    stage: ทำงาน
    years: [2552, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "โพสต์ระบายที่ไปไกลเกินบ้าน"
    text: "เมื่อคืนคุณโพสต์เล่าว่าลูกค้าเรียกแก้งานตอนตีหนึ่ง ตั้งใจให้เพื่อนสิบกว่าคนอ่าน เช้านี้ยอดแชร์เกินสองหมื่น คนแปลกหน้าเข้ามาเถียงกันว่าคุณผิดหรือลูกค้าผิด บางคนเริ่มเดาชื่อบริษัทถูก"
    choices:
      - id: delete_post
        text: "ลบโพสต์ทิ้งทันที"
        effects: {happiness: 1, network: -1}
        merit: [{cat: neutral}]
      - id: explain_long
        text: "เขียนชี้แจงยาวสามหน้า"
        outcomes:
          - {weight: 1, ok: true, text: "คนส่วนใหญ่เข้าใจ มีบริษัทอื่นทักมาชวนคุยงาน", effects: {network: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ชี้แจงแล้วคนย้ายไปเถียงกันในโพสต์ใหม่ต่ออีกสามวัน", effects: {happiness: -2, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
