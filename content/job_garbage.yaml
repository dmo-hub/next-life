# ร่างเรื่อง พนักงานเก็บขนมูลฝอย คนงานรถขยะเทศบาล · 15 ใบ · ลงเกมแล้ว ใบ 319 · ผู้เล่นเป็นคนในซอย ญาติของพนักงาน เด็กยืนโบกมือ เสมอ ไม่สมมติอาชีพผู้เล่น · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี · ไม่เปลี่ยนสายชีวิต
events:
  - id: garbage_song_truck_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [5, 9]}
    title: "รถถังห้อยมาแล้ว"
    text: "ทุกเช้าวันเสาร์ รถคันใหญ่ที่มีถังกับกระสอบห้อยระโยงระยางท้ายรถจะเข้าซอยมา คุณเรียกมันว่ารถถังห้อยมาตั้งแต่จำความได้ เช้านี้น้าจูงมือมายืนรอหน้าบ้าน พี่ ๆ ที่ยืนท้ายรถหันมาทางคุณพอดี"
    choices:
      - id: garbage_kid_wave_both
        text: "โบกมือสองข้างสุดแขน"
        effects: {happiness: 2, relations: 1}
        merit: [{cat: neutral}]
      - id: garbage_kid_shout_hello
        text: "ตะโกนทักพี่ ๆ ทีละคนจนสุดซอย"
        outcomes:
          - {weight: 1, ok: true, text: "พี่ท้ายรถตะโกนตอบกลับทีละคน เด็กอีกสามบ้านวิ่งออกมาตะโกนด้วย เช้าวันเสาร์ของซอยครึกครื้นเหมือนงานวัด", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตะโกนเพลินจนน้าต้องวิ่งตามมาอุ้มกลับ เสียงแหบไปจนถึงข้าวเย็น และน้าก็หน้าแดงไปด้วย", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: garbage_kid_carry_bag
        text: "ช่วยน้าหิ้วถุงไปวางที่ถัง"
        effects: {relations: 1, health: 1}
        merit: [{cat: help_others, level: 1}]
      - id: garbage_kid_ask_bins
        text: "ถามน้าว่าทำไมท้ายรถห้อยถังเต็ม"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: garbage_kid_one_finger
        text: "หลบหลังขาน้า แอบยิ้มให้พี่ ๆ"
        effects: {happiness: 1}
        merit: [{cat: neutral}]

