          - {weight: 2, text: "ตรวจจนเหนื่อย ไม่เจออะไรเพิ่ม ประกันปฏิเสธบางรายการด้วย", effects: {health: -1, happiness: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
