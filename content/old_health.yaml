    text: "นอนโรงพยาบาลด้วยปอดอักเสบ ลูกค้นลิ้นชักเจอกรมธรรม์ที่จ่ายเบี้ยมาหลายสิบปี เจ้าหน้าที่ยิ้มกว้างแล้วถามว่าจะใช้วงเงินแบบไหน"
