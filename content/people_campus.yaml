          - {weight: 1, text: "ตัวเลขออกมาว่าต้องได้เอเก้าวิชาในเทอมที่ลงได้หกวิชา คุณเลยตักกับข้าวให้เขาเพิ่มแทนคำปลอบใจ", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
