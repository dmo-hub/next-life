    text: "รุ่นน้องคนหนึ่งมาดักรอหน้าห้องเรียน ขอยืมสมุดจดวิชาที่คุณผ่านมาแล้ว บอกว่าเหลือเวลาอ่านสามวัน สมุดเล่มนั้นคุณจดเองทุกหน้า มีทั้งเนื้อหา รูปวาดอาจารย์ และคำบ่นของตัวเองตอนตีสอง"
