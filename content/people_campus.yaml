    choices:
      - id: campus_tuition_pay
        text: "จ่ายเต็ม แล้วตัดของในบ้านแทน"
        effects: {money: {unit: income_x, amount: -1}, relations: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: campus_tuition_split
        text: "คุยกับลูกว่าจะแบ่งจ่ายกันยังไง"
        effects: {money: {unit: income_x, amount: -0.5}, relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: campus_tuition_borrow
        text: "ไปยืมญาติที่รู้ว่าจะโดนบ่น"
        effects: {money: {unit: income_x, amount: -0.2}, relations: -1, network: 1}
        merit: [{cat: neutral}]
      - id: campus_tuition_recount
        text: "บวกใหม่จนกว่าตัวเลขจะลดเอง"
        outcomes:
          - {weight: 1, ok: true, text: "รอบที่เจ็ดเจอว่าคุณบวกค่าหอซ้ำสองครั้งจริง ๆ ตัวเลขลดลงทันที ทั้งบ้านปรบมือให้เหมือนคุณหาเงินมาได้", effects: {happiness: 2, money: {unit: income_x, amount: 0.2}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บวกจนดินสอกุด ตัวเลขยังเท่าเดิมทุกรอบ ลูกมาเก็บจานแล้วบอกเบา ๆ ว่ากำหนดจ่ายคือวันพรุ่งนี้", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: campus_dorm_deposit_01
