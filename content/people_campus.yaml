    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [19, 20], school: [uni], flags: {has: ["exam_pass:uni"]}}
    title: "เพื่อนทั้งคณะในลานเดียว"
    text: "วันแรกเพื่อนทั้งคณะมาเจอกันในลานกิจกรรม คุณพยายามจดชื่อลงมือ เหงื่อลบไปครึ่งหนึ่ง ตอนนี้มีคนโบกมือเรียกคุณจากอีกฝั่งอย่างสนิทสนม คุณจำหน้าได้ แต่ชื่อในมือที่เหลืออยู่อ่านได้แค่ตัว ช"
    choices:
      - id: campus_mixup_wave
        text: "โบกกลับแล้วเรียกว่าเพื่อน"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: campus_mixup_confess
        text: "สารภาพว่าลืมชื่อ ขอฟังอีกรอบ"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: neutral}]
      - id: campus_mixup_book
        text: "ไปซื้อสมุดมาจดให้เป็นเรื่อง"
        effects: {knowledge: 1, network: 1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: campus_mixup_guess
        text: "เดาเลย คนชื่อขึ้นต้น ช มีเยอะ"
        outcomes:
          - {weight: 1, ok: true, text: "คุณตะโกนชื่อหนึ่งแล้วถูกเผง เขาซึ้งใจมากว่าคุณจำได้ เขาเลี้ยงน้ำคุณ และคุณยังไม่กล้าถามว่าเขานามสกุลอะไร", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนที่หันมาคือคนชื่อนั้นอีกคนหนึ่ง ส่วนคนที่โบกมือเดินหน้าเศร้ากลับไป วันนั้นคุณรู้จักเพื่อนเพิ่มหนึ่ง เสียไปหนึ่ง", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: campus_senior_notes_01
    type: A
    category: study
    stage: หนุ่มสาว
    years: [2500, 2650]
