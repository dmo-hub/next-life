    text: "รุ่นพี่บอกว่าใครไม่มารับน้องจะไม่ได้สิทธิ์บางอย่าง พอถามว่าสิทธิ์อะไร คำตอบเปลี่ยนไปทุกคนที่ถาม คนแรกบอกว่าเสื้อรุ่น คนที่สองบอกว่าชื่อในทำเนียบ คนที่สามบอกว่าถ้าเรียนจริงจะรู้เอง พรุ่งนี้นัดเจ็ดโมง"
    choices:
      - id: campus_skip_go_quiet
        text: "ไปแบบเงียบ ๆ อยู่แถวหลัง"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: campus_skip_half_day
        text: "ไปครึ่งวัน พอให้รู้จักเพื่อน"
        effects: {network: 1, health: -1}
        merit: [{cat: neutral}]
      - id: campus_skip_refuse
        text: "ไม่ไป และรับสายตาเพื่อนเอง"
        effects: {happiness: 1, network: -1, knowledge: 1}
