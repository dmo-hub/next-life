      - id: campus_notes_refuse
        text: "บอกให้ลองอ่านเองก่อน"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: campus_notes_tear_rant
        text: "ฉีกหน้าที่บ่นออกก่อนให้ยืม"
        outcomes:
          - {weight: 1, ok: true, text: "สมุดเหลือครึ่งเล่มแต่ชื่อเสียงคุณยังอยู่ครบ น้องสอบผ่านแล้วถือขนมมาคืนสมุด พร้อมถามว่าครึ่งที่หายไปออกสอบไหม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ฉีกผิดหน้า คำบ่นยังอยู่ครบ สูตรหายไปหมด น้องเอามาคืนแล้วบอกว่าได้รู้จักอาจารย์ในมุมที่ไม่เคยรู้มาก่อน", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
