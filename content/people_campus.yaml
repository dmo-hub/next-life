      - id: campus_skip_ask_written
        text: "ขอดูกฎที่เขียนเป็นลายลักษณ์"
        outcomes:
          - {weight: 1, ok: true, text: "ไม่มีใครหากฎเจอ เรื่องนี้ลามไปทั้งชั้นปี เพื่อนหลายคนถามตามคุณ สิทธิ์ลึกลับนั้นก็ค่อย ๆ เลิกถูกพูดถึง", effects: {knowledge: 1, network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รุ่นพี่ตอบว่าจะเอาไปเขียนให้ แล้วเรียกคุณว่าน้องลายลักษณ์จนจบปีสี่ ชื่อนี้ติดไปถึงทำเนียบรุ่น", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
