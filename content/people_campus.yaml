# ร่างเรื่อง ชีวิตรอบมหาวิทยาลัย · 15 ใบ · ลงเกมแล้ว ใบ 249 จากร่าง 248 · แก้ตามข้อค้านรอบ 1 · ไม่เปลี่ยนสถานะการเรียน ไม่ตั้งธง · ใบที่ผู้เล่นเคยเรียน/เรียนอยู่อ่าน exam_pass:uni · ไม่ผูกปี
events:
  - id: campus_reunion_skit_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45], flags: {has: ["exam_pass:uni"]}}
    title: "เลี้ยงรุ่นกับพี่ว๊ากคนเดิม"
    text: "งานเลี้ยงรุ่นคณะ พี่ที่เคยรับบทเสียงดังที่สุดตอนรับน้องเดินมานั่งข้างคุณ ตอนนี้พูดเบาจนต้องเอียงหูฟัง เขาสารภาพว่าวันนั้นจำบทไม่ได้ ต้องมีเพื่อนแอบบอกบทอยู่หลังเสา คนทั้งโต๊ะเริ่มเรียกร้องให้เล่นฉากเดิมอีกสักรอบ"
    choices:
      - id: campus_reunion_laugh
        text: "หัวเราะแล้วเล่าฉากของตัวเอง"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: campus_reunion_ask_why
        text: "ถามตรง ๆ ว่าทำไปเพื่ออะไร"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: campus_reunion_leave
        text: "ยิ้มให้แล้วขอตัวกลับก่อน"
        effects: {health: 1, network: -1}
        merit: [{cat: neutral}]
      - id: campus_reunion_swap_roles
        text: "ให้พี่เขาเป็นน้อง เล่นสลับบท"
        outcomes:
          - {weight: 1, ok: true, text: "คุณสั่งให้เขาท่องชื่อเพื่อนทั้งรุ่น เขาจำได้สามคน ทั้งงานหัวเราะจนลืมตักข้าว แล้วขอที่อยู่กันใหม่หมดทั้งโต๊ะ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณลืมบทตัวเองตั้งแต่ประโยคแรก พี่เขาบอกบทให้เสียงเบา ๆ ฉากจบลงแบบที่คนนั่งโต๊ะหลังไม่รู้ว่าเริ่มไปแล้ว", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: campus_reunion_chip_in
        text: "ชวนลงขันช่วยรุ่นน้องที่ขัดสน"
        effects: {money: {unit: income_x, amount: -0.2}, relations: 1, network: 1}
        merit: [{cat: dana, level: 1}]

  - id: campus_tuition_slip_01
