      - id: join
        text: "ตามคณะไปทั้งฤดู"
        sets_flags: [singer_troupe]
        effects: {happiness: 1, network: 1, relations: -1}
        schedules: [{event: singer_road_01, after_years: [1, 1]}, {event: singer_label_01, after_years: [2, 3]}]
        merit: [{cat: neutral}]
      - id: weekend
        text: "ขอไปแค่งานใกล้บ้าน"
