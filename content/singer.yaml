# สายหมอลำ/ลูกทุ่ง (ใบ 251 จากร่าง 212)
# ฐาน next-life origin/main 53bca785 · prefix singer_ (ผู้รวมงานยืนยันไม่ชน) · เปิดทุกเพศ ทุกฐานะ
# ไม่ใช้ engine ใหม่ · ไม่ใช้ fame (การ์ดยังอ่าน st.fame ไม่ได้) · ไต่ขั้นด้วยธง + นัดแบบนางงาม
# เจ้าของเลือก 2026-11-06: ลงครบ 14 ใบ · ใบประกวด weight 3 · ออกทุกปี · ใบประกวดวัยรุ่นเอียงตามธง singer_seed ×2
# ทางเข้า 3 ใบ (เด็ก วัยรุ่น หนุ่มสาว) → ได้ที่ → นัดเข้าคณะ → นัดเดินสาย + นัดค่าย → ติดหู → นัดค่าตัว/สัญญา
# ใบนัดล้วนไม่มี weight · เพดานอายุใบนัดกว้างกว่าใบต้นทาง เพราะนัดที่ when ไม่ผ่านตกเงียบ
# ปลายสายกระจายวัย (decisions 414): ทำงาน 3 ใบ กลางคน 1 ชรา 1
# ชุดบันเทิงใบ 213/216 เป็นมุมคนดู สายนี้เป็นมุมคนร้อง ไม่ซ้ำฉาก
events:
  - id: singer_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 3
    when: {age: [8, 12]}
    title: "ประกวดร้องเพลงเด็กงานวัด"
    text: "งานวัดปีนี้มีประกวดร้องเพลงเด็ก รางวัลที่หนึ่งเป็นถ้วยกับซองเงิน ป้าข้างบ้านได้ยินคุณร้องตอนกวาดลานบ้านทุกเช้า เลยเอาชื่อคุณไปลงไว้ให้แล้ว เหลือแค่เลือกเพลง"
    choices:
      - id: sing
        text: "ขึ้นร้องเพลงที่ร้องทุกเช้า"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {happiness: 1.3}}, text: "ได้ถ้วยใบแรก คนในงานจำชื่อคุณได้ ป้าข้างบ้านบอกทุกคนว่าเป็นคนส่ง", effects: {happiness: 2, network: 1}, sets_flags: [singer_seed], merit: [{cat: neutral}]}
          - {weight: 2, text: "ลืมเนื้อท่อนสอง แต่ร้องจนจบ คนดูปรบมือให้กำลังใจ", effects: {happiness: 1}, sets_flags: [singer_seed], merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: scared
        text: "ขอถอนชื่อ อายเกินไป"
        effects: {happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: front_row
        text: "นั่งดูแถวหน้าแทน"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: broom_mic
        text: "ถือไม้กวาดขึ้นเวทีแทนไมค์"
        sets_flags: [singer_seed]
        effects: {happiness: 1, network: 1}
        merit: [{cat: neutral}]

