# ร่างเรื่อง เกณฑ์ทหาร · 15 ใบ · แก้ตามข้อค้าน · มุมเพื่อน เพื่อนบ้าน ครอบครัว คนในหมู่บ้าน · ไม่อ่านและไม่ตั้งธง
events:
  - id: draftee_hair_rule_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2562, 2650]
    weight: 2
    when: {age: [15, 18], school: [upper, voc]}
    title: "ผมหน้าห้าเซนติเมตร"
    text: "ปีนี้เพื่อนที่เรียนวิชาทหารไว้ผมรองทรงสูงได้ ด้านหน้ายาวไม่เกินห้าเซนติเมตร เช้าวันฝึกเลยมีแถววัดผมด้านหน้ากันหลังห้องน้ำ เพื่อนคนหนึ่งยื่นไม้บรรทัดมาให้คุณ บอกว่ามือคุณนิ่งที่สุดในห้อง ช่วยดูทีว่ารอดไหม"
    choices:
      - id: draftee_hair_measure_true
        text: "วัดตามจริง บอกตามตรง"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: draftee_hair_trim_help
        text: "ขอกรรไกรมาเล็มให้พอดี"
        outcomes:
          - {weight: 1, ok: true, text: "เล็มไปนิดเดียวก็เข้าเกณฑ์ เพื่อนส่องกระจกแล้วบอกว่าหล่อขึ้น คุณเลยมีคนมาต่อคิวเพิ่มอีกสามหัว", effects: {relations: 2, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ข้างซ้ายสั้นกว่าข้างขวา เพื่อนต้องเดินเอียงคอไปทั้งเช้า และเลิกเรียกคุณว่ามือนิ่ง", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: draftee_hair_stay_out
        text: "คืนไม้บรรทัด ไม่ขอยุ่ง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: draftee_hair_ask_rule
        text: "ถามว่าวัดจากตรงไหนถึงตรงไหน"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: draftee_hair_wet_comb
        text: "แนะให้หวีเปียก จะดูสั้นลง"
        outcomes:
          - {weight: 1, ok: true, text: "หัวแนบลงไปจนผ่านฉลุย เพื่อนยกให้คุณเป็นที่ปรึกษาประจำแถว แล้วไปยืมหวีกันทั้งห้อง", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูฝึกเดินมาพอดี ยืนมองน้ำหยดจากผมหน้าอยู่นาน แล้วถามว่าฝนตกเฉพาะหัวเธอหรือ", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_bike_shop_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [16, 18], school: [upper, voc]}
    title: "ร้านซ่อมที่ขาดคนไปหนึ่ง"
    text: "พี่ชายของเพื่อนร่วมห้องจับได้ใบแดงเมื่อเดือนก่อน ร้านซ่อมจักรยานของบ้านนั้นเลยเหลือคนทำไม่พอ เพื่อนรีบกลับบ้านทุกเย็น การบ้านส่งไม่ทันมาสามวิชาแล้ว เขาเดินมาขอลอกของคุณ ท่าทางเหนื่อยจนแทบไม่มีแรงอาย"
    choices:
      - id: draftee_bike_tutor
        text: "นั่งติวให้ตอนพักเที่ยง"
        effects: {relations: 2, knowledge: 1, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_bike_copy
        text: "ให้ลอกไปก่อนรอบนี้"
        outcomes:
          - {weight: 1, ok: true, text: "ส่งทันทุกวิชา เขาแบ่งยางในเก่ามาให้เป็นค่าตอบแทน คุณไม่รู้จะเอาไปทำอะไรแต่ก็รับไว้", effects: {relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลอกมาทั้งชื่อคุณด้วย ครูเรียกไปยืนคู่กันหน้าห้อง เขาหลับตาพึมพำว่าขอโทษ", effects: {relations: 1, knowledge: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: draftee_bike_shop_help
        text: "ไปช่วยที่ร้านหลังเลิกเรียน"
        effects: {relations: 2, knowledge: 1, health: -1, network: 1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_bike_tell_teacher
        text: "บอกครูให้เข้าใจเรื่องที่บ้าน"
        effects: {network: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_bike_spoke_trade
        text: "แลกการบ้านกับสอนเปลี่ยนซี่ล้อ"
        outcomes:
          - {weight: 1, ok: true, text: "สองเดือนต่อมาคุณเปลี่ยนซี่ล้อเป็น เพื่อนสอบผ่าน ทั้งคู่ต่างเชื่อว่าตัวเองได้กำไร", effects: {knowledge: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ล้อคันแรกที่คุณลงมือบิดเป็นรูปเลขแปด เจ้าของคันเดินจูงกลับบ้านพร้อมคำขอโทษจากทั้งร้าน", effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_first_table_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 24]}
    title: "ซองเอกสารอยู่ที่บ้าน"
    text: "เจ็ดโมงเช้า คุณมาเป็นเพื่อนคนสนิทในวันตรวจเลือก คนตำบลเดียวกันยืนแถวเดียวกันจนทักกันได้ทั้งสนาม โต๊ะแรกจะเรียกชื่อและตรวจหลักฐาน เขาคลำกระเป๋าเสื้อแล้วหน้าซีด ซองเอกสารน่าจะยังอยู่บนโต๊ะกินข้าว"
    choices:
      - id: draftee_table_ride_home
        text: "บึ่งรถกลับไปเอาให้"
        outcomes:
          - {weight: 1, ok: true, text: "กลับมาทันก่อนถึงคิวสี่คน เขากอดซองแน่นเหมือนกลัวมันจะลอยไป แล้วเลี้ยงข้าวคุณหนึ่งมื้อ", effects: {relations: 2, health: -1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ซองไม่ได้อยู่บนโต๊ะ มันอยู่ในกระเป๋ากางเกงเขามาตั้งแต่เช้า คุณกลับถึงสนามพร้อมเหงื่อท่วมตัว", effects: {relations: 1, health: -1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_table_ask_officer
        text: "พาไปถามเจ้าหน้าที่ตรง ๆ"
        effects: {knowledge: 2, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_table_calm
        text: "ให้นั่งลงแล้วค้นทีละกระเป๋า"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: draftee_table_stay_back
        text: "ยืนรอหลังรั้ว ปล่อยเขาจัดการ"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: draftee_table_whole_line
        text: "ถามคนทั้งแถวว่าใครเห็นซองไหม"
        outcomes:
          - {weight: 1, ok: true, text: "คนแถวหน้าชี้ว่าซองเสียบอยู่ในหมวกเขาเอง ทั้งแถวหัวเราะพร้อมกัน บรรยากาศเริ่มผ่อนคลายขึ้นมาหน่อย", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ได้ซองมาสามซองแต่ไม่ใช่ของเขาสักซอง คนทั้งแถวเริ่มคลำกระเป๋าตัวเอง และบางคนก็หน้าซีดตาม", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_water_stall_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "น้ำเย็นหน้าสนามตรวจเลือก"
    text: "ญาติของหนุ่ม ๆ มากันตั้งแต่เช้ามืด นั่งรอข้างสนามเป็นชั่วโมง คุณมาช่วยน้าตั้งโต๊ะขายน้ำเย็นกับข้าวเหนียวหมูปิ้ง แดดเริ่มแรง คิวยาวถึงรั้ว ป้าคนหนึ่งกำเงินแล้วบอกว่าไม่หิว แต่ขอนั่งใต้ร่มร้านคุณได้ไหม"
    choices:
      - id: draftee_stall_free_seat
        text: "ยกเก้าอี้ให้ป้านั่งเลย"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_stall_ice_free
        text: "ยกน้ำให้ป้าแก้วหนึ่งฟรี ๆ"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}, happiness: 1}
        merit: [{cat: dana, level: 1}]
      - id: draftee_stall_full_price
        text: "ขายตามราคา เกรงใจน้า"
        effects: {money: {unit: income_x, amount: 0.02}, relations: -1}
        merit: [{cat: neutral}]
      - id: draftee_stall_more_ice
        text: "รีบไปซื้อน้ำแข็งเพิ่ม"
        effects: {money: {unit: income_x, amount: 0.03}, health: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: draftee_stall_lucky_label
        text: "ตั้งชื่อน้ำว่าน้ำแก้วใบดำ"
        outcomes:
          - {weight: 1, ok: true, text: "คนซื้ออ่านป้ายแล้วหัวเราะออกมาได้ น้ำหมดก่อนเที่ยง น้าถามว่าปีหน้าคุณว่างไหม", effects: {money: {unit: income_x, amount: 0.04}, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หนุ่มที่เพิ่งจับได้ใบแดงมาหยุดอ่านป้ายแล้วเดินเลยไปเงียบ ๆ คุณแอบปลดป้ายลงทั้งที่ไม่มีใครบอก", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_plastic_chair_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 26]}
    title: "เหลือยี่สิบเอ็ดที่นั่ง"
    text: "เก้าอี้พลาสติกบางจนขยับทีดังกรอบ เพื่อนคุณนั่งแถวกลาง ตัวเกร็งรอเรียกชื่อ ประกาศว่าวันนี้มีคนสมัครก่อนสิบห้าคน เหลือยี่สิบเอ็ดที่ให้จับกันในหกสิบแปดคน เขาหันมาหาคุณหลังรั้ว ขยับปากถามว่าดีขึ้นไหม"
    choices:
      - id: draftee_chair_thumbs
        text: "ชูนิ้วโป้งให้ใจชื้น"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: draftee_chair_math
        text: "เขียนเลขตัวโตใส่กระดาษชูให้ดู"
        outcomes:
          - {weight: 1, ok: true, text: "ตัวเลขออกมาดีกว่าที่เขากลัว เขาพยักหน้าแล้วเลิกกัดเล็บ คนที่ยืนหลังรั้วข้าง ๆ คุณเอียงมาขอให้คิดของหลานเขาด้วย", effects: {knowledge: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณคูณผิดจนได้ว่าเขาต้องจับสองรอบ คนรอบรั้วช่วยกันแก้จนเลขนั้นกลายเป็นเรื่องตลกทั้งแถว", effects: {happiness: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: draftee_chair_buy_water
        text: "ไปซื้อน้ำมารอท่า"
        effects: {relations: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_chair_quiet
        text: "ยืนนิ่ง ๆ ไม่ทำให้เขาคิดมาก"
        effects: {happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: draftee_chair_count_chairs
        text: "นับเก้าอี้ซ้ำเผื่อประกาศผิด"
        outcomes:
          - {weight: 1, ok: true, text: "นับได้เท่าประกาศทุกรอบ แต่การนับทำให้คุณกับเขาหายใจเป็นจังหวะ จนถึงคิวก็ไม่มีใครเป็นลม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กรรมการถามว่านับอะไร คุณตอบว่าเก้าอี้ ป้าข้างรั้วพยักหน้าเห็นใจเหมือนคุณแดดลงหัวไปแล้ว", effects: {happiness: 1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_red_card_friend_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 26]}
    title: "เพื่อนนั่งลงกับพื้น"
    text: "ใบแดงในมือเพื่อนสนิทยังยับตามรอยนิ้ว เขาทรุดนั่งข้างรั้ว เอามือปิดหน้าอยู่นาน พอเงยขึ้นมาบอกว่าตกใจ แต่ไม่ได้กลัว เสียงยังสั่นอยู่ คุณเดินไปถึงแล้วเขาก็ไม่พูดอะไรต่อ"
    choices:
      - id: draftee_red_sit_beside
        text: "นั่งลงข้าง ๆ ไม่พูดอะไร"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_red_tell_family
        text: "อาสาไปบอกทางบ้านเขาเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ทางบ้านเขาเงียบไปครู่หนึ่ง แล้วถามคุณว่ากินข้าวหรือยัง คุณนั่งกินข้าวกับทางบ้านเขาจนหมดจาน ไม่มีใครเอ่ยคำว่าใบแดงอีก", effects: {relations: 2, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ป้าของเขาปล่อยโฮตั้งแต่คำแรก คุณยืนกลางบ้านคนอื่นจนค่ำ พูดอะไรก็ไม่ดีขึ้น", effects: {relations: 1, happiness: -2}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_red_rice_shop
        text: "พาไปกินข้าวร้านโปรด"
        effects: {relations: 1, money: {unit: income_x, amount: -0.02}, happiness: 1}
        merit: [{cat: neutral}]
      - id: draftee_red_give_space
        text: "ปล่อยเขาอยู่คนเดียวสักพัก"
        effects: {relations: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: draftee_red_shave_pact
        text: "สัญญาว่าจะโกนหัวเป็นเพื่อน"
        outcomes:
          - {weight: 1, ok: true, text: "คุณโกนจริงเย็นนั้นเลย หัวคุณขาวกว่าหน้าอยู่สองโทน เขาเห็นแล้วหัวเราะออกมาเป็นครั้งแรกในวันนั้น", effects: {relations: 2, happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ช่างที่ตลาดบอกว่าหัวทรงนี้โกนแล้วน่าจะเสียใจ คุณกลับไปหาเพื่อนพร้อมผมครบทุกเส้นและความละอาย", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: draftee_letter_home_01
    type: A
    category: family
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 26]}
    title: "จดหมายคืนแรกของเพื่อน"
    text: "ซองเล็ก ๆ ส่งมาถึงบ้านคุณ เพื่อนที่เพิ่งเข้าค่ายเขียนมาว่าอยู่ได้ แต่คืนแรก ๆ ก็คิดถึงบ้าน บรรทัดท้ายขอให้แวะดูยายของเขาหน่อย ยายหูไม่ดี ชอบบอกใครต่อใครว่าหลานไปทำงานต่างจังหวัดแล้วเดี๋ยวก็กลับ"
    choices:
      - id: draftee_letter_visit_grandma
        text: "แวะไปหายายสัปดาห์ละครั้ง"
        effects: {relations: 2, happiness: 1, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: draftee_letter_write_back
        text: "เขียนตอบยาวสองหน้า"
        effects: {relations: 2, knowledge: 1}
        merit: [{cat: neutral}]
      - id: draftee_letter_read_to_her
        text: "เอาจดหมายไปอ่านให้ยายฟัง"
