          - {weight: 1, ok: true, multipliers: {stats: {relations: 2}, occupation: {craft: 1.5}}, text: "ผ้าทอมือได้ออเดอร์จากร้านในเมือง กลายเป็นเถ้าแก่ตัวเล็ก", effects: {relations: 1, income_mult: 1.3}, sets_flags: [own_business], merit: [{cat: neutral}]}
