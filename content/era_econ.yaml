    text: "ข้าวขายได้ราคา พ่อเริ่มเหนื่อยง่าย เพื่อนในเมืองส่งจดหมายมาว่าโรงงานกลับมาเปิดกะแล้ว คนทั้งหมู่บ้านรอดูว่าคุณจะอยู่หรือไป"
    choices:
      - text: "ทิ้งงานเมือง ทำนาเต็มตัว"
        effects: {job: farmer, health: 1, happiness: 1, money: {unit: income_x, amount: 0.5}}
        merit: [{cat: care_parents, level: 1}]
      - text: "ปลูกผักขายตลาดนัดเสริม"
        outcomes:
          - {weight: 2, ok: true, text: "ผักปลอดสารของคุณหมดแผงก่อนสาย แม่ค้าในเมืองมาสั่งส่งประจำ", effects: {relations: 1, money: {unit: income_x, amount: 0.5}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หนอนลงแปลงชั่วข้ามคืน ผักทั้งแปลงเหลือแต่ก้าน", effects: {happiness: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "กลับเมืองไปทำงานเดิม"
        effects: {relations: -1, money: {unit: income_x, amount: 0.3}}
        merit: [{cat: neutral}]
      - text: "ชวนเพื่อนบ้านตั้งโรงสีชุมชน"
        requires: {money: {unit: income_x, amount: 1}, reason: "ไม่มีเงินก้อนพอซื้อเครื่องสี"}
        effects: {money: {unit: income_x, amount: -1}}
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "โรงสีเล็กสีข้าวให้ทั้งตำบล คุณกลายเป็นเถ้าแก่โรงสีที่ใครก็เรียกหา", effects: {happiness: 2, relations: 1, income_mult: 1.25}, sets_flags: [own_business], merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เครื่องสีมือสองพังเดือนแรก เพื่อนบ้านถอนตัวหมด เหลือหนี้ค่าเครื่องคนเดียว", effects: {happiness: -2, relations: -1, money: {unit: income_x, amount: -1}}, sets_flags: [in_debt], merit: [{cat: neutral}]}
        merit: [{cat: help_others, level: 1}]

  - id: era_econ_gfc_cafe_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    when: {occupation: [factory, craft, service, clerk, technician, professional, manager]}
    title: "กาแฟแก้วนี้ขายได้"
    text: "ร้านกาแฟเล็กของคุณติดปากคนทั้งย่าน มีคนตกงานมาขอซื้อสูตรไปเปิดเอง ส่วนบริษัทเก่าโทรมาชวนกลับไปทำตำแหน่งเดิม"
    choices:
      - text: "ขายสูตรเปิดสาขาให้คนอื่น"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "ร้านสาขาผุดขึ้นห้าจุดในปีเดียว ทุกร้านส่งค่าสูตรให้คุณทุกเดือน", effects: {network: 2, income_mult: 1.2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สาขาชงกาแฟจืดเหมือนน้ำล้างแก้ว ลูกค้าเหมาว่าร้านคุณก็จืดด้วย", effects: {happiness: -1, money: {unit: income_x, amount: -0.5}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - text: "ปฏิเสธบริษัท ทุ่มให้ร้านเต็มตัว"
        effects: {happiness: 2, health: 1, income_mult: 1.2}
        sets_flags: [own_business]
        merit: [{cat: neutral}]
      - text: "กลับบริษัท ให้แม่ดูร้านแทน"
        effects: {relations: 1, happiness: -1, money: {unit: income_x, amount: 0.5}}
        merit: [{cat: neutral}]
      - text: "จ้างคนตกงานในซอยมาช่วยชง"
        effects: {relations: 2, money: {unit: income_x, amount: -0.3}}
        merit: [{cat: help_others, level: 1}]
