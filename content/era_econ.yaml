# กลุ่ม era_econ_ · การ์ดบ้านเมืองเศรษฐกิจ 3 เหตุการณ์ × (เด็ก ครอบครัวเลือก + ผู้ใหญ่ + ชรา)
# การ์ดชราไม่มี income_mult (เกษียณแล้วไม่มีค่าจ้างให้ขึ้นลง) · ไม่ตั้งธงธุรกิจ/หนี้ · พูดถึงหลาน/ญาติ ไม่ใช่ลูก (ไม่ใช่ทุกคนมีลูก)
