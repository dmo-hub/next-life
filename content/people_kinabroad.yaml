# ร่างเรื่อง คนที่บ้านของแรงงานไทยต่างแดน · 15 ใบ · ลงเกมแล้ว ใบ 249 จากร่าง 248 · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นคนที่บ้าน ญาติ เพื่อนบ้านเสมอ ไม่ไปต่างแดนเอง · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี
events:
  - id: kinabroad_kid_village_01
    type: A
    category: family
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [7, 12], school: [primary], family: [{role: parent, sex: ชาย, alive: true}]}
    title: "พ่อไปไกล ญาติเต็มซอย"
    text: "พ่อไปทำงานเมืองนอกตั้งแต่ต้นปี ป้าหลังบ้านตักข้าวให้แล้วถามว่าคิดถึงไหม คุณยังไม่ทันตอบ น้าท้ายซอยก็ตะโกนเรียกไปช่วยจับไก่ เพื่อนอีกสามคนมายืนรอหน้ารั้ว วันหนึ่งผ่านไปเร็วจนลืมนึก"
    choices:
      - id: kinabroad_kid_not_lonely
        text: "บอกป้าว่าไม่เหงา คนเยอะ"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: kinabroad_kid_catch_hens
        text: "ช่วยน้าไล่จับไก่จนครบเล้า"
        effects: {health: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_kid_count_days
        text: "นั่งกาปฏิทินนับวันข้างฝา"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_kid_every_house
        text: "ไปกินข้าวให้ครบทุกบ้านในซอย"
        outcomes:
          - {weight: 1, ok: true, text: "คุณกินครบสี่บ้านในเย็นเดียว ทุกบ้านตักเพิ่มให้เพราะคิดว่ายังไม่ได้กิน ปีนั้นตัวโตขึ้นจนเสื้อเก่าติดกระดุมไม่ลง", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถึงบ้านที่สามท้องก็เริ่มประท้วง ป้าเอายาธาตุมาให้ แล้วเล่าให้ทั้งซอยฟังว่าเจ้าตัวเล็กกินจุกว่าแขกงานบวช", effects: {health: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_letter_wait_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 18]}
    title: "จดหมายที่ปากทางหมู่บ้าน"
    text: "ยายข้างบ้านตาไม่ดี ทุกเจ็ดวันคุณจึงปั่นจักรยานไปรับจดหมายจากหลานยายที่บุรุษไปรษณีย์ฝากไว้ที่ร้านปากทาง ฉบับล่าสุดเล่าว่างานเมืองนอกหนักกว่าที่คิด แต่ท้ายจดหมายเขียนถึงคนอ่านว่า อย่าบอกยาย ยายนั่งรอฟังอยู่บนแคร่แล้ว"
    choices:
      - id: kinabroad_letter_read_true
        text: "อ่านตามจริงทุกบรรทัด"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_letter_skip_hard
        text: "ข้ามตอนลำบากไปเบา ๆ"
        effects: {relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_letter_reply_for
        text: "ช่วยยายเขียนตอบกลับ"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_letter_do_voice
        text: "อ่านโดยดัดเสียงเป็นหลานยาย"
        outcomes:
          - {weight: 1, ok: true, text: "ยายหัวเราะจนน้ำตาเล็ด บอกว่าเสียงเหมือนตอนหลานเป็นหวัด ตั้งแต่นั้นคนในซอยเอาจดหมายมาให้คุณอ่านกันเป็นแถว", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ยายฟังไปได้สองบรรทัดก็เงียบ แล้วบอกว่าอย่าทำอีกเลย เสียงนี้ทำให้คิดถึงกว่าเดิม คุณอ่านที่เหลือด้วยเสียงตัวเอง", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_airport_wait_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [14, 18], school: [lower, upper, voc]}
    title: "นั่งรถข้ามคืนไปรอรับ"
    text: "เพื่อนร่วมห้องชวนนั่งรถข้ามคืนเป็นเพื่อน ไปรอรับพ่อของเขาที่กลับจากทำงานเมืองนอกหลายปี ตอนพ่อเขาไป เพื่อนยังตัวเล็ก เลยกลัวจะจำหน้าไม่ได้ พรุ่งนี้มีสอบเก็บคะแนนวิชาหนึ่ง แต่ครูยังไม่ได้ตอบว่าสอบชดเชยได้ไหม"
    choices:
      - id: kinabroad_airport_go_along
        text: "ไปเป็นเพื่อนจนถึงที่หมาย"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_airport_stay_exam
        text: "อยู่สอบ ฝากขนมไปให้"
        effects: {knowledge: 2, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_airport_old_photo
        text: "ช่วยหารูปเก่าให้เพื่อนพกไป"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_airport_sign_all
        text: "ทำป้ายต้อนรับถือไว้สูงเกินหัว"
        outcomes:
          - {weight: 1, ok: true, text: "ป้ายใหญ่จนคนที่เดินออกมามองกันทั้งแถว ชายผอมคนหนึ่งยืนอ่านนาน แล้วเรียกชื่อเพื่อนคุณเสียงสั่น ไม่ต้องจำหน้าอีกเลย", effects: {happiness: 2, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณสะกดนามสกุลผิดไปหนึ่งตัว เจ้าตัวเดินผ่านไปสองรอบ เพื่อนต้องวิ่งตามไปดึงแขนเอง ป้ายนั้นกลายเป็นของที่เขาเก็บไว้ล้อคุณ", effects: {happiness: 1, relations: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_house_wait_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [22, 30]}
    title: "บ้านที่สร้างรอคนกลับ"
    text: "สามีของพี่ข้างบ้านส่งเงินกลับทุกเดือนให้สร้างบ้านรอ พี่เขาเลยต้องคุมช่างและซื้อวัสดุเองทั้งที่ไม่เคยรู้จักปูนกับทราย วันนี้ช่างบอกว่าไม้ไม่พออีกแล้ว พี่เขาหันมาถามคุณว่าที่ช่างพูดนี่จริงหรือเปล่า"
    choices:
      - id: kinabroad_house_list_items
        text: "ช่วยจดของที่ซื้อทีละรายการ"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_house_haggle
        text: "ไปต่อราคาที่ร้านวัสดุด้วยกัน"
        effects: {network: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_house_stay_out
        text: "บอกว่าไม่รู้เรื่องช่าง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_house_fake_foreman
        text: "ยืนกอดอกทำหน้าเป็นนายช่างใหญ่"
        outcomes:
          - {weight: 1, ok: true, text: "คุณไม่พูดสักคำ แค่เดินเคาะเสาแล้วพยักหน้า ช่างเริ่มวัดไม้ใหม่เองจนพบว่ายังเหลือพอ พี่ข้างบ้านยกแกงมาให้สองถ้วย", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ช่างยื่นตลับเมตรให้แล้วถามว่าระยะนี้ใช้เท่าไรดี คุณอ่านผิดด้านของตลับเมตร ช่างทั้งหน้างานหัวเราะและคุณเดินกลับบ้านทางหลังรั้ว", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_porch_talk_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [20, 28]}
    title: "ลุงที่ไม่อยากให้ไปซ้ำ"
    text: "ลุงข้างบ้านเคยไปทำงานเมืองนอกหลายปี กลับมาพร้อมหลังที่ก้มไม่สุด ตอนนี้ลูกชายของลุงซึ่งเป็นเพื่อนคุณอยากไปบ้าง ลุงไม่ยอม บอกว่าไม่อยากให้เขาไปลำบากซ้ำ สองคนเงียบใส่กันมาสามวัน แล้วต่างคนต่างมาหาคุณที่ชานบ้าน"
    choices:
      - id: kinabroad_porch_hear_both
        text: "ฟังทั้งสองคนจนจบ"
        effects: {relations: 2, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_porch_side_uncle
        text: "เข้าข้างลุง บอกเพื่อนให้หยุดคิด"
        effects: {relations: 1, network: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_porch_side_friend
        text: "บอกลุงว่าเขาโตแล้ว"
        effects: {network: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_porch_uncle_instead
        text: "เสนอว่าให้ลุงไปอีกรอบแทน"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงหัวเราะออกมาครั้งแรกในรอบสามวัน แล้วเล่าเรื่องหลังปวดให้เพื่อนคุณฟังยาวจนฟ้ามืด สองคนเริ่มพูดกันอีกครั้งโดยไม่มีใครขอโทษก่อน", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงไม่ขำ บอกว่าถ้ายังไหวก็ไปแล้ว คุณนั่งเงียบกินน้ำจนหมดแก้ว แล้วขอตัวกลับบ้านก่อนฝนตกทั้งที่ฟ้ายังใส", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_cement_lane_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "รถขนปูนจอดขวางซอย"
    text: "คนข้างบ้านที่ไปทำงานเมืองนอกส่งเงินมาสร้างบ้านใหม่ รถขนปูนขนทรายจอดขวางซอยตั้งแต่เช้า ฝุ่นเข้าครัวคุณทุกช่อง ญาติเขาเดินออกมายิ้มเหนียม ๆ บอกว่าอีกไม่กี่เที่ยวก็หมด ส่วนคุณยังออกจากบ้านไม่ได้"
    choices:
      - id: kinabroad_cement_move_things
        text: "ย้ายของหลบให้รถเข้าสะดวก"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_cement_complain
        text: "เดินไปบ่นให้ญาติเขาฟัง"
        effects: {happiness: 1, relations: -2}
        merit: [{cat: neutral}]
      - id: kinabroad_cement_slip_fence
        text: "มุดข้างรั้วออกไปธุระ"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_cement_coffee_stall
        text: "ตั้งโต๊ะขายกาแฟให้คนงานเลย"
        outcomes:
          - {weight: 1, ok: true, text: "คนขับรถขนปูนซื้อคนแรก ช่างทั้งหน้างานตามมาอีกแถว บ้านเขายังไม่มีหลังคา แต่โต๊ะของคุณเริ่มมีลูกค้าประจำ", effects: {happiness: 1, network: 1, money: {unit: income_x, amount: 0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ฝุ่นปูนลงแก้วหมดทุกแก้วก่อนจะได้เสิร์ฟ คุณนั่งเทกาแฟทิ้งข้างรั้ว คนงานยังเดินมาขอน้ำเปล่าฟรีอีกสองกา", effects: {happiness: -1, money: {unit: income_x, amount: -0.02}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_lend_fare_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "ขอยืมค่าเดินทาง"
    text: "เพื่อนบ้านเดินก้มหน้ามาถึงหน้าบ้านคุณตอนเย็น เขาได้งานเมืองนอก ค่านายหน้าต้องวางมัดจำก่อน ทั้งบ้านนั่งนับเงินกันแล้วยังขาดอีกก้อน สหกรณ์ก็กู้เต็มแล้ว เขาบอกว่าไปถึงแล้วจะส่งคืนเป็นงวดทุกเดือน"
    choices:
      - id: kinabroad_lend_on_trust
        text: "ให้ยืมไปโดยไม่ต้องเขียนอะไร"
        outcomes:
          - {weight: 2, ok: true, text: "เงินงวดแรกมาช้าไปหนึ่งเดือน แต่มาจริงพร้อมจดหมายขอบคุณ ครบกำหนดเขาคืนหมด และคนในซอยก็รู้ว่าบ้านคุณไว้ใจได้", effects: {relations: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ข่าวจากเขาหายไปหลังสองงวดแรก ญาติเขาหลบหน้าเวลาเจอกันที่ตลาด ก้อนนั้นคุณเลิกนับรวมในบัญชีเอง", effects: {happiness: -1, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
        merit: [{cat: dana, level: 1}]
      - id: kinabroad_lend_write_note
        text: "ให้ยืม แต่ขอเขียนสัญญาชัด ๆ"
        effects: {knowledge: 1, relations: 1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: kinabroad_lend_check_first
        text: "ชวนไปถามอำเภอเรื่องนายหน้าก่อน"
        effects: {knowledge: 2, relations: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_lend_decline
        text: "บอกตรง ๆ ว่าไม่มีให้ยืม"
        effects: {happiness: -1, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_lend_three_hens
        text: "ขอไก่สามตัวเป็นหลักประกัน"
        outcomes:
          - {weight: 1, ok: true, text: "เขาหิ้วไก่มาจริง ไก่ไข่ทุกวันจนคุณเริ่มคิดว่าได้ดอกเบี้ยเป็นไข่ พอเงินงวดสุดท้ายมา คุณต้องคืนไก่ทั้งที่ตั้งชื่อไปแล้ว", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไก่สามตัวบินข้ามรั้วกลับบ้านเดิมภายในคืนเดียว เขาหิ้วมาส่งใหม่อีกสองรอบ แล้วทั้งคู่ตกลงกันว่าเขียนกระดาษก็พอ", effects: {happiness: 1, knowledge: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: kinabroad_chair_front_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [33, 45]}
    title: "เก้าอี้หน้าบ้านป้า"
    text: "ป้าข้างบ้านตั้งเก้าอี้ตัวหนึ่งไว้หน้าบ้านมาหลายปี ลูกชายของป้าส่งกลับมาจากโรงงานที่เมืองนอก ไม่เคยมีใครได้นั่งจริง ๆ แดดเผาจนสีเริ่มซีด วันนี้ป้าถามคุณว่าเก้าอี้แบบนี้ที่ตลาดมีขายไหม พร้อมยิ้มรอคำตอบ"
    choices:
      - id: kinabroad_chair_no_market
        text: "บอกว่าฝีมือแบบนี้ตลาดไม่มี"
        effects: {relations: 2, knowledge: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_chair_shade
        text: "ช่วยย้ายเข้าร่มกันสีซีด"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: help_others, level: 1}]
      - id: kinabroad_chair_honest
        text: "ตอบตามจริงว่ามีเหมือนกัน"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: kinabroad_chair_sit_ask
        text: "ขอนั่งลองสักทีให้เป็นสิริมงคล"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าปัดฝุ่นให้ก่อนแล้วยืนดูคุณนั่งอย่างพอใจ คุณชมว่านั่งสบายกว่าแคร่ที่บ้าน ป้าเล่าเรื่องโรงงานนั้นต่อจนหมดกาน้ำชา", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
