        merit: [{cat: neutral}]
      - id: friends_group
        text: "ตั้งวงคุยกับเพื่อนวัยเดียวกัน"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: exercise
        text: "เริ่มเดินเร็วตอนเช้าทุกวัน"
        effects: {health: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: endure
        text: "ทนเงียบ ๆ ไม่อยากให้ใครรู้"
        effects: {happiness: -1, health: -1}
        merit: [{cat: neutral}]

  - id: sex_pay_gap_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    when: {age: [25, 45], year: [2500, 2540], sex: [หญิง]}
    title: "ซองเงินเดือนที่วางผิดโต๊ะ"
    text: "ซองเงินเดือนของเพื่อนผู้ชายที่เข้ามาพร้อมกันวางผิดโต๊ะ ตำแหน่งเดียวกัน งานเท่ากัน แต่ตัวเลขในซองมากกว่าของคุณเกือบครึ่ง หัวหน้าเคยบอกว่า 'ผู้หญิงเดี๋ยวก็แต่งงานออกไป'"
    choices:
      - id: ask_raise
        text: "ถือซองไปขอขึ้นเงินเดือนตรง ๆ"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.3}}, text: "หัวหน้าอึกอักแล้วยอมปรับให้ เพื่อนผู้หญิงทั้งแผนกมากระซิบถามว่าพูดยังไง", effects: {happiness: 1, network: 1, income_mult: 1.15}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ได้คำตอบว่า 'บริษัทมีโครงสร้างอยู่แล้ว' แล้วโดนย้ายไปนั่งใกล้ห้องเก็บของ", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: band_together
        text: "ชวนผู้หญิงทั้งแผนกร้องเรียน"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {relations: 1.5}}, text: "ฝ่ายบุคคลเรียกประชุม ปีถัดมาบริษัทเปลี่ยนตารางเงินเดือนทั้งแผนก", effects: {relations: 2, network: 1, income_mult: 1.1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เรื่องเงียบหาย มีแค่ชื่อคุณที่หัวหน้าจำได้", effects: {relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: switch_job
        text: "แอบสมัครงานที่จ่ายตามตำแหน่ง"
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {knowledge: 1.5}}, text: "ได้งานใหม่ เงินเดือนเท่าเพื่อนผู้ชายในซองนั้นพอดี", effects: {happiness: 1, income_mult: 1.2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "สัมภาษณ์ไปห้าที่ ทุกที่ถามว่าวางแผนจะมีลูกเมื่อไหร่", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: let_it_go
        text: "วางซองคืนที่เดิม แล้วทำงานต่อ"
        effects: {happiness: -1}
        merit: [{cat: neutral}]

  # ค้นพบตัวเอง: ทางเดียวที่ตั้งอัตลักษณ์ · ใบวัยรุ่น weight 0.5 ตามใบวัยรุ่นชุดใหม่ (decisions 416)
  - id: sex_identity_found_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.5
    when: {age: [14, 19], sex: [ชาย], identity: [ตามเพศกำเนิด]}
    title: "หลังเวทีนางนพมาศ"
    text: "งานลอยกระทงของโรงเรียนปีนี้ พี่ปอที่ทุกคนรู้ว่าเป็นสาวประเภทสองชวนไปช่วยหลังเวที ระหว่างรอคิว พี่ยื่นชุดไทยสำรองมาให้ลองใส่ บอกว่าไม่มีใครบังคับ ใส่แล้วไม่ใช่ก็ถอด ไม่มีใครว่า"
    choices:
      - id: this_is_me
        text: "ลองใส่ แล้วรู้ว่านี่คือตัวเอง"
        effects: {identity: หญิงข้ามเพศ, happiness: 2}
        merit: [{cat: neutral}]
      - id: help_backstage
        text: "ช่วยพี่แต่งหน้าอยู่หลังเวที"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: cheer_front
        text: "ขอบคุณพี่ แล้วไปเชียร์ข้างล่าง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: go_home
        text: "กลับบ้านไปช่วยที่บ้านเตรียมกระทง"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]

  # ครอบครัวตามยุค: ก่อน 2540 บ้านส่วนใหญ่ไม่มีคำอธิบาย · หลังนั้นมีคำให้คุยกันมากขึ้น · ไม่มีตัวเลือกให้ทิ้งตัวตน
  - id: sex_identity_family_old_01
    type: A
    category: family
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 3
    when: {age: [15, 25], year: [2500, 2539], identity: [หญิงข้ามเพศ], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "เรื่องที่พ่อไม่ถาม"
    text: "แม่เจอกระโปรงในกระเป๋านักเรียน คืนนั้นบ้านเงียบกว่าทุกคืน พ่อไม่พูดสักคำ แม่บอกแค่ว่ากลัวคนข้างบ้านจะว่า ทีวีช่วงนี้มีแต่ละครที่เอากะเทยมาเป็นตัวตลก ไม่มีใครในบ้านรู้ว่าจะคุยเรื่องนี้ยังไง"
    choices:
      - id: talk_mother
        text: "นั่งคุยกับแม่ตรง ๆ ทีละนิด"
        effects: {relations: 1, happiness: -1}
