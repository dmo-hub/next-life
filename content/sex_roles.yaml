      - id: dress_outside
        text: "ใส่ชุดที่ใช่ตอนอยู่กับเพื่อน"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: leave_for_city
        text: "ตั้งใจเรียนให้ได้ไปเรียนในเมือง"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: wait_time
        text: "รอให้เวลาช่วยให้พ่อเข้าใจเอง"
        effects: {happiness: -1}
        merit: [{cat: neutral}]

  - id: sex_identity_family_new_01
    type: A
    category: family
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 3
    when: {age: [15, 25], year: [2540, 2650], identity: [หญิงข้ามเพศ], family: [{role: parent, sex: หญิง, alive: true}, {role: parent, sex: ชาย, alive: true}]}
    title: "บอกที่บ้าน"
    text: "แม่เห็นรูปในโทรศัพท์ที่เพื่อนแท็กมา ถามตรง ๆ ตอนกินข้าวเย็น พ่อวางช้อนแล้วถามว่าลูกแน่ใจแล้วใช่ไหม ป้าในกลุ่มไลน์ครอบครัวยังส่งข่าวคลินิกรักษาให้หายมาให้อ่าน ส่วนน้องบอกว่าเพื่อนที่โรงเรียนก็มีหลายคน"
    choices:
      - id: tell_all
        text: "เล่าให้ทุกคนฟังว่าเป็นใคร"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: ask_doctor
        text: "ชวนพ่อแม่ไปคุยกับหมอด้วยกัน"
        effects: {relations: 1, knowledge: 1, money: {unit: income_x, amount: -0.1}}
        merit: [{cat: neutral}]
      - id: mute_group
        text: "ปิดเสียงกลุ่มไลน์ ใช้ชีวิตต่อ"
        effects: {happiness: 1, network: -1}
        merit: [{cat: neutral}]
      - id: give_time
        text: "ขอให้พ่อแม่ใช้เวลาทำความเข้าใจ"
        effects: {happiness: -1}
        merit: [{cat: neutral}]

  # เกณฑ์ทหาร (รีเสิร์ช 215-conscription-research.md): ก่อน 2557 ได้ยกเว้นแต่ สด.43 ระบุโรคจิตถาวร · ตั้งแต่ 2557 ยื่นใบรับรองแพทย์ได้จำพวก 2 ไม่ต้องจับ
  # ไม่มีทางจับใบแดง — ผลทหารเกณฑ์ไม่เกิดกับค่านี้ตามกติกาจริง · ผลต่างอยู่ที่ใบ สด.43 กับวันนั้น
  - id: sex_lottery_trans_old_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 4
    when: {age: [21, 21], year: [2500, 2556], sex: [ชาย], identity: [หญิงข้ามเพศ]}
    title: "ใบ สด.43"
    text: "วันตรวจเลือก คุณผมยาวประบ่า ใส่เสื้อผ้าแบบที่ใส่ทุกวัน กรรมการเรียกไปตรวจแยก แล้วให้ใบ สด.43 กลับบ้าน ไม่ต้องเป็นทหาร แต่ช่องเหตุผลเขียนว่า โรคจิตถาวร พี่ที่เคยผ่านมาก่อนบอกว่าใบนี้ต้องใช้สมัครงานไปอีกนาน"
    choices:
      - id: keep_quiet
        text: "เก็บใบไว้ ไม่ให้ใครเห็น"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: private_job
        text: "หางานเอกชนที่ไม่ขอดูใบนี้"
        effects: {network: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: join_group
        text: "หาเพื่อนที่เจอเรื่องเดียวกัน"
        effects: {network: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: laugh_it_off
        text: "บอกตัวเองว่าเราไม่ได้ป่วย"
        effects: {happiness: 1}
        merit: [{cat: neutral}]

  - id: sex_lottery_trans_new_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 4
