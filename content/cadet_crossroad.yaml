  # >>> nl-writer b001 evt cadet_checkpoint_01
  - id: cadet_checkpoint_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2506, 2650]
    weight: 1
    when: {age: [14, 17], sex: [ชาย], school: [lower, upper, voc], flags: {not: [cadet_dream]}}
    title: "ด่านขากลับ"
    text: "ขากลับจากตลาดนัดในอำเภอ ด่านตรวจกลางทางโบกให้รถกระบะของบ้านจอด ไฟท้ายเสียไปข้างหนึ่ง ผู้ใหญ่ในบ้านพับแบงก์สอดไว้ใต้ใบขับขี่ แล้วยื่นออกไปทางหน้าต่าง {ชื่อ} นั่งเบาะข้างคนขับ เห็นทุกอย่าง"
    choices:
      - id: fix_light
        text: "รับปากจะช่วยซ่อมไฟท้ายพรุ่งนี้"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: look_away
        text: "มองออกนอกหน้าต่าง ไม่คิดอะไร"
        merit: [{cat: neutral}]
      - id: ask_loud
        text: "ถามเสียงดังว่าใส่เงินไว้ทำไม"
        outcomes:
          - {weight: 1, text: "ตำรวจหัวเราะ ดึงแบงก์คืนมาวางบนตัก บอกแค่ว่าไปซ่อมไฟท้ายก่อนค่ำ", effects: {happiness: 1}, sets_flags: [saw_police], merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้ใหญ่ดุให้เงียบ ตำรวจทำเป็นไม่ได้ยิน รับไปแล้วโบกให้ผ่าน ทั้งรถเงียบไปจนถึงบ้าน", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: remember
        text: "จำหน้ากับป้ายชื่อตำรวจไว้"
        outcomes:
          - {weight: 1, text: "ตำรวจสบตาแล้วชะงัก ยื่นใบขับขี่คืนมาพร้อมแบงก์ บอกให้ไปซ่อมไฟ ป้ายชื่อนั้นจำได้อีกนาน", effects: {knowledge: 1}, sets_flags: [saw_police], merit: [{cat: neutral}]}
          - {weight: 1, text: "เขารับไปโดยไม่มองหน้าใคร ชื่อบนป้ายติดอยู่ในหัวไปอีกนาน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: look_down
        text: "ก้มหน้า ทำเป็นไม่เห็น"
        outcomes:
          - {weight: 1, text: "ได้ยินเสียงตำรวจบอกว่าเก็บเงินไว้ซื้อหลอดไฟเถอะ แล้วรถก็ออกตัว", merit: [{cat: neutral}]}
          - {weight: 1, text: "รถออกตัวต่อ ไม่มีใครในรถพูดถึงเรื่องนี้อีก", merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: remember_good
        text: "นึกถึงตำรวจที่เคยช่วยคน"
        requires: {flags: {has: [saw_police]}, reason: "ยังไม่เคยเห็นตำรวจใกล้ ๆ"}
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: commit
        text: "จะสอบเตรียมทหาร ไปเป็นตำรวจ"
        hint: "ต้องเตรียมตัวสอบแข่งจริงจัง"
        effects: {happiness: 1}
        sets_flags: [saw_police, cadet_dream, "cadet_lean:police"]
        schedules:
          - {event: cadet_tell_family, after_years: [0, 0]}
          - {event: cadet_prep_choice, after_years: [0, 0]}
        merit: [{cat: neutral}]
  # <<< nl-writer b001 evt cadet_checkpoint_01
