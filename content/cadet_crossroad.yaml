# nl-writer file b001
# ทางแยกเตรียมทหาร (อายุ 13–17 · ร่างให้เจ้าของเลือก) — ต่อจาก cadet_childhood.yaml (ธง saw_* knows_senior) ไป cadet_prep.yaml
# ตั้งธง cadet_dream cadet_declined cadet_tips cadet_senior_tutor cadet_lean:<เหล่า> cadet_invited:<อายุ> saw_navy saw_airforce saw_police good_student
# ทุกทางที่ตั้ง cadet_dream นัด cadet_tell_family ก่อน แล้วค่อย cadet_prep_choice (ทั้งสองใบอยู่ใน cadet_prep.yaml)
# การ์ดชวนอายุ 14–17 เป็นใบกองสุ่ม อายุละใบ · ใบปีนี้ไม่ออกถ้าปีก่อนออกไปแล้ว (ธง cadet_invited:<อายุก่อนหน้า>)
events:
  # >>> nl-writer b001 evt cadet_guidance_boy_01
  - id: cadet_guidance_boy_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2503, 2650]
    at_age: 13
    when: {sex: [ชาย], school: [lower]}
    title: "กระดาษแนะแนว"
    text: "คาบแนะแนว ครูแจกกระดาษให้เขียนว่าจบ ม.สามแล้วจะไปทางไหน บอร์ดหลังห้องมีใบปลิวติดซ้อนกันเต็ม ทั้งมหาวิทยาลัย วิทยาลัยเทคนิค เกษตร พยาบาล และเตรียมทหาร เพื่อนข้างโต๊ะเขียนเสร็จไปแล้ว {ชื่อ} ยังถือดินสอค้างอยู่"
    choices:
      - id: uni
        text: "ตั้งใจเรียน ต่อมหาวิทยาลัย"
        hint: "ต้องอ่านหนักไปอีกหลายปี"
        effects: {knowledge: 1, happiness: -1}
        sets_flags: [good_student]
        merit: [{cat: neutral}]
      - id: vocational
        text: "เรียนสายอาชีพ มีวิชาติดตัว"
        hint: "ได้ฝึกมือได้ทำงานเร็ว"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: cadet
        text: "สอบเตรียมทหาร เป็นนายร้อย"
        hint: "ไม่เสียค่าเทอม แต่ต้องสอบแข่ง"
        effects: {knowledge: 1, happiness: -1}
        sets_flags: [cadet_dream]
        schedules:
          - {event: cadet_senior_visit_01, after_years: [0, 0]}
          - {event: cadet_senior_neighbor_01, after_years: [0, 0]}
        merit: [{cat: neutral}]
      - id: help_home
        text: "ช่วยงานบ้าน หาเงินให้เร็ว"
        hint: "ได้เงินเร็ว เวลาเรียนน้อยลง"
        effects: {relations: 1, knowledge: -1, money: {unit: income_x, amount: 0.3}}
        merit: [{cat: neutral}]
      - id: not_sure
        text: "ยังไม่รู้ ขอใช้ชีวิตไปก่อน"
        hint: "ยังมีเวลาคิด"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
