  - id: cadet_senior_visit_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2503, 2650]
    when: {sex: [ชาย], school: [lower], flags: {has: [cadet_dream], not: [knows_senior]}}
    title: "รุ่นพี่สี่เหล่า"
    text: "สัปดาห์นั้นรุ่นพี่ศิษย์เก่าที่สอบติดเตรียมทหารกลับมาเยี่ยมโรงเรียน ครูแนะแนวเห็นกระดาษของ {ชื่อ} เลยนัดให้มาเจอที่ห้องแนะแนว รุ่นพี่สี่คนจะแยกไปทหารบก ทหารเรือ ทหารอากาศ และตำรวจ บอกว่าวันนี้แค่มาเล่าให้ฟัง เลือกทางไหนก็ได้"
    choices:
      - id: army
        text: "คุยกับรุ่นพี่ที่จะไปทหารบก"
        effects: {happiness: 1}
        sets_flags: ["cadet_lean:army", knows_senior, cadet_met_senior]
        schedules:
          - {event: cadet_tell_family, after_years: [0, 0]}
          - {event: cadet_prep_choice, after_years: [1, 1]}
        merit: [{cat: neutral}]
      - id: navy
        text: "คุยกับรุ่นพี่ที่จะไปทหารเรือ"
