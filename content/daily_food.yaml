        merit: [{cat: neutral}]
      - id: rice_first
        text: "กินข้าว เก็บชานมไว้วันหลัง"
        effects: {health: 1}
        merit: [{cat: neutral}]
      - id: sniff_cup
        text: "ขอดมแก้วเพื่อนแล้วกินข้าวตาม"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนยื่นแก้วให้ดมจริง ข้าวในจานรสดีขึ้นอย่างไม่มีเหตุผล", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เพื่อนกอดแก้วเดินหนี บอกว่าวันนี้คุณน่ากลัวกว่าครูฝ่ายปกครอง", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_walkway_grill_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "ทางเท้าแคบกลิ่นปิ้งย่าง"
    text: "ขากลับจากงานต้องเดินผ่านแผงลอยเรียงแน่นจนทางเหลือกว้างเท่าตัว ควันหมูย่างลอยมาเต็มหน้า ข้างหลังมีมอเตอร์ไซค์บีบแตร ข้างหน้าคนซื้อยืนรอไม้ มื้อเย็นคนแถวนี้ฝากท้องกับแผงพวกนี้กันแทบทั้งซอย รวมทั้งคุณด้วย"
    choices:
      - id: stop_buy
        text: "แวะซื้อ ยืนรอกลางทางเดินนี่แหละ"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: wave_bikes
        text: "รอไม้ไปด้วย ช่วยโบกมอเตอร์ไซค์"
        effects: {relations: 2, happiness: -1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: detour
        text: "เดินอ้อมไปตลาดอีกฝั่ง"
        effects: {health: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: inhale_meal
        text: "สูดควันเต็มปอด ถือว่าอิ่มแล้ว"
        outcomes:
          - {weight: 1, ok: true, text: "ถึงบ้านยังจำรสได้ กินข้าวกับไข่ต้มก็เหมือนมีหมูย่างอยู่ในจาน", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สูดแรงไปจนสำลัก ชนป้าถือถุงน้ำจิ้ม เสื้อทำงานหอมกลิ่นนั้นไปอีกสามวัน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_stall_moved_01
    type: A
    category: society
    stage: กลางคน
    years: [2500, 2650]
    weight: 1
    when: {age: [46, 59], region: [กรุงเทพฯ และปริมณฑล]}
    title: "แผงปากซอยต้องย้าย"
    text: "แม่ค้าข้าวเหนียวหมูปากซอยที่ขายให้คุณมาหลายปีบอกว่าเจ้าหน้าที่เขตมาวัดทางเท้า ต้องเหลือที่ให้คนเดินเมตรครึ่ง แผงของเธอเกินไปนิดเดียว พรุ่งนี้อาจต้องย้ายไปอีกฟาก เธอถามว่าคุณจะตามไปกินไหม มือยังห่อข้าวเหนียวไม่หยุด"
    choices:
      - id: follow_stall
        text: "ตามไปอุดหนุนที่ใหม่"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: petition
        text: "ลงชื่อกับคนในซอยเสนอเขต"
        outcomes:
          - {weight: 1, ok: true, text: "ได้ชื่อครบสามสิบคน เขตยอมให้แผงอยู่ที่เดิมถ้าร่นเข้าอีกหน่อย", effects: {relations: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หนังสือเข้าเขตไปแล้ว ตอบกลับมาตอนแผงย้ายเสร็จได้สองเดือน", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: let_go
        text: "ปล่อยไปตามระเบียบ หาร้านใหม่"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: tape_measure
        text: "เอาตลับเมตรออกมาวัดเอง"
        outcomes:
          - {weight: 1, ok: true, text: "เหลือเมตรครึ่งพอดีถ้าดึงร่มเข้าคืบเดียว เจ้าหน้าที่พยักหน้าแล้วเดินไปแผงถัดไป", effects: {relations: 2, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ทางเท้าขาดจริงสิบเซนติเมตร ตั้งแต่วันนั้นคนทั้งซอยเรียกคุณว่าช่างเขต", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

