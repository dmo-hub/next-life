# การ์ดชีวิตประจำวันไทยชุด food (ใบ 239 จากร่าง 238)
events:
  - id: food_kratha_split_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [22, 30]}
    title: "โต๊ะนี้หารเท่า"
    text: "วันได้เงินก้อน แก๊งเดิมนัดร้านหมูกระทะ มันหมูชิ้นเดียวทาวนรอบเตา น้ำซุปขอบกระทะเดือดปุด คุณนั่งคีบวุ้นเส้นมาครึ่งชั่วโมง เพื่อนฝั่งตรงข้ามเพิ่งสั่งกุ้งเพิ่มสองจานกับน้ำอัดลมขวดใหญ่ แล้วหันมาบอกว่าเดี๋ยวหารเท่านะ"
    choices:
      - id: eat_worth
        text: "ลงกุ้งเต็มเตา กินให้คุ้มค่าหาร"
        outcomes:
          - {weight: 1, ok: true, text: "คีบทันจานสุดท้าย อิ่มเท่าค่าหารพอดี เดินกลับห้องช้ากว่าปกติครึ่งชั่วโมง", effects: {happiness: 2, health: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กินเร่งจนจุกตั้งแต่ก่อนเก็บเงิน คืนนั้นนอนตะแคงได้ข้างเดียว", effects: {health: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: split_even
        text: "หารเท่า ไม่พูดอะไร"
        effects: {relations: 1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: own_share
        text: "ขอคิดเฉพาะของที่ตัวเองกิน"
        effects: {relations: -1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: soup_revenge
        text: "ซดน้ำซุปขอบกระทะเอาคืน"
        outcomes:
          - {weight: 1, ok: true, text: "ซดจนเพื่อนต้องเรียกเติมอีกกา ทั้งโต๊ะยกให้คุณเป็นคนคุ้มที่สุดของคืนนี้", effects: {happiness: 2, relations: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "น้ำซุปเค็มกว่าที่คิด ลุกไปกินน้ำกลางดึกสามรอบ", effects: {health: -1, happiness: 1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_somtam_contest_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], occupation: [factory, clerk, technician, professional, manager]}
    title: "ตัวแทนแผนกลงแข่งตำส้ม"
    text: "งานประจำจังหวัดปีนี้มีแข่งตำส้ม ครกไม้เรียงบนเวที กรรมการถือช้อนรอชิมทีละจาน หัวหน้าส่งชื่อคุณเป็นตัวแทนแผนก เพราะเคยคุยในวงข้าวว่ามือหนัก ทั้งที่ปีนี้ทั้งปีคุณตำแต่น้ำพริกถ้วยเล็ก"
    choices:
      - id: go_stage
        text: "ขึ้นเวที ตำตามมือตัวเอง"
        outcomes:
          - {weight: 1, ok: true, text: "เส้นมะละกอไม่กระเด็น รสไม่ขาดไม่เกิน ได้ที่สามพร้อมครกใบใหม่กลับมาตั้งโต๊ะทำงาน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "สากลงแรงไป มะละกอกระเด็นใส่โต๊ะกรรมการ ปีหน้าเขาคงจำชื่อแผนกคุณได้", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: cheer_side
        text: "ยกให้เพื่อน ขอยืนเชียร์ข้างเวที"
        effects: {relations: 1}
        merit: [{cat: neutral}]
      - id: practice
        text: "ซ้อมตำทุกเย็นจนถึงวันแข่ง"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: ten_chili
        text: "ใส่พริกสิบเม็ด ให้กรรมการจำได้"
        outcomes:
          - {weight: 1, ok: true, text: "กรรมการน้ำตาไหลแต่ตักอีกคำ ได้รางวัลพิเศษที่เพิ่งคิดกันสด ๆ บนเวที", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "กรรมการคนแรกขอน้ำ คนที่สองขอพัก จานของคุณถูกวางแยกไว้ปลายโต๊ะ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_curry_queue_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], occupation: [clerk, technician, professional, manager]}
    title: "พักเที่ยงเหลือสิบห้านาที"
    text: "ประชุมลากยาวจนเหลือพักสิบห้านาที หน้าร้านข้าวแกงคนต่อแถวถึงตู้น้ำ ถาดแกงเหลือครึ่ง ป้าถือทัพพีรอคำตอบจากคนข้างหน้าที่ยังชี้ไปชี้มาเหมือนกำลังซื้อบ้าน"
    choices:
      - id: stand_queue
        text: "ยืนรอ สั่งสองอย่างราดข้าว"
        outcomes:
          - {weight: 1, ok: true, text: "ได้แกงก้นถาดเข้มข้นที่สุด กินหมดในหกนาที กลับถึงโต๊ะทันพอดี", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถึงคิวเหลือแต่น้ำแกงกับไข่พะโล้ใบเดียว เข้าประชุมบ่ายพร้อมกลิ่นติดเสื้อ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bag_it
        text: "ซื้อใส่ถุงกลับไปกินที่โต๊ะ"
        effects: {happiness: 1, health: -1}
        merit: [{cat: neutral}]
      - id: skip_meal
        text: "ข้ามมื้อ ชงกาแฟซองแทน"
        effects: {health: -1, network: 1}
        merit: [{cat: neutral}]
      - id: same_as_front
        text: "บอกป้าว่าเอาเหมือนคนข้างหน้า"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าตักทันที ได้ผัดเผ็ดปลาดุกที่ไม่เคยคิดจะสั่ง อร่อยจนกลายเป็นเมนูประจำ", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนข้างหน้าสั่งใส่ปิ่นโตสี่เถา ป้าตักให้คุณครบชุด เย็นนี้ยังมีข้าวเหลือกิน", effects: {money: {unit: income_x, amount: -0.03}, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_cheap_plate_01
    type: A
    category: work_money
    stage: กลางคน
    years: [2500, 2650]
    weight: 1
    when: {age: [46, 59]}
    title: "ป้ายราคาประหยัดหน้าตลาด"
    text: "เดือนนี้ของแพงไปหมด ค่าไฟกับค่ารถกินเงินไปก่อนถึงกลางเดือน ร้านข้าวแกงหน้าตลาดติดป้ายใหม่ ราคาประหยัดจานละไม่กี่สิบบาท กับข้าวน้อยลงหน่อยแต่ข้าวเติมได้ คนรู้จักหลายคนต่อแถวอยู่แล้ว ต่างคนต่างทำเป็นไม่เห็นกัน"
    choices:
      - id: every_day
        text: "กินร้านนี้ทุกวันจนสิ้นเดือน"
        effects: {money: {unit: income_x, amount: 0.05}, happiness: -1}
        merit: [{cat: neutral}]
      - id: pack_home
        text: "สลับกับห่อข้าวจากบ้าน"
        effects: {money: {unit: income_x, amount: 0.03}, health: 1}
        merit: [{cat: neutral}]
      - id: buy_friend
        text: "ซื้อเผื่อเพื่อนที่ตังค์หมด"
        effects: {relations: 2, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: neutral}]
      - id: all_extra
        text: "สั่งพิเศษทุกอย่าง ปลอบใจตัวเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าตักจนมองไม่เห็นข้าว ยังถูกกว่ากาแฟแก้วหนึ่ง วันนี้คุณชนะเศรษฐกิจไปหนึ่งจาน", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "พิเศษสามอย่างรวมแล้วแพงกว่าร้านเดิม ป้ายราคาประหยัดยังมองคุณอยู่", effects: {happiness: -1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: food_tea_or_lunch_01
    type: A
    category: health
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [14, 18], year: [2563, 2650], school: [lower, upper, voc]}
    title: "ชานมหรือข้าวเที่ยง"
    text: "ค่าขนมเหลือพอซื้อได้อย่างเดียว ข้าวในโรงอาหารหนึ่งจาน หรือชานมไข่มุกแก้วใหญ่หน้าโรงเรียนที่แพงกว่าข้าวอีก เพื่อนทั้งกลุ่มถือแก้วเดินมาถามว่าวันนี้คุณเอาหวานกี่เปอร์เซ็นต์ ท้องเริ่มร้องตั้งแต่คาบก่อนเที่ยง"
    choices:
      - id: tea
