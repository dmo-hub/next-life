        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mahout_early_supper_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "ช้างง่วงเร็ว มื้อค่ำต้องเลื่อน"
    text: "ควาญเพื่อนบ้านเล่าว่าช่วงนี้ช้างง่วงเร็ว เขาต้องเลื่อนมื้อสุดท้ายขึ้นมาเกือบชั่วโมง ไม่งั้นช้างกินแล้วย่อยไม่ดี วันนี้เขาติดธุระ ฝากคุณหิ้วตะกร้าอาหารไปวางที่จุดที่เขาเตรียมไว้ตามเวลาใหม่ แล้วยืนรอห่าง ๆ"
