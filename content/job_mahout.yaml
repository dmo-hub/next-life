# ร่างเรื่อง ควาญช้าง/คนดูแลช้างประจำตัว · 15 ใบ · ลงเกมแล้ว ใบ 319 · ผู้เล่นไม่ใช่ควาญ เป็นเด็กที่ยืนดูไกล ๆ ญาติที่ช่วยตัดกล้วยแบกหญ้า เพื่อนบ้านของควาญ นักท่องเที่ยว · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี · ไม่มี effects job
events:
  - id: mahout_bath_watch_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.25
    when: {age: [5, 12]}
    title: "ฟองขาวบนหลังช้าง"
    text: "ปิดเทอมไปค้างบ้านป้าต่างอำเภอ เช้านี้ป้าจูงมือคุณไปยืนดูบนตลิ่งไกล ๆ ลุงข้างบ้านกำลังขัดตัวช้างในลำห้วย ถูเครือสะบ้าจนฟองขาวเต็มหลัง ป้าบอกว่านี่คือสบู่ช้าง คุณสงสัยว่าตัวใหญ่ขนาดนี้ต้องใช้สบู่กี่ก้อน"
    choices:
      - id: mahout_kid_ask_soap
        text: "ถามป้าว่าสบู่ช้างทำจากอะไร"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_kid_shout_tail
        text: "ตะโกนบอกลุงว่าหางยังไม่ได้ขัด"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงหันมายกนิ้วให้ แล้วขัดหางให้ดูอย่างละเอียดทีละช่วง ป้าบอกว่าตาไวแบบนี้วันหลังมาช่วยถือตะกร้าได้", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เสียงคุณดังจนช้างหันมามองทั้งตัว ป้าจูงมือถอยไปอีกสองก้าว แล้วกระซิบว่าคนดูไกล ๆ ต้องดูเงียบ ๆ", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: mahout_kid_draw_foam
        text: "กลับบ้านวาดรูปช้างมีฟอง"
        effects: {happiness: 2}
        merit: [{cat: neutral}]
      - id: mahout_kid_call_friend
        text: "ชวนเด็กข้างบ้านมายืนดูด้วย"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]

  - id: mahout_banana_break_01
    type: A
    category: work_money
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 18]}
    title: "ตัดต้นกล้วยช่วงปิดเทอม"
    text: "ปิดเทอมนี้น้าชวนไปช่วยตัดต้นกล้วยหลังสวน เอาไปให้เพื่อนบ้านที่เป็นควาญ เพราะต้นกล้วยเป็นของที่ช้างต้องกินทุกวัน น้ากำชับว่าตัดแล้ววางกองไว้ริมรั้ว ห้ามถือเข้าไปหาช้างเอง กองแรกยังไม่ครบ ช้างที่ยืนอยู่ไกล ๆ ก็ยกงวงดมลมมาทางนี้แล้ว"
    choices:
      - id: mahout_banana_stack
        text: "ตัดให้ครบแล้ววางกองตามสั่ง"
        effects: {health: -1, relations: 1, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: help_others, level: 1}]
      - id: mahout_banana_bite_size
        text: "หั่นเป็นท่อนพอดีคำให้ช้าง"
        outcomes:
          - {weight: 1, ok: true, text: "ควาญหัวเราะแล้วขอบใจที่ใส่ใจ แล้วสอนวิธีวางกองให้หยิบง่ายจากริมรั้ว", effects: {knowledge: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "หั่นจนมือพองได้แค่ครึ่งกอง น้าบอกว่าที่คุณหั่นมาทั้งเช้า ช้างกวาดเข้าปากหมดในงวงเดียว", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: mahout_banana_wave
        text: "ยืนโบกมือให้ช้างจากริมรั้ว"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: mahout_banana_ask_menu
        text: "ถามน้าว่าช้างกินอะไรอีกบ้าง"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_banana_rest
        text: "ขอพักใต้ร่มก่อนค่อยตัดต่อ"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mahout_tamarind_ball_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.25
    when: {age: [13, 18]}
    title: "ขนมก้อนกลมของช้าง"
    text: "ลุงข้างบ้านนั่งปั้นมะขามเปียกคลุกเกลือเป็นก้อนเท่ากำปั้นวางเรียงบนกระด้ง คุณนึกว่าเป็นขนมเลยหยิบจะชิม ลุงหัวเราะบอกว่าของช้าง ช่วยให้ท้องมันระบาย แล้วชวนนั่งปั้นด้วยกันบนชานบ้าน ห่างคอกช้างพอสมควร"
    choices:
      - id: mahout_tamarind_roll
        text: "นั่งช่วยลุงปั้นจนหมดกะละมัง"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: help_others, level: 1}]
      - id: mahout_tamarind_taste
        text: "แอบชิมก้อนเล็ก ๆ สักก้อน"
        outcomes:
          - {weight: 1, ok: true, text: "เปรี้ยวเค็มจนตาหยี ลุงหัวเราะลั่นจนเพื่อนบ้านชะโงกมาดู คุณรีบกลืนแล้วขอน้ำ", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ท้องปั่นป่วนไปทั้งบ่าย ลุงเดินผ่านห้องน้ำแล้วตะโกนว่าบอกแล้วไงว่ามันช่วยระบาย", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: mahout_tamarind_ask_salt
        text: "ถามว่าทำไมต้องคลุกเกลือ"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_tamarind_go_home
        text: "ขอตัวกลับไปนอนเล่นที่บ้าน"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mahout_picky_grass_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "หญ้ากองนี้ไม่เอา"
    text: "คุณช่วยญาติที่เป็นควาญแบกหญ้ามาวางให้ช้าง เที่ยวที่สามแล้วช้างยังเขี่ยหญ้าชนิดหนึ่งออกข้างทุกครั้ง แต่อีกชนิดกินเกลี้ยง ญาติบอกว่าตัวนี้เลือกกินมาแต่ไหนแต่ไร คนเลี้ยงต้องจำให้ได้ว่ามันชอบอะไร"
    choices:
      - id: mahout_grass_remember
        text: "จำชนิดหญ้าที่ช้างชอบไว้"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_grass_hide_under
        text: "แอบซุกหญ้าที่ไม่ชอบไว้ใต้กอง"
        outcomes:
          - {weight: 1, ok: true, text: "ช้างกินเพลินจนหมดกอง ญาติชมว่าหัวไว แล้วขอให้มาช่วยแบกอีกหลายวัน", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ช้างใช้งวงคุ้ยหยิบเฉพาะชนิดที่ชอบ เหลือหญ้าที่ไม่ชอบเรียงเป็นแถวเหมือนคัดไว้คืนให้คุณดู", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: mahout_grass_carry_more
        text: "แบกชนิดที่มันชอบมาเพิ่ม"
        effects: {health: -1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: mahout_grass_ask_why
        text: "ถามญาติว่าทำไมมันไม่กิน"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: mahout_grass_shade
        text: "ขอพักดื่มน้ำใต้ร่มไม้"
        effects: {health: 1}
        merit: [{cat: neutral}]

  - id: mahout_selective_ear_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "ได้ยินแค่เสียงกล้วย"
    text: "ไปเที่ยวต่างจังหวัด คุณยืนดูควาญคนหนึ่งเรียกช้างขึ้นจากน้ำ เรียกชื่อสามรอบช้างยังแช่น้ำนิ่ง ควาญบอกคนดูว่ามันจำเขาได้ดี แค่ไม่อยากขึ้น พอเขาหยิบหวีกล้วยขึ้นมา ช้างหันหัวมาทันที"
    choices:
      - id: mahout_ear_laugh
        text: "หัวเราะไปกับคนดูทั้งท่า"
        effects: {happiness: 2}
        merit: [{cat: neutral}]
      - id: mahout_ear_ask_months
        text: "ถามว่ากว่าจะคุ้นกันใช้กี่เดือน"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_ear_try_call
        text: "ขอลองเรียกชื่อมันบ้าง"
        outcomes:
          - {weight: 1, ok: true, text: "ช้างหันมาทางคุณ คนทั้งท่าปรบมือ ก่อนจะเห็นว่าคุณบังเอิญยืนอยู่ข้างตะกร้ากล้วยพอดี", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}], next: mahout_after_ya_01}
          - {weight: 1, text: "ช้างไม่กระดิกหูสักนิด ควาญบอกว่าขนาดเขาเรียกมันยังไม่หัน คนแปลกหน้าไม่ต้องหวัง", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}], next: mahout_after_ya_01}
        merit: [{cat: neutral}]
      - id: mahout_ear_buy_banana
        text: "ซื้อกล้วยฝากควาญไว้ให้มัน"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: mahout_ear_tell_friends
        text: "จำเรื่องนี้ไปเล่าให้เพื่อนฟัง"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: neutral}]

  - id: mahout_chatty_visitor_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.25
    when: {age: [19, 30]}
    title: "คุยเก่งแต่ช้างไม่ฟัง"
    text: "เพื่อนบ้านที่เป็นควาญชวนคุณเดินตามไปส่งช้างลงอาบน้ำ คุณคุยกับช้างไม่หยุดทั้งชมทั้งเรียก ช้างไม่หันมาสักครั้ง ส่วนเขาไม่พูดอะไรเลย แค่ยื่นมือไปแตะ ช้างก็เลี้ยวตาม เขายิ้มบอกว่าควาญเก่งไม่ต้องพูดมาก แค่แตะก็รู้เรื่อง"
    choices:
      - id: mahout_chatty_hush
        text: "ลองเดินเงียบ ๆ ตามหลังบ้าง"
        effects: {knowledge: 1, happiness: 1}
        merit: [{cat: neutral}]
      - id: mahout_chatty_touch
        text: "ขอลองแตะแบบเขาบ้าง"
        outcomes:
          - {weight: 1, ok: true, text: "เขาพาคุณไปยืนฝั่งที่ช้างถนัด ช้างหันมามองนิดหนึ่งแล้วเดินต่อ แค่นั้นคุณก็ยิ้มได้ทั้งวัน", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}], next: mahout_after_ya_01}
          - {weight: 1, text: "เขาบอกให้รอก่อน ช้างยังจำกลิ่นคุณไม่ได้ แล้วพาคุณถอยไปเดินข้างหลังแทน", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}], next: mahout_after_ya_01}
        merit: [{cat: neutral}]
      - id: mahout_chatty_sing
        text: "เปลี่ยนเป็นร้องเพลงให้ช้างฟัง"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: mahout_chatty_ask
        text: "ถามว่าช้างเข้าใจคนได้ยังไง"
        effects: {knowledge: 2}
        merit: [{cat: neutral}]
      - id: mahout_chatty_carry
        text: "ช่วยถือถังกับแปรงขัดให้เขา"
        effects: {relations: 1, health: -1}
        merit: [{cat: help_others, level: 1}]

  - id: mahout_sleepy_name_01
    type: A
    category: society
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.25
    when: {age: [31, 45]}
    title: "ชื่อที่เรียกผิดตอนตีห้า"
    text: "เพื่อนบ้านที่เป็นควาญตื่นแต่มืดไปเก็บกวาดที่ช้างนอน คุณตื่นมาช่วยแบกหญ้าก่อนเข้างาน เขายังลืมตาไม่เต็มที่ ร้องเรียกช้างด้วยชื่อหลานตัวเองเสียงดังลั่น ช้างยืนนิ่งไม่ขยับ เหมือนรอให้เขาเรียกใหม่ให้ถูก"
    choices:
      - id: mahout_name_pretend
        text: "ทำเป็นไม่ได้ยิน แบกต่อเงียบ ๆ"
        effects: {relations: 1, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: mahout_name_tease
        text: "แซวว่าช้างตื่นกว่าคนเลี้ยง"
        outcomes:
          - {weight: 1, ok: true, text: "เขาหัวเราะจนหายง่วง เรียกชื่อถูกรอบเดียว ช้างก็เดินตามออกมาเหมือนรออยู่แล้ว", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาหันมาเรียกคุณด้วยชื่อช้างแทนไปทั้งเช้า ใครเดินผ่านซอยก็ได้ยินกันหมด", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: mahout_name_coffee
        text: "ชงกาแฟร้อนให้เขาแก้วหนึ่ง"
        effects: {relations: 1, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: mahout_name_call_right
        text: "ตะโกนชื่อที่ถูกแทนเขา"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: mahout_name_go_work
        text: "ขอตัวไปทำงานก่อนสาย"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]

  - id: mahout_napier_night_01
    type: A
    category: work_money
