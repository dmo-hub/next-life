# ทริปศาลขณะยังมีชีวิต (B153) — แกนแทรกเอง ไม่จั่วจากกอง: near → visit → คำใบ้ (content/rules/near-hints.yaml) → ฟื้น · ถือธง cheat_death แล้วถึงคราวตาย → summons → ตายปีเดิม
# ไม่มี effects ทุกใบ (ค่าสถานะเข้าสูตรชีวิต อายุตายจะเลื่อน) · near/visit ป้ายกลางล้วน · ด่าน court-shape
events:
  # ---- scene near: วินาทีเกือบตาย เลือกใบตามสาเหตุ ----
  - id: near_road_01
    type: B
    stage: ระหว่างชาติ
    scene: near
    near: road
    years: [2500, 2700]
    title: "เสียงเบรกยาว"
    text: "ไฟหน้ารถพุ่งเข้ามาเร็วกว่าที่คิด เสียงเบรกยาวจนหูอื้อ แล้วทุกอย่างก็เงียบสนิท เหมือนมีใครกดหยุดโลกไว้ครู่หนึ่ง พอลืมตาอีกที ตรงหน้าไม่ใช่ถนนแล้ว"
    choices: []

  - id: near_road_02
    type: B
    stage: ระหว่างชาติ
    scene: near
    near: road
    years: [2500, 2700]
    title: "มอเตอร์ไซค์ล้มกลางสี่แยก"
    text: "ล้อหน้าลื่นตรงแอ่งน้ำ ตัวลอยข้ามสี่แยกช้า ๆ เห็นป้ายร้านข้างทางชัดทุกตัวอักษร เสียงแตรรถรอบตัวค่อย ๆ จางหาย เหลือแต่เสียงลมหายใจตัวเอง"
    choices: []

  - id: near_accident_01
    type: B
    stage: ระหว่างชาติ
    scene: near
    near: accident
    years: [2500, 2700]
    title: "น้ำลึกกว่าที่เห็น"
    text: "เท้าเหยียบไม่ถึงพื้น น้ำเย็นไหลเข้าจมูก แสงแดดเหนือผิวน้ำไกลออกไปทุกที แล้วจู่ ๆ ก็ไม่หนาวอีกต่อไป มีแต่ความเงียบกับทางเดินที่ไม่รู้จัก"
    choices: []

  - id: near_accident_02
    type: B
    stage: ระหว่างชาติ
    scene: near
    near: accident
    years: [2500, 2700]
    title: "บันไดขั้นสุดท้าย"
    text: "บันไดเหล็กโยกใต้เท้า มือคว้าราวไม่ทัน ท้องฟ้าหมุนกลับหัว เสียงคนร้องเรียกชื่อดังมาจากข้างล่าง แล้วก็ขาดหายไปเหมือนมีใครปิดประตู"
    choices: []

  # ---- scene visit: เยือนศาล ----
  - id: court_visit_01
    type: B
    stage: ระหว่างชาติ
    scene: visit
    years: [2500, 2700]
    title: "ยังไม่ถึงคิว"
    text: "ห้องโถงยาวเต็มไปด้วยคนนั่งรอ เจ้าหน้าที่เปิดสมุดหาชื่อแล้วขมวดคิ้ว บอกว่ายังไม่ถึงเวลา แต่มาถึงแล้วก็ดูไว้สักหน่อย ว่าวันหนึ่งจะต้องกลับมายืนตรงไหน"
    choices:
      - text: "ขอดูสมุดหน้าของตัวเอง"
        merit: [{cat: neutral}]
      - text: "ถามว่าทำไมยังไม่ถึงคิว"
        merit: [{cat: neutral}]
      - text: "มองคนที่นั่งรออยู่รอบ ๆ"
        merit: [{cat: neutral}]
      - text: "รีบขอกลับไปก่อน"
        merit: [{cat: neutral}]

  - id: court_visit_02
    type: B
    stage: ระหว่างชาติ
    scene: visit
    years: [2500, 2700]
    title: "ตาชั่งที่ยังไม่นิ่ง"
    text: "กลางห้องมีตาชั่งคู่หนึ่งแกว่งไปมา ข้างหนึ่งมีชื่อตัวเองเขียนไว้ เจ้าหน้าที่บอกว่ามันยังไม่หยุด เพราะเจ้าของชื่อยังมีเวลาวางของเพิ่มได้อีกทั้งสองข้าง"
    choices:
      - text: "ถามว่าตอนนี้เอียงไปทางไหน"
        merit: [{cat: neutral}]
      - text: "จำภาพนี้ไว้ให้ดี"
        merit: [{cat: neutral}]
      - text: "นึกถึงเรื่องที่ค้างไว้ข้างบน"
        merit: [{cat: neutral}]
      - text: "หันหลังไม่อยากรู้"
        merit: [{cat: neutral}]

  - id: court_visit_03
    type: B
    stage: ระหว่างชาติ
    scene: visit
    years: [2500, 2700]
    title: "ประตูที่ยังเปิดอยู่"
    text: "ข้างหลังมีประตูบานหนึ่งยังเปิดแง้ม แสงข้างนอกเป็นสีเดียวกับเช้าวันธรรมดา เจ้าหน้าที่ชี้ไปทางนั้นแล้วบอกว่ากลับไปได้ ก่อนเดินออก จะถามอะไรอีกสักข้อก็ได้"
    choices:
      - text: "ถามว่าควรใช้ชีวิตยังไงต่อ"
        merit: [{cat: neutral}]
      - text: "ขอบคุณแล้วเดินออกไป"
        merit: [{cat: neutral}]
      - text: "ถามถึงคนที่จากไปก่อน"
        merit: [{cat: neutral}]
      - text: "วิ่งออกไปไม่หันกลับ"
        merit: [{cat: neutral}]

  # ---- scene summons: โกงความตายแล้วถูกเรียกตัว (ตายปีนี้อยู่แล้ว ลงบัญชีได้) ----
  - id: court_summons_01
    type: B
    stage: ระหว่างชาติ
    scene: summons
    years: [2500, 2700]
    title: "คนมารับไม่ผิดคน"
    text: "คืนนั้นมีคนแต่งกายสีเข้มยืนปลายเตียง ถือผ้ายันต์ผืนเดิมไว้ในมือ บอกเรียบ ๆ ว่าชื่อที่ยืมมาคืนเจ้าของแล้ว ส่วนเวลาของตัวเองก็ครบตั้งแต่ปีนี้ ไม่มีใครหนีบัญชีได้"
    choices:
      - text: "ยอมเดินตามไปเงียบ ๆ"
        merit: [{cat: neutral}]
      - text: "ขอเวลาลาคนในบ้านก่อน"
        merit: [{cat: neutral}]
      - text: "ขอโทษเจ้าของชื่อที่ยืมมา"
        merit: [{cat: bhavana, level: 1}]
      - text: "ต่อรองขอยืดอีกปี"
        merit: [{cat: neutral}]

  - id: court_summons_02
    type: B
    stage: ระหว่างชาติ
    scene: summons
    years: [2500, 2700]
    title: "ศาลเปิดนอกเวลา"
    text: "ห้องพิจารณาว่างเปล่า มีแค่โต๊ะตัวเดียวกับเจ้าหน้าที่ที่ถูกปลุกมากลางดึก เขาวางผ้ายันต์ลงบนโต๊ะแล้วถอนหายใจ บอกว่าคนที่ถูกลากมาแบบนี้ ต้องฟังคดีตัวเองก่อนใครเสมอ"
    choices:
      - text: "สารภาพเรื่องพิธีทั้งหมด"
        merit: [{cat: neutral}]
      - text: "ปฏิเสธว่าไม่รู้เรื่อง"
        merit: [{cat: neutral}]
      - text: "ถามว่าคนชื่อนั้นเป็นยังไง"
        merit: [{cat: neutral}]
      - text: "นั่งรอเงียบ ๆ ให้เขาเริ่ม"
        merit: [{cat: neutral}]
