# ร่างเรื่อง งานแต่ง สินสอด · 15 ใบ · ลงเกมแล้ว ใบ 247 จากร่าง 246 · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นแขก ญาติ เพื่อน คนกั้นประตู คนรับซอง คนทำครัว เถ้าแก่ เพื่อนบ้าน เสมอ · ไม่อ่านและไม่ตั้งธง · ไม่ผูกปี
events:
  - id: bridal_gate_kid_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [5, 12]}
    title: "ด่านสายสร้อยหน้าบ้าน"
    text: "บ้านญาติจัดงานแต่ง ผู้ใหญ่ยื่นสายสร้อยเส้นยาวให้คุณกับเด็ก ๆ ในบ้านถือกั้นทาง บอกว่าใครจะผ่านต้องมีซองก่อน ขบวนเจ้าบ่าวมาถึงแล้ว ลุงฝั่งนั้นย่อตัวลงมายิ้มถามว่า ด่านนี้คิดเท่าไรดีครับคุณเจ้าหน้าที่"
    choices:
      - id: bridal_kid_open_gate
        text: "รับซองแล้วเปิดทางให้"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: bridal_kid_ask_aunt
        text: "หันไปถามป้าว่าเอาเท่าไร"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: bridal_kid_hold_chain
        text: "กำสายสร้อยแน่น ไม่ยอมปล่อย"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงควักซองเพิ่มอีกใบ ทั้งขบวนปรบมือให้ด่านที่ต่อไม่ลง คุณเดินวนถือซองอวดอยู่จนเที่ยง", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ถือนานจนเลยเวลาที่ผู้ใหญ่นัดไว้ ป้าเดินมาแกะนิ้วคุณออกทีละนิ้ว แล้วขอโทษฝั่งนั้นแทน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bridal_kid_share_small
        text: "แบ่งซองให้เด็กคนเล็กที่ร้องไห้"
        effects: {relations: 2}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_kid_ice_toll
        text: "ขอค่าผ่านเป็นไอติมสิบแท่ง"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงส่งคนวิ่งไปร้านปากซอยจริง ๆ ขบวนรอไอติมกันทั้งแถว เด็กทุกคนบอกว่านี่คืองานแต่งที่ดีที่สุดในชีวิต", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงให้ซองแทนแล้วเดินผ่านไป พอเปิดดู คุณไม่รู้ว่าเงินในนั้นซื้อไอติมได้กี่แท่ง จนเด็กคนโตบอกว่าไม่ถึงสิบ", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_kitchen_errand_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [8, 12]}
    title: "เด็กวิ่งครัวงานแต่ง"
    text: "ครอบครัวมุสลิมข้างบ้านจัดงานแต่ง ญาติกับเพื่อนบ้านทั้งซอยมาช่วยกันตั้งครัวรับแขกตั้งแต่เช้า คุณตัวเล็กพอจะมุดผ่านหม้อใบใหญ่ได้เลยถูกใช้ไม่หยุด ป้าคนหนึ่งตะโกนบอกให้ไปหยิบของ แต่คุณได้ยินไม่ทันว่าอะไร"
    choices:
      - id: bridal_errand_ask_again
        text: "กลับไปถามป้าอีกรอบ"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_errand_guess
        text: "วิ่งไปหยิบสิ่งที่คิดว่าใช่"
        outcomes:
          - {weight: 1, ok: true, text: "หยิบหอมแดงมาถูกพอดี ป้าเอามือลูบหัวแล้วตักขนมใส่ถ้วยให้ก่อนแขกจะได้กิน", effects: {happiness: 2, relations: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ป้าขอน้ำตาล คุณถือเกลือมาทั้งถุง ทั้งครัวหัวเราะแล้วสั่งให้วิ่งอีกเที่ยว", effects: {health: -1, happiness: 1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: neutral}]
      - id: bridal_errand_learn_pound
        text: "ขอหัดตำเครื่องแกงกับป้า"
        effects: {knowledge: 2, health: -1}
        merit: [{cat: neutral}]
      - id: bridal_errand_hide
        text: "แอบไปนั่งหลบแดดหลังบ้าน"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: bridal_errand_whole_basket
        text: "ยกมาทั้งตะกร้า ให้ป้าเลือกเอง"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าเลือกของที่ต้องการได้ในพริบตา แล้วเรียกคุณว่าตะกร้าเดินได้ทั้งวัน คนทั้งครัวเรียกใช้กันไม่หยุด", effects: {happiness: 2, network: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ก้นตะกร้าหลุดกลางครัว หอมกลิ้งไปถึงหน้าประตู คุณคลานเก็บอยู่นานกว่าทำกับข้าวเสียอีก", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_drum_line_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [13, 18], school: [lower, upper, voc]}
    title: "โดนดึงเข้าขบวนกลองยาว"
    text: "ขบวนขันหมากบ้านท้ายซอยแห่ผ่านหน้าบ้านพร้อมกลองยาว คุณแค่ออกมายืนดู แต่ป้าคนหนึ่งในขบวนคว้าข้อมือดึงเข้าแถว แดดเปรี้ยง ทุกคนรำกันหมด เพื่อนร่วมห้องยืนอยู่ฝั่งตรงข้ามพอดี และคุณยังถือถุงกับข้าวอยู่ในมือ"
    choices:
      - id: bridal_drum_dance_along
        text: "รำตามไปจนถึงบ้านเจ้าสาว"
        outcomes:
          - {weight: 1, ok: true, text: "รำไม่เป็นแต่รำเต็มที่ ถึงบ้านเจ้าสาวมีคนยื่นน้ำเย็นให้เหมือนเป็นญาติแท้ ๆ กับข้าวถึงบ้านช้าไปชั่วโมงหนึ่ง", effects: {happiness: 2, network: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รำเพลิน ถุงกับข้าวแกว่งจนน้ำแกงซึมเลอะขา เพื่อนร่วมห้องจำท่านี้ไปเล่าต่อถึงวันจบการศึกษา", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bridal_drum_carry_tray
        text: "ขอช่วยยกพานแทนการรำ"
        effects: {relations: 2, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_drum_slip_out
        text: "ยิ้มแล้วค่อย ๆ หลุดออกจากแถว"
        effects: {health: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: bridal_drum_ask_beat
        text: "ขอคนตีกลองสอนจังหวะ"
        effects: {knowledge: 2, network: 1}
        merit: [{cat: neutral}]
      - id: bridal_drum_school_move
        text: "งัดท่าเต้นกีฬาสีมาใส่ขบวน"
        outcomes:
          - {weight: 1, ok: true, text: "คนตีกลองเร่งจังหวะตาม ทั้งขบวนรำท่ากีฬาสีกันเป็นแถว เถ้าแก่เดินนำยังแอบขยับไหล่", effects: {happiness: 2, relations: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ท่าที่สามทำเอาคุณชนพานผลไม้ ส้มกลิ้งลงถนน เด็กข้างทางเก็บไปกินหมดก่อนใครจะนับทัน", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_keepsake_short_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [15, 18]}
    title: "ของชำร่วยเหลือสามชิ้น"
    text: "ญาติขอให้คุณยืนแจกของที่ระลึกหน้างาน แขกคนละชิ้นตอบแทนที่มาร่วมงาน ตอนนี้ในกล่องเหลือสามชิ้น แต่แขกยังเดินออกมาเป็นแถว ลุงที่ใส่ซองหนาที่สุดในงานกำลังเดินมาถึง คุณรู้เพราะลุงพูดเองตั้งแต่หน้าประตู"
    choices:
      - id: bridal_keepsake_queue
        text: "แจกตามคิว หมดแล้วขอโทษ"
        effects: {relations: 1, knowledge: 1, network: -1}
        merit: [{cat: neutral}]
      - id: bridal_keepsake_save_elders
        text: "เก็บไว้ให้ผู้สูงอายุที่เดินช้า"
        effects: {relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_keepsake_flowers
        text: "ไปเก็บดอกไม้หน้างานมาแจกแทน"
        outcomes:
          - {weight: 1, ok: true, text: "แขกที่ได้ดอกไม้ถือกลับบ้านอย่างงง ๆ แต่ยิ้ม เจ้าภาพผ่านมาเห็นแล้วพยักหน้าให้คุณ", effects: {happiness: 2, network: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ดอกไม้ที่เด็ดคือซุ้มหน้างานที่ยังถ่ายรูปกันไม่เสร็จ ญาติเจ้าสาวเดินมาตามหาคนเด็ด", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bridal_keepsake_tell_host
        text: "วิ่งไปบอกเจ้าภาพให้รู้ก่อน"
        effects: {relations: 1, health: -1, network: 1}
        merit: [{cat: neutral}]
      - id: bridal_keepsake_reserved
        text: "บอกลุงว่าเหลือแต่รุ่นพิเศษ"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงรับของที่ระลึกไปด้วยสองมือ เล่าต่อให้ทั้งโต๊ะฟังว่าตัวเองได้รุ่นพิเศษ แขกที่เหลือเลยไม่กล้าบ่นว่าไม่ได้", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แขกคนถัดไปขอรุ่นพิเศษบ้าง คุณยืนอธิบายว่าสองชิ้นนี้ต่างกันตรงไหนทั้งที่เหมือนกันทุกอย่าง", effects: {relations: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_mc_mic_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [22, 30]}
    title: "พิธีกรจำเป็น ไมค์ดับ"
    text: "เพื่อนขอให้คุณเป็นพิธีกรงานเลี้ยงเพราะเห็นว่าคุยเก่ง คุณกำลังอ่านรายชื่อญาติสองฝั่งจากกระดาษที่เขียนมาทั้งคืน ไมค์ดับกลางคำว่าขอเรียนเชิญ แขกทั้งงานมองขึ้นเวที ลุงโต๊ะหน้าตะโกนว่าไม่ได้ยินเลย"
    choices:
      - id: bridal_mc_shout
        text: "ตะโกนเรียกชื่อต่อด้วยเสียงจริง"
        effects: {health: -1, relations: 2, happiness: 1}
        merit: [{cat: neutral}]
      - id: bridal_mc_call_tech
        text: "ขอเวลาครู่หนึ่ง เรียกช่างเสียง"
        effects: {knowledge: 1, network: 1}
        merit: [{cat: neutral}]
      - id: bridal_mc_elder_story
        text: "ชวนญาติคนโตขึ้นมาเล่าเรื่องแทน"
        outcomes:
          - {weight: 1, ok: true, text: "ญาติคนโตเล่าเรื่องเจ้าสาวตอนเด็กจนทั้งงานหัวเราะ ไมค์กลับมาตอนไหนไม่มีใครสังเกต เพื่อนกอดคุณจนเครื่องสำอางเลอะ", effects: {happiness: 2, relations: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เล่ายาวจนพ้นเวลาเปิดฟลอร์ เจ้าภาพส่งสายตามาทางคุณว่าช่วยจบให้หน่อย แต่ไม่มีใครกล้าขึ้นไปพูด", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bridal_mc_sing_cover
        text: "ร้องเพลงคั่นไปก่อนสักเพลง"
        effects: {happiness: 1, network: 1, health: -1}
        merit: [{cat: neutral}]
      - id: bridal_mc_mime
        text: "แสดงละครใบ้บอกชื่อญาติทีละคน"
        outcomes:
          - {weight: 1, ok: true, text: "โต๊ะหน้าทายชื่อกันเสียงดังเหมือนเล่นเกม ลุงเจ้าของชื่อยืนรับเสียงปรบมือ งานนี้พูดถึงไปอีกหลายปี", effects: {happiness: 2, network: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ท่าของคุณดูเหมือนกำลังขอความช่วยเหลือ คนเดินเสิร์ฟวางแก้วน้ำแล้วพาคุณลงจากเวทีอย่างนุ่มนวล", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_tray_bearer_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [19, 30]}
    title: "คนต่อท้ายแถวขันหมาก"
    text: "คุณเป็นเพื่อนเจ้าบ่าวที่มาสาย เลยได้ยืนท้ายขบวนต่อจากเถ้าแก่กับคนยกขันหมากคนอื่น ๆ พานใบที่เหลือคือใบหนักสุด ทั้งกล้วยทั้งอ้อย ทางถึงบ้านเจ้าสาวไกลกว่าที่ใครบอก แขนคุณเริ่มสั่นตั้งแต่ก้าวที่ยี่สิบ"
    choices:
      - id: bridal_bearer_endure
        text: "กัดฟันเดินจนถึงบ้าน"
        effects: {health: -2, relations: 2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_bearer_swap
        text: "ขอสลับพานกับเพื่อนครึ่งทาง"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนรับไปโดยไม่พูดอะไร แล้วคืนให้ตอนถึงหน้าบ้านพอดี คนถ่ายรูปได้ภาพคุณยิ้มสบายเหมือนยกมาคนเดียว", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ตอนส่งต่อกันอ้อยเอียง แถวข้างหลังต้องหยุดทั้งขบวน เถ้าแก่หันมามองโดยไม่ต้องพูดอะไร", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: bridal_bearer_shade
        text: "เดินชิดรั้วที่มีเงาตลอดทาง"
        effects: {health: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: bridal_bearer_help_elder
        text: "เดินเป็นเพื่อนผู้ใหญ่ท้ายแถว"
        effects: {relations: 2, network: 1, health: -1}
        merit: [{cat: help_others, level: 1}]
      - id: bridal_bearer_dance_tray
        text: "เต้นตามกลองแบบไม่วางพาน"
        outcomes:
          - {weight: 1, ok: true, text: "คุณขยับไหล่ไปกับจังหวะ พานไม่เอียงสักนิด ญาติฝั่งเจ้าสาวชี้มาทางคุณแล้วถามว่าคนนี้มีแฟนหรือยัง", effects: {happiness: 2, network: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กล้วยหนึ่งหวีไถลตกจากพาน คนในขบวนหลบกันเป็นทาง เจ้าบ่าวหันมาทำตาเหมือนจะเลิกคบ", effects: {relations: -2, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: bridal_envelope_sum_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    title: "การ์ดเชิญใบที่สามของเดือน"
    text: "เดือนนี้มีการ์ดงานแต่งใบที่สามวางบนโต๊ะ เป็นคนรู้จักที่เคยช่วยคุณไว้ ซองสองใบแรกกินงบเดือนนี้ไปเยอะแล้ว ถ้าใส่น้อยก็กลัวเขาอ่านออกว่าคิดกันแค่นี้ ถ้าใส่เท่าที่ควรก็ต้องรัดเข็มขัดไปอีกครึ่งเดือน"
    choices:
      - id: bridal_sum_as_afford
        text: "ใส่เท่าที่ไหว ไม่คิดมาก"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.01}, relations: -1}
