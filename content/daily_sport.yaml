# การ์ดชีวิตประจำวันไทยชุด sport (ใบ 239 จากร่าง 238)
events:
  - id: sport_takraw_ring_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [8, 12], school: [primary, lower]}
    title: "วงตะกร้อที่ไม่มีใครยอมออก"
    text: "เลิกเรียนแล้ววงตะกร้อยังตั้งอยู่กลางลานโรงเรียน ลูกตกพื้นทุกสามเตะ แต่ไม่มีใครยอมออกจากวงเพราะกลัวเสียที่ รุ่นพี่คนหนึ่งเงยหน้ามาถามคุณว่าจะเอายังไง"
    choices:
      - id: join_ring
        text: "แทรกตัวเข้าวงเลย"
        outcomes:
          - {weight: 1, ok: true, text: "เตะโดนด้วยข้างเท้าครั้งแรก ลูกลอยข้ามหัวรุ่นพี่ไปจริง ๆ ทั้งวงร้องเฮ", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เตะวืดสามครั้งติด ครั้งที่สี่ล้มก้นกระแทก แต่ไม่มีใครไล่ออกจากวง", effects: {relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: fetch_ball
        text: "อาสาวิ่งเก็บลูกก่อน"
        effects: {health: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: solo_practice
        text: "ไปหัดเดาะคนเดียวหลังอาคาร"
        effects: {health: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: self_referee
        text: "ประกาศตัวเป็นกรรมการกลางวง"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งวงยอมเพราะขี้เกียจเถียง ได้เป่านกหวีดด้วยปากจนมืด", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลูกตะกร้อมาเข้าหน้าพอดีตอนกำลังตัดสิน ทั้งวงให้แต้มกับคนเตะ", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_estate_pitch_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [9, 12]}
    title: "สนามหญ้าในรั้วหมู่บ้าน"
    text: "สนามเล็กกลางหมู่บ้านจัดสรรหญ้าเรียบกว่าลานดินหลังวัดเยอะ กลุ่มคุณเลยเดินเข้ามาเตะบอลกันทุกเย็นทั้งที่ไม่มีใครบ้านอยู่ในนี้ วันนี้ลุงยามปั่นจักรยานมาจอดข้างสนาม ถามคุณคนแรกว่าบ้านเลขที่อะไร"
    choices:
      - id: tell_truth
        text: "บอกตรง ๆ ว่าอยู่นอกหมู่บ้าน"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงนิ่งไปพักหนึ่งแล้วบอกว่าเลิกก่อนมืดก็แล้วกัน พรุ่งนี้ยังมาได้", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลุงพาทั้งกลุ่มเดินออกประตู บอลอยู่ในมือคุณตลอดทางกลับ", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_insiders
        text: "ขอให้เด็กในหมู่บ้านช่วยพูด"
        effects: {relations: 1, network: 1}
        merit: [{cat: neutral}]
      - id: back_to_dirt
        text: "หอบบอลกลับไปลานดินหลังวัด"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: pole_number
        text: "ตอบเลขที่ที่เห็นบนเสาไฟ"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงจดลงสมุดแล้วปั่นต่อ เย็นนั้นกลุ่มคุณเตะจนครบสองครึ่ง", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เลขนั้นคือบ้านพักของลุงเอง กว่าจะได้เข้าสนามอีกก็อีกสามวัน", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_takraw_net_01
    type: A
    category: study
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [13, 16], school: [lower, upper, voc]}
    title: "ตะกร้อมีตาข่าย"
    text: "คาบพละครูขึงตาข่ายกลางสนามแบดแล้วบอกว่าวันนี้เรียนเซปักตะกร้อ ข้างละสามคน ห้ามใช้มือ เพื่อนในห้องเถียงกันทันทีว่าชื่อแบบนี้กีฬาไทยจริงหรือเปล่า ครูยื่นกติกาแผ่นเดียวให้คุณอ่านออกเสียงให้ทั้งห้องฟัง"
    choices:
      - id: read_rules
        text: "อ่านกติกาให้ทั้งห้องฟัง"
        effects: {knowledge: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: ask_name
        text: "ถามครูว่าชื่อนี้มาจากไหน"
        outcomes:
          - {weight: 2, ok: true, text: "ครูเล่าว่าเป็นชื่อที่สองชาติใช้ภาษาตัวเองร่วมกัน ห้องเงียบ เถียงกันต่อไม่ได้", effects: {knowledge: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครูให้ไปค้นมาเป็นการบ้าน ทั้งห้องหันมามองคุณพร้อมกัน", effects: {knowledge: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: serve_first
        text: "ขอลงสนาม เสิร์ฟก่อนเลย"
        outcomes:
          - {weight: 1, ok: true, text: "ลูกข้ามตาข่ายตั้งแต่ครั้งแรก ฝั่งตรงข้ามยืนมองกันเอง", effects: {health: 1, happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ลูกติดตาข่ายสามครั้งติด ครูบอกให้กลับไปอ่านแผ่นกติกาก่อน", effects: {knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: flying_kick
        text: "ขอลองกระโดดฟาดแบบในทีวี"
        outcomes:
          - {weight: 1, ok: true, text: "ขาฟาดโดนลูกจริงหนึ่งครั้งในชีวิต เพื่อนเล่าเกินจริงไปอีกหลายเทอม", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ขาเกี่ยวตาข่ายเสาล้มทั้งแถบ ครูให้คุณขึงใหม่จนหมดคาบ", effects: {health: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_class_bet_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.125
    when: {age: [14, 18], school: [lower, upper, voc]}
    title: "สมุดเล่มเล็กหลังห้อง"
    text: "พักเที่ยงเพื่อนหลังห้องจดชื่อลงสมุดเล่มเล็ก ใครจะทายผลบอลคืนนี้ต้องวางค่าขนมไว้ก่อน สัปดาห์ที่แล้วมีคนในห้องเสียจนไม่มีค่าข้าวไปสามวัน เขายื่นปากกามาให้คุณ บอกว่าใคร ๆ ก็เล่น"
    choices:
      - id: say_no
        text: "บอกว่าไม่เล่น แล้วกินข้าวต่อ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: small_stake
        text: "ลองวางแค่ค่าน้ำแก้วเดียว"
        outcomes:
          - {weight: 1, ok: true, text: "ทายถูกครั้งแรก สัปดาห์ถัดมาคุณวางเพิ่มเอง แล้วก็เสียคืนทั้งหมด", effects: {happiness: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "เสียไป ชื่อคุณยังอยู่ในสมุด เขาทักทุกเช้าว่าคืนนี้เอาคู่ไหน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: tell_teacher
        text: "เล่าให้ครูฟังตามตรง"
        effects: {knowledge: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: real_match
        text: "ท้าแข่งเตะจริงหลังเลิกเรียนแทน"
        outcomes:
          - {weight: 1, ok: true, text: "ลงสนามกันครึ่งห้อง สมุดเล่มเล็กถูกทิ้งไว้ในกระเป๋าทั้งเย็น", effects: {health: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "มาตามนัดสองคน เตะกันจนมืด วันรุ่งขึ้นหลังห้องหาว่าคุณทำวงเขาแตก", effects: {health: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: keep_pen
        text: "รับปากกาไว้ แล้วเดินกลับโต๊ะ"
        outcomes:
          - {weight: 1, ok: true, text: "ด้ามนี้เขียนลื่นจนคุณจดการบ้านด้วยมันทั้งเทอม เขาไม่เคยเดินมาทวง", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาเดินตามมาทวงปากกาถึงโต๊ะ ต่อหน้าเพื่อนทั้งแถวหน้า", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_cheer_card_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 23], school: [uni]}
    title: "แผ่นสีบนอัฒจันทร์"
    text: "เหลือสามสัปดาห์จะถึงฟุตบอลประเพณี ชมรมมายืนหน้าห้องเรียนหาคนซ้อมแปรอักษร พาเหรดก็ยังขาดคนแบกหุ่น ทุกคนรู้ว่าผลการแข่งขันไม่มีใครจำได้เกินสองปี แต่ไม่มีใครกล้าพูด สัปดาห์ซ้อมยังตรงกับสอบกลางภาคพอดี"
    choices:
      - id: full_card
        text: "ลงซ้อมแปรอักษรเต็มที่"
        effects: {happiness: 2, relations: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - id: backstage
        text: "ช่วยหลังฉาก เย็บหุ่นพาเหรด"
        effects: {relations: 1, network: 1}
        merit: [{cat: neutral}]
      - id: game_day_only
        text: "ไปแค่วันงาน"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: study_instead
        text: "อ่านหนังสือสอบดีกว่า"
        effects: {knowledge: 2, relations: -1}
        merit: [{cat: neutral}]
      - id: wrong_colour
        text: "แอบพลิกผิดสีให้รู้ว่ามีตัวตน"
        outcomes:
          - {weight: 1, ok: true, text: "จุดแดงจุดเดียวกลางคำอวยพร เพื่อนแถวหลังขำจนพลิกผิดตามทั้งแถว", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ประธานเชียร์นับแถวเจอคุณ ปีนี้ได้ยืนนับแถวแทนเขาจนจบงาน", effects: {happiness: -1, network: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_stadium_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [22, 30]}
    title: "แพ้ทีไรก็ยังไปสนาม"
    text: "เพื่อนคนเดิมชวนไปดูทีมชาติอีกแล้ว ทั้งที่นัดก่อนกลับบ้านมาด้วยเสียงแหบกับสกอร์ที่ไม่อยากเล่าต่อ รอบนี้ว่ากันว่าคนจะมาเต็มสนามกว่าสี่หมื่น ตั๋วโค้งไกลราคาเท่าข้าวสามวัน รถกลับบ้านหลังจบเกมก็อย่าหวัง"
    choices:
      - id: go_along
        text: "ไปด้วยกัน เสียงแหบก็แหบ"
        outcomes:
          - {weight: 1, ok: true, text: "ยิงนาทีสุดท้าย คนแปลกหน้ากอดคุณทั้งแถว ตอนนี้จำหน้ากันไม่ได้แล้ว", effects: {happiness: 3, relations: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 2, text: "แพ้เหมือนเดิม นั่งรอรถร้องเพลงเชียร์กับคนที่เพิ่งรู้จัก", effects: {happiness: 1, network: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: watch_home
        text: "ดูทีวีที่บ้าน เปิดเสียงดัง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: skip_ticket
        text: "ขอผ่าน ตั๋วแพงไป"
        effects: {relations: -1, health: 1}
        merit: [{cat: neutral}]
      - id: outside_only
        text: "ไปกินหมูปิ้งฟังเสียงหน้าสนาม"
        effects: {happiness: 1, relations: 1}
        merit: [{cat: neutral}]
      - id: face_paint
        text: "ทาหน้าสามสีนั่งรถเมล์ไปสนาม"
        outcomes:
          - {weight: 1, ok: true, text: "เด็กบนรถขอถ่ายรูปด้วย กระเป๋ารถเมล์ไม่เก็บค่าตั๋ว", effects: {happiness: 2, network: 1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เหงื่อไหลพาสีเข้าตาตั้งแต่ครึ่งแรก ดูจบด้วยตาข้างเดียว", effects: {happiness: 1, health: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_wc_night_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], occupation: [clerk, technician, professional, manager]}
    title: "นัดตีสอง ประชุมแปดโมง"
    text: "บอลโลกปีนี้ดูฟรีครบทุกนัด ฟังเป็นข่าวดีจนเปิดตารางแล้วเจอว่าคู่ที่รอเตะตีสอง ส่วนปฏิทินงานเขียนว่าแปดโมงเช้าต้องรายงานยอดต่อหน้าหัวหน้า เพื่อนร่วมงานยังเดินมาถามอยู่เลยว่าคืนนี้ใครไปร้านข้าวต้ม"
    choices:
      - id: alarm_2am
        text: "ตั้งปลุกตีสอง ดูให้ครบ"
        outcomes:
          - {weight: 1, ok: true, text: "ประตูชัยนาทีท้าย ตาค้างถึงเช้า พูดในห้องประชุมเร็วผิดปกติแต่รอด", effects: {happiness: 3, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ดูจบแล้วผล็อยหลับ ตื่นอีกทีแปดโมงสิบ หัวหน้าโทรมาเอง", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: morning_highlight
        text: "นอนปกติ ดูไฮไลต์ตอนเช้า"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: congee_shop
        text: "ไปร้านข้าวต้มกับเพื่อนจนสว่าง"
        effects: {network: 1, relations: 1, health: -1, money: {unit: income_x, amount: -0.05}}
        merit: [{cat: neutral}]
      - id: finish_report
        text: "ไม่ดู ทำรายงานให้เสร็จ"
        effects: {knowledge: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: five_coffees
        text: "ดูครบแล้วซดกาแฟห้าแก้วเข้าประชุม"
        outcomes:
          - {weight: 1, ok: true, text: "ได้เห็นประตูชัยสด ๆ พูดจบก่อนเวลาครึ่งชั่วโมง มือสั่นแต่ตัวเลขครบ", effects: {happiness: 2, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กาแฟเอาไม่อยู่ หลับคาเก้าอี้ตอนหัวหน้าถามความเห็น เสียงกรนเข้ารายงานการประชุม", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: sport_office_bet_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], occupation: [clerk, technician, professional, manager]}
    title: "คนเดินถามในครัวออฟฟิศ"
    text: "คืนนี้มีบอลนัดใหญ่ พี่ฝ่ายบัญชีเดินวนในครัวออฟฟิศถามทีละคนว่าเอาทีมไหน ข่าวว่าคนแทงบอลลงเฉลี่ยนัดละพันกว่าบาท แล้วก็ไม่ได้หยุดที่นัดเดียว คนโต๊ะข้างคุณเพิ่งขอเบิกเงินเดือนล่วงหน้าเมื่อวาน พี่คนนั้นมาหยุดตรงหน้าคุณพอดี"
    choices:
      - id: no_bet
        text: "ส่ายหน้า เปิดกล่องข้าวต่อ"
        effects: {relations: -1, money: {unit: income_x, amount: 0.05}}
        merit: [{cat: neutral}]
      - id: little_bet
        text: "ลงนิดหน่อยพอมีเรื่องคุย"
        outcomes:
          - {weight: 1, ok: true, text: "ได้คืนมาเท่าค่าข้าวเที่ยง นัดถัดมาพี่คนนั้นเดินมาหาคุณก่อนใคร", effects: {relations: -1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "บอกตัวเองว่านิดเดียว ปลายเดือนรวมเลขแล้วไม่นิด", effects: {happiness: -1, money: {unit: income_x, amount: -0.2}}, merit: [{cat: neutral}]}
