# การ์ดชีวิตประจำวันไทยชุด transit (ใบ 239 จากร่าง 238)
events:
  - id: transit_ticket_tube_01
    type: A
    category: society
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [7, 12], year: [2500, 2562]}
    title: "เสียงกระบอกท้ายรถ"
    text: "รถเมล์คันนี้โคลงทุกหลุม กระเป๋ารถเมล์เดินสวนมาจากท้ายรถ เขย่ากระบอกเก็บตั๋วดังแกร๊กแกร๊กเป็นจังหวะ คุณกำเหรียญค่ารถจนมือชื้น ลื่นนิดเดียวมันจะกลิ้งไปอยู่ใต้เบาะคนแปลกหน้า"
    choices:
      - id: hold_tight
        text: "กำไว้แน่น รอเขาเดินมาถึง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: show_early
        text: "ชูเหรียญให้เห็นแต่ไกล"
        outcomes:
          - {weight: 2, ok: true, text: "กระเป๋าพยักหน้า ฉีกตั๋วยื่นให้ถึงที่ คุณเก็บตั๋วไว้ในสมุดการบ้าน", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถเบรก เหรียญกระเด็น ผู้ใหญ่ครึ่งคันก้มหาให้ คุณอยากมุดตามเหรียญไปด้วย", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: ask_count
        text: "ถามว่ากระบอกนี้เก็บตั๋วกี่ใบ"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: shake_back
        text: "เขย่ากล่องดินสอตอบเป็นจังหวะ"
        outcomes:
          - {weight: 1, ok: true, text: "กระเป๋าหัวเราะ เขย่ากระบอกตอบสองที ทั้งรถได้ฟังวงดนตรีไปถึงตลาด", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ฝากล่องเปิดกลางทาง ดินสอไหลไปถึงหน้ารถ คนขับส่งยางลบคืนตอนติดไฟแดง", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_school_van_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 1
    when: {age: [7, 12], school: [primary, lower]}
    title: "แถวหลังรถรับส่ง"
    text: "รถรับส่งมาจอดปากซอยเวลาเดิมทุกเช้า ลุงคนขับจำได้ว่าใครเมารถ ใครลืมกระเป๋าประจำ เช้านี้เพื่อนแถวหลังเพิ่งนึกออกว่ามีการบ้านเลขต้องส่งคาบแรก แล้วทุกหัวในรถก็หันมามองสมุดของคุณ"
    choices:
      - id: lend_book
        text: "ส่งสมุดให้ลอกบนรถ"
        outcomes:
          - {weight: 1, ok: true, text: "ลอกทันก่อนถึงประตูโรงเรียน ค่าสมุดวันนี้คือขนมหนึ่งถุงเต็ม", effects: {happiness: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถตกหลุมพอดี เลขเจ็ดกลายเป็นเส้นยาวเหมือนกันทั้งแถว ครูจับได้ในสามวินาที", effects: {relations: -1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: recite
        text: "ท่องสูตรคูณคนเดียวจนถึงโรงเรียน"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: swap_snack
        text: "ชวนแลกขนมให้ลืมเรื่องการบ้าน"
        effects: {relations: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - id: ask_driver
        text: "ถามลุงคนขับว่าข้อเจ็ดตอบอะไร"
        outcomes:
          - {weight: 1, ok: true, text: "ลุงตอบทันทีตอนไฟแดง บอกว่าขับรถให้ครูเลขมาสิบปี ถูกเป๊ะแต่อธิบายวิธีทำไม่ได้", effects: {happiness: 2, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ลุงตอบอย่างมั่นใจ ทั้งรถเขียนตาม ทั้งรถผิดข้อเดียวกันหมด", effects: {happiness: 1, knowledge: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_third_class_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 1
    when: {age: [14, 18]}
    title: "ชั้นสามเบาะไม่เอน"
    text: "ปิดเทอมคุณนั่งรถไฟชั้นสามไปบ้านญาติคนเดียว เก้าอี้ตั้งฉากเอนไม่ได้ พัดลมเพดานส่ายมาหาทีละครึ่งนาที ลมหน้าต่างมีกลิ่นทุ่งปนควันเครื่อง ยังเหลืออีกเจ็ดชั่วโมง ป้าที่นั่งตรงข้ามเริ่มแกะห่อข้าว"
    choices:
      - id: sleep_upright
        text: "หลับทั้งที่นั่งตัวตรง"
        outcomes:
          - {weight: 1, ok: true, text: "ตื่นมาคอเอียง แต่ข้ามไปได้สี่สถานีแบบไม่ต้องรับรู้ ลงรถไปยังสดชื่น", effects: {happiness: 1, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คอพับทุกโค้ง สะดุ้งตื่นทีไรก็เจอป้ามองอยู่", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: talk_aunt
        text: "ชวนป้าตรงข้ามคุย"
        effects: {relations: 1, network: 1, health: -1}
        merit: [{cat: neutral}]
      - id: watch_field
        text: "ยกหน้าต่างขึ้นสุด นั่งดูทุ่ง"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: fan_bet
        text: "ท้าป้าทายว่าพัดลมจะหันมาหาใคร"
        outcomes:
          - {weight: 1, ok: true, text: "ครึ่งตู้มาร่วมวงเดิมพันด้วยขนมปัง ถึงปลายทางคุณได้ข้าวเหนียวไปสองห่อ", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "แพ้ป้าสามตาซ้อน ค่าปรับคือหิ้วตะกร้าให้จนถึงปลายทาง", effects: {health: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_canal_boat_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 30], year: [2533, 2650], region: [กรุงเทพฯ และปริมณฑล]}
    title: "เรือคลองขึ้นราคา"
    text: "เรือคลองเข้าท่าไม่เคยหยุดสนิท ต้องก้าวข้ามกราบให้ทันจังหวะ ป้ายหน้าท่าบอกขึ้นค่าเรือสองบาททุกระยะ ไปกลับทั้งเดือนก็เท่าข้าวราดแกงสองจาน แต่รถบนถนนเหนือคลองยังไม่ขยับมาตั้งแต่เมื่อวาน"
    choices:
      - id: keep_paying
        text: "จ่ายต่อ เรือยังเร็วกว่ารถ"
        effects: {happiness: 1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: move_room
        text: "ย้ายห้องไปใกล้ที่ทำงาน"
        outcomes:
          - {weight: 1, ok: true, text: "เดินสิบนาทีถึง ได้นอนเพิ่มทุกเช้า ค่าห้องแพงขึ้นแต่ไม่ต้องดมคลองอีก", effects: {happiness: 2, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ห้องใหม่อยู่เหนือร้านผัดกะเพรา เสื้อทุกตัวหอมตลอดวัน คนรอบตัวหิวเวลาคุณเดินผ่าน", effects: {happiness: -1, money: {unit: income_x, amount: -0.1}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: walk_pier
        text: "เดินเพิ่มหนึ่งท่าให้ระยะสั้นลง"
        effects: {health: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: back_to_bus
        text: "กลับไปนั่งรถเมล์ แล้วออกเร็วขึ้น"
        effects: {health: -1, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: neutral}]
      - id: tarp_duty
        text: "อาสาดึงผ้าใบแลกค่าเรือ"
        outcomes:
          - {weight: 1, ok: true, text: "น้ำคลองกระเซ็นมาพอดี คุณดึงทันทั้งแถว คนเก็บเงินส่ายหน้าแล้วยกให้เที่ยวหนึ่ง", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ดึงช้าไปจังหวะเดียว ทั้งแถวหันมามองคุณด้วยเสื้อเปียกครึ่งตัว", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_van_moved_01
    type: A
    category: society
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    when: {age: [19, 30], year: [2561, 2650]}
    title: "จุดขึ้นรถตู้ย้ายวันแรก"
    text: "เย็นวันศุกร์คุณจะนั่งรถตู้ไปต่างจังหวัด แต่จุดขึ้นรถย้ายไปอยู่ใต้ทางด่วนตั้งแต่เช้านี้ ป้ายใหม่ยังเขียนด้วยปากกาเมจิก คิวแต่ละสายปนกันจนไม่รู้ว่าแถวไหนของใคร เที่ยวสุดท้ายของสายคุณออกในอีกสี่สิบนาที"
    choices:
      - id: ask_staff
        text: "ถามเจ้าหน้าที่ที่ยืนโบกรถ"
        outcomes:
          - {weight: 1, ok: true, text: "เขาชี้แถวถูกในประโยคเดียว คุณได้ที่นั่งหลังคนขับ", effects: {happiness: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาก็เพิ่งย้ายมาวันนี้ ชี้ไปสามแถว คุณได้เดินครบทั้งสามแถว", effects: {happiness: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: follow_crowd
        text: "เดินตามคนหิ้วกระเป๋าใบใหญ่"
        outcomes:
          - {weight: 1, ok: true, text: "เขาไปจังหวัดเดียวกัน ถึงแถวทันเที่ยวสุดท้ายพอดี ได้เพื่อนคุยไปทั้งทาง", effects: {happiness: 1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เขาไปอีกภาค คุณรู้ตัวตอนได้ยินคนเรียกชื่อจังหวัดที่ไม่เคยไป", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: take_coach
        text: "ทิ้งรถตู้ ไปขึ้นรถทัวร์แทน"
        effects: {happiness: 1, health: -1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: stay_friend
        text: "ค้างห้องเพื่อน ไปเช้าพรุ่งนี้"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: shout_province
        text: "ตะโกนชื่อจังหวัดหาเพื่อนร่วมทาง"
        outcomes:
          - {weight: 1, ok: true, text: "ห้าคนยกมือพร้อมกัน กลายเป็นแถวที่ถูกต้องที่สุดในลานใต้ทางด่วน", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไม่มีใครตอบ มีแต่คนขายน้ำเดินมาถามว่ารับน้ำเปล่าไหม", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_wrong_bus_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "เลขสายเดียวกัน คนละป้าย"
    text: "มีธุระในกรุงต้องไปให้ทันสิบโมง รถเลขสายที่ต้องการจอดเทียบ คุณกระโดดขึ้นก่อนดูป้าย แล้วเพิ่งเห็นว่าคันนี้เป็นรถเมล์ครีมแดงหน้าต่างเปิด ไม่มีป้าย ปอ. อย่างคันที่เพื่อนบอก ถนนข้างหน้าแยกคนละฝั่ง ลมร้อนเป่าเข้าหน้าเต็ม ๆ"
    choices:
      - id: ride_on
        text: "นั่งต่อ ไปตั้งหลักปลายทาง"
        outcomes:
          - {weight: 1, ok: true, text: "เส้นนี้อ้อมแต่รถน้อย ถึงช้าไปสิบนาที ผมทรงใหม่จากแรงลมไม่มีใครถาม", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "ปลายทางคือท่ารถอีกฟากเมือง ธุระเลื่อนไปอาทิตย์หน้า เสื้อมีกลิ่นควันติดมาด้วย", effects: {happiness: -1, network: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: wait_air
        text: "ลงป้ายหน้า รอคันติดป้าย ปอ."
        effects: {knowledge: 1, money: {unit: income_x, amount: -0.01}}
        merit: [{cat: neutral}]
      - id: take_win
        text: "ลงแล้วโบกวินไปให้ทัน"
        effects: {happiness: 1, health: -1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: poll_bus
        text: "ตะโกนถามทั้งรถว่าใครรู้ทาง"
        outcomes:
          - {weight: 1, ok: true, text: "ป้าสามคนชี้สามทาง ลุงท้ายรถเคาะให้ ได้ทางลัดพร้อมเบอร์ร้านส้มตำ", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทั้งรถเถียงกันจนลืมป้ายตัวเอง คุณก็ลืมด้วย", effects: {relations: 1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_platform_crush_01
    type: A
    category: health
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45], year: [2560, 2650]}
    title: "ปล่อยไปอีกสองขบวน"
    text: "อาทิตย์นี้ต้องเข้ากรุงไปอบรม หกโมงเย็นบนชานชาลารถไฟฟ้า ป้ายในสถานีบอกว่าขนคนมาแล้วหลายพันล้านเที่ยว เย็นนี้คนเหล่านั้นเหมือนมายืนรอขบวนเดียวกับคุณ ปล่อยไปแล้วสองขบวน ขบวนที่สามมีช่องว่างขนาดคนผอมครึ่งตัว เสียงเตือนประตูกำลังจะดัง"
    choices:
      - id: squeeze_in
        text: "แทรกตัวเข้าไปให้ได้"
        outcomes:
          - {weight: 1, ok: true, text: "เข้าทันหนึ่งตัวครึ่ง ไม่ต้องจับราวก็ยืนได้ เพราะไม่มีที่ให้ล้ม", effects: {happiness: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กระเป๋าติดอยู่นอกประตูไปสามสถานี คุณยืนบิดตัวจนหลังยอกไปอาทิตย์หนึ่ง", effects: {health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: let_go
        text: "ปล่อยขบวนนี้ด้วย ยืนรอต่อ"
        effects: {happiness: -1, health: 1}
        merit: [{cat: neutral}]
      - id: back_to_terminal
        text: "นั่งย้อนไปต้นสายเอาที่นั่ง"
        effects: {happiness: 1, health: -1, money: {unit: income_x, amount: -0.02}}
        merit: [{cat: neutral}]
      - id: bus_below
        text: "ลงไปรอรถเมล์ข้างล่างดีกว่า"
        effects: {health: -1, money: {unit: income_x, amount: 0.01}}
        merit: [{cat: neutral}]
      - id: fake_stomach
        text: "โวยว่าปวดท้อง ขอทางด่วนหน่อย"
        outcomes:
          - {weight: 1, ok: true, text: "ช่องว่างเปิดเป็นวงรอบตัว คุณได้ที่ยืนสบายที่สุดตั้งแต่เคยขึ้นรถไฟฟ้า", effects: {happiness: 2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนหลบจริง แต่ในตู้มีคนรู้จัก พรุ่งนี้เขาทักเรื่องท้องก่อนทักสวัสดี", effects: {relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: transit_rain_meter_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {age: [31, 45]}
    title: "ศุกร์สิ้นเดือน ฝนเท"
    text: "ห้าโมงครึ่ง เพิ่งออกจากที่ประชุมในกรุง ถนนทั้งเส้นกลายเป็นลานจอดรถ แท็กซี่ห้าคันเปิดกระจกถามว่าไปไหนแล้วส่ายหน้า คันที่หกยอมไปแต่ไม่กดมิเตอร์ บอกเหมาสามเท่า นัดถัดไปเหลือชั่วโมงเดียว ในรองเท้าเริ่มมีน้ำ"
    choices:
      - id: pay_flat
        text: "ยอมจ่ายเหมา ขึ้นก่อนเปียกกว่านี้"
        outcomes:
