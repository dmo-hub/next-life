        outcomes:
          - {weight: 1, ok: true, text: "น้ำสีชาไหเดียวใช้ได้ทั้งปี ครีบปลาบานขึ้นจนเพื่อนร่วมงานขอแบ่งไปขวดหนึ่ง", effects: {knowledge: 1, relations: 1}, merit: [{cat: neutral}]}
