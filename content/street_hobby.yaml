          - {weight: 1, text: "กิ่งที่ชำทั้งหมดแข่งกันเน่า เหลือแต่คำสัญญาที่เคยบอกเพื่อนไว้ทั่วซอย", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
