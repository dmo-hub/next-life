# กลุ่ม business · ช่วงวัยทำงาน/กลางคน (บางใบหนุ่มสาว) · ธุรกิจตามยุค (ร้านชำ · รถเข็น · ร้านอาหาร · สวน · แฟรนไชส์) + แชร์ลูกโซ่
events:
  - id: biz_grocery_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    when: {occupation: [farmer, labor, factory, craft, service], flags: {not: [own_business]}}
    multipliers: {stats: {network: 1.3}, flags: {street_vendor: 1.5}}
    title: "ห้องแถวหัวมุม"
    text: "ห้องแถวหัวมุมปากซอยประกาศให้เช่า ป้าเจ้าของบอกว่าคนเดินผ่านวันละเป็นร้อย เปิดร้านชำตรงนี้ไม่มีทางเจ๊ง {ชื่อ} มีเงินเก็บ {เงิน} บาท"
    choices:
      - id: open_grocery
        text: "เซ้งเลย เปิดร้านชำ"
        effects: {money: {unit: income_x, amount: -1}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "คนทั้งซอยแวะซื้อของทุกเช้า ร้านติดตลาดเร็วกว่าที่คิด", effects: {happiness: 1, job: service}, sets_flags: [own_business], next: biz_grocery_rival_01, merit: [{cat: neutral}], multipliers: {stats: {relations: 1.4, network: 1.3}}}
          - {weight: 2, text: "ของหมดอายุค้างชั้นเป็นแถบ ทุนจมไปกับขนมที่ไม่มีใครซื้อ", effects: {happiness: -2, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}
      - id: credit_book
        text: "เปิดร้าน ให้คนในซอยเชื่อได้"
        effects: {money: {unit: income_x, amount: -1}, relations: 1}
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 1, ok: true, text: "ลูกค้าเชื่อแล้วจ่ายตรง ทั้งซอยรักร้านนี้ ยอดขายโตทุกเดือน", effects: {job: service, relations: 1}, sets_flags: [own_business], merit: [{cat: neutral}], multipliers: {stats: {relations: 1.5}}}
          - {weight: 2, text: "สมุดเชื่อหนาขึ้นทุกวัน แต่เงินสดหายไปหมด สุดท้ายต้องปิดร้าน", effects: {happiness: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}], next: biz_credit_book_01}
      - id: rent_to_friend
        text: "บอกเพื่อนมาเช่าแทน"
        effects: {relations: 1, network: 1}
        merit: [{cat: neutral}]
      - id: pass_grocery
        text: "ทำงานประจำต่อดีกว่า"
        merit: [{cat: neutral}]

  - id: biz_grocery_rival_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    title: "ร้านสว่างตรงข้าม"
    text: "ยังไม่ทันครบปี ร้านใหญ่ทุนหนามาเปิดตรงข้ามพอดี ของครบทุกอย่าง ไฟสว่างจ้า ลูกค้าประจำเริ่มเดินข้ามถนน"
    choices:
      - id: fight_price
        text: "ตัดราคาสู้ ยอมกำไรบาง"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "ป้า ๆ ในซอยเลือกร้านที่คุยด้วยได้ ยอดกลับมาเท่าเดิม", effects: {happiness: 1, income_mult: 1.2}, merit: [{cat: neutral}], multipliers: {stats: {relations: 1.5}}}
          - {weight: 2, text: "สู้ราคาได้สามเดือน ทุนก็หมด เหลือแต่ชั้นวางเปล่า", effects: {happiness: -2, income_mult: 0.8}, merit: [{cat: neutral}]}
      - id: niche_shop
        text: "หันขายของที่เขาไม่มี"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ถ่านหุงข้าว น้ำแข็งก้อน ของไหว้ครบชุด ร้านกลายเป็นร้านเดียวที่หาของพวกนี้ได้", effects: {happiness: 2, income_mult: 1.3}, merit: [{cat: neutral}], multipliers: {stats: {network: 1.4}}}
          - {weight: 1, text: "ของที่หามาขายช้ากว่าที่คิด ร้านอยู่ได้แบบเหนื่อย ๆ", effects: {health: -1, income_mult: 0.9}, merit: [{cat: neutral}]}
      - id: sell_to_chain
        text: "ขายสิทธิ์เซ้งให้ร้านใหญ่"
        effects: {money: {unit: income_x, amount: 1.5}, happiness: -1}
        merit: [{cat: neutral}]
      - id: spread_rumor
        text: "ปล่อยข่าวว่าร้านเขาขายของเน่า"
        hint: "ราคา: บาปเบา"
        merit: [{cat: greed_harm, level: 1}]
        outcomes:
          - {weight: 1, text: "ข่าวลือได้ผลอยู่เดือนเดียว ลูกค้ากลับมาบ้าง", effects: {income_mult: 1.1}, merit: [{cat: neutral}]}
          - {weight: 2, text: "มีคนเห็นตอนพูดแล้วเอาไปบอกต่อ ทั้งซอยเลิกคุยด้วย", effects: {relations: -3, happiness: -1}, merit: [{cat: neutral}]}

  - id: biz_food_cart_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 1
    multipliers: {flags: {street_vendor: 2}}
    title: "รถเข็นคันแรก"
    text: "{ชื่อ} อายุ {อายุ} ได้สูตรน้ำจิ้มลับจากยายมาครบทั้งสมุด เพื่อนบอกว่าถ้าเข็นรถขายหน้าโรงงานตอนเลิกกะ ขายหมดแน่ ๆ"
    choices:
      - id: push_cart
        text: "ซื้อรถเข็น ลุยเลย"
        effects: {money: {unit: income_x, amount: -0.5}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "คนงานต่อคิวยาวถึงรั้ว น้ำจิ้มของยายกลายเป็นตำนานหน้าโรงงาน", effects: {happiness: 2, income_mult: 1.3}, sets_flags: [street_vendor], merit: [{cat: neutral}], multipliers: {stats: {network: 1.3, relations: 1.3}}}
          - {weight: 1, text: "โดนเทศกิจยึดรถตั้งแต่วันที่สาม น้ำจิ้มเต็มถังยังไม่ได้เปิดฝา", effects: {happiness: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}
      - id: night_market
        text: "ไปเช่าล็อกตลาดนัดกลางคืน"
        effects: {money: {unit: income_x, amount: -0.3}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.3}}, text: "ขายดีจนเจ้าของตลาดให้ล็อกหัวมุม รายได้เสริมงอกทุกคืน", effects: {happiness: 1, income_mult: 1.2}, sets_flags: [street_vendor], merit: [{cat: neutral}]}
          - {weight: 1, text: "ล็อกอยู่ท้ายตลาด ลมพัดกลิ่นห้องน้ำมาทั้งคืน ขายได้ไม่คุ้มค่าเช่า", effects: {happiness: -1}, merit: [{cat: neutral}]}
      - id: sell_recipe
        text: "ขายสูตรให้ร้านดังในเมือง"
        effects: {money: {unit: income_x, amount: 0.8}, relations: -1}
        merit: [{cat: neutral}]
      - id: keep_recipe
        text: "เก็บสูตรไว้ทำกินที่บ้าน"
        effects: {relations: 1}
        merit: [{cat: care_parents, level: 1}]
      - id: push_cart_rite
        text: "ดูฤกษ์เข็นรถออกขายวันแรก"
        effects: {money: {unit: income_x, amount: -0.55}, happiness: 1, relations: 1}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "คนงานต่อคิวยาวถึงรั้ว น้ำจิ้มของยายกลายเป็นตำนานหน้าโรงงาน", effects: {happiness: 2, income_mult: 1.3}, sets_flags: [street_vendor], merit: [{cat: neutral}], multipliers: {stats: {network: 1.3, relations: 1.3}}}
          - {weight: 1, text: "โดนเทศกิจยึดรถตั้งแต่วันที่สาม น้ำจิ้มเต็มถังยังไม่ได้เปิดฝา", effects: {happiness: -2, money: {unit: income_x, amount: -0.3}}, merit: [{cat: neutral}]}

