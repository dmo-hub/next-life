        text: "เปิดร้านตามฤกษ์ นิมนต์พระ"
        effects: {money: {unit: income_x, amount: -2.05}, happiness: 1, relations: 1}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "คนขับรถทัวร์จอดกินแล้วบอกต่อ วันหยุดคิวยาวถึงปั๊มน้ำมัน", effects: {happiness: 2, job: service}, sets_flags: [own_business], merit: [{cat: neutral}], multipliers: {stats: {network: 1.4}, flags: {street_vendor: 1.5}}}
          - {weight: 1, text: "หกเดือนแรกขายได้ดี แล้วมีโครงการขยายถนน ปิดหน้าร้านยาวสองปี", effects: {happiness: -2, health: -1, money: {unit: income_x, amount: -1}}, merit: [{cat: neutral}]}

  - id: biz_farm_expand_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 2
    when: {occupation: [farmer]}
    multipliers: {occupation: {farmer: 1.5}, stats: {network: 1.2}}
    title: "ที่ดินแปลงข้างบ้าน"
    text: "ลุงข้างบ้านจะย้ายไปอยู่กับลูกของแกในเมือง เลยเสนอขายที่นาแปลงติดกันให้ก่อนใคร ถ้าได้มารวมกัน สวนของ{ชื่อ}จะใหญ่เป็นสองเท่า"
    choices:
      - id: buy_land_durian
        text: "ซื้อ แล้วลงทุเรียนทั้งแปลง"
        effects: {money: {unit: income_x, amount: -2}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ข่าวว่าลงทุเรียนทั้งแปลงไปถึงหูพ่อค้า เขามาจองล่วงหน้าตั้งแต่ต้นยังเล็ก", effects: {happiness: 2}, next: biz_farm_buyer_01, merit: [{cat: neutral}], multipliers: {stats: {health: 1.3}}}
          - {weight: 1, text: "หน้าแล้งยาวผิดปกติ ต้นอ่อนยืนตายทั้งแถว เหลือรอดไม่ถึงครึ่ง", effects: {happiness: -2, health: -1, income_mult: 0.8}, merit: [{cat: neutral}]}
      - id: buy_land_rice
        text: "ซื้อ ทำนาเพิ่มแบบเดิม"
        effects: {money: {unit: income_x, amount: -1.5}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ข้าวปีนั้นราคาดี นาสองแปลงเลี้ยงทั้งบ้านได้สบาย", effects: {happiness: 1, income_mult: 1.2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ราคาข้าวดิ่งตั้งแต่ปีแรก ได้ที่เพิ่มแต่งานหนักเป็นสองเท่า", effects: {health: -1, income_mult: 0.9}, merit: [{cat: neutral}]}
      - id: rent_land
        text: "ขอเช่าก่อน ไม่ซื้อขาด"
        effects: {income_mult: 1.1, relations: 1}
        merit: [{cat: neutral}]
      - id: help_uncle_sell
        text: "ช่วยลุงหาคนซื้อราคาดี"
        effects: {relations: 2, network: 1}
        merit: [{cat: help_others, level: 1}]
      - id: buy_land_rice_rite
        text: "ซื้อนา ทำขวัญข้าวก่อนลงมือ"
        effects: {money: {unit: income_x, amount: -1.6}, happiness: 1, relations: 1}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ข้าวปีนั้นราคาดี นาสองแปลงเลี้ยงทั้งบ้านได้สบาย", effects: {happiness: 1, income_mult: 1.2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ราคาข้าวดิ่งตั้งแต่ปีแรก ได้ที่เพิ่มแต่งานหนักเป็นสองเท่า", effects: {health: -1, income_mult: 0.9}, merit: [{cat: neutral}]}

  - id: biz_farm_buyer_01
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    title: "พ่อค้าคนกลาง"
    text: "พ่อค้าคนกลางขับกระบะมาจอดหน้าสวน ยื่นเงินมัดจำก้อนโตให้ดู ขอเหมาทั้งสวนทุกปีในราคาตายตัว เซ็นวันนี้ได้เงินสดทันที"
    choices:
      - id: sign_contract
        text: "เซ็นเหมาทั้งสวน รับเงินก่อน"
        effects: {money: {unit: income_x, amount: 1}}
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 1, ok: true, text: "พ่อค้าจ่ายตรงทุกงวด ไม่ต้องลุ้นราคา นอนหลับสบายทุกคืน", effects: {happiness: 1, income_mult: 1.2}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปีต่อมาราคาพุ่งเท่าตัว แต่สัญญาล็อกไว้ ต้องขายถูกให้เขาอีกสามปี", effects: {happiness: -2, income_mult: 1.05}, merit: [{cat: neutral}]}
      - id: sell_self
        text: "ไม่เซ็น ขนไปขายตลาดเอง"
        merit: [{cat: neutral}]
        outcomes:
          - {weight: 2, ok: true, text: "ตั้งแผงริมถนนเอง ได้ราคาเต็ม ลูกค้าประจำโทรสั่งทุกปี", effects: {happiness: 2, health: -1, income_mult: 1.4}, merit: [{cat: neutral}], multipliers: {stats: {network: 1.5}}}
          - {weight: 1, text: "ขนไปถึงตลาดพร้อมกับสวนอื่นอีกสิบคัน ราคาร่วงจนต้องเทขาย", effects: {happiness: -1, income_mult: 1.05}, merit: [{cat: neutral}]}
      - id: group_coop
        text: "รวมสวนเพื่อนบ้านต่อรองราคา"
        merit: [{cat: help_others, level: 1}]
        outcomes:
          - {weight: 1, ok: true, multipliers: {stats: {network: 1.5}}, text: "สวนทั้งตำบลรวมกันได้ราคาดีขึ้นทุกบ้าน {ชื่อ} ถูกยกเป็นหัวหน้ากลุ่ม", effects: {relations: 2, network: 2, income_mult: 1.3}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ประชุมกันสามรอบก็ยังตกลงกันไม่ได้ ผลไม้สุกคาต้นไปครึ่งหนึ่ง", effects: {relations: -1, income_mult: 1.05}, merit: [{cat: neutral}]}
      - id: sell_whole_orchard
        text: "ขายสวนทั้งแปลงให้เขาไปเลย"
        effects: {money: {unit: income_x, amount: 3}, happiness: -1, income_mult: 0.8}
        merit: [{cat: neutral}]

