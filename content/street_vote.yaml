# ร่างเรื่อง การเมืองท้องถิ่น · ลงเกมแล้ว ใบ 245 จากร่าง 244 · ผ่าน workflow ใบ 244
# ร่างเรื่อง การเมืองท้องถิ่น · 15 ใบ · ยังไม่ลงเกม · แก้ตามข้อค้านรอบ 1 · ผู้เล่นเป็นชาวบ้าน ผู้ลงคะแนน หรือคนช่วยงาน · ใบที่ผู้เล่นอายุ 25 ขึ้นไปไม่เอ่ยตำแหน่งผู้ใหญ่บ้าน · ไม่ตั้งธงใหม่ ไม่อ่านธง
events:
  - id: localvote_child_booth_01
    type: A
    category: study
    stage: เด็ก
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [8, 12]}
    title: "หีบบัตรในศาลาหมู่บ้าน"
    text: "วันเลือกผู้ใหญ่บ้าน ศาลาหมู่บ้านคนเต็มตั้งแต่เช้า ผู้ใหญ่ต่อแถวรอกาบัตรกันเงียบกริบ คุณกับเพื่อนเกาะรั้วดูอยู่ครึ่งวัน เจ้าหน้าที่หันมาบอกว่าห้ามเข้าใกล้หีบ พรุ่งนี้ที่โรงเรียนก็ต้องเลือกหัวหน้าห้องพอดี"
    choices:
      - id: localvote_child_class_01
        text: "ทำหีบเลือกหัวหน้าห้องเองบ้าง"
        outcomes:
          - {weight: 1, ok: true, text: "ครูยอมให้ลองหย่อนบัตรในกล่องชอล์ก เพื่อนนับคะแนนกันเสียงดังจนห้องข้าง ๆ ชะโงกมาดู", effects: {knowledge: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "บัตรในกล่องมีมากกว่าคนในห้องสามใบ เพื่อนเถียงกันจนหมดคาบ ครูเลยชี้หัวหน้าเอง", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_child_ask_01
        text: "ถามเจ้าหน้าที่ว่านับคะแนนยังไง"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: localvote_child_play_01
        text: "เบื่อแล้ว ไปเล่นที่ลานวัดดีกว่า"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: localvote_child_dog_01
        text: "ตั้งหีบเลือกหมาประจำซอย"
        outcomes:
          - {weight: 1, ok: true, text: "เด็กทั้งซอยมาหย่อนก้อนหินลงกระป๋อง หมาด่างชนะขาดลอย แล้วเดินหนีไปก่อนประกาศผล", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้สมัครตัวหนึ่งกินข้าวเหนียวที่ใช้แทนบัตรจนหมด การเลือกตั้งเป็นโมฆะ", effects: {happiness: 1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: localvote_molam_poll_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [15, 18]}
    title: "หีบเลือกคณะหมอลำ"
    text: "งานบุญประจำปีของหมู่บ้านเพื่อน ชาวบ้านจะลงคะแนนเลือกคณะหมอลำกันจริงจัง มีกรรมการหน่วย มีบัตรดีบัตรเสีย ผู้ใหญ่บ้านหลายหมู่มานั่งเป็นกรรมการ คุณถูกขอให้ช่วยถือหีบ แล้วเพื่อนกลุ่มหนึ่งก็มากระซิบว่าคณะของเขาต้องชนะ"
    choices:
      - id: localvote_molam_straight_01
        text: "ถือหีบตรง ๆ ไม่ฟังใคร"
        outcomes:
          - {weight: 1, ok: true, text: "นับเสร็จคะแนนห่างกันสามใบ ทุกฝ่ายยอมรับ ผู้ใหญ่บ้านตบบ่าว่าปีหน้ามาช่วยอีก", effects: {network: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กลุ่มเพื่อนแพ้แล้วงอนไปทั้งคืน ไม่มีใครชวนคุณกลับบ้านด้วย", effects: {relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_molam_count_01
        text: "ขอไปช่วยดูบัตรเสียแทน"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
      - id: localvote_molam_dodge_01
        text: "ปฏิเสธ ขอเดินเที่ยวงานเฉย ๆ"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
      - id: localvote_molam_stage_01
        text: "ขึ้นเวทีร้องหาเสียงให้คณะโปรด"
        outcomes:
          - {weight: 1, ok: true, text: "ร้องเพี้ยนทั้งเพลงแต่คนทั้งลานปรบมือ นักร้องคณะที่คุณเชียร์กวักมือเรียกขึ้นไปยืนด้วย", effects: {happiness: 2, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กรรมการเชิญลงจากเวทีกลางเพลง เพื่อนเอาไปล้อต่อจนเปิดเทอม", effects: {happiness: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: localvote_phapa_name_01
    type: A
    category: society
    stage: วัยรุ่น
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [14, 18]}
    title: "รายชื่อหน้าต้นผ้าป่า"
    text: "หมู่บ้านทอดผ้าป่า ผู้เฒ่าบ่นว่าแต่ก่อนแขวนผ้าไว้ข้างทางก็จบ ไม่ต้องอ่านชื่อใคร แต่ปีนี้คุณได้อ่านรายชื่อคนร่วมทำบุญ และคนที่จะลงผู้ใหญ่บ้านทั้งสองคนต่างแวะมาขอให้อ่านชื่อตัวเองก่อน"
    choices:
      - id: localvote_phapa_ledger_01
        text: "อ่านตามลำดับในสมุดเป๊ะ ๆ"
        outcomes:
          - {weight: 1, ok: true, text: "ผู้เฒ่าพยักหน้าตลอดรายการ ทั้งสองคนไม่พอใจเท่ากันพอดี เลยไม่มีใครว่าอะไร", effects: {relations: 1, knowledge: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ชื่อคนหนึ่งบังเอิญมาก่อน อีกฝ่ายเดินมาถามผู้เฒ่าว่าเด็กคนนี้เป็นของฝั่งไหน", effects: {happiness: -1, relations: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_phapa_pair_01
        text: "อ่านสองชื่อนั้นติดกันเลย"
        effects: {relations: 1, happiness: -1}
        merit: [{cat: neutral}]
      - id: localvote_phapa_handoff_01
        text: "ส่งให้ผู้ใหญ่อ่านแทนเถอะ"
        effects: {happiness: 1, network: -1}
        merit: [{cat: neutral}]
      - id: localvote_phapa_boxing_01
        text: "อ่านแบบพากย์มวยทั้งรายการ"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งศาลาหัวเราะจนลืมเรื่องใครมาก่อนใคร ยอดทำบุญปีนี้มากกว่าทุกปี", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ผู้เฒ่าเงยหน้ามองนิ่ง ๆ คุณเสียงค่อยลงเองตั้งแต่ชื่อที่สาม", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: localvote_homeward_trip_01
    type: A
    category: work_money
    stage: หนุ่มสาว
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [21, 30]}
    title: "ต้องกลับไปกาที่บ้าน"
    text: "คุณมาทำงานต่างถิ่น แต่ชื่อยังอยู่บ้านเก่า เลือกตั้งที่บ้านคราวนี้ ใครจะลงคะแนนต้องเดินทางกลับไปเอง ค่ารถไปกลับเท่าค่าแรงสองวัน หัวหน้าถามว่าวันอาทิตย์จะมาทำงานล่วงเวลาไหม ส่วนญาติฝากมาว่าคราวนี้สูสีกันมาก"
    choices:
      - id: localvote_homeward_go_01
        text: "กลับไปกา แล้วค้างเยี่ยมญาติ"
        outcomes:
          - {weight: 1, ok: true, text: "ถึงศาลาหมู่บ้านทันก่อนปิดหีบ ญาติยกกับข้าวมาตั้งเต็มโต๊ะ ถามทุกเรื่องยกเว้นว่ากาใคร", effects: {relations: 2, happiness: 1, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "รถเสียกลางทาง ไปถึงหลังปิดหีบสิบนาที เจ้าหน้าที่ยังใจดีให้น้ำดื่มหนึ่งแก้ว", effects: {happiness: -2, money: {unit: income_x, amount: -0.03}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_homeward_ot_01
        text: "อยู่ทำล่วงเวลา เอาเงินดีกว่า"
        effects: {happiness: -1, money: {unit: income_x, amount: 0.03}}
        merit: [{cat: neutral}]
      - id: localvote_homeward_share_01
        text: "ชวนคนบ้านเดียวกันเหมารถกลับ"
        outcomes:
          - {weight: 1, ok: true, text: "รถหนึ่งคันเต็มคนบ้านเดียวกัน คุยกันตลอดทางจนได้งานใหม่ติดมือกลับมาด้วย", effects: {network: 2, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ครึ่งคันถกกันเรื่องผู้สมัครตั้งแต่ออกจากเมือง ไปถึงบ้านแทบไม่มองหน้ากัน", effects: {relations: -1, happiness: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_homeward_bike_01
        text: "ปั่นจักรยานกลับ ประหยัดค่ารถ"
        outcomes:
          - {weight: 1, ok: true, text: "ไปถึงตอนหีบใกล้ปิด ขาสั่นจับปากกาแทบไม่อยู่ ชาวบ้านเล่าเรื่องคุณกันไปทั้งปี", effects: {happiness: 2, health: -1, network: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ปั่นได้ครึ่งทางยางแตก ต้องนั่งรถกลับเอาจักรยานขึ้นหลังคา ค่ารถแพงกว่าเดิมอีก", effects: {health: -1, money: {unit: income_x, amount: -0.05}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: localvote_harvest_guest_01
