        text: "ช่วยได้ แต่ห้ามคุยเลือกตั้ง"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: localvote_harvest_far_01
        text: "ส่งไปเกี่ยวแปลงไกลสุด"
        effects: {happiness: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: localvote_harvest_race_01
        text: "ท้าแข่งเกี่ยวข้าวให้ทั้งนาดู"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งนาเชียร์กันลั่นทุ่ง งานเสร็จก่อนบ่ายสาม เจ้าของนาต้องหุงข้าวเพิ่มอีกหม้อ", effects: {happiness: 2, relations: 2, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คุณเกี่ยวเร็วจนเคียวบาดนิ้ว ผู้สมัครเลยได้โอกาสพันแผลให้ต่อหน้าทั้งทุ่ง", effects: {health: -2, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: localvote_sick_notice_01
    type: A
    category: health
    stage: ทำงาน
    years: [2500, 2650]
    weight: 0.0625
    when: {age: [31, 45]}
    title: "ไข้ขึ้นเช้าวันเลือกตั้ง"
    text: "เช้าวันเลือกตั้งท้องถิ่น หน่วยตั้งอยู่ที่ศาลาหมู่บ้าน แต่คุณไข้ขึ้นจนลุกไม่ไหว เพื่อนบ้านที่แวะมาดูบอกว่าไปไม่ไหวก็ฝากบอกกรรมการหน่วยไว้ว่าป่วย ส่วนคนอีกซอยเคาะประตูมาบอกว่าหนึ่งคะแนนก็มีค่า จะช่วยพยุงไปเอง"
    choices:
      - id: localvote_sick_rest_01
        text: "นอนพัก ฝากบอกกรรมการว่าป่วย"
        outcomes:
          - {weight: 1, ok: true, text: "เขาจดชื่อไว้ให้แล้วบอกให้รีบหาย สามวันไข้ก็ลด", effects: {health: 1, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ฝากคนลืมบอก มีคนมาถามว่าหายไปไหน คุณต้องเล่าเรื่องไข้ซ้ำไปทั้งซอย", effects: {happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_sick_go_01
        text: "กัดฟันให้เขาพยุงไปกา"
        outcomes:
          - {weight: 1, ok: true, text: "กาเสร็จคนในแถวรีบหาเก้าอี้ให้นั่ง ได้ยินคำชมตลอดทางกลับ", effects: {network: 1, happiness: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "กลับถึงบ้านไข้ขึ้นกว่าเดิม นอนซมต่ออีกสัปดาห์เต็ม", effects: {health: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: localvote_sick_skip_01
        text: "ปล่อยผ่าน ไม่อยากวุ่นวาย"
        effects: {health: 1, knowledge: -1}
        merit: [{cat: neutral}]
      - id: localvote_sick_bed_01
        text: "ให้หามไปทั้งเตียงเลย"
        outcomes:
          - {weight: 1, ok: true, text: "เพื่อนบ้านสี่คนหามเตียงผ่านทั้งซอย ไม่มีใครจำชื่อผู้สมัครได้ แต่จำคุณได้ทุกคน", effects: {happiness: 3, network: 1, health: -1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "เตียงกว้างกว่าประตูศาลา เจ้าหน้าที่ชี้ให้หามกลับ แล้วบอกให้ไปนอนเสียเถอะ", effects: {happiness: -1, health: -1, relations: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

