# nl-writer file b003
# เตรียมทหาร เตรียมตัวจนถึงเช้าวันสอบ (อายุ 13–18 · ร่างให้เจ้าของเลือก) — ต่อจาก cadet_crossroad.yaml
# อ่านธง cadet_dream cadet_tips cadet_senior_tutor knows_senior saw_army saw_navy saw_airforce
# ตั้งธง cadet_family_told cadet_family_secret cadet_family_support cadet_share_half cadet_share_most family_debt cadet_let_go
#   cadet_prep_camp cadet_prep_group cadet_prep_self cadet_prep_senior can_swim cadet_a_swims cadet_bond_a cadet_met_c cadet_bond_c
#   refused_fixer cadet_paid_fixer cadet_exam_door (เช้าวันสอบล้าง cadet_dream แล้วเกมเดินต่อตามปกติ)
# ใบบอกที่บ้านและใบหาเงินอยู่ก่อน cadet_prep_choice เสมอ — นัดปีเดียวกันออกตามลำดับในไฟล์
events:
  # >>> nl-writer b003 evt cadet_tell_family
  - id: cadet_tell_family
    type: A
    category: family
    stage: วัยรุ่น
    years: [2501, 2650]
    when: {sex: [ชาย], age: [13, 17], flags: {has: [cadet_dream], not: [cadet_family_told, cadet_family_secret]}}
    title: "ใบสมัครในกระเป๋า"
    text: "{ชื่อ} ตั้งใจแล้วว่าจะสอบเข้าโรงเรียนเตรียมทหาร ใบรับสมัครพับอยู่ในกระเป๋านักเรียนมาหลายวัน ถ้าสอบติดต้องไปอยู่โรงเรียนประจำ ก่อนสอบก็มีค่าติว เรื่องนี้ต้องคุยกับผู้ใหญ่ในบ้านสักวัน"
    choices:
      - id: tonight
        text: "พูดเรื่องนี้ให้ได้ภายในวันนี้"
        effects: {happiness: 1}
        merit: [{cat: neutral}]
        schedules: [{event: cadet_tell_none, after_years: [0, 0]}, {event: cadet_tell_poor, after_years: [0, 0]}, {event: cadet_tell_mother, after_years: [0, 0]}, {event: cadet_tell_father, after_years: [0, 0]}]
      - id: list_costs
        text: "จดค่าใช้จ่ายให้ครบก่อนพูด"
        effects: {knowledge: 1}
        merit: [{cat: neutral}]
        schedules: [{event: cadet_tell_none, after_years: [0, 0]}, {event: cadet_tell_poor, after_years: [0, 0]}, {event: cadet_tell_mother, after_years: [0, 0]}, {event: cadet_tell_father, after_years: [0, 0]}]
      - id: ask_friend
        text: "ถามเพื่อนว่าบอกที่บ้านยังไง"
        effects: {relations: 1}
        merit: [{cat: neutral}]
        schedules: [{event: cadet_tell_none, after_years: [0, 0]}, {event: cadet_tell_poor, after_years: [0, 0]}, {event: cadet_tell_mother, after_years: [0, 0]}, {event: cadet_tell_father, after_years: [0, 0]}]
      - id: wait_year
        text: "รอจังหวะดี ๆ ไว้ปีหน้า"
        hint: "ได้คุยช้าลง เวลาเตรียมตัวก็สั้นลง"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
        schedules: [{event: cadet_tell_none, after_years: [1, 1]}, {event: cadet_tell_poor, after_years: [1, 1]}, {event: cadet_tell_mother, after_years: [1, 1]}, {event: cadet_tell_father, after_years: [1, 1]}]
