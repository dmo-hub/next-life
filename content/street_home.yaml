        text: "จัดเวรกับเพื่อนบ้านรับส่งเด็ก"
        effects: {network: 2, relations: 1, health: -1}
        merit: [{cat: care_parents, level: 1}]
      - id: hf_write_for_fare
        text: "เขียนจดหมายขอค่ารถเพิ่ม"
        outcomes:
          - {weight: 1, ok: true, text: "เดือนถัดมาเงินส่งมาเพิ่มพร้อมรูปถ่ายและคำขอโทษ หลานเอารูปไปวางข้างหมอนทุกคืน", effects: {relations: 1, happiness: 1, money: {unit: income_x, amount: 0.03}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ไม่มีจดหมายตอบกลับมาสองเดือน คุณเลิกเปิดตู้จดหมาย แล้วออกค่ารถด้วยเงินในกระเป๋าตัวเอง", effects: {happiness: -2, money: {unit: income_x, amount: -0.04}}, merit: [{cat: care_parents, level: 1}]}
        merit: [{cat: neutral}]
      - id: hf_pass_child_on
        text: "ฝากหลานต่อให้บ้านญาติอีกหลัง"
        effects: {relations: -2, health: 1}
        merit: [{cat: neutral}]
      - id: hf_kid_holds_queue
        text: "ให้หลานถือบัตรคิวแทนผู้ใหญ่"
        outcomes:
          - {weight: 1, ok: true, text: "หลานถือบัตรคิวสองมือ อ่านเลขให้คนแก่ฟังทุกครั้งที่เรียก วันนั้นคนในบ้านยิ้มได้ทั้งที่รอหมอสามชั่วโมง", effects: {happiness: 2, relations: 2}, merit: [{cat: care_parents, level: 1}]}
          - {weight: 1, text: "หลานเมารถมาทั้งทาง คนในห้องรอขยับหนีไปทั้งแถว คุณได้ที่นั่งว่างเต็มม้านั่ง", effects: {happiness: 1, health: -1}, merit: [{cat: care_parents, level: 1}]}
        merit: [{cat: care_parents, level: 1}]

