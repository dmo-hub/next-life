    text: "วงส้มตำใต้ต้นมะขามกำลังเล่าว่าลุงท้ายซอยจดทะเบียนหย่ากับป้าที่ไปทำงานเมืองนอกแล้ว ทั้งที่ลุงเพิ่งเล่าให้คุณฟังว่าเป็นเรื่องจำเป็นทางเอกสาร และยังรักกันเหมือนเดิม วงหันมาถามว่าได้ยินอะไรมาบ้าง"
    choices:
      - id: hf_correct_gossip
        text: "บอกว่าลุงกับป้ายังรักกันดี"
        outcomes:
          - {weight: 1, ok: true, text: "วงเงียบไปพักหนึ่งแล้วเปลี่ยนเรื่องไปพูดถึงราคาข้าว ลุงแวะเอาปลาย่างมาฝากคุณในเดือนถัดมา", effects: {relations: 2, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "พรุ่งนี้ทั้งตลาดเล่าว่าคุณรู้เรื่องเอกสารของลุงละเอียดเกินไป ลุงเจอคุณแล้วยิ้มแห้ง", effects: {relations: -2}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hf_keep_pounding
        text: "ตำส้มต่อ ไม่พูดสักคำ"
        effects: {happiness: -1, relations: 1}
        merit: [{cat: neutral}]
      - id: hf_warn_uncle
        text: "แวะไปเตือนลุงว่าข่าวออกแล้ว"
        effects: {relations: 2, network: -1}
        merit: [{cat: help_others, level: 1}]
      - id: hf_ask_who_first
        text: "ถามกลับว่าใครเล่ามาคนแรก"
        effects: {knowledge: 1, network: 1, relations: -1}
        merit: [{cat: neutral}]
      - id: hf_louder_rumor
        text: "ปล่อยข่าวว่าลุงเลี้ยงงูเหลือม"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งวงลืมเรื่องหย่าในพริบตา เดินไปขอดูงูแทน ลุงงงทั้งวัน แต่ไม่มีใครถามเรื่องเอกสารอีก", effects: {happiness: 2, relations: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "คนแห่ไปขอดูงูจนลุงต้องปิดประตูบ้าน ลุงรู้ว่าต้นเรื่องคือคุณตั้งแต่เย็นวันนั้น", effects: {relations: -2, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

