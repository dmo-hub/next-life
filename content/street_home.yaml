    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 0.25
    when: {age: [60, 72]}
    title: "เก้าอี้หน้าบ้านยาย"
    text: "ยายบ้านตรงข้ามตั้งเก้าอี้ตัวเก่าไว้หน้าบ้านมาหลายปี หลานของยายเคยประกอบมันในโรงงานเมืองนอกแล้วส่งกลับมา ขาข้างหนึ่งโยกแล้ว ไม่มีใครได้นั่ง ยายเช็ดทุกเช้า และเช้านี้กวักมือเรียกคุณไปดู"
    choices:
      - id: hf_fix_chair_leg
        text: "เอาไม้มาเสริมขาให้"
        outcomes:
          - {weight: 1, ok: true, text: "คุณตอกลิ่มไม้สองอัน เก้าอี้หยุดโยก ยายยังไม่ยอมให้ใครนั่ง แต่แบ่งกล้วยให้คุณทุกหวี", effects: {relations: 2, happiness: 2}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ตะปูตัวเดียวทำไม้แตกเป็นเส้น ยายมองแผลแล้วไม่พูดอะไร คุณเลยเอาผ้ามาพันไว้จนกว่าจะหาช่างได้", effects: {relations: -1, happiness: -1}, merit: [{cat: neutral}]}
        merit: [{cat: help_others, level: 1}]
      - id: hf_sit_beside
        text: "ยกเก้าอี้ตัวเองมานั่งข้าง ๆ"
        effects: {relations: 2, happiness: 1, health: 1}
        merit: [{cat: help_others, level: 1}]
      - id: hf_leave_chair
        text: "ปล่อยไว้ ยายคงรู้ของยาย"
        effects: {happiness: -1}
        merit: [{cat: neutral}]
      - id: hf_ask_assembler
        text: "ถามว่าคนประกอบเป็นยังไงบ้าง"
        effects: {relations: 1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: hf_secret_sit
        text: "แอบนั่งตอนยายไปตลาด"
        outcomes:
          - {weight: 1, ok: true, text: "เก้าอี้นั่งสบายกว่าที่คิดมาก คุณผล็อยหลับ ยายกลับมาเจอ ห่มผ้าให้ แล้วคิดค่าเช่าเป็นมะนาวสามผล", effects: {happiness: 2, health: 1}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ขาที่โยกเลือกวันนี้พอดี คุณลงไปนั่งกับพื้น ยายเดินกลับมาทันเห็นทั้งท่า", effects: {health: -1, relations: -1, happiness: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: homefront_baby_01
    type: A
    category: family
    stage: ชรา
    years: [2500, 2650]
    weight: 0.25
    when: {age: [60, 75]}
    title: "ทารกสามเดือนบ้านข้าง ๆ"
    text: "เพื่อนบ้านวัยเดียวกันเพิ่งรับหลานอายุสามเดือนมาเลี้ยงกะทันหัน แม่เด็กต้องรีบไปทำงานเมืองนอก ตีสองเสียงร้องทะลุฝา เช้านี้เพื่อนยืนหลับตาอยู่ที่รั้ว ขวดนมในมือคว่ำอยู่ แล้วถามคุณว่าเลี้ยงเด็กนี่ต้องทำยังไงนะ"
    choices:
      - id: hf_teach_bottle
        text: "ไปสอนชงนมตั้งแต่ต้น"
        outcomes:
          - {weight: 1, ok: true, text: "คุณเคยเห็นคนแถวบ้านลองอุ่นนมที่ข้อมือ เลยทำให้ดู เพื่อนจดลงกระดาษ คืนนั้นเสียงร้องหยุดตั้งแต่ห้าทุ่ม", effects: {relations: 2, happiness: 1, knowledge: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "วิธีที่จำมาเป็นของเมื่อห้าสิบปีก่อน หมอบอกว่าเลิกใช้แล้ว เพื่อนยังขอบคุณคุณอยู่ดี", effects: {relations: 1, happiness: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: hf_take_night_watch
        text: "รับเฝ้าเด็กครึ่งคืน"
        effects: {relations: 2, health: -2, happiness: 1}
        merit: [{cat: help_others, level: 1}]
      - id: hf_clinic_morning
        text: "พาไปหาหมอเช้านี้"
        effects: {knowledge: 1, network: 1, relations: 1}
        merit: [{cat: help_others, level: 1}]
      - id: hf_cook_and_leave
        text: "ทำกับข้าวไปให้ แล้วกลับบ้าน"
        effects: {relations: 1, health: 1}
        merit: [{cat: dana, level: 1}]
      - id: hf_lullaby_over_fence
        text: "ร้องเพลงกล่อมเด็กข้ามรั้ว"
        outcomes:
          - {weight: 1, ok: true, text: "เด็กเงียบ เพื่อนหลับ ไก่บ้านคุณหลับ ทั้งซอยนอนเต็มอิ่มเป็นครั้งแรกในรอบเดือน", effects: {happiness: 2, relations: 2}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "เด็กหยุดร้องเพื่อฟัง พอคุณหยุดก็ร้องต่อ คุณเลยร้องจนเสียงแหบไปสามวัน", effects: {health: -1, happiness: 1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
