    text: "ซองผ้าป่าของกลุ่มป้าที่ผู้ชายในบ้านไปทำงานเมืองนอกวางอยู่บนโต๊ะคุณ ยอดของทุกคนเขียนไว้เรียงบรรทัด ใครใส่เท่าไรอ่านออกหมด ท้ายซองมียอดรวมกำกับ บรรทัดเหนือชื่อคุณเป็นยอดที่สูงกว่าที่ตั้งใจไว้นิดหน่อย"
    choices:
      - id: hf_give_planned
        text: "ใส่เท่าที่ตั้งใจไว้แต่แรก"
