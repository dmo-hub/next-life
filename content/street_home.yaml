          - {weight: 1, ok: true, text: "ร้านหนึ่งหันไปขายเมล็ดพันธุ์ อีกร้านรับซ่อมจักรยาน ทุกร้านอยู่รอด และทุกร้านลดราคาให้คุณ", effects: {network: 2, relations: 1, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "สี่ร้านฟังแล้วพยักหน้า วันต่อมาทั้งสี่ร้านเปลี่ยนไปขายเมล็ดพันธุ์เหมือนกันหมด", effects: {happiness: -1, knowledge: 1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - id: hf_market_in_town
        text: "เข้าไปซื้อที่ตลาดอำเภอแทน"
        effects: {relations: -1, money: {unit: income_x, amount: -0.01}, happiness: 1}
        merit: [{cat: neutral}]
      - id: hf_four_bottles
        text: "ซื้อน้ำปลาร้านละขวด จบเรื่อง"
        outcomes:
          - {weight: 1, ok: true, text: "ทั้งสี่ร้านยิ้มให้คุณเท่ากันเป็นครั้งแรก น้ำปลาสี่ขวดอยู่ได้จนถึงปีหน้า", effects: {relations: 2, happiness: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
          - {weight: 1, text: "ทั้งซอยรู้ว่าคุณซื้อร้านละขวด เจ้าของร้านแรกถามว่าทำไมร้านอื่นได้ก่อน คุณก็ตอบไม่ได้", effects: {relations: -1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: homefront_merit_01
