    choices:
      - id: hf_back_her
        text: "เสนอให้จดชื่อเธอเป็นตัวแทน"
        outcomes:
          - {weight: 1, ok: true, text: "ที่ประชุมเงียบครู่หนึ่งแล้วก็จด ปีต่อมามีป้าอีกสองคนเดินมานั่งแถวเดียวกัน", effects: {network: 2, relations: 1, happiness: 1}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ผู้เฒ่าบางคนไม่พอใจที่คุณพูดแทรก ปีนี้เรื่องขอขุดลอกคลองหน้าบ้านคุณถูกเลื่อนไปก่อน", effects: {relations: -1, network: -1}, merit: [{cat: help_others, level: 1}]}
        merit: [{cat: help_others, level: 1}]
      - id: hf_head_down_minutes
        text: "ก้มหน้าจดรายงานต่อไป"
        effects: {happiness: -1, knowledge: 1}
        merit: [{cat: neutral}]
      - id: hf_side_elders
        text: "ขอให้รอถามผู้เฒ่าก่อน"
        effects: {network: 1, relations: -2}
        merit: [{cat: neutral}]
      - id: hf_ask_ledger
        text: "ถามเธอเรื่องบัญชีกองกลางเลย"
        effects: {knowledge: 2, network: 1}
        merit: [{cat: neutral}]
      - id: hf_bring_big_chair
        text: "ลุกไปยกเก้าอี้ตัวใหญ่ให้เธอ"
        outcomes:
          - {weight: 1, ok: true, text: "เก้าอี้ตัวนั้นเคยเป็นของประธาน ทุกคนเข้าใจตรงกันโดยไม่ต้องลงมติ เธอนั่งแล้วพยักหน้าให้คุณครั้งเดียว", effects: {happiness: 2, relations: 2}, merit: [{cat: help_others, level: 1}]}
          - {weight: 1, text: "ขาเก้าอี้หักกลางที่ประชุม ทั้งห้องหัวเราะจนลืมเรื่องเดิม คุณต้องซ่อมเก้าอี้ไปอีกสองสัปดาห์", effects: {happiness: 1, relations: -1, health: -1}, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]

  - id: homefront_shops_01
