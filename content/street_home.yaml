        merit: [{cat: dana, level: 1}]
      - id: hf_match_line_above
        text: "ใส่ให้เท่าบรรทัดบน"
        effects: {relations: 1, money: {unit: income_x, amount: -0.03}}
        merit: [{cat: dana, level: 1}]
      - id: hf_pencil_amount
