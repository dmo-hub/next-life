        merit: [{cat: dana, level: 1}]
      - id: hf_sum_check
        text: "ทักว่ายอดรวมท้ายซองบวกผิด"
        outcomes:
          - {weight: 1, ok: true, text: "ยอดรวมขาดไปจริง คนเดินซองขอบคุณ ปีต่อมากลุ่มป้ามาเชิญคุณถือบัญชีให้", effects: {network: 2, knowledge: 1, money: {unit: income_x, amount: -0.01}}, merit: [{cat: dana, level: 1}]}
          - {weight: 1, text: "ยอดที่ผิดเป็นลายมือประธานกลุ่ม คุณเดินไปตลาดอีกกี่ครั้งก็ยังมีคนพูดถึงเลขนั้นให้ได้ยิน", effects: {relations: -2, happiness: -1}, merit: [{cat: neutral}]}
