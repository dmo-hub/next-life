:root {

const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = rand(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function readBook() { try { return JSON.parse(localStorage.getItem(BOOK_KEY) || '[]'); } catch { return []; } }
function saveBook(key) {
  const b = readBook();
  if (!b.includes(key)) b.push(key);
  try { localStorage.setItem(BOOK_KEY, JSON.stringify(b)); } catch {}
  return b;
}

let S = null;
let keyHandler = null;

function newRun(carry) {
  const past = pick(PAST_NAMES);
  S = { past, age: 18 + rand(30), cause: pick(CAUSES), carry, route:null, name:'', skills:[], st:null, flags:new Set(), log:[], queue:[], idx:0, rbdUsed:false, dead:false };
  showPast();
}

function has(skill) { return S.skills.includes(skill); }

function startRoute(rid) {
  const r = ROUTES[rid];
  S.route = rid;
  S.name = pick(r.names).replace('{p}', S.past);
  S.st = { hp:100, ...r.start, fame:0, goal:0 };
  // ชาติก่อนในต่างโลกทิ้งความทรงจำไว้ชิ้นหนึ่ง: ค่าสูงสุดของรอบที่แล้ว +3
  if (S.carry) S.st[S.carry] += 3;
}

function buildQueue() {
  const r = ROUTES[S.route];
  const used = new Set([r.intro, r.finale]);
  const fits = (e, c) => !e.finale && e.id !== r.intro && (e.routes === null || e.routes.includes(S.route)) && e.ch.includes(c);
  const take = (c, n) => {
    const pool = shuffle(EVENTS.filter((e) => fits(e, c) && !used.has(e.id)));
    // ครึ่งแรกของแต่ละบทเอาจากเส้นทางตัวเองก่อน เรื่องจะได้เดินตามแนวที่เลือก
    pool.sort((a, b) => (a.routes?.length === 1 ? 0 : 1) - (b.routes?.length === 1 ? 0 : 1));
    const out = pool.slice(0, n);
    out.forEach((e) => used.add(e.id));
    return shuffle(out).map((e) => ({ id:e.id, ch:c }));
  };
  S.queue = [{ id:r.intro, ch:1 }, ...take(1, 1), ...take(2, 3), ...take(3, 3), { id:r.finale, ch:4 }];
  S.idx = 0;
}

function chance(c) {
  if (!c.stat) return null;
  let v = 50 + (S.st[c.stat] - c.dc) * 4;
  for (const sk of S.skills) if (SKILLS[sk].tag && SKILLS[sk].tag === c.tag) v += SKILLS[sk].add || 20;
  for (const b of [c.bonus, c.bonus2]) if (b && S.flags.has(b.flag)) v += b.add;
  return clamp(Math.round(v), 5, 95);
}

function boosted(c) {
  return S.skills.some((sk) => SKILLS[sk].tag && SKILLS[sk].tag === c.tag) || [c.bonus, c.bonus2].some((b) => b && S.flags.has(b.flag));
}

function applyFx(fx) {
  const out = {};
  for (const [k, raw] of Object.entries(fx || {})) {
    let v = raw;
    if (has('exp') && v > 0 && STAT[k]) v *= 2;
    if (has('storage') && k === 'gold' && v > 0) v = Math.round(v * 1.5);
    if (k === 'goal') S.st.goal = clamp(S.st.goal + v, 0, 100);
    else if (k === 'hp') S.st.hp = clamp(S.st.hp + v, 0, 100);
    else if (k === 'gold') S.st.gold = Math.max(0, S.st.gold + v);
    else S.st[k] = Math.max(0, S.st[k] + v);
    out[k] = v;
  }
  return out;
}

// ─── หน้าจอ ───
function bindKeys(buttons) {
  if (keyHandler) document.removeEventListener('keydown', keyHandler);
  keyHandler = (e) => {
    const n = Number(e.key);
    if (n >= 1 && n <= buttons.length && !buttons[n - 1].disabled) buttons[n - 1].click();
  };
  document.addEventListener('keydown', keyHandler);
}

function render(html, actions) {
  app.innerHTML = html;
  const buttons = [...app.querySelectorAll('.choice')];
  buttons.forEach((b, i) => b.addEventListener('click', () => actions[i]()));
  bindKeys(buttons);
  window.scrollTo({ top:0, behavior:'smooth' });
}

function btn(i, label, fx = '', disabled = false, extraCls = '') {

}

function showEvent() {
  const ev = byId[S.queue[S.idx].id];
  const cs = ev.choices;
  const labels = cs.map((c, i) => {
    const p = chance(c);
    const lacking = c.need && S.st.gold < c.need.gold;
    const fx = lacking ? `ต้องมีทอง ${c.need.gold}` : p === null ? (c.need ? `ใช้ทอง ${c.need.gold}` : '') : `${STAT[c.stat]} · ${p}%`;
    return btn(i, esc(c.t), fx, lacking, p !== null && boosted(c) ? 'boost' : '');
  });
  render(`${statusWin()}<section class="win"><div class="win-h"><span>${ev.finale ? 'เหตุการณ์สุดท้าย' : 'เหตุการณ์'}</span><span>${S.idx + 1}/${S.queue.length}</span></div>
    <div class="win-b">
      <h2>${esc(ev.title)}</h2>
      <p>${esc(ev.text)}</p>
      <div class="choices">${labels.join('')}</div>
    </div></section>`, cs.map((c) => () => resolve(ev, c)));
}

function resolve(ev, c) {
  let ok = true, out = c;
  if (c.stat) { ok = rand(100) < chance(c); out = ok ? c.win : c.lose; }
  const deltas = applyFx(out.fx);
  for (const f of [out.flag, out.flag2, c.flag]) if (f && (out.flag === f || out.flag2 === f || !c.stat)) S.flags.add(f);
  let sys = '';
  if (out.skill) {
    const rest = Object.keys(SKILLS).filter((k) => !has(k) && k !== 'luck');
    if (rest.length) { const sk = pick(rest); S.skills.push(sk); sys = `ได้รับสกิลใหม่ · ${SKILLS[sk].name}`; }
  }
  if (has('regen') && S.st.hp > 0) { S.st.hp = clamp(S.st.hp + 6, 0, 100); }
  if (S.st.hp <= 0) {
    if (has('rbd') && !S.rbdUsed) {
      S.rbdUsed = true; S.st.hp = 40;
      sys = 'เสียงนาฬิกาดังในหัว · เวลาย้อนกลับ · ย้อนเวลาเมื่อตาย ใช้ไปแล้ว';
    } else S.dead = true;
  }
  S.log.push(`${ev.title} — ${c.t}${c.stat ? (ok ? ' (สำเร็จ)' : ' (พลาด)') : ''}`);
  const chips = Object.entries(deltas).filter(([, v]) => v).map(([k, v]) => {
    const lab = k === 'goal' ? ROUTES[S.route].goal : FX_LABEL[k];
    return `<span class="${v > 0 ? 'up' : 'down'}">${esc(lab)} ${v > 0 ? '+' : ''}${v}</span>`;
  }).join('');
  const last = S.idx >= S.queue.length - 1;
  render(`${statusWin()}<section class="win"><div class="win-h"><span>ผลลัพธ์</span><span>${esc(ev.title)}</span></div>
    <div class="win-b">
      <div class="result ${ok ? '' : 'fail'}">
        ${c.stat ? `<div class="tag">${ok ? 'สำเร็จ' : 'พลาด'} · ${STAT[c.stat]}</div>` : ''}
        <p>${esc(out.text)}</p>
      </div>
      ${chips ? `<div class="deltas">${chips}</div>` : ''}
      ${sys ? `<p class="sysmsg">${esc(sys)}</p>` : ''}
      <div class="choices">${btn(0, S.dead ? 'ทุกอย่างมืดลงอีกครั้ง…' : last ? 'ดูตอนจบ' : 'ต่อไป')}</div>
    </div></section>`, [() => {
      if (S.dead || last) return showEnding();
      S.idx += 1;
      showEvent();
    }]);
}

function endingFor() {
  const r = ROUTES[S.route];
  if (S.dead) return { key:'death', title:'ตายอีกครั้งในต่างโลก', text:`${S.name} จากไปกลางทาง เทพธิดาถอนหายใจยาว แล้วหยิบแฟ้มของคุณขึ้นมาอีกรอบ "งั้นลองใหม่นะ"` };
  const won = S.flags.has('won');
  let tier = won && S.st.goal >= 50 ? 'best' : (won || S.st.goal >= 50) ? 'good' : 'bad';
  // ตอนจบพิเศษต้องชนะฉากสุดท้ายด้วยเส้นทางที่ธงนั้นปูไว้
  const special = { hero:'peacewin', noble:'princess', monster:'devour', villainess:'heroine', slowlife:'fenrir' }[S.route];
  const specialKey = { hero:'peace', noble:'princess', monster:'devour', villainess:'heroine', slowlife:'fenrir' }[S.route];
  if (tier === 'best' && S.flags.has(special)) tier = specialKey;
  if (S.route === 'monster' && won && S.flags.has('devour')) tier = 'devour';
  const [title, text] = r.end[tier];
  return { key:`${S.route}:${tier}`, title, text };
}

function epithet() {
  const top = Object.keys(STAT).reduce((a, b) => (S.st[b] > S.st[a] ? b : a));
  const base = { str:'จอมพลังแห่งต่างโลก', mag:'ปราชญ์ผู้เข้าถึงมานา', cha:'คนที่ใครเจอก็รัก', luk:'ผู้ถูกโชคเลือก' }[top];
  const extra = S.st.fame >= 50 ? ' · ชื่อถูกแต่งเป็นเพลง' : S.st.gold >= 2000 ? ' · เศรษฐีต่างโลก' : '';
  return { top, label: base + extra };
}

function showEnding() {
  const end = endingFor();
  const book = saveBook(end.key);
  const ep = epithet();
  render(`${S.route ? statusWin() : ''}<section class="win"><div class="win-h"><span>ตอนจบ</span><span>สมุดตอนจบ ${book.length}/${ENDING_TOTAL}</span></div>
    <div class="win-b">
      <div class="kicker">${esc(ROUTES[S.route].name)} · ${esc(S.name)} (ชาติก่อน ${esc(S.past)})</div>
      <div class="end-title">${esc(end.title)}</div>
      <p>${esc(end.text)}</p>
      <p class="sysmsg">ฉายา · ${esc(ep.label)}</p>
      <details><summary>เส้นทางที่เลือก ${S.log.length} เหตุการณ์</summary><ol class="log">${S.log.map((l) => `<li>${esc(l)}</li>`).join('')}</ol></details>
      <div class="choices">
        ${btn(0, 'ไปเกิดใหม่อีกรอบ', `เก็บ ${STAT[ep.top]} +3`)}
        ${btn(1, 'เริ่มใหม่หมด')}
      </div>
    </div></section>`, [() => newRun(ep.top), () => newRun(null)]);
}

newRun(null);
})();
</script>
</body>
</html>
