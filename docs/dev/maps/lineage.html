<style>
  :root { --ink: #3b2a1a; --paper: #efe3c2; }
  body { margin: 0; background: #1b1610; color: #f1e7cf; font-family: "Sarabun", "Leelawadee UI", system-ui, sans-serif; }
  .wrap { display: flex; gap: 14px; padding: 14px; flex-wrap: wrap; align-items: flex-start; }
  .mapbox { flex: 1 1 820px; max-width: 1200px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 4px 24px #000a; }
  aside { flex: 0 0 320px; font-size: 14px; }
  .card { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 2px 10px #0006; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .muted { color: #6b5638; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; font: 13px/1.4 inherit; }
  select, input, button { font: inherit; padding: 3px 6px; }
  label.row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 3px 4px; border-top: 1px solid #d6c59c; vertical-align: top; }
  .x { cursor: pointer; color: #8a3b12; }
</style>

<body>

<div class="wrap">
  <div class="mapbox">
    <canvas id="map" width="1200" height="460"></canvas>
    <div class="card" style="margin-top:12px"><h2>รุ่นในผัง</h2><table id="rows"></table></div>
  </div>
  <aside>
    <div class="card">
      <h2>วางข้อความผังตระกูลจากเกม</h2>
      <div class="muted" style="font-size:12px">ในเกม: แท็บผังตระกูล → "อ่านเป็นข้อความ" → คัดลอกทุกบรรทัด "รุ่นที่ …" มาวาง</div>
      <textarea id="paste" placeholder="รุ่นที่ 1 · สมชาย · ชาย · จ.ขอนแก่น · ฐานะยากจน · ตายอายุ 71 · ไปภูมิมนุษย์"></textarea>
      <button id="load">แทนผังด้วยข้อความนี้</button> <span id="parsed" class="muted"></span>
    </div>
    <div class="card">
      <h2>เพิ่มรุ่นเอง</h2>
      <label class="row">ชื่อ <input id="fName" style="flex:1"></label>
      <label class="row"><input id="fAway" type="checkbox"> ชาติต่างโลก · โลก <input id="fWorld" style="flex:1"></label>
      <label class="row">ฐานะตอนตาย <select id="fCls" style="flex:1"></select></label>
      <label class="row">อายุ <input id="fAge" type="number" min="0" max="120" value="70" style="width:70px"> <input id="fGone" type="checkbox"> หายตัว</label>
      <label class="row">ภูมิที่ไป <select id="fRealm" style="flex:1"></select></label>
      <label class="row">ทาง <select id="fPath" style="flex:1"></select></label>
      <button id="add" style="margin-top:6px">เพิ่มต่อท้าย</button>
    </div>
    <div class="card">
      <h2>ตระกูล</h2>
      <label class="row">ชื่อเสียงตระกูล <select id="fame" style="flex:1"></select></label>
      <div style="margin-top:6px">ฉายาตระกูลที่ได้</div>
      <div id="titles"></div>
      <div style="margin-top:8px"><button id="reset">ล้างผังทั้งหมด</button></div>
    </div>
  </aside>
</div>
<script src="core.js"></script>
<script>
const { label, badge, vignette, cartouche, load, save } = MapCore;
// ---- ข้อมูลตามแกน next-life main (src/engine: CLASSES · REALMS · KIN_TIERS · FAME.names · FAMILY_TITLES) · ตรวจด้วย node maps/check-data.mjs ----
const CLASSES = ['ยากไร้', 'ยากจนมาก', 'ยากจน', 'ค่อนข้างจน', 'ชนชั้นกลางล่าง', 'ชนชั้นกลาง', 'ชนชั้นกลางบน', 'มีอันจะกิน', 'ร่ำรวย', 'มั่งคั่ง'];
const REALMS = ['นรก', 'เปรต', 'ดิรัจฉาน', 'มนุษย์', 'เทวดา'];
const KIN = ['ลูก', 'หลาน', 'เหลน'];
const FAME = ['ไร้ชื่อ', 'มีหน้ามีตา', 'ผู้มีบารมีในถิ่น', 'ตระกูลใหญ่'];
const FAMILY_TITLES = ['ตระกูลไต่บันได', 'บรรพบุรุษไม่เคยตกนรก', 'หนี้ที่ส่งต่อกันมาสามรุ่น', 'ตระกูลอายุยืน', 'ผีบรรพบุรุษเฝ้าบ้าน', 'ดวงวิญญาณพเนจร', 'ตระกูลมีเทวดา'];
const KEY = 'nextlife-lineage';
// อักษรในวงภูมิ = พยัญชนะหลัก (ตัวแรกของ เปรต/เทวดา เป็นสระลอย อ่านไม่ออก)
const REALM_GLYPH = { นรก: 'น', เปรต: 'ป', ดิรัจฉาน: 'ด', มนุษย์: 'ม', เทวดา: 'ท' };
const REALM_COL = { นรก: '#b0412e', เปรต: '#8a5a8a', ดิรัจฉาน: '#6f7d3a', มนุษย์: '#9a7d42', เทวดา: '#c8961e' };

// แถวเดียวกับที่เกมเก็บ: {name, cls, age, gone, realm, path, tier} หรือ {isekai, name, world, ending}
// บรรทัดจากเกม (lineageText): "รุ่นที่ N · [ชื่อ ·] เพศ · [จังหวัด ·] ฐานะX · ตายอายุ|หายตัวไปตอนอายุ N · ไปภูมิY [· กลับมาเกิดเป็นลูก/หลาน/เหลน] [· …]"
//                           ต่างโลก: "รุ่นที่ N · ชื่อ · ต่างโลก (โลก) · ตอนจบ"
function parseLine(line) {
  const parts = line.trim().split(' · ');
  if (!/^รุ่นที่ \d+$/.test(parts[0] ?? '')) return null;
  const away = parts.findIndex((p) => /^ต่างโลก \(.+\)$/.test(p));
  if (away > 0) return { isekai: true, name: parts.slice(1, away).join(' · '), world: parts[away].slice('ต่างโลก ('.length, -1), ending: parts.slice(away + 1).join(' · ') };
  const cls = parts.find((p) => p.startsWith('ฐานะ'))?.slice(4);
  const end = parts.find((p) => /^(ตายอายุ|หายตัวไปตอนอายุ) \d+$/.test(p));
  const realm = parts.find((p) => p.startsWith('ไปภูมิ'))?.slice(6);
  if (!CLASSES.includes(cls) || !end || !REALMS.includes(realm)) return null;
  const kin = parts.find((p) => p.startsWith('กลับมาเกิดเป็น'))?.slice(14);
  const sexAt = parts.findIndex((p) => p === 'ชาย' || p === 'หญิง');
  return { name: sexAt > 1 ? parts.slice(1, sexAt).join(' · ') : '', cls, age: Number(end.match(/\d+$/)[0]), gone: end.startsWith('หาย'), realm, path: KIN.includes(kin) ? 'child' : 'karma', tier: KIN.indexOf(kin) + 1 || null };
}

let state = load(KEY, null);
if (!state || !Array.isArray(state.rows)) state = { rows: [], fame: 0, titles: [] };
const persist = () => save(KEY, state);

const cv = document.getElementById('map');
const c = cv.getContext('2d');
const W = cv.width, H = cv.height;
const mix = (a, b, t) => `rgb(${[1, 3, 5].map((k) => Math.round(parseInt(a.slice(k, k + 2), 16) + (parseInt(b.slice(k, k + 2), 16) - parseInt(a.slice(k, k + 2), 16)) * t)).join(',')})`;
const clsCol = (cls) => mix('#5a4322', '#f0d78c', Math.max(0, CLASSES.indexOf(cls)) / (CLASSES.length - 1));

function draw() {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a1f14'); g.addColorStop(1, '#17110d');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  cartouche(c, 'ผังตระกูล', `${state.rows.length} รุ่น · ชื่อเสียง ${FAME[state.fame]}${state.titles.length ? ` · ฉายาตระกูล ${state.titles.length}` : ''}`, { x: 20, y: 18, w: 460 });
  const rows = state.rows;
  if (!rows.length) {
    label(c, 'ยังไม่มีรุ่นในผัง — วางข้อความจากเกม หรือเพิ่มรุ่นเอง', W / 2, H / 2, { size: 18 });
    vignette(c, W, H);
    return;
  }
  const left = 70, right = W - 70, gap = rows.length > 1 ? (right - left) / (rows.length - 1) : 0;
  const yHome = H * 0.62, yAway = H * 0.34, r = Math.max(9, Math.min(22, gap * 0.3 || 22));
  const pts = rows.map((l, i) => [rows.length > 1 ? left + i * gap : W / 2, l.isekai ? yAway : yHome]);
  // เส้นต่อรุ่น: ทองทึบระหว่างชาติไทย · ประเส้นเมื่อแตะชาติต่างโลก · ทางเป็นลูกหลาน = เส้นหนา
  for (let i = 1; i < pts.length; i++) {
    const away = rows[i - 1].isekai || rows[i].isekai;
    c.save();
    c.setLineDash(away ? [6, 6] : []);
    c.strokeStyle = away ? 'rgba(122,162,200,.75)' : 'rgba(217,180,90,.8)';
    c.lineWidth = !away && rows[i - 1].path === 'child' ? 5 : 2.5;
    c.beginPath(); c.moveTo(...pts[i - 1]); c.lineTo(...pts[i]); c.stroke();
    c.restore();
  }
  const dense = gap && gap < 70;
  rows.forEach((l, i) => {
    const [x, y] = pts[i];
    c.save();
    c.fillStyle = l.isekai ? '#2c3e52' : clsCol(l.cls);
    c.strokeStyle = l.isekai ? '#7aa2c8' : '#17110d';
    c.lineWidth = 2;
    c.setLineDash(l.gone ? [4, 3] : []);
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
    c.restore();
    c.fillStyle = l.isekai ? '#cfe0f0' : '#17110d';
    c.font = `bold ${Math.round(r * 0.8)}px Sarabun, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(i + 1), x, y + 1);
    if (l.isekai) {
      if (!dense) label(c, l.world || 'ต่างโลก', x, y - r - 10, { size: 12, color: '#2c3e52' });
      return;
    }
    if (!dense && l.name) label(c, l.name, x, y - r - 10, { size: 12 });
    label(c, `${l.gone ? 'หาย' : 'อายุ'} ${l.age}`, x, y + r + 18, { size: dense ? 10 : 12 });
    badge(c, x, y + r + 40, REALM_GLYPH[l.realm], REALM_COL[l.realm], dense ? 8 : 10);
    if (!dense) label(c, l.realm, x, y + r + 66, { size: 11, color: REALM_COL[l.realm] });
    if (l.path === 'child' && i + 1 < rows.length && !dense) label(c, `เกิดเป็น${KIN[(l.tier ?? 1) - 1]}`, (x + pts[i + 1][0]) / 2, yHome - 14, { size: 11, italic: true, color: '#8a3b12' });
  });
  // แถบล่าง: ฐานะไล่สี 10 ชั้น + ภูมิ 5
  CLASSES.forEach((cl, k) => { c.fillStyle = clsCol(cl); c.fillRect(20 + k * 26, H - 30, 24, 10); });
  label(c, 'ฐานะต่ำ → สูง', 20 + 130, H - 36, { size: 11 });
  REALMS.forEach((rl, k) => badge(c, 330 + k * 26, H - 25, REALM_GLYPH[rl], REALM_COL[rl], 9));
  label(c, 'ภูมิที่ไป', 330 + 52, H - 40, { size: 11 });
  vignette(c, W, H);
}

function table() {
  document.getElementById('rows').innerHTML = state.rows.map((l, i) => `<tr><td>รุ่นที่ ${i + 1}</td><td>${l.isekai ? `${l.name} · ต่างโลก (${l.world}) · ${l.ending ?? ''}` : `${l.name ? `${l.name} · ` : ''}ฐานะ${l.cls} · ${l.gone ? 'หายตัวไปตอนอายุ' : 'ตายอายุ'} ${l.age} · ไปภูมิ${l.realm}${l.path === 'child' ? ` · กลับมาเกิดเป็น${KIN[(l.tier ?? 1) - 1]}` : ''}`}</td><td class="x" data-i="${i}">ลบ</td></tr>`).join('') || '<tr><td class="muted">ยังไม่มี</td></tr>';
}
function all() { draw(); table(); }

const fill = (id, xs) => { const s = document.getElementById(id); xs.forEach((x, i) => s.add(new Option(x, String(i)))); return s; };
fill('fCls', CLASSES).value = '2';
fill('fRealm', REALMS).value = '3';
fill('fPath', ['ไปตามกรรม', ...KIN.map((k) => `กลับมาเกิดเป็น${k}`)]);
const fameEl = fill('fame', FAME);
fameEl.value = String(state.fame);
fameEl.onchange = () => { state.fame = Number(fameEl.value); persist(); draw(); };
document.getElementById('titles').innerHTML = FAMILY_TITLES.map((t) => `<label class="row"><input type="checkbox" value="${t}"${state.titles.includes(t) ? ' checked' : ''}> ${t}</label>`).join('');
document.getElementById('titles').onchange = (e) => {
  state.titles = [...document.querySelectorAll('#titles input:checked')].map((x) => x.value);
  persist(); draw();
};
document.getElementById('load').onclick = () => {
  const lines = document.getElementById('paste').value.split(/\r?\n/).filter((l) => l.trim());
  const rows = lines.map(parseLine).filter(Boolean);
  document.getElementById('parsed').textContent = `อ่านได้ ${rows.length}/${lines.length} บรรทัด`;
  if (!rows.length) return;
  state.rows = rows; persist(); all();
};
document.getElementById('add').onclick = () => {
  const v = (id) => document.getElementById(id);
  const tierIx = Number(v('fPath').value);
  state.rows.push(v('fAway').checked
    ? { isekai: true, name: v('fName').value.trim(), world: v('fWorld').value.trim(), ending: '' }
    : { name: v('fName').value.trim(), cls: CLASSES[Number(v('fCls').value)], age: Math.max(0, Math.min(120, Number(v('fAge').value) || 0)), gone: v('fGone').checked, realm: REALMS[Number(v('fRealm').value)], path: tierIx ? 'child' : 'karma', tier: tierIx || null });
  persist(); all();
};
document.getElementById('rows').onclick = (e) => {
  const i = e.target.dataset?.i;
  if (i === undefined) return;
  state.rows.splice(Number(i), 1); persist(); all();
};
document.getElementById('reset').onclick = () => { state = { rows: [], fame: 0, titles: [] }; persist(); fameEl.value = '0'; document.querySelectorAll('#titles input').forEach((x) => (x.checked = false)); all(); };
document.fonts?.ready.then(all);
all();
</script>
</body>
