    { k: 'order', t: 'ปุ่มแรก', o: [['nirvana', 'นิพพาน'], ['bodhi', 'โพธิสัตว์']] },
    { k: 'confirm', t: 'กดนิพพาน', o: [['ask', 'ถามซ้ำก่อนจบสาย'], ['none', 'จบทันที']] },
    { k: 'glyph', t: 'ภาพกลางจอ', o: [['lotus', 'ดอกบัว'], ['halo', 'รัศมี'], ['none', 'ไม่มี']] },
  ];
  // preset ≥2 (ใบ 162): A = ใกล้ของเดิมที่สุด · B = ตัวเลขเด่น · C = แถวเลื่อน + จอสว่าง
  const PRESET = {
    a: { label: 'สถิติวิญญาณ', pos: '4', count: 'lives', bar: 'wrap', layout: 'list', realm: 'times', job: 'all', perLife: 'off', dot: 'new', theme: 'b', head: 'ครบบารมีข้ามชาติ', title: 'ผู้บำเพ็ญบารมี', showLives: 'on', hints: 'on', choiceLayout: 'stack', order: 'nirvana', confirm: 'ask', glyph: 'lotus' },
    b: { label: 'วิญญาณ', pos: 'end', count: 'lives', bar: 'grid3', layout: 'tiles', realm: 'times', job: 'top6', perLife: 'on', dot: 'none', theme: 'b', head: 'ทางแยกของวิญญาณ', title: 'ผู้บำเพ็ญบารมี', showLives: 'on', hints: 'on', choiceLayout: 'pair', order: 'bodhi', confirm: 'ask', glyph: 'halo' },
    c: { label: 'ข้ามชาติ', pos: '2', count: 'none', bar: 'scroll', layout: 'para', realm: 'names', job: 'top6', perLife: 'off', dot: 'new', theme: 'mist', head: 'สิ้นสุดวัฏสงสาร?', title: 'ผู้บำเพ็ญบารมี', showLives: 'off', hints: 'off', choiceLayout: 'stack', order: 'nirvana', confirm: 'none', glyph: 'none' },
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let cfg = clone(PRESET.a), base = 'a', note = '', ui = { vp: 390, scene: 'soul', data: 'few', ask: false, done: '' };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.cfg) { cfg = Object.assign(clone(PRESET[s.base] || PRESET.a), s.cfg); base = s.base || 'a'; note = s.note || ''; Object.assign(ui, s.ui || {}); }
  } catch (e) { /* storage ปิด — ใช้ค่าเริ่ม */ }
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify({ cfg, base, note, ui: { vp: ui.vp, scene: ui.scene, data: ui.data } })); } catch (e) { /* file:// บางเบราว์เซอร์ปิด storage */ } };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const $ = (id) => document.getElementById(id);

  function stats() {
    const L = DATA[ui.data].lives;
    const tally = (xs) => { const m = new Map(); xs.filter(Boolean).forEach((x) => m.set(x, (m.get(x) || 0) + 1)); return [...m]; };
    return { L, n: L.length, age: L.reduce((s, x) => s + x[1], 0), realms: tally(L.map((x) => x[3])), jobs: tally(L.map((x) => x[2])) };
  }
  const realmText = (r) => (cfg.realm === 'times' ? r.map(([k, v]) => (v > 1 ? `${k} ×${v}` : k)) : r.map(([k]) => k));
  const jobText = (j) => {
    const names = j.map(([k]) => k);
    return cfg.job === 'top6' && names.length > 6 ? [...names.slice(0, 6), `อีก ${names.length - 6} อาชีพ`] : names;
  };
  const chips = (xs) => `<ul class="chips">${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;

  function soulScreen() {
    const s = stats();
    const tabs = [['m', 'อนุสรณ์', `${s.n}`], ['t', 'ฉายา', '12/80'], ['k', 'สกิล', '3'], ['p', 'ภาพบ้านเมือง', '5/40'], ['d', 'เคยจากไป', '4']];
    const mine = ['s', cfg.label, cfg.count === 'lives' ? `${s.n}` : ''];
    const at = cfg.pos === 'end' ? tabs.length : cfg.pos === '2' ? 1 : 3;
    tabs.splice(at, 0, mine);
    const bar = tabs.map(([k, t, c]) => `<button type="button" aria-pressed="${k === 's'}">${esc(t)}${c ? ` ${c}` : ''}${k === 't' || k === 'p' ? '<span class="new-dot" aria-label="มีของใหม่"></span>' : ''}</button>`).join('');
    const realms = realmText(s.realms), jobs = jobText(s.jobs);
    let inner;
    if (cfg.layout === 'tiles') {
      inner = `<div class="tiles"><div class="tile"><b>${s.n}</b><small>ชาติที่เกิด</small></div><div class="tile"><b>${s.age.toLocaleString('th-TH')}</b><small>ปี อายุรวม</small></div><div class="tile"><b>${s.realms.length}</b><small>ภูมิที่เคยไป</small></div><div class="tile"><b>${s.jobs.length}</b><small>อาชีพที่เคยเป็น</small></div></div>
        <h4>ภูมิที่เคยไป</h4>${chips(realms)}<h4>อาชีพที่เคยเป็น</h4>${chips(jobs)}`;
    } else if (cfg.layout === 'para') {
      inner = `<p class="para">วิญญาณดวงนี้เกิดมาแล้ว ${s.n} ชาติ อายุรวมกัน ${s.age.toLocaleString('th-TH')} ปี เคยไปมาแล้ว${realms.join(' ')} · เคยเป็น${jobs.join(' ')}</p>`;
    } else {
      inner = `<dl><dt>เกิดมาแล้ว</dt><dd>${s.n} ชาติ</dd><dt>อายุรวม</dt><dd>${s.age.toLocaleString('th-TH')} ปี</dd><dt>ภูมิที่เคยไป</dt><dd>${esc(realms.join(' · '))}</dd><dt>อาชีพที่เคยเป็น</dt><dd>${esc(jobs.join(' · '))}</dd></dl>`;
    }
    const per = cfg.perLife === 'on' ? `<h4>รายชาติ</h4><ul class="lives">${s.L.slice().reverse().map((x, i) => `<li>ชาติที่ ${s.n - i} · ${esc(x[0])} · อายุ ${x[1]} ปี${x[2] ? ` · ${esc(x[2])}` : ''} · ไป${esc(x[3])}</li>`).join('')}</ul>` : '';
    const fresh = cfg.dot === 'new' ? ' <span class="new-tag">ใหม่</span>' : '';
    return `<article class="card a"><div class="top"><b>${GAME}</b><small>ชั้นสมุด</small></div>
      <div class="body"><div class="bk-tabs ${cfg.bar}" role="group" aria-label="เล่มในชั้นสมุด">${bar}</div>
      <p class="bk-intro">ชีวิตทุกชาติของวิญญาณดวงนี้ นับข้ามตระกูล${fresh}</p>
      <div class="soul">${inner}${per}</div></div>
      <div class="choices"><button type="button" class="choice"><span>กลับ</span></button></div></article>`;
  }

  const GLYPH = {
    lotus: '<svg class="glyph" viewBox="0 0 84 84" aria-hidden="true"><path d="M42 18c8 10 8 26 0 38-8-12-8-28 0-38z"/><path d="M42 56c-6-12-18-18-30-16 2 12 14 18 30 16z"/><path d="M42 56c6-12 18-18 30-16-2 12-14 18-30 16z"/><path d="M14 64h56"/></svg>',
    halo: '<svg class="glyph" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="14"/><circle cx="42" cy="42" r="24" stroke-dasharray="3 5"/><circle cx="42" cy="42" r="34" stroke-dasharray="1 7"/></svg>',
  };
  function endScreen() {
    const s = stats();
    const top = `<div class="top"><b>${GAME}</b><small>ระหว่างชาติ</small></div>`;
    if (ui.ask) {
      return `<article class="card ${cfg.theme}">${top}<div class="body"><h3 class="lead">นิพพาน จบสายตระกูลนี้จริงไหม?</h3><p class="sub">ไม่มีชาติถัดไป ตระกูลนี้จบลงตรงนี้ · ชีวิตทุกชาติยังอยู่ในชั้นสมุด กู้ทางเกิดต่อไม่ได้</p></div>
        <div class="choices"><button type="button" class="choice" data-go="nirvana-yes"><span>นิพพาน จบสาย</span></button><button type="button" class="choice" data-go="back"><span>กลับไปเลือกใหม่</span></button></div></article>`;
    }
    if (ui.done) {
      const t = ui.done === 'nirvana' ? ['ดับสนิท', 'ตระกูลนี้จบลงแล้ว · จอนี้เป็นตัวแทนฉากจบของใบ 170'] : ['ตั้งปรารถนาแล้ว', 'เกิดต่อตามทางเดิม · จอนี้เป็นตัวแทนการ์ดเกิดของใบ 170'];
      return `<article class="card ${cfg.theme}">${top}<div class="body"><h3>${t[0]}</h3><p class="sub">${t[1]}</p></div><div class="choices"><button type="button" class="choice" data-go="back"><span>กลับจอเลือก (หน้า tweak)</span></button></div></article>`;
    }
    const opt = {
      nirvana: ['นิพพาน (จบสาย)', 'ตระกูลนี้จบ ไม่มีชาติถัดไป · ชีวิตทุกชาติอยู่ในชั้นสมุด'],
      bodhi: ['ตั้งปรารถนาโพธิสัตว์ เกิดต่อ', 'เกิดต่อตามทางเดิม · ฉายาติดตัวไปทุกชาติ'],
    };
    const keys = cfg.order === 'nirvana' ? ['nirvana', 'bodhi'] : ['bodhi', 'nirvana'];
    const btn = (k) => `<button type="button" class="choice" data-go="${k}"><span>${opt[k][0]}${cfg.hints === 'on' ? `<span class="hint">${opt[k][1]}</span>` : ''}</span></button>`;
    const lead = cfg.showLives === 'on' ? `<p>สั่งสมบุญข้ามมา ${s.n} ชาติ จนถึงทางแยกนี้</p>` : '';
    return `<article class="card ${cfg.theme}">${top}<div class="body">${GLYPH[cfg.glyph] || ''}<h3>${esc(cfg.head)}</h3>${lead}<p class="sub">ได้ฉายา ${esc(cfg.title || '…')}</p></div>
      <div class="choices ${cfg.choiceLayout}">${keys.map(btn).join('')}</div></article>`;
  }

  function render() {
    const scr = $('scr'), dev = $('dev');
    scr.dataset.vp = ui.vp;
    scr.style.width = `${ui.vp}px`;
    scr.innerHTML = `<div class="app">${ui.scene === 'soul' ? soulScreen() : endScreen()}</div>`;
    scr.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
      const g = b.dataset.go;
      if (g === 'back') { ui.ask = false; ui.done = ''; }
      else if (g === 'nirvana' && cfg.confirm === 'ask') ui.ask = true;
      else { ui.ask = false; ui.done = g === 'nirvana-yes' ? 'nirvana' : g; }
      render();
    });
    const room = dev.parentElement.clientWidth - 32;
    const k = Math.min(1, room / ui.vp);
    scr.style.transform = `scale(${k})`;
    dev.style.width = `${ui.vp * k}px`;
    dev.style.height = `${scr.scrollHeight * k}px`;
    // วัดล้นแนวนอนของจอ (ไม่นับข้างในแถบที่ตั้งใจให้เลื่อน) — ใบ 162: 390 ต้องได้ 0 ทุก preset
    const over = Math.max(0, scr.scrollWidth - ui.vp);
    const o = $('ovf');
    o.textContent = `ล้นแนวนอน ${over} px`;
    o.className = over ? 'bad' : 'ok';
    document.querySelectorAll('#scene button').forEach((b) => b.classList.toggle('on', b.dataset.s === ui.scene));
    document.querySelectorAll('#vp button').forEach((b) => b.classList.toggle('on', +b.dataset.v === ui.vp));
    document.querySelectorAll('#data button').forEach((b) => b.classList.toggle('on', b.dataset.d === ui.data));
    $('out').value = output();
    store();
  }

  // ค่าที่ต่างจาก preset ที่เริ่ม ⇒ ใบ 163 จดได้ทั้ง "ทั้งชุด" และ "ขยับอะไร"
  function output() {
    const p = PRESET[base];
    const changed = Object.keys(cfg).filter((k) => cfg[k] !== p[k]);
    return JSON.stringify({ page: 'b67-tweak', ticket: 162, base, changed, soul: pick(['label', 'pos', 'count', 'bar', 'layout', 'realm', 'job', 'perLife', 'dot']), end: pick(['theme', 'head', 'title', 'showLives', 'hints', 'choiceLayout', 'order', 'confirm', 'glyph']), note }, null, 1);
  }
  const pick = (ks) => Object.fromEntries(ks.map((k) => [k, cfg[k]]));

  function panel() {
    let h = `<h1>หน้า tweak B67</h1><p class="hint">แท็บสถิติวิญญาณในชั้นสมุด (ข้อ 280) + จอถึงเกณฑ์บารมีข้ามชาติ (ข้อ 282) · ปรับแล้วจอขวาเปลี่ยนทันที · ตัวเลขบนจอเป็นตัวอย่าง · ไม่มีแต้มบุญ/ยอดบารมีบนจอ (ด่าน merit) · เสร็จแล้วกด <b>คัดลอกค่า</b> วางตอบในแชท</p>
      <div class="row"><span class="lb">เริ่มจาก preset</span><div class="btns">${Object.keys(PRESET).map((k) => `<button type="button" class="pre${k === base ? ' on' : ''}" data-p="${k}">${k.toUpperCase()}</button>`).join('')}</div></div>`;
    for (const c of C) {
      if (c.g) { h += `<h2>${c.g}</h2>`; continue; }
      h += `<div class="row"><span class="lb">${c.t}</span>`;
      h += c.ty === 'text' ? `<input type="text" data-k="${c.k}" value="${esc(cfg[c.k])}">` : `<div class="seg">${c.o.map(([v, t]) => `<button type="button" data-k="${c.k}" data-v="${esc(v)}" class="${cfg[c.k] === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
      h += '</div>';
    }
    h += `<h2>คัดลอก</h2><div class="row"><span class="lb">หมายเหตุถึงผู้พัฒนา</span><textarea id="note" rows="3">${esc(note)}</textarea></div>
      <div class="btns"><button type="button" class="pri" id="copy">คัดลอกค่า</button></div><p id="msg"></p>
      <textarea id="out" rows="8" readonly aria-label="ข้อความที่จะคัดลอก"></textarea>`;
    const ctl = $('ctl');
    ctl.innerHTML = h;
    ctl.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { base = b.dataset.p; cfg = clone(PRESET[base]); ui.ask = false; ui.done = ''; panel(); render(); });
    ctl.querySelectorAll('.seg [data-k]').forEach((b) => b.onclick = () => {
      cfg[b.dataset.k] = b.dataset.v;
      ui.scene = C.slice(0, C.findIndex((c) => c.k === b.dataset.k)).filter((c) => c.g).pop().sc;
      ui.ask = false; ui.done = '';
      b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      render();
    });
    ctl.querySelectorAll('input[data-k]').forEach((i) => i.oninput = () => { cfg[i.dataset.k] = i.value; ui.scene = 'end'; render(); });
    $('note').oninput = (e) => { note = e.target.value; render(); };
    $('copy').onclick = async () => {
      const o = $('out');
      try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
      $('msg').textContent = 'คัดลอกแล้ว — วางตอบในแชทได้เลย';
    };
  }

  document.querySelectorAll('#scene button').forEach((b) => b.onclick = () => { ui.scene = b.dataset.s; ui.ask = false; ui.done = ''; render(); });
  document.querySelectorAll('#vp button').forEach((b) => b.onclick = () => { ui.vp = +b.dataset.v; render(); });
  document.querySelectorAll('#data button').forEach((b) => b.onclick = () => { ui.data = b.dataset.d; render(); });
  addEventListener('resize', render);
  panel();
  render();
  // ฟอนต์มาทีหลัง ความกว้างปุ่มเปลี่ยน ⇒ วัดล้นซ้ำ
  document.fonts?.ready.then(render);
})();
</script>
</body>
</html>
