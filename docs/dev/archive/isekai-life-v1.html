const app = document.getElementById('app');
const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const clamp = (v) => Math.max(0, Math.min(100, Math.round(v)));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let S = null, timer = null, speed = 1, shopOpen = false, gen = 0;

function weighted(list) {
  const total = list.reduce((s, x) => s + x.odds, 0);
  let r = Math.random() * total;
  for (const x of list) if ((r -= x.odds) < 0) return x;
  return list[0];
}

function born() {
  gen++;
  const role = weighted(ROLES);
  const past = pick(PAST);
  const name = pick(NAMES[role.id]).replace('{p}', past);
  const st = { hp: 70, hap: 60, rel: 50, kno: 15 };
  for (const k of Object.keys(st)) st[k] = clamp(st[k] + (role.mod[k] ?? 0) + rand(11) - 5);
  const cheat = pick(CHEATS);
  S = {
    role, name, past, sex: pick(['ชาย', 'หญิง']), st, mana: 5, gold: role.gold,
    age: role.start ?? 0, blk: Math.floor((role.start ?? 0) / role.block), yearInBlk: (role.start ?? 0) % role.block,
    focus: null, traits: { brave: 0, kind: 0, sly: 0, curious: 0, calm: 0 }, merit: {}, cheat,
    parents: role.id === 'slime' || role.id === 'hero' ? [] : [[pick(PARENT), 20 + rand(20)], [pick(PARENT), 18 + rand(18)]],
    family: [], items: [], log: [], fired: {}, pending: null, dead: null,
  };
  showBirth();
}

  const r = S.role;
  app.innerHTML = `<section class="box">
    <div class="eyebrow">ดวงวิญญาณของ${esc(S.past)}ได้ไปเกิดเป็น</div>
    <h1 style="font-size:28px">${esc(r.name)}</h1>
    <dl style="margin:12px 0">
      <dt>นาม</dt><dd>${esc(S.name)}</dd><dt>เพศ</dt><dd>${S.sex}</dd>
      <dt>ครอบครัว</dt><dd>${esc(r.fam)}</dd><dt>ที่เกิด</dt><dd>${esc(r.place)}</dd>
      ${S.parents.length ? `<dt>พ่อแม่</dt><dd>${S.parents.map(([n, a]) => `${esc(n)} (${a} ปี)`).join(' · ')}</dd>` : ''}
      <dt>ทองติดตัว</dt><dd>${S.gold}</dd>
      <dt>ของขวัญจากเทพธิดา</dt><dd>${esc(S.cheat[0])} · ${esc(S.cheat[1])}</dd>
      <dt>อายุขัยราว</dt><dd>${r.life} ปี · ช่วงละ ${r.block} ปี</dd>
    </dl>
    <p class="note">${esc(r.desc)}</p>
    <div class="row" style="margin-top:14px"><button class="primary" id="go">เริ่มชีวิต</button></div>
  </section>`;
  document.getElementById('go').onclick = () => { addLog(`${S.name} ลืมตาที่${S.role.place}${S.role.start ? ` ตอนอายุ ${S.age} ปี` : ''}`, 'big'); render(); };
}

// ─── วงเล่น ───
function addLog(text, cls = '') { S.log.unshift({ age: S.age, text, cls }); }

function applyFx(fx = {}) {
  for (const [k, v] of Object.entries(fx)) {
    if (k === 'mana') S.mana = Math.max(0, S.mana + v);
    else if (k === 'gold') S.gold = Math.max(0, S.gold + v);
    else S.st[k] = clamp(S.st[k] + v);
  }
}
const fxText = (fx) => Object.entries(fx).filter(([, v]) => v).map(([k, v]) => `${k === 'mana' ? 'มานา' : k === 'gold' ? 'ทอง' : STATS[k]} ${v > 0 ? '+' : ''}${v}`).join(' · ');

function options() {
  const st = stageOf(S.blk);
  const r = S.role;
  return [...st.opts, r.special];
}

function chooseFocus(i) {
  S.focus = options()[i];
  addLog(`ช่วงนี้ทุ่มเทให้กับ "${S.focus[0]}"`);
  run();
}

function run() {
  stop();
  if (S.pending || S.dead || !S.focus) return render();
  timer = setInterval(tick, 900 / speed);
  render();
}
function stop() { if (timer) clearInterval(timer); timer = null; }

function tick() {
  const r = S.role;
  // ผลของสิ่งที่ทุ่มเทต่อปี + สกิลโกง + นิสัยสะสม
  applyFx(S.focus[2]);
  applyFx(S.cheat[2]);
  S.traits[S.focus[1]]++;
  if (S.focus[3]) S.merit[S.focus[3]] = (S.merit[S.focus[3]] ?? 0) + 1;
  S.age++;
  S.yearInBlk++;
  // ปีละครั้งมีโอกาสเกิดเรื่อง · เรื่องเดียวกันไม่ซ้ำในชาติเดียว
  const stg = STAGES.indexOf(stageOf(S.blk));
  const pool = EVENTS.filter((e) => !S.fired[e.id] && e.stage.some((x) => stageOf(x) === STAGES[stg] || x === STAGES[stg].from) && (!e.role || e.role.includes(r.id)) && !(e.notRole ?? []).includes(r.id) && (!e.need || S.family.some((f) => f[0] === e.need)));
  if (pool.length && Math.random() < 0.3 * (r.block / 5) ** 0.3) {
    const total = pool.reduce((s, e) => s + e.w, 0);
    let x = Math.random() * total;
    const ev = pool.find((e) => (x -= e.w) < 0) ?? pool[0];
    S.fired[ev.id] = true;
    if (ev.choices) { S.pending = ev; stop(); }
    else {
      applyFx(ev.fx);
      addLog(`${ev.text} (${fxText(ev.fx)})`, ev.big ? 'big' : ev.bad ? 'bad' : '');
      if (ev.kid) S.family.push(['ลูก', pick(NAMES[r.id] ?? NAMES.villager).replace('{p}', S.past)]);
      if (ev.world) world.push(ev.world.replace('{n}', S.name));
    }
  }
  // ตายเมื่อชีวิตหมด หรือเลยอายุขัยแล้วโอกาสตายเพิ่มทุกปี
  const over = S.age - r.life * 0.85;
  if (S.st.hp <= 0) return die('ร่างกายทนต่อไปไม่ไหว');
  if (over > 0 && Math.random() < 0.02 * over / (r.block / 5)) return die('สิ้นอายุขัยอย่างสงบ');
  if (S.yearInBlk >= r.block) {
    const name = stageOf(S.blk).name;
    S.blk++;
    S.yearInBlk = 0;
    S.focus = null;
    stop();
    if (stageOf(S.blk).name !== name) addLog(`เข้าสู่${stageOf(S.blk).name}`, 'big');
  }
  render();
}

function resolveEvent(i) {
  const ev = S.pending;
  const [label, fx, merit, trait, text, fam, legend] = ev.choices[i];
  applyFx(fx);
  if (merit) S.merit[merit] = (S.merit[merit] ?? 0) + 3;
  if (trait) S.traits[trait] += 2;
  if (fam) S.family.push(['คู่ชีวิต', pick(PARENT)]);
  const lg = legend ?? (ev.world && i === 0 ? ev.world : null);
  if (lg) world.push(lg.replace('{n}', S.name));
  addLog(`${ev.text} → ${label}: ${text} (${fxText(fx)})`, merit && MERIT[merit][0] === 'บาป' ? 'bad' : 'big');
  S.pending = null;
  if (S.st.hp <= 0) return die('บาดเจ็บสาหัสจนไม่ฟื้น');
  run();
}

function buy(i) {
  const [name, cur, cost, fx] = SHOP[i];
  if ((cur === 'gold' ? S.gold : S.mana) < cost) return;
  if (cur === 'gold') S.gold -= cost; else S.mana -= cost;
  applyFx(fx);
  S.items.push(name);
  addLog(`แลก${name} (${fxText(fx)})`);
  render();
}

function die(cause) {
  stop();
  S.dead = cause;
  addLog(`${S.name} สิ้นใจตอนอายุ ${S.age} ปี · ${cause}`, 'bad');
  showDeath();
}

// ─── วาด ───
function headBox() {
  const r = S.role;
  const bar = (k, cls) => `<div class="stat ${cls}"><i style="width:${S.st[k]}%"></i><span>${STATS[k]} ${S.st[k]}</span></div>`;
  return `<section class="box head">
    <div class="avatar" aria-hidden="true">${esc(r.icon)}</div>
    <div class="who">
      <div class="name"><b>${esc(S.name)}</b><small>${esc(r.name)} · ${S.age} ปี</small></div>
      <div class="bars">${bar('hp', 'hp')}${bar('hap', 'hap')}${bar('rel', 'rel')}${bar('kno', 'kno')}</div>
      <div class="meta"><span>มานา <b>${S.mana}</b></span><span>ทอง <b>${S.gold}</b></span><span>${esc(stageOf(S.blk).name)}</span></div>
    </div>
  </section>`;
}

function render() {
  if (S.dead) return;
  const r = S.role;
  const stg = stageOf(S.blk);
  const from = S.blk * r.block;
  const opts = options();
  const ev = S.pending;
  app.innerHTML = `${headBox()}
  <section class="box age">
    <div class="top"><h2>อายุ ${from}–${from + r.block - 1} ปี</h2><span class="pill">${esc(stg.name)}</span></div>
    <p style="margin-top:8px">${esc(stg.text)}</p>
    <div class="timebar"><i style="width:${(S.yearInBlk / r.block) * 100}%"></i></div>
    <p class="note">${S.focus ? (timer ? `เวลากำลังเดิน · ทุ่มเทให้กับ "${esc(S.focus[0])}"` : 'หยุดเวลาไว้') : 'เลือกสิ่งที่จะทุ่มเท แล้วเวลาจะเริ่มเดิน'}</p>
    <div class="speed">${[1, 2, 4].map((x) => `<button data-speed="${x}" class="${speed === x && timer ? 'on' : ''}">×${x}</button>`).join('')}
      <button data-pause="1">${timer ? '⏸ หยุด' : '▶ เดินต่อ'}</button><button data-skip="1">ข้าม ⏭</button></div>
    ${ev ? `<div class="event"><h3>เกิดเรื่องขึ้น · อายุ ${S.age}</h3><p>${esc(ev.text)}</p>
      ${ev.choices.map((c, i) => `<button class="opt" data-ev="${i}"><b>${esc(c[0])}</b><small>${fxText(c[1])}</small></button>`).join('')}</div>` : ''}
    <div class="focus" style="margin-top:12px">${opts.map((o, i) => `<button class="opt${S.focus === o ? ' on' : ''}" data-opt="${i}" ${ev || S.focus ? 'disabled' : ''}><b>${esc(o[0])}</b><small>ปลูกนิสัย${TRAITS[o[1]]}</small></button>`).join('')}</div>
    <button class="shop-btn" data-shop="1">${shopOpen ? 'ปิดร้าน' : 'แลกพรและสิ่งของ'}</button>
    ${shopOpen ? `<div class="shop">${SHOP.map(([n, cur, cost, fx], i) => `<button class="opt" data-buy="${i}" ${(cur === 'gold' ? S.gold : S.mana) < cost ? 'disabled' : ''}><b>${esc(n)}</b><small>${cost} ${cur === 'gold' ? 'ทอง' : 'มานา'} · ${fxText(fx)}</small></button>`).join('')}</div>` : ''}
  </section>
  <section class="box"><details><summary>ประวัติตัวละคร ครอบครัว วิชา และของวิเศษ <span>▾</span></summary>
    <dl><dt>ชาติก่อน</dt><dd>${esc(S.past)} จากโลกเดิม</dd>
      <dt>ครอบครัว</dt><dd>${[...S.parents.map(([n]) => `พ่อแม่ ${esc(n)}`), ...S.family.map(([k, n]) => `${k} ${esc(n)}`)].join(' · ') || 'ตัวคนเดียว'}</dd>
      <dt>สกิลโกง</dt><dd>${esc(S.cheat[0])}</dd>
      <dt>นิสัย</dt><dd>${Object.entries(S.traits).filter(([, v]) => v).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${TRAITS[k]} ${v}`).join(' · ') || 'ยังไม่มี'}</dd>
      <dt>ของวิเศษ</dt><dd>${S.items.map(esc).join(' · ') || 'ยังไม่มี'}</dd></dl></details></section>
  <section class="box"><h2>จดหมายเหตุชีวิต</h2><div class="log" style="margin-top:8px">${S.log.map((l) => `<div class="${l.cls}"><b>${l.age} ปี</b>${esc(l.text)}</div>`).join('')}</div></section>`;
  app.querySelectorAll('[data-opt]').forEach((b) => (b.onclick = () => chooseFocus(Number(b.dataset.opt))));
  app.querySelectorAll('[data-ev]').forEach((b) => (b.onclick = () => resolveEvent(Number(b.dataset.ev))));
  app.querySelectorAll('[data-buy]').forEach((b) => (b.onclick = () => buy(Number(b.dataset.buy))));
  app.querySelectorAll('[data-speed]').forEach((b) => (b.onclick = () => { speed = Number(b.dataset.speed); run(); }));
  app.querySelector('[data-pause]').onclick = () => (timer ? (stop(), render()) : run());
  app.querySelector('[data-skip]').onclick = () => { stop(); while (S.focus && !S.pending && !S.dead) tick(); if (!S.dead) render(); };
  app.querySelector('[data-shop]').onclick = () => { shopOpen = !shopOpen; render(); };
}

const EPITHET = { brave: 'ผู้ไม่เคยถอย', kind: 'ผู้มีเมตตาแห่งต่างโลก', sly: 'จิ้งจอกเจ้าเล่ห์', curious: 'ปราชญ์จากอีกโลก', calm: 'ผู้สงบกลางพายุ' };
function showDeath() {
  const top = Object.entries(S.traits).sort((a, b) => b[1] - a[1])[0][0];
  const tally = (side) => Object.entries(S.merit).filter(([k]) => MERIT[k][0] === side);
  const sum = (side) => tally(side).reduce((s, [, v]) => s + v, 0);
  const good = sum('บุญ'), bad = sum('บาป');
  const verdict = good > bad + 3 ? 'บุญหนักกว่า วิญญาณได้เลือกทางเกิดก่อนใคร' : bad > good + 3 ? 'บาปหนักกว่า ชาติหน้าจะเริ่มจากที่ลำบาก' : 'บุญบาปพอ ๆ กัน ไปเกิดตามกรรมกลาง ๆ';
  const list = (side) => tally(side).map(([k, v]) => `<span>${esc(MERIT[k][1])} ${v}</span>`).join('') || '<span>ไม่มี</span>';
  app.innerHTML = `${headBox()}
  <section class="box">
    <div class="eyebrow">บันทึกการตายในต่างโลก</div>
    <div class="title" style="margin:6px 0">${esc(S.name)} ${esc(EPITHET[top])}</div>
    <p>${esc(S.role.name)} · สิ้นใจตอนอายุ ${S.age} ปี · ${esc(S.dead)}</p>
    <h2 style="margin-top:16px">ปรโลกเปิดบัญชีชาติต่างโลก</h2>
    <div class="scale" style="margin-top:8px"><div><b>บุญ ${good}</b>${list('บุญ')}</div><div><b>บาป ${bad}</b>${list('บาป')}</div></div>
    <p style="margin-top:8px">${verdict}</p>
    <p class="note" style="margin-top:4px">หมวดบุญบาปชุดนี้เป็นตัวอย่างในต้นแบบ ยังไม่ใช่คำตัดสิน</p>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="stay">อยู่ต่างโลกต่อ เกิดใหม่อีกรอบ</button>
      <button class="ghost" id="back">กลับโลกเดิม</button>
    </div>
    <p class="note" style="margin-top:6px">ในต้นแบบ "กลับโลกเดิม" ล้างตำนานแล้วเริ่มใหม่ · ในเกมจริงจะไปต่อที่ชาติไทยตามกรรม</p>
  </section>
  ${world.length ? `<section class="box"><h2>ตำนานที่โลกนี้จำไว้</h2><div class="legend" style="margin-top:8px">${world.map((w) => `<div>${esc(w)}</div>`).join('')}</div></section>` : ''}
  <section class="box"><h2>จดหมายเหตุชีวิต</h2><div class="log" style="margin-top:8px">${S.log.map((l) => `<div class="${l.cls}"><b>${l.age} ปี</b>${esc(l.text)}</div>`).join('')}</div></section>`;
  document.getElementById('stay').onclick = showIntro;
  document.getElementById('back').onclick = () => { world.length = 0; gen = 0; showIntro(); };
}

showIntro();
})();
</script>
</body>
</html>
