    if (c.tFont) L.push(`${T}{font-size:${c.tFont}px}`);
    if (c.tNum === 'tab') L.push(`${T}{font-variant-numeric:tabular-nums}`);
    const B = `main :is(section,.box,.panel,.world,a.card,.card,.tcard)${X}`;
    const Bl = `${B}:not(.dark)`;
    if (c.bLine) L.push(`${Bl}{border:${c.bLine === '0' ? '0' : `${c.bLine === 'line2' ? 2 : 1}px solid var(${c.bLine === 'strong' ? '--line-strong' : '--line'})`}}`);
    if (c.bRad) L.push(`${B}{border-radius:${RAD[c.bRad]}}`);
    if (c.bPad) L.push(`${B}{padding:${c.bPad}px ${Math.round(c.bPad * 1.2)}px}`);
    if (c.bBg) L.push(`${Bl}{background:var(--${c.bBg})}`);
    if (c.shadow) L.push(`${B}{box-shadow:none}`);
    const co = `main :is(.warn,blockquote,.callout)${X}`;
    if (c.callout === 'box') L.push(`${co}{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:${RAD[c.bRad || 'r']}}`);
    if (c.callout === 'bar') L.push(`${co}{border:0;border-left:4px solid var(--accent2);background:var(--surface);color:var(--ink);border-radius:0 ${RAD[c.bRad || 'r']} ${RAD[c.bRad || 'r']} 0}`);
    if (c.callout === 'solid') L.push(`${co}{border:0;background:var(--accent);color:var(--title);border-radius:${RAD[c.bRad || 'r']}}`);
    if (c.tag === 'box') L.push(`.tag${X}{border-radius:0}`);
    if (c.tag === 'pill') L.push(`.tag${X}{border-radius:999px;padding-left:10px;padding-right:10px}`);
    if (c.tag === 'fill') L.push(`.tag${X}{border-color:transparent;border-radius:var(--r);background:color-mix(in srgb, currentColor 12%, var(--surface))}`);
    return L.join('\n');
  }

  // ---------- contrast สด: อ่านสีที่คำนวณแล้วในหน้าจริง แปลงผ่าน canvas (รองรับ color-mix) ----------
  const cv = document.createElement('canvas');
  cv.width = cv.height = 1;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const rgba = (s) => { cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = s; cx.fillRect(0, 0, 1, 1); const d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2], d[3] / 255]; };
  const over = (a, b) => [0, 1, 2].map((i) => Math.round(a[i] * a[3] + b[i] * (1 - a[3]))).concat(1);
  function bgOf(el, win) {
    const chain = [];
    for (let e = el; e && e.nodeType === 1; e = e.parentElement) chain.push(rgba(win.getComputedStyle(e).backgroundColor));
    let c = [255, 255, 255, 1];
    for (const x of chain.reverse()) if (x[3] > 0) c = over(x, c);
    return c;
  }
  const lum = (c) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const hex = (c) => '#' + c.slice(0, 3).map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  // [ป้าย, selector, ชนิด] — text ต้อง ≥4.5 · ui (ขอบของที่กดได้) ต้อง ≥3 · info แสดงอย่างเดียว
  const PAIRS = [
    ['เนื้อความ', 'main p', 'text'],
    ['คำนำ .lead', 'main .lead', 'text'],
    ['ลิงก์ในเนื้อ', 'main :is(p,li,td) a:not([class])', 'text'],
    ['หัวตาราง', 'main th:not(:is(.dark *))', 'text'],
    ['ช่องตาราง', 'main td:not(:is(.dark *))', 'text'],
    ['แถวสลับ', 'main tr:nth-child(even) td:not(:is(.dark *))', 'text'],
    ['ตัวในกล่อง', 'main :is(section,.box):not(.dark) p', 'text'],
    ['กล่องมืด', 'main section.dark p', 'text'],
    ['โน้ต .note', 'main .note', 'text'],
    ['กล่องเตือน', 'main :is(.warn,blockquote,.callout)', 'text'],
    ['ป้าย .tag', 'main .tag', 'text'],
    ['ท้ายหน้า', ':is(main footer,body>footer)', 'text'],
    ['หัวหน้า h1', 'body>header h1', 'text'],
    ['ขอบปุ่มลิงก์', 'main .road-l a', 'ui'],
    ['ขอบกล่อง', 'main :is(section,.box):not(.dark)', 'info'],
  ];
  function measure(doc) {
    const win = doc.defaultView;
    return PAIRS.map(([t, sel, kind]) => {
      const el = [...doc.querySelectorAll(sel)].find((e) => e.getClientRects().length);
      if (!el) return { t, kind, none: true };
      const s = win.getComputedStyle(el);
      const bg = kind === 'text' ? bgOf(el, win) : bgOf(el.parentElement, win);
      const fgRaw = rgba(kind === 'text' ? s.color : s.borderTopColor);
      if (kind !== 'text' && (parseFloat(s.borderTopWidth) === 0 || fgRaw[3] === 0)) return { t, kind, none: true, why: 'ไม่มีเส้น' };
      const fg = over(fgRaw, bg);
      return { t, kind, fg, bg, r: ratio(fg, bg) };
    });
  }
  // ข้อที่ต้องรักษา (SPEC §4 T12): data-fact ยังแสดง · markup ที่สคริปต์หา (whatsnew: p.lead ใต้หัว · ป้ายกำลังทำ) ยังอยู่และไม่ถูกซ่อน
  function guards(doc, f) {
    const shown = (e) => e.getClientRects().length > 0 || !!e.closest('details:not([open])');
    const facts = [...doc.querySelectorAll('[data-fact]')];
    const L = [`data-fact ${facts.length} จุด · ซ่อนอยู่ ${facts.filter((e) => !shown(e)).length}`];
    const soon = [...doc.querySelectorAll('.tag.soon')];
    if (soon.length) L.push(`ป้าย "กำลังทำ" ${soon.length} · ซ่อนอยู่ ${soon.filter((e) => !shown(e)).length}`);
    const lead = doc.querySelectorAll('p.lead');
    if (f === 'whatsnew.html') L.push(`p.lead ${lead.length} (สคริปต์ออกเวอร์ชันหา p.lead ใต้หัวเวอร์ชัน)`);
    const bad = /ซ่อนอยู่ [1-9]/.test(L.join(' '));
    return { L, bad };
  }

  // ---------- กรอบหน้าตัวอย่าง ----------
  const live = new Set();
  let report = null;
  function dress(fr) {
    let doc;
    try { doc = fr.contentDocument; } catch (e) { doc = null; }
    if (!doc || !doc.documentElement) { document.getElementById('filewarn').hidden = false; return null; }
    // หน้าแม่ผ่านกล่องรหัสแล้ว หน้าในกรอบเป็นแท็บเดียวกัน
    doc.documentElement.classList.add('nl-open');
    doc.getElementById('nl-gate')?.remove();
    let st = doc.getElementById('nl-tw');
    if (!st) { st = doc.createElement('style'); st.id = 'nl-tw'; doc.head.append(st); }
    st.textContent = css(cfg, fr.dataset.f);
    return doc;
  }
  function check() {
    const fr = [...live].find((x) => x.isConnected && x.dataset.w === '1280') || [...live].find((x) => x.isConnected);
    let doc;
    try { doc = fr && fr.contentDocument; } catch (e) { doc = null; }
    if (!doc || !doc.body) return;
    report = { cr: measure(doc), g: guards(doc, fr.dataset.f) };
    paintCheck();
  }
  function mount(fr) {
    fr.addEventListener('load', () => {
      const doc = dress(fr);
      if (!doc) return;
      const at = decodeURIComponent(new URL(fr.contentWindow.location.href).pathname).replace(/^.*?\/(?=(dev|spec)\/|[^/]+\.html$)/, '');
      if (byF[at] && at !== fr.dataset.f) { fr.dataset.f = at; dress(fr); }
      (doc.fonts ? doc.fonts.ready : Promise.resolve()).then(check);
    });
    live.add(fr);
  }
  const frame = (f, w, maxW, cap) => {
    const h = w === 390 ? 844 : 800;
    const s = Math.min(1, maxW / w);
    return `<div><p class="cap">${cap}</p><div class="frame" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px"><iframe data-f="${f}" data-w="${w}" title="${cap}" style="width:${w}px;height:${h}px;transform:scale(${s})" src="${UP + f}"></iframe></div></div>`;
  };
  const vbar = document.getElementById('vbar');
  const stage = document.getElementById('stage');
  const VIEWS = [['both', 'มือถือ + คอม'], ['390', 'มือถือ 390'], ['1280', 'คอม 1280']];
  const KIND = { read: 'หน้าอ่าน', wide: 'หน้าตาราง/การ์ด', map: 'แผนที่' };
  const pick = () => `<select id="pg" aria-label="เลือกหน้า">${['เอกสารผู้เล่น', 'การออกแบบ', 'ห้องผู้พัฒนา'].map((g) => `<optgroup label="${g}">${PAGES.filter((p) => p.g === g).map((p) => `<option value="${p.f}"${p.f === ui.page ? ' selected' : ''}>${p.f} · ${p.t}</option>`).join('')}</optgroup>`).join('')}</select>`;
  function draw() {
    const p = byF[ui.page] || { k: 'wide' };
    vbar.innerHTML = `<b>หน้า</b>${pick()}<span class="nav"><button type="button" data-step="-1" aria-label="หน้าก่อน">‹</button> <button type="button" data-step="1" aria-label="หน้าถัดไป">›</button></span><small>${PAGES.length} หน้า · หน้านี้ใช้ค่า${KIND[p.k]}</small><span class="seg">${VIEWS.map(([v, l]) => `<button type="button" data-view="${v}" class="${ui.view === v ? 'on' : ''}">${l}</button>`).join('')}</span>`;
    live.clear();
    const Wd = stage.clientWidth || 900;
    if (ui.view === 'both') {
      const m = Math.min(390, Wd * 0.3);
      stage.innerHTML = `<div class="stage">${frame(ui.page, 390, m, `${ui.page} · 390`)}${frame(ui.page, 1280, Wd - m - 16, `${ui.page} · 1280`)}</div>`;
    } else stage.innerHTML = `<div class="stage">${frame(ui.page, Number(ui.view), Wd, `${ui.page} · ${ui.view}`)}</div>`;
    stage.querySelectorAll('iframe').forEach(mount);
  }
  let ct;
  const redress = () => { live.forEach((fr) => { if (fr.isConnected) dress(fr); }); clearTimeout(ct); ct = setTimeout(check, 60); };

  // ---------- แผงปรับ ----------
  const ctl = document.getElementById('ctl');
  const fmt = (c, v) => (v == null ? `ตามหน้าเดิม (${c.was || 'ต่างกันต่อหน้า'})` : c.n ? `${v}${c.u ? ` ${c.u}` : ''}` : (c.o.find(([x]) => x === v) || [, v])[1]);
  const label = (c, v) => (v == null ? 'ตามหน้าเดิม' : fmt(c, v));
  const changed = (k) => JSON.stringify(cfg[k]) !== JSON.stringify(PRESET[base].cfg[k]);
  const mid = (c) => Math.round(((c.n[0] + c.n[1]) / 2) / c.n[2]) * c.n[2];
  function paint() {
    ctl.innerHTML = `<h1>T12 หน้าเอกสาร</h1>
      <p class="hint">ความกว้าง · ระยะ · ตาราง · กล่อง — ค่าชุดเดียวใช้ทุกหน้าเอกสาร · จอขวาเป็นหน้าจริงจาก build ล่าสุด เติม CSS ทับอย่างเดียว (markup ไม่ถูกแตะ) · "ตามหน้าเดิม" = ไม่เติมข้อนั้น · ชุด 0 = เว็บตอนนี้ · เสร็จแล้วกด <b>คัดลอกค่า</b> ท้ายแผง</p>
      <h2>ชุดตั้งต้น</h2>
      <div class="pre">${Object.entries(PRESET).map(([k, p]) => `<button type="button" data-pre="${k}" class="${k === base ? 'on' : ''}"><b>${p.name}</b><span>${p.why}</span></button>`).join('')}</div>
      ${CTRL.map(([h, rows]) => `<h2>${h}</h2>${rows.map((c) => c.n
        ? `<div class="row"><b><label for="r-${c.k}">${c.t}</label> <output id="o-${c.k}">${fmt(c, cfg[c.k])}</output>${changed(c.k) ? ' <i>ปรับแล้ว</i>' : ''}</b><div class="rng"><input type="range" id="r-${c.k}" data-n="${c.k}" min="${c.n[0]}" max="${c.n[1]}" step="${c.n[2]}" value="${cfg[c.k] ?? mid(c)}"><button type="button" data-keep="${c.k}"${cfg[c.k] == null ? ' disabled' : ''}>ตามหน้าเดิม</button></div></div>`
        : `<div class="row"><b>${c.t}${changed(c.k) ? ' <i>ปรับแล้ว</i>' : ''}</b><div class="seg"><button type="button" data-k="${c.k}" data-v="" class="${cfg[c.k] == null ? 'on' : ''}">ตามหน้าเดิม</button>${c.o.map(([v, l]) => `<button type="button" data-k="${c.k}" data-v="${v}" class="${cfg[c.k] === v ? 'on' : ''}">${l}</button>`).join('')}${c.lock ? `<button type="button" disabled title="ปิดตามกติกา">${c.lock}</button>` : ''}</div></div>`).join('')}`).join('')}
      <h2>contrast สด (กรอบ 1280)</h2>
      <div id="cr"><p class="hint">รอหน้าโหลด…</p></div>
      <h2>ข้อที่ต้องรักษา</h2>
      <div id="keep"></div>
      <h2>ตรวจ</h2>
      <div class="btns"><button type="button" id="scan">ตรวจล้นแนวนอน 390 + 1280 ทุกหน้า</button></div>
      <p id="ovf" role="status"></p>
      <h2>ส่งคำตอบ</h2>
      <textarea id="note" rows="3" placeholder="หมายเหตุถึงเลน (ถ้ามี)">${note.replace(/</g, '&lt;')}</textarea>
      <div class="btns"><button type="button" class="pri" id="copy">คัดลอกค่า</button><button type="button" id="reset">รีเซ็ตเป็นชุด ${PRESET[base].name.split(' ')[0]}</button></div>
      <p id="msg" role="status"></p>
      <textarea id="out" rows="8" readonly aria-label="ข้อความที่จะคัดลอก"></textarea>`;
    document.getElementById('out').value = answer();
    paintCheck();
  }
  function paintCheck() {
    const cr = document.getElementById('cr');
    const kp = document.getElementById('keep');
    if (!cr || !report) return;
    const min = { text: 4.5, ui: 3 };
    if (report.cr.every((x) => x.none)) {
      cr.innerHTML = '<p class="hint">หน้านี้ไม่มี &lt;main&gt; (แผนที่) สีเป็นงาน T13 · ที่นี่ปรับได้แค่ความกว้างกับขอบ · กรอบ 1280 แคบกว่าค่าแผนที่ เห็นผลบนจอกว้างกว่านั้น</p>';
      kp.innerHTML = `<ul class="keep">${report.g.L.map((l) => `<li>${l}</li>`).join('')}</ul>`;
      return;
    }
    cr.innerHTML = `<table class="cr">${report.cr.map((x) => x.none
      ? `<tr><td>${x.t}</td><td colspan="2"><small>${x.why || 'ไม่มีในหน้านี้'}</small></td></tr>`
      : `<tr><td>${x.t}</td><td><span class="sw" style="background:${hex(x.bg)};color:${hex(x.fg)}${x.kind !== 'text' ? `;border:2px solid ${hex(x.fg)}` : ''}">${x.kind === 'text' ? 'ก' : ''}</span></td><td class="${min[x.kind] && x.r < min[x.kind] ? 'bad' : 'ok'}">${x.r.toFixed(2)}${min[x.kind] ? ` / ${min[x.kind]}` : ' (ไม่ใช่ของกด)'}</td></tr>`).join('')}</table>`;
    kp.innerHTML = `<ul class="keep">${report.g.L.map((l) => `<li class="${/ซ่อนอยู่ [1-9]/.test(l) ? 'bad' : ''}">${l}</li>`).join('')}<li>เติม &lt;style&gt; อย่างเดียว ไม่แก้ markup</li></ul>`;
  }
  function answer() {
    const L = [`T12 หน้าเอกสาร: เริ่มจากชุด ${PRESET[base].name}`];
    for (const c of ROWS) {
      const was = PRESET[base].cfg[c.k];
      L.push(`- ${c.t}: ${label(c, cfg[c.k])}${cfg[c.k] !== was ? ` (ปรับ · เดิม ${label(c, was)})` : ''}`);
    }
    if (note.trim()) L.push(`- หมายเหตุ: ${note.trim()}`);
    L.push(`- JSON: ${JSON.stringify({ base, ...cfg })}`);
    return L.join('\n');
  }
  const after = () => { paint(); store(); redress(); };
  ctl.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pre) { base = b.dataset.pre; cfg = clone(PRESET[base].cfg); }
    else if (b.dataset.k) cfg[b.dataset.k] = b.dataset.v === '' ? null : b.dataset.v;
    else if (b.dataset.keep) cfg[b.dataset.keep] = null;
    else if (b.id === 'reset') { if (!confirm('รีเซ็ตทุกค่ากลับเป็นชุดตั้งต้น?')) return; cfg = clone(PRESET[base].cfg); }
    else if (b.id === 'copy') { copy(); return; }
    else if (b.id === 'scan') { scan(); return; }
    else return;
    after();
  });
  ctl.addEventListener('input', (e) => {
    const n = e.target.dataset.n;
    if (n) {
      const c = ROWS.find((r) => r.k === n);
      cfg[n] = Number(e.target.value);
      document.getElementById(`o-${n}`).textContent = fmt(c, cfg[n]);
      document.getElementById('out').value = answer();
      store();
      redress();
    } else if (e.target.id === 'note') { note = e.target.value; document.getElementById('out').value = answer(); store(); }
  });
  // ปล่อยแถบเลื่อนแล้วค่อยวาดแผงใหม่ — วาดระหว่างลากจะหลุดโฟกัสแถบ
  ctl.addEventListener('change', (e) => { if (e.target.dataset.n) paint(); });
  vbar.addEventListener('click', (e) => {
    const v = e.target.closest('[data-view]');
    const s = e.target.closest('[data-step]');
    if (v) ui.view = v.dataset.view;
    else if (s) { const i = PAGES.findIndex((p) => p.f === ui.page); ui.page = PAGES[(i + Number(s.dataset.step) + PAGES.length) % PAGES.length].f; }
    else return;
    store(); draw();
  });
  vbar.addEventListener('change', (e) => { if (e.target.id === 'pg') { ui.page = e.target.value; store(); draw(); } });
  async function copy() {
    const o = document.getElementById('out');
    o.value = answer();
    try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
    document.getElementById('msg').textContent = 'คัดลอกแล้ว — วางตอบในแชทได้เลย';
  }
  // เปิดทุกหน้าทีละหน้าในกรอบซ่อนทั้งสองความกว้างด้วยค่าตอนนี้ แล้ววัดว่าเนื้อกว้างเกินจอไหม
  async function scan() {
    const o = document.getElementById('ovf');
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-3000px;top:0;height:844px;overflow:hidden';
    document.body.append(host);
    const bad = [];
    let i = 0;
    let blocked = false;
    const total = PAGES.length * 2;
    for (const w of [390, 1280]) {
      host.style.width = `${w}px`;
      for (const p of PAGES) {
        o.className = '';
        o.textContent = `กำลังตรวจ ${++i}/${total} · ${p.f} · ${w}`;
        const fr = document.createElement('iframe');
        fr.dataset.f = p.f;
        fr.style.cssText = `width:${w}px;height:844px;border:0`;
        host.replaceChildren(fr);
        await new Promise((ok) => { fr.onload = ok; fr.src = UP + p.f; });
        if (!dress(fr)) { blocked = true; break; }
        await new Promise((ok) => setTimeout(ok, 120));
        const sw = fr.contentDocument.documentElement.scrollWidth;
        if (sw > w + 1) bad.push(`${p.f} @${w} (${sw}px)`);
      }
      if (blocked) break;
    }
    host.remove();
    if (blocked) { o.className = 'bad'; o.textContent = 'ตรวจไม่ได้ — ต้องเปิดหน้านี้ผ่านเว็บ'; return; }
    o.className = bad.length ? 'bad' : '';
    o.textContent = bad.length ? `ล้น ${bad.length} จุด: ${bad.join(' · ')}` : `ไม่ล้นทั้ง ${PAGES.length} หน้า ทั้งสองจอ`;
  }
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
  paint();
  draw();
})();
</script>
</body>
</html>
