<title>T9 ฉายาตราเหรียญ (tweak) · เกิดใหม่ทั้งที ชาตินี้ขอชิงมาเกิด</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  /* หน้า tweak T9 (ui-redo 116 · SPEC §4 แถว T9 · ข้อ 160 183 199 201): ตราเหรียญตอนได้ฉายาหายาก/ตำนาน (และสกิลขึ้นขั้น)
     จอเกมอยู่ใน iframe ที่ใช้ CSS เกมจริงจาก template.html (build เติมใน <template id="gcss">) · ชุด 0 = เกมตอนนี้ ไม่ทับอะไร
     ตราลอกจาก app.mjs FX.title + FX_TITLE + ART_INK (art.mjs) — ชุด 0 ต้องวาดเท่าเกม · ทรงอื่นเป็นของใหม่ที่หน้านี้เสนอ */
  body { margin: 0; background: #E6E0D3; color: #1F2430; font: 15px/1.55 Sarabun, system-ui, sans-serif; }
  .lay { display: grid; grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  .ctl { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #F3EEE2; border-right: 1px solid #D8D0C0; padding: 14px 14px 40px; box-sizing: border-box; }
  .ctl h1 { margin: 0 0 4px; font-size: 19px; line-height: 1.3; }
  .ctl .hint { margin: 6px 0 10px; font-size: 13px; color: #5A5F6B; }
  .ctl h2 { margin: 18px 0 6px; font-size: 15px; padding-top: 10px; border-top: 1px solid #D8D0C0; }
  .row { margin: 8px 0 10px; }
  .row > .lb { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .row input[type=range] { width: 100%; }
  .ed { color: #7A5A12; font-weight: 600; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button, .btns button { font: inherit; font-size: 13px; padding: 4px 9px; border: 1px solid #C9BFA9; background: #fff; color: #1F2430; cursor: pointer; border-radius: 4px; min-height: 32px; text-align: left; }
  .seg button.on { background: #1F2430; color: #fff; border-color: #1F2430; }
  .seg button:disabled, .row input:disabled { opacity: .5; cursor: not-allowed; }
  .seg.col { flex-direction: column; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns .pri { background: #2563eb; color: #fff; border-color: #2563eb; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  textarea { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #C9BFA9; border-radius: 4px; resize: vertical; background: #fff; }
  #out { font: 11px/1.4 ui-monospace, monospace; }
  #msg { font-size: 13px; color: #15803d; min-height: 1.4em; }
  table.cr { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.cr th, table.cr td { border: 1px solid #D8D0C0; padding: 3px 5px; text-align: left; vertical-align: top; }
  table.cr th[colspan] { background: #EAE3D3; }
  table.cr td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.cr .pair { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 20px; font-weight: 600; font-size: 12px; border: 1px solid #0002; }
  .ok { color: #15803d; font-weight: 600; } .bad { color: #B3261E; font-weight: 600; } .info { color: #5A5F6B; }
  .view { padding: 12px 16px 24px; min-width: 0; }
  .note { font-size: 13px; color: #4A4F5B; margin: 0 0 10px; max-width: 1100px; }
  .sc { margin: 0 0 22px; }
  .sc > h2 { font-size: 16px; margin: 0 0 8px; }
  /* จอ 1280 ลงแถวของตัวเองเต็มกว้าง ขนาดจริง (บทเรียนใบ 108) */
  .frames { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .frames .fr:first-child .box { max-width: 390px; }
  .fr h3 { margin: 0 0 6px; font-size: 14px; }
  .fr h3 small { font-weight: 400; color: #5A5F6B; }
  .fr .box { position: relative; overflow: hidden; box-shadow: 0 6px 30px rgb(0 0 0 / .14); background: #E4DDCF; }
  .fr iframe { border: 0; display: block; transform-origin: 0 0; }
  @media (max-width: 860px) { .lay { grid-template-columns: 1fr; } .ctl { position: static; height: auto; border-right: 0; border-bottom: 1px solid #D8D0C0; } }
</style>
</head>
<body>

<div class="lay">
  <aside class="ctl" id="ctl"></aside>
  <main class="view">
    <p class="note">ทุกจอใช้ CSS เกมจริง · การ์ดสีสว่างใต้ม่าน 0.6 (กรณีแย่สุดของใบ 95) · ซ้าย 390 ล่าง 1280 ขนาดจริง (ตัดช่วงกลางจอ) · หัวกรอบบอกชื่อถูกบีบไหม contrast ต่ำสุด และตัวเล็กสุด · เลื่อน "เฟรม" ดูจังหวะ หรือกด "เล่น" ดูทั้งชุด · ฉายาชื่อจริงจากเกม (หายากยาวสุด · ตำนาน) + ตราสกิลขึ้นขั้น</p>
    <div id="frames"></div>
  </main>
</div>

<!-- build เติม CSS ของ src/ui/template.html ระหว่าง marker ทุกรอบ (src/site/game-css.mjs) — ใช้ใส่ใน iframe เท่านั้น -->
<template id="gcss"><style>/*GAME-CSS:START*/

/* สีมาจากต้นแบบการ์ด (ใบ 06) — ทาง A ทะเบียนราษฎร์ · ทาง B ลายรดน้ำ · ไม่สลับตามโหมดมืดเพราะสีเป็นตัวบอกแนวการ์ด */
/* ui-redo ใบ 105 ลง T1 (ข้อ 209–211 · 215–217): ชุดคราม — หมึก = ปุ่มหลัก = หัวเว็บ #1B2A4A · หัว Maitree เนื้อ Sarabun · มุม 6 (การ์ด 8) · เงาทองเฉพาะการ์ดในเกม
   · --red = ชาด เหลือแค่ตรา/ขีดฆ่า (ข้อ 215) · --line-strong = ขอบที่บอกว่ากดได้ (--rule เป็นเส้นประดับ ต่ำกว่า 3:1)
   · การ์ด B + ภาพแชร์ · ต่างโลก · ระหว่างชาติ/ปรโลก คงสีเดิมจนใบ 121 (ข้อ 228 ชุด ก) · แถบค่า --fl รอ T6
   · การ์ดกว้างสุด 800 · ขอบรอบการ์ด 36 บนล่าง 32 ข้าง ค่าเดียวทุกจอ (ต้นแบบ tweak.html) */
:root {
  --page:#F4ECDC; --ink:#1B2A4A; --ink2:color-mix(in srgb, #1B2A4A 70%, #5B5648); --muted:#5B5648;
  --paper:#FBF6EA; --paper2:color-mix(in srgb, #FBF6EA 45%, #F4ECDC); --rule:#C9B98F; --rule2:color-mix(in srgb, #C9B98F 60%, #FBF6EA); --line-strong:#8C7A52;
  --red:#A62B1F; --green:#2F6B4F; --blue:#7A5C12; --head:#1B2A4A;
  --lacquer:#17110D; --lacquer2:#221912; --gold:#D9B45A; --gold2:#F0D78C; --cream:#EFE3C2; --bronze:#5A4630; --bronze2:#8A6D3B; --sand:#BFAE86;
  --fl:#015EC1; --dg:#B3261E; --track:#E2D9C6;
  --ft:Sarabun,system-ui,sans-serif; --fh:Maitree,serif;
  --r:6px; --rk:8px; --rc:999px; --sh:0 1px 0 var(--gold), 0 6px 18px color-mix(in srgb, var(--ink) 10%, transparent);
  --cw:800px; --pad-y:36px; --pad-x:32px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.6 var(--ft); }
/* viewport-fit=cover ให้ env(safe-area-inset-*) มีค่า แต่หน้าก็ลามใต้รอยบาก/แถบโฮม — ทุกขอบที่ติดจอต้องกันเอง */
.logo { background:var(--head); text-align:center; padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); border-bottom:1px solid var(--bronze); }
.logo b { font-family:Srisakdi,serif; font-weight:700; font-size:34px; line-height:1.2; color:var(--gold); }
.logo b span { display:inline-block; }
.logo small { display:block; font-size:12px; letter-spacing:0.12em; color:color-mix(in srgb, var(--cream) 85%, var(--head)); }
.logo .ver { text-decoration:none; display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid var(--bronze); border-radius:999px; font-size:12px; font-weight:600; color:var(--sand); white-space:nowrap; }
.logo a.ver:hover, .logo a.ver:focus-visible { text-decoration:underline; outline:none; }
.logo .saved { display:inline-block; margin:4px 0 0 6px; font-size:11px; color:var(--sand); white-space:nowrap; }
.logo .saved:not(:empty)::before { content:'\25CF  '; color:#7FC4B8; }
.logo .saved.off::before { color:#E07A5F; }
#app { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:var(--pad-y) max(var(--pad-x), env(safe-area-inset-right)) var(--pad-y) max(var(--pad-x), env(safe-area-inset-left)); }
/* ป้ายเกมไม่ใช่คำแนะนำการลงทุน (ใบ 11) อยู่ทุกหน้าจอ ไม่ใช่แค่การ์ดจัดสรรเงิน */
.foot { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(var(--pad-x), env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad-x), env(safe-area-inset-left)); font-size:12px; color:var(--muted); text-align:center; }
.foot a { color:var(--muted); display:inline-block; min-height:44px; line-height:44px; }
/* ปุ่มอยู่ท้ายการ์ด (margin-top:auto) — การ์ดสูงตายตัว 560 บนจอเตี้ยดันปุ่มของการ์ดเนื้อสั้นลงใต้แถบเบราว์เซอร์
   · เพดานตามความสูงจอหักหัวเว็บ+ระยะบน (--chrome) · svh = จอตอนแถบเบราว์เซอร์โผล่ ไม่ยืดหดตามการเลื่อนแบบ dvh ปุ่มจึงไม่กระโดดระหว่างเลื่อน */
:root { --chrome:136px; }
.card { display:flex; flex-direction:column; border-radius:var(--rk); box-shadow:var(--sh); min-height:560px; min-height:min(560px, calc(100vh - var(--chrome))); min-height:min(560px, calc(100svh - var(--chrome) - env(safe-area-inset-bottom))); }
/* ข้อความสำหรับโปรแกรมอ่านจอเท่านั้น */
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
/* จุดแดง "ใหม่" (B116): ชั้นสมุด · แท็บในชั้นสมุด · แผงฉายา/เหตุการณ์ — ป้ายอ่านจอบอกความหมายแทนสี */
.new-dot { display:inline-block; width:8px; height:8px; margin-left:6px; border-radius:50%; background:var(--blue); vertical-align:middle; flex:none; }
.new-tag { margin-left:6px; padding:0 5px; border:1px solid var(--blue); border-radius:3px; color:var(--blue); font-size:12px; font-weight:600; white-space:nowrap; }
/* .body/.choices ตั้ง display:flex ทับ hidden ของเบราว์เซอร์ — การ์ดที่พับไว้ (B117) ต้องหายจริง */
.card [hidden] { display:none !important; }
/* กล่องกระซิบ (B117): เส้นประ ตัวเอียง แยกจากเนื้อเรื่องของการ์ด · ปุ่มเป็นลิงก์เล็ก ไม่ปนกับตัวเลือกของเกม */
.whisper { margin-top:4px; padding:8px 12px; border:1px dashed var(--rule); border-radius:var(--r); background:#FBF7EE; display:flex; flex-direction:column; gap:4px; }
.whisper .h { font-size:12px; font-weight:600; color:var(--blue); }
.whisper p { font-family:var(--ft); font-size:14px; color:var(--ink2); }
.whisper-row { display:flex; flex-wrap:wrap; gap:0 16px; }
.whisper .more, .choices .later { all:unset; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:2px; }
.choices .later { align-self:flex-start; }
.whisper .more:focus-visible, .choices .later:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.choices.folded { margin-top:0; }
.choices.folded .note { margin:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; }
.top small { font-size:12px; letter-spacing:0.04em; text-align:right; }
/* รูปตัวละคร (B56): วงกลมมุมซ้ายหัวการ์ด · clip-path ตัดเสื้อที่ยื่นเลยวงกลม (ภาพแชร์ตัดด้วย arc แบบเดียวกัน) */
.av { flex:none; display:block; width:40px; height:40px; clip-path:circle(50%); }
/* หัวการ์ดแถวเดียวต้องสูงเท่าเดิม 55px (A13): margin ติดลบให้รูปล้นเข้า padding แทนดันหัวให้สูง · gap ข้างรูปแคบกว่า gap หัวการ์ด ให้ตัวอายุมีที่ไม่ตกบรรทัด */
.top .av { width:32px; height:32px; margin:-3px -6px -3px 0; }
.top .av + b { flex:1; min-width:0; }
.grow { display:flex; align-items:center; gap:10px; font-weight:600; }
.grow .av { width:56px; height:56px; }
/* แผ่นภาพยุค: รักดำ+ทองทุกธีม (สีอยู่ในตัวภาพ) — ธีมสว่างจึงเป็นแผ่นเข้มบนพื้นขาวเหมือนกรอบภาพ */
.era-art { display:block; width:100%; height:auto; aspect-ratio:5 / 2; }
/* ภาพฉากบนการ์ดแรกเกิด/การ์ดตาย: เล็กพอให้ปุ่มไปต่ออยู่จอแรก */
.era-art.scene-sm { width:min(100%, 150px); margin:0 auto 6px; }
.same { margin-left:8px; padding:1px 6px; border:1px solid currentColor; border-radius:var(--rc); font:400 11px/1.4 var(--ft); white-space:nowrap; opacity:0.85; vertical-align:2px; }
.bar { position:relative; height:6px; }
.bar i { position:absolute; left:0; top:0; display:block; height:6px; }
.bar b { position:absolute; top:-3px; width:2px; height:12px; margin-left:-1px; }
/* แถบสถานะสองแถว (ui-redo ใบ 03): แถวบน อวตาร · ชื่อ+ที่ · อายุ · แถวล่าง ค่า 4 ตัว
   · ชื่อค่ายาวบนจอแคบให้ตัวเลขตกบรรทัดแทนตัดชื่อ — แถบชิดล่างทุกช่องจึงยังอยู่แนวเดียวกัน */
.sb { padding:12px 20px; border-bottom:1px solid var(--rule2); border-radius:var(--rk) var(--rk) 0 0; }
.sb-r1 { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sb .av { width:36px; height:36px; }
.sb-who { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.sb-who b { font-family:var(--fh); font-weight:600; overflow-wrap:anywhere; }
.sb-who small { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
/* ป้ายพักแทนบรรทัดจังหวัด: บรรทัดเดียวเสมอ แถวไม่สูงขึ้น */
.sb-who small.rest { color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* หัวการ์ด (ui-redo ข้อ 161–162): แถวอาชีพเข้มกว่าบรรทัดจังหวัด · แถวฐานะ/เงินสดใต้ชื่อ ไม่มีเกจ · เงินสดชิดขวา */
.sb-who small.hd-job { color:var(--ink); font-weight:600; }
.i .sb-who small.hd-job { color:#E8ECFF; }
.hd-row { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; margin:-2px 0 10px; font-size:12px; min-width:0; }
.hd-word { font-weight:600; white-space:nowrap; }
.hd-cash { margin-left:auto; display:flex; align-items:baseline; gap:4px; white-space:nowrap; }
.hd-cash b { font-size:14px; font-variant-numeric:tabular-nums; }
.hd-cash.red b, .hd-cash .lw { color:var(--dg); }
.hd-cash .lw { font-size:12px; font-weight:600; }
.sb-age { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.sb-age > b { font-size:20px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.sb-age small { font-size:12px; }
.sb-age .same { margin-left:4px; }
.sb-heart svg { display:block; width:18px; height:18px; fill:var(--dg); }
.sb-m { list-style:none; margin:0; padding:0; display:flex; gap:10px; }
.sb-m li { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:3px; }
.mh { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:3px; }
.mk { font-size:11px; line-height:1.3; color:var(--muted); }
.mh .mk svg { width:1em; height:1em; margin-right:1px; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
/* จอมือถือช่องค่าเหลือ 56–64px ไอคอน+ชื่อ+เลขไม่พอบรรทัดเดียว (เลขตก ชื่อยาวหักคำ) ⇒ 2×2 แบบพาแนลซ้ายจอคอม · การ์ดกว้างเต็ม 460 ที่จอ >520 4 ช่องพอ */
@media (max-width: 520px) {
  .sb-m { flex-wrap:wrap; gap:6px 10px; }
  .sb-m li { flex:1 1 calc(50% - 10px); }
}
.mh .num { margin-left:auto; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.mh em { font-style:normal; font-size:10px; font-weight:600; color:var(--fl); white-space:nowrap; }
.mh em.dn { color:var(--dg); }
.br { display:block; height:6px; margin-top:auto; border-radius:var(--rc); background:var(--track); overflow:hidden; }
.br i { display:block; height:100%; border-radius:inherit; background:var(--fl); }
.sb-m .low .mk, .sb-m .low .num { color:var(--dg); }
.sb-m .low .br i { background:var(--dg); }
/* ใกล้ตาย: ขอบจอแดงทั้งจอ ผูกกับแถบสถานะด้วย :has จึงหายเองเมื่อการ์ดถัดไปไม่ใกล้ตาย · ไม่มีภาพเคลื่อนไหว */
body:has(.sb.dying)::after { content:''; position:fixed; inset:0; z-index:9; pointer-events:none; box-shadow:inset 0 0 0 3px var(--dg), inset 0 0 60px rgb(220 40 30 / .5); }
/* ตัวเลขในสรุปช่วงวัย: ต้นช่วง → ตอนนี้ คู่กับลูกศรทิศ */
.delta .num { font-weight:600; font-variant-numeric:tabular-nums; }
.meta { padding:0 20px 8px; font-size:12px; }
.meta span { white-space:nowrap; }
.tree { padding:0 20px 8px; font-size:12px; }
.tree summary { cursor:pointer; }
.tree .picks { font-size:12px; }

.lineage-text summary { cursor:pointer; font-size:13px; color:var(--muted); min-height:44px; display:flex; align-items:center; }
.bk-tabs { display:flex; flex-wrap:wrap; gap:6px; }
.bk-tabs button { all:unset; cursor:pointer; min-height:44px; padding:0 12px; border:1px solid var(--ink2); border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; }
.bk-tabs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
.bk-tabs button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.bk-sec, .pic-ev { display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px dashed var(--rule); }
.bk-sec > .h, .pic-ev > .h { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink); }

.bk-list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; font-size:13px; }
.bk-list li { padding:6px 10px; border-radius:6px; overflow-wrap:anywhere; }

/* สมุดชีวิต (B48) — หน้าก่อน/ข้ามกว้างเท่ากันใต้ปุ่มพลิกหน้า · ตัวเลือกที่กดเป็นตัวหนังสือเอียงแยกจากเนื้อเรื่อง */
.lifebook .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.lifebook .row .choice { justify-content:center; }
.lifebook .body .dates { margin-top:-6px; font-size:14px; }
.stamp { align-self:flex-start; font-family:var(--ft); font-weight:600; padding:4px 10px; transform:rotate(-3deg); font-size:16px; }

/* ทาง A — ทะเบียนราษฎร์: กระดาษ หมึก ตราประทับแดง */
.a { background:var(--paper); border:1px solid var(--rule); color:var(--ink); }
.a .top { background:var(--ink); color:var(--paper); }
.a .top b { font-family:var(--fh); font-size:16px; font-weight:600; }
.a .meta { color:var(--muted); padding-top:8px; }
.a .bar { background:#E2D9C6; } .a .bar i { background:var(--green); } .a .bar b { background:var(--dg); }
.a .kicker { color:var(--blue); }
.a .body h3 { font-family:var(--ft); font-weight:600; }
.a .body h3.lead { font-family:var(--ft); }
.a .body p, .a .items, .a .picks { color:var(--ink2); }
.a .sub, .a .note, .a .body .horo { color:var(--muted); }
.a .spark .nom { stroke:var(--green); } .a .spark .dot { fill:var(--green); }
.a .spark .grid { stroke:var(--rule2); } .a .spark .zero { stroke:var(--ink2); }
.a .spark .neg { fill:var(--dg); fill-opacity:0.08; }
.a .spark text { fill:var(--muted); }
.a .band0 { fill:var(--paper2); fill-opacity:0.55; } .a .band1 { fill:transparent; }
/* ชาดไม่ใช่สีข้อมูลแล้ว (ข้อ 215) · --blue เป็นทองเข้มใกล้ --bronze2 ⇒ เส้นแรกใช้น้ำเงินแถบค่าให้ 5 เส้นยังแยกกันได้ */
.a .ln0 { stroke:var(--fl); } .a .ln1 { stroke:var(--bronze2); } .a .ln2 { stroke:var(--blue); } .a .ln3 { stroke:var(--green); } .a .ln4 { stroke:var(--ink); }
.a .lifechart { border:1px solid var(--rule); border-radius:var(--r); background:#FBF7EE; }
.b .band0 { fill:var(--bronze); fill-opacity:0.25; } .b .band1 { fill:transparent; }
.b .ln0 { stroke:#E07A5F; } .b .ln1 { stroke:var(--gold); } .b .ln2 { stroke:#8FB3E0; } .b .ln3 { stroke:#7FC4B8; } .b .ln4 { stroke:var(--cream); }
.b .lifechart { border:1px solid var(--bronze); background:var(--lacquer2); }
/* กราฟฐานะตระกูล (B95): ขาลงเส้นประ + สีแดง ขาขึ้นเส้นทึบ — ตาบอดสีก็ยังแยกได้ · ขึ้นได้ทั้งการ์ดทาง A ทาง B และปรโลก */
.spark .sg { stroke-width:2.2; stroke-linecap:round; } .spark .sg.sd { stroke-dasharray:5 3; } .spark .sg.se { stroke-width:1.6; }
.legend .key .sg { stroke-width:2; }
.a .sg.su { stroke:var(--green); } .a .sg.sd { stroke:var(--dg); } .a .sg.se { stroke:var(--ink2); }
.a .spark .mk.broke rect { fill:var(--dg); stroke:var(--ink); stroke-width:1.5; } .a .spark .mk.nx circle { fill:var(--paper); stroke:var(--ink); stroke-dasharray:2 1.5; }
.a .legend .mk.broke rect { fill:var(--dg); stroke:var(--ink); stroke-width:1; }
.b .sg.su { stroke:var(--gold2); } .b .sg.sd { stroke:#E39A8A; } .b .sg.se { stroke:var(--sand); }
.b .spark text, .b .mk-cap, .b .lifechart .h { fill:var(--sand); color:var(--sand); } .b .spark .grid { stroke:var(--bronze2); }
.b .spark .mk.ev circle { fill:var(--lacquer); stroke:var(--gold2); } .b .spark .mk.nx circle { fill:var(--lacquer); stroke:var(--cream); stroke-dasharray:2 1.5; }
.b .spark .mk.broke rect, .b .legend .mk.broke rect { fill:#E39A8A; stroke:var(--cream); stroke-width:1.5; }
.a .choice { border:1px solid var(--line-strong); background:#FFFDF7; font-size:15px; }
.a .choice:hover, .a .choice:focus-visible { background:var(--ink); color:var(--paper); outline:none; }
.a .choice .fx { color:var(--green); } .a .choice:hover .fx, .a .choice:focus-visible .fx { color:#CFE3E0; }
/* คำอธิบายสกิลใต้ชื่อปุ่ม (06s: จอเลือกพก · การ์ดฝึกสกิล · เลือกลงสมุด) · ปุ่มเลือกพกที่กดไว้มีแถบซ้าย */
.a .choice .idesc, .b .choice .idesc { display:block; margin-top:2px; font-size:12px; }
.a .choice .idesc { color:var(--muted); } .a .choice:hover .idesc, .a .choice:focus-visible .idesc { color:#CFE3E0; }
.a .choice[aria-pressed="true"] { box-shadow:inset 5px 0 0 var(--green); }
.a .stamp { border:2px solid var(--red); color:var(--red); }
.a .recap { border:1px solid var(--rule); border-radius:var(--r); background:#FBF7EE; }

/* ทาง B — ลายรดน้ำ: พื้นรักดำ ทองคำเปลว */
.b { background:var(--lacquer); color:var(--cream); border:1px solid var(--bronze); }
.b .top { border-bottom:1px solid var(--bronze); }

.b .top small, .b .meta, .b .sub, .b .note { color:var(--sand); }
.b .bar { background:#3A2C1F; } .b .bar i { background:var(--gold); } .b .bar b { background:var(--cream); }
.b .kicker { color:var(--gold); letter-spacing:0.08em; }
.b .body h3 { font-family:Srisakdi,serif; font-weight:700; color:var(--gold2); font-size:28px; }
.b .body h3.lead { font-family:var(--ft); font-weight:400; font-size:19px; color:var(--cream); }
.b .body p { color:#E3D6B3; }
.b .choice { border:1px solid var(--bronze2); background:var(--lacquer2); color:var(--cream); }
.b .choice:hover, .b .choice:focus-visible { border-color:var(--gold); background:#2E2218; outline:none; }
.b .choice .fx { color:var(--gold); }
.b .choice .idesc { color:var(--cream); opacity:0.8; }
.b .picks, .b .tree summary, .b .tab-bar button { color:#E3D6B3; }
.b .tab-bar button[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); color:var(--lacquer); }
.b .recap { border:1px solid var(--bronze); background:var(--lacquer2); }
.b .recap .h { color:var(--gold); }
.scale { display:flex; gap:12px; }
.scale > div { flex:1; min-width:0; border:1px solid var(--bronze); padding:10px; display:flex; flex-direction:column; gap:4px; font-size:13px; overflow-wrap:anywhere; }
.scale > div.heavy { border-color:var(--gold); }
.scale b { color:var(--gold2); font-family:Srisakdi,serif; font-size:18px; }
.scale .sum { font-size:15px; font-weight:600; color:var(--cream); }
.deeds { display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--bronze); padding-top:8px; }
.deed { margin:0; display:flex; flex-direction:column; gap:2px; font-size:13px; overflow-wrap:anywhere; color:#E3D6B3; }
.deed b { color:var(--gold2); font-size:12px; }
.deed.bad b { color:#E39A8A; }
/* มรณบัตร — หนังสืองานศพ (B83b D3 ทาง B): ขาวดำ กรอบหนา รูปกลางใบ · กราฟกับสรุปข้างในคงสีทาง A */
.a.mem { position:relative; isolation:isolate; background:#FFFFFF; border:12px solid #1F1F1F; outline:1px solid #8A8A8A; outline-offset:-6px; color:#1F1F1F; }
/* ภาพฉากเป็นพื้นหลังจาง (ui-redo 57 · ค่าแรกเกิดใบ 61: ชิดบนกลาง กว้างเต็ม จาง 0.1) — z-index ติดลบใต้เนื้อ แต่ isolation ของการ์ดกันไม่ให้ลงไปใต้พื้นขาว
   ทุกเส้นเป็นหมึกดำ (เจ้าของตั้งสีทองเป็น #000000) */
.d-bg { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; color:#000000; }
.d-bg svg { position:absolute; left:50%; top:0; width:100%; height:auto; transform:translateX(-50%); opacity:0.1; }
.d-bg [fill]:not([fill="none"]) { fill:currentColor; }
.d-bg [stroke] { stroke:currentColor; }
.mem .top { background:transparent; color:#1F1F1F; justify-content:center; padding-top:18px; }
.mem .top b { font-family:Srisakdi,serif; font-size:22px; font-weight:700; }
.por { align-self:center; width:96px; height:96px; border:1px solid #1F1F1F; padding:4px; }
.d-head { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
.d-head .por { width:80px; height:80px; }
.mem .body h3 { font-family:Srisakdi,serif; font-size:30px; font-weight:700; color:#1F1F1F; }
.mem .body .dates { margin-top:-6px; }
.mem .choice { border-color:#1F1F1F; }
.d-tl { margin:0; text-align:center; font-size:14px; overflow-wrap:anywhere; }
.d-tl .k { margin-right:4px; font-weight:600; color:var(--muted); }
.d-tl .more-n { color:var(--muted); }
.d-facts { max-width:440px; width:100%; margin:0 auto; display:grid; grid-template-columns:auto minmax(0, 1fr); gap:4px 12px; font-size:14px; }
.d-facts dt { color:var(--muted); font-weight:600; white-space:nowrap; }
.d-facts dd { margin:0; overflow-wrap:anywhere; }
.d-facts .neg { color:var(--dg); font-weight:600; }
/* ใบมรณะย่อ (ui-redo ใบ 10): ปุ่มไปต่อเป็นปุ่มหลักปุ่มเดียวต่อจากข้อมูล · ปุ่มแชร์เป็นปุ่มรองเส้นประท้ายการ์ด
   สีเน้นเป็นดำ (ui-redo 57 · เจ้าของตั้ง accent #000000) — กด/โฟกัสยกเป็นเทาเข้มให้ยังเห็นว่ามีการตอบสนอง */
.mem .choices { margin-top:0; }
.mem .choices > .choice { background:#000000; border-color:#000000; color:#FFFFFF; justify-content:center; font-weight:600; }
.mem .choices > .choice:hover, .mem .choices > .choice:focus-visible { background:#3A3A3A; border-color:#3A3A3A; color:#FFFFFF; outline:2px solid #000000; outline-offset:2px; }
.d-rest { padding-top:12px; }
/* แท็บรายละเอียด (ui-redo ใบ 11): ปุ่มแคปซูลตัดบรรทัดได้ จอแคบไม่ล้นแนวนอน · หัวในแผงคืนเป็นหัวเล็ก ไม่รับตัวเขียนชื่อผู้ตาย */
.d-tab-bar { display:flex; flex-wrap:wrap; gap:6px; }
.d-tab-bar button { all:unset; box-sizing:border-box; cursor:pointer; min-height:36px; padding:0 12px; border:1px solid #1F1F1F; border-radius:999px; font-size:14px; display:inline-flex; align-items:center; }
.d-tab-bar button[aria-selected="true"] { background:#1F1F1F; color:#FFFFFF; font-weight:600; }
.d-tab-bar button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.d-pane { display:flex; flex-direction:column; gap:10px; padding-top:12px; }
.d-pane[hidden] { display:none; }
.mem .d-pane h3 { margin:8px 0 0; font-family:var(--ft); font-size:14px; font-weight:600; color:var(--muted); text-align:left; }
.d-pane .fam { display:flex; flex-direction:column; gap:8px; }
/* เมนูแชร์ (ใบ 12): พับเป็นปุ่มรองเส้นประปุ่มเดียว เปิดแล้วคำสั่งเรียงต่อในที่เดิม ไม่ลอยทับการ์ด จอแคบจึงไม่ล้น */
.d-share { margin-top:4px; padding-top:12px; border-top:1px dashed #8A8A8A; }
.d-share > summary { list-style:none; cursor:pointer; min-height:44px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:6px; padding:6px 12px; border:1px dashed #1F1F1F; font-size:14px; }
.d-share > summary::-webkit-details-marker { display:none; }
.d-share > summary::after { content:'\25BE'; }
.d-share[open] > summary::after { content:'\25B4'; }
.d-share > summary:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.d-share-in { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.d-share .choice { flex:1 1 auto; min-height:44px; padding:6px 12px; justify-content:center; font-size:14px; background:transparent; border-style:dashed; }
/* ป้ายตามหาคนหาย (B139): กระดาษประกาศติดเสา หัวแดงตัวหนา — ต่างจากหนังสืองานศพขาวดำ ให้รู้ว่ายังไม่มีใครถือว่าจากไป */
.a.mem.lost { background:#FFF8E1; border:3px dashed #B3261E; outline:none; }
.lost .top { padding-top:20px; }
.lost .top b { font-family:var(--ft); font-size:24px; font-weight:800; color:#B3261E; letter-spacing:0.02em; }
.lost .por { border:2px solid #1F1F1F; }
.lost .call { margin:0; padding:8px 10px; border:2px solid #B3261E; color:#B3261E; font-weight:700; text-align:center; }
.lost .choice, .lost .d-share > summary { border-color:#B3261E; }

/* ทาง C ต่างโลก (B68) — หน้าต่างสถานะแบบเกม: พื้นฟ้ากลางคืน กรอบฟ้าเรือง · ต่างจากสองแนวไทยให้รู้ว่าออกจากวงเวียนเดิมแล้ว */
.i { background:#161A3A; color:#E8ECFF; border:1px solid #3B4BA8; }
.i .top { border-bottom:1px solid #3B4BA8; }
.i .top b { font-family:var(--ft); font-size:18px; font-weight:600; color:#6FE3FF; }
.i .top small, .i .note, .i .tree summary { color:#A6AEDB; }
.i .kicker { color:#B48CFF; letter-spacing:0.06em; }
.i .body h3 { font-family:var(--ft); font-weight:600; color:#E8ECFF; }
.i .body p, .i .picks { color:#D3D8F5; }
.i .choice { border:1px solid #3B4BA8; border-radius:6px; background:#0E1024; color:#E8ECFF; }
.i .choice:hover, .i .choice:focus-visible { border-color:#6FE3FF; background:#1E2350; outline:none; }
.i .choice .fx { color:#6FE3FF; }
.i .idesc { display:block; text-indent:0; margin-top:2px; font-size:12px; color:#A6AEDB; }
.i .iok { color:#5EE6A0; font-weight:600; } .i .ibad { color:#FF8A8A; font-weight:600; }
.i .isys { font-size:13px; color:#F2C94C; border:1px dashed #F2C94C; border-radius:6px; padding:6px 10px; }
/* แถบสถานะต่างโลก (ui-redo ใบ 13): โครง .sb ของโลกนี้ พื้นแถบเข้มกว่าการ์ดแบบต้นแบบ · อักษรแรกของชื่อแทนรูปตัวละคร */
.i .sb { background:#12152E; }
.sb .ini { display:grid; place-items:center; background:#232A5E; color:#6FE3FF; font-weight:700; }
.ichips { display:flex; flex-wrap:wrap; gap:6px; }
.ichip { padding:1px 8px; border:1px solid #F2C94C; border-radius:999px; color:#F2C94C; }
/* คำสัญญากับเทพธิดาบนการ์ดจบต่างโลก (B68e) — กรอบทองแบบข้อความระบบ · รักษาได้เขียว ผิดแดง (มีคำกำกับ ไม่พึ่งสีอย่างเดียว) */
.ivow { display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1px solid #F2C94C; border-radius:6px; background:#0E1024; }
.ivow .h { font-size:12px; font-weight:600; letter-spacing:0.06em; color:#F2C94C; }
.ivow blockquote { margin:0; font-family:var(--ft); color:#E8ECFF; }
.ivow b { font-size:14px; } .ivow.kept b { color:#5EE6A0; } .ivow.broke b { color:#FF8A8A; }
/* การ์ดชวนไปต่างโลก (B68d) — กรอบสีต่างโลกโผล่กลางการ์ดชีวิต · ทั้งใบยังเป็นของโลกนี้เพราะยังไม่ได้รับ */
.ix { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid #3B4BA8; border-radius:8px; background:radial-gradient(120% 100% at 50% 0%, #2A3480 0%, #161A3A 65%); box-shadow:inset 0 0 22px rgba(111,227,255,0.22); text-align:left; }
.ix-k { font-size:12px; font-weight:600; letter-spacing:0.08em; color:#6FE3FF; }
.ix-t { font-size:19px; line-height:1.5; color:#E8ECFF; }
.ix-ask { margin:0 0 4px; font-size:14px; font-weight:600; }
/* เอฟเฟกต์ B-fx (ตัวเล่นใน app.mjs) — การ์ดใหม่: เส้นทองวาดทับขอบการ์ด ไม่รับคลิก · overflow:visible ให้เส้นครึ่งนอกขอบไม่ถูกตัด */
.fx-trace-on { position:relative; }
.fx-trace { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
.fx-ov { position:fixed; inset:0; z-index:50; pointer-events:none; }
.fx-ov.fx-out { opacity:0; transition:opacity .25s; }
.fx-veil { position:absolute; inset:0; background:var(--lacquer); opacity:0; }

    const p = S.cur, ed = new Set(edits()), lock = !!p.pure;
    const knob = ([k, label, opts]) => `<div class="row"><span class="lb">${esc(label)}${ed.has(k) ? ' <span class="ed">แก้</span>' : ''}</span><div class="seg${k === 'shape' ? ' col' : ''}">${opts.map(([v, t]) => `<button type="button" data-k="${k}" data-v="${esc(v)}" class="${p[k] === v ? 'on' : ''}"${lock ? ' disabled' : ''}>${esc(t)}</button>`).join('')}</div></div>`;
    const seg = ([k, label, vals]) => { const vs = vals || WEIGHTS[p.font]; return `<div class="row"><span class="lb">${esc(label)}${ed.has(k) ? ' <span class="ed">แก้</span>' : ''}</span><div class="seg">${vs.map((v) => `<button type="button" data-n="${k}" data-v="${v}" class="${p[k] === v ? 'on' : ''}"${lock ? ' disabled' : ''}>${v}</button>`).join('')}</div></div>`; };
    const range = ([k, label, lo, hi, step, f]) => `<div class="row"><span class="lb">${esc(label)} <output id="o-${k}">${f(p[k])}</output>${ed.has(k) ? ' <span class="ed">แก้</span>' : ''}</span><input type="range" data-r="${k}" min="${lo}" max="${hi}" step="${step}" value="${p[k]}"${lock ? ' disabled' : ''}></div>`;
    const color = ([k, label, game]) => `<div class="row"><span class="lb">${esc(label)}${ed.has(k) ? ' <span class="ed">แก้</span>' : ''}</span><input type="color" data-c="${k}" value="${p[k]}"${lock ? ' disabled' : ''}> <small class="info">${esc(p[k])} · เกม = ${esc(game)}</small></div>`;
    $('ctl').innerHTML = `<h1>T9 ฉายาตราเหรียญ</h1>
      <p class="hint">ui-redo 116 · SPEC §4 แถว T9 · เลือกชุด ปรับได้ แล้วกด <b>คัดลอกค่า</b> วางตอบในแชท · ค่าที่ปรับจำไว้ในเครื่อง</p>
      <div class="row"><span class="lb">ชุดตั้งต้น</span><div class="seg col">${PRESETS.map((x, i) => `<button type="button" data-p="${i}" class="${i === S.base ? 'on' : ''}">${esc(x.name)}</button>`).join('')}</div></div>
      <div class="btns"><button type="button" id="reset">คืนค่าชุดนี้${ed.size ? ` (แก้ ${ed.size})` : ''}</button></div>
      <h2>ดูจังหวะ</h2>
      <div class="row"><span class="lb">เฟรม <output id="o-t">${T.toFixed(2)}</output></span><input type="range" id="t" min="0" max="1" step="0.01" value="${T}"></div>
      <div class="btns"><button type="button" class="pri" id="play">เล่น</button></div>
      <h2>ปรับ</h2>${lock ? '<p class="hint">ชุด 0 = เกมตอนนี้ ปรับไม่ได้ · เลือก ก–ง แล้วปรับต่อ</p>' : ''}
      ${KNOBS.map(knob).join('')}
      ${SEGS.map(seg).join('')}
      ${COLORS.map(color).join('')}
      ${RANGES.map(range).join('')}
      <p class="hint">คงไว้ทุกชุด: พื้นรองทึบใต้ชื่อ (ใบ 95 · ปิดไม่ได้) · ม่าน 0.6 · พื้นรองขึ้นครบก่อนชื่อโผล่ · หายาก = เงิน เส้นเดียว · ตำนาน = ทอง เส้นคู่ (แยกด้วยตาข้อ 39) · ชื่อยาวเกิน 200 บีบให้พอดี · ชาติหนึ่งได้ฉายาไม่เกิน 3 (ตราขึ้นทีละใบ ตอนตายขึ้นเฉพาะฉายาเด่น) · reduced-motion ไม่เล่นตรา</p>
      <p class="hint">ป้ายใต้ขึ้นแดงเมื่อ &lt;12px (ขั้นต่ำ T1) — เกมตอนนี้ 11px เป็นของเดิม</p>
      <h2>contrast ทุกคู่ (สด)</h2><div id="cr"></div>
      <h2>คัดลอก</h2><div class="row"><span class="lb">หมายเหตุถึงผู้พัฒนา</span><textarea id="note" rows="3">${esc(note)}</textarea></div>
      <div class="btns"><button type="button" class="pri" id="copy">คัดลอกค่า</button></div><p id="msg"></p>
      <textarea id="out" rows="10" readonly aria-label="ข้อความที่จะคัดลอก"></textarea>`;
    document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { S.base = +b.dataset.p; S.cur = clone(PRESETS[S.base]); panel(); draw(); });
    $('reset').onclick = () => { S.cur = clone(PRESETS[S.base]); panel(); draw(); };
    document.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
      S.cur[b.dataset.k] = b.dataset.v;
      // ฟอนต์ใหม่ไม่มีน้ำหนักเดิม ⇒ ใช้ตัวหนาสุดที่มี
      if (b.dataset.k === 'font' && !WEIGHTS[S.cur.font].includes(S.cur.weight)) S.cur.weight = WEIGHTS[S.cur.font].at(-1);
      panel(); draw();
    });
    document.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { S.cur[b.dataset.n] = Number(b.dataset.v); panel(); draw(); });
    let t = 0;
    const later = () => { clearTimeout(t); t = setTimeout(() => { panel(); draw(); }, 150); };
    document.querySelectorAll('[data-r]').forEach((r) => r.oninput = () => { S.cur[r.dataset.r] = Number(r.value); $(`o-${r.dataset.r}`).textContent = RANGES.find(([k]) => k === r.dataset.r)[5](Number(r.value)); later(); });
    document.querySelectorAll('[data-c]').forEach((c) => c.oninput = () => { S.cur[c.dataset.c] = c.value.toUpperCase(); later(); });
    $('t').oninput = (e) => { cancelAnimationFrame(raf); T = Number(e.target.value); $('o-t').textContent = T.toFixed(2); live.forEach((l) => l.p && frame(l.p, T)); };
    $('play').onclick = play;
    $('note').oninput = (e) => { note = e.target.value; after(); };
    $('copy').onclick = async () => {
      const o = $('out');
      try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
      $('msg').textContent = 'คัดลอกแล้ว — วางตอบในแชทได้เลย';
    };
    after();
  }

  addEventListener('resize', () => live.forEach(fit));
  panel();
  draw();
})();
</script>
</body>
</html>
