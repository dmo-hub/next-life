  #msg { font-size: 12px; color: #2F6B4F; min-height: 1em; }
</style>

<script>
(() => {

  const KEY = 'next-life-t3-home-head-tweak-v1';
  const HOME_CSS = $('homecss').content.querySelector('style').textContent;
  const HOME_BODY = $('homebody').innerHTML;
  const FONTS = new URL('../../fonts/fonts.css', location.href).href;

  // ชุด T1 ที่เจ้าของเคาะ (ข้อ 209–211) + แถบบน T2 ที่เคาะ (ข้อ 218 ชุด 3 คราม ก้อนเดียวเตี้ย)
  const T1 = { head: '#1B2A4A', headink: '#E8CF8A', gold: '#D9B45A', bg: '#F4ECDC', surface: '#FBF6EA', ink: '#1B2A4A', muted: '#5B5648', lineStrong: '#8C7A52' };
  const NAV_T2 = { navBg: '#1B2A4A', navFg: '#E7E2D4', navCur: '#E8CF8A', brand: '#E8CF8A', playBg: '#D9B45A', playFg: '#1B2A4A', navH: 40 };

  // preset 0 = หน้าแรกบนเว็บตอนนี้ (ค่าตาม CSS ของ docs/index.html ที่ฉีดมา) · สีเป็น hex · ป้ายเวอร์ชันพื้น transparent ได้
  const P0 = { name: '0 ปัจจุบันบนเว็บ', layout: 'full', logo: 'center', start: 'afterLead', navT2: false,
    hdBg: '#1F2430', title: '#D9B45A', titleFont: 'Srisakdi', titleMax: 64, sub: '#BFAE86', lead: '#E3DDD0', tagBg: '#A23B2C', tagFg: '#F4EFE3',
    btnBg: '#A23B2C', btnFg: '#F4EFE3', link: '#F0D78C', cue: '#BFAE86', padT: 32, padB: 32,
    kranok: 'none', knColor: '#D9B45A', knAlpha: 12, knSize: 48 };
  const KRAM = { navT2: true, hdBg: T1.head, title: T1.headink, sub: '#BFB49A', lead: '#E7E2D4', tagBg: 'transparent', tagFg: T1.headink, btnBg: T1.gold, btnFg: T1.head, link: T1.headink, cue: '#BFB49A', knColor: T1.gold };
  const PRESETS = [

    { ...P0, ...KRAM, name: '1 คราม เต็มจอ · โลโก้กลาง · ลายกนกจางทั้งพื้น', kranok: 'tile', knAlpha: 10, knSize: 56 },
    { ...P0, ...KRAM, name: '2 คราม ครึ่งจอ · โลโก้ซ้าย · ลายกนกแถบล่าง · ปุ่มใต้ชื่อ', layout: 'half', logo: 'left', start: 'afterTitle', titleFont: 'Maitree', titleMax: 52, kranok: 'band', knAlpha: 45, knSize: 28, padT: 28, padB: 28 },
    { ...P0, ...KRAM, name: '3 แถบเตี้ย พื้นครีม ตัวคราม · โลโก้กลาง · ไม่มีลาย', layout: 'band', titleFont: 'Maitree', titleMax: 44, hdBg: T1.surface, title: T1.ink, sub: T1.muted, lead: '#2B3550', tagBg: 'transparent', tagFg: T1.ink,
      btnBg: T1.head, btnFg: T1.bg, link: T1.ink, cue: T1.muted, knColor: T1.lineStrong, padT: 24, padB: 24 },
  ];
  const COLORS = [
    ['พื้น + ชื่อเกม', [['hdBg', 'พื้นหัว'], ['title', 'ชื่อเกม (h1)'], ['sub', 'บรรทัด NEXT LIFE']]],
    ['ตัวหนังสือ', [['lead', 'คำโปรย + เรตผู้เล่น'], ['link', 'ลิงก์ 1323'], ['cue', 'บรรทัดชวนเลื่อนลง'], ['tagBg', 'ป้ายเวอร์ชัน พื้น'], ['tagFg', 'ป้ายเวอร์ชัน ตัว']]],
    ['ปุ่มเริ่มเล่น', [['btnBg', 'พื้นปุ่ม'], ['btnFg', 'ตัวปุ่ม']]],
    ['ลายกนก', [['knColor', 'สีลาย']]],
  ];
  const LAYOUTS = [['full', 'เต็มจอ'], ['half', 'ครึ่งจอ'], ['band', 'แถบ']];
  const LOGOS = [['center', 'โลโก้กลาง'], ['left', 'โลโก้ซ้าย']];
  const STARTS = [['afterTitle', 'ใต้ชื่อเกม'], ['afterLead', 'ใต้คำโปรย'], ['afterRate', 'ใต้เรตผู้เล่น']];
  const KRANOKS = [['none', 'ไม่มี'], ['tile', 'จางทั้งพื้น'], ['band', 'แถบล่าง'], ['corner', 'มุมบนขวา']];
  const TITLE_FONTS = ['Srisakdi', 'Maitree', 'Pridi'];
  const SCREENS = [667, 740, 844];

  // note/screenH ต้องประกาศก่อน load() — load เขียนค่าที่จำไว้
  let note = '';
  let screenH = 740;
  let S = load() ?? { ...PRESETS[0], base: 0 };
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') { note = s.note ?? ''; if (SCREENS.includes(s.screenH)) screenH = s.screenH; const { note: _n, screenH: _h, ...v } = s; return { ...P0, ...v }; } } catch (e) { /* ไม่มีที่เก็บ = เริ่มจาก preset */ }
    return null;
  }
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...S, note, screenH })); } catch (e) { /* file:// บางเบราว์เซอร์ปิดที่เก็บ — หน้ายังใช้ได้ แค่ไม่จำค่า */ } };

  // contrast ตาม WCAG 2 · พื้น transparent = พื้นหัว
  const solid = (h) => (h === 'transparent' ? S.hdBg : h);
  const rgb = (h) => { const x = solid(h).replace('#', ''); return [0, 2, 4].map((i) => parseInt(x.slice(i, i + 2), 16) / 255); };
  const lum = (h) => { const [r, g, b] = rgb(h).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
  const hsl = (h) => { const [r, g, b] = rgb(h); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; const l = (mx + mn) / 2; const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    let hu = 0; if (d) hu = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(hu * 60 + 360) % 360, s, l]; };
  // ตัวหนังสือ ≥ 4.5 · ขอบของที่กดได้ (ปุ่มเริ่มกับพื้นหัว) ≥ 3 · ชี้ปุ่มแล้วพื้นปุ่มหาย ตัวกลายเป็นสีพื้นปุ่มบนพื้นหัว ⇒ ≥ 4.5
  const PAIRS = () => [
    ['ชื่อเกม / พื้นหัว', S.title, S.hdBg, 4.5], ['NEXT LIFE / พื้นหัว', S.sub, S.hdBg, 4.5], ['คำโปรย / พื้นหัว', S.lead, S.hdBg, 4.5],
    ['ลิงก์ 1323 / พื้นหัว', S.link, S.hdBg, 4.5], ['ชวนเลื่อนลง / พื้นหัว', S.cue, S.hdBg, 4.5], ['ป้ายเวอร์ชัน ตัว / พื้นป้าย', S.tagFg, S.tagBg, 4.5],
    ['ตัวปุ่มเริ่ม / พื้นปุ่ม', S.btnFg, S.btnBg, 4.5], ['ปุ่มเริ่ม / พื้นหัว (ขอบกดได้)', S.btnBg, S.hdBg, 3], ['ปุ่มเริ่มตอนชี้ (ตัว = สีปุ่ม) / พื้นหัว', S.btnBg, S.hdBg, 4.5],
  ];
  // กติกาเดียวกับ T2: แดง/เขียวห้ามเป็นตัวหรือปุ่มบนพื้นคราม
  const kramish = (h) => { const [hu, s, l] = hsl(h); return l < 0.3 && hu >= 200 && hu <= 250 && s > 0.2; };
  const redGreen = (h) => { if (h === 'transparent') return false; const [hu, s, l] = hsl(h); return s > 0.35 && l > 0.15 && l < 0.85 && (hu < 20 || hu >= 340 || (hu >= 90 && hu <= 160)); };
  const fold = { y: null, h: null };
  function ruleBreaks() {
    const out = [];
    if (kramish(S.hdBg)) for (const k of ['title', 'sub', 'lead', 'link', 'cue', 'tagBg', 'tagFg', 'btnBg']) if (redGreen(S[k])) out.push(`${k} ${S[k]} เป็นแดง/เขียวบนพื้นคราม`);
    if (fold.y == null) out.push('ยังวัดปุ่มเริ่มในจอ 390 ไม่ได้');
    else if (fold.y > fold.h) out.push(`ปุ่มเริ่มหลุดจอแรก 390×${fold.h} (ล่างปุ่มอยู่ที่ ${fold.y}px)`);
    return out;
  }

  // ลายกนก = เปลวกนกวาดด้วย SVG ใน CSS (ไม่ใช้ไฟล์ภาพ) · ลายอยู่หลังตัวหนังสือ ตาราง contrast ไม่นับ ⇒ เข้มมากอ่านยากแม้ตารางผ่าน
  const kranokImg = (color, alpha) => {
    const a = (alpha / 100).toFixed(2);
    const flame = 'M20 38c-7-4-10-11-7-18 1 4 4 6 6 6-3-5-2-12 3-17 0 5 3 8 6 10 3 3 3 8 0 11 2-1 4-3 4-6 3 6 0 12-6 14';
    const curl = 'M20 38c-3-3-3-7 0-9 2-1 4 0 4 2s-2 3-3 2';
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><g fill='none' stroke='${color}' stroke-opacity='${a}' stroke-width='1.4' stroke-linecap='round'><path d='${flame}'/><path d='${curl}'/></g></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  };
  function knCss(p) {
    const img = kranokImg(p.knColor, p.knAlpha), z = p.knSize;
    if (p.kranok === 'tile') return `background-image:${img};background-size:${z}px ${z}px;background-repeat:repeat;`;
    if (p.kranok === 'band') return `background-image:${img};background-size:${z}px ${z}px;background-repeat:repeat-x;background-position:left bottom;padding-bottom:${p.padB + z}px;`;
    if (p.kranok === 'corner') return `background-image:${img};background-size:${z * 4}px ${z * 4}px;background-repeat:no-repeat;background-position:right -${z}px top -${z / 2}px;`;
    return 'background-image:none;';
  }
  // ตำแหน่งปุ่มเริ่มใช้ order ของ flex (หัวหน้าแรกเป็น flex column) — ลำดับ tab ยังตาม DOM ⇒ ตอนลงจริงย้าย DOM ให้ตรง
  const START_ORDER = { afterTitle: 2, afterLead: 4, afterRate: 6 };
  function headCss(p) {
    const minH = { full: '100svh', half: '60svh', band: '0' }[p.layout];
    const c = p.logo === 'center';
    const nav = p.navT2 ? `nav.top{background:${NAV_T2.navBg};border-bottom:0}nav.top a{color:${NAV_T2.navFg};line-height:${NAV_T2.navH}px}nav.top a[aria-current]{color:${NAV_T2.navCur}}nav.top .brand{color:${NAV_T2.brand}}nav.top a.play{background:${NAV_T2.playBg};color:${NAV_T2.playFg};line-height:${NAV_T2.navH - 12}px}` : '';
    return `${nav}
header{background-color:${p.hdBg};min-height:${minH};padding:${p.padT}px 16px ${p.padB}px;text-align:${c ? 'center' : 'left'};${knCss(p)}}
header .w{align-items:${c ? 'center' : 'flex-start'};width:100%}
header .w>*{order:3}header .w>.tag{order:0}header .w>h1{order:1}header .w>a.play.big{order:${START_ORDER[p.start]}}header .w>p.rate{order:5}header .w>p.cue{order:7}
header p{color:${p.lead};margin-left:${c ? 'auto' : '0'};margin-right:${c ? 'auto' : '0'}}
header h1{font-family:${p.titleFont},serif;color:${p.title};font-size:clamp(34px,9vw,${p.titleMax}px)}
header h1 .sub{color:${p.sub}}
header .tag{background:${p.tagBg};border-color:${p.tagBg === 'transparent' ? p.tagFg : p.tagBg};color:${p.tagFg}}
header a.play.big{background:${p.btnBg};border-color:${p.btnBg};color:${p.btnFg}}
header a.play.big:hover,header a.play.big:focus-visible{background:transparent;color:${p.btnBg}}
header .rate b{border-color:${p.lead}}header .rate a{color:${p.link}}
header .cue{color:${p.cue} !important}`;
  }
  const srcdoc = (p) => `<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="${FONTS}"><style>${HOME_CSS}</style><style id="ov">${headCss(p)}</style></head><body>${HOME_BODY}</body></html>`;

  const VIEWS = () => [[390, screenH, `จอ 390×${screenH}`], [1280, 800, 'จอ 1280×800']];
  const frames = [];
  function draw() {
    $('views').innerHTML = '';
    frames.length = 0;
    for (const [w, h, t] of VIEWS()) {
      const f = document.createElement('section');
      f.className = w > 600 ? 'fr wide' : 'fr';
      f.innerHTML = `<h3>${t} <small></small></h3><div class="box"><iframe title="${t} ตัวอย่างหัวหน้าแรก" width="${w}" height="${h}"></iframe></div>`;
      $('views').append(f);
      const ifr = f.querySelector('iframe');
      ifr.srcdoc = srcdoc(S);
      ifr.addEventListener('load', () => { fit(ifr, w, h); report(); ifr.contentDocument?.fonts?.ready.then(() => { fit(ifr, w, h); report(); }); });
      frames.push([ifr, w, h]);
    }
  }
  // กรอบสูงเท่าจอจริง (เลื่อนดูต่อในกรอบได้) · 1280 ย่อให้พอคอลัมน์ กรอบยังกว้างจริง media query จึงเป็นของจอใหญ่
  function fit(ifr, w, h) {
    const box = ifr.parentElement;
    const k = Math.min(1, (box.parentElement.clientWidth - 18) / w);
    ifr.style.height = `${h}px`;
    ifr.style.transform = k < 1 ? `scale(${k})` : '';
    box.style.height = `${Math.ceil(h * k)}px`;
    box.style.width = `${Math.ceil(w * k) + 2}px`;
    const d = ifr.contentDocument;
    const hd = d?.querySelector('header'), btn = d?.querySelector('header a.play.big');
    const y = btn ? Math.round(btn.getBoundingClientRect().bottom + (d.scrollingElement?.scrollTop ?? 0)) : null;
    if (w === 390) { fold.y = y; fold.h = h; }
    box.parentElement.querySelector('small').textContent = `หัว ${hd?.offsetHeight ?? '?'} px · ล่างปุ่มเริ่ม ${y ?? '?'} px ${y != null && y <= h ? 'อยู่จอแรก' : 'หลุดจอแรก'}${k < 1 ? ` · ย่อ ${Math.round(k * 100)}%` : ''}`;
  }
  // แก้ค่า: เปลี่ยนแค่ <style id="ov"> ในกรอบเดิม ไม่โหลดกรอบใหม่
  function restyle() {
    for (const [ifr, w, h] of frames) {
      const ov = ifr.contentDocument?.getElementById('ov');
      if (ov) { ov.textContent = headCss(S); fit(ifr, w, h); }
    }
    report();
    store();
  }
  function report() {
    const rows = PAIRS().map(([n, f, b, min]) => [n, solid(f), solid(b), min, ratio(f, b)]);
    $('cr').innerHTML = `<table class="cr">${rows.map(([n, f, b, min, r]) => `<tr><td><span class="sw" style="background:${b}"></span><span class="sw" style="background:${f}"></span> ${esc(n)}</td><td class="n ${r < min ? 'bad' : 'ok'}">${r.toFixed(2)}${r < min ? ` < ${min}` : ''}</td></tr>`).join('')}</table>`;
    const br = ruleBreaks();
    $('rules').innerHTML = br.length ? `<ul>${br.map((x) => `<li class="bad">${esc(x)}</li>`).join('')}</ul>` : `<p class="hint ok">ปุ่มเริ่มอยู่จอแรก 390×${fold.h} (ล่างปุ่ม ${fold.y}px) · ไม่มีแดง/เขียวบนพื้นคราม</p>`;
    output(rows, br);
  }
  function output(rows, br) {
    const keys = Object.keys(P0).filter((k) => k !== 'name');
    const edited = keys.filter((k) => S[k] !== PRESETS[S.base][k]);
    const o = { page: 't3-home-head-tweak', ticket: 104, base: S.base, baseName: PRESETS[S.base].name, edited, values: Object.fromEntries(keys.map((k) => [k, S[k]])),
      fold390: { screenH: fold.h ?? screenH, startBottom: fold.y, inFirstScreen: fold.y != null && fold.y <= fold.h },
      contrastFail: rows.filter(([, , , min, r]) => r < min).map(([n, , , , r]) => `${n} ${r.toFixed(2)}`), ruleBreaks: br, note };
    $('out').value = JSON.stringify(o);
  }
  const colorRow = ([k, t]) => `<div class="row"><span class="lb">${esc(t)}</span><input type="color" data-k="${k}" value="${solid(S[k])}" aria-label="${esc(t)}"><input type="text" data-k="${k}" value="${S[k]}" aria-label="${esc(t)} hex"></div>${k === 'tagBg' ? '<p class="hint">พิมพ์ transparent = ป้ายโปร่ง มีแต่ขอบสีตัว</p>' : ''}`;
  const range = (k, t, lo, hi) => `<div class="row"><span class="lb">${esc(t)}</span><input type="range" data-k="${k}" min="${lo}" max="${hi}" value="${S[k]}" aria-label="${esc(t)}"><b data-o="${k}">${S[k]}</b></div>`;
  const check = (k, t) => `<div class="row"><label class="lb"><input type="checkbox" data-k="${k}"${S[k] ? ' checked' : ''}> ${esc(t)}</label></div>`;
  const seg = (k, t, xs) => `<div class="seg" role="group" aria-label="${esc(t)}">${xs.map(([v, n]) => `<button type="button" data-s="${k}" data-sv="${v}" aria-pressed="${S[k] === v}">${esc(n)}</button>`).join('')}</div>`;
  function panel() {
    $('ctl').innerHTML = `<h1>T3 หัวหน้าแรก</h1>
      <p class="hint">หัวของหน้าแรกหน้าเดียว · ตัวอย่างใช้หน้าแรกตัวจริงจาก build · ชุดสี T1 คราม (ข้อ 209–211) · ชุด 1–3 ใส่แถบบนตาม T2 ที่เคาะแล้ว (ข้อ 218)</p>
      <h2>แบบตั้งต้น</h2><div class="pre">${PRESETS.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${S.base === i}">${esc(p.name)}</button>`).join('')}</div>
      <h2>กติกา T3</h2><div id="rules"></div>
      <div class="row"><span class="lb">ความสูงจอ 390 ที่วัด</span><select id="scr" aria-label="ความสูงจอ 390">${SCREENS.map((h) => `<option${h === screenH ? ' selected' : ''}>${h}</option>`).join('')}</select></div>
      <h2>เลย์เอาต์</h2>${seg('layout', 'ความสูงหัว', LAYOUTS)}${seg('logo', 'ตำแหน่งโลโก้', LOGOS)}
      <h3>ตำแหน่งปุ่มเริ่มเล่น</h3>${seg('start', 'ตำแหน่งปุ่มเริ่มเล่น', STARTS)}
      ${range('padT', 'ขอบบน px', 8, 80)}${range('padB', 'ขอบล่าง px', 8, 80)}
      <h2>ชื่อเกม</h2><div class="row"><span class="lb">ฟอนต์</span><select data-k="titleFont" aria-label="ฟอนต์ชื่อเกม">${TITLE_FONTS.map((f) => `<option${f === S.titleFont ? ' selected' : ''}>${f}</option>`).join('')}</select></div>${range('titleMax', 'ใหญ่สุด px (จอกว้าง)', 36, 80)}
      ${COLORS.map(([g, xs]) => `<h2>${esc(g)}</h2>${xs.map(colorRow).join('')}`).join('')}
      <h3>แบบลาย</h3>${seg('kranok', 'แบบลายกนก', KRANOKS)}${range('knAlpha', 'ความเข้ม %', 4, 80)}${range('knSize', 'ขนาดลาย px', 16, 96)}
      <h2>แถบบน</h2>${check('navT2', 'ใช้แถบบนตาม T2 (คราม ก้อนเดียว สูง 40)')}
      <h2>contrast ทุกคู่สี</h2><div id="cr"></div>
      <h2>คัดลอก</h2><div class="row"><span class="lb">หมายเหตุถึงผู้พัฒนา</span></div><textarea id="note" rows="2" aria-label="หมายเหตุ">${esc(note)}</textarea>
      <textarea id="out" rows="5" readonly aria-label="JSON ค่าที่เลือก"></textarea>
      <div class="row"><button type="button" id="copy">คัดลอก JSON</button><button type="button" id="reset">กลับค่าแบบตั้งต้น</button></div><div id="msg" role="status"></div>`;
    $('ctl').querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.p; S = { ...PRESETS[i], base: i }; panel(); restyle(); }));
    $('ctl').querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => {
      S[b.dataset.s] = b.dataset.sv;
      $('ctl').querySelectorAll(`[data-s="${b.dataset.s}"]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      restyle();
    }));
    $('ctl').querySelectorAll('input[data-k], select[data-k]').forEach((el) => el.addEventListener('input', () => {
      const k = el.dataset.k;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value.trim();
      if (el.type === 'text' || el.type === 'color') {
        if (k === 'tagBg' && v === 'transparent') { /* ป้ายโปร่งได้ */ } else if (!/^#[0-9a-f]{6}$/i.test(v)) return; else v = v.toUpperCase();
      }
      S[k] = v;
      $('ctl').querySelectorAll(`[data-k="${k}"]`).forEach((x) => { if (x !== el && x.type !== 'checkbox') x.value = x.type === 'color' ? solid(v) : v; });
      const lab = $('ctl').querySelector(`[data-o="${k}"]`); if (lab) lab.textContent = v;
      restyle();
    }));
    $('scr').addEventListener('input', (e) => { screenH = +e.target.value; draw(); store(); });
    $('note').addEventListener('input', (e) => { note = e.target.value; report(); store(); });
    $('reset').addEventListener('click', () => { S = { ...PRESETS[S.base], base: S.base }; panel(); restyle(); });
    $('copy').addEventListener('click', async () => {
      const o = $('out');
      try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
      $('msg').textContent = 'คัดลอกแล้ว — วางให้ผู้พัฒนาได้เลย';
    });
    report();
  }
  panel();
  draw();
  addEventListener('resize', () => frames.forEach(([ifr, w, h]) => fit(ifr, w, h)));
})();
</script>
</body>
</html>
