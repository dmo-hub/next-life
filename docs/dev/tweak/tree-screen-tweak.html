<!doctype html>
<html lang="th">
<head>
<!--GATE:START--><meta name="robots" content="noindex"><!--GATE:END-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จอต้นไม้โฟกัส 8 แบบ (tweak) · focus-tree ใบ 02</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
/* หน้า tweak focus-tree ใบ 02 · ให้เจ้าของเลือกจอต้นไม้ที่จะแทนรายการในแท็บโฟกัส (ข้อ 12 · ทับ ui-redo ข้อ 164)
   โหนดทั้งหมดเป็นตัวอย่าง 25 ตัว (5 แขนง แขนงละ 3 + โหนดกลางครบ 10 คู่) ไม่ใช่เนื้อเกมจริง · ไม่มีตัวเลขบนหลอด/โหนด (ข้อ 10 46)
   ช่อง "?" จองที่เดิม (ข้อ 61) · "เริ่มจาง" (ข้อ 63) · keystone บอกข้อเสียเป็นคำก่อนทุ่ม (ข้อ 60)
   แบบ 4-8 เพิ่มรอบสอง: 5 แขนง เงิน/ความสัมพันธ์/ความรู้/ทักษะ/ลึกลับ (ข้อ 76-81) · หักเห 5 แขนงละ 1 (ข้อ 66) · จุดเริ่มสุ่มเท่ากัน 5 แขนง (ข้อ 67) · โหนดกลางครบทุกคู่ 10 คู่ แม่จาก 2 แขนง (ข้อ 69 71)
   ทุกแบบ (1-8) ใช้โหนดตัวอย่างชุดเดียวกัน · แบบ 4-8 เป็นแค่แนวผัง ไม่ได้ลอกจากเกมใด */
:root { --ui:#1F2430; --uibg:#ECEAE4; --uiline:#C9C4B8; --surf:#FBF8F1; --muted:#4A4F5C; --w:#B73824; --p:#015EC1; --b:#2F6B66; --d:#7A5C12; --bad:#B3261E; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--uibg); color:var(--ui); font:14px/1.5 "Noto Sans Thai",system-ui,sans-serif; overflow-x:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, summary:focus-visible { outline:2px solid #015EC1; outline-offset:2px; }
header.sb { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:8px 16px; background:#fff; border-bottom:1px solid var(--uiline); }
header.sb h1 { font-size:15px; margin:0; flex:1 1 auto; }
.seg { display:flex; flex-wrap:wrap; width:100%; border:1px solid var(--uiline); border-radius:8px; overflow:hidden; }
.seg button { flex:1 1 auto; border:0; background:none; padding:0 10px; min-height:36px; border-right:1px solid var(--uiline); border-bottom:1px solid var(--uiline); font-size:13px; }
.seg button[aria-pressed="true"] { background:var(--ui); color:#fff; }
.seg button[aria-pressed="true"] { background:var(--ui); color:#fff; }
.vt { min-height:36px; padding:0 12px; border:1px solid var(--ui); border-radius:8px; background:#fff; font-size:13px; font-weight:700; }
main { max-width:390px; margin:0 auto; padding:12px 0 80px; }
.note { margin:0 16px 10px; color:var(--muted); font-size:12px; }
.phone { width:100%; background:var(--surf); border:1px solid var(--uiline); border-radius:12px; overflow:hidden; padding:10px 10px 14px; }
.tabs { display:flex; gap:4px; margin-bottom:10px; }
.tabs button { flex:1 1 0; min-width:0; min-height:40px; padding:0 2px; border:1px solid var(--uiline); border-radius:8px; background:#fff; font-size:12px; line-height:1.2; overflow-wrap:anywhere; }
.tabs button[aria-pressed="true"] { color:#fff; border-color:transparent; }
.tools { display:flex; gap:6px; align-items:center; margin-bottom:8px; font-size:12px; color:var(--muted); }
.tools button { width:36px; min-height:36px; border:1px solid var(--uiline); border-radius:8px; background:#fff; font-size:16px; }
.tools span { flex:1; }

/* การ์ดโหนด (ใช้ร่วมทุกแบบ) */
.nd { background:#fff; border:1px solid var(--uiline); border-left:5px solid var(--c); border-radius:10px; padding:8px 10px; }
.nd h3 { margin:0; font-size:14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.nd .g { height:8px; border-radius:4px; background:#E4E0D6; overflow:hidden; margin:6px 0 2px; }
.nd .g i { display:block; height:100%; background:var(--c); }
.nd .sw { font-size:12px; color:var(--muted); }
.nd.locked { opacity:.7; }
.nd.hid { border-style:dashed; border-left-style:dashed; background:#F2EFE8; }
.nd.key { border-color:var(--bad); border-left-color:var(--bad); }
.bd { font-size:11px; padding:1px 7px; border-radius:10px; background:#F3E3C0; color:#6A4A00; font-weight:400; }
.bd.k { background:#F6D5D2; color:var(--bad); }
.bd.t { background:#E4E0D6; color:var(--muted); }
.down { margin:6px 0 4px; padding:6px 8px; border-radius:6px; background:#FBE9E7; color:#7A1A12; font-size:12px; }
.throw { width:100%; min-height:40px; border:0; border-radius:8px; background:var(--ui); color:#fff; font-size:13px; }
.throw[disabled] { background:#9A9688; cursor:not-allowed; }
.tag { font-size:11px; color:var(--muted); margin:0 0 3px; }

/* แบบ 1: กิ่งแนวตั้ง */
.d1row { display:flex; gap:8px; align-items:stretch; }
.d1age { flex:none; width:44px; font-size:11px; color:var(--muted); text-align:right; padding-top:8px; }
.d1spine { flex:none; width:12px; position:relative; }
.d1spine::before { content:""; position:absolute; left:5px; top:0; bottom:0; width:2px; background:var(--c); }
.d1spine::after { content:""; position:absolute; left:0; top:14px; width:12px; height:12px; border-radius:50%; background:var(--c); border:2px solid #fff; }
.d1row.hidn .d1spine::after { background:#fff; border:2px dashed var(--c); }
.d1row:last-child .d1spine::before { bottom:auto; height:20px; }
.d1body { flex:1 1 0; min-width:0; padding-bottom:10px; }
.d1body.offr { padding-left:22px; }
.d1body.offl { padding-right:22px; }

/* ตัวเลื่อน/ซูม (ต้นเต็ม) */
.zs { overflow:auto; border:1px solid var(--uiline); border-radius:8px; background:#fff; max-height:520px; }
.zw { position:relative; }
.zi { position:absolute; left:0; top:0; transform-origin:0 0; }
.mn { position:absolute; width:104px; transform:translate(-50%,-22px); text-align:center; background:none; border:0; padding:0; }
.mn .o { width:40px; height:40px; margin:0 auto 2px; border-radius:50%; border:3px solid var(--c); background:var(--c); display:grid; place-items:center; color:#fff; font-size:15px; line-height:1; }
.mn.key .o { border-radius:6px; transform:rotate(45deg); border-color:var(--bad); background:var(--bad); }
.mn.locked .o { background:#fff; color:var(--c); opacity:.7; }
.mn.act .o { background:#fff; color:var(--c); }
.mn.hid .o { background:#fff; border-style:dashed; color:var(--c); }
.mn.sel .o { box-shadow:0 0 0 3px #015EC1; }
.mn span { display:block; font-size:11px; line-height:1.25; }
.mn .bd { display:inline-block; margin-top:1px; }
.zi svg { position:absolute; left:0; top:0; pointer-events:none; }

/* แบบ 3: ตารางชั้นวัย */
.tb { display:grid; grid-template-columns:54px repeat(6,112px); gap:4px; width:758px; padding:6px; }
.tb .cellbtn + .cellbtn { margin-top:4px; }
.tb .h { font-size:12px; font-weight:700; text-align:center; color:#fff; border-radius:6px; padding:4px 2px; }
.tb .bandh { font-size:12px; font-weight:700; background:#E4E0D6; border-radius:6px; padding:4px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:2px; }
.tb .bandh button { border:1px solid var(--uiline); background:#fff; border-radius:6px; min-height:32px; padding:0 6px; font-size:11px; }
.tb .cell { min-height:56px; }
.tb .cell .nd { padding:5px 6px; border-left-width:4px; text-align:left; width:100%; }
.tb .cell .nd h3 { font-size:12px; }
.tb .cell .nd .g { height:6px; margin:4px 0 1px; }
.tb .cell .nd .sw { font-size:11px; }
.tb .cell.empty { border:1px dashed var(--uiline); border-radius:8px; }
.tb .cellbtn { all:unset; display:block; cursor:pointer; }
.tb .cellbtn:focus-visible { outline:2px solid #015EC1; outline-offset:2px; }
.tb .cellbtn.sel .nd { box-shadow:0 0 0 3px #015EC1; }
.tb .cell.fold { display:none; }
details.band { margin-bottom:8px; }
details.band > summary { cursor:pointer; min-height:36px; display:flex; align-items:center; font-weight:700; font-size:13px; }
details.band .nd + .nd { margin-top:6px; }
.empty-slot { border:1px dashed var(--uiline); border-radius:10px; padding:10px; font-size:12px; color:var(--muted); }

/* แบบ 2: วงรัศมี */
.rad { display:block; max-width:none; touch-action:manipulation; }
.rad text { font-family:inherit; }
.rad .bn { cursor:pointer; }
.rad .nn { cursor:pointer; }
.rad .nn:focus-visible { outline:2px solid #015EC1; }

/* รอบสอง: จุดเริ่มสุ่ม · โหนดกลาง · ทิศเป็นคำ · แบบ 4-8 เป็น SVG ตัวเดียวกัน */
.start { display:flex; gap:8px; align-items:center; margin:0 0 8px; padding:6px 8px; border:1px solid var(--uiline); border-radius:8px; background:#fff; font-size:12px; }
.start span { flex:1; min-width:0; }
.start button { min-height:36px; padding:0 10px; border:1px solid var(--ui); border-radius:8px; background:#fff; font-size:12px; }
.bd.m { background:#E6DDF3; color:#4A3070; }
.bd.s { background:#DCE9F9; color:#0B3F80; }
.dir { margin:6px 0 0; font-size:12px; color:var(--muted); }
.zs { cursor:grab; }
.sv { display:block; max-width:none; touch-action:manipulation; }
.sv text { font-family:inherit; }
.sv .nn { cursor:pointer; }
.sv .nn:focus-visible { outline:2px solid #015EC1; }
.sv .bn { cursor:pointer; }
.sv .lb { paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round; }
.legend { margin:6px 0 0; font-size:11px; color:var(--muted); }

.sel-panel { margin-top:10px; }
.sel-panel > b { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:400; }
</style>
</head>
<body>
<header class="sb">
  <h1>จอต้นไม้โฟกัส · เลือก 1 ใน 8 แบบ</h1>
  <div class="seg" role="group" aria-label="แบบ" id="designs">
    <button data-design="1" aria-pressed="true">1 กิ่งแนวตั้ง</button>
    <button data-design="2" aria-pressed="false">2 วงรัศมี</button>
    <button data-design="3" aria-pressed="false">3 ตารางชั้นวัย</button>
    <button data-design="4" aria-pressed="false">4 กลุ่มดาว</button>
    <button data-design="5" aria-pressed="false">5 รังผึ้ง</button>
    <button data-design="6" aria-pressed="false">6 แผนที่ชีวิต</button>
    <button data-design="7" aria-pressed="false">7 ต้นไม้จริง</button>
    <button data-design="8" aria-pressed="false">8 ใยวงกลม</button>
  </div>
  <button class="vt" id="vt" type="button" aria-pressed="false">ดูต้นเต็ม</button>
</header>
<main>
  <p class="note" id="note"></p>
  <div class="phone" id="root"></div>
</main>
<script>
(function () {
  /* 5 แขนง (ข้อ 76 81) + โหนดกลางครบ 10 คู่ (ข้อ 71) · index 5 = โหนดกลาง */
  var B = [
    { id: 'm', n: 'เงิน', c: '#7A5C12' },
    { id: 'r', n: 'ความสัมพันธ์', c: '#015EC1' },
    { id: 'k', n: 'ความรู้', c: '#B73824' },
    { id: 's', n: 'ทักษะ', c: '#2F6B66' },
    { id: 'y', n: 'ลึกลับ', c: '#8A2D6B' },
    { id: 'x', n: 'ระหว่างแขนง', c: '#5A5266' }
  ];
  var NB = 5, MID = 5, L = ['m', 'r', 'k', 's', 'y'];
  var BR = B.slice(0, NB);
  var BN = B.map(function (b) { return b.n; });
  var BANDS = ['วัยเด็ก', 'วัยรุ่น', 'วัยทำงาน', 'วัยเก๋า'];
  /* st: done ปลดแล้ว · act ทุ่มอยู่ · fade ปลดแล้วแต่เริ่มจาง · lock ยังไม่ถึง · hid ซ่อน (จอง "?") · g = ความเต็มของหลอด */
  var N = [
    { id: 'm0', b: 0, r: 0, name: 'ขายของเล็กๆ ให้เพื่อนบ้าน', st: 'done', par: [] },
    { id: 'm1', b: 0, r: 1, name: 'เก็บออมจริงจัง', st: 'act', g: 0.35, sw: 'ทุ่มอยู่', par: ['m0'] },
    { id: 'mk', b: 0, r: 2, name: 'ทุ่มชีวิตหาเงิน', st: 'lock', key: true, par: ['m1'],
      down: 'เงินกับตำแหน่งโตเร็วมาก แต่เวลากับครอบครัวหายถาวร ล้างไม่ได้ และเลื่อนเข้าเองไม่ได้ ต้องกดเลือกเอง' },
    { id: 'r0', b: 1, r: 0, name: 'เพื่อนบ้านวัยเด็ก', st: 'done', par: [] },
    { id: 'r1', b: 1, r: 1, name: 'เพื่อนสนิท', st: 'fade', par: ['r0'] },
    { id: 'rk', b: 1, r: 2, name: 'ผูกพันจนยอมทุกอย่าง', st: 'lock', key: true, par: ['r1'],
      down: 'ความสัมพันธ์ลึกขึ้นมาก แต่ตัดสินใจเพื่อตัวเองไม่ได้อีก ล้างไม่ได้ และเลื่อนเข้าเองไม่ได้ ต้องกดเลือกเอง' },
    { id: 'k0', b: 2, r: 0, name: 'อ่านหนังสือกับครู', st: 'done', par: [] },
    { id: 'k1', b: 2, r: 1, name: 'เรียนต่อเอาจริง', st: 'act', g: 0.6, sw: 'รอโอกาส', par: ['k0', 'r0'] },
    { id: 'kk', b: 2, r: 2, name: 'จมอยู่กับตำรา', st: 'lock', key: true, par: ['k1'],
      down: 'รู้ลึกมากแต่ลงมือทำจริงไม่เป็น งานกับเงินโตช้าลงถาวร ล้างไม่ได้ และเลื่อนเข้าเองไม่ได้ ต้องกดเลือกเอง' },
    { id: 's0', b: 3, r: 0, name: 'วิ่งเล่นกลางแจ้ง', st: 'done', par: [] },
    { id: 's1', b: 3, r: 1, name: 'ออกกำลังสม่ำเสมอ', st: 'act', g: 0.85, sw: 'รอโอกาส', par: ['s0'] },
    { id: 'sk', b: 3, r: 2, name: 'ฝืนร่างเอาชนะ', st: 'lock', key: true, par: ['s1'],
      down: 'ได้แรงมากแต่ร่างกายทรุดเร็วถาวร ล้างไม่ได้ และเลื่อนเข้าเองไม่ได้ ต้องกดเลือกเอง' },
    { id: 'y0', b: 4, r: 0, name: 'ไปวัดกับยาย', st: 'done', par: [] },
    { id: 'y1', b: 4, r: 1, name: 'สงบใจ', st: 'hid', par: ['y0'] },
    { id: 'yk', b: 4, r: 2, name: 'ปล่อยวางทั้งชีวิต', st: 'lock', key: true, par: ['y1', 'rk'],
      down: 'ใจเบาจนไม่อยากสะสมอะไรอีก เงินกับตำแหน่งโตช้าลงถาวร ล้างไม่ได้' }
  ];
  /* โหนดกลาง: ครบทุกคู่ (10) · แม่มาจากสองแขนง · slot = ช่วงวัยที่โหนดอยู่ (1-3) */
  [[0, 1, 1, 'ลงทุนกับเพื่อน'], [1, 2, 1, 'ติวหนังสือกับเพื่อน'], [2, 3, 1, 'ฝึกฝีมือจากตำรา'], [3, 4, 1, 'ฝึกสมาธิลมหายใจ'], [0, 4, 1, 'ทำบุญด้วยใจสงบ'],
    [0, 2, 2, 'ลงทุนกับความรู้'], [1, 3, 2, 'เล่นกีฬากับเพื่อน'], [2, 4, 2, 'ศึกษาธรรมะ'], [0, 3, 3, 'ทำงานฝีมือขายของ'], [1, 4, 3, 'ผู้ใหญ่ที่เคารพ']].forEach(function (t) {
    var lv = t[2] === 1 ? 0 : 1;
    N.push({ id: 'x' + t[0] + t[1], b: MID, ms: [t[0], t[1]], r: t[2], name: t[3], st: t[0] === 0 && t[1] === 1 ? 'act' : 'lock', g: 0.2, sw: 'รอโอกาส', par: [L[t[0]] + lv, L[t[1]] + lv] });
  });
  var BY = {};
  N.forEach(function (n) { BY[n.id] = n; });
  function bid(i, lv) { return L[i] + (lv === 2 ? 'k' : lv); }

  var KEY = 'tweaks-tree-screen';
  var S = { design: 1, view: 'branch', br: 0, z: 100, sel: null, fold: {}, start: Math.floor(Math.random() * NB) };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) { ['design', 'view', 'br', 'z'].forEach(function (k) { if (sv[k] != null) S[k] = sv[k]; }); } } catch (e) {}
  if (!(S.design >= 1 && S.design <= 8)) S.design = 1;
  if (!(S.br >= 0 && S.br < NB)) S.br = 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ design: S.design, view: S.view, br: S.br, z: S.z })); } catch (e) {} }

  var root = document.getElementById('root');
  var NOTES = {
    1: 'แบบ 1 · กิ่งแนวตั้ง: ทีละแขนงเรียงบนลงล่างตามวัย (ทางแยก/ทางรวมเยื้องซ้ายขวา) · ต้นเต็มเป็นคอลัมน์ต่อแขนง โหนดกลางอยู่ครึ่งแถวระหว่างคอลัมน์ เลื่อนข้างและซูมได้',
    2: 'แบบ 2 · วงรัศมี: ต้นเต็มเป็นวงกลมห้าส่วน เกิดอยู่กลาง วัยมากอยู่วงนอก · โหนดกลางอยู่รอยต่อส่วน (คู่ไม่ติดกันอยู่ใกล้ศูนย์กลาง) · แตะชื่อแขนงเพื่อซูมเข้าส่วนนั้น',
    3: 'แบบ 3 · ตารางชั้นวัย: แถว = วัย คอลัมน์ = แขนง พับแถวได้ · ทีละแขนงเป็นการ์ดเต็มความกว้าง · โหนดกลางอยู่คอลัมน์ขวาสุด',
    4: 'แบบ 4 · กลุ่มดาว/ใยแมงมุม: โหนดแต่ละแขนงรวมเป็นกลุ่มอยู่คนละมุม เส้นข้ามกันได้อิสระ · โหนดกลางลอยอยู่ระหว่างกลุ่ม · ลากเลื่อนและซูมได้',
    5: 'แบบ 5 · ตารางรังผึ้ง: แต่ละแขนงเป็นโซนสี โหนดกลางอยู่บนแนวรอยต่อระหว่างโซน · ลากเลื่อนและซูมได้',
    6: 'แบบ 6 · แผนที่เส้นทางชีวิต: แกนนอนคือวัย แต่ละแขนงเป็นเลนถนน โหนดกลางเป็นทางแยกข้ามเลน · ลากเลื่อนและซูมได้',
    7: 'แบบ 7 · ต้นไม้จริง: ลำต้นคือวัยเด็ก มีกิ่งใหญ่ห้ากิ่ง จุดที่กิ่งพันกันคือโหนดกลาง · ลากเลื่อนและซูมได้',
