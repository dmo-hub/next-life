<!doctype html>
<html lang="th">
<head>

<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  /* หน้า tweak T2 หัวเว็บ + nav (ui-redo 103 · SPEC ใบ 94 §4 แถว T2 · ข้อ 135 136 199 201)
     แถบบน (nav.top) มาจาก NAV_CSS/navHtml ของ src/site/nav.mjs ที่ build ฉีดระหว่าง marker ใน <template> ข้างล่าง — หน้าไม่ลอกแถบเอง
     หัวหน้า (header) ยังเป็น CSS เขียนมือแต่ละหน้า แบบหลักข้อ 135 = about.html ⇒ preset 0 ลอกค่าจากแบบหลักนั้น
     จอตัวอย่างอยู่ใน iframe กว้างจริง 390 / 1280 ⇒ media query ของแถบทำงานจริง (เงาจางขอบขวาที่ ≤ 760) */
  * { box-sizing: border-box; }
  body { margin: 0; background: #E6E0D3; color: #1F2430; font: 15px/1.6 Sarabun, sans-serif; }
  .lay { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { .lay { grid-template-columns: 1fr; } }
  #ctl { background: #F4EFE3; border: 1px solid #C9BFA9; padding: 12px 14px; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
  @media (max-width: 900px) { #ctl { position: static; max-height: none; } }
  h1 { font: 600 20px/1.3 Pridi, serif; margin: 0 0 6px; }
  h2 { font: 600 15px/1.3 Pridi, serif; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid #D8D0C0; }
  h3 { font: 600 14px/1.3 Sarabun, sans-serif; margin: 0 0 6px; }
  h3 small { font-weight: 400; color: #5B5648; }
  .row { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .lb { flex: 1; font-size: 13px; }
  input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid #8C7A52; background: none; }
  input[type=text] { width: 84px; font: 13px monospace; padding: 3px 4px; border: 1px solid #8C7A52; }
  input[type=range] { width: 120px; }
  select, button { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid #8C7A52; background: #FBF6EA; color: #1F2430; border-radius: 4px; }
  button { cursor: pointer; }
  .pre { display: grid; gap: 4px; }
  .pre button { text-align: left; }
  .pre button[aria-pressed=true] { background: #1B2A4A; color: #F4ECDC; border-color: #1B2A4A; }
  .hint { font-size: 12px; color: #5B5648; margin: 0 0 6px; }
  table.cr { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.cr td { padding: 2px 4px; border-bottom: 1px solid #E2D9C6; }
  table.cr td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bad { color: #B3261E; font-weight: 600; }
  .ok { color: #2F6B4F; }
  .sw { display: inline-block; width: 14px; height: 14px; border: 1px solid #0003; vertical-align: -2px; }
  textarea { width: 100%; font: 12px/1.4 monospace; border: 1px solid #8C7A52; padding: 4px; }
  #views { display: grid; gap: 16px; min-width: 0; }
  .fr { background: #F4EFE3; border: 1px solid #C9BFA9; padding: 8px; min-width: 0; }
  .box { overflow: hidden; border: 1px solid #C9BFA9; background: #fff; }
  .box iframe { border: 0; display: block; transform-origin: 0 0; }
  #rules li { font-size: 13px; }
  #msg { font-size: 12px; color: #2F6B4F; min-height: 1em; }
</style>
</head>

<div class="lay">
  <aside id="ctl" aria-label="แผงปรับค่า"></aside>
  <main id="views" aria-label="จอตัวอย่าง"></main>
</div>
<template id="navcss"><style>/*NAV-CSS:START*/
  :root { --bg:#F4ECDC; --surface:#FBF6EA; --ink:#1B2A4A; --muted:#5B5648; --accent:#1B2A4A; --head:#1B2A4A; --headink:#E8CF8A; --accent2:#7A5C12; --gold:#D9B45A; --seal:#A62B1F; --good:#2F6B4F; --bad:#B3261E; --line:#C9B98F; --line-strong:#8C7A52; --on-head:#E7E2D4; --on-head2:#D8D2C2; --on-head3:#BFB49A; --title:#F4ECDC; --lacquer:#17110D; --lacquer2:color-mix(in srgb, #17110D 88%, #E8CF8A); --bronze:color-mix(in srgb, #D9B45A 35%, #17110D); --fh:Maitree,serif; --fb:Sarabun,system-ui,sans-serif; --r:6px; --rk:8px; }
  nav.top { display: flex; align-items: center; gap: 4px; background: var(--head); border-bottom: 0; padding: 0 12px; font-family: var(--fb); line-height: normal; }
  nav.top a { display: inline-block; color: var(--on-head); text-decoration: none; padding: 0 10px; line-height: 40px; font-size: 14px; font-weight: 400; font-family: inherit; margin: 0; min-height: 0; border: 0; border-radius: 0; background: none; }
  nav.top a.dark { color: var(--headink); }
  nav.top a[aria-current] { color: var(--headink); font-weight: 600; }
  nav.top a:hover, nav.top a:focus-visible { text-decoration: underline; text-underline-offset: 4px; outline: none; }
  nav.top .brand { font-weight: 600; color: var(--headink); padding-left: 0; white-space: nowrap; }
  nav.top .links { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  nav.top a.play { background: var(--gold); color: var(--head); border-radius: var(--r); line-height: 28px; padding: 0 12px; font-weight: 600; white-space: nowrap; }
  nav.top a.play:focus-visible { outline: 2px solid var(--headink); outline-offset: 2px; }
  body > header:not(.home) { background: var(--head); color: var(--title); padding: 16px 16px 18px; }
  body > header:not(.home) h1 { font-family: var(--fh); font-weight: 600; color: var(--title); }
  body > header:not(.home) p { color: var(--on-head2); }
  body > header:not(.home) a { color: var(--headink); text-decoration: underline; text-underline-offset: 3px; }
  main :is(p, li, td, dd, figcaption, blockquote) a:not([class]) { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent2); }
  @media (max-width: 760px) { nav.top .links { -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); } }
/*NAV-CSS:END*/</style></template>
<template id="navsrc"><!--NAV:START--><nav class="top" aria-label="หน้าอื่น"><a class="brand" href="../../index.html">NEXT LIFE</a><div class="links"><a href="../../guide.html">วิธีเล่น</a><a href="../../whatsnew.html">แพตช์โน้ต</a><a href="../../about.html">กลไกในเกม</a><a href="../../worlds.html">โลก</a><a href="../../catalog.html">การ์ดทั้งหมด</a><a href="../../dev/index.html">ห้องผู้พัฒนา</a></div><a class="play" href="../../play.html">เล่นเกม</a></nav><script>(()=>{const l=document.querySelector('nav.top .links'),c=l&&l.querySelector('[aria-current]');if(!c)return;const f=()=>{if(l.scrollWidth>l.clientWidth)l.scrollLeft+=c.getBoundingClientRect().left-l.getBoundingClientRect().left-(l.clientWidth-c.offsetWidth)/2};f();document.fonts&&document.fonts.ready.then(f)})()</script><!--NAV:END--></template>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KEY = 'next-life-t2-header-tweak-v1';
  const NAV_CSS = $('navcss').content.querySelector('style').textContent;
  // ตัด <script> ของแถบออก (เลื่อนลิงก์หน้าปัจจุบัน) — กรอบตัวอย่างไม่ต้องรัน และลิงก์ในกรอบไม่พาไปไหน
  const NAV_HTML = $('navsrc').innerHTML.replace(/<script[\s\S]*?<\/script>/g, '').replace(/href="[^"]*"/g, 'href="#"');
  const FONTS = new URL('../../fonts/fonts.css', location.href).href;

  // ค่าที่ปรับได้ · ทุกสีเป็น hex · ความสูงเป็น px
  // preset 0 = ของบนเว็บตอนนี้: แถบบน NAV_CSS (#17110D) + หัวหน้าแบบหลักข้อ 135 (#1F2430 · Pridi · 32/28)
  const P0 = { name: '0 ปัจจุบันบนเว็บ', navBg: '#17110D', navFg: '#E3DDD0', navCur: '#F0D78C', brand: '#F4EFE3', playBg: '#F0D78C', playFg: '#17110D', navLine: '#5A4630', navH: 44,
    hdBg: '#1F2430', hdTitle: '#F4EFE3', hdSub: '#E3DDD0', hdFont: 'Pridi', padT: 32, padB: 28, join: false, prajae: false, pjColor: '#D9B45A', pjAlpha: 35, pjSize: 12 };
  // ชุด T1 ที่เจ้าของเคาะ (ข้อ 209–211): head = คราม #1B2A4A · ตัวบนหัว #E8CF8A · gold #D9B45A · พื้น #F4ECDC · หัว Maitree
  const T1 = { head: '#1B2A4A', headink: '#E8CF8A', gold: '#D9B45A', bg: '#F4ECDC', surface: '#FBF6EA', ink: '#1B2A4A', lineStrong: '#8C7A52' };
  const PRESETS = [
    P0,
    { ...P0, name: '1 คราม เต็ม · ลายประแจทองใต้หัว', navBg: T1.head, navFg: '#E7E2D4', navCur: T1.headink, brand: T1.headink, playBg: T1.gold, playFg: T1.head, navLine: '#33456B',
      hdBg: T1.head, hdTitle: T1.bg, hdSub: '#D8D2C2', hdFont: 'Maitree', padT: 32, padB: 28, prajae: true, pjAlpha: 45 },
    { ...P0, name: '2 คราม แถบเดียว · หัวพื้นครีมตัวคราม', navBg: T1.head, navFg: '#E7E2D4', navCur: T1.headink, brand: T1.headink, playBg: T1.gold, playFg: T1.head, navLine: T1.gold,
      hdBg: T1.surface, hdTitle: T1.ink, hdSub: '#5B5648', hdFont: 'Maitree', padT: 24, padB: 20, prajae: true, pjColor: T1.lineStrong, pjAlpha: 30 },
    { ...P0, name: '3 คราม รวมก้อนเดียว เตี้ย · ไม่มีลาย', navBg: T1.head, navFg: '#E7E2D4', navCur: T1.headink, brand: T1.headink, playBg: T1.gold, playFg: T1.head, navLine: T1.head, navH: 40,
      hdBg: T1.head, hdTitle: T1.bg, hdSub: '#D8D2C2', hdFont: 'Maitree', padT: 16, padB: 18, join: true, prajae: false },
  ];
  const COLORS = [
    ['แถบบน (nav)', [['navBg', 'พื้นแถบ'], ['navFg', 'ลิงก์'], ['navCur', 'ลิงก์หน้าปัจจุบัน'], ['brand', 'ชื่อเกม'], ['playBg', 'ปุ่มเล่นเกม พื้น'], ['playFg', 'ปุ่มเล่นเกม ตัว'], ['navLine', 'เส้นใต้แถบ']]],
    ['หัวหน้า (header)', [['hdBg', 'พื้นหัว'], ['hdTitle', 'ชื่อหน้า (h1)'], ['hdSub', 'คำโปรย']]],
    ['ลายประแจ', [['pjColor', 'สีลาย']]],
  ];
  const FONTS_HEAD = ['Pridi', 'Maitree', 'Sarabun'];

  // note ต้องประกาศก่อน load() — load เขียนค่า note ที่จำไว้
  let note = '';
  let S = load() ?? { ...PRESETS[0], base: 0 };
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') { note = s.note ?? ''; return { ...P0, ...s }; } } catch (e) { /* ไม่มีที่เก็บ = เริ่มจาก preset */ }
    return null;
  }
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...S, note })); } catch (e) { /* file:// บางเบราว์เซอร์ปิดที่เก็บ — หน้ายังใช้ได้ แค่ไม่จำค่า */ } };

  // contrast ตาม WCAG 2 (ค่าสัมพัทธ์ของ sRGB)
  const rgb = (h) => { const x = h.replace('#', ''); const v = x.length === 3 ? x.split('').map((c) => c + c).join('') : x; return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16) / 255); };
  const lum = (h) => { const [r, g, b] = rgb(h).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
  const hsl = (h) => { const [r, g, b] = rgb(h); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; const l = (mx + mn) / 2; const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    let hu = 0; if (d) hu = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(hu * 60 + 360) % 360, s, l]; };
  // คู่ที่ต้องอ่านได้: ตัวหนังสือ ≥ 4.5 · ขอบของที่กดได้ (ปุ่มเล่นเกมกับพื้นแถบ) ≥ 3
  const PAIRS = () => [
    ['ลิงก์ / พื้นแถบ', S.navFg, S.navBg, 4.5], ['ลิงก์หน้าปัจจุบัน / พื้นแถบ', S.navCur, S.navBg, 4.5], ['ชื่อเกม / พื้นแถบ', S.brand, S.navBg, 4.5],
    ['ตัวปุ่มเล่นเกม / พื้นปุ่ม', S.playFg, S.playBg, 4.5], ['ปุ่มเล่นเกม / พื้นแถบ (ขอบกดได้)', S.playBg, S.navBg, 3],
    ['ชื่อหน้า / พื้นหัว', S.hdTitle, S.hdBg, 4.5], ['คำโปรย / พื้นหัว', S.hdSub, S.hdBg, 4.5],
  ];
  // กติกา SPEC §4 แถว T2: แดง/เขียวห้ามเป็นตัวหรือปุ่มบนพื้นคราม (พื้นมืดโทนน้ำเงิน) · header แบบเดียวทุกหน้า = หน้านี้ปรับชุดเดียว ไม่มีค่าแยกหน้า
  const kramish = (h) => { const [hu, s, l] = hsl(h); return l < 0.3 && hu >= 200 && hu <= 250 && s > 0.2; };
  const redGreen = (h) => { const [hu, s, l] = hsl(h); return s > 0.35 && l > 0.15 && l < 0.85 && (hu < 20 || hu >= 340 || (hu >= 90 && hu <= 160)); };
  function ruleBreaks() {
    const out = [];
    const on = [['navBg', ['navFg', 'navCur', 'brand', 'playBg']], ['hdBg', ['hdTitle', 'hdSub']]];
    for (const [bg, fgs] of on) if (kramish(S[bg])) for (const f of fgs) if (redGreen(S[f])) out.push(`${f} ${S[f]} เป็นแดง/เขียวบนพื้นคราม ${bg}`);
    if (S.prajae && kramish(S.hdBg) && redGreen(S.pjColor)) out.push(`ลายประแจ ${S.pjColor} เป็นแดง/เขียวบนพื้นคราม`);
    return out;
  }

  // ลายประแจ = แถบลายเส้นต่อกันใต้หัว (SVG ใน CSS ไม่ใช้ไฟล์ภาพ) · ไม่ใช่ตัวหนังสือ จึงไม่อยู่ในตาราง contrast
  const prajae = (color, size, alpha) => {
    const a = (alpha / 100).toFixed(2);
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size * 2}' height='${size}' viewBox='0 0 20 10'><path d='M0 9.5h4v-8h8v5h-4v-2' fill='none' stroke='${color}' stroke-opacity='${a}' stroke-width='1.2'/><path d='M10 9.5h4v-8h8' fill='none' stroke='${color}' stroke-opacity='${a}' stroke-width='1.2'/></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}") repeat-x left bottom / ${size * 2}px ${size}px`;
  };
  function headCss(p) {
    const pj = p.prajae ? `header{padding-bottom:${p.padB + p.pjSize + 6}px;background:${prajae(p.pjColor, p.pjSize, p.pjAlpha)},${p.hdBg}}` : '';
    return `nav.top{background:${p.navBg};border-bottom-color:${p.navLine}}
nav.top a{color:${p.navFg};line-height:${p.navH}px}
nav.top a[aria-current]{color:${p.navCur}}
nav.top .brand{color:${p.brand}}
nav.top a.play{background:${p.playBg};color:${p.playFg};line-height:${Math.max(24, p.navH - 12)}px}
header{background:${p.hdBg};color:${p.hdTitle};padding:${p.padT}px 16px ${p.padB}px}
header h1{font-family:${p.hdFont},serif}
header p{color:${p.hdSub}}
${p.join ? 'nav.top{border-bottom:0}' : ''}
${pj}`;
  }
  // เนื้อหาตัวอย่าง = หน้ากลไกในเกม (about.html แบบหลักข้อ 135) · ส่วนใต้หัวคงที่ทุก preset ให้เห็นแค่หัวเปลี่ยน
  const DOC = `*{box-sizing:border-box}body{margin:0;background:#E6E0D3;color:#1F2430;font-family:Sarabun,sans-serif;line-height:1.7}
header{background:#1F2430;color:#F4EFE3;padding:32px 16px 28px}.w{max-width:760px;margin:0 auto}
h1{font-family:Pridi,serif;font-size:clamp(26px,5vw,36px);margin:0 0 8px;line-height:1.3}header p{margin:0;color:#E3DDD0}
main{padding:24px 16px 32px}h2{font-family:Pridi,serif;font-size:22px;margin:0 0 8px}`;
  const BODY = `${NAV_HTML}<header><div class="w"><h1>กลไกในเกม</h1><p>อะไรในเกมมาจากข้อมูลจริง อะไรเป็นสมมติฐานของเกม และอะไรเป็นความเชื่อ</p></div></header>
<main><div class="w"><h2>ค่าที่ติดตัวมาแต่เกิด</h2><p>ทุกชีวิตเริ่มจากจังหวัดเกิด ฐานะบ้าน และปีเกิด ค่าพวกนี้กำหนดว่าการ์ดใบไหนออกได้บ้าง</p></div></main>`;
  const srcdoc = (p) => `<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="${FONTS}"><style>${DOC}${NAV_CSS}</style><style id="ov">${headCss(p)}</style></head><body>${BODY}</body></html>`;

  const VIEWS = [[390, 'จอ 390'], [1280, 'จอ 1280']];
  const frames = [];
  function draw() {
    $('views').innerHTML = '';
    frames.length = 0;
    for (const [w, t] of VIEWS) {
      const f = document.createElement('section');
      f.className = 'fr';
      f.innerHTML = `<h3>${t} <small></small></h3><div class="box"><iframe title="${t} ตัวอย่างหัวเว็บ" width="${w}" height="320"></iframe></div>`;
      $('views').append(f);
      const ifr = f.querySelector('iframe');
      ifr.srcdoc = srcdoc(S);
      ifr.addEventListener('load', () => fit(ifr, w));
      frames.push([ifr, w]);
    }
  }
  // 1280 ย่อลงให้พอคอลัมน์ (กรอบยังกว้าง 1280 จริง media query จึงเป็นของจอใหญ่) · สูงตามเนื้อในกรอบ
  function fit(ifr, w) {
    const box = ifr.parentElement;
    const k = Math.min(1, box.clientWidth / w);
    const h = ifr.contentDocument?.documentElement.scrollHeight ?? 320;
    ifr.style.height = `${h}px`;
    ifr.style.transform = k < 1 ? `scale(${k})` : '';
    box.style.height = `${Math.ceil(h * k)}px`;
    box.style.width = `${Math.ceil(w * k) + 2}px`;
    box.style.maxWidth = '100%';
    const hd = ifr.contentDocument?.querySelector('header'), nv = ifr.contentDocument?.querySelector('nav.top');
    box.parentElement.querySelector('small').textContent = `แถบ ${nv?.offsetHeight ?? '?'} + หัว ${hd?.offsetHeight ?? '?'} px${k < 1 ? ` · ย่อ ${Math.round(k * 100)}%` : ''}`;
  }
  // แก้ค่า: เปลี่ยนแค่ <style id="ov"> ในกรอบเดิม ไม่โหลดกรอบใหม่
  function restyle() {
    for (const [ifr, w] of frames) {
      const ov = ifr.contentDocument?.getElementById('ov');
      if (ov) { ov.textContent = headCss(S); fit(ifr, w); }
    }
    report();
    store();
  }
  function report() {
    const rows = PAIRS().map(([n, f, b, min]) => [n, f, b, min, ratio(f, b)]);
    $('cr').innerHTML = `<table class="cr">${rows.map(([n, f, b, min, r]) => `<tr><td><span class="sw" style="background:${b}"></span><span class="sw" style="background:${f}"></span> ${esc(n)}</td><td class="n ${r < min ? 'bad' : 'ok'}">${r.toFixed(2)}${r < min ? ` < ${min}` : ''}</td></tr>`).join('')}</table>`;
    const br = ruleBreaks();
    $('rules').innerHTML = br.length ? `<ul>${br.map((x) => `<li class="bad">${esc(x)}</li>`).join('')}</ul>` : '<p class="hint ok">ไม่มีแดง/เขียวบนพื้นคราม · หัวแบบเดียวทุกหน้า (ค่าชุดเดียว)</p>';
    output(rows, br);
  }
  function output(rows, br) {
    const edited = Object.keys(P0).filter((k) => k !== 'name' && S[k] !== PRESETS[S.base][k]);
    const keys = Object.keys(P0).filter((k) => k !== 'name');
    const o = { page: 't2-header-tweak', ticket: 103, base: S.base, baseName: PRESETS[S.base].name, edited, values: Object.fromEntries(keys.map((k) => [k, S[k]])),
      contrastFail: rows.filter(([, , , min, r]) => r < min).map(([n, , , , r]) => `${n} ${r.toFixed(2)}`), ruleBreaks: br, note };
    $('out').value = JSON.stringify(o);
  }
  const colorRow = ([k, t]) => `<div class="row"><span class="lb">${esc(t)}</span><input type="color" data-k="${k}" value="${S[k]}" aria-label="${esc(t)}"><input type="text" data-k="${k}" value="${S[k]}" aria-label="${esc(t)} hex"></div>`;
  const range = (k, t, lo, hi) => `<div class="row"><span class="lb">${esc(t)}</span><input type="range" data-k="${k}" min="${lo}" max="${hi}" value="${S[k]}" aria-label="${esc(t)}"><b data-v="${k}">${S[k]}</b></div>`;
  const check = (k, t) => `<div class="row"><label class="lb"><input type="checkbox" data-k="${k}"${S[k] ? ' checked' : ''}> ${esc(t)}</label></div>`;
  function panel() {
    $('ctl').innerHTML = `<h1>T2 หัวเว็บ + nav</h1>
      <p class="hint">หัวชุดเดียวใช้ทุกหน้าเอกสาร (ยกเว้นหน้าแรก · หน้าเล่น) · ใช้ชุดสี T1 คราม (ข้อ 209–211) · แถบบนตัวจริงมาจาก nav.mjs</p>
      <h2>แบบตั้งต้น</h2><div class="pre">${PRESETS.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${S.base === i}">${esc(p.name)}</button>`).join('')}</div>
      <h2>กติกา T2</h2><div id="rules"></div>
      ${COLORS.map(([g, xs]) => `<h2>${esc(g)}</h2>${xs.map(colorRow).join('')}`).join('')}
      <h2>ลายประแจ</h2>${check('prajae', 'แสดงลายประแจใต้หัว')}${range('pjAlpha', 'ความเข้ม %', 10, 100)}${range('pjSize', 'ขนาดลาย px', 8, 24)}
      <h2>ความสูง</h2>${range('navH', 'แถบบน px', 36, 56)}${range('padT', 'หัว ขอบบน px', 8, 48)}${range('padB', 'หัว ขอบล่าง px', 8, 48)}${check('join', 'แถบบนกับหัวเป็นก้อนเดียว (ไม่มีเส้นคั่น)')}
      <h2>ฟอนต์ชื่อหน้า</h2><div class="row"><span class="lb">หัว (h1)</span><select data-k="hdFont">${FONTS_HEAD.map((f) => `<option${f === S.hdFont ? ' selected' : ''}>${f}</option>`).join('')}</select></div>
      <h2>contrast ทุกคู่สี</h2><div id="cr"></div>
      <h2>คัดลอก</h2><div class="row"><span class="lb">หมายเหตุถึงผู้พัฒนา</span></div><textarea id="note" rows="2">${esc(note)}</textarea>
      <textarea id="out" rows="5" readonly aria-label="JSON ค่าที่เลือก"></textarea>
      <div class="row"><button type="button" id="copy">คัดลอก JSON</button><button type="button" id="reset">กลับค่าแบบตั้งต้น</button></div><div id="msg" role="status"></div>`;
    $('ctl').querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.p; S = { ...PRESETS[i], base: i }; panel(); restyle(); }));
    $('ctl').querySelectorAll('input[data-k], select[data-k]').forEach((el) => el.addEventListener('input', () => {
      const k = el.dataset.k;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
      if ((el.type === 'text' || el.type === 'color') && !/^#[0-9a-f]{6}$/i.test(v)) return;
      if (typeof v === 'string' && v.startsWith('#')) v = v.toUpperCase();
      S[k] = v;
      $('ctl').querySelectorAll(`[data-k="${k}"]`).forEach((x) => { if (x !== el && x.type !== 'checkbox') x.value = v; });
      const lab = $('ctl').querySelector(`[data-v="${k}"]`); if (lab) lab.textContent = v;
      restyle();
    }));
    $('note').addEventListener('input', (e) => { note = e.target.value; report(); store(); });
    $('reset').addEventListener('click', () => { S = { ...PRESETS[S.base], base: S.base }; panel(); restyle(); });
    $('copy').addEventListener('click', async () => {
      const o = $('out');
      try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
      $('msg').textContent = 'คัดลอกแล้ว — วางให้ผู้พัฒนาได้เลย';
    });
    report();
  }
  panel();
  draw();
  addEventListener('resize', () => frames.forEach(([ifr, w]) => fit(ifr, w)));
})();
</script>
</body>
</html>
