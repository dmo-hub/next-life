<template id="gcss"><style>/*GAME-CSS:START*/

/* สีมาจากต้นแบบการ์ด (ใบ 06) — ทาง A ทะเบียนราษฎร์ · ทาง B ลายรดน้ำ · ไม่สลับตามโหมดมืดเพราะสีเป็นตัวบอกแนวการ์ด */
/* ui-redo ใบ 105 ลง T1 (ข้อ 209–211 · 215–217): ชุดคราม — หมึก = ปุ่มหลัก = หัวเว็บ #1B2A4A · หัว Maitree เนื้อ Sarabun · มุม 6 (การ์ด 8) · เงาทองเฉพาะการ์ดในเกม
   · --red = ชาด เหลือแค่ตรา/ขีดฆ่า (ข้อ 215) · --line-strong = ขอบที่บอกว่ากดได้ (--rule เป็นเส้นประดับ ต่ำกว่า 3:1)
   · การ์ด B + ภาพแชร์ · ต่างโลก · ระหว่างชาติ/ปรโลก คงสีเดิมจนใบ 121 (ข้อ 228 ชุด ก) · แถบค่า --fl รอ T6
   · การ์ดกว้างสุด 800 · ขอบรอบการ์ด 36 บนล่าง 32 ข้าง ค่าเดียวทุกจอ (ต้นแบบ tweak.html) */
:root {
  --page:#F4ECDC; --ink:#1B2A4A; --ink2:color-mix(in srgb, #1B2A4A 70%, #5B5648); --muted:#5B5648;
  --paper:#FBF6EA; --paper2:color-mix(in srgb, #FBF6EA 45%, #F4ECDC); --rule:#C9B98F; --rule2:color-mix(in srgb, #C9B98F 60%, #FBF6EA); --line-strong:#8C7A52;
  --red:#A62B1F; --green:#2F6B4F; --blue:#7A5C12; --head:#1B2A4A;
  --lacquer:#17110D; --lacquer2:#221912; --gold:#D9B45A; --gold2:#F0D78C; --cream:#EFE3C2; --bronze:#5A4630; --bronze2:#8A6D3B; --sand:#BFAE86;
  --fl:#015EC1; --dg:#B3261E; --track:#E2D9C6;
  --ft:Sarabun,system-ui,sans-serif; --fh:Maitree,serif;

}
* { box-sizing:border-box; }

/* viewport-fit=cover ให้ env(safe-area-inset-*) มีค่า แต่หน้าก็ลามใต้รอยบาก/แถบโฮม — ทุกขอบที่ติดจอต้องกันเอง */
.logo { background:var(--head); text-align:center; padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); border-bottom:1px solid var(--bronze); }
.logo b { font-family:Srisakdi,serif; font-weight:700; font-size:34px; line-height:1.2; color:var(--gold); }
.logo b span { display:inline-block; }
.logo small { display:block; font-size:12px; letter-spacing:0.12em; color:color-mix(in srgb, var(--cream) 85%, var(--head)); }
.logo .ver { text-decoration:none; display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid var(--bronze); border-radius:999px; font-size:12px; font-weight:600; color:var(--sand); white-space:nowrap; }
.logo a.ver:hover, .logo a.ver:focus-visible { text-decoration:underline; outline:none; }
.logo .saved { display:inline-block; margin:4px 0 0 6px; font-size:11px; color:var(--sand); white-space:nowrap; }
.logo .saved:not(:empty)::before { content:'\25CF  '; color:#7FC4B8; }
.logo .saved.off::before { color:#E07A5F; }
#app { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:var(--pad-y) max(var(--pad-x), env(safe-area-inset-right)) var(--pad-y) max(var(--pad-x), env(safe-area-inset-left)); }
/* ป้ายเกมไม่ใช่คำแนะนำการลงทุน (ใบ 11) อยู่ทุกหน้าจอ ไม่ใช่แค่การ์ดจัดสรรเงิน */
.foot { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(var(--pad-x), env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad-x), env(safe-area-inset-left)); font-size:12px; color:var(--muted); text-align:center; }
.foot a { color:var(--muted); display:inline-block; min-height:44px; line-height:44px; }
/* ปุ่มอยู่ท้ายการ์ด (margin-top:auto) — การ์ดสูงตายตัว 560 บนจอเตี้ยดันปุ่มของการ์ดเนื้อสั้นลงใต้แถบเบราว์เซอร์
   · เพดานตามความสูงจอหักหัวเว็บ+ระยะบน (--chrome) · svh = จอตอนแถบเบราว์เซอร์โผล่ ไม่ยืดหดตามการเลื่อนแบบ dvh ปุ่มจึงไม่กระโดดระหว่างเลื่อน */
:root { --chrome:136px; }
.card { display:flex; flex-direction:column; border-radius:var(--rk); box-shadow:var(--sh); min-height:560px; min-height:min(560px, calc(100vh - var(--chrome))); min-height:min(560px, calc(100svh - var(--chrome) - env(safe-area-inset-bottom))); }
/* ข้อความสำหรับโปรแกรมอ่านจอเท่านั้น */
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
/* จุดแดง "ใหม่" (B116): ชั้นสมุด · แท็บในชั้นสมุด · แผงฉายา/เหตุการณ์ — ป้ายอ่านจอบอกความหมายแทนสี */
.new-dot { display:inline-block; width:8px; height:8px; margin-left:6px; border-radius:50%; background:var(--blue); vertical-align:middle; flex:none; }

.card [hidden] { display:none !important; }
/* กล่องกระซิบ (B117): เส้นประ ตัวเอียง แยกจากเนื้อเรื่องของการ์ด · ปุ่มเป็นลิงก์เล็ก ไม่ปนกับตัวเลือกของเกม */
.whisper { margin-top:4px; padding:8px 12px; border:1px dashed var(--rule); border-radius:var(--r); background:#FBF7EE; display:flex; flex-direction:column; gap:4px; }
.whisper .h { font-size:12px; font-weight:600; color:var(--blue); }
.whisper p { font-family:var(--ft); font-size:14px; color:var(--ink2); }
.whisper-row { display:flex; flex-wrap:wrap; gap:0 16px; }

.choices .later { align-self:flex-start; }
.whisper .more:focus-visible, .choices .later:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.choices.folded { margin-top:0; }
.choices.folded .note { margin:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }

.top small { font-size:12px; letter-spacing:0.04em; text-align:right; }
/* รูปตัวละคร (B56): วงกลมมุมซ้ายหัวการ์ด · clip-path ตัดเสื้อที่ยื่นเลยวงกลม (ภาพแชร์ตัดด้วย arc แบบเดียวกัน) */
.av { flex:none; display:block; width:40px; height:40px; clip-path:circle(50%); }

.top .av { width:32px; height:32px; margin:-3px -6px -3px 0; }

/* แผ่นภาพยุค: รักดำ+ทองทุกธีม (สีอยู่ในตัวภาพ) — ธีมสว่างจึงเป็นแผ่นเข้มบนพื้นขาวเหมือนกรอบภาพ */

/* ภาพฉากบนการ์ดแรกเกิด/การ์ดตาย: เล็กพอให้ปุ่มไปต่ออยู่จอแรก */

   · ชื่อค่ายาวบนจอแคบให้ตัวเลขตกบรรทัดแทนตัดชื่อ — แถบชิดล่างทุกช่องจึงยังอยู่แนวเดียวกัน */
.sb { padding:12px 20px; border-bottom:1px solid var(--rule2); border-radius:var(--rk) var(--rk) 0 0; }

.lineage-view { display:grid; gap:6px; }
.lineage-text summary { cursor:pointer; font-size:13px; color:var(--muted); min-height:44px; display:flex; align-items:center; }
.bk-tabs { display:flex; flex-wrap:wrap; gap:6px; }
.bk-tabs button { all:unset; cursor:pointer; min-height:44px; padding:0 12px; border:1px solid var(--ink2); border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; }
.bk-tabs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
.bk-tabs button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

/* สมุดชีวิต (B48) — หน้าก่อน/ข้ามกว้างเท่ากันใต้ปุ่มพลิกหน้า · ตัวเลือกที่กดเป็นตัวหนังสือเอียงแยกจากเนื้อเรื่อง */
.lifebook .row { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.lifebook .row .choice { justify-content:center; }
.lifebook .body .dates { margin-top:-6px; font-size:14px; }

/* ทาง A — ทะเบียนราษฎร์: กระดาษ หมึก ตราประทับแดง */
.a { background:var(--paper); border:1px solid var(--rule); color:var(--ink); }
.a .top { background:var(--ink); color:var(--paper); }
.a .top b { font-family:var(--fh); font-size:16px; font-weight:600; }
.a .meta { color:var(--muted); padding-top:8px; }
.a .bar { background:#E2D9C6; } .a .bar i { background:var(--green); } .a .bar b { background:var(--dg); }
.a .kicker { color:var(--blue); }
.a .body h3 { font-family:var(--ft); font-weight:600; }
.a .body h3.lead { font-family:var(--ft); }
.a .body p, .a .items, .a .picks { color:var(--ink2); }
.a .sub, .a .note, .a .body .horo { color:var(--muted); }
.a .spark .nom { stroke:var(--green); } .a .spark .dot { fill:var(--green); }
.a .spark .grid { stroke:var(--rule2); } .a .spark .zero { stroke:var(--ink2); }
.a .spark .neg { fill:var(--dg); fill-opacity:0.08; }
.a .spark text { fill:var(--muted); }
.a .band0 { fill:var(--paper2); fill-opacity:0.55; } .a .band1 { fill:transparent; }
/* ชาดไม่ใช่สีข้อมูลแล้ว (ข้อ 215) · --blue เป็นทองเข้มใกล้ --bronze2 ⇒ เส้นแรกใช้น้ำเงินแถบค่าให้ 5 เส้นยังแยกกันได้ */
.a .ln0 { stroke:var(--fl); } .a .ln1 { stroke:var(--bronze2); } .a .ln2 { stroke:var(--blue); } .a .ln3 { stroke:var(--green); } .a .ln4 { stroke:var(--ink); }
.a .lifechart { border:1px solid var(--rule); border-radius:var(--r); background:#FBF7EE; }
.b .band0 { fill:var(--bronze); fill-opacity:0.25; } .b .band1 { fill:transparent; }
.b .ln0 { stroke:#E07A5F; } .b .ln1 { stroke:var(--gold); } .b .ln2 { stroke:#8FB3E0; } .b .ln3 { stroke:#7FC4B8; } .b .ln4 { stroke:var(--cream); }
.b .lifechart { border:1px solid var(--bronze); background:var(--lacquer2); }
/* กราฟฐานะตระกูล (B95): ขาลงเส้นประ + สีแดง ขาขึ้นเส้นทึบ — ตาบอดสีก็ยังแยกได้ · ขึ้นได้ทั้งการ์ดทาง A ทาง B และปรโลก */
.spark .sg { stroke-width:2.2; stroke-linecap:round; } .spark .sg.sd { stroke-dasharray:5 3; } .spark .sg.se { stroke-width:1.6; }
.legend .key .sg { stroke-width:2; }
.a .sg.su { stroke:var(--green); } .a .sg.sd { stroke:var(--dg); } .a .sg.se { stroke:var(--ink2); }
.a .spark .mk.broke rect { fill:var(--dg); stroke:var(--ink); stroke-width:1.5; } .a .spark .mk.nx circle { fill:var(--paper); stroke:var(--ink); stroke-dasharray:2 1.5; }
.a .legend .mk.broke rect { fill:var(--dg); stroke:var(--ink); stroke-width:1; }
.b .sg.su { stroke:var(--gold2); } .b .sg.sd { stroke:#E39A8A; } .b .sg.se { stroke:var(--sand); }
.b .spark text, .b .mk-cap, .b .lifechart .h { fill:var(--sand); color:var(--sand); } .b .spark .grid { stroke:var(--bronze2); }
.b .spark .mk.ev circle { fill:var(--lacquer); stroke:var(--gold2); } .b .spark .mk.nx circle { fill:var(--lacquer); stroke:var(--cream); stroke-dasharray:2 1.5; }
.b .spark .mk.broke rect, .b .legend .mk.broke rect { fill:#E39A8A; stroke:var(--cream); stroke-width:1.5; }
.a .choice { border:1px solid var(--line-strong); background:#FFFDF7; font-size:15px; }
.a .choice:hover, .a .choice:focus-visible { background:var(--ink); color:var(--paper); outline:none; }
.a .choice .fx { color:var(--green); } .a .choice:hover .fx, .a .choice:focus-visible .fx { color:#CFE3E0; }
/* คำอธิบายสกิลใต้ชื่อปุ่ม (06s: จอเลือกพก · การ์ดฝึกสกิล · เลือกลงสมุด) · ปุ่มเลือกพกที่กดไว้มีแถบซ้าย */
.a .choice .idesc, .b .choice .idesc { display:block; margin-top:2px; font-size:12px; }
.a .choice .idesc { color:var(--muted); } .a .choice:hover .idesc, .a .choice:focus-visible .idesc { color:#CFE3E0; }
.a .choice[aria-pressed="true"] { box-shadow:inset 5px 0 0 var(--green); }

/* ทาง B — ลายรดน้ำ: พื้นรักดำ ทองคำเปลว */
.b { background:var(--lacquer); color:var(--cream); border:1px solid var(--bronze); }

.b .top small, .b .meta, .b .sub, .b .note { color:var(--sand); }
.b .bar { background:#3A2C1F; } .b .bar i { background:var(--gold); } .b .bar b { background:var(--cream); }

.scale { display:flex; gap:12px; }

.deed { margin:0; display:flex; flex-direction:column; gap:2px; font-size:13px; overflow-wrap:anywhere; color:#E3D6B3; }

/* มรณบัตร — หนังสืองานศพ (B83b D3 ทาง B): ขาวดำ กรอบหนา รูปกลางใบ · กราฟกับสรุปข้างในคงสีทาง A */
.a.mem { position:relative; isolation:isolate; background:#FFFFFF; border:12px solid #1F1F1F; outline:1px solid #8A8A8A; outline-offset:-6px; color:#1F1F1F; }
/* ภาพฉากเป็นพื้นหลังจาง (ui-redo 57 · ค่าแรกเกิดใบ 61: ชิดบนกลาง กว้างเต็ม จาง 0.1) — z-index ติดลบใต้เนื้อ แต่ isolation ของการ์ดกันไม่ให้ลงไปใต้พื้นขาว

.d-bg { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; color:#000000; }
.d-bg svg { position:absolute; left:50%; top:0; width:100%; height:auto; transform:translateX(-50%); opacity:0.1; }
.d-bg [fill]:not([fill="none"]) { fill:currentColor; }

.mem .top { background:transparent; color:#1F1F1F; justify-content:center; padding-top:18px; }

.por { align-self:center; width:96px; height:96px; border:1px solid #1F1F1F; padding:4px; }
.d-head { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }

.d-tl .more-n { color:var(--muted); }

/* ใบมรณะย่อ (ui-redo ใบ 10): ปุ่มไปต่อเป็นปุ่มหลักปุ่มเดียวต่อจากข้อมูล · ปุ่มแชร์เป็นปุ่มรองเส้นประท้ายการ์ด
   สีเน้นเป็นดำ (ui-redo 57 · เจ้าของตั้ง accent #000000) — กด/โฟกัสยกเป็นเทาเข้มให้ยังเห็นว่ามีการตอบสนอง */
.mem .choices { margin-top:0; }
.mem .choices > .choice { background:#000000; border-color:#000000; color:#FFFFFF; justify-content:center; font-weight:600; }
.mem .choices > .choice:hover, .mem .choices > .choice:focus-visible { background:#3A3A3A; border-color:#3A3A3A; color:#FFFFFF; outline:2px solid #000000; outline-offset:2px; }

/* แท็บรายละเอียด (ui-redo ใบ 11): ปุ่มแคปซูลตัดบรรทัดได้ จอแคบไม่ล้นแนวนอน · หัวในแผงคืนเป็นหัวเล็ก ไม่รับตัวเขียนชื่อผู้ตาย */
.d-tab-bar { display:flex; flex-wrap:wrap; gap:6px; }

.d-share { margin-top:4px; padding-top:12px; border-top:1px dashed #8A8A8A; }

.d-share > summary::-webkit-details-marker { display:none; }
.d-share > summary::after { content:'\25BE'; }
.d-share[open] > summary::after { content:'\25B4'; }

.d-share-in { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.d-share .choice { flex:1 1 auto; min-height:44px; padding:6px 12px; justify-content:center; font-size:14px; background:transparent; border-style:dashed; }
/* ป้ายตามหาคนหาย (B139): กระดาษประกาศติดเสา หัวแดงตัวหนา — ต่างจากหนังสืองานศพขาวดำ ให้รู้ว่ายังไม่มีใครถือว่าจากไป */
.a.mem.lost { background:#FFF8E1; border:3px dashed #B3261E; outline:none; }
.lost .top { padding-top:20px; }
.lost .top b { font-family:var(--ft); font-size:24px; font-weight:800; color:#B3261E; letter-spacing:0.02em; }

.lost .choice, .lost .d-share > summary { border-color:#B3261E; }

/* ทาง C ต่างโลก (B68) — หน้าต่างสถานะแบบเกม: พื้นฟ้ากลางคืน กรอบฟ้าเรือง · ต่างจากสองแนวไทยให้รู้ว่าออกจากวงเวียนเดิมแล้ว */
.i { background:#161A3A; color:#E8ECFF; border:1px solid #3B4BA8; }
.i .top { border-bottom:1px solid #3B4BA8; }
.i .top b { font-family:var(--ft); font-size:18px; font-weight:600; color:#6FE3FF; }
.i .top small, .i .note, .i .tree summary { color:#A6AEDB; }
.i .kicker { color:#B48CFF; letter-spacing:0.06em; }
.i .body h3 { font-family:var(--ft); font-weight:600; color:#E8ECFF; }
.i .body p, .i .picks { color:#D3D8F5; }
.i .choice { border:1px solid #3B4BA8; border-radius:6px; background:#0E1024; color:#E8ECFF; }
.i .choice:hover, .i .choice:focus-visible { border-color:#6FE3FF; background:#1E2350; outline:none; }
.i .choice .fx { color:#6FE3FF; }
.i .idesc { display:block; text-indent:0; margin-top:2px; font-size:12px; color:#A6AEDB; }
.i .iok { color:#5EE6A0; font-weight:600; } .i .ibad { color:#FF8A8A; font-weight:600; }
.i .isys { font-size:13px; color:#F2C94C; border:1px dashed #F2C94C; border-radius:6px; padding:6px 10px; }
/* แถบสถานะต่างโลก (ui-redo ใบ 13): โครง .sb ของโลกนี้ พื้นแถบเข้มกว่าการ์ดแบบต้นแบบ · อักษรแรกของชื่อแทนรูปตัวละคร */
.i .sb { background:#12152E; }
.sb .ini { display:grid; place-items:center; background:#232A5E; color:#6FE3FF; font-weight:700; }
.ichips { display:flex; flex-wrap:wrap; gap:6px; }

/* คำสัญญากับเทพธิดาบนการ์ดจบต่างโลก (B68e) — กรอบทองแบบข้อความระบบ · รักษาได้เขียว ผิดแดง (มีคำกำกับ ไม่พึ่งสีอย่างเดียว) */
.ivow { display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1px solid #F2C94C; border-radius:6px; background:#0E1024; }
.ivow .h { font-size:12px; font-weight:600; letter-spacing:0.06em; color:#F2C94C; }
.ivow blockquote { margin:0; font-family:var(--ft); color:#E8ECFF; }
.ivow b { font-size:14px; } .ivow.kept b { color:#5EE6A0; } .ivow.broke b { color:#FF8A8A; }
/* การ์ดชวนไปต่างโลก (B68d) — กรอบสีต่างโลกโผล่กลางการ์ดชีวิต · ทั้งใบยังเป็นของโลกนี้เพราะยังไม่ได้รับ */

  // ---------- ชิ้นการ์ด: คลาสเดียวกับ app.mjs (แถบสถานะ · body · choices · เมนูล่าง) ----------
  const meter = (label, v) => `<li><span class="mh"><span class="mk">${label}</span><b class="num">${v}</b></span><span class="br"><i style="width:${v}%"></i></span></li>`;
  const sb = (age, stage) => `<header class="sb"><div class="sb-r1"><svg class="av" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#E0B48A"/></svg><span class="sb-who"><b>เปิ้ล</b><small>จ.เชียงราย · ช่วง${esc(stage)}</small></span><span class="sb-age"><b>${age}</b><small> ปี</small></span></div><ul class="sb-m">${meter('ชีวิต', 76)}${meter('ความสุข', 62)}${meter('ความรู้', 59)}${meter('ความสัมพันธ์', 57)}</ul></header>`;
  const MENU = '<nav class="mnav" aria-label="เมนู"><button type="button"><span>ตัวฉัน</span></button><button type="button"><span>ครอบครัว</span></button><button type="button"><span>เงิน</span></button><button type="button"><span>สมุด</span></button><button type="button"><span>เพิ่มเติม</span></button></nav>';
  const LOGO = '<header class="logo"><b>เกิดใหม่ทั้งที <span>ชาตินี้ขอชิงมาเกิด</span></b><small>NEXT LIFE</small></header>';
  const NEXT = '<div class="choices"><button type="button" class="choice"><span>ต่อไป</span></button></div>';
  // การ์ดปรโลกไม่มีแถบสถานะ/เมนูล่าง (renderAfter) — โครงเดียวกับการ์ดชีวิตที่เหลือ
  const card = (theme, body, { age = 0, stage = 'เด็ก', layer = '', after = false } = {}) => `${LOGO}<main id="app"><article class="card ${theme}${after ? ' af' : ''} pn pn2 tw-host">${layer}<div class="p-left">${after ? '' : sb(age, stage)}</div><div class="p-mid"><div class="body">${body}</div>${NEXT}</div></article>${after ? '' : MENU}</main>`;

  // ตัวอย่างแรกเกิด: ข้อความจริงจากชีวิตบอท (harness) · บรรทัดคำเตือนกับโอกาสเกิดเป็นข้อความตัวอย่าง (หน้าจอคิดจากข้อมูลเกิดที่ harness ไม่มี)
  const WARN = 'ผู้เล่นวัยรุ่นขึ้นไป · เรื่องจริงบางเรื่องหนัก: ความตาย หนี้ การสูญเสีย และความรุนแรง · ถ้าเล่นแล้วไม่สบายใจ <a>โทร 1323</a> ได้ตลอด 24 ชม.';
  const ODDS = 'เด็กไทยที่เกิดปีเดียวกัน ราว 1 ใน 640 คน เกิดแบบคุณ (จ.เชียงราย · ฐานะเดียวกัน)';
  const TIER = { birth_poor: 0, birth_mid: 1, birth_rich: 2 };
  function introSample() {
    const xs = ui.heir ? C.intro.heir : C.intro[TIER[ui.birth]];
    return xs[ui.pick % xs.length] || C.intro[1][0];
  }
  function introCard(theme, x) {
    const s = x || introSample();
    const heir = s.age > 0;
    let body = `<span class="kicker">เปิดชีวิต</span><span class="stamp">${heir ? 'รับช่วงชีวิต' : 'แรกเกิด'}</span><h3 class="lead">${esc(s.text)}</h3><p class="horo">${esc(s.horo)}</p>`;
    if (!heir) body += `<p class="warn-line">${WARN}</p>`;
    body += `<p class="sub">${ODDS}</p>`;
    s.story.forEach((p, i) => { body += `<p${i ? ' class="sub"' : ''}>${esc(p)}</p>`; });
    if (s.inherit?.length) body += `<div class="recap"><div class="h">${heir ? 'สิ่งที่สืบทอดจากรุ่นก่อน' : 'สิ่งที่สืบทอดจากชาติก่อน'}</div><ul class="picks">${s.inherit.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
    const b = cfg.birth;
    if (b.area === 'old') return card(theme, svg('era-art scene-art scene-sm', [...D.frame, ...D.birth[ui.birth].parts], null, ` data-scene="${ui.birth}"`) + body, { age: s.age, stage: heir ? 'ผู้ใหญ่' : 'เด็ก' });
    return card(theme, body, { age: s.age, stage: heir ? 'ผู้ใหญ่' : 'เด็ก', layer: bgLayer(D.birth[ui.birth].parts, b, theme, ui.birth) });
  }
  function resultCard(theme, k, i) {
    const cat = C.cats.find((c) => c.k === k);
    const s = cat.samples[i % Math.max(1, cat.samples.length)] || { t: '(ด่านไม่เจอการ์ดหมวดนี้)' };
    const r = cfg.result;
    const shown = cfg.result.off.includes(k) ? 'mid' : k;
    const art = D.cat[shown];
    let body = '';
    if (r.mode === 'sm') body += `<div class="tw-sm" style="--tw:${r.w}px">${svg('era-art scene-art scene-sm', [...D.frame, ...art.parts], null, ` data-scene="cat_${shown}"`)}</div>`;
    body += `<span class="kicker">ผลที่ตามมา</span><h3>${esc(s.t)}</h3>${s.s ? `<p>${esc(s.s)}</p>` : ''}`;
    if (s.left !== undefined) body += `<p class="sub">${s.left ? `หมอว่าเหลือเวลาราว ${s.left} ปี` : 'หมอว่านี่อาจเป็นปีสุดท้าย'}</p>`;
    return card(theme, body, { age: s.age ?? 40, stage: s.stage || 'ผู้ใหญ่', after: k === 'after', layer: r.mode === 'bg' ? bgLayer(art.parts, r.bg, theme, `cat_${shown}`) : '' });
  }

  // ---------- CSS ต้นแบบในจอ (ยังไม่มีในเกม — ใบ 61/62 ลงจริงตาม JSON ใบ 59) ----------
  const PROTO = `
.tw-host { position:relative; isolation:isolate; overflow:hidden; }
.tw-host > .p-left, .tw-host > .p-mid { position:relative; z-index:1; }
.tw-bg { position:absolute; z-index:0; pointer-events:none; overflow:hidden; }
.tw-bg.tw-card { inset:0; }
.tw-bg.tw-body { left:0; right:0; top:var(--tw-top, 0px); bottom:0; }
.tw-art { position:absolute; display:block; height:auto; }
.tw-sm .scene-sm { width:min(100%, var(--tw)); }
`;
  const GCSS = $('gcss').content.querySelector('style').textContent;
  const FONTS = new URL('../../fonts/fonts.css', location.href).href;
  const doc = (html) => `<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="${FONTS}"><style>${GCSS}</style><style>${PROTO}</style></head><body>${html}</body></html>`;

  // ---------- วัดในจอ: contrast ข้อความบนภาพ · ปุ่มไปต่อจอแรก · ล้น ----------
  const rgb = (s) => (s.match(/[\d.]+/g) || []).map(Number);
  const lum = ([r, g, b]) => { const f = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (top, under, a) => top.map((x, i) => x * a + under[i] * (1 - a));
  const opaque = (el, win) => {
    for (let e = el; e; e = e.parentElement) {
      const c = rgb(win.getComputedStyle(e).backgroundColor);
      if (c.length >= 3 && (c.length < 4 || c[3] >= 1)) return c.slice(0, 3);
    }
    return [255, 255, 255];
  };
  const hit = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  // contrast แย่สุด = ตัวหนังสือทับเส้นภาพเต็มความเข้ม (สีเส้น × ความจาง ทับพื้นการ์ด) · ข้อความที่ไม่ทับกรอบภาพวัดกับพื้นอย่างเดียว
  function measure(f, w) {
    const d = f.contentDocument, win = f.contentWindow;
    const art = d?.querySelector('article');
    if (!art) return null;
    const pic = d.querySelector('.tw-art');
    const box = pic?.getBoundingClientRect();
    const tint = pic && hexRgb(pic.querySelector('path').getAttribute('stroke') || pic.querySelector('path').getAttribute('fill'));
    const op = pic ? +pic.style.opacity : 0;
    const texts = [...d.querySelectorAll('.body h3, .body p, .body .kicker, .body .stamp, .body li, .body a, .choices .choice span')].filter((e) => e.textContent.trim());
    let min = 99, worst = '';
    for (const e of texts) {
      const bg = opaque(e, win);
      const under = pic && [...e.getClientRects()].some((r) => hit(r, box)) ? mix(tint, bg, op) : bg;
      const cr = ratio(rgb(win.getComputedStyle(e).color), under);
      if (cr < min) { min = cr; worst = e.tagName.toLowerCase() + (e.className ? `.${e.className}` : ''); }
    }
    const btn = d.querySelector('.choices .choice');
    // เมนูล่างกินขอบล่างจอ · จอคอมเมนูเป็นราวข้าง (ui-redo 67) ไม่บังปุ่ม
    const nr = d.querySelector('.mnav')?.getBoundingClientRect();
    const fold = nr && nr.top > VIEW[w] / 2 ? nr.top : VIEW[w];
    return { w, cr: min, worst, btn: Math.round(btn.getBoundingClientRect().bottom), fold: Math.round(fold), over: Math.max(0, d.documentElement.scrollWidth - w) };
  }

  const frames = $('frames');
  const results = new Map();
  const fit = (f, w) => {
    const box = f.parentElement;
    const s = Math.min(1, box.clientWidth / w);
    Object.assign(f.style, { width: `${w}px`, height: `${VIEW[w]}px`, transform: `scale(${s})` });
    box.style.height = `${Math.ceil(VIEW[w] * s)}px`;
  };
  function frame(key, title, html, w, meta) {
    const wrap = document.createElement('section');
    wrap.className = `fr${w === 1280 ? ' wide' : ''}`;
    wrap.innerHTML = `<h3>${esc(title)} <small></small></h3><div class="box"><iframe title="${esc(title)}"></iframe></div>`;
    const f = wrap.querySelector('iframe');
    const done = () => {
      fit(f, w);
      // แถบบน: พื้นหลังเริ่มใต้แถบสถานะ — วัดขอบล่างแถบสถานะจริงหลังฟอนต์โหลด
      const sbEl = f.contentDocument?.querySelector('.sb'), host = f.contentDocument?.querySelector('.tw-host');
      if (sbEl && host) host.style.setProperty('--tw-top', `${Math.round(sbEl.getBoundingClientRect().bottom - host.getBoundingClientRect().top)}px`);
      const m = measure(f, w);
      if (!m) return;
      results.set(key, { ...meta, ...m });
      const foldOk = m.btn <= m.fold;
      // เกณฑ์ปุ่มไปต่อจอแรกใช้ที่ 390 (ข้อ 80) · จออื่นบอกเป็นข้อมูล
      const ok = m.cr >= 4.5 && (w !== 390 || foldOk) && !m.over;
      wrap.querySelector('small').innerHTML = `${w}×${VIEW[w]} · contrast ต่ำสุด ${m.cr.toFixed(2)} (${m.worst}) · ปุ่มไปต่อ ${m.btn}/${m.fold}px ${foldOk ? 'จอแรก' : 'ตกจอ'}${w === 390 ? '' : ' (ข้อมูล)'} · ล้น ${m.over} · <span class="${ok ? 'ok' : 'bad'}">${ok ? 'ผ่าน' : 'ไม่ผ่าน'}</span>`;
      summary();
    };
    f.addEventListener('load', () => { done(); f.contentDocument.fonts?.ready.then(done); });
    f.srcdoc = doc(html);
    return wrap;
  }

  const catName = (k) => C.cats.find((c) => c.k === k).name;
  function draw() {
    results.clear();
    const list = [];
    const ws = [360, 390, 1280];
    if (ui.part === 'birth') {
      const name = ui.heir ? 'รับช่วงชีวิต' : D.birth[ui.birth].label;
      if (ui.mode === 'all') {
        for (const id of Object.keys(D.birth)) C.intro[TIER[id]].forEach((x, i) => { const keep = ui.birth; ui.birth = id; list.push(frame(`b-${id}-${i}`, `${D.birth[id].label} · ตัวอย่าง ${i + 1}`, introCard(ui.theme, x), 390, { part: 'birth', theme: ui.theme })); ui.birth = keep; });
        C.intro.heir.forEach((x, i) => list.push(frame(`b-heir-${i}`, `รับช่วงชีวิต · ภาพ${D.birth[ui.birth].label} · ตัวอย่าง ${i + 1}`, introCard(ui.theme, x), 390, { part: 'birth', theme: ui.theme })));
      } else for (const theme of ['a', 'b']) for (const w of ws) list.push(frame(`b-${theme}-${w}`, `${name} · ${THEME[theme]}`, introCard(theme), w, { part: 'birth', theme }));
    } else if (ui.mode === 'all') {
      for (const k of CATS) list.push(frame(`r-${k}`, `${catName(k)}${cfg.result.off.includes(k) ? ' → รวมหมวดกลาง' : ''}`, resultCard(k === 'after' ? 'b' : ui.theme, k, ui.pick), 390, { part: 'result', theme: k === 'after' ? 'b' : ui.theme }));
    } else for (const theme of ['a', 'b']) for (const w of ws) list.push(frame(`r-${theme}-${w}`, `${catName(ui.cat)} · ${THEME[theme]}`, resultCard(theme, ui.cat, ui.pick), w, { part: 'result', theme }));
    frames.replaceChildren(...list);
    for (const [id, k, v] of [['part', 'p', ui.part], ['mode', 'm', ui.mode], ['theme', 't', ui.theme]]) document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset[k] === v));
    document.querySelectorAll('#theme button').forEach((b) => { b.disabled = ui.mode === 'one'; });
    $('vnote').textContent = ui.part === 'birth'
      ? 'การ์ดแรกเกิดจริงในเกมเป็นธีมกระดาษเสมอ (ธีมลายรดน้ำไว้เทียบ) · ข้อความการ์ดจากชีวิตบอทจริง ยกเว้นบรรทัดคำเตือนกับบรรทัดโอกาสเกิด (ข้อความตัวอย่าง) · กรอบจอ = ความสูงจอเครื่องจริง เมนูล่างติดขอบจอ'
      : `การ์ดผลชาตินี้ = ธีมกระดาษ · ปรโลก = ลายรดน้ำ · ข้อความจริงจากด่าน (กดตัวอย่างถัดไปที่แผงซ้าย) · การ์ดผลที่ต่อจากการ์ดมีภาพฉาก/ภาพยุคไม่ใส่ภาพหมวด (ข้อ 89) ${C.skipped.toLocaleString('en-US')} ใบจาก ${C.total.toLocaleString('en-US')}`;
    $('out').value = output();
    store();
  }

  // ---------- ตารางหมวด: เปิด/ปิดหมวด (ปิด = รวมเข้าหมวดกลาง) สัดส่วนคิดใหม่ทันที ----------
  function share() {
    const counted = C.total - C.skipped;
    const n = Object.fromEntries(CATS.map((k) => [k, 0]));
    for (const c of C.cats) n[cfg.result.off.includes(c.k) ? 'mid' : c.k] += c.n;
    return { counted, n, mid: n.mid / counted };
  }
  function catTable() {
    const s = share();
    const rows = C.cats.map((c) => {
      const off = cfg.result.off.includes(c.k);
      const v = off ? 0 : s.n[c.k];
      const p = (100 * v) / s.counted;
      return `<tr class="${off ? 'off' : ''}"><td>${c.k === 'mid' ? '' : `<input type="checkbox" data-cat="${c.k}"${off ? '' : ' checked'} aria-label="ใช้หมวด ${esc(c.name)}">`}</td>
        <td><button type="button" class="pic" data-show="${c.k}" title="${esc(D.cat[c.k].label)}">${svg('mini', [...D.frame, ...D.cat[c.k].parts], null)}</button></td>
        <td><b>${esc(c.name)}</b><br><small>${esc(c.rule)}</small></td><td class="num">${v.toLocaleString('en-US')}<br><span class="barp"><i style="width:${Math.min(100, p * 2)}%"></i></span>${p.toFixed(1)}%</td></tr>`;
    }).join('');
    return `<table class="cr cats"><tr><th></th><th>ภาพ</th><th>หมวด · จับจาก</th><th>ใบ · สัดส่วน</th></tr>${rows}</table>
      <p class="hint">หมวดกลาง ${(100 * s.mid).toFixed(1)}% · เพดาน ≤ 50% (ข้อ 92): <span class="${s.mid <= 0.5 ? 'ok' : 'bad'}">${s.mid <= 0.5 ? 'ผ่าน' : 'เกิน'}</span> · ติ๊กออก = รวมเข้าหมวดกลาง · กดภาพ = ดูหมวดนั้น · นับจาก ${C.bots.length} บอท × ${C.n} ชีวิต 2 รุ่น + ปรโลก seed ${C.seed} (นับหมวด ${s.counted.toLocaleString('en-US')} ใบ)</p>
      <p class="hint">มรดก เกษียณ ล้มละลาย รอดตาย ตอบกลับการตามหา ยังไม่มีฟิลด์บอกแหล่ง ⇒ ตกหมวดกลางในตารางนี้ · ใบ 60 แนบป้ายหมวดจริงแล้วแยกได้</p>`;
  }

  function summary() {
    const rows = ['a', 'b'].map((t) => {
      const xs = [...results.values()].filter((x) => x.part === ui.part && x.theme === t);
      if (!xs.length) return `<tr><td>${THEME[t]}</td><td colspan="2">ยังไม่วัด</td></tr>`;
      const cr = Math.min(...xs.map((x) => x.cr));
      const at390 = xs.filter((x) => x.w === 390);
      const fold = at390.filter((x) => x.btn > x.fold).length;
      return `<tr><td>${THEME[t]}</td><td><span class="${cr >= 4.5 ? 'ok' : 'bad'}">${cr.toFixed(2)}:1</span></td><td><span class="${fold ? 'bad' : 'ok'}">${at390.length ? (fold ? `ตก ${fold} จาก ${at390.length} จอ` : `จอแรก ${at390.length}/${at390.length}`) : '-'}</span></td></tr>`;
    });
    $('cr').innerHTML = `<table class="cr"><tr><th>ธีม</th><th>contrast ต่ำสุด</th><th>ปุ่มไปต่อ (390)</th></tr>${rows.join('')}</table><p class="hint">เกณฑ์ ≥ 4.5:1 (ข้อ 80) ที่จุดตัวหนังสือทับเส้นภาพเข้มสุด · ปุ่มไปต่ออยู่เหนือเมนูล่างในจอแรก 390×844 · โหมดเทียบทุกตัวอย่างวัดครบทุกข้อความ · การ์ดที่มีรายการสืบทอดยาวตกจอทั้งแบบเดิมและแบบใหม่ (ความยาวข้อความ ไม่ใช่ภาพ) — สลับแบบเดิมดูได้</p>`;
    $('out').value = output();
  }

  function measured(part) {
    return Object.fromEntries(['a', 'b'].map((t) => {
      const xs = [...results.values()].filter((x) => x.part === part && x.theme === t);
      return [t, xs.length ? { contrast: +Math.min(...xs.map((x) => x.cr)).toFixed(2), foldOk390: xs.filter((x) => x.w === 390).every((x) => x.btn <= x.fold) } : null];
    }));
  }
  const bgOut = (b) => ({ preset: b.preset, opacity: b.op / 100, size: b.size, x: b.x, y: b.y, area: b.area, tint: b.tint });
  function output() {
    const s = share();
    const r = cfg.result;
    return JSON.stringify({
      page: 'card-art-tweak', ticket: 58,
      birth: { ...bgOut(cfg.birth), measured: ui.part === 'birth' ? measured('birth') : 'สลับไปส่วน 1 เพื่อวัด' },
      result: {
        mode: r.mode, ...(r.mode === 'sm' ? { smWidth: r.w } : { bg: bgOut(r.bg) }),
        cats: CATS.filter((k) => !r.off.includes(k)), mergedIntoMid: r.off, midShare: +s.mid.toFixed(3),
        measured: ui.part === 'result' ? measured('result') : 'สลับไปส่วน 2 เพื่อวัด',
      },
      counts: { seed: C.seed, lives: C.n, bots: C.bots.length, results: C.total, skippedAfterScene: C.skipped },
      note,
    }, null, 1);
  }

  function bgCtl(b, path) {
    const seg = (k, opts, cur) => `<div class="seg">${opts.map(([v, t, sw]) => `<button type="button" data-k="${path}.${k}" data-v="${esc(v)}" class="${String(cur) === String(v) ? 'on' : ''}">${sw ? `<span class="sw" style="background:${sw}"></span>` : ''}${t}</button>`).join('')}</div>`;
    const range = (k, label, min, max, unit) => `<div class="row"><span class="lb">${label} <output id="o-${path}-${k}">${b[k]}</output>${unit}</span><input type="range" data-r="${path}.${k}" min="${min}" max="${max}" value="${b[k]}"></div>`;
    const presets = Object.entries(PRESET).filter(([k]) => path === 'birth' || k !== 'old');
    const head = `<div class="row"><span class="lb">แบบตั้งต้น</span>${seg('preset', presets.map(([k, [t]]) => [k, t]), b.preset)}</div>`;
    if (b.area === 'old') return `${head}<p class="hint">แบบเดิมของเกม ไว้เทียบความยาวการ์ด/ปุ่มไปต่อ — เลือกแบบอื่นเพื่อปรับพื้นหลัง</p>`;
    return `${head}
      ${range('op', 'ความจาง (ความทึบ)', 2, 40, '%')}
      ${range('size', 'ขนาด (เทียบความกว้างการ์ด)', 50, 180, '%')}
      ${range('x', 'ตำแหน่งซ้าย→ขวา', 0, 100, '')}
      ${range('y', 'ตำแหน่งบน→ล่าง', 0, 100, '')}
      <div class="row"><span class="lb">ขอบเขตภาพ</span>${seg('area', [['card', 'ทั้งการ์ด'], ['body', 'ใต้แถบสถานะลงไป']], b.area)}</div>
      <div class="row"><span class="lb">สีเส้นภาพ · ธีมกระดาษ</span>${seg('tint.a', TINT.a.map(([k, t, h]) => [k, t, h]), b.tint.a)}</div>
      <div class="row"><span class="lb">สีเส้นภาพ · ธีมลายรดน้ำ</span>${seg('tint.b', TINT.b.map(([k, t, h]) => [k, t, h]), b.tint.b)}</div>`;
  }
  const at = (path) => path.split('.').reduce((o, k) => o[k], cfg);
  const setAt = (path, v) => { const ks = path.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], cfg)[last] = v; };

  function panel() {
    const r = cfg.result;
    let body;
    if (ui.part === 'birth') {
      const ids = Object.keys(D.birth);
      body = `<h2>ส่วน 1 · พื้นหลังแรกเกิด</h2>
        <p class="hint">ภาพ birth_* เดิมตัดพื้นรักดำ+กรอบออก เส้นสีตามธีม (ข้อ 87) · ใช้ทั้ง "แรกเกิด" และ "รับช่วงชีวิต" · ภาพในภาพแชร์คงแผ่นเดิม</p>
        <div class="row"><span class="lb">ภาพตามฐานะ</span><div class="seg">${ids.map((id) => `<button type="button" data-birth="${id}" class="${id === ui.birth ? 'on' : ''}">${['จน', 'กลาง', 'รวย'][TIER[id]]}</button>`).join('')}</div><p class="hint">${esc(D.birth[ui.birth].label)}</p></div>
        <div class="row"><span class="lb">ข้อความการ์ด</span><div class="seg"><button type="button" id="heir0" class="${ui.heir ? '' : 'on'}">แรกเกิด</button>${C.intro.heir.length ? `<button type="button" id="heir1" class="${ui.heir ? 'on' : ''}">รับช่วงชีวิต (ทายาท)</button>` : ''}<button type="button" id="nextS">ตัวอย่างถัดไป</button></div></div>
        ${bgCtl(cfg.birth, 'birth')}`;
    } else {
      body = `<h2>ส่วน 2 · ภาพการ์ดผล</h2>
        <p class="hint">ทุกการ์ดผลได้ภาพตามหมวด (ข้อ 81 82) · ภาพวาดด้วยโค้ดในกรอบเดียวกับภาพยุค (ข้อ 84) · จับหมวดจากข้อมูลการ์ด ไม่อ่านคำในข้อความ (ข้อ 83) · ทิศผลนับเฉพาะค่าที่ไม่ซ่อน (ข้อ 90)</p>
        <div class="row"><span class="lb">วางภาพ</span><div class="seg"><button type="button" data-k="result.mode" data-v="sm" class="${r.mode === 'sm' ? 'on' : ''}">ภาพเล็กกลางบน (มีกรอบ)</button><button type="button" data-k="result.mode" data-v="bg" class="${r.mode === 'bg' ? 'on' : ''}">พื้นหลังจาง (แบบแรกเกิด)</button></div></div>
        ${r.mode === 'sm' ? `<div class="row"><span class="lb">กว้างสุด <output id="o-result-w">${r.w}</output>px</span><input type="range" data-r="result.w" min="100" max="240" value="${r.w}"></div>` : bgCtl(r.bg, 'result.bg')}
        <div class="row"><span class="lb">ตัวอย่างข้อความ</span><div class="seg"><button type="button" id="nextS">ตัวอย่างถัดไป</button></div></div>
        <h2>หมวด (ร่างของเลน)</h2>${catTable()}`;
    }
    $('ctl').innerHTML = `<h1>ภาพบนการ์ด</h1>
      <p class="hint">เจ้าของ: "ภาพแรกเกิด ขยายให้ใหญ่กว่านี้ ทำเป็นภาพจางๆหลังข้อความ" + "กรณีนี้ไม่มีตัวเลือก ให้มีภาพประกอบ" · ปรับทั้งสองส่วน แล้วกด <b>คัดลอกค่า</b> วางตอบในแชท (ใบ 59) · JSON ก้อนเดียวครอบสองส่วน</p>
      ${body}
      <h2>วัดบนจอ</h2><div id="cr"></div>
      <h2>คัดลอก</h2><div class="row"><span class="lb">หมายเหตุถึงผู้พัฒนา</span><textarea id="note" rows="3">${esc(note)}</textarea></div>
      <div class="btns"><button type="button" class="pri" id="copy">คัดลอกค่า</button><button type="button" id="reset">ค่าเริ่มของส่วนนี้</button></div><p id="msg"></p>
      <textarea id="out" rows="12" readonly aria-label="ข้อความที่จะคัดลอก"></textarea>`;
    document.querySelectorAll('[data-birth]').forEach((b) => b.onclick = () => { ui.birth = b.dataset.birth; ui.pick = 0; panel(); draw(); });
    if ($('heir0')) $('heir0').onclick = () => { ui.heir = false; ui.pick = 0; panel(); draw(); };
    if ($('heir1')) $('heir1').onclick = () => { ui.heir = true; ui.pick = 0; panel(); draw(); };
    $('nextS').onclick = () => { ui.pick++; draw(); };
    document.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
      const p = b.dataset.k;
      if (p.endsWith('.preset')) Object.assign(at(p.slice(0, -7)), { preset: b.dataset.v }, PRESET[b.dataset.v][1]);
      else setAt(p, b.dataset.v);
      panel(); draw();
    });
    document.querySelectorAll('[data-r]').forEach((i) => {
      i.oninput = () => { $(`o-${i.dataset.r.replace(/\./g, '-')}`).textContent = i.value; };
      i.onchange = () => { setAt(i.dataset.r, +i.value); draw(); };
    });
    document.querySelectorAll('[data-cat]').forEach((c) => c.onchange = () => {
      const k = c.dataset.cat;
      r.off = c.checked ? r.off.filter((x) => x !== k) : [...r.off, k];
      panel(); draw();
    });
    document.querySelectorAll('[data-show]').forEach((b) => b.onclick = () => { ui.cat = b.dataset.show; ui.mode = 'one'; ui.pick = 0; draw(); });
    $('reset').onclick = () => { cfg[ui.part] = clone(DEF[ui.part]); panel(); draw(); };
    $('note').oninput = (e) => { note = e.target.value; $('out').value = output(); store(); };
    $('copy').onclick = async () => {
      const o = $('out');
      try { await navigator.clipboard.writeText(o.value); } catch (e) { o.select(); document.execCommand('copy'); }
      $('msg').textContent = 'คัดลอกแล้ว — วางตอบในแชทได้เลย';
    };
  }

  document.querySelectorAll('#part button').forEach((b) => b.onclick = () => { ui.part = b.dataset.p; ui.pick = 0; panel(); draw(); });
  document.querySelectorAll('#mode button').forEach((b) => b.onclick = () => { ui.mode = b.dataset.m; draw(); });
  document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { ui.theme = b.dataset.t; draw(); });
  addEventListener('resize', () => frames.querySelectorAll('iframe').forEach((f) => fit(f, parseInt(f.style.width, 10) || 390)));
  panel();
  draw();
})();
</script>
</body>
</html>
