// mulberry32: เล็ก เร็ว และให้ลำดับเดิมทุกครั้งเมื่อ seed เท่ากัน (แทน Math.random ที่ตั้ง seed ไม่ได้)
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

function mixSeed(seed, i) {
  return (Math.imul(seed >>> 0, 1000003) + Math.imul(i + 1, 2654435761)) >>> 0;
}

// ข้อมูลยุคในรูปที่แกนเกมใช้ (สร้างจาก data/*.json โดย src/node/load.mjs) — ฟังก์ชันล้วน ไม่แตะ DOM/ไฟล์
const MAX_AGE = 120;

const at = (series, year) => series.v[Math.max(0, Math.min(series.v.length - 1, year - series.from))];

function pickBirthYear(rng, era) {
  const w = era.births.w;
  let r = rng.next() * w.reduce((s, x) => s + x, 0);
  for (let i = 0; i < w.length; i++) {
    r -= w[i];
    if (r < 0) return era.births.from + i;
  }
  return era.births.from + w.length - 1;
}

// Brass logit: Y(x) = alpha + beta·Ys(x) — ปรับรูปเส้นการตายของตารางมาตรฐานด้วย 2 ค่า
const logit = (l) => 0.5 * Math.log((1 - l) / l);
function brassLx(stdLx, alpha, beta) {
  return stdLx.map((l, x) => (x === 0 ? 1 : l <= 0 ? 0 : 1 / (1 + Math.exp(2 * (alpha + beta * logit(l))))));
}

// อายุคาดเมื่อแรกเกิดแบบเดียวกับที่ World Bank รายงาน (ปีแรกอยู่รอดเฉลี่ยไม่ถึงครึ่งปี)
function e0FromLx(lx) {
  const q0 = 1 - lx[1];
  const a0 = q0 >= 0.1 ? 0.33 : 0.05 + 3 * q0;
  let e = lx[1] + a0 * q0;
  for (let x = 1; x < lx.length - 1; x++) e += (lx[x] + lx[x + 1]) / 2;
  return e;
}

const qCache = new WeakMap();
// โอกาสตายภายในปีที่อายุ age ตามตารางชีพของปีปฏิทิน year (ชีวิตหนึ่งเดินผ่านตารางของแต่ละปีไปตามแนวทแยง)
function qx(era, sex, year, age) {
  if (age >= MAX_AGE) return 1;
  let bySex = qCache.get(era);
  if (!bySex) qCache.set(era, (bySex = {}));
  const m = era.mort;
  const y = Math.max(m.from, Math.min(m.from + m.fit[sex].a.length - 1, year));
  const key = `${sex}:${y}`;
  let q = bySex[key];
  if (!q) {
    const i = y - m.from;
    const lx = brassLx(m.std[sex], m.fit[sex].a[i], m.fit[sex].b[i]);
    q = lx.slice(0, -1).map((l, x) => (l > 0 ? 1 - lx[x + 1] / l : 1));
    bySex[key] = q;
  }
  return q[age];
}

// อายุตอนตายที่คาดได้จากข้อมูลล้วน (นับปีเต็มแบบเดียวกับการ์ด "ตายอายุ X") ใช้เป็นเป้าของ harness
function expectedDeathAge(era, sex, birthYear) {
  let alive = 1;
  let sum = 0;
  for (let a = 0; a < MAX_AGE; a++) {
    alive *= 1 - qx(era, sex, birthYear + a, a);
    sum += alive;
  }
  return sum;
}

const periodE0 = (era, sex, year) => at(era.mort.e0[sex], year);
const infantMortality = (era, sex, year) => at(era.mort.imr[sex], year);

// ปีหลังข้อมูลล่าสุด: เลือกค่าจริงจากอดีตด้วย hash ของ seed กับปี — ชีวิตเดิมได้อนาคตเดิม และไม่กินลำดับสุ่มของโลก
function inflationRate(era, seed, year) {
  const c = era.cpi;
  if (year < c.from + c.v.length) return at(c, year);
  const pool = c.v.slice(c.sampleFrom - c.from);
  let h = Math.imul((seed ^ Math.imul(year, 0x9e3779b1)) >>> 0, 0x85ebca6b) >>> 0;
  h ^= h >>> 13;
  return pool[(h >>> 0) % pool.length];
}

// ราคาของปี toYear เป็นกี่เท่าของปี fromYear
function priceRatio(era, seed, fromYear, toYear) {
  let r = 1;
  for (let y = fromYear + 1; y <= toYear; y++) r *= 1 + inflationRate(era, seed, y) / 100;
  return r;
}

// ค่าความชุกพฤติกรรม (%) ปีระหว่างจุดใช้เส้นตรง นอกช่วงใช้จุดที่ใกล้สุด
function habitRate(era, kind, sex, year) {
  const pts = era.habits[kind]?.[sex] ?? era.habits[kind]?.all;
  if (!pts) throw new Error(`ไม่มีข้อมูลพฤติกรรม ${kind}`);
  if (year <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    const [y1, v1] = pts[i];
    if (year <= y1) {
      const [y0, v0] = pts[i - 1];
      return v0 + ((v1 - v0) * (year - y0)) / (y1 - y0);
    }
  }
  return pts[pts.length - 1][1];
}

const eraEventsAt = (era, year) => era.events.filter((e) => year >= e.from && year <= e.to);



// ภาค/ฐานะ/ค่าเริ่มยังเป็นค่าคงที่ชั่วคราวของ tracer — ปีเกิดและการตายใช้ข้อมูลยุคจริงแล้ว (era.mjs)
const SEXES = ['ชาย', 'หญิง'];
const REGIONS = ['กลาง', 'เหนือ', 'ตะวันออกเฉียงเหนือ', 'ใต้', 'ตะวันออก', 'ตะวันตก'];
const CLASSES = ['ยากจน', 'ชนชั้นกลาง', 'ร่ำรวย'];
const CLASS_WEIGHTS = [0.4, 0.5, 0.1];
const START = {
  ยากจน: { health: 55, happiness: 50, knowledge: 30, relations: 60, money: 2000, income: 8000 },
  ชนชั้นกลาง: { health: 65, happiness: 55, knowledge: 45, relations: 60, money: 20000, income: 25000 },
  ร่ำรวย: { health: 75, happiness: 60, knowledge: 60, relations: 55, money: 500000, income: 60000 },
};
// ตารางกลางแปลงระดับ ±1/±2/±3 เป็นตัวเลข (ใบ 07) ปรับสมดุลที่จุดเดียว
const LEVEL_STEP = 6;
const STAT_KEYS = ['health', 'happiness', 'knowledge', 'relations'];

const clamp = (v) => Math.max(0, Math.min(100, v));

function weighted(rng, items, weights) {
  let r = rng.next() * weights.reduce((s, w) => s + w, 0);
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r < 0) return items[i];
  }
  return items[items.length - 1];
}

function newLife(seed, content) {
  const rng = makeRng(seed);
  const cls = weighted(rng, CLASSES, CLASS_WEIGHTS);
  const s = START[cls];
  return {
    rng,
    seed,
    content,
    birthYear: pickBirthYear(rng, content.era),
    sex: rng.pick(SEXES),
    region: rng.pick(REGIONS),
    cls,
    age: 0,
    health: s.health,
    happiness: s.happiness,
    knowledge: s.knowledge,
    relations: s.relations,
    money: s.money,
    income: s.income,
    done: {},
    dead: false,
    pending: null,
    started: false,
    log: [],
  };
}

// โอกาสตายภายในปีนี้ = ตารางชีพจริงของปีปฏิทินนั้นตามอายุ/เพศ × ตัวคูณจากสุขภาพ (ใบ 03)
function deathChance(st) {
  const base = qx(st.content.era, st.sex, st.birthYear + st.age, st.age);
  const mult = 1 + Math.max(0, 50 - st.health) / 40 - Math.max(0, st.health - 50) / 200;
  return Math.min(1, base * mult);
}

function fill(text, st) {
  return text
    .replaceAll('{อายุ}', st.age)
    .replaceAll('{ปี}', st.birthYear + st.age)
    .replaceAll('{ภาค}', st.region)
    .replaceAll('{เงิน}', Math.round(st.money).toLocaleString('en-US'));
}

function applyEffects(st, fx = {}) {
  for (const k of STAT_KEYS) if (fx[k]) st[k] = clamp(st[k] + fx[k] * LEVEL_STEP);
  if (fx.money) st.money += fx.money;
}

// เดินปีละครั้งจนเจอหลักไมล์ถึงกำหนดหรือตาย คืนการ์ดใบถัดไป
function nextCard(st) {
  if (st.pending) throw new Error('ยังมีการ์ดที่รอเลือก');
  if (st.dead) return deathCard(st);
  for (;;) {
    if (st.started) {
      // สุ่มตายของปีที่อายุ st.age ก่อนขึ้นปีใหม่ — ทารกจึงตายได้ตั้งแต่ขวบปีแรกตามอัตราตายทารกจริง และอายุบนการ์ดตายเป็นปีเต็ม
      if (st.health <= 0 || st.rng.next() < deathChance(st)) {
        st.dead = true;
        return deathCard(st);
      }
      st.age += 1;
      // ธรรมชาติ: สุขภาพไหลลงตามอายุ ความสัมพันธ์จางลง
      if (st.age > 30) st.health = clamp(st.health - 0.4);
      st.relations = clamp(st.relations - 0.3);
      if (st.age >= 22 && st.age < 60) st.money += st.income;
    }
    st.started = true;
    const ev = st.content.events.find((e) => e.age === st.age && !st.done[e.id]);
    if (ev) {
      st.done[ev.id] = true;
      st.pending = ev;
      return {
        kind: 'event',
        id: ev.id,
        age: st.age,
        text: fill(ev.text, st),
        choices: ev.choices.map((c) => fill(c.text, st)),
      };
    }
  }
}

function choose(st, idx) {
  const ev = st.pending;
  if (!ev || !ev.choices[idx]) throw new Error('ตัวเลือกไม่ถูกต้อง');
  st.pending = null;
  applyEffects(st, ev.choices[idx].effects);
  st.log.push({ id: ev.id, age: st.age, choice: idx });
}

function deathCard(st) {
  const year = st.birthYear + st.age;
  const era = st.content.era;
  const card = {
    kind: 'death',
    age: st.age,
    text: `ตายอายุ ${st.age}`,
    summary: {
      year,
      money: Math.round(st.money),
      moneyAtBirth: Math.round(st.money / priceRatio(era, st.seed, st.birthYear, year)),
    },
  };
  // ใบ 07: ตายตอนเด็กได้บันทึกสั้นบอกสถิติยุคนั้น
  if (st.age < 5) {
    const imr = infantMortality(era, st.sex, st.birthYear);
    card.note = `ปี ${st.birthYear} ทารก${st.sex}ไทยตายก่อนอายุ 1 ขวบ ราว ${Math.round(imr)} คนในทุก 1,000 คน`;
  }
  return card;
}

function profileText(st) {
  return `เกิดปี ${st.birthYear} · ${st.sex} · ภาค${st.region} · ฐานะ${st.cls}`;
}

function statsOf(st) {
  return { health: st.health, happiness: st.happiness, knowledge: st.knowledge, relations: st.relations, money: st.money };
}

// harness วิ่งชีวิตผ่านฟังก์ชันชุดเดียวกับหน้าเว็บ ผู้เรียกส่งแค่ตัวเลือกเลือกตัวเลือก
// stream ของบอทแยกจาก rng ของแกนเกม เพื่อไม่ให้การเลือกไปเปลี่ยนลำดับสุ่มของโลก
function playLife(seed, content, pickChoice) {
  const st = newLife(seed, content);
  const bot = makeRng(seed ^ 0x5bd1e995);
  for (;;) {
    const card = nextCard(st);
    if (card.kind === 'death') return { age: card.age, state: st };
    choose(st, pickChoice(card, bot));
  }
}

const root = document.getElementById('app');
let st;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bar(label, v) {
  const row = el('div', 'bar');
  row.append(el('span', 'lbl', label));
  const track = el('div', 'track');
  const fill = el('div', 'fill');
  fill.style.width = `${Math.round(v)}%`;
  track.append(fill);
  row.append(track);
  return row;
}

function render(card) {
  root.replaceChildren();
  const s = statsOf(st);
  const head = el('div', 'head');
  head.append(el('div', 'profile', profileText(st)));
  head.append(bar('สุขภาพ', s.health), bar('ความสุข', s.happiness), bar('ความรู้', s.knowledge), bar('ความสัมพันธ์', s.relations));
  head.append(el('div', 'money', `เงิน ${Math.round(s.money).toLocaleString('en-US')} บาท`));
  root.append(head);

  const box = el('div', 'card');
  box.append(el('p', card.kind === 'death' ? 'text death' : 'text', card.text));
  if (card.kind === 'event') {
    card.choices.forEach((c, i) => {
      const b = el('button', 'choice', c);
      b.onclick = () => {
        choose(st, i);
        render(nextCard(st));
      };
      box.append(b);
    });
  } else {
    box.append(el('p', 'sub', `ปี ${card.summary.year} · เงินคงเหลือ ${card.summary.money.toLocaleString('en-US')} บาท`));
    box.append(el('p', 'sub', `≈ ${card.summary.moneyAtBirth.toLocaleString('en-US')} บาท ค่าเงินปีเกิด`));
    if (card.note) box.append(el('p', 'sub', card.note));
    const b = el('button', 'choice', 'เกิดใหม่');
    b.onclick = start;
    box.append(b);
  }
  root.append(box);
}

function start() {
  // seed จากเวลาเฉพาะฝั่งหน้าเว็บ แกนเกมเองไม่แตะนาฬิกา
  st = newLife((Date.now() ^ (performance.now() * 1000)) >>> 0, CONTENT);
  render(nextCard(st));
}

start();

})();
</script>
