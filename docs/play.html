@font-face { font-family:"Maitree"; font-weight:600; font-style:normal; font-display:swap; src:url(fonts/Maitree-SemiBold.woff2) format('woff2'); }
/* สีมาจากต้นแบบการ์ด (ใบ 06) — ทาง A ทะเบียนราษฎร์ · ทาง B ลายรดน้ำ · ไม่สลับตามโหมดมืดเพราะสีเป็นตัวบอกแนวการ์ด */
/* ui-redo ใบ 105 ลง T1 (ข้อ 209–211 · 215–217): ชุดคราม — หมึก = ปุ่มหลัก = หัวเว็บ #1B2A4A · หัว Maitree เนื้อ Sarabun · มุม 6 (การ์ด 8) · เงาทองเฉพาะการ์ดในเกม
   · --red = ชาด เหลือแค่ตรา/ขีดฆ่า (ข้อ 215) · --line-strong = ขอบที่บอกว่ากดได้ (--rule เป็นเส้นประดับ ต่ำกว่า 3:1)
   · การ์ด B + ภาพแชร์ · ต่างโลก · ระหว่างชาติ/ปรโลก คงสีเดิมจนใบ 121 (ข้อ 228 ชุด ก) · แถบค่า --fl รอ T6
   · การ์ดกว้างสุด 800 · ขอบรอบการ์ด 36 บนล่าง 32 ข้าง ค่าเดียวทุกจอ (ต้นแบบ tweak.html) */
:root {
  --page:#F4ECDC; --ink:#1B2A4A; --ink2:color-mix(in srgb, #1B2A4A 70%, #5B5648); --muted:#5B5648;
  --paper:#FBF6EA; --paper2:color-mix(in srgb, #FBF6EA 45%, #F4ECDC); --rule:#C9B98F; --rule2:color-mix(in srgb, #C9B98F 60%, #FBF6EA); --line-strong:#8C7A52;
  --red:#A62B1F; --green:#2F6B4F; --blue:#7A5C12; --head:#1B2A4A;
  --lacquer:#17110D; --lacquer2:#221912; --gold:#D9B45A; --gold2:#F0D78C; --cream:#EFE3C2; --bronze:#5A4630; --bronze2:#8A6D3B; --sand:#BFAE86;
  --fl:#015EC1; --dg:#B3261E; --track:#E2D9C6;
  --ft:Sarabun,system-ui,sans-serif; --fh:Maitree,serif;
  --r:6px; --rk:8px; --rc:999px; --sh:0 1px 0 var(--gold), 0 6px 18px color-mix(in srgb, var(--ink) 10%, transparent);
  --cw:800px; --pad-y:36px; --pad-x:32px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.6 var(--ft); }
/* viewport-fit=cover ให้ env(safe-area-inset-*) มีค่า แต่หน้าก็ลามใต้รอยบาก/แถบโฮม — ทุกขอบที่ติดจอต้องกันเอง */
.logo { background:var(--head); text-align:center; padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); border-bottom:1px solid var(--bronze); }
.logo b { font-family:Srisakdi,serif; font-weight:700; font-size:34px; line-height:1.2; color:var(--gold); }
.logo b span { display:inline-block; }
.logo small { display:block; font-size:12px; letter-spacing:0.12em; color:color-mix(in srgb, var(--cream) 85%, var(--head)); }
.logo .ver { text-decoration:none; display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid var(--bronze); border-radius:999px; font-size:12px; font-weight:600; color:var(--sand); white-space:nowrap; }
.logo a.ver:hover, .logo a.ver:focus-visible { text-decoration:underline; outline:none; }
.logo .saved { display:inline-block; margin:4px 0 0 6px; font-size:11px; color:var(--sand); white-space:nowrap; }
.logo .saved:not(:empty)::before { content:'\25CF  '; color:#7FC4B8; }
.logo .saved.off::before { color:#E07A5F; }
#app { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:var(--pad-y) max(var(--pad-x), env(safe-area-inset-right)) var(--pad-y) max(var(--pad-x), env(safe-area-inset-left)); }
/* ป้ายเกมไม่ใช่คำแนะนำการลงทุน (ใบ 11) อยู่ทุกหน้าจอ ไม่ใช่แค่การ์ดจัดสรรเงิน */
.foot { max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(var(--pad-x), env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(var(--pad-x), env(safe-area-inset-left)); font-size:12px; color:var(--muted); text-align:center; }
.foot a { color:var(--muted); display:inline-block; min-height:44px; line-height:44px; }
/* ปุ่มอยู่ท้ายการ์ด (margin-top:auto) — การ์ดสูงตายตัว 560 บนจอเตี้ยดันปุ่มของการ์ดเนื้อสั้นลงใต้แถบเบราว์เซอร์
   · เพดานตามความสูงจอหักหัวเว็บ+ระยะบน (--chrome) · svh = จอตอนแถบเบราว์เซอร์โผล่ ไม่ยืดหดตามการเลื่อนแบบ dvh ปุ่มจึงไม่กระโดดระหว่างเลื่อน */
:root { --chrome:136px; }
.card { display:flex; flex-direction:column; border-radius:var(--rk); box-shadow:var(--sh); min-height:560px; min-height:min(560px, calc(100vh - var(--chrome))); min-height:min(560px, calc(100svh - var(--chrome) - env(safe-area-inset-bottom))); }
/* ข้อความสำหรับโปรแกรมอ่านจอเท่านั้น */
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
/* จุดแดง "ใหม่" (B116): ชั้นสมุด · แท็บในชั้นสมุด · แผงฉายา/เหตุการณ์ — ป้ายอ่านจอบอกความหมายแทนสี */
.new-dot { display:inline-block; width:8px; height:8px; margin-left:6px; border-radius:50%; background:var(--blue); vertical-align:middle; flex:none; }
.new-tag { margin-left:6px; padding:0 5px; border:1px solid var(--blue); border-radius:3px; color:var(--blue); font-size:12px; font-weight:600; white-space:nowrap; }
/* .body/.choices ตั้ง display:flex ทับ hidden ของเบราว์เซอร์ — การ์ดที่พับไว้ (B117) ต้องหายจริง */
.card [hidden] { display:none !important; }
/* กล่องกระซิบ (B117): เส้นประ ตัวเอียง แยกจากเนื้อเรื่องของการ์ด · ปุ่มเป็นลิงก์เล็ก ไม่ปนกับตัวเลือกของเกม */
.whisper { margin-top:4px; padding:8px 12px; border:1px dashed var(--rule); border-radius:var(--r); background:#FBF7EE; display:flex; flex-direction:column; gap:4px; }
.whisper .h { font-size:12px; font-weight:600; color:var(--blue); }
.whisper p { font-family:var(--ft); font-size:14px; color:var(--ink2); }
.whisper-row { display:flex; flex-wrap:wrap; gap:0 16px; }
.whisper .more, .choices .later { all:unset; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:2px; }
.choices .later { align-self:flex-start; }
.whisper .more:focus-visible, .choices .later:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.choices.folded { margin-top:0; }
.choices.folded .note { margin:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; }
.top small { font-size:12px; letter-spacing:0.04em; text-align:right; }
/* รูปตัวละคร (B56): วงกลมมุมซ้ายหัวการ์ด · clip-path ตัดเสื้อที่ยื่นเลยวงกลม (ภาพแชร์ตัดด้วย arc แบบเดียวกัน) */
.av { flex:none; display:block; width:40px; height:40px; clip-path:circle(50%); }
/* หัวการ์ดแถวเดียวต้องสูงเท่าเดิม 55px (A13): margin ติดลบให้รูปล้นเข้า padding แทนดันหัวให้สูง · gap ข้างรูปแคบกว่า gap หัวการ์ด ให้ตัวอายุมีที่ไม่ตกบรรทัด */
.top .av { width:32px; height:32px; margin:-3px -6px -3px 0; }
.top .av + b { flex:1; min-width:0; }
.grow { display:flex; align-items:center; gap:10px; font-weight:600; }
.grow .av { width:56px; height:56px; }
/* แผ่นภาพยุค: รักดำ+ทองทุกธีม (สีอยู่ในตัวภาพ) — ธีมสว่างจึงเป็นแผ่นเข้มบนพื้นขาวเหมือนกรอบภาพ */
.era-art { display:block; width:100%; height:auto; aspect-ratio:5 / 2; }
/* ภาพฉากบนการ์ดแรกเกิด/การ์ดตาย: เล็กพอให้ปุ่มไปต่ออยู่จอแรก */
.era-art.scene-sm { width:min(100%, 150px); margin:0 auto 6px; }
.same { margin-left:8px; padding:1px 6px; border:1px solid currentColor; border-radius:var(--rc); font:400 11px/1.4 var(--ft); white-space:nowrap; opacity:0.85; vertical-align:2px; }
.bar { position:relative; height:6px; }
.bar i { position:absolute; left:0; top:0; display:block; height:6px; }
.bar b { position:absolute; top:-3px; width:2px; height:12px; margin-left:-1px; }
/* แถบสถานะสองแถว (ui-redo ใบ 03): แถวบน อวตาร · ชื่อ+ที่ · อายุ · แถวล่าง ค่า 4 ตัว
   · ชื่อค่ายาวบนจอแคบให้ตัวเลขตกบรรทัดแทนตัดชื่อ — แถบชิดล่างทุกช่องจึงยังอยู่แนวเดียวกัน */
.sb { padding:12px 20px; border-bottom:1px solid var(--rule2); border-radius:var(--rk) var(--rk) 0 0; }
.sb-r1 { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sb .av { width:36px; height:36px; }
.sb-who { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.sb-who b { font-family:var(--fh); font-weight:600; overflow-wrap:anywhere; }
.sb-who small { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
/* ป้ายพักแทนบรรทัดจังหวัด: บรรทัดเดียวเสมอ แถวไม่สูงขึ้น */
.sb-who small.rest { color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* หัวการ์ด (ui-redo ข้อ 161–162): แถวอาชีพเข้มกว่าบรรทัดจังหวัด · แถวฐานะ/เงินสดใต้ชื่อ ไม่มีเกจ · เงินสดชิดขวา */
.sb-who small.hd-job { color:var(--ink); font-weight:600; }
.i .sb-who small.hd-job { color:#E8ECFF; }
.hd-row { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; margin:-2px 0 10px; font-size:12px; min-width:0; }
.hd-word { font-weight:600; white-space:nowrap; }
.hd-cash { margin-left:auto; display:flex; align-items:baseline; gap:4px; white-space:nowrap; }
.hd-cash b { font-size:14px; font-variant-numeric:tabular-nums; }
/* ติดลบ/มีกู้ (ข้อ 235): ตัวเลขสีหมึก คำกำกับแดงอย่างเดียว ไม่มีกรอบ */
.hd-cash .lw { color:var(--dg); }
.hd-cash .lw { font-size:12px; font-weight:600; }
.sb-age { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.sb-age > b { font-size:18px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.sb-age small { font-size:12px; }
.sb-age .same { margin-left:4px; }
/* คอลัมน์ขวา (ข้อ 233): อายุบน ฐานะ + เงินสดใต้ ชิดขวา กว้างไม่เกินครึ่งแถว ชื่อ/ที่ยังมีที่ */
.sb-right { flex:none; max-width:48%; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.sb-right .hd-row { margin:0; justify-content:flex-end; row-gap:0; text-align:right; }
.sb-right .hd-cash { margin-left:0; }
.sb-heart svg { display:block; width:18px; height:18px; fill:var(--dg); }
.sb-m { list-style:none; margin:0; padding:0; display:flex; gap:10px; }
.sb-m li { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:3px; }
.mh { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:3px; }
.mk { font-size:11px; line-height:1.3; color:var(--muted); }
.mh .mk svg { width:1em; height:1em; margin-right:1px; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
/* แถบสถานะ (ข้อ 234): ไอคอน 125% เส้น 1.6 สีหมึก · ต่างโลกและช่องใกล้ตายใช้สีของแถว · แถบต่อท้ายเลขบรรทัดเดียว (เตี้ยลง) · แผงตัวฉันคงแบบเดิม */
.sb-m .mk svg { width:1.25em; height:1.25em; stroke-width:1.6; color:var(--ink); }
.i .sb-m .mk svg, .sb-m .low .mk svg { color:inherit; }
.sb-m li { flex-direction:row; align-items:center; gap:6px; }
.sb-m .mh { flex:none; flex-wrap:nowrap; }
.sb-m .br { flex:1 1 auto; min-width:24px; margin-top:0; }
/* จอมือถือช่องค่าเหลือ 56–64px ไอคอน+ชื่อ+เลขไม่พอบรรทัดเดียว (เลขตก ชื่อยาวหักคำ) ⇒ 2×2 แบบพาแนลซ้ายจอคอม · การ์ดกว้างเต็ม 460 ที่จอ >520 4 ช่องพอ */
@media (max-width: 520px) {
  .sb-m { flex-wrap:wrap; gap:6px 10px; }
  .sb-m li { flex:1 1 calc(50% - 10px); }
}
.mh .num { margin-left:auto; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.mh em { font-style:normal; font-size:10px; font-weight:600; color:var(--fl); white-space:nowrap; }
.mh em.dn { color:var(--dg); }
.br { display:block; height:6px; margin-top:auto; border-radius:var(--rc); background:var(--track); overflow:hidden; }
.br i { display:block; height:100%; border-radius:inherit; background:var(--fl); }
.sb-m .low .mk, .sb-m .low .num { color:var(--dg); }
.sb-m .low .br i { background:var(--dg); }
/* ใกล้ตาย: ขอบจอแดงทั้งจอ ผูกกับแถบสถานะด้วย :has จึงหายเองเมื่อการ์ดถัดไปไม่ใกล้ตาย · ไม่มีภาพเคลื่อนไหว */
body:has(.sb.dying)::after { content:''; position:fixed; inset:0; z-index:9; pointer-events:none; box-shadow:inset 0 0 0 3px var(--dg), inset 0 0 60px rgb(220 40 30 / .5); }
/* ตัวเลขในสรุปช่วงวัย: ต้นช่วง → ตอนนี้ คู่กับลูกศรทิศ */
.delta .num { font-weight:600; font-variant-numeric:tabular-nums; }
.meta { padding:0 20px 8px; font-size:12px; }
.meta span { white-space:nowrap; }
.tree { padding:0 20px 8px; font-size:12px; }
.tree summary { cursor:pointer; }
.tree .picks { font-size:12px; }
/* ปุ่มโฟกัสชีวิต (B163): ชื่อโฟกัสกับทิศผลตัดบรรทัดได้ ป้าย "เปลี่ยน" ชิดขวาไม่ตกบรรทัด */
.focus { padding:0 20px 8px; font-size:12px; }
.focus button { all:unset; box-sizing:border-box; width:100%; min-height:44px; display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:6px 10px; border:1px solid color-mix(in srgb, currentColor 35%, transparent); border-radius:var(--r); cursor:pointer; overflow-wrap:anywhere; }
.focus button:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
.focus-btn b { font-size:14px; }
.focus-k { font-weight:600; opacity:0.8; }
.focus-fx { opacity:0.8; }
.focus-go { margin-left:auto; text-decoration:underline; text-underline-offset:2px; white-space:nowrap; }
.focus-pick { display:flex; flex-direction:column; gap:4px; margin-top:4px; }
.focus-pick[hidden] { display:none; }
.focus-pick .on { border-style:solid; border-color:currentColor; font-weight:600; }
/* แถบเมนูล่าง (ui-redo ใบ 04): ติดขอบล่างจอ กว้างเท่าการ์ด · หน้าเว้นท้ายเท่าความสูงแถบ ท้ายการ์ดจึงไม่ถูกบัง */
:root { --nav-h:60px; }
body:has(.mnav) { padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); }
.mnav { position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; max-width:calc(var(--cw) + 2 * var(--pad-x)); margin:0 auto; padding:0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); background:var(--paper); border-top:1px solid var(--rule2); box-shadow:0 -4px 16px rgb(0 0 0 / .06); }
.mnav button { all:unset; box-sizing:border-box; flex:1 1 0; min-width:0; min-height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px 2px; font-size:13px; font-weight:600; color:var(--ink); text-align:center; cursor:pointer; }
.mnav button[aria-expanded="true"] { color:var(--fl); box-shadow:inset 0 3px 0 var(--fl); }
/* แท็บที่เลือกเป็นคราม เฉพาะจอชาติไทย (ข้อ 223: token ไทยห้ามขึ้นจอโลกอื่น) */
body:has(#app > .card.a) .mnav button[aria-expanded="true"] { color:var(--ink); box-shadow:inset 0 3px 0 var(--ink); }
.mnav button:focus-visible { outline:2px solid currentColor; outline-offset:-4px; }
/* จุดของใหม่ (ใบ 05) มุมขวาบนของคำ ไม่ดันป้ายปุ่มให้เบี้ยว · ฉากที่มีเมนู ลิงก์ท้ายหน้าทั้งชุดย้ายเข้าปุ่มสมุดกับแผงเพิ่มเติม (ใบ 08) ท้ายหน้าจึงซ่อน */

/* แถบภาพย่อภาพบ้านเมือง (ui-redo ใบ 41): ช่องตัดแถวตามความกว้าง ความสูงตามเนื้อ · พื้นรักเหมือนภาพหัวแท็บอื่น */

/* สมุดชีวิต (B48) — หน้าก่อน/ข้ามกว้างเท่ากันใต้ปุ่มพลิกหน้า · ตัวเลือกที่กดเป็นตัวหนังสือเอียงแยกจากเนื้อเรื่อง */

/* ทาง A — ทะเบียนราษฎร์: กระดาษ หมึก ตราประทับแดง */

.spark .sg { stroke-width:2.2; stroke-linecap:round; } .spark .sg.sd { stroke-dasharray:5 3; } .spark .sg.se { stroke-width:1.6; }

/* คำอธิบายสกิลใต้ชื่อปุ่ม (06s: จอเลือกพก · การ์ดฝึกสกิล · เลือกลงสมุด) · ปุ่มเลือกพกที่กดไว้มีแถบซ้าย */

.d-bg { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; color:#000000; }

.ivow { display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1px solid #F2C94C; border-radius:6px; background:#0E1024; }

.ivow blockquote { margin:0; font-family:var(--ft); color:#E8ECFF; }

/* การ์ดชวนไปต่างโลก (B68d) — กรอบสีต่างโลกโผล่กลางการ์ดชีวิต · ทั้งใบยังเป็นของโลกนี้เพราะยังไม่ได้รับ */
.ix { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid #3B4BA8; border-radius:8px; background:radial-gradient(120% 100% at 50% 0%, #2A3480 0%, #161A3A 65%); box-shadow:inset 0 0 22px rgba(111,227,255,0.22); text-align:left; }

.ix-t { font-size:19px; line-height:1.5; color:#E8ECFF; }

/* เอฟเฟกต์ B-fx (ตัวเล่นใน app.mjs) — การ์ดใหม่: เส้นทองวาดทับขอบการ์ด ไม่รับคลิก · overflow:visible ให้เส้นครึ่งนอกขอบไม่ถูกตัด */
.fx-trace-on { position:relative; }
.fx-trace { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
.fx-ov { position:fixed; inset:0; z-index:50; pointer-events:none; }
.fx-ov.fx-out { opacity:0; transition:opacity .25s; }
.fx-veil { position:absolute; inset:0; background:var(--lacquer); opacity:0; }
.fx-lamp { position:absolute; left:50%; top:38%; margin:-60px 0 0 -60px; overflow:visible; }
.fx-cap { position:absolute; left:16px; right:16px; top:calc(38% + 76px); text-align:center; font-family:Pridi,serif; font-size:18px; color:var(--cream); opacity:0; }
.fx-cap small { display:block; font-family:Sarabun,sans-serif; font-size:13px; color:var(--sand); }
.fx-title { position:absolute; inset:0; display:grid; place-items:center; }
.fx-title svg { overflow:visible; max-width:92vw; height:auto; }
.fx-title .fx-name { font-family:Maitree,serif; font-weight:600; }
/* ทั้งหน้าเข้าธีมต่างโลกตามการ์ดที่ขึ้นจอ — ผูกกับการ์ดด้วย :has จึงไม่ต้องตามล้างธงทุกจุดที่วาดจอไทย */
/* ui-redo ใบ 13: ชุดกรมท่าเรืองของต้นแบบลงตัวแปรหน้า — แถบสถานะ เมนูล่าง/ราวซ้าย และแผงจากเมนูเปลี่ยนสีตามโดยไม่มีกฎแยก */
body:has(#app > .card.i) { --page:#0B0D20; --muted:#A6AEDB; --ink:#E8ECFF; --ink2:#D3D8F5; --paper:#161A3A; --paper2:#232A5E; --rule2:#3B4BA8; --fl:#6FE3FF; --dg:#FF8A8A; --track:#262C5A; }
body:has(#app > .card.i) .logo { background:#0E1024; border-bottom-color:#3B4BA8; }

body:has(#app > .card.i) .logo small, body:has(#app > .card.i) .logo .ver, body:has(#app > .card.i) .logo .saved { color:#A6AEDB; }

/* ui-redo ใบ 15: ปรโลกชุดดำทองของต้นแบบ (ค่าที่เจ้าของไม่ได้ปรับ) — การ์ดลายรดน้ำเดิม หน้า แถบ 4 ค่า เมนู และแผงเข้าชุดเดียวกัน */
body:has(#app > .card.af) { --page:#0E0A08; --muted:#BFAE86; --ink:#EFE3C2; --ink2:#E3D6B3; --paper:#17110D; --paper2:#2A2018; --rule2:#5A4630; --fl:#D9B45A; --dg:#FF8A7A; --track:#2A2018; }
body:has(#app > .card.af) .logo { background:#120D0A; }
body:has(#app > .card.af) .logo b { color:var(--gold); }
body:has(#app > .card.af) .logo small, body:has(#app > .card.af) .logo .ver, body:has(#app > .card.af) .logo .saved { color:var(--sand); }
body:has(#app > .card.af) .foot a { color:var(--ink2); }
.af .sb { background:#120D0A; }
/* แถบโฟกัสต่างโลก (05a): โครง .focus ของโลกหลัก สีชุดต่างโลก · ทางที่ทำอยู่เด่นสีทอง ไม่จางแบบตัวเลือกล็อก */
.ifocusbar { padding:8px 20px 0; }
.ifocusbar button { border-color:#2A3478; background:#0E1024; color:#E8ECFF; }
.ifocusbar button:hover, .ifocusbar button:focus-visible { border-color:#6FE3FF; background:#1E2350; }
.ifocusbar .focus-fx, .ifocusbar .focus-go { color:#6FE3FF; opacity:1; }
.ifocusbar .focus-pick .on { border-color:#F2C94C; background:#1E2350; }

/* จดหมายเหตุบนการ์ดจบ — ป้ายอายุทอง เส้นซ้ายบอกชนิดบรรทัดแบบต้นแบบ · ช่วงวัยพับได้ ชีวิตยาวราวร้อยบรรทัดจึงไม่ดันปุ่มลงไปไกล */
.ichron .istage { margin-top:6px; }
.ichron .istage > summary { cursor:pointer; font-size:13px; color:#6FE3FF; }
.ilog { list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:13px; color:#D3D8F5; }
.ilog li { border-left:2px solid #2A3478; padding-left:8px; overflow-wrap:anywhere; }
.ilog li.event { border-left-color:#B48CFF; }
.ilog li.lore { border-left-color:#F2C94C; color:#F2C94C; }
.ilog b { margin-right:6px; color:#F2C94C; font-weight:600; }
.ilog small { display:inline-block; margin-left:6px; padding:0 6px; border:1px solid currentColor; border-radius:999px; font-size:11px; }
.ilog small.up { color:#5EE6A0; } .ilog small.down { color:#FF8A8A; }
/* ตัวเลือกที่ล็อก: ประกาศหลังกฎ hover ของทั้งสองทาง ความเจาะจงเท่ากันจึงชนะ — ชี้แล้วไม่กลับสีเหมือนกดได้ */
.a .choice:disabled, .b .choice:disabled, .i .choice:disabled { opacity:0.45; cursor:not-allowed; background:transparent; color:inherit; border-style:dashed; }
/* พาแนลการ์ด (B131): จอตั้งไม่มีพาแนล — ตัวห่อหายไปจากเลย์เอาต์ ลูกเรียงในการ์ดแบบเดิม */
.p-left, .p-mid { display:contents; }
.p-side { display:none; }
/* จอแนวนอนเตี้ย (มือถือหมุนจอ · B131 แบบ C2 ที่เจ้าของเคาะ) — แท็บเล็ต 768 สูงพอ ไม่เข้าเงื่อนไข หน้าตาเดิม
   · ซ้าย = หัวการ์ด ค่าสถานะ แผง · กลาง = เรื่องต่อด้วยปุ่ม · ขวา = สมุด/ฉายา (ติดจอ)
   · หัวเว็บย่อเป็นแถบบาง ชื่อเกมบรรทัดเดียว — จอสูง ~390 หัวเว็บเต็มกินเกือบครึ่งจอ */
@media (orientation: landscape) and (max-height: 540px) {
  .logo { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:0 10px; padding:calc(4px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 4px max(16px, env(safe-area-inset-left)); }

  .logo .ver, .logo .saved { margin-top:0; }

  #app { padding-top:8px; }
  .card:not(.pn) { max-width:var(--cw); margin:0 auto; }
  .card.pn { display:grid; grid-template-columns:minmax(0, 0.9fr) minmax(0, 1.35fr) minmax(0, 0.75fr); align-items:start; min-height:0; }
  .card.pn2 { grid-template-columns:minmax(0, 0.9fr) minmax(0, 1.35fr); }
  .p-left, .p-mid { display:flex; flex-direction:column; min-width:0; }

  .p-side { grid-column:3; grid-row:1; position:sticky; top:8px; margin:12px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; border:1px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius:6px; font-size:13px; }
  .p-side .h { font-weight:600; }
  .p-side .h ~ .h { margin-top:8px; }

  .p-side .kit { margin:0; display:grid; grid-template-columns:auto minmax(0, 1fr); gap:2px 8px; font-size:12px; }

  .p-side .more { all:unset; align-self:flex-start; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; }

  .p-mid .choice { min-height:44px; padding:6px 12px; font-size:14px; }

  .choice .fx span { white-space:normal; }
}
/* เลย์เอาต์คอม (ui-redo ใบ 09 · เจ้าของเคาะราวซ้าย + ลิ้นชัก): จอกว้างแถบเมนูล่างกลายเป็นราวซ้ายค้าง · แผงเปิดเป็นลิ้นชักขวาเต็มความสูง (จอกว้างมากเป็นแผงค้าง ใบ 67 ด้านล่าง)
   · มือถือแนวนอนเตี้ยใช้ราวแคบด้วย — แถบล่าง 60px กินหนึ่งในหกของจอสูง 360 · ราวกว้างเพิ่มตามรอยบากฝั่งซ้าย ป้ายปุ่มจึงไม่ถูกบีบ */
@media (min-width: 1024px), (orientation: landscape) and (max-height: 540px) {

  body:has(.mnav) { padding-bottom:0; padding-left:var(--rail-w); }

}
@media (orientation: landscape) and (max-height: 540px) {

/* ราว/แผงเริ่มใต้หัวเว็บ (ui-redo ใบ 67 · เจ้าของเลือกจากภาพ): หัวเว็บกว้างเต็มจอทับช่องราว · --hd = ขอบล่างหัวที่วัดขณะเลื่อน เลื่อนพ้นแล้วชิดบน
   · มือถือแนวนอนเตี้ยคงราวเต็มสูงแบบเดิม (หัวบางอยู่แล้ว) */
@media (min-width: 1024px) {
  body:has(.mnav) .logo { margin-left:calc(-1 * var(--rail-w)); }
  .mnav, .sheet { top:var(--hd, 0px); }
  /* แผงค้าง (เกณฑ์ความกว้างอยู่ที่ PIN_MQ ใน app.mjs): การ์ดเลื่อนไปช่องกลางระหว่างราวกับแผง ไม่ถูกบัง · ไม่มีเงาลิ้นชัก ไม่เลื่อนเข้า */
