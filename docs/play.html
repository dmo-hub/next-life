<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชาติหน้า · Next Life</title>
<style>
:root { --bg:#fbf7ef; --fg:#2b2218; --muted:#7a6a55; --accent:#8a5a1f; --card:#fff; --line:#e4d9c3; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1812; --fg:#f0e6d2; --muted:#a8977c; --accent:#d9a553; --card:#2a231a; --line:#443a2b; } }
body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.7 "Sarabun","Noto Sans Thai",system-ui,sans-serif; }
#app { max-width:560px; margin:0 auto; padding:16px; }
.profile { color:var(--muted); font-size:15px; margin-bottom:8px; }
.bar { display:flex; align-items:center; gap:8px; font-size:14px; }
.lbl { width:92px; color:var(--muted); }
.track { flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.fill { height:100%; background:var(--accent); }
.money { margin-top:6px; font-size:15px; color:var(--muted); }
.card { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
.text { margin:0 0 16px; }
.death { font-size:26px; font-weight:700; text-align:center; }
.sub { text-align:center; color:var(--muted); }
.choice { display:block; width:100%; margin-top:10px; padding:12px 14px; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--accent); border-radius:6px; cursor:pointer; text-align:left; }
.choice:hover, .choice:focus-visible { background:var(--accent); color:var(--bg); outline:none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
const CONTENT = {"events":[{"id":"school_start","age":6,"text":"อายุ {อายุ} ปี ถึงเวลาเข้าโรงเรียนแล้ว ปี {ปี} ที่บ้านในภาค{ภาค}","choices":[{"text":"ตั้งใจเรียนเต็มที่","effects":{"knowledge":2,"happiness":-1}},{"text":"เรียนไปเล่นไป","effects":{"knowledge":1,"happiness":1}}]},{"id":"first_job","age":22,"text":"อายุ {อายุ} ปี ถึงเวลาหางานทำ เงินติดตัว {เงิน} บาท","choices":[{"text":"รับงานมั่นคงเงินเดือนน้อย","effects":{"money":30000,"happiness":-1}},{"text":"ลองงานเสี่ยงที่ผลตอบแทนสูง","effects":{"money":80000,"health":-1,"relations":-1}}]},{"id":"retirement","age":60,"text":"อายุ {อายุ} ปี ถึงวัยเกษียณ เงินเก็บ {เงิน} บาท","choices":[{"text":"พักผ่อนอยู่กับครอบครัว","effects":{"relations":2,"happiness":2,"health":1}},{"text":"ทำงานต่ออีกหน่อย","effects":{"money":100000,"health":-1,"happiness":-1}}]}]};
// mulberry32: เล็ก เร็ว และให้ลำดับเดิมทุกครั้งเมื่อ seed เท่ากัน (แทน Math.random ที่ตั้ง seed ไม่ได้)
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

function mixSeed(seed, i) {
  return (Math.imul(seed >>> 0, 1000003) + Math.imul(i + 1, 2654435761)) >>> 0;
}


// ค่าคงที่ชั่วคราวของ tracer (ข้อมูลจริงเป็นงาน B02)
const SEXES = ['ชาย', 'หญิง'];
const REGIONS = ['กลาง', 'เหนือ', 'ตะวันออกเฉียงเหนือ', 'ใต้', 'ตะวันออก', 'ตะวันตก'];
const CLASSES = ['ยากจน', 'ชนชั้นกลาง', 'ร่ำรวย'];
const CLASS_WEIGHTS = [0.4, 0.5, 0.1];
const START = {
  ยากจน: { health: 55, happiness: 50, knowledge: 30, relations: 60, money: 2000, income: 8000 },
  ชนชั้นกลาง: { health: 65, happiness: 55, knowledge: 45, relations: 60, money: 20000, income: 25000 },
  ร่ำรวย: { health: 75, happiness: 60, knowledge: 60, relations: 55, money: 500000, income: 60000 },
};
// ตารางกลางแปลงระดับ ±1/±2/±3 เป็นตัวเลข (ใบ 07) ปรับสมดุลที่จุดเดียว
const LEVEL_STEP = 6;
const STAT_KEYS = ['health', 'happiness', 'knowledge', 'relations'];

const clamp = (v) => Math.max(0, Math.min(100, v));

function weighted(rng, items, weights) {
  let r = rng.next() * weights.reduce((s, w) => s + w, 0);
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r < 0) return items[i];
  }
  return items[items.length - 1];
}

function newLife(seed, content) {
  const rng = makeRng(seed);
  const cls = weighted(rng, CLASSES, CLASS_WEIGHTS);
  const s = START[cls];
  return {
    rng,
    content,
    birthYear: rng.int(2500, 2569),
    sex: rng.pick(SEXES),
    region: rng.pick(REGIONS),
    cls,
    age: 0,
    health: s.health,
    happiness: s.happiness,
    knowledge: s.knowledge,
    relations: s.relations,
    money: s.money,
    income: s.income,
    done: {},
    dead: false,
    pending: null,
    started: false,
    log: [],
  };
}

// ความน่าจะเป็นตายต่อปี แบบ Gompertz ง่าย ๆ คูณตัวคูณจากสุขภาพ (ใบ 03: ไม่มีเพดานอายุแข็ง)
function deathChance(age, health) {
  const base = 0.0004 + 0.00002 * Math.exp(0.095 * age);
  const mult = 1 + Math.max(0, 50 - health) / 40 - Math.max(0, health - 50) / 200;
  return Math.min(1, base * mult);
}

function fill(text, st) {
  return text
    .replaceAll('{อายุ}', st.age)
    .replaceAll('{ปี}', st.birthYear + st.age)
    .replaceAll('{ภาค}', st.region)
    .replaceAll('{เงิน}', Math.round(st.money).toLocaleString('en-US'));
}

function applyEffects(st, fx = {}) {
  for (const k of STAT_KEYS) if (fx[k]) st[k] = clamp(st[k] + fx[k] * LEVEL_STEP);
  if (fx.money) st.money += fx.money;
}

// เดินปีละครั้งจนเจอหลักไมล์ถึงกำหนดหรือตาย คืนการ์ดใบถัดไป
function nextCard(st) {
  if (st.pending) throw new Error('ยังมีการ์ดที่รอเลือก');
  if (st.dead) return deathCard(st);
  for (;;) {
    if (st.started) {
      st.age += 1;
      // ธรรมชาติ: สุขภาพไหลลงตามอายุ ความสัมพันธ์จางลง
      if (st.age > 30) st.health = clamp(st.health - 0.4);
      st.relations = clamp(st.relations - 0.3);
      if (st.age >= 22 && st.age < 60) st.money += st.income;
      if (st.health <= 0 || st.rng.next() < deathChance(st.age, st.health)) {
        st.dead = true;
        return deathCard(st);
      }
    }
    st.started = true;
    const ev = st.content.events.find((e) => e.age === st.age && !st.done[e.id]);
    if (ev) {
      st.done[ev.id] = true;
      st.pending = ev;
      return {
        kind: 'event',
        id: ev.id,
        age: st.age,
        text: fill(ev.text, st),
        choices: ev.choices.map((c) => fill(c.text, st)),
      };
    }
  }
}

function choose(st, idx) {
  const ev = st.pending;
  if (!ev || !ev.choices[idx]) throw new Error('ตัวเลือกไม่ถูกต้อง');
  st.pending = null;
  applyEffects(st, ev.choices[idx].effects);
  st.log.push({ id: ev.id, age: st.age, choice: idx });
}

function deathCard(st) {
  return {
    kind: 'death',
    age: st.age,
    text: `ตายอายุ ${st.age}`,
    summary: { year: st.birthYear + st.age, money: Math.round(st.money) },
  };
}

function profileText(st) {
  return `เกิดปี ${st.birthYear} · ${st.sex} · ภาค${st.region} · ฐานะ${st.cls}`;
}

function statsOf(st) {
  return { health: st.health, happiness: st.happiness, knowledge: st.knowledge, relations: st.relations, money: st.money };
}

// harness วิ่งชีวิตผ่านฟังก์ชันชุดเดียวกับหน้าเว็บ ผู้เรียกส่งแค่ตัวเลือกเลือกตัวเลือก
// stream ของบอทแยกจาก rng ของแกนเกม เพื่อไม่ให้การเลือกไปเปลี่ยนลำดับสุ่มของโลก
function playLife(seed, content, pickChoice) {
  const st = newLife(seed, content);
  const bot = makeRng(seed ^ 0x5bd1e995);
  for (;;) {
    const card = nextCard(st);
    if (card.kind === 'death') return { age: card.age, state: st };
    choose(st, pickChoice(card, bot));
  }
}

const root = document.getElementById('app');
let st;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bar(label, v) {
  const row = el('div', 'bar');
  row.append(el('span', 'lbl', label));
  const track = el('div', 'track');
  const fill = el('div', 'fill');
  fill.style.width = `${Math.round(v)}%`;
  track.append(fill);
  row.append(track);
  return row;
}

function render(card) {
  root.replaceChildren();
  const s = statsOf(st);
  const head = el('div', 'head');
  head.append(el('div', 'profile', profileText(st)));
  head.append(bar('สุขภาพ', s.health), bar('ความสุข', s.happiness), bar('ความรู้', s.knowledge), bar('ความสัมพันธ์', s.relations));
  head.append(el('div', 'money', `เงิน ${Math.round(s.money).toLocaleString('en-US')} บาท`));
  root.append(head);

  const box = el('div', 'card');
  box.append(el('p', card.kind === 'death' ? 'text death' : 'text', card.text));
  if (card.kind === 'event') {
    card.choices.forEach((c, i) => {
      const b = el('button', 'choice', c);
      b.onclick = () => {
        choose(st, i);
        render(nextCard(st));
      };
      box.append(b);
    });
  } else {
    box.append(el('p', 'sub', `ปี ${card.summary.year} · เงินคงเหลือ ${card.summary.money.toLocaleString('en-US')} บาท`));
    const b = el('button', 'choice', 'เกิดใหม่');
    b.onclick = start;
    box.append(b);
  }
  root.append(box);
}

function start() {
  // seed จากเวลาเฉพาะฝั่งหน้าเว็บ แกนเกมเองไม่แตะนาฬิกา
  st = newLife((Date.now() ^ (performance.now() * 1000)) >>> 0, CONTENT);
  render(nextCard(st));
}

start();

})();
</script>
</body>
</html>
