<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เตรียมทหาร เฟส 1 · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e1d8;--acc:#3b5b3a;--acc2:#8a6d2f;--good:#2f7d4a;--bad:#b03a2e;--chip:#efeae0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a;--acc:#8fb98d;--acc2:#d6b46a;--good:#6cc68b;--bad:#ef7a6d;--chip:#2a2e33}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a;--acc:#8fb98d;--acc2:#d6b46a;--good:#6cc68b;--bad:#ef7a6d;--chip:#2a2e33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.6}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .note{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 10px;color:var(--mute)}
.badge.age{background:var(--acc);color:#fff}
h2{margin:4px 0 8px;font-size:20px}
.text{white-space:pre-wrap;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;text-align:left}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.hint{display:block;font-size:13px;color:var(--mute)}
.result{border-left:3px solid var(--acc2);padding:6px 10px;margin:10px 0;background:var(--chip);border-radius:6px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.fx span{font-size:13px;border-radius:6px;padding:1px 8px;background:var(--chip)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)}
.stat{display:grid;grid-template-columns:80px 1fr 34px;gap:6px;align-items:center;font-size:14px;margin:4px 0}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.side h3{font-size:15px;margin:12px 0 6px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flags span{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace}
.log{font-size:13px;color:var(--mute);max-height:260px;overflow:auto;padding-left:18px;margin:0}
label{display:block;font-size:14px;margin:8px 0 2px;color:var(--mute)}
select,input{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{font-size:13px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>เส้นเตรียมทหาร · เฟส 1 (วัยเด็ก → หน้าห้องสอบ)</h1>
  <span class="note">Demo ทดลองเนื้อเรื่อง · ตัวเลขเป็นค่าสมมติ ไม่ใช่ค่าสมดุลจริง</span>
</header>
<main>
  <section id="stage" class="card"></section>
  <aside class="card side" id="side"></aside>
</main>
<script src="data-00.js"></script>
<script src="data-01.js"></script>
<script src="data-02.js"></script>
<script src="data-03.js"></script>
<script src="data-04.js"></script>
<script src="data-05.js"></script>
<script src="data-06.js"></script>
<script>
(() => {
// owner 2026-11-05: no events that hand out exactly the camp fee — money must come from the character's own life
const DISABLED = new Set(['U1', 'U2', 'U3']);
const EVENTS = (window.DEMO_EVENTS || []).filter(e => !DISABLED.has(e.id));
// owner 2026-11-05: "what will you do with your life" crossroad must not show while committed to the exam —
// the family-tell scene already covers it; it may come back once he drops the path or ages out
const CADET_BLOCKED = new Set(['N-milestone_teen_crossroad']);
for (const e of EVENTS) if (CADET_BLOCKED.has(e.id)) e.cond = { ...(e.cond || {}), flagsNot: [...(e.cond?.flagsNot || []), 'cadet_dream'] };
const byId = Object.fromEntries(EVENTS.map(e => [e.id, e]));
const STATS = [['knowledge','ความรู้'],['health','ชีวิต'],['happiness','ความสุข'],['relations','ความสัมพันธ์'],['network','เส้นสาย'],['money','เงิน']];
const SCALE = 5;            // demo: ↑ = +5
const POOL_CHANCE = 0.7;    // demo: chance per draw round
const POOL_ROUNDS = 2;      // demo: up to 2 life events per year
const INSPIRE_WEIGHT = 0.35;// demo: uniform/inspiration scenes are rarer than normal life
const INVITE_CHANCE = 0.4;  // demo: re-entry notice is occasional, never two years running
// owner 2026-11-05: written-round knowledge bar 65 (real game median at 16) — prep gives a GAIN, not a fixed ceiling,
// so a poor kid starting ~52–55 can still pass by studying hard (self-study diligent ≈ +15)
// diligent prep must carry even the lowest base (~40) past 65, whatever the class; slacking leaves the gap open
const PREP_BUDGET = { cadet_prep_camp: 35, cadet_prep_group: 30, cadet_prep_senior: 30, cadet_prep_self: 30 };
const DILIGENCE_PER_YEAR = 2;   // guaranteed "will you study?" scenes each prep year
// physical + medical on one day, judged by health per branch (owner 2026-11-05) · demo numbers, owner sets real ones
const BODY_MIN = { police: 55, navy: 65, airforce: 70, army: 80 };
const SWIM_FREE = 70;           // can't swim and not coastal: still makes 50 m if health ≥ this
const TRAIN_PER_YEAR = 3;       // guaranteed physical-training scenes each prep year
const HEALTH_BUDGET = 40;       // most health training can add over the prep years (enough for the poorest start to reach ทบ.)
const isTraining = e => /^PT\d/.test(e.id);
const isDiligence = e => /^(K\d|D[123])/.test(e.id);
function prepBudget() { for (const [f, b] of Object.entries(PREP_BUDGET)) if (S.flags.has(f)) return b; return 0; }
const CAMP_COST = 3;       // demo: tutoring-camp fee in money units (owner sets the real value)
const UNLOCK_BEFORE_E3 = 0.6; // demo: chance of one unlock event right before a same-year E3
const INSPIRE_MAX = 3;     // demo: at most 3 inspiration scenes before deciding (2 are guaranteed)
// two different years; favour 10 & 12 so they rarely sit back to back
const pickTwo = a => Math.random() < 0.5 ? [a[0], a[2]] : (Math.random() < 0.5 ? [a[0], a[1]] : [a[1], a[2]]);
const BRANCH = {army:'ทหารบก', navy:'ทหารเรือ', airforce:'ทหารอากาศ', police:'ตำรวจ'};
const $ = s => document.querySelector(s);
const stage = $('#stage'), side = $('#side');
let S;

function setup() {
  S = null;
  stage.innerHTML = `
    <h2>สร้างตัวละคร</h2>
    <div class="row">
      <div><label>ชื่อ</label><input id="f-name" value="ภูมิ"></div>
      <div><label>เพศ</label><select id="f-sex"><option>ชาย</option><option>หญิง</option></select></div>
      <div><label>ภาค</label><select id="f-region"><option>กลาง</option><option>เหนือ</option><option>ตะวันออกเฉียงเหนือ</option><option>ตะวันออก</option><option>ใต้</option></select></div>
      <div><label>ปีเกิด (พ.ศ.)</label><input id="f-year" type="number" value="2552"></div>
      <div><label>ฐานะ</label><select id="f-class"><option value="poor">ลำบาก</option><option value="mid" selected>ปานกลาง</option><option value="rich">มีอันจะกิน</option></select></div>
      <div><label>พ่อแม่</label><select id="f-family"><option value="both">มีพ่อและแม่</option><option value="mother">มีแต่แม่</option><option value="fatherOnly">มีแต่พ่อ</option><option value="none">ไม่มีพ่อแม่แล้ว</option></select></div>
      <div><label>เป็นทายาท</label><select id="f-heir"><option value="">ไม่ใช่</option><option value="army">ลูกทหาร</option><option value="police">ลูกตำรวจ</option></select></div>
      <div><label>หลังจบ ม.3</label><select id="f-track"><option value="upper">ม.ปลาย</option><option value="voc">ปวช.</option></select></div>
    </div>
    <p class="warn">เริ่มที่อายุ 10 · จบเมื่อถึงประตูห้องสอบ หรือพ้นเกณฑ์อายุ · ฉากที่ต้องรอ engine (เช่นแบบทายาท) จำลองให้เห็นในนี้แล้ว</p>
    <button class="primary" id="go">เริ่มเล่น</button>`;
  $('#go').onclick = () => start({
    name: $('#f-name').value || 'ภูมิ', sex: $('#f-sex').value, region: $('#f-region').value,
    birthYear: +$('#f-year').value || 2552, cls: $('#f-class').value, family: $('#f-family').value,
    heir: $('#f-heir').value || null, track: $('#f-track').value });
  renderSide();
}

function start(p) {
  // money follows the game's own flow: no extra savings mechanic — only events move it
  // starting knowledge at 10 follows the real game's spread by class (poor lower, rich higher)
  const k0 = { poor: [40, 54], mid: [46, 60], rich: [52, 66] }[p.cls];
  // starting health follows the real game's spread at 13–17 by class (poor ~55, middle ~67, rich ~85)
  const h0 = { poor: [44, 64], mid: [56, 78], rich: [70, 95] }[p.cls];
  const rint = r => r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1));
  S = { ...p, age: 10, stats: {knowledge: rint(k0), health: rint(h0), happiness:55, relations:50, network:40, money: 0},
        flags: new Set(), done: new Set(), queue: [], sched: [], log: [], ended: false,
        inspireCount: 0, inspireAges: [10, 12] };   // owner: ≥2 before deciding, never back to back
  if (p.heir) S.flags.add(p.heir + '_family');
  beginYear();
}

const school = () => S.age <= 12 ? 'primary' : S.age <= 15 ? 'lower' : S.track;
const year = () => S.birthYear + S.age;
const hasPrefix = pre => [...S.flags].some(f => f.startsWith(pre));

function condOk(c) {
  if (!c) return true;
  if (c.sex && c.sex !== S.sex) return false;
  if (c.regions && c.regions.length && !c.regions.includes(S.region)) return false;
  if (c.notRegions && c.notRegions.includes(S.region)) return false;
  if (c.heir && S.heir !== c.heir) return false;
  if (c.notHeir && [].concat(c.notHeir).includes(S.heir)) return false;
  if (c.classes && c.classes.length && !c.classes.includes(S.cls)) return false;
  if (c.knowledgeMax != null && (S.prepGain || 0) >= prepBudget()) return false;   // study cards stop once this prep method's gain budget is used
  if (c.anyFlags && !c.anyFlags.some(f => S.flags.has(f))) return false;
  if (c.yearMin && year() < c.yearMin) return false;
  if (c.yearMax && year() > c.yearMax) return false;
  if (c.school && c.school.length && !c.school.includes(school())) return false;
  if (c.flagsHas && c.flagsHas.some(f => f.endsWith(':') ? !hasPrefix(f) : !S.flags.has(f))) return false;
  if (c.flagsNot && c.flagsNot.some(f => f.endsWith(':') ? hasPrefix(f) : S.flags.has(f))) return false;
  if (c.flagsHasPrefix && !hasPrefix(c.flagsHasPrefix)) return false;
  if (c.family === 'mother' && !(S.family === 'both' || S.family === 'mother')) return false;
  if (c.family === 'fatherOnly' && S.family !== 'fatherOnly') return false;
  if (c.noParents && S.family !== 'none') return false;
  if (c.poor === true && S.cls !== 'poor') return false;
  if (c.poor === false && S.cls === 'poor') return false;
  return true;
}
const inAge = e => S.age >= (e.ageMin ?? 0) && S.age <= (e.ageMax ?? e.ageMin ?? 99);

// an id may be a base with variants (variantOf); pick the variant whose cond matches
// criteria sheet for all 4 branches, shown once when he first decides to sit the exam
// health bars per branch, as printed on the criteria sheet
const bodyRule = () => `ชีวิต ตร. ${BODY_MIN.police} · ทร. ${BODY_MIN.navy} · ทอ. ${BODY_MIN.airforce} · ทบ. ${BODY_MIN.army} ขึ้นไป (รวมว่ายน้ำ 50 เมตร)`;
function bodyReach(h) {
  const ok = BR.filter(b => h >= BODY_MIN[b]), next = BR.filter(b => h < BODY_MIN[b]).sort((a, b) => BODY_MIN[a] - BODY_MIN[b])[0];
  return `ชีวิต ${h} → ${ok.length ? 'ถึง ' + ok.map(b => BR_TH[b]).join(' ') : 'ยังไม่ถึงสักเหล่า'}${next ? ` · ขาดอีก ${BODY_MIN[next] - h} ถึง ${BR_TH[next]}` : ''}`;
}
function criteriaCard(retry) {
  const k = S.stats.knowledge, h = S.stats.health, gap = Math.max(0, 65 - k);
  const mark = ok => ok ? '✓' : '✗';
  return { id: retry ? '__CRIT2' : '__CRITERIA', title: retry ? 'เกณฑ์สอบปีนี้' : 'แผ่นเกณฑ์รับสมัครสี่เหล่า', kind: 'scheduled', repeatable: !!retry,
    text: (retry ? `ยื่นใบสมัครแล้ว แนบมากับบัตรสอบคือแผ่นเกณฑ์ปีนี้ เหมือนปีก่อนทุกข้อ\n\n`
                 : `ครูแนะแนวยื่นกระดาษแผ่นหนึ่งให้ เป็นเกณฑ์ที่เหมือนกันทั้งสี่เหล่า ทบ. ทร. ทอ. ตร.\n\n`) +
      `• ผู้สมัคร: ชาย อายุ 16–18 ปี เรียน ม.ปลาย หรือ ปวช. · สอบได้ปีละครั้ง\n` +
      `• ข้อเขียน: แบบวัดความพร้อมของแต่ละเหล่า ได้อย่างน้อย 13 จาก 25 และความรู้ 65 ขึ้นไป\n` +
      `• พลศึกษาและตรวจร่างกาย (สอบวันเดียวกัน): ${bodyRule()}\n` +
      `• สัมภาษณ์\n` +
      `• สมัครได้หลายเหล่า แต่ละเหล่าสอบคนละวัน ติดหลายเหล่าเลือกได้เหล่าเดียว\n\n` +
      `ตอนนี้ ${S.name}: ความรู้ ${k} ${mark(k >= 65)}${gap ? ` (ขาดอีก ${gap})` : ''} · ${bodyReach(h)}` +
      `${S.flags.has('can_swim') ? ' · ว่ายน้ำเป็นแล้ว' : ' · ยังไม่ได้หัดว่ายน้ำ'}`,
    options: [
      { label: 'จดเกณฑ์ไว้ ตั้งเป้าทำความรู้ให้ถึง', fx: { knowledge: 1 }, result: 'ติดกระดาษไว้ข้างโต๊ะ เขียนเลขเป้าหมายตัวโตไว้มุมบน' },
      { label: 'เริ่มวิ่งตอนเช้าให้ร่างกายพร้อม', fx: { health: 1 }, result: 'ตั้งนาฬิกาปลุกตีห้า พรุ่งนี้เริ่มวิ่งรอบหมู่บ้าน' },
      { label: 'ถามครูว่าเตรียมตัวยังไงดี', fx: { network: 1 }, setFlags: ['cadet_tips'], result: 'ครูเล่าว่ารุ่นพี่ที่ติด เริ่มอ่านจริงจังก่อนสอบสองปี' },
      { label: 'พับเก็บไว้ ยังมีเวลาอีกหลายปี', fx: {}, _fold: true, result: 'กระดาษถูกพับสี่ทบ เก็บไว้ในกระเป๋านักเรียน' }] };
}
// the folded sheet falls out of the school bag right before he picks how to prep (E3)
function refoldCard() {
  const k = S.stats.knowledge, h = S.stats.health, gap = Math.max(0, 65 - k);
  const mark = ok => ok ? '✓' : '✗';
  return { id: '__REFOLD', title: 'กระดาษที่พับไว้', kind: 'scheduled',
    text: `ระหว่างรื้อกระเป๋านักเรียน กระดาษแผ่นหนึ่งที่พับสี่ทบหล่นออกมา\n` +
      `แผ่นเกณฑ์รับสมัครสี่เหล่าที่ครูแนะแนวให้ไว้ ขอบกระดาษเริ่มยับ\n\n` +
      `ข้อเขียน: ได้อย่างน้อย 13 จาก 25 และความรู้ 65 ขึ้นไป · พลศึกษาและตรวจร่างกาย: ${bodyRule()}\n\n` +
      `ตอนนี้ ${S.name}: ความรู้ ${k} ${mark(k >= 65)}${gap ? ` (ขาดอีก ${gap})` : ''} · ${bodyReach(h)}` +
      `${S.flags.has('can_swim') ? ' · ว่ายน้ำเป็นแล้ว' : ' · ยังไม่ได้หัดว่ายน้ำ'}`,
    options: [
      { label: 'คลี่ออก ติดไว้ข้างโต๊ะ', fx: { knowledge: 1 }, result: gap ? `ขาดอีก ${gap} คะแนน ตัวเลขนี้อยู่ในสายตาทุกครั้งที่นั่งลง` : 'ถึงเกณฑ์แล้ว แต่ติดไว้กันลืม' },
      { label: 'ลอกเกณฑ์ลงปกหลังสมุด', fx: {}, result: 'เขียนตัวเลขสองสามบรรทัดไว้หลังสมุด เปิดเจอทุกวัน' },
      { label: 'พับเก็บเหมือนเดิม', fx: {}, result: 'พับกลับสี่ทบ ใส่กระเป๋าใบเดิม' },
      { label: 'เอาไปให้เพื่อนที่จะสอบด้วยกันดู', fx: { network: 1 }, result: 'เพื่อนอ่านจบแล้วพูดว่า "ปีนี้เอาจริงนะ"' }] };
}
// prep season comes round again after a failed year · what tripped him last time decides the nudge
function seasonCard() {
  const k = S.stats.knowledge, h = S.stats.health, why = S.lastFail;   // kept until he sits again, so a skipped year still gets the reminder
  const mark = ok => ok ? '✓' : '✗';
  const last = ({ written: 'ปีก่อนตกตั้งแต่ข้อเขียน', land: 'ปีก่อนพลาดที่สนามพลศึกษา', swim: 'ปีก่อนไปไม่ถึงขอบสระ',
    medical: 'ปีก่อนตกที่ห้องตรวจร่างกาย', noshow: 'ปีก่อนผ่านข้อเขียน แต่ไม่ได้ไปสอบพลศึกษา', injury: 'ปีก่อนซ้อมหนักจนเจ็บก่อนวันสอบพละ', noshow_iv: 'ปีก่อนผ่านถึงรอบสัมภาษณ์ แต่ไม่ได้ไปสัมภาษณ์', interview: 'ปีก่อนตกรอบสัมภาษณ์', noreport: 'ปีก่อนติดแล้ว แต่ไม่ไปรายงานตัว' })[why] || 'ปีก่อนยังไม่ติด';
  return { id: '__SEASON', title: 'ฤดูสอบวนกลับมา', kind: 'scheduled', repeatable: true,
    text: `ใบปลิวกวดวิชาเตรียมทหารเริ่มติดเต็มบอร์ดหน้าโรงเรียนอีกครั้ง เหลืออีกไม่กี่เดือนก็ถึงวันสอบ\n${last}\n\n` +
      `ตอนนี้ ${S.name}: ความรู้ ${k} ${mark(k >= KNOW_MIN)}${k < KNOW_MIN ? ` (ขาดอีก ${KNOW_MIN - k})` : ''} · ${bodyReach(h)}` +
      `${S.flags.has('can_swim') ? ' · ว่ายน้ำเป็นแล้ว' : ' · ยังไม่ได้หัดว่ายน้ำ'}`,
    options: [
      { label: 'ทบทวนบทที่อ่อนใหม่ตั้งแต่ต้น', fx: { knowledge: 1 }, result: 'เปิดสมุดเล่มปีก่อน รอยปากกาแดงยังอยู่ทุกหน้า' },

  S.p2 = null;
  // still in the race next year unless he let it go (failed card options set cadet_let_go / clear cadet_dream)
  if (S.age < 18 && !S.flags.has('cadet_let_go')) S.flags.add('cadet_dream');
  if (S.age >= 18) { finish(`หมดสิทธิ์สอบตามอายุแล้ว (สอบไป ${S.tries || 1} ครั้ง) · ด่านจบ ม.6/ปวช. ที่พักไว้เดินต่อ ไปทางมหาวิทยาลัยหรือสายอื่นตามเกมเดิม`); return 'END'; }
  S.flags.delete('cadet_exam_door');
  S.age++;
  beginYear();
  return 'END';
}

function p2Next() {
  while (S.p2 && S.p2.steps.length) {
    const r = S.p2.steps.shift()();
    if (r === 'END') return;
    if (r) return show(r);
  }
  if (S.p2) { S.p2 = null; finish('จบสนามสอบ'); }
}

function finish(msg) {
  S.ended = true;
  stage.innerHTML = `<div class="badges"><span class="badge age">อายุ ${S.age}</span></div>
    <h2>จบเฟส 1</h2><p class="text">${msg}</p>
    <button class="primary" id="again">เล่นใหม่</button>`;
  $('#again').onclick = setup;
  renderSide();
}

function renderSide() {
  if (!S) { side.innerHTML = `<h3>ข้อมูลใน demo</h3><p class="warn">โหลดเหตุการณ์ ${EVENTS.length} ใบ</p>`; return; }
  side.innerHTML = `
    <h3>${S.name} · ${S.sex} · ${S.region}</h3>
    ${STATS.map(([k, l]) => k === 'money'
      ? `<div class="stat"><span>${l}</span><span>${'฿'.repeat(Math.min(S.stats.money, 10)) || '—'}</span><span>${S.stats.money}</span></div>`
      : `<div class="stat"><span>${l}</span><div class="bar"><i style="width:${S.stats[k]}%"></i></div><span>${S.stats[k]}</span></div>`).join('')}
    <h3>ธง</h3><div class="flags">${[...S.flags].map(f => `<span>${f}</span>`).join('') || '<span>—</span>'}</div>
    <h3>บันทึก</h3><ol class="log">${S.log.slice(-40).map(l => `<li>${l}</li>`).join('')}</ol>`;
}

window.__demoState = () => S;   // test hook only
setup();
})();
</script>
</body>
</html>
