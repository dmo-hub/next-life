@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a;--acc:#8fb98d;--acc2:#d6b46a;--good:#6cc68b;--bad:#ef7a6d;--chip:#2a2e33}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a;--acc:#8fb98d;--acc2:#d6b46a;--good:#6cc68b;--bad:#ef7a6d;--chip:#2a2e33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.6}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .note{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 10px;color:var(--mute)}
.badge.age{background:var(--acc);color:#fff}
h2{margin:4px 0 8px;font-size:20px}
.text{white-space:pre-wrap;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;text-align:left}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.hint{display:block;font-size:13px;color:var(--mute)}
.result{border-left:3px solid var(--acc2);padding:6px 10px;margin:10px 0;background:var(--chip);border-radius:6px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.fx span{font-size:13px;border-radius:6px;padding:1px 8px;background:var(--chip)}
.fx .up{color:var(--good)} .fx .down{color:var(--bad)}
.stat{display:grid;grid-template-columns:80px 1fr 34px;gap:6px;align-items:center;font-size:14px;margin:4px 0}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.side h3{font-size:15px;margin:12px 0 6px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flags span{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace}
.log{font-size:13px;color:var(--mute);max-height:260px;overflow:auto;padding-left:18px;margin:0}
label{display:block;font-size:14px;margin:8px 0 2px;color:var(--mute)}
select,input{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{font-size:13px;color:var(--mute);margin-top:10px}
</style>
</head>

// base: poor 30% · middle 50–80% (fixed per family) · rich 100%
// poor & middle: knowledge adds a bonus, ramping from knowledge 40 (+0) to 60 (+KNOW_BONUS_MAX)
const KNOW_BONUS_MAX = 0.2;  // demo value — owner to set
const knowBonus = () => KNOW_BONUS_MAX * Math.max(0, Math.min(1, (S.stats.knowledge - 55) / 20));
function familySupportChance() {
  if (S.cls === 'rich') return 1;
  // poor: knowledge at the exam bar (≥40) earns +10%; below it the family more likely says no
  if (S.cls === 'poor') return S.stats.knowledge >= 55 ? 0.4 : 0.3;
  if (S.cls === 'mid' && S.midSupport == null) S.midSupport = 0.5 + Math.random() * 0.3;
  const base = S.cls === 'poor' ? 0.3 : S.midSupport;
  return Math.min(0.99, base + knowBonus());
}
// what share of the camp fee the family covers: poor 30–100% (and how they raise it), others all of it
const FUND_WAYS = ['fund:borrow_relative', 'fund:loan_shark', 'fund:village_fund', 'fund:pawn', 'fund:sell_livestock'];
function onFamilySupport() {
  if (S.cls === 'poor') {
    // how much they can raise also follows his knowledge: <40 → 30–60% · 40–59 → 40–80% · ≥60 → 60–100%
    const k = S.stats.knowledge, [lo, hi] = k >= 75 ? [0.6, 1] : k >= 55 ? [0.4, 0.8] : [0.3, 0.6];
    S.familyShare = Math.round((lo + Math.random() * (hi - lo)) * 10) / 10;
    const way = FUND_WAYS[Math.floor(Math.random() * FUND_WAYS.length)];
    S.flags.add(way);
    S.log.push(`ที่บ้านออกค่าติวได้ราว ${Math.round(S.familyShare * 100)}%`);
    if (resolve('F1')) S.queue.unshift('F1');
  } else S.familyShare = 1;
}
// own money still needed for the family-paid camp option
const campOwnNeed = () => Math.ceil(CAMP_COST * (1 - (S.familyShare ?? 1)));

function applyFx(fx) {
  const out = [];
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v || !(k in S.stats)) continue;
    const d = k === 'money' ? v : v * SCALE;
    S.stats[k] = k === 'money' ? Math.max(0, S.stats[k] + d) : Math.max(0, Math.min(100, S.stats[k] + d));
    out.push([k, d]);
  }
  return out;
}

function choose(e, o) {

    const picks = [];

  let result = o.result, deltas = applyFx(o._ownPay ? { ...(o.fx || {}), money: (o.fx?.money || 0) - o._ownPay } : o.fx);
  (o.setFlags || []).forEach(f => S.flags.add(f));

  if (o._fold) S.criteriaFolded = true;
  if ((o.setFlags || []).includes('cadet_dream') && (S.age === 16 || S.age === 17) && !S.p2 && !S.queue.includes('S' + S.age) && !S.done.has('S' + S.age)) S.queue.push('S' + S.age);

  let outs = (o.outcomes || []).filter(x => (!x.whenFlag || S.flags.has(x.whenFlag)) && (!x.whenNotFlag || !S.flags.has(x.whenNotFlag)) && (!x.when || condOk(x.when)));
  // family paying for tutoring depends on the family's means (owner 2026-11-05)

        { id: `Q-${b}-${k + 1}`, title: `ข้อสอบ ${BR_TH[b]} · ข้อ ${k + 1}/5`, text: q.q,
          options: shuffle(q.options.map(o => ({ label: o.label, _score: o.score, _branch: b }))) })));
      S.p2.steps.push(() => { judgeWritten(b); return null; });
    });
    // announce scenes from cadet-phase2-announce.md (owner 2026-11-06): X2w waiting day → X3a morning/how to look → X3 all results → X3b (pass ≥ 1)
    S.p2.steps.push(() => x2wCard());
    S.p2.steps.push(() => x3aCard());
    S.p2.steps.push(() => x3Card());
    renderSide();
    next();
  }
}

function judgeWritten(b) {
  const sc = S.p2.scores[b] || 0;
  const ok = sc >= WRITTEN_MIN && S.stats.knowledge >= KNOW_MIN;
  S.p2.written[b] = ok;
  S.p2.reason = S.p2.reason || {};
  S.p2.reason[b] = ok ? null : (sc < WRITTEN_MIN && S.stats.knowledge < KNOW_MIN ? 'both' : sc < WRITTEN_MIN ? 'quiz' : 'knowledge');
  S.p2.lastScore = sc;
  (S.p2.know ??= {})[b] = S.stats.knowledge;   // ความรู้ ณ วันสอบเหล่านี้ (บล็อกคะแนน · คะแนนรวม)
  S.log.push(`ข้อเขียน ${BR_TH[b]}: ${sc}/25 · ความรู้ ${S.stats.knowledge} → ${ok ? 'ผ่าน' : 'ไม่ผ่าน'}`);
}

function interlude() {
  const mood = S.p2.lastScore == null ? null : S.p2.lastScore >= WRITTEN_MIN ? 'good' : 'bad';
  const list = (P2().interludes || []).filter(c => (!c.cond?.mood || c.cond.mood === mood)
    && (c.cond?.moneyMax == null || S.stats.money <= c.cond.moneyMax) && (!c.cond || condOk({ ...c.cond, mood: undefined, moneyMax: undefined })));
  const c = list[Math.floor(Math.random() * list.length)];
  const dayTh = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่'][S.p2.dayNo] || String(S.p2.dayNo);
  return c ? asCard(c, { id: c.id || 'X2i', text: (c.text || '').replaceAll('{วัน}', dayTh) }) : null;
}

function waitDay() {
  const okAll = S.p2.branches.every(b => (S.p2.scores[b] || 0) >= WRITTEN_MIN);
  const list = [].concat(P2().waitDay || []).filter(c => (!c.cond?.mood || c.cond.mood === (okAll ? 'good' : 'bad'))
    && (!c.cond || condOk({ ...c.cond, mood: undefined })));
  const c = list[Math.floor(Math.random() * list.length)]
    || { title: 'วันว่างก่อนประกาศผล', text: `สอบครบ ${S.p2.branches.length} เหล่าแล้ว พรุ่งนี้ประกาศผล วันนี้ไม่มีอะไรต้องทำ`,
         options: [{ label: 'นอนให้เต็มอิ่ม', fx: { health: 1 }, result: 'หลับยาวถึงเที่ยง' },
                   { label: 'นั่งนึกคำตอบทีละข้อ', fx: {}, result: 'บางข้อมั่นใจ บางข้อไม่แน่ใจ' },
                   { label: 'ช่วยงานที่บ้าน', fx: { happiness: 1 }, result: 'ทั้งวันมีงานให้มือทำ ใจเลยไม่ค่อยวิ่งไปที่ผลสอบ' },
                   { label: 'โทรคุยกับเพื่อนที่สอบด้วยกัน', fx: { network: 1 }, result: 'คุยกันเรื่องข้อที่ตอบไม่ตรงกัน แล้วก็เลิกคุยเรื่องนี้' }] };
  return asCard(c, { id: c.id || 'X2w' });
}

// ============ บล็อกคะแนน · คะแนนรวม · ลำดับที่ (เจ้าของเคาะ B/C1–C4 2026-11-06 · research cadet-titles-scores-ranks.md) ============
// บล็อกตัวเลขแยกใต้บล็อกผลทุกรอบ ทั้งติดและไม่ติด · ของจริงไม่ประกาศคะแนน/ลำดับ = เล่าแบบเกม (S1 §2)
// ลำดับ = ตัวเลขเล่าเรื่องให้สอดคล้องกับเส้นเดิม ไม่แตะสมดุล (C2 ก) · ตกสัมภาษณ์เฉียด = ตัวสำรอง = ไม่ติด
const SEATS = { army: 270, navy: 90, airforce: 137, police: 315 };   // ที่นั่งปี 2568 ใช้ทุกยุค (C3)
const RESERVE_SHARE = 0.4;    // ตัวสำรองนับถึง 40% ของที่นั่ง (C3)
const RESERVE_GAP = 2;        // สัมภาษณ์ขาดเส้นไม่เกินเท่านี้ = ตัวสำรอง (C2 ก)
const TOTAL_DIV = { know: 4, body: 4 };   // รวม 100 = ข้อเขียน 25 + ความรู้/4 + ชีวิต/4 + สัมภาษณ์ 25 (C1)
function writtenScoreLine(b) {
  // เหตุคิดจากตัวเลขจริง (ไม่อ่าน reason ที่เก็บไว้) — บรรทัดตัวเลขจะไม่ขัดกับตัวมันเอง
  const sc = S.p2.scores[b] || 0, k = S.p2.know?.[b] ?? S.stats.knowledge, q = sc < WRITTEN_MIN, kn = k < KNOW_MIN, why = q && kn ? 'both' : kn ? 'knowledge' : q ? 'quiz' : null;
  if (why === 'both') return `${BR_TH[b]} แบบวัด ${sc}/25 · ความรู้ ${k} ไม่ถึงเกณฑ์ทั้งคู่ (เส้น ${WRITTEN_MIN} · ${KNOW_MIN})`;
  if (why === 'knowledge') return `${BR_TH[b]} แบบวัด ${sc}/25 ผ่านเส้น · ความรู้ ${k} เกณฑ์ ${KNOW_MIN} ขาดอีก ${KNOW_MIN - k}`;
  if (why === 'quiz') return `${BR_TH[b]} ได้ ${sc}/25 ขาดอีก ${WRITTEN_MIN - sc} ถึงเส้น ${WRITTEN_MIN} · ความรู้ ${k}`;
  return `${BR_TH[b]} ได้ ${sc}/25 (เส้น ${WRITTEN_MIN}) · ความรู้ ${k} (เกณฑ์ ${KNOW_MIN})`;
}
const bodyScoreLine = live => `ชีวิตวันสอบ ${S.p2.bodyH ?? S.stats.health} · ` + live.map(b => `${BR_TH[b]} เกณฑ์ ${BODY_MIN[b]} ${S.p2.body?.[b] ? 'ผ่าน' : 'ไม่ผ่าน'}`).join(' · ');
const ivScoreLine = () => `สัมภาษณ์ ${S.p2.iv || 0}/25 (เส้น ${IV_MIN})`;
const totalOf = b => (S.p2.scores[b] || 0) + Math.round((S.p2.know?.[b] ?? S.stats.knowledge) / TOTAL_DIV.know) + Math.round((S.p2.bodyH ?? S.stats.health) / TOTAL_DIV.body) + (S.p2.iv || 0);
// ลำดับรายเหล่าของคนที่ถึงรอบสุดท้าย · จำไว้ใน S.p2.ranks ให้ฉากหลังใช้ต่อ
function finalRank(b, passed) {
  const seats = SEATS[b], resMax = Math.floor(seats * RESERVE_SHARE), total = totalOf(b);
  let rank, kind;
  if (passed) { kind = 'pass'; rank = Math.max(1, Math.min(seats, Math.round(seats * Math.min(1, Math.max(0.02, (100 - total) / 50)) * (0.85 + 0.3 * Math.random())))); }
  else if (IV_MIN - (S.p2.iv || 0) <= RESERVE_GAP) { kind = 'reserve'; rank = seats + Math.max(1, Math.min(resMax, Math.ceil(resMax * ((IV_MIN - (S.p2.iv || 0)) / RESERVE_GAP) * (0.4 + 0.6 * Math.random())))); }
  else { kind = 'out'; rank = seats + resMax + 1 + Math.floor(Math.random() * seats); }
  return ((S.p2.ranks ??= {})[b] = { total, rank, seats, kind, reserveNo: kind === 'reserve' ? rank - seats : null });
}
function finalScoreLine(b, r) {
  const head = `${BR_TH[b]} รวม ${r.total}/100 · ลำดับที่ ${r.rank}`;
  if (r.kind === 'pass') return `${head} จาก ${r.seats} ที่นั่ง · ตัวจริง`;
  if (r.kind === 'reserve') return `${head} · ที่นั่งมี ${r.seats} · ตัวสำรองลำดับที่ ${r.reserveNo} ปีนี้ชื่อไม่ถูกเรียก (ไม่ติด)`;
  return `${head} · ที่นั่งมี ${r.seats} · ไม่ติด`;
}

  const block = P.branches.map(b => P.written[b] ? `${BR_TH[b]} · ลำดับ ${20 + (25 - (P.scores[b] || 0)) * 30 + Math.floor(Math.random() * 29)} · ผ่าน`   // G1 รอบ 2: ลำดับตามคะแนน
    : `${BR_TH[b]} · ไม่มีเลขของเรา${fr[P.reason?.[b]] ? `\n   ${fr[P.reason[b]]}` : ''}`);

  const R = { self: { all: 'อ่านซ้ำทุกแผ่นอีกรอบ ยังอยู่ครบ', some: 'ยืนนิ่งอยู่นาน ไม่รู้ว่าควรดีใจกับแผ่นไหนก่อน', none: 'ไล่ซ้ำอีกรอบ แล้วอีกรอบ ตัวเลขก็ยังเหมือนเดิม' },

  if (e === 'ข' && how === 'wait') react = none ? 'หน้าจอโหลดครบแล้ว ไม่มีเลขของเราสักบรรทัด ลุกจากเก้าอี้ให้คนต่อคิว' : all ? 'โหลดครบทุกเหล่า เลขของเรายังอยู่ทุกแผ่น' : 'เลขของเราอยู่บนจอ แต่ไม่ครบทุกแผ่น';
  if (e === 'ค' && how === 'elder') react = { all: '{คน}หันกลับมา ยกนิ้วโป้งให้ก่อนจะพูดอะไร', some: '{คน}ชูนิ้วขึ้นมาไม่ครบมือ แล้วยิ้มให้', none: '{คน}วางโทรศัพท์ลงช้า ๆ แล้วถามว่าหิวไหม' }[sum];
  if (home) react = { all: `${ring} {คน}บอกในสายว่าเจอเลขของเราครบทุกแผ่น`, some: `${ring} {คน}อ่านเลขให้ฟังทีละแผ่น บางแผ่นก็เงียบไป`,
    none: `${ring} {คน}เงียบไปนานก่อนจะบอกว่าไม่เจอ` }[sum];
  // rival A/C lines wait for a rival system (owner 2026-11-06: rival* locked until then) · only the B lines + rare surname line
  const rl = [S.flags.has('cadet_prep_camp') ? (e === 'ค' ? 'ที่ติวส่งรูปป้ายเข้ากลุ่ม ชื่อลูกนายพลคนนั้นอยู่แถวบน' : 'ชื่อลูกนายพลคนนั้นอยู่แถวบน ครูพิเศษยืนถ่ายรูปป้ายให้') : e === 'ค' ? 'ในกลุ่มแชตมีคนส่งต่อกันว่า ลูกนายพลคนหนึ่งติดแถวบนทุกสนาม' : 'ได้ยินคนข้าง ๆ พูดถึงลูกนายพลที่ติดแถวบนทุกสนาม'];
  if (Math.random() < RARE_P) rl.push('คนข้าง ๆ ร้องเสียงหลง เพราะเห็นนามสกุลตัวเอง แต่ชื่อต้นไม่ใช่');
  if (home) { rl.length = 0; if (S.flags.has('cadet_prep_camp')) rl.push('{คน}เล่าในสายด้วยว่าชื่อลูกนายพลคนนั้นอยู่แถวบน'); }   // อยู่บ้าน ไม่เห็นป้าย ไม่มีคนข้าง ๆ
  const text = `${open[e] || open.ก}\n\n${block.join('\n')}\n\n${summary}\n${react}\n${rl.slice(0, 2).join(' ')}`.replaceAll('{คน}', kw);
  const last = S.age >= 18;
  const opts = none ? [

      : { label: 'ไล่ดูอีกรอบ เผื่อตาฝาด', fx: { happiness: -1 }, result: 'รอบที่สามช้ากว่ารอบแรก แต่ตัวเลขก็ยังเหมือนเดิม' },

      result: last ? 'จดบรรทัดเหตุไว้ ไม่ใช่เพื่อปีหน้า แต่เพื่อไม่ลืม' : 'จดบรรทัดเหตุไว้หลังบัตรสอบ ตัวหนังสือเล็กจนแทบอ่านไม่ออก' },
    secret ? { label: 'เก็บไว้คนเดียวก่อน', fx: { happiness: -1 }, result: 'บัตรสอบพับเก็บไว้ลึกสุดของกระเป๋า' }
      : home ? { label: `คุยกับ${kw}ต่อในสาย`, fx: { relations: 1 }, result: `${kw}บอกว่าไม่เป็นไร เดี๋ยวกลับถึงบ้านแล้วค่อยคุยกัน` }
      : how === 'elder' ? { label: `คุยกับ${kw}ตรง ๆ`, fx: { relations: 1 }, result: `${kw}จับไหล่ไว้ บอกว่าไม่เป็นไร กลับบ้านไปกินข้าวกันก่อน` }
      : { label: 'บอกที่บ้านเองก่อนใคร', fx: { relations: 1 }, result: 'ปลายทางเงียบไปนิดหนึ่ง แล้วบอกว่าไม่เป็นไร คืนนี้กินข้าวด้วยกัน' },
    home ? { label: 'วางสายแล้วนั่งเงียบ ๆ', result: secret ? 'นั่งอยู่ที่ศาลาจนมืด แล้วค่อยเดินกลับบ้านเหมือนไม่มีอะไร' : 'นั่งข้างโทรศัพท์อยู่อย่างนั้นจนมืด' }
      : { label: 'เดินออกมาเงียบ ๆ', result: 'เดินผ่านเสียงดีใจของคนอื่น ไม่หันกลับไปมอง' }]
  : [
    { label: 'ร้องออกมาดัง ๆ', fx: { happiness: 1 }, result: home ? (secret ? 'ร้องดังจนคนที่เดินผ่านศาลาหันมามอง' : 'ร้องดังจนหมาข้างบ้านเห่าตาม') : all ? 'เสียงดังจนคนแปลกหน้าหันมาปรบมือให้' : 'ร้องได้ครึ่งเสียง แล้วนึกถึงอีกแผ่น' },
    e === 'ก' ? { label: 'จดเลขลำดับใส่ฝ่ามือ', fx: { happiness: 1 }, result: 'หมึกปากกาซึมลงลายมือ ไม่ยอมล้างจนถึงเย็น' }
      : home ? { label: `จดเลขลำดับที่${kw}อ่านให้ฟัง`, fx: { happiness: 1 }, result: secret ? 'เขียนตัวโต ๆ ไว้หลังบัตรสอบ แล้ววงไว้สองรอบ' : 'เขียนตัวโต ๆ บนปฏิทินข้างโทรศัพท์ แล้ววงไว้สองรอบ' }
      : e === 'ข' ? { label: 'สั่งพิมพ์หน้านั้นเก็บไว้', hint: 'ได้กระดาษเก็บ แต่เสียค่าพิมพ์', fx: { happiness: 1, money: -0.4 }, result: 'กระดาษยังอุ่นจากเครื่องพิมพ์ พับใส่กระเป๋าเสื้อ' }
      : { label: 'แคปหน้าจอเก็บไว้', fx: { happiness: 1 }, result: 'รูปเดียวกันถูกแคปซ้ำสามรอบ กลัวมันหาย' },

      : { label: 'มองหาเลขของเพื่อนด้วย', fx: { relations: 1 }, merit: { help_others: 1 }, result: 'ไล่หาให้คนข้าง ๆ ที่หาไม่เจอ จนเขาเจอ' },

  if (none) S.p2.steps = [() => failedCard()];
  else S.p2.steps = [() => x3bCard(pass, fail), () => physAsk('phys'), () => nearExamCard(), () => bodyDayCard(), () => judgeBody(),

  // บล็อกคะแนน (B) แทนบรรทัดเกณฑ์ท้ายการ์ดเดิม
  return asCard({ id: none ? 'X3-N' : 'X3-P', title: 'ผลทุกสนาม', text: `${text}\n\n${P.branches.map(writtenScoreLine).join('\n')}`, options: opts });

// ---------- X3b · คนรอบตัวฉลอง (§7.4) · options = the 5 round-two prep ways of the old board ----------
function x3bCard(pass, fail) {
  // Q-N1 (owner 2026-11-06): แอบสอบ + ยุคหนังสือพิมพ์ + ติด → ป้าข้างบ้านถือหนังสือพิมพ์มาเคาะประตู ที่บ้านรู้ทันที
  let paperReveal = '';
  if (secretNow() && year() < WEB_YEAR) {
    // เกลี่ย S3 ข้อ 16: บรรทัดเชื่อม {คนในบ้าน} + ถ้าซ้อมคำพูดไว้ (X2w-W5)
    const home = ({ both: 'แม่', mother: 'แม่', fatherOnly: 'พ่อ' })[S.family] || 'ผู้ใหญ่ที่ดูแล';
    paperReveal = 'ป้าข้างบ้านถือหนังสือพิมพ์มาเคาะประตู ถามว่าชื่อในนี้ใช่ {ชื่อ} บ้านเราหรือเปล่า\n'
      + `${home}รับหนังสือพิมพ์มาอ่านอยู่นาน แล้วหันมามอง {ชื่อ} โดยยังไม่พูดอะไร`
      + (S.p2.rehearsed ? ' ประโยคที่ซ้อมกับกระจกไว้ ได้ใช้เร็วกว่าที่คิด' : '') + '\n';
    S.flags.delete('cadet_family_secret'); S.flags.add('cadet_family_told');
  }
  const secret = secretNow(), e = eraR(), poorFar = S.cls === 'poor' && examFar();
  // ข้อ 3.1 (Q-L2 · คงแก่นเดิม + คำพูดดีใจ) · แอบสอบที่บ้านยังไม่รู้ = ฉลองคนเดียวเหมือนเดิม
  const main = secret ? 'ที่บ้านยังไม่รู้ว่ามีอะไรให้ฉลอง {ชื่อ} ซื้อข้าวมันไก่ห่อหนึ่ง นั่งกินที่ศาลาริมทาง อิ่มกว่าทุกมื้อที่ผ่านมา'
    : JOY_WRITTEN[S.family] || JOY_WRITTEN.none;
  // ข้อ 4 ปากคน รอบละ 1 บรรทัด: บ้านรู้ = คนในบ้านพูดคะแนน · แอบสอบ + เพื่อนติว = เพื่อนพูดคะแนน
  const friend = S.flags.has('cadet_prep_group') || S.flags.has('cadet_bond_a');
  const mouth = !secret && !paperReveal ? writtenMouth(pass) : secret && friend ? friendScoreLine(pass) : '';
  // context ≤ 2 · order: some-pass → secret+friend → heir → friend → prep/senior → class/region → era → retry → rare grandma
  const L = [];
  if (fail.length) L.push('มีคนถามถึงเหล่าที่ไม่ผ่าน {ชื่อ} ตอบว่ายังมีอีกแผ่น');
  if (secret && S.p2.rehearsed) L.push('ประโยคที่ซ้อมกับกระจกไว้ ยังไม่ได้ใช้ แต่วันนี้ใกล้ขึ้นแล้ว');
  if (secret && (S.flags.has('cadet_bond_a') || S.flags.has('cadet_bond_c'))) L.push('เพื่อนที่สอบมาด้วยกันมานั่งข้าง ๆ เป็นคนเดียวที่รู้');
  if (!secret && S.heir === 'army') L.push('ลุงที่เคยรับราชการทหารโทรมา เล่าเรื่องรุ่นตัวเองยาวจนแบตหมด');
  if (!secret && S.heir === 'police') L.push('ญาติที่เป็นตำรวจแวะมาถึงบ้าน ถอดหมวกวางบนโต๊ะ แล้วบอกว่ารอบสองหนักกว่านี้');
  if (!secret && friend) L.push(friendWrittenLine());   // ข้อ 2 · เพื่อนติวในฉากประกาศผล
  if (S.flags.has('cadet_prep_camp')) { const sc = bestWritten(pass);   // ตำแหน่งบนป้ายตามคะแนน (ลำดับ = 20 + (25 − คะแนน) × 30)
    L.push(`ที่ติวขึ้นป้ายรายชื่อเด็กของตัวเองหน้าตึก ชื่อ {ชื่อ} อยู่${sc >= 21 ? 'แถวต้น ๆ' : sc >= 17 ? 'กลาง ๆ แผ่น' : 'ค่อนไปทางท้าย'}`); }
  if (S.flags.has('cadet_prep_senior') || S.flags.has('cadet_senior_tutor')) L.push('รุ่นพี่ส่งข้อความมาสั้น ๆ ว่า "ดีใจด้วยน้อง แต่พละโหดกว่านี้เยอะนะ ซ้อมไว้เลย"');
  // เกลี่ย S3 ข้อ 15/17/18: ร้านกาแฟนับในเพดาน 2 บรรทัด แทนที่บรรทัดฐานะ/ภาค · ใบ Q-N1 ไม่ใส่ (หนังสือพิมพ์ซ้ำในใบเดียว)
  const pc = paperReveal ? '' : paperCheer();
  if (pc) L.push(pc);
  else if (!secret) {   // ข้อ 3.1 บรรทัดเสริมตามฐานะ (เลือก 1) · บ้านต่างจังหวัดลำบาก ยุค ก–ข ยังเป็นเสียงตามสาย

    else L.push('ที่บ้านสั่งส้มตำกับไก่ย่างมากินกันหน้าบ้าน');
  }
  if (!secret) {
    if (e === 'ค') L.push(`รูปที่${({ fatherOnly: 'พ่อ', none: 'ญาติ' })[S.family] || 'แม่'}โพสต์มีคนกดถูกใจหลายร้อย ส่วนใหญ่ไม่เคยเจอหน้ากัน`);
    if (e === 'ข') L.push('โทรศัพท์บ้านดังทั้งเย็น ญาติต่างจังหวัดโทรมาทีละสาย');
  }
  if (S.flags.has('cadet_retry')) L.push('ปีนี้เดินผ่านซอยได้โดยไม่ต้องหลบหน้าใคร');
  const tail = !secret && Math.random() < RARE_P ? '\nยายถามเบา ๆ ว่าถ้าติดจริง ต้องไปอยู่ไกลบ้านกี่ปี' : '';
  const prep = (firstOk(P2().board) || {}).options || [{ label: 'ต่อ' }];
  if (pc && !L.slice(0, 2).includes(pc)) S.p2.paperCheered = false;   // ถูกตัดออกจากเพดาน = ยังไม่นับว่าออก
  return asCard({ id: 'X3b', title: 'เย็นวันประกาศผล', text: `${paperReveal}${main}\n${mouth ? mouth + '\n' : ''}${L.slice(0, 2).join('\n')}${tail}\n\nอีกไม่กี่วันจะสอบพลศึกษาและว่ายน้ำ`, options: prep });
}

// after passing the written round: sit the physical now, or wait a day and be asked again · 5 refusals = no-show fail (owner 2026-11-05)
const PHYS_ASK_MAX = 5;

  S.p2.askNs = S.p2.askNs || {};
  const n = S.p2.askNs[round] || 0, left = PHYS_ASK_MAX - n;
  const place = iv ? 'ห้องสัมภาษณ์' : 'สนามพลศึกษา';
  const text = n === 0
    ? (iv ? `ห้องสัมภาษณ์รอบสุดท้ายเปิดให้ผู้ผ่านพลศึกษาเข้าได้ภายใน ${PHYS_ASK_MAX} วัน ขอคิวได้วันไหนก็ได้ในช่วงนี้`
          : `สนามพลศึกษาเปิดให้ผู้ผ่านข้อเขียนเข้าสอบได้ภายใน ${PHYS_ASK_MAX} วัน ไปวันไหนก็ได้ในช่วงนี้\nดึงข้อ ลุกนั่ง วิ่ง แล้วว่ายน้ำ 50 เมตร`)
    : `ผ่านไปอีกวัน ${place}ยังเปิดอยู่ เหลืออีก ${left} วัน${left === 1 ? ' วันนี้เป็นวันสุดท้าย' : ''}`;
  return asCard({ id: iv ? 'X5c' : 'X3c', title: n === 0 ? `${place}เปิดแล้ว` : `${place} · เหลือ ${left} วัน`, text,
    options: iv ? [
      { label: 'ไปสอบสัมภาษณ์เลย', _phys: 'go', _round: round, result: 'ยื่นชื่อขอคิว ได้คิวสัมภาษณ์วันมะรืน' },
      { label: 'ยังไม่ไป ขอเตรียมตัวอีกวัน', _phys: 'wait', _round: round, result: left === 1 ? 'วันสุดท้ายผ่านไป ห้องสัมภาษณ์ปิดรับคิว' : 'ซ้อมพูดหน้ากระจกแล้วก็เลื่อนไปอีกวัน' }]
    : [
      { label: 'ไปสอบพรุ่งนี้', _phys: 'go', _round: round, result: 'วงวันพรุ่งนี้ไว้ในปฏิทิน เตรียมชุดกีฬาไว้ข้างเตียง' },
      { label: 'ขอพักอีกวัน ค่อยไป', _phys: 'wait', _round: round, result: left === 1 ? 'วันสุดท้ายผ่านไป สนามปิดประตูตอนห้าโมงเย็น' : ['นอนมองเพดาน บอกตัวเองว่าพรุ่งนี้ค่อยไป', 'ออกไปวิ่งเหยาะ ๆ แล้วกลับมานอนต่อ', 'หยิบรองเท้าวิ่งขึ้นมาดู แล้ววางลงที่เดิม'][n % 3] }] });
}
function noShowCard(round = 'phys') {

  const homeKnew = S.p2.how === 'elder' && !secretNow() ? '\nบ้านรู้ตั้งแต่หน้าป้าย' : '';
  return asCard(c, { id: c.id || 'X9', title: t(c.title), text: t(c.text) + homeKnew, options: (c.options || [{ label: 'ต่อ' }]).map(o => ({ ...o, label: t(o.label), result: t(o.result) })) });
}
function failedCard() {
  const list = [].concat(P2().failed || []);
  let c = list.find(x => S.age >= 18 ? (x.cond?.ageMin ?? x.ageMin ?? 0) >= 18 || /18/.test(x.id || '') : !((x.cond?.ageMin ?? x.ageMin ?? 0) >= 18) && !/18/.test(x.id || '')) || list[0]
    || { title: 'ไม่ติด', text: 'ปีนี้ยังไม่ติด', options: [{ label: 'ต่อ' }] };
  S.p2.steps = [() => endExamYear(), () => 'END'];
  const why = !S.p2.branches.some(b => S.p2.written[b])
    ? (c.reasonLines?.[S.p2.reason?.[S.p2.branches[0]]] || c.reasonLines?.written || '')
    : S.p2.failStage === 'noshow' ? 'ผ่านข้อเขียนแล้ว แต่ไม่ไปสอบพลศึกษาภายในกำหนด'
    : S.p2.failStage === 'injury' ? 'ผ่านข้อเขียนแล้ว แต่เจ็บก่อนวันสอบพละจนสอบไม่ไหว'
    : S.p2.failStage === 'noreport' ? 'สอบติดแล้ว แต่ไม่ไปรายงานตัวภายในกำหนด'
    : S.p2.failStage === 'interview' ? 'ผ่านพลศึกษาแล้ว แต่คะแนนสัมภาษณ์ยังไม่ถึงเกณฑ์'
    : S.p2.failStage === 'noshow_iv' ? 'ผ่านมาถึงรอบสุดท้ายแล้ว แต่ไม่ไปสัมภาษณ์ภายในกำหนด'
    : S.p2.physical === false ? (c.reasonLines?.[S.p2.failStage] || 'ตกรอบพลศึกษา') : (c.reasonLines?.medical || 'ตกตรวจร่างกาย');
  S.lastFail = !S.p2.branches.some(b => S.p2.written[b]) ? 'written' : S.p2.failStage || 'medical';
  S.everFailed = true;
  const nTh = ['', 'หนึ่ง', 'สอง', 'สาม'][S.tries || 1] || 'สาม';
  const retryRes = ({ written: 'ซื้อข้อสอบเก่าชุดใหม่มาอ่านตั้งแต่สัปดาห์แรก', land: 'เริ่มวิ่งตอนเช้าตั้งแต่วันจันทร์ถัดมา', injury: 'พักข้อเท้าให้หาย แล้วค่อยกลับไปวิ่ง',
    interview: 'ซ้อมตอบคำถามหน้ากระจกทุกคืน', noshow: 'บอกตัวเองว่าปีหน้าจะไม่หนีอีก', noshow_iv: 'บอกตัวเองว่าปีหน้าจะไม่หนีอีก', noreport: 'บอกตัวเองว่าปีหน้าจะไม่หนีอีก' })[S.lastFail];
  c = { ...c, options: (c.options || []).map(o => ({ ...o,
    label: (o.label || '').replaceAll('ทั้งสามใบ', `ทั้ง${nTh}ใบ`), hint: o.hint ? o.hint.replaceAll('สามปี', `${nTh}ปี`) : o.hint,
    result: o.label === 'สอบใหม่ แก้จุดที่พลาด' && retryRes ? retryRes : o.result })) };
  const unsaid = S.p2.rehearsed && secretNow() ? '\nประโยคที่ซ้อมไว้ ไม่ได้ใช้' : '';   // X2w-W5 → X10 (announce brief §7.1)
  // ข้อ 4 ปากคน (บ้านรู้ · ยังมีปีหน้า): ตัวสำรอง = แม่ · ตกความรู้ = พ่อ · ตัวเลขจาก S.p2.ranks / S.p2.know
  let mouth = '';
  if (!secretNow() && S.age < 18) {
    const res = Object.values(S.p2.ranks || {}).filter(x => x.kind === 'reserve').sort((a, b) => a.reserveNo - b.reserveNo)[0];
    const kb = S.p2.branches.find(b => !S.p2.written[b] && (S.p2.scores[b] || 0) >= WRITTEN_MIN && (S.p2.know?.[b] ?? S.stats.knowledge) < KNOW_MIN);
    const [mom, kid] = momVoice();
    if (res) mouth = `\n${mom}บอกว่า "ขาดไป${numTh(res.reserveNo)}ที่เองนะ{ถิ่น}${kid} ปีหน้าเอาใหม่"`;
    else if (kb && !S.p2.branches.some(b => S.p2.written[b])) mouth = `\n${hasFather() ? 'พ่อ' : elder()}บอกว่า "ขาดอีก${numTh(KNOW_MIN - (S.p2.know?.[kb] ?? S.stats.knowledge))}คะแนนเอง ปีหน้าอ่านเพิ่มอีกหน่อยก็ได้แล้ว{ถิ่น}"`;
  }
  const stayedHome = ['noreport', 'noshow', 'noshow_iv'].includes(S.p2.failStage);   // ไม่ได้ออกไปไหน ไม่มีทางกลับบ้าน
  return asCard(c, { id: c.id || 'X10', text: (c.text || '').replaceAll('ทางกลับบ้านวันนั้นยาวกว่าขามา', stayedHome ? 'วันนั้นทั้งวันไม่ได้ออกจากบ้าน' : 'ทางกลับบ้านวันนั้นยาวกว่าขามา').replaceAll('{เหตุ}', why).replaceAll('{สถานี}', 'รอบพลศึกษา เพราะร่างกายยังไม่ถึงเกณฑ์ของเหล่าที่สมัคร') + unsaid + mouth });
}
function endExamYear() {
  S.p2 = null;
  // still in the race next year unless he let it go (failed card options set cadet_let_go / clear cadet_dream)
  if (S.age < 18 && !S.flags.has('cadet_let_go')) S.flags.add('cadet_dream');
  if (S.age >= 18) { finish(`หมดสิทธิ์สอบตามอายุแล้ว (สอบไป ${S.tries || 1} ครั้ง) · ด่านจบ ม.6/ปวช. ที่พักไว้เดินต่อ ไปทางมหาวิทยาลัยหรือสายอื่นตามเกมเดิม`); return 'END'; }
  S.flags.delete('cadet_exam_door');
  S.age++;
  beginYear();
  return 'END';
}

function p2Next() {
  while (S.p2 && S.p2.steps.length) {
    const r = S.p2.steps.shift()();
    if (r === 'END') return;
    if (r) return show(r);
  }
  if (S.p2) { S.p2 = null; finish('จบสนามสอบ'); }
}

function finish(msg) {
  S.ended = true;
  stage.innerHTML = `<div class="badges"><span class="badge age">อายุ ${S.age}</span></div>
    <h2>จบเดโม</h2><p class="text">${msg}</p>
    <button class="primary" id="again">เล่นใหม่</button>`;
  $('#again').onclick = setup;
  renderSide();
}

function renderSide() {
  if (!S) { side.innerHTML = `<h3>ข้อมูลใน demo</h3><p class="warn">โหลดเหตุการณ์ ${EVENTS.length} ใบ</p>`; return; }
  side.innerHTML = `
    <h3>${titledName()} · ${S.sex} · ${S.region}</h3>${S.title ? '<p class="hint">นักเรียนเตรียมทหาร</p>' : ''}
    ${STATS.map(([k, l]) => k === 'money'
      ? `<div class="stat"><span>${l}</span><span>${'฿'.repeat(Math.min(S.stats.money, 10)) || '—'}</span><span>${S.stats.money}</span></div>`
      : `<div class="stat"><span>${l}</span><div class="bar"><i style="width:${S.stats[k]}%"></i></div><span>${S.stats[k]}</span></div>`).join('')}
    <h3>ธง</h3><div class="flags">${[...S.flags].map(f => `<span>${f}</span>`).join('') || '<span>—</span>'}</div>
    <h3>บันทึก</h3><ol class="log">${S.log.slice(-40).map(l => `<li>${l}</li>`).join('')}</ol>`;
}

window.__demoState = () => S;   // test hook only
window.__demoAnnounce = { x2wCard, x3aCard, x3Card, x3bCard, applyForm, finalBoard, bodyBoard, cheerCard, failedCard, arriveCard, announceCard, bodyWaitCard, declinedCard, declineNextYear, returnInviteCard, packNotice, reportAsk, show, fill };   // test hook only (announce scenes · apply form · voice pass)
setup();
})();
</script>
