# ลูกไม่ใช่ลูกผิดรูป: ค่าไม่ใช่ object · คีย์แปลก · age ผิดช่วง
events:
  - id: bad_case_01
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    when: {child_not_mine: true}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
  - id: bad_case_02
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    when: {child_not_mine: {far: true}}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
  - id: bad_case_03
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    when: {child_not_mine: {age: [40, 20]}}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
