# ผลครอบครัวผิดรูป: op สองอย่างในตัวเดียว · add บทบาทที่เพิ่มไม่ได้ · n เกิน · leave คนที่ไม่ใช่คู่ — เพิ่มลูกแฝด/คู่แยกทาง/คนในบ้านจากไปยังผ่าน
events:
  - id: bad_case_01
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", family: [{add: child, die: spouse}], merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", family: [{add: parent}], merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", family: [{add: child, n: 5}], merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", family: [{leave: child}], merit: [{cat: neutral}]}
  - id: ok_case_01
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", family: [{add: child, n: 2}], merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", family: [{leave: spouse}], merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", family: [{die: parent}], merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
  # B36a2: สัตว์ไม่มีอายุขัย · bond ไม่มีค่า d · d ลอยไม่มี bond · ชนิดสัตว์ติดบทบาทคน — รับสัตว์ครบรูป/เพื่อนรุ่น/bond ขึ้นลงยังผ่าน
  - id: bad_case_02
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", family: [{add: pet, kind: หมา}], merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", family: [{bond: child, d: 0}], merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", family: [{die: child, d: 5}], merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", family: [{add: child, kind: หมา}], merit: [{cat: neutral}]}
  - id: ok_case_02
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", family: [{add: pet, kind: หมา, life: [10, 15], name: ดำ}], merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", family: [{add: peer}], merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", family: [{bond: all, d: 5}, {bond: spouse, d: -10}], merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", family: [{bond: parent, d: 3}], merit: [{cat: neutral}]}
  # B110 ชิ้น 3: สาเหตุที่การ์ดเล่า — self_harm สั่งไม่ได้ · ฝูงไม่มีสาเหตุ · สัตว์ใช้สาเหตุคน · คีย์สะกดผิด — เมาแล้วขับชน (road) · สัตว์ป่วย ยังผ่าน
  - id: bad_case_03
    type: A
    stage: ทำงาน
