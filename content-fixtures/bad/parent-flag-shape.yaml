# รูป parent_flags ผิด: ธงเดียวกันทั้ง has และ not · has ไม่ใช่รายการ · ไม่มีทั้ง has และ not · ธงมีพารามิเตอร์ · ตัวคูณ 0 · ใช้ในฉากระหว่างชาติ
events:
  - id: bad_case_both
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    weight: 1
    when: {parent_flags: {has: [smoker], not: [smoker]}}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
