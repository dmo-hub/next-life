# ช่วงป่วยของตัวเองผิดรูป: โรคที่ไม่มีช่วงป่วย (อุบัติเหตุ) · left เกินปีนัด · คีย์แปลก — โรคเรื้อรัง/ปีสุดท้ายยังผ่าน
events:
  - id: bad_case_01
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    when: {illness: {causes: [road]}}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
  - id: bad_case_02
    type: A
    stage: ทำงาน
    years: [2500, 2650]
    when: {illness: {left: [0, 5]}}
    text: "ข้อความการ์ด"
    choices:
      - {text: "ทางที่หนึ่ง", merit: [{cat: neutral}]}
      - {text: "ทางที่สอง", merit: [{cat: neutral}]}
      - {text: "ทางที่สาม", merit: [{cat: neutral}]}
      - {text: "ทางที่สี่", merit: [{cat: neutral}]}
