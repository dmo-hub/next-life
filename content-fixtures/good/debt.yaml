# กู้ได้ทุกชนิดที่เปิด · ชนิดที่มีปีเริ่มประกาศ systems + ปีไม่ก่อนระบบ
events:
  - id: good_debt_home
    type: A
    category: work_money
    stage: ทำงาน
    years: [2540, 2650]
    text: "ธนาคารเสนอสินเชื่อบ้าน"
