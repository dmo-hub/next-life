# สายเรื่องตัวอย่าง 2 สายของ harness/arcs.mjs (krung-1) — อยู่นอก content/ จึงไม่เข้าเกม
# น้ำหนักกองสูงและ repeat ถี่กว่าเนื้อจริงมาก ให้ตัวคุมได้กั้นจริงทุกทาง: กองสุ่ม · นัดชนปีเว้น · เรื่องต่อข้ามสาย · เรื่องต่อสายเดียวกัน · ปิดสาย
events:
  - id: fx_friend_meet
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    weight: 30
    repeat: {gap: 1, max: 8}
    arc: fx_friend
    text: "เพื่อนสมัยเรียนโทรมาชวนเจอกัน"
    choices:
      - text: "นัดกินข้าวกันอีกที"
        schedules: [{event: fx_friend_call, after_years: [1, 2]}]
        merit: [{cat: neutral}]
      - text: "ชวนไปเที่ยวด้วยกัน"
        outcomes:
          - {weight: 1, text: "ไปเจอคู่แข่งสมัยเรียนที่นั่นพอดี", next: fx_rival_clash, merit: [{cat: neutral}]}
          - {weight: 1, text: "เที่ยวสนุกจนไม่อยากกลับ", next: fx_friend_more, merit: [{cat: neutral}]}
        merit: [{cat: neutral}]
      - {text: "บอกว่าคงไม่ได้เจอกันอีกนาน", arc_end: true, merit: [{cat: neutral}]}
      - text: "ชวนคู่แข่งเก่ามาด้วย"
        schedules: [{event: fx_rival_clash, after_years: [0, 1]}]
        merit: [{cat: neutral}]
  - id: fx_friend_more
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    arc: fx_friend
    text: "เพื่อนชวนอยู่ต่ออีกสองวัน"
    choices:
      - {text: "อยู่ต่อ", merit: [{cat: neutral}]}
      - {text: "กลับก่อน", merit: [{cat: neutral}]}
      - {text: "ชวนเพื่อนกลับบ้านด้วย", merit: [{cat: neutral}]}
      - {text: "ไม่ตอบ", merit: [{cat: neutral}]}
  - id: fx_friend_call
    type: A
    category: family
    stage: ทำงาน
    years: [2500, 2650]
    arc: fx_friend
    text: "เพื่อนคนเดิมโทรมาตามนัดกินข้าว"
    choices:
      - {text: "ไปตามนัด", merit: [{cat: neutral}]}
      - {text: "ขอเลื่อน", merit: [{cat: neutral}]}
      - {text: "ชวนไปบ้าน", merit: [{cat: neutral}]}
      - {text: "ไม่รับสาย", merit: [{cat: neutral}]}
  - id: fx_rival_meet
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    weight: 30
    repeat: {gap: 1, max: 8}
    arc: fx_rival
    text: "คู่แข่งสมัยเรียนมาทำงานบริษัทเดียวกัน"
    choices:
      - text: "ท้าแข่งยอดขาย"
        schedules: [{event: fx_rival_clash, after_years: [1, 3]}]
        merit: [{cat: neutral}]
      - {text: "ยื่นมือขอเป็นเพื่อน", arc_end: true, merit: [{cat: neutral}]}
      - {text: "ทำเป็นไม่รู้จัก", merit: [{cat: neutral}]}
      - {text: "ขอย้ายแผนก", merit: [{cat: neutral}]}
  - id: fx_rival_clash
    type: A
    category: work_money
    stage: ทำงาน
    years: [2500, 2650]
    arc: fx_rival
    text: "คู่แข่งคนเดิมมาขวางงานของคุณอีกแล้ว"
    choices:
      - {text: "สู้ตรง ๆ", merit: [{cat: neutral}]}
      - {text: "ถอยก่อน", merit: [{cat: neutral}]}
      - {text: "ขอให้หัวหน้าตัดสิน", merit: [{cat: neutral}]}
      - {text: "ชวนคุยกันดี ๆ", merit: [{cat: neutral}]}
